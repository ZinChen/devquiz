slug: go-concurrency-basic-1
title: "Go: горутины, каналы и синхронизация"
description: "Основы многозадачности в Go для тех, кто пришёл из Ruby: горутины против потоков, гонки, каналы, мьютексы, ограничение параллелизма, errgroup, утечки горутин, отмена через context. База — Go 1.22+; отдельные вопросы про Go 1.23 и 1.25 помечены в тексте."
tags: [go, backend]
difficulty: basic
estimated_time: 35

questions:

  - id: q1
    text: "Почему сервис спокойно держит сто тысяч горутин, а сто тысяч потоков ОС, скорее всего, исчерпали бы память?"
    type: single
    options:
      - id: a
        text: "Поток ОС всегда резервирует под стек ровно 1 ГБ"
        correct: false
        explanation: "1 ГБ — это потолок стека горутины на 64-битных системах. Поток ОС обычно резервирует около 8 МБ."
      - id: b
        text: "Стек горутины начинается с пары килобайт и растёт по мере нужды"
        correct: true
        explanation: "Стек в 2 КБ при старте растёт копированием, только когда функции действительно нужна глубина."
      - id: c
        text: "Рантайм хранит горутины в куче и сжимает их при сборке мусора"
        correct: false
        explanation: "Сборщик мусора стеки горутин не сжимает, он только сканирует их в поиске указателей."
      - id: d
        text: "Горутины выполняются по очереди и обходятся без собственного стека"
        correct: false
        explanation: "Стек есть у каждой горутины: на нём лежат локальные переменные и цепочка вызовов."
    explanation: "Горутина — функция, запущенная оператором `go f()`: планировщик Go сам решает, когда и на каком потоке её исполнять, отдельный поток ОС под каждую не создаётся. Горутина стартует со стеком в 2 КБ и наращивает его по мере нужды, а поток ОС резервирует мегабайты под стек и тянет за собой структуры ядра. Переключение горутин происходит в пространстве пользователя, без системного вызова."
    extended_explanation: "Предел стека горутины на 64-битных системах — 1 ГБ, при превышении процесс падает с `fatal error: stack overflow`. Число живых горутин показывает `runtime.NumGoroutine()`, а утечки видны в профиле `/debug/pprof/goroutine`."
    recommendation: "Устройство горутин: растущий стек, переключение в пространстве пользователя и стоимость по сравнению с потоками ОС."
    difficulty: easy
    topics: [go, concurrency]

  - id: q2
    text: "Rails-приложение запускают в Puma с несколькими воркер-процессами, чтобы занять все ядра. Почему Go-сервису такой кластер процессов обычно не нужен?"
    type: single
    options:
      - id: a
        text: "В Go тоже есть GVL, но на время ввода-вывода он снимается"
        correct: false
        explanation: "Так устроен GVL в CRuby. В Go подобной блокировки нет вовсе."
      - id: b
        text: "Компилятор Go сам распараллеливает циклы по ядрам"
        correct: false
        explanation: "Автоматического распараллеливания циклов компилятор не делает, параллельность задаётся горутинами явно."
      - id: c
        text: "Рантайм Go сам форкает процесс под каждое ядро при старте"
        correct: false
        explanation: "Go-программа работает одним процессом, форк воркеров — модель Puma и Unicorn."
      - id: d
        text: "Горутины одного процесса работают на всех ядрах"
        correct: true
        explanation: "Глобальной блокировки интерпретатора в Go нет, планировщик раскладывает горутины по потокам на всех ядрах."
    explanation: "GVL — глобальная блокировка CRuby: она не даёт двум потокам одного процесса одновременно исполнять Ruby-код. `GOMAXPROCS` в Go — максимум потоков ОС, которые одновременно исполняют Go-код. В CRuby потоки одного процесса упираются в GVL, поэтому ядра занимают отдельными процессами. В Go глобальной блокировки нет: горутины одного процесса выполняются на `GOMAXPROCS` потоках, по умолчанию по числу ядер."
    extended_explanation: "С Go 1.25 значение `GOMAXPROCS` по умолчанию учитывает лимит CPU контейнера. Несколько экземпляров сервиса всё равно запускают, но ради отказоустойчивости и выкатки без простоя, не ради ядер."
    recommendation: "Модель исполнения Go против GVL в CRuby: что даёт один процесс на все ядра."
    difficulty: easy
    topics: [go, concurrency]

  - id: q3
    text: "Программу запустили с `GOMAXPROCS=1`, внутри работают сотни горутин. Как это описать?"
    type: single
    options:
      - id: a
        text: "Ни конкурентности, ни параллелизма"
        correct: false
        explanation: "Сотни независимых горутин и есть конкурентная программа, даже если ядро одно."
      - id: b
        text: "И конкурентность, и параллелизм"
        correct: false
        explanation: "Для параллелизма нужно больше одного потока с Go-кодом, а лимит здесь равен единице."
      - id: c
        text: "Параллелизм без конкурентности"
        correct: false
        explanation: "Параллелизм требует нескольких одновременно исполняемых потоков, а `GOMAXPROCS=1` даёт ровно один."
      - id: d
        text: "Конкурентность без параллелизма"
        correct: true
        explanation: "Горутины чередуются на одном потоке, исполняющем Go-код, одновременно на нескольких ядрах они не работают."
    explanation: "Переменная окружения `GOMAXPROCS=1` разрешает одновременно исполнять Go-код только одному потоку. Конкурентность — свойство структуры программы: она состоит из независимо выполняемых задач. Параллелизм — одновременное выполнение на нескольких ядрах. С `GOMAXPROCS=1` горутины чередуются, но Go-код в каждый момент исполняет один поток."
    extended_explanation: "Формулировка Роба Пайка: «Concurrency is about dealing with lots of things at once. Parallelism is about doing lots of things at once». Потоков ОС при этом бывает больше одного: `GOMAXPROCS` ограничивает только потоки с Go-кодом, а ждущие системного вызова в лимит не входят."
    recommendation: "Доклад Роба Пайка «Concurrency is not Parallelism» и его разбор на go.dev."
    difficulty: easy
    topics: [go, concurrency]

  - id: q4
    text: |-
      Что напечатает программа?

      ```go
      func printNumber(n int) {
          time.Sleep(10 * time.Millisecond)
          fmt.Println(n)
      }

      func main() {
          for i := 1; i <= 10; i++ {
              go printNumber(i)
          }
      }
      ```
    type: single
    options:
      - id: a
        text: "Числа от 1 до 10, но в случайном порядке"
        correct: false
        explanation: "Так было бы при ожидании горутин. Здесь `main` выходит раньше, чем истечёт `Sleep`."
      - id: b
        text: "Числа от 1 до 10 строго по порядку"
        correct: false
        explanation: "Порядок горутин не гарантирован, а здесь они вдобавок не успевают отработать."
      - id: c
        text: "Скорее всего ничего: `main` не ждёт горутин"
        correct: true
        explanation: "Возврат из `main` завершает процесс, запущенные горутины никто не ждёт."
      - id: d
        text: "Ошибку о незавершённых горутинах при выходе из `main`"
        correct: false
        explanation: "Рантайм не проверяет, остались ли живые горутины, процесс просто завершается."
    explanation: "Оператор `go printNumber(i)` запускает функцию в новой горутине и сразу возвращает управление, а `main` — главная горутина: когда она завершается, процесс завершается вместе со всеми остальными. `time.Sleep` приостанавливает горутину на заданное время. `sync.WaitGroup` — счётчик ожидания: `Add(n)` увеличивает его, `Done()` уменьшает на единицу, `Wait()` блокирует, пока он не дойдёт до нуля. Программа живёт, пока работает `main`. Цикл запускает десять горутин и сразу выходит, а горутины ещё спят в `Sleep` и до печати не доходят. Нужна синхронизация: `sync.WaitGroup` или канал."
    extended_explanation: "`time.Sleep` в конце `main` чинит пример лишь на глаз: на нагруженной машине горутины могут не успеть. Без `WaitGroup` ждут через канал: каждая горутина отправляет значение в `done`, а `main` читает из него десять раз."
    recommendation: "Синхронизация завершения горутин: sync.WaitGroup и каналы как сигналы готовности."
    difficulty: medium
    topics: [go, concurrency]

  - id: q5
    text: |-
      Код иногда печатает все десять чисел, а иногда ни одного. В чём ошибка?

      ```go
      var wg sync.WaitGroup
      for i := 1; i <= 10; i++ {
          go func() {
              wg.Add(1)
              defer wg.Done()
              printNumber(i)
          }()
      }
      wg.Wait()
      ```
    type: single
    options:
      - id: a
        text: "`Wait` нельзя вызывать в функции, которая запускает горутины"
        correct: false
        explanation: "Так `WaitGroup` и используют: запускают горутины и ждут их в той же функции."
      - id: b
        text: "`WaitGroup` нужно передавать в горутину по значению"
        correct: false
        explanation: "Копия `WaitGroup` как раз ломает ожидание: `Done` уменьшит счётчик копии."
      - id: c
        text: "`Done` в `defer` вызовется дважды, счётчик уйдёт в минус"
        correct: false
        explanation: "`Defer` выполняется один раз на вызов функции, `Done` здесь парный к `Add`."
      - id: d
        text: "`Wait` может вернуться раньше, чем горутины вызовут `Add`"
        correct: true
        explanation: "Пока ни одна горутина не стартовала, счётчик равен нулю, и `Wait` сразу пропускает `main` дальше."
    explanation: "Напоминание: `Add(1)` увеличивает счётчик `WaitGroup`, `Done()` уменьшает его, `Wait()` ждёт нуля, а `defer` откладывает вызов до выхода из функции. `Add` должен выполниться до оператора `go`. Иначе `main` может дойти до `Wait`, когда счётчик ещё нулевой, и выйти, не дождавшись ни одной горутины. Результат зависит от того, как быстро планировщик их запустит."
    extended_explanation: "С Go 1.25 есть `wg.Go(func() { ... })`, который сам делает `Add` и `Done`. Свежий `go vet` ловит эту ошибку анализатором `waitgroup: WaitGroup.Add called from inside new goroutine`. Правильный порядок:\n\n```go\nvar wg sync.WaitGroup\nfor i := 1; i <= 10; i++ {\n    wg.Add(1) // до оператора go\n    go func(num int) { // i передаётся параметром: горутина получает своё значение\n        defer wg.Done()\n        printNumber(num)\n    }(i)\n}\nwg.Wait()\n```"
    recommendation: "Документация sync.WaitGroup: порядок вызовов Add, Done и Wait, а также метод WaitGroup.Go."
    difficulty: medium
    topics: [go, concurrency]

  - id: q6
    text: |-
      Как меняется вывод, когда в `go.mod` модуля версия `go` поднимается с 1.21 до 1.22?

      ```go
      var wg sync.WaitGroup
      for i := 1; i <= 3; i++ {
          wg.Add(1)
          go func() {
              defer wg.Done()
              fmt.Print(i)
          }()
      }
      wg.Wait()
      ```
    type: single
    options:
      - id: a
        text: "До 1.22 код не компилировался, с 1.22 выводит 123"
        correct: false
        explanation: "Захват переменной цикла всегда компилировался, менялась только её семантика."
      - id: b
        text: "До 1.22 цифры в любом порядке, с 1.22 строго 123"
        correct: false
        explanation: "Версия 1.22 поменяла область видимости переменной, порядок выполнения горутин она не задаёт."
      - id: c
        text: "До 1.22 обычно 444, с 1.22 цифры 1, 2, 3 в любом порядке"
        correct: true
        explanation: "С 1.22 у каждой итерации своя переменная `i`, раньше она была одна на весь цикл."
      - id: d
        text: "Ничего не меняется: в обеих версиях 123 по порядку"
        correct: false
        explanation: "Порядок горутин не гарантирован ни в одной версии, а до 1.22 значения ещё и совпадали."
    explanation: "Запись `go func()` { ... }() запускает в горутине анонимную функцию (замыкание): она обращается к переменной `i` из внешнего кода, а не получает копию значения. До Go 1.22 переменная цикла была одна, и замыкания видели её последнее значение: горутины обычно стартуют после цикла и печатают 4. С 1.22 каждая итерация получает свою копию, а порядок вывода зависит от планировщика."
    extended_explanation: "Решает строка `go` в `go.mod` модуля, а не версия компилятора: Go 1.27 с `go` 1.21 в `go.mod` выведет 444. Для таких модулей `go vet` пишет `loop variable i captured by func literal`. Старое лечение — `i := i` в теле цикла или передача аргументом `go func(n int)` { ... }(`i`)."
    recommendation: "Заметка «Fixing For Loops in Go 1.22» на go.dev о новой семантике переменной цикла."
    difficulty: medium
    topics: [go, concurrency]

  - id: q7
    text: "Нужно обработать 100 задач так, чтобы одновременно выполнялось не больше пяти. Что из перечисленного это обеспечит?"
    type: single
    options:
      - id: a
        text: "Вызов `runtime.GOMAXPROCS(5)` перед запуском горутин"
        correct: false
        explanation: "`GOMAXPROCS` ограничивает потоки, исполняющие Go-код. Горутины, ждущие сеть или таймер, лимит не занимают и выполняются все сразу."
      - id: b
        text: "Канал результатов `make(chan int, 5)` для ответов задач"
        correct: false
        explanation: "Буфер канала результатов задерживает отправку ответов, но запуск задач не ограничивает."
      - id: c
        text: "`WaitGroup` с начальным счётчиком `wg.Add(5)`"
        correct: false
        explanation: "`WaitGroup` только ждёт завершения и ничего не ограничивает, а счётчик 5 при 100 задачах ещё и сломает ожидание."
      - id: d
        text: "Буферизованный канал на пять мест как семафор"
        correct: true
        explanation: "Перед задачей горутина кладёт значение в канал, после неё забирает. Шестая ждёт, пока освободится место."
    explanation: "Выражение `make(chan struct{}, 5)` создаёт канал с буфером на пять значений: отправка проходит сразу, пока в буфере есть место, и ждёт, когда оно кончилось. `struct`{}{} — пустое значение, не занимающее памяти: здесь важно само наличие записи в буфере, а не её содержимое. Буферизованный канал ёмкостью 5 работает как семафор: `sem <- struct`{}{} перед задачей и <-`sem` после неё. Шестая отправка блокируется, пока одна из пяти задач не освободит место."
    extended_explanation: "Альтернативы: пул из пяти воркеров, читающих задачи из общего канала, и `errgroup.SetLimit(5)` из `golang.org/x/sync`, который вдобавок собирает первую ошибку и отменяет остальные через контекст. Рабочий пример ограничения до пяти:\n\n```go\nsem := make(chan struct{}, 5)\nvar wg sync.WaitGroup\nfor i := 1; i <= 100; i++ {\n    wg.Add(1)\n    sem <- struct{}{} // займёт место, на шестой задаче ждёт\n    go func(num int) { // i передаётся параметром: горутина получает своё значение\n        defer wg.Done()\n        defer func() { <-sem }() // освободит место\n        printNumber(num)\n    }(i)\n}\nwg.Wait()\n```"
    recommendation: "Шаблоны ограничения параллелизма в Go: семафор на канале, пул воркеров, errgroup.SetLimit."
    difficulty: medium
    topics: [go, concurrency]

  - id: q8
    text: "Нужно выполнить 100 запросов к соседним сервисам, не больше 10 одновременно, и отменить остальные при первой ошибке. Что из перечисленного это даёт?"
    type: single
    options:
      - id: a
        text: "`errgroup.WithContext` и `g.SetLimit(10)`"
        correct: true
        explanation: "Группа ограничивает число активных задач, возвращает первую ошибку и отменяет общий контекст."
      - id: b
        text: "`sync.WaitGroup` с методом `SetLimit(10)`"
        correct: false
        explanation: "У `WaitGroup` метода `SetLimit` нет, он есть только у `errgroup.Group` из `golang.org/x/sync`."
      - id: c
        text: "Буферизованный канал на 10 мест вместе с `WaitGroup`"
        correct: false
        explanation: "Канал ограничит число одновременных задач, но первую ошибку не соберёт и остальные задачи не отменит."
      - id: d
        text: "`runtime.GOMAXPROCS(10)` и `WaitGroup`"
        correct: false
        explanation: "`GOMAXPROCS` ограничивает потоки с Go-кодом, а ждущие сеть горутины в лимит не входят."
    explanation: "Пакет `golang.org/x/sync/errgroup` даёт группу горутин: `g.Go(func() error {...})` запускает задачу, `g.Wait()` ждёт всех и возвращает первую ненулевую ошибку. `errgroup.WithContext` создаёт контекст, который отменяется при первой ошибке, а `g.SetLimit(n)` ограничивает число одновременно работающих задач: вызов `g.Go` блокируется, пока не освободится место."
    extended_explanation: "Остальные задачи останавливаются только если сами смотрят на `ctx`: отмена кооперативная. Пакет внешний (`golang.org/x/sync`), в стандартную библиотеку он не входит. Пример:\n\n```go\ng, ctx := errgroup.WithContext(ctx)\ng.SetLimit(10)\nfor _, id := range ids {\n    g.Go(func() error {\n        return fetch(ctx, id)\n    })\n}\nif err := g.Wait(); err != nil {\n    return err\n}\n```"
    recommendation: "Пакет errgroup: WithContext, SetLimit и семантика первой ошибки; документация golang.org/x/sync/errgroup."
    difficulty: medium
    topics: [go, concurrency]

  - id: q9
    text: |-
      Горутины пишут результаты в заранее выделенный срез, каждая в свой индекс. Есть ли гонка данных и что выведет программа (Go 1.22+)?

      ```go
      out := make([]int, 10)
      var wg sync.WaitGroup
      for i := range out {
          wg.Add(1)
          go func() {
              defer wg.Done()
              out[i] = i * i
          }()
      }
      wg.Wait()
      fmt.Println(out)
      ```
    type: single
    options:
      - id: a
        text: "Гонка есть, запись в один срез из разных горутин всегда небезопасна"
        correct: false
        explanation: "Небезопасна запись в один и тот же элемент или изменение самого среза через `append`, а разные индексы не пересекаются."
      - id: b
        text: "Гонки нет, выведется `[0 1 4 9 16 25 36 49 64 81]`"
        correct: true
        explanation: "Горутины пишут в разные ячейки памяти, а `Wait` гарантирует, что к чтению все записи завершены."
      - id: c
        text: "Гонки нет, но порядок значений в `out` случайный"
        correct: false
        explanation: "Порядок определяется индексами: значение с индексом `i` всегда лежит на своём месте."
      - id: d
        text: "Гонка есть, потому что `Wait` не гарантирует видимость записей"
        correct: false
        explanation: "`Wait` устанавливает отношение happens-before: после его возврата все записи завершённых горутин видны."
    explanation: "Каждая горутина пишет в свой элемент заранее выделенного среза: ячейки памяти не пересекаются, поэтому конфликта нет. Заголовок среза (длина, указатель) никто не меняет. `wg.Wait()` заодно гарантирует, что к моменту чтения все записи видны."
    extended_explanation: "Гонкой стал бы `append` к общему срезу из горутин: он меняет заголовок и может перераспределить массив. Тогда результат собирают через канал или под мьютексом. Для кода до Go 1.22 индекс нужно было передавать параметром, иначе все горутины видели бы одну общую переменную цикла."
    recommendation: "Правила безопасного доступа к срезам из горутин и модель памяти Go: отношение happens-before у WaitGroup."
    difficulty: hard
    topics: [go, concurrency]

  - id: q10
    text: "1000 горутин выполняют `counter++` над общей переменной, `main` дожидается всех через `WaitGroup`. Итог часто меньше 1000. Почему?"
    type: single
    options:
      - id: a
        text: "Часть горутин не стартует, если их больше `GOMAXPROCS`"
        correct: false
        explanation: "Горутин может быть сколько угодно больше `GOMAXPROCS`, они просто ждут своей очереди."
      - id: b
        text: "Планировщик отбрасывает горутины, не успевшие стартовать"
        correct: false
        explanation: "Запущенная горутина обязательно выполнится, если процесс не завершится раньше."
      - id: c
        text: "`WaitGroup` отпускает `main` раньше, чем горутины закончатся"
        correct: false
        explanation: "При правильном `Add` до запуска `Wait` дожидается всех горутин, потери не отсюда."
      - id: d
        text: "`counter++` — это три шага, и они перемежаются"
        correct: true
        explanation: "Две горутины читают одно и то же значение, обе прибавляют единицу, и одно обновление теряется."
    explanation: "Гонка данных (data race) — это когда несколько горутин одновременно обращаются к одной переменной без синхронизации, и хотя бы одна из них пишет. `counter++` — не одна операция, а чтение, сложение и запись. Горутины перемежают эти шаги, и обновления теряются. Лечится `sync.Mutex`, `atomic.Int64` или горутиной-владельцем счётчика, которая получает команды через канал."
    extended_explanation: "`go test -race` или `go run -race` покажет `WARNING: DATA RACE` со стеками обеих сторон. Детектору нужен `cgo`: в образе alpine без `gcc` флаг завершится сообщением `-race requires cgo`. Два способа исправить:\n\n```go\nvar mu sync.Mutex\nmu.Lock() // занять: остальные ждут\ncounter++\nmu.Unlock() // освободить\n\n// или атомарная операция\nvar n atomic.Int64\nn.Add(1)\n```"
    recommendation: "Гонки данных и детектор -race: статья «Data Race Detector» в документации Go."
    difficulty: easy
    topics: [go, concurrency]

  - id: q11
    text: "В структуре два поля, `balance` и `operations`, и каждое списание меняет оба. Почему двух отдельных `atomic.Int64` здесь недостаточно?"
    type: single
    options:
      - id: a
        text: "Пакет `atomic` работает только с `int32` и указателями"
        correct: false
        explanation: "`atomic.Int64` и функции `AddInt64`, `LoadInt64` существуют, 64-битные значения поддерживаются."
      - id: b
        text: "Атомики медленнее мьютекса при частой записи"
        correct: false
        explanation: "Одиночная атомарная операция обычно дешевле пары `Lock` и `Unlock`, дело в корректности."
      - id: c
        text: "Атомик защищает одно поле, а инвариант — два"
        correct: true
        explanation: "Между двумя атомарными записями читатель может увидеть новый баланс и старый счётчик операций."
      - id: d
        text: "Два атомика рядом вызывают ложное разделение кеша"
        correct: false
        explanation: "False sharing бьёт по скорости, но корректность не нарушает и здесь ни при чём."
    explanation: "Атомарная операция выполняется целиком, без промежуточных состояний, видимых другим горутинам. Инвариант — условие, которое должно соблюдаться всегда, например «`balance` и `operations` согласованы друг с другом». Атомарность защищает одну операцию над одним значением. Если два поля должны меняться согласованно, нужна общая критическая секция под `sync.Mutex` либо замена неизменяемого снимка целиком через `atomic.Pointer`."
    extended_explanation: "Атомики хороши для одиночных счётчиков и флагов: метрики, число активных запросов, признак остановки. Типы `atomic.Int64`, `atomic.Bool` и `atomic.Pointer`[`T`] появились в Go 1.19 и удобнее функций `AddInt64`: обычный доступ к такому полю просто не скомпилируется."
    recommendation: "Пакет sync/atomic и границы его применимости: когда хватает атомика, а когда нужен мьютекс."
    difficulty: medium
    topics: [go, concurrency]

  - id: q12
    text: |-
      Баланс равен 100, две горутины одновременно выполняют проверку и списание. Что покажет `go test -race` и что станет с балансом?

      ```go
      func (a *Account) Balance() int {
          a.mu.Lock(); defer a.mu.Unlock()
          return a.balance
      }

      func (a *Account) Withdraw(n int) {
          a.mu.Lock(); defer a.mu.Unlock()
          a.balance -= n
      }

      // в каждой из двух горутин
      if acc.Balance() >= 100 {
          acc.Withdraw(100)
      }
      ```
    type: single
    options:
      - id: a
        text: "Детектор промолчит, а баланс может уйти в минус"
        correct: true
        explanation: "Каждое обращение под мьютексом, но проверка и списание идут в разных критических секциях."
      - id: b
        text: "Детектор промолчит, баланс не опустится ниже нуля"
        correct: false
        explanation: "Обе горутины могут успеть увидеть 100 до первого списания и списать дважды."
      - id: c
        text: "Детектор сообщит о гонке, баланс станет нулевым"
        correct: false
        explanation: "Несинхронизированного доступа к памяти нет, детектору не на что реагировать."
      - id: d
        text: "Код зависнет: мьютекс берётся дважды подряд"
        correct: false
        explanation: "`Balance` отпускает мьютекс до вызова `Withdraw`, блокировки не вложены."
    explanation: "В коде `mu.Lock()` занимает мьютекс, а `defer mu.Unlock()` освобождает его при выходе из метода: пока он занят, остальные горутины ждут. Здесь это «проверь, затем действуй» (check-then-act): проверка и действие разнесены. Это race condition без data race. Доступ к полю всегда под мьютексом, поэтому детектор молчит, но между проверкой и действием другая горутина успевает сделать то же самое. Лечится одним методом, который проверяет и списывает под одной блокировкой."
    extended_explanation: "Data race — одновременный доступ к памяти без синхронизации, хотя бы один на запись. Race condition — зависимость результата от порядка событий. Детектор ищет только первое. В базе та же ошибка лечится условным `UPDATE ... WHERE balance >= 100` или `SELECT ... FOR UPDATE`. Исправление — одна критическая секция на оба шага:\n\n```go\nfunc (a *Account) WithdrawIfEnough(n int) bool {\n    a.mu.Lock()\n    defer a.mu.Unlock()\n    if a.balance < n {\n        return false\n    }\n    a.balance -= n\n    return true\n}\n```"
    recommendation: "Разница между data race и race condition, паттерн check-then-act и атомарные операции над инвариантом."
    difficulty: hard
    topics: [go, concurrency]

  - id: q13
    text: |-
      Что произойдёт при вызове `s.A()`?

      ```go
      type S struct {
          mu sync.Mutex
          n  int
      }

      func (s *S) A() { s.mu.Lock(); defer s.mu.Unlock(); s.B() }
      func (s *S) B() { s.mu.Lock(); defer s.mu.Unlock(); s.n++ }
      ```
    type: single
    options:
      - id: a
        text: "Паника: повторная блокировка мьютекса"
        correct: false
        explanation: "Ruby в такой ситуации выбрасывает `ThreadError`. Go никаких проверок не делает и просто ждёт."
      - id: b
        text: "Вечное ожидание на втором `Lock`"
        correct: true
        explanation: "Мьютекс не помнит владельца, и второй `Lock` из той же горутины ждёт сам себя."
      - id: c
        text: "Go отпустит первую блокировку перед второй"
        correct: false
        explanation: "Автоматического снятия блокировок нет, `Unlock` вызывается только явно."
      - id: d
        text: "B выполнится, мьютекс узнает свою горутину"
        correct: false
        explanation: "Так ведёт себя `Monitor` в Ruby. `sync.Mutex` понятия владельца не имеет."
    explanation: "`sync.Mutex` — взаимное исключение: `Lock()` занимает мьютекс, `Unlock()` освобождает, пока он занят, остальные горутины ждут. Реентерабельный — значит позволяющий владельцу занять его повторно. `sync.Mutex` в Go не реентерабелен и не отслеживает, какая горутина его держит. Второй `Lock` в той же горутине ждёт вечно. В маленькой программе рантайм сообщит `all goroutines are asleep - deadlock!`, а в сервисе запрос просто зависнет."
    extended_explanation: "Повторный `Mutex#lock` в Ruby сразу выбрасывает `ThreadError`, а `Monitor` вообще допускает вложенный захват. В Go методы делят на два уровня: публичный берёт блокировку, внутренний с суффиксом вроде `incLocked` предполагает, что она уже взята. Типичная перестройка:\n\n```go\nfunc (s *S) A() { s.mu.Lock(); defer s.mu.Unlock(); s.inc() }\nfunc (s *S) B() { s.mu.Lock(); defer s.mu.Unlock(); s.inc() }\nfunc (s *S) inc() { s.n++ } // вызывается под уже взятой блокировкой\n```"
    recommendation: "Документация sync.Mutex и приём разделения методов на блокирующие и вызываемые под блокировкой."
    difficulty: medium
    topics: [go, concurrency]

  - id: q14
    text: |-
      Что выведет программа и что заметит `go vet`?

      ```go
      type Counter struct {
          mu sync.Mutex
          n  int
      }

      func (c Counter) Inc() { c.mu.Lock(); c.n++; c.mu.Unlock() }

      // 100 горутин вызывают c.Inc(), main ждёт их через WaitGroup
      fmt.Println(c.n)
      ```
    type: single
    options:
      - id: a
        text: "100, мьютекс защищает поле `n`"
        correct: false
        explanation: "Защищён и увеличен `n` копии, исходная структура не меняется."
      - id: b
        text: "0, а `vet` найдёт копию мьютекса"
        correct: true
        explanation: "Получатель-значение копирует структуру с мьютексом, и каждая копия увеличивает свой `n`."
      - id: c
        text: "Зависание на `Lock`, `vet` промолчит"
        correct: false
        explanation: "У каждой копии свой мьютекс, ждать друг друга горутинам не приходится."
      - id: d
        text: "Случайное число до 100, `vet` промолчит"
        correct: false
        explanation: "Копии не пересекаются, гонки за исходное поле нет, и `vet` это нарушение видит."
    explanation: "Запись `func` (`c` `Counter`) `Inc()` — метод с получателем-значением: он работает с копией структуры. Вариант `func` (`c` `*Counter`) `Inc()` получает указатель и меняет оригинал. Метод с получателем-значением получает копию структуры вместе с мьютексом. Каждый вызов блокирует свою копию и увеличивает её `n`, исходное поле остаётся 0, и защиты нет никакой. `go vet` сообщает `Inc passes lock by value`."
    extended_explanation: "Правило: тип с `sync.Mutex` внутри получает методы с получателем-указателем и передаётся только по указателю. Анализатор `copylocks` ловит и копирование `sync.WaitGroup`, и собственных типов с методами `Lock` и `Unlock`. Исправление — получатель-указатель:\n\n```go\nfunc (c *Counter) Inc() {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.n++\n}\n```"
    recommendation: "Анализатор copylocks в go vet и правило «структуры с мьютексом не копируют»."
    difficulty: hard
    topics: [go, concurrency]

  - id: q15
    text: |-
      Что выведет программа?

      ```go
      ch := make(chan int, 1)
      ch <- 7
      close(ch)
      a := <-ch
      b, ok := <-ch
      fmt.Println(a, b, ok)
      ```
    type: single
    options:
      - id: a
        text: "Паника: канал закрыт"
        correct: false
        explanation: "Читать из закрытого канала можно, паникует только отправка в него."
      - id: b
        text: "`7 0 false`"
        correct: true
        explanation: "Значение из буфера отдаётся и после закрытия, а следующее чтение возвращает ноль с `ok = false`."
      - id: c
        text: "`7 7 false`"
        correct: false
        explanation: "Значение из буфера читается один раз, повторно оно не выдаётся."
      - id: d
        text: "`7 0 true`"
        correct: false
        explanation: "`ok = true` бывает только для значения, реально отправленного в канал."
    explanation: "Канал — типизированная труба между горутинами: `ch <- v` отправляет значение, <-`ch` получает. `make(chan int, 1)` создаёт канал с буфером на одно значение: отправка проходит, не дожидаясь получателя. Без числа канал небуферизованный, и отправка ждёт получателя. Форма `v, ok := <-ch` возвращает `ok = false`, когда канал закрыт и пуст. Закрытие не выбрасывает данные из буфера: сначала вычитывается 7. Когда буфер пуст, чтение из закрытого канала сразу возвращает нулевое значение и `ok = false`."
    extended_explanation: "Поэтому `close` служит широковещательным сигналом: все читатели канала `done` одновременно получают нулевое значение. Цикл `for v := range ch` заканчивается, когда канал закрыт и буфер вычитан."
    recommendation: "Семантика закрытых каналов и форма чтения v, ok := <-ch в спецификации Go."
    difficulty: medium
    topics: [go, concurrency]

  - id: q16
    text: "Что произойдёт при отправке в закрытый канал и кто по соглашению закрывает канал?"
    type: single
    options:
      - id: a
        text: "Паника, закрывает отправитель"
        correct: true
        explanation: "Отправитель знает, что данных больше не будет, а получатель этого знать не может."
      - id: b
        text: "Отправка зависнет, закрывает получатель"
        correct: false
        explanation: "Блокируется отправка в `nil`-канал, а закрытый канал вызывает панику."
      - id: c
        text: "Значение отбросится, закрывает получатель"
        correct: false
        explanation: "Молча отбросить значение Go не может: отправка в закрытый канал всегда паникует."
      - id: d
        text: "Вернётся ошибка, закрывает любая сторона"
        correct: false
        explanation: "У отправки нет возвращаемого значения, ошибка вернуться не может."
    explanation: "`close(ch)` помечает канал закрытым: новых значений в него не придёт, а читатели узнают об этом. Отправка в закрытый канал вызывает `panic: send on closed channel`. Поэтому закрывает канал тот, кто в него пишет, когда данных больше не будет. Закрывать канал ради сборщика мусора не нужно: `close` — сигнал читателям."
    extended_explanation: "Двойной `close` и `close(nil)` тоже паникуют. При нескольких отправителях закрытие выносят в отдельную горутину: `go func()` { `wg.Wait()`; `close(out)` }()."
    recommendation: "Правила владения каналом: кто создаёт, кто пишет и кто закрывает."
    difficulty: easy
    topics: [go, concurrency]

  - id: q17
    text: |-
      Что произойдёт?

      ```go
      ch := make(chan int)
      go func() {
          for i := 0; i < 3; i++ {
              ch <- i
          }
      }()
      for v := range ch {
          fmt.Print(v)
      }
      ```
    type: single
    options:
      - id: a
        text: "Выведет 012 и молча зависнет навсегда"
        correct: false
        explanation: "Так будет в сервисе с другими живыми горутинами. Здесь кроме `main` никого нет, и рантайм это замечает."
      - id: b
        text: "Выведет 012, затем `fatal error: deadlock`"
        correct: true
        explanation: "Отправитель вышел без `close`, `range` ждёт следующего значения, и рантайм видит, что все горутины спят."
      - id: c
        text: "Выведет 012 и завершится без ошибок"
        correct: false
        explanation: "`Range` по каналу заканчивается только после `close`, а его здесь никто не вызывает."
      - id: d
        text: "Не скомпилируется: `range` по каналу без `close`"
        correct: false
        explanation: "Компилятор не отслеживает, закрывается ли канал, код корректен синтаксически."
    explanation: "`make(chan int)` без числа создаёт небуферизованный канал: отправка ждёт, пока кто-то прочитает. Цикл `for v := range ch` получает значения по очереди. `for v := range ch` читает, пока канал не закрыт. Горутина отправила три значения и завершилась без `close`, `main` ждёт четвёртого. Ждать некого, и рантайм аварийно завершает процесс. Лечится `defer close(ch)` в отправителе."
    extended_explanation: "Детектор взаимной блокировки срабатывает, только когда спят все горутины. В сервисе с HTTP-сервером или таймерами такой цикл повиснет без сообщений, а горутина станет утечкой, видимой в `/debug/pprof/goroutine`. Исправление — закрывать канал в отправителе:\n\n```go\ngo func() {\n    defer close(ch)\n    for i := 0; i < 3; i++ {\n        ch <- i\n    }\n}()\n```"
    recommendation: "Конвейеры на каналах и дисциплина закрытия: статья «Go Concurrency Patterns: Pipelines and cancellation» на go.dev."
    difficulty: medium
    topics: [go, concurrency]

  - id: q18
    text: "Внутри функции `func producer(out chan<- int)` какая строка не скомпилируется?"
    type: single
    options:
      - id: a
        text: "`out <- 1`"
        correct: false
        explanation: "Отправка — ровно то, для чего канал объявлен."
      - id: b
        text: "`len(out)`"
        correct: false
        explanation: "`len` и `cap` работают для канала любого направления."
      - id: c
        text: "`v := <-out`"
        correct: true
        explanation: "Канал только для отправки, чтение из него запрещено на уровне типов."
      - id: d
        text: "`close(out)`"
        correct: false
        explanation: "Закрывать разрешено как раз отправляющую сторону."
    explanation: "Стрелка показывает направление: `chan`<- `int` — «в канал», только отправка, <-`chan` `int` — «из канала», только чтение. Тип `chan`<- `int` разрешает только отправку, <-`chan` `int` только чтение. Двунаправленный канал неявно приводится к направленному при вызове, обратное преобразование невозможно. Так компилятор фиксирует, кто пишет и кто читает."
    extended_explanation: "Для <-`chan` `T` не компилируется уже `close`: закрывать должен отправитель, и тип это закрепляет. Сигнатура `func gen()` <-`chan` `int` — стандартный способ сказать вызывающему «только читай». Попытка прочитать из канала только для отправки даёт ошибку компиляции: `cannot receive from send-only channel`."
    recommendation: "Направленные каналы в спецификации Go и их роль в сигнатурах функций."
    difficulty: medium
    topics: [go, concurrency]

  - id: q19
    text: "Как ограничить ожидание значения из канала одной секундой?"
    type: single
    options:
      - id: a
        text: "Вызвать `time.Sleep(time.Second)` перед чтением из канала"
        correct: false
        explanation: "`Sleep` просто задерживает чтение и ожидание не ограничивает."
      - id: b
        text: "Передать время вторым значением: `v := <-ch`, `time.Second`"
        correct: false
        explanation: "Такого синтаксиса в языке нет, у оператора чтения один операнд."
      - id: c
        text: "Закрыть канал из читающей горутины по таймеру"
        correct: false
        explanation: "Канал закрывает отправитель, а чтение из закрытого канала вернёт нулевое значение, но не ошибку таймаута."
      - id: d
        text: "Использовать `select` с веткой `case <-time.After(time.Second)`"
        correct: true
        explanation: "`Select` ждёт сразу несколько событий и выполняет первое наступившее, а `time.After` присылает сигнал по истечении времени."
    explanation: "Оператор `select` ждёт несколько каналов и выполняет ту ветку, что готова первой. Ветка с `time.After(d)` срабатывает по истечении времени `d`, так что ожидание ограничено. В сервисах чаще используют ветку `case <-ctx.Done()` с контекстом, у которого задан дедлайн."
    extended_explanation: "`time.After` создаёт таймер: до Go 1.23 он жил до срабатывания, даже если `select` выполнился раньше, и в горячих циклах его заменяли на `time.NewTimer` с явным `Stop`. Начиная с Go 1.23 неиспользуемые таймеры собираются сборщиком мусора."
    recommendation: "Оператор select и таймауты: time.After, time.NewTimer и контекст с дедлайном."
    difficulty: easy
    topics: [go, concurrency]

  - id: q20
    text: |-
      Функция вызывается тысячи раз в секунду, запросы часто упираются в таймаут, а число горутин растёт. Что происходит и как исправить?

      ```go
      func query() (int, error) {
          ch := make(chan int)
          go func() { ch <- slow() }()
          select {
          case v := <-ch:
              return v, nil
          case <-time.After(10 * time.Millisecond):
              return 0, errors.New("timeout")
          }
      }
      ```
    type: single
    options:
      - id: a
        text: "Накапливаются таймеры `time.After`, их нужно останавливать вручную"
        correct: false
        explanation: "С Go 1.23 неиспользуемые таймеры собираются сборщиком мусора, а растёт в этом коде число горутин."
      - id: b
        text: "Не закрыт канал, нужно вызывать `close(ch)` после чтения"
        correct: false
        explanation: "Закрытие канала зависшую отправку не разблокирует, а отправка в закрытый канал вызвала бы панику."
      - id: c
        text: "Горутины зависают на отправке без читателя, нужен буфер на 1"
        correct: true
        explanation: "После таймаута читать из канала некому, и отправляющая горутина блокируется навсегда."
      - id: d
        text: "Ничего страшного, сборщик мусора убирает горутины без читателей"
        correct: false
        explanation: "Сборщик мусора горутины не завершает: застрявшая горутина живёт, пока процесс работает."
    explanation: "Канал небуферизованный: отправка ждёт читателя. Когда сработал таймаут, функция вернулась, читать из канала больше некому, и горутина навсегда зависает на `ch <- slow()`. Это утечка горутин: сборщик мусора их не убирает. Лечится буфером на одно значение `make(chan int, 1)`: отправка проходит без читателя, и горутина завершается."
    extended_explanation: "Число горутин показывает `runtime.NumGoroutine()`, а место зависания — профиль `/debug/pprof/goroutine` (стеки с `chan send`). Надёжнее всего передавать горутине `ctx` и отправлять в `select` с `case <-ctx.Done()`, чтобы она сама завершалась по отмене."
    recommendation: "Утечки горутин: типичные причины (канал без читателя, забытый context) и поиск по профилю goroutine в pprof."
    difficulty: hard
    topics: [go, reliability]

  - id: q21
    text: |-
      Что произойдёт при запуске программы?

      ```go
      func main() {
          defer func() { fmt.Println("recovered:", recover()) }()
          go func() { panic("boom") }()
          time.Sleep(100 * time.Millisecond)
      }
      ```
    type: single
    options:
      - id: a
        text: "Весь процесс упадёт с паникой, `recover` в `main` горутину не защищает"
        correct: true
        explanation: "Паника в горутине всплывает только по её собственному стеку, а выше стека горутины `recover` в `main` не видит."
      - id: b
        text: "Выведет `recovered`: `boom` и продолжит работу"
        correct: false
        explanation: "`Recover` перехватывает панику только своей горутины, паника в чужой до него не доходит."
      - id: c
        text: "Завершится только та горутина, `main` доспит и выйдет штатно"
        correct: false
        explanation: "Необработанная паника в любой горутине завершает весь процесс целиком."
      - id: d
        text: "Не скомпилируется: `defer` нельзя использовать в `main`"
        correct: false
        explanation: "`Defer` разрешён в любой функции, включая `main`."
    explanation: "Необработанная паника в горутине завершает весь процесс. `Recover` перехватывает панику только в той же горутине, из которой вызван в отложенной функции: через границу горутин он не работает. Поэтому каждая горутина, которая может упасть, должна ставить свой `defer` с `recover`."
    extended_explanation: "Это важно для сервисов: `go f()` в HTTP-обработчике с паникой уронит процесс целиком, хотя recover-middleware на уровне обработчика ничего не поймает. Обёртка для фоновых задач: `go func()` { `defer func()` { `if` `r := recover()`; `r != nil` { `log.Printf(\"panic: %v\", r)` } }(); `work()` }()."
    recommendation: "Паника в горутинах и границы действия recover; раздел «Handling panics» в документации."
    difficulty: hard
    topics: [go, reliability]

  - id: q22
    text: "Функция получила `ctx` с таймаутом в 1 секунду и считает тяжёлый цикл. Таймаут истёк, а вычисление продолжается. Почему?"
    type: single
    options:
      - id: a
        text: "Отмена кооперативная: код сам проверяет `ctx`"
        correct: true
        explanation: "Контекст лишь сообщает об отмене, остановиться должен сам код, увидев сигнал."
      - id: b
        text: "Таймаут контекста действует только на сетевые вызовы"
        correct: false
        explanation: "Сетевые библиотеки сами проверяют `ctx` внутри, поэтому кажется, что отмена работает только там."
      - id: c
        text: "Остановить её можно `runtime.Goexit` из другой горутины"
        correct: false
        explanation: "Эта функция действует лишь на вызвавшую её горутину, предварительно выполнив её отложенные вызовы."
      - id: d
        text: "Рантайм остановит горутину, но с задержкой до секунды"
        correct: false
        explanation: "Внешнего способа убить горутину в Go нет вообще, ни мгновенного, ни отложенного."
    explanation: "`context.Context` — объект, который несёт дедлайн и сигнал отмены по цепочке вызовов. `ctx.Done()` — канал, который закрывается при отмене или истечении времени, `ctx.Err()` возвращает причину. Контекст переносит сигнал отмены, но горутину не убивает: снаружи её остановить в Go нельзя. Цикл должен периодически проверять `select` на `ctx.Done()` или `ctx.Err()`, а функции, принимающие `ctx`, делают такую проверку внутри."
    extended_explanation: "Это сознательный выбор: внешнее прерывание, как `Timeout.timeout` в Ruby, может оборвать код посреди критической секции и оставить состояние несогласованным. В горячем цикле `ctx.Err()` проверяют раз в `N` итераций: вызов дешёвый, но не бесплатный. Проверка отмены в цикле:\n\n```go\nfor i := 0; i < n; i++ {\n    if i%1000 == 0 {\n        select {\n        case <-ctx.Done():\n            return ctx.Err()\n        default:\n        }\n    }\n    work(i)\n}\n```"
    recommendation: "Пакет context и кооперативная отмена: статья «Go Concurrency Patterns: Context» на go.dev."
    difficulty: medium
    topics: [go, concurrency]

  - id: q23
    text: |-
      Что не так с этим кодом?

      ```go
      ctx, _ := context.WithTimeout(r.Context(), 2*time.Second)
      resp, err := client.Do(req.WithContext(ctx))
      ```
    type: single
    options:
      - id: a
        text: "Таймаут не сработает, пока не отменён родительский контекст запроса"
        correct: false
        explanation: "Дочерний дедлайн действует независимо и срабатывает в положенное время."
      - id: b
        text: "Подчёркивание обнуляет контекст, запрос уйдёт без дедлайна"
        correct: false
        explanation: "Контекст возвращается и работает как обычно, отброшена лишь функция отмены."
      - id: c
        text: "Отмену нужно вызвать до `client.Do`, иначе запрос не отправится"
        correct: false
        explanation: "Отмена до вызова сразу отменила бы запрос, вызывают её после завершения работы."
      - id: d
        text: "Функция отмены отброшена, ресурсы контекста живут до истечения времени"
        correct: true
        explanation: "Таймер контекста освобождается вызовом `cancel`, а без него живёт до дедлайна, это ловит `go vet`."
    explanation: "`context.WithTimeout` возвращает контекст и функцию отмены. Если её отбросить, таймер и связи с родителем освободятся лишь по истечении тайм-аута, а при коротком запросе и длинном тайм-ауте это лишние ресурсы в каждой операции. Правило: `ctx, cancel := ...`; `defer cancel()`."
    extended_explanation: "`go vet` это ловит анализатором `lostcancel`: `the cancel function returned by context.WithTimeout should be called, not discarded, to avoid a context leak`. Вызывать `cancel` можно сколько угодно раз, повторные вызовы ничего не делают."
    recommendation: "Правила работы с context: обязательный вызов cancel, defer cancel() и анализатор lostcancel в go vet."
    difficulty: medium
    topics: [go, concurrency]

  - id: q24
    text: "HTTP-обработчик запускает отправку письма в горутине, передаёт туда `r.Context()` и сразу отвечает 202. Письма иногда не уходят. Почему?"
    type: single
    options:
      - id: a
        text: "`r.Context()` нельзя читать вне горутины обработчика"
        correct: false
        explanation: "Контекст безопасен для конкурентного использования, ограничений на горутины нет."
      - id: b
        text: "Сервер ограничивает число фоновых горутин на запрос"
        correct: false
        explanation: "`net/http` не считает горутины, запущенные из обработчика, и ничего не ограничивает."
      - id: c
        text: "Контекст отменяется, когда обработчик вернулся"
        correct: true
        explanation: "Сервер отменяет контекст запроса, когда обработчик завершился, и клиент почты получает `context` `canceled`."
      - id: d
        text: "Горутины обработчика завершаются вместе с ним"
        correct: false
        explanation: "Горутина живёт независимо от функции, которая её запустила."
    explanation: "`r.Context()` — контекст конкретного HTTP-запроса: он живёт, пока запрос обрабатывается, и отменяется по его завершении. `net/http` отменяет контекст запроса, когда `ServeHTTP` возвращает управление или клиент разрывает соединение. Фоновая работа с этим контекстом обрывается на первой же проверке. Нужен контекст без отмены: `context.WithoutCancel(r.Context())` с собственным таймаутом."
    extended_explanation: "`WithoutCancel` (Go 1.21) сохраняет значения контекста, например trace id, но убирает отмену и дедлайн, поэтому таймаут добавляют поверх: `context.WithTimeout(context.WithoutCancel(ctx), 10*time.Second)`. Для гарантированной доставки письмо кладут в персистентную очередь: горутина умрёт при рестарте вместе с задачей. Фон с собственным временем жизни:\n\n```go\nctx := context.WithoutCancel(r.Context())\nctx, cancel := context.WithTimeout(ctx, 10*time.Second)\ngo func() {\n    defer cancel()\n    sendEmail(ctx, msg)\n}()\n```"
    recommendation: "Время жизни контекста запроса в net/http и функция context.WithoutCancel."
    difficulty: hard
    topics: [go, background-jobs]

  - id: q25
    text: "Кеш пуст, и одновременно приходят 100 одинаковых запросов на один ключ. Сколько обращений к базе сделает код, обернувший загрузку в `singleflight.Group.Do` по этому ключу?"
    type: single
    options:
      - id: a
        text: "Одно, остальные 99 ждут и получают тот же результат"
        correct: true
        explanation: "`Do` выполняет функцию один раз для всех одновременных вызовов с одним ключом и раздаёт результат всем ожидающим."
      - id: b
        text: "Сто, но не больше пяти одновременно"
        correct: false
        explanation: "`Singleflight` число одновременных вызовов не ограничивает, он их склеивает."
      - id: c
        text: "Ни одного, `singleflight` сам хранит результат как кеш"
        correct: false
        explanation: "Результат живёт только пока выполняется вызов, после его завершения следующий вызов пойдёт в базу заново."
      - id: d
        text: "Два, второй резервный на случай ошибки первого"
        correct: false
        explanation: "Резервных запросов нет, при ошибке её получают все ожидающие."
    explanation: "`singleflight.Group` склеивает одновременные вызовы с одним ключом: функция выполняется один раз, а остальные вызывающие блокируются и получают тот же результат или ту же ошибку. Так защищаются от «стампеда» кеша, когда после его сброса все запросы разом идут в базу."
    extended_explanation: "Это не кеш: сразу после завершения следующий вызов запустит функцию заново, поэтому его используют вместе с кешем. Пакет `golang.org/x/sync/singleflight`. В Rails похожую задачу решает `Rails.cache.fetch` с `race_condition_ttl`. Отмена контекста одного вызывающего задачу для остальных не отменяет, но если контекст отменит сама выполняющаяся функция, ошибку получат все."
    recommendation: "Пакет singleflight и защита от cache stampede; документация golang.org/x/sync/singleflight."
    difficulty: medium
    topics: [go, caching]
