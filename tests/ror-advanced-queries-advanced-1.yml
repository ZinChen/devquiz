        text: "`find_each` загружает записи пачками по 1000 и не держит всю таблицу в памяти"
        correct: true
        explanation: "Первый вариант загрузит все пять миллионов объектов, прежде чем начнёт цикл. find_each берёт пачку, отдаёт записи по одной и переходит к следующей, ориентируясь на первичный ключ."
      - id: b
        text: "`find_each` выполняет один запрос с курсором, поэтому не создаёт нагрузки на базу"
        correct: false
        explanation: "Запросов много: по одному на каждую пачку. Курсоров в обычном find_each нет."
      - id: c
        text: "`find_each` сохраняет порядок сортировки, заданный через `order` в запросе"
        correct: false
        explanation: "find_each всегда упорядочивает по первичному ключу и заданный order игнорирует, о чём Rails сообщает предупреждением."
      - id: d
        text: "`find_each` выполняет `recalculate_rating` для разных записей параллельно в нескольких потоках"
        correct: false
        explanation: "Обработка последовательная, в одном потоке. Параллелизм нужно организовывать отдельно, например через фоновые задачи."
    explanation: "each на relation сначала загружает все записи в память, а find_each режет выборку на пачки по первичному ключу. Память расходуется на одну пачку, поэтому метод подходит для больших таблиц и фоновых задач."
    extended_explanation: "Размер пачки задаётся параметром `batch_size`. Для обработки пачками целиком есть find_in_batches и in_batches. Практически стоит проверить в задачах и миграциях, нет ли обычного each по крупным таблицам."
    recommendation: "Пакетная обработка в ActiveRecord: `find_each`, `find_in_batches`, `in_batches` и их ограничения."
    difficulty: easy
    topics: [performance, queries]

  - id: q20
    text: |-
      Этот код выполняет N+1 запросов для тысячи постов:

      ```ruby
      Post.all.each { |post| puts post.comments.count }
      ```

      Какое изменение устранит проблему?
    type: single
    options:
      - id: a
        text: "`Post.includes(:comments).each { |post| puts post.comments.count }`"
        correct: false
        explanation: "count всегда выполняет SQL COUNT(*) и игнорирует уже загруженные объекты, поэтому N запросов остаётся."
      - id: b
        text: "`Post.joins(:comments).each { |post| puts post.comments.size }`"
        correct: false
        explanation: "joins данные ассоциации не загружает. size на незагруженной ассоциации сам выполнит COUNT, и N+1 сохранится."
      - id: c
        text: "`Post.includes(:comments).each { |post| puts post.comments.size }`"
        correct: true
        explanation: "includes загружает все комментарии одним дополнительным запросом, а size считает уже загруженные объекты и новых запросов не делает."
      - id: d
        text: "`Post.all.map(&:comments).each { |comments| puts comments.count }`"
        correct: false
        explanation: "Без includes map(&:comments) обращается к ассоциации каждого поста по отдельности, а count добавляет ещё запрос."
    explanation: "Для устранения N+1 нужны две вещи: заранее загрузить ассоциацию и читать количество методом, который использует загруженные данные. size проверяет, загружена ли ассоциация: если да, считает объекты в памяти, иначе выполняет COUNT(*). count всегда обращается к базе."
    extended_explanation: "Если сами комментарии дальше не нужны, а нужно только число, эффективнее counter_cache: счётчик хранится в колонке родителя и обновляется при создании и удалении записей. Сравнить запросы для size и count после includes легко по логу Rails."
    recommendation: "Различие `size`, `count` и `length` на ассоциациях ActiveRecord и счётчики через `counter_cache`."
    difficulty: medium
    topics: [performance, queries]

  - id: q21
    text: |-
      Скоуп ассоциации использует подзапрос:

      ```ruby
      has_one :latest_comment,
              -> { where(id: select("max(id)").group(:post_id)) },
              class_name: "Comment"
      ```

      Что он делает для каждого поста?
    type: single
    options:
      - id: a
        text: "Возвращает комментарий с наименьшим id, то есть самый первый"
        correct: false
        explanation: "В подзапросе стоит max(id), а минимальный id дал бы min(id)."
      - id: b
        text: "Возвращает случайный комментарий, потому что `GROUP BY` не гарантирует, какая строка останется"
        correct: false
        explanation: "Результат детерминирован: отбирается строка, id которой равен максимуму в группе. Случайность могла бы появиться только без max."
      - id: c
        text: "Падает с ошибкой: `select` внутри `where` нельзя использовать без указания таблицы"
        correct: false
        explanation: "Подзапрос внутри where(id: ...) допустим: select с group становится вложенным SELECT по той же таблице."
      - id: d
        text: "Возвращает комментарий с наибольшим id, то есть последний добавленный"
        correct: true
        explanation: "Подзапрос группирует комментарии по post_id и находит максимальный id каждой группы. Внешнее условие отбирает именно эти строки."
    explanation: "Подзапрос строит максимумы id по группам post_id, и where(id: ...) оставляет те комментарии, чей id в этот набор входит. Если id растёт вместе со временем создания, это последний комментарий поста. Это стандартный приём «последняя запись в группе» без оконных функций."
    extended_explanation: "Тот же результат дают оконная функция `ROW_NUMBER() OVER (PARTITION BY post_id ORDER BY id DESC)` и LATERAL JOIN. Подход через max(id) годится лишь для одной записи на группу и опирается на то, что id отражает порядок создания."
    recommendation: "Задача «последняя запись для каждой группы»: group и max, оконные функции, LATERAL JOIN."
    difficulty: hard
    topics: [queries, associations]

  - id: q22
    text: |-
      Ассоциация проходит цепочку пост, комментарий, голос, голосующий:

      ```ruby
      class Post < ApplicationRecord
        has_many :comments
        has_many :comment_voters, -> { distinct }, through: :comments, source: :voters
      end
      ```

      Зачем здесь `distinct`, если каждый голос связывает голосующего ровно с одним комментарием?
    type: single
    options:
      - id: a
        text: "`has_many :through` с несколькими звеньями не работает без `distinct`, иначе Rails выбрасывает ошибку"
        correct: false
        explanation: "Ассоциация создаётся и без distinct. Различие только в том, будут ли дубликаты в результате."
      - id: b
        text: "Один голосующий может оставить голоса под разными комментариями поста, и без `distinct` он повторится в результате"
        correct: true
        explanation: "JOIN по цепочке даёт по строке на каждый путь от поста до голосующего. Два голоса одного человека под разными комментариями — это два пути и две строки."
      - id: c
        text: "`distinct` убирает повторяющиеся посты, потому что JOIN строится от таблицы `posts`"
        correct: false
        explanation: "Сама ассоциация возвращает голосующих, поэтому дублироваться могут именно они."
      - id: d
        text: "Голосующий может голосовать за комментарии нескольких постов, поэтому `distinct` не пропускает чужих голосующих"
        correct: false
        explanation: "Чужие голосующие отсекаются условием JOIN по id поста. Повтор вызывает несколько путей внутри одного поста."
    explanation: "Многозвенный has_many :through строит JOIN через все промежуточные таблицы. Если между постом и голосующим больше одного пути, каждый порождает свою строку, и один и тот же голосующий повторяется. distinct на уровне SQL оставляет каждого один раз."
    extended_explanation: "На больших объёмах distinct по длинной цепочке заметно дороже. Тогда иногда выгоднее подзапрос с DISTINCT ON (специфично для PostgreSQL) или предварительная агрегация voter_id перед финальным JOIN. Дубли легко воспроизвести: один голосующий и два его голоса под разными комментариями одного поста."
    recommendation: "has_many :through с несколькими звеньями: как JOIN порождает дубли и когда нужен distinct."
    difficulty: hard
    topics: [queries, associations]

  - id: q23
    text: |-
      Что делает эта цепочка и зачем в конце `distinct`?

      ```ruby
      Post.where(published: true)
          .or(Post.where(featured: true))
          .joins(:comments)
          .distinct
      ```
    type: single
    options:
      - id: a
        text: "Выбирает посты, которые одновременно опубликованы и featured: `or` объединяет условия через И"
        correct: false
        explanation: "or в ActiveRecord соответствует SQL OR: достаточно выполнить любое из условий."
      - id: b
        text: "Падает с ошибкой: `or` нельзя сочетать с `joins` в одной цепочке"
        correct: false
        explanation: "Цепочка корректна: or требует лишь структурной совместимости двух relation, а joins добавляется после него."
      - id: c
        text: "Опубликованные или featured посты с комментариями, а `distinct` убирает повторы от JOIN"
        correct: true
        explanation: "or даёт логическое ИЛИ, joins работает как INNER JOIN и отсекает посты без комментариев, а у поста с пятью комментариями без distinct было бы пять строк."
      - id: d
        text: "`distinct` убирает повторяющиеся значения внутри ассоциации `comments`, а не строки таблицы `posts`"
        correct: false
        explanation: "distinct применяется ко всему результату запроса над Post. Содержимое ассоциации comments он не меняет."
    explanation: "or строит условие ИЛИ между двумя where, joins(:comments) работает как INNER JOIN и оставляет только посты хотя бы с одним комментарием. JOIN один-ко-многим даёт по строке на комментарий, поэтому distinct нужен, чтобы получить уникальные посты."
    extended_explanation: "Если joins нужен лишь для проверки существования связи, дубликатов можно избежать подзапросом `where(id: Comment.select(:post_id))` или `exists?`. Это частая ловушка, особенно когда JOIN добавляют только ради фильтра."
    recommendation: "JOIN один-ко-многим и дубликаты строк: `distinct`, подзапросы и `exists?` как альтернативы."
    difficulty: medium
    topics: [queries, associations]

  - id: q24
    text: |-
      Для каждого поста нужно получить три последних комментария:

      ```sql
      SELECT posts.id, c.id
      FROM posts
      LEFT JOIN LATERAL (
        SELECT id FROM comments
        WHERE comments.post_id = posts.id
        ORDER BY id DESC
        LIMIT 3
      ) c ON true
      ```

      Чем `LATERAL` отличается от обычного подзапроса в `JOIN`?
    type: single
    options:
      - id: a
        text: "Подзапрос может ссылаться на колонки внешней таблицы и выполняется для каждой её строки"
        correct: true
        explanation: "Обычный подзапрос в JOIN вычисляется независимо и о строке posts не знает. С LATERAL условие comments.post_id = posts.id и LIMIT 3 применяются к каждому посту отдельно."
      - id: b
        text: "Подзапрос выполняется один раз, а его результат кэшируется для всех строк внешней таблицы"
        correct: false
        explanation: "LATERAL выполняется заново для каждой строки внешней таблицы, потому что зависит от неё."
      - id: c
        text: "`LIMIT` внутри подзапроса в JOIN допускается только с ключевым словом `LATERAL`"
        correct: false
        explanation: "LIMIT допустим в любом подзапросе. Но без LATERAL он ограничил бы общее число строк результата, и «по три на каждый пост» не получилось бы."
      - id: d
        text: "`LATERAL` — подсказка планировщику, чтобы он использовал индекс по внешнему ключу"
        correct: false
        explanation: "LATERAL — часть синтаксиса, которая делает видимыми колонки внешней таблицы. Выбор индекса остаётся за планировщиком."
    explanation: "LATERAL разрешает подзапросу в предложении FROM или JOIN ссылаться на колонки таблиц, записанных левее. Благодаря этому для каждого поста выполняется свой параметризованный запрос с LIMIT 3, что обычным подзапросом сделать нельзя."
    extended_explanation: "Без LATERAL «топ-N на группу» решают оконной функцией `ROW_NUMBER() OVER (PARTITION BY post_id ORDER BY id DESC)` с фильтром по номеру строки. max(id) годится лишь для одной записи на группу. Планы выполнения обоих вариантов стоит сравнить через EXPLAIN ANALYZE."
    recommendation: "LATERAL JOIN в PostgreSQL и задача «топ-N на группу»: сравнение с оконными функциями."
    difficulty: hard
    topics: [queries, performance]

  - id: q25
    text: |-
      В таблице есть посты со `status = NULL`:

      ```ruby
      Post.where.not(status: "draft")
      ```

      Попадут ли они в результат?
    type: single
    options:
      - id: a
        text: "Да: Rails добавляет `OR status IS NULL`, чтобы where.not был предсказуемым"
        correct: false
        explanation: "Rails ничего не добавляет к условию: where.not(status: \"draft\") превращается ровно в status != 'draft'."
      - id: b
        text: "Да: `where.not` проверяет только непустые значения и поэтому NULL пропускает"
        correct: false
        explanation: "where.not отрицает условие и пустые значения не пропускает. Для NULL отрицание тоже не истинно."
      - id: c
        text: "Зависит от адаптера: PostgreSQL вернёт такие строки, а MySQL нет"
        correct: false
        explanation: "Трёхзначная логика SQL работает одинаково во всех СУБД, и NULL при сравнении отсекается везде."
      - id: d
        text: "Нет: условие `status != 'draft'` для NULL не истинно, и такие строки отбрасываются"
        correct: true
        explanation: "В SQL сравнение с NULL даёт неопределённость, а WHERE оставляет только истинные результаты. Посты без статуса пропадут из выборки."
    explanation: "В трёхзначной логике SQL выражение `NULL != 'draft'` даёт NULL, а не true, поэтому строка в WHERE не проходит. Из-за этого where.not молча теряет записи с пустым значением, и часто это обнаруживают поздно."
    extended_explanation: "Чтобы вернуть и NULL, пишут явно: `Post.where(status: nil).or(Post.where.not(status: \"draft\"))` или в PostgreSQL `IS DISTINCT FROM`. Практически стоит поискать where.not по колонкам, допускающим NULL."
    recommendation: "Трёхзначная логика SQL и NULL в условиях: `where.not`, `IS NULL`, `IS DISTINCT FROM`."
    difficulty: medium
    topics: [queries]
