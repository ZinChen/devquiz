    explanation: "SCD (Slowly Changing Dimension) — классический паттерн моделирования измерений в DWH для атрибутов, меняющихся редко, но важных исторически. Type 1 просто перезаписывает значение (история теряется), Type 2 добавляет новую строку-версию с диапазоном действия — именно он сохраняет полную историю."
    extended_explanation: "На практике Type 2 реализуют через три служебные колонки: `valid_from`, `valid_to` (или `is_current` как булев флаг) и суррогатный ключ строки, отдельный от натурального ключа сотрудника — это позволяет джойнить факты именно с той версией измерения, которая действовала на момент события."
