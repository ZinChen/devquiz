slug: etl-analytics-advanced-1
title: "ETL/ELT, колоночные хранилища и оркестрация данных"
description: "Практический тест по data-инженерии: паттерны загрузки данных, колоночные СУБД вроде ClickHouse, оркестрация в Airflow, трансформации в dbt и типовые аналитические сценарии."
tags: [etl, dbt, airflow, analytics, data-engineering]
difficulty: advanced
estimated_time: 30

questions:
  # ── Блок 1: ETL vs ELT и загрузка данных ────────────────────────────────

  - id: q1
    text: "В чём ключевое отличие ELT от классического ETL?"
    type: single
    options:
      - id: a
        text: "Трансформация выполняется после загрузки, силами самого хранилища"
        correct: true
        explanation: "Сырые данные едут в хранилище как есть, а SQL-трансформации выполняются уже там, используя его вычислительные мощности."
      - id: b
        text: "Данные грузятся сразу в конечные витрины, минуя промежуточный слой"
        correct: false
        explanation: "Промежуточный слой сырых данных (staging) в ELT как раз обычно сохраняют — трансформация происходит уже поверх него."
      - id: c
        text: "Извлечение и загрузка происходят в одной транзакции без отдельного шага трансформации"
        correct: false
        explanation: "Аббревиатура сохраняет все три шага — меняется только их порядок, трансформация никуда не девается."
      - id: d
        text: "ELT работает только с потоковыми источниками, ETL — только с батчами"
        correct: false
        explanation: "Оба паттерна применимы и к батчевой, и к потоковой загрузке — деление по типу источника тут ни при чём."
    explanation: "ETL трансформирует данные во внешнем движке до загрузки в хранилище — хранилище получает уже готовые витрины. ELT сначала грузит сырые данные, а трансформацию перекладывает на само хранилище (обычно колоночное, с большим параллелизмом). Рост популярности ELT — прямое следствие того, что современные DWH стали достаточно мощными, чтобы не бояться нагружать их сырыми SQL-трансформациями."
    extended_explanation: "Практическое следствие: в ELT-мире схему сырых данных обычно не проектируют заранее так тщательно, как в ETL — hard-обработка откладывается на стадию трансформации, а загрузка становится проще и быстрее восстанавливается при сбое, потому что можно просто перезалить сырой слой и прогнать трансформации заново."
    recommendation: "Посмотреть на архитектуру современного ELT-стека: Fivetran/Airbyte (Extract-Load) + dbt (Transform)."
    difficulty: medium
    topics: [analytics, data]

  - id: q2
    text: "Пайплайн загружает заказы из внешнего API в хранилище раз в час. При сетевом сбое Airflow автоматически повторяет таск. Что должно гарантировать, чтобы повтор не задвоил данные?"
    type: single
    options:
      - id: a
        text: "Идемпотентность таска — повторный запуск с теми же входными данными не должен менять результат"
        correct: true
        explanation: "Идемпотентная загрузка проверяет своё поведение с уже присутствующими строками — перезаписывает их или пропускает при повторном запуске."
      - id: b
        text: "Отключение retry в Airflow для этого конкретного таска"
        correct: false
        explanation: "Отключение повторов не решает проблему дублей — оно просто переносит сбой на плечи человека, который будет перезапускать таск вручную тем же небезопасным способом."
      - id: c
        text: "Увеличение интервала между попытками повтора перед ретраем"
        correct: false
        explanation: "Интервал определяет только скорость прихода повторной попытки — сама логика дублирования строк при повторе остаётся прежней."
      - id: d
        text: "Использование более быстрого сетевого канала до источника"
        correct: false
        explanation: "Скорость канала снижает вероятность самого сбоя, но никак не защищает от дублирования при уже случившемся повторе."
    explanation: "Retry-логика Airflow (и любого оркестратора) предполагает, что таск можно безопасно запустить повторно. Если таск делает `INSERT` без проверки на существование строки, второй запуск после частичного сбоя первого задвоит часть данных. Решение — upsert по бизнес-ключу или полная перезапись партиции целиком (delete+insert), а не аппендинг."
    extended_explanation: "Частый способ добиться идемпотентности без ручного upsert — писать данные в отдельную партицию по дате/часу и на каждом запуске полностью пересоздавать именно эту партицию (`INSERT OVERWRITE` или `DELETE ... WHERE partition = X` + `INSERT`), а не дописывать в общую таблицу."
    recommendation: "Изучить паттерн idempotent write через partition overwrite — стандартная практика в Airflow-пайплайнах."
    difficulty: medium
    topics: [data]

  - id: q3
    text: "Чем инкрементальная загрузка отличается от full refresh?"
    type: single
    options:
      - id: a
        text: "Инкрементальная работает только с колоночными хранилищами, full refresh — только со строковыми"
        correct: false
        explanation: "Оба варианта загрузки применимы к хранилищу любого типа — тип хранения тут не является ограничением."
      - id: b
        text: "Инкрементальная тянет только новые или изменённые записи с последнего запуска, full refresh перезаливает всё целиком"
        correct: true
        explanation: "Критерий отбора у инкрементальной загрузки — метка времени, инкрементный ключ или CDC-событие, применяемые к дельте с прошлого запуска."
      - id: c
        text: "Full refresh быстрее инкрементальной при любом объёме данных"
        correct: false
        explanation: "На большой таблице full refresh обычно медленнее и дороже — он перечитывает и перезаписывает весь объём вместо дельты."
      - id: d
        text: "Инкрементальная загрузка не умеет обрабатывать удаления записей в источнике"
        correct: false
        explanation: "Ограничение реальное, но оно не определяющее — есть механизмы (soft delete, сравнение снапшотов), закрывающие этот случай для инкрементальной загрузки."
    explanation: "Full refresh проще в реализации и гарантированно консистентен с источником, но дорог на больших таблицах. Инкрементальная загрузка дешевле по ресурсам, но требует надёжного признака изменения (updated_at, автоинкрементный id, CDC-лог) и отдельной логики для обработки удалений, которые сама по себе дельта не видит."
    extended_explanation: "Главная слабость инкрементальной загрузки по `updated_at` — она пропускает жёсткие удаления (`DELETE`) в источнике, потому что удалённая строка просто исчезает и не попадает в фильтр по времени изменения. Для полной консистентности либо используют CDC (Debezium и подобные), либо периодически догоняют состояние полным сравнением снапшотов."
    recommendation: "Сравнить CDC-подход (журнал изменений) с наивной инкрементальной загрузкой по updated_at."
    difficulty: medium
    topics: [data]

  - id: q4
    text: "В витрине заказов нужно объединить строки из ежедневной инкрементальной загрузки так, чтобы повторная загрузка того же дня не создавала дублей заказа. Какой SQL-приём для этого предназначен?"
    type: single
    options:
      - id: a
        text: "UNION ALL исходной таблицы с новой партией данных"
        correct: false
        explanation: "UNION ALL просто складывает два набора строк без всякой сверки по ключу — если заказ уже был, он появится в результате дважды."
      - id: b
        text: "GROUP BY по всем колонкам таблицы заказов"
        correct: false
        explanation: "Группировка по всем колонкам схлопнет только строки, совпадающие буквально во всём — при малейшем расхождении в неключевом поле дубль по факту останется."
      - id: c
        text: "ORDER BY по дате загрузки с LIMIT на последнюю запись"
        correct: false
        explanation: "Сортировка с лимитом отбирает одну строку из общего результата запроса целиком, не различая дубли по отдельным ключам заказа."
      - id: d
        text: "MERGE или его аналог по ключу заказа"
        correct: true
        explanation: "MERGE (в PostgreSQL — INSERT ... ON CONFLICT) сравнивает входящие строки с уже имеющимися по ключу и обновляет совпавшие вместо создания дубля, в одной операции разводя insert и update."
    explanation: "MERGE — стандартный SQL-инструмент для upsert: по ключу сопоставления обновляет существующие строки и вставляет отсутствующие за один проход. Именно на нём строится большинство идемпотентных инкрементальных загрузок в dbt-моделях типа incremental."
    extended_explanation: "В dbt эта логика скрыта за материализацией `incremental` со стратегией `merge` — модель сама генерирует MERGE-запрос по указанному unique_key, не заставляя писать его руками на каждый инкрементальный проход."
    recommendation: "Посмотреть синтаксис MERGE в используемой СУБД и стратегию incremental в dbt-документации."
    difficulty: hard
    topics: [analytics]

  - id: q5
    text: "Инкрементальный пайплайн после ретрая записал часть заказов дважды с разными ID строк (не upsert, а plain append). Какая проверка на стороне dbt/аналитики поймает это раньше, чем заметят по цифрам в отчёте?"
    type: single
    options:
      - id: a
        text: "dbt-тест not_null на технический ID строки"
        correct: false
        explanation: "Технический ID у каждой строки свой по определению — проверка на null тут ничего не поймает, потому что оба дублирующих ряда имеют непустой ID."
      - id: b
        text: "Ручной визуальный просмотр таблицы в BI-инструменте раз в неделю"
        correct: false
        explanation: "Ручной просмотр не масштабируется и не гарантирует, что дубль вообще попадёт в поле зрения — это не автоматизированный контроль качества."
      - id: c
        text: "dbt-тест unique по бизнес-ключу заказа"
        correct: true
        explanation: "Тест на уникальность проверяет ровно то условие, которое нарушил дубль — что значение бизнес-ключа (например, order_number) встречается в таблице не больше одного раза."
      - id: d
        text: "Проверка типов колонок при компиляции модели"
        correct: false
        explanation: "Проверка типов ловит только несовпадение схемы данных — дублирование строк с корректным типом остаётся вне её зоны ответственности."
    explanation: "dbt-тесты (`unique`, `not_null`, `relationships`, `accepted_values`) запускаются как часть пайплайна и падают до того, как повреждённые данные доедут до BI-дашборда. Тест `unique` по бизнес-ключу — стандартный способ отловить именно дублирование строк."
    extended_explanation: "Такие тесты обычно вешают на staging-слой сразу после загрузки, а не только на финальную витрину — тогда ошибка обнаруживается на самом раннем шаге пайплайна, а не после нескольких трансформаций поверх уже испорченных данных."
    recommendation: "Прочитать про встроенные generic-тесты dbt: unique, not_null, relationships, accepted_values."
    difficulty: medium
    topics: [analytics]

  # ── Блок 2: Колоночные СУБД ──────────────────────────────────────────────

  - id: q6
    text: "Почему колоночное хранение данных ускоряет агрегирующие запросы вроде SUM или AVG по одной колонке из широкой таблицы?"
    type: single
    options:
      - id: a
        text: "Колоночные СУБД всегда держат все данные полностью в оперативной памяти"
        correct: false
        explanation: "Размер данных в аналитических системах обычно на порядки превышает доступную память — хранение на диске с эффективным чтением остаётся нормой."
      - id: b
        text: "Колоночные СУБД не пишут WAL и поэтому агрегации не ждут fsync"
        correct: false
        explanation: "Отсутствие WAL относится к durability записи — на скорость чтения при агрегации это свойство напрямую не влияет."
      - id: c
        text: "Движок читает с диска только нужную колонку, а не всю строку целиком"
        correct: true
        explanation: "Строковое хранение вынуждает прочитать каждую строку целиком ради одного поля; колоночное читает данные только той колонки, что участвует в агрегации."
      - id: d
        text: "Агрегация в колоночных СУБД всегда считается заранее и хранится как материализованное значение"
        correct: false
        explanation: "Предварительная материализация — отдельная техника (материализованные представления), существующая независимо от самого колоночного формата хранения."
    explanation: "Ключевое преимущество колоночного формата — I/O пропорционален числу задействованных колонок, а не ширине таблицы. Агрегация по одной колонке из таблицы с сотней полей читает с диска только эту колонку, плюс данные одного типа в колонке сжимаются заметно эффективнее, чем разнородная строка."
    extended_explanation: "Обратная сторона того же устройства — точечная выборка или обновление одной строки требует собрать значения из множества разрозненных колоночных файлов, что медленнее, чем в строковом хранилище, где вся строка физически лежит рядом на диске."
    recommendation: "Посмотреть, как устроено физическое хранение данных в ClickHouse (MergeTree) или Parquet."
    difficulty: medium
    topics: [analytics]

  - id: q7
    text: "Почему точечные UPDATE и DELETE в ClickHouse считаются дорогой операцией, в отличие от обычной OLTP-базы вроде PostgreSQL?"
    type: single
    options:
      - id: a
        text: "ClickHouse блокирует всю таблицу целиком на время выполнения любого запроса"
        correct: false
        explanation: "Полной блокировки таблицы на каждый запрос нет — причина дороговизны лежит в модели хранения и механизме мутаций."
      - id: b
        text: "Они реализованы как асинхронные мутации, перезаписывающие целые куски данных, а не изменяющие одну строку на месте"
        correct: true
        explanation: "Мутация в ClickHouse запускает фоновый процесс, переписывающий затронутые парты целиком — это на порядки тяжелее point update реляционной СУБД."
      - id: c
        text: "ClickHouse требует пересборки всех вторичных индексов после каждого изменения"
        correct: false
        explanation: "Дороговизна не сводится к индексам — она в самом устройстве хранения данных, где строка физически размазана по колоночным файлам."
      - id: d
        text: "В ClickHouse UPDATE и DELETE запрещены синтаксисом SQL"
        correct: false
        explanation: "Синтаксически такие запросы допустимы (ALTER TABLE UPDATE/DELETE) — вопрос именно в их дороговизне и асинхронном выполнении."
    explanation: "ClickHouse проектировался под массовую вставку и агрегацию, а не под точечные изменения. Данные физически лежат неизменяемыми кусками (partами), и мутация — это фактически пересборка затронутых партов в фоне, а не операция на месте. На больших таблицах это может занимать заметное время."
    extended_explanation: "На практике вместо точечного UPDATE чаще используют движки вроде ReplacingMergeTree или CollapsingMergeTree — они имитируют обновление через дедупликацию по ключу при фоновом слиянии партов, откладывая физическую перезапись на естественный процесс merge."
    recommendation: "Изучить механизм мутаций ALTER TABLE UPDATE/DELETE и альтернативные движки MergeTree-семейства."
    difficulty: hard
    topics: [analytics]

  - id: q8
    text: "В ClickHouse таблица объявлена с ORDER BY (tenant_id, event_date). Какой запрос выиграет от этого больше всего?"
    type: single
    options:
      - id: a
        text: "Подсчёт общего числа строк во всей таблице без фильтров"
        correct: false
        explanation: "Полный подсчёт без фильтра читает все данные целиком в любом случае — порядок сортировки тут не сокращает объём чтения."
      - id: b
        text: "JOIN этой таблицы с другой по колонке, не входящей в ORDER BY"
        correct: false
        explanation: "Отбор по колонке за пределами ключа сортировки не даёт движку опереться на физический порядок данных при поиске совпадений."
      - id: c
        text: "Выборка событий конкретного tenant_id за диапазон дат"
        correct: true
        explanation: "Ключ сортировки физически упорядочивает данные по этим колонкам — движок пропускает куски, заведомо не содержащие нужный tenant_id и диапазон дат."
      - id: d
        text: "Вставка новых строк в таблицу пачкой"
        correct: false
        explanation: "Скорость вставки определяется размером батча и числом партиций — порядок сортировки уже лежащих данных на неё почти не влияет."
    explanation: "ORDER BY в MergeTree — это не индекс в привычном смысле, а физический порядок хранения строк внутри парта. Запрос с условием по первым колонкам этого ключа позволяет движку сразу пропустить куски данных, где искомых значений заведомо нет (аналог zone maps / sparse index)."
    extended_explanation: "Порядок колонок в ключе важен: фильтр по первой колонке (tenant_id) эффективен всегда, а фильтр только по второй (event_date) без первой такого выигрыша почти не даёт — сортировка внутри произвольного tenant_id по датам движку недоступна для пропуска кусков."
    recommendation: "Прочитать про sparse index и принцип пропуска гранул в MergeTree-таблицах ClickHouse."
    difficulty: hard
    topics: [analytics]

  - id: q9
    text: "Таблица фактов о продажах партиционирована по месяцу (`PARTITION BY toYYYYMM(sale_date)`). Запрос фильтрует по конкретному месяцу. Что даёт такое партиционирование в первую очередь?"
    type: single
    options:
      - id: a
        text: "Партиционирование ускоряет JOIN с любыми другими таблицами вне зависимости от их ключа"
        correct: false
        explanation: "Ускорение JOIN не гарантируется партиционированием фактовой таблицы само по себе — оно зависит от того, участвует ли ключ партиции в условии соединения."
      - id: b
        text: "Партиционирование автоматически сжимает данные сильнее, чем без него"
        correct: false
        explanation: "Степень сжатия определяется кодеком и типами данных внутри колонок — сам факт разбиения таблицы на партиции на неё не влияет."
      - id: c
        text: "Партиционирование заменяет собой необходимость в ключе сортировки ORDER BY"
        correct: false
        explanation: "Это два независимых механизма — партиционирование отсекает крупные куски по границе (например, месяц), а сортировка работает уже внутри оставшихся данных."
      - id: d
        text: "Движок физически исключает из сканирования партиции, не подходящие под условие фильтра"
        correct: true
