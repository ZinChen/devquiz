    explanation: "Staging-слой берёт сырые таблицы источника и приводит их к консистентному виду — единые имена колонок, типы, базовая очистка — без применения бизнес-логики. Это буфер: если источник поменяет схему, чинить приходится только в одном месте, а не во всех моделях, которые на него ссылаются."
