  - id: q22
    text: "Отчёт по уникальным посетителям сайта за месяц считается как COUNT(DISTINCT user_id) по таблице с миллиардами событий и начинает упираться в память и время выполнения. Какой практический приём обычно применяют вместо точного подсчёта?"
    type: single
    options:
      - id: a
        text: "Приблизительный подсчёт кардинальности (HyperLogLog) вместо точного DISTINCT"
        correct: true
        explanation: "HyperLogLog оценивает число уникальных значений с контролируемой погрешностью, используя фиксированный объём памяти вместо хранения всех уникальных ID."
      - id: b
        text: "Замена DISTINCT на GROUP BY по тому же полю"
        correct: false
        explanation: "GROUP BY по сути требует той же работы по различению уникальных значений, что и DISTINCT — вычислительная нагрузка от такой замены не снижается."
      - id: c
        text: "Добавление ORDER BY user_id перед подсчётом"
        correct: false
        explanation: "Сортировка добавляет собственную вычислительную нагрузку поверх подсчёта и сама по себе не устраняет проблему точного различения уникальных значений."
      - id: d
        text: "Замена COUNT(DISTINCT ...) на COUNT(*) с последующим делением на два"
        correct: false
        explanation: "Деление на произвольную константу не имеет отношения к реальному числу уникальных значений — это не оценка, а угадывание без математического обоснования."
    explanation: "Точный COUNT(DISTINCT) на огромных объёмах требует хранить в памяти множество всех уникальных значений целиком. HyperLogLog — вероятностная структура данных, дающая оценку кардинальности с погрешностью около 1-2% при фиксированном и небольшом объёме памяти — типичный компромисс точности ради скорости в аналитике."
    extended_explanation: "Многие колоночные СУБД имеют встроенную функцию под этот паттерн: `uniqCombined` в ClickHouse, `APPROX_COUNT_DISTINCT` в BigQuery/Snowflake — то есть приём не требует писать HLL руками, он доступен как обычная агрегатная функция."
    recommendation: "Изучить структуру данных HyperLogLog и её встроенные реализации в используемой аналитической СУБД."
    difficulty: hard
    topics: [analytics]

