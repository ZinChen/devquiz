    explanation: "ref() — механизм, на котором держится весь граф зависимостей dbt: он и определяет порядок исполнения моделей, и на этапе компиляции подставляет правильное полное имя таблицы для текущего окружения (dev/prod схема). Прямое имя таблицы работало бы как обычный SQL, но лишило бы dbt возможности построить DAG и отследить lineage."
