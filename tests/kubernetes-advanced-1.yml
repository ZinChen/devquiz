- id: q1
  text: "В чём разница между liveness- и readiness-пробой?"
  type: single
  options:
  - id: a
    text: "Провал liveness перезапускает контейнер, провал readiness убирает под из балансировки"
    correct: true
    explanation: "Ключевая разница — readiness не трогает сам процесс, под просто временно не получает трафик."
  - id: b
    text: "Liveness проверяется один раз при старте пода, readiness — постоянно на протяжении жизни"
    correct: false
    explanation: "Обе пробы выполняются периодически на протяжении всей жизни пода."
  - id: c
    text: "Liveness проверяет состояние процесса, readiness — доступность узла кластера"
    correct: false
    explanation: "Readiness отвечает за готовность конкретного пода принимать трафик."
  - id: d
    text: "Liveness проверяет готовность к трафику, readiness — жив ли сам процесс"
    correct: false
    explanation: "Назначения проб перепутаны местами: за перезапуск при зависании процесса отвечает liveness, а за исключение из балансировки при неготовности — readiness."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Liveness отвечает на «жив ли процесс» — при провале Kubernetes перезапускает контейнер. Readiness отвечает на «готов ли принимать трафик» — при провале под исключается из сервиса, но продолжает работать. Классическая ошибка — повесить на liveness проверку доступности БД: база моргнула, и здоровые поды уходят в цикл перезапусков."
  extended_explanation: "startupProbe — третий вид, специально под медленный старт: пока она не прошла успешно, liveness и readiness не запускаются вовсе, что разводит конфликт между «дать время на прогрев» и «быстро реагировать на зависание в рабочем режиме». Без неё единственный выход — завышать initialDelaySeconds у liveness, замедляя реакцию на реальные зависания уже после старта."
  recommendation: "Изучить Kubernetes probes: liveness, readiness, startup — и типовые ошибки конфигурации."

- id: q2
  text: "Приложение регулярно получает OOMKilled. Что настроено неверно?"
  type: single
  options:
  - id: a
    text: "Не задан readinessProbe, и трафик приходит на под до его готовности"
    correct: false
    explanation: "Провал readinessProbe только убирает под из балансировки — контейнер продолжает работать своим процессом, не завершаясь и не перезапускаясь."
  - id: b
    text: "Limit по памяти установлен ниже реального потребления приложения"
    correct: true
    explanation: "Превышение memory limit приводит к немедленному завершению процесса ядром."
  - id: c
    text: "Не настроен HPA, и поды не масштабируются при росте нагрузки"
    correct: false
    explanation: "HPA управляет числом реплик и на лимит памяти отдельного пода не влияет."
  - id: d
    text: "Request по памяти задан выше limit, из-за чего планировщик не может разместить под"
    correct: false
    explanation: "Такую конфигурацию Kubernetes отвергнет на этапе валидации, до запуска пода."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Память и процессор ведут себя по-разному: превышение CPU-лимита вызывает throttling (замедление), превышение лимита памяти — немедленное завершение процесса. Отсюда практика ставить memory limit с запасом над реальным пиком, ориентируясь на данные мониторинга, а не на догадки."
  extended_explanation: "Разница особенно заметна при OOM killer: `dmesg` или `kubectl describe pod` покажут `OOMKilled` с кодом выхода 137, тогда как CPU throttling не убивает процесс вовсе — его можно увидеть только по метрике `container_cpu_cfs_throttled_periods_total`, без единого события в логах. Именно поэтому проблемы с CPU-лимитом обнаруживают заметно позже, чем OOM."
  recommendation: "Повторить разницу между CPU throttling и OOM kill при превышении ресурсных лимитов."

- id: q3
  text: "Что делает HPA и по каким метрикам он может масштабировать?"
  type: single
  options:
  - id: a
    text: "Перераспределяет поды между узлами для равномерной загрузки кластера"
    correct: false
    explanation: "Размещением подов по узлам занимается планировщик вместе с descheduler."
  - id: b
    text: "Меняет запрашиваемые ресурсы уже запущенных существующих подов"
    correct: false
    explanation: "Подбором requests и limits занимается VPA."
  - id: c
    text: "Меняет число реплик пода по CPU, памяти или собственным метрикам приложения"
    correct: true
    explanation: "Число подов меняется, но requests и limits каждого из них остаются прежними — это отличает HPA от VPA."
  - id: d
    text: "Добавляет новые узлы в кластер, когда подам некуда разместиться"
    correct: false
    explanation: "Узлы в кластер добавляет Cluster Autoscaler."
  difficulty: easy
  topics: [kubernetes]
  explanation: "HPA управляет количеством реплик. Вариант b описывает VPA — подбор requests и limits, вариант d — Cluster Autoscaler, добавляющий узлы. Три разных механизма, работающих на разных уровнях. Масштабирование по метрике приложения (например, запросов в секунду) обычно точнее, чем по CPU."
  extended_explanation: "Масштабирование по кастомной метрике требует адаптера метрик (Prometheus Adapter или аналог), который транслирует значение из Prometheus в формат Kubernetes custom/external metrics API — без него HPA умеет работать только с CPU и памятью из metrics-server. Настройка этого адаптера — отдельный источник проблем: метрика в HPA просто перестаёт обновляться, если запрос к Prometheus начинает падать."
  recommendation: "Сравнить HPA, VPA и Cluster Autoscaler — что каждый из них масштабирует."

- id: q4
  text: "Зачем при настройке HPA задают окно стабилизации (stabilizationWindowSeconds)?"
  type: single
  options:
  - id: a
    text: "Чтобы ограничить максимально допустимое время жизни одного пода"
    correct: false
    explanation: "Окно стабилизации влияет на решение о масштабировании, срок жизни пода задаётся иначе."
  - id: b
    text: "Чтобы отложить первый старт HPA на некоторое время после деплоя сервиса"
    correct: false
    explanation: "Задержка первого старта HPA после деплоя не связана с этим параметром."
  - id: c
    text: "Чтобы задать минимальный интервал времени между перезапусками подов"
    correct: false
    explanation: "Частоту перезапусков контролируют настройки проб и рестарт-политика."
  - id: d
    text: "Чтобы решение о масштабировании принималось по устойчивому изменению нагрузки"
    correct: true
    explanation: "Окно заставляет HPA смотреть на поведение метрики за отрезок времени и игнорировать одиночные всплески."
  difficulty: hard
  topics: [kubernetes]
  explanation: "Без окна стабилизации HPA дёргает число реплик на каждом колебании метрики: поды поднимаются, не успевают прогреться, тут же удаляются. Окно заставляет учитывать поведение метрики на отрезке времени. Обычно окно на уменьшение делают заметно длиннее, чем на увеличение — расти лучше быстро, сжиматься осторожно."
  extended_explanation: "Асимметрия обычно выглядит так: scaleUp почти без окна (0–60 секунд) — нагрузка растёт, нужно реагировать быстро, а scaleDown с окном в 5 минут и больше — чтобы кратковременный спад не привёл к удалению подов, которые снова понадобятся через минуту. Слишком агрессивный scaleDown без окна — частая причина флаппинга числа реплик на волнообразной нагрузке."
  recommendation: "Изучить параметры HPA: stabilizationWindowSeconds, поведение scale-up/scale-down."

- id: q5
  text: "Rolling update выкатывает новую версию, где миграция удаляет колонку. Что пойдёт не так?"
  type: single
  options:
  - id: a
    text: "Старые и новые поды работают одновременно, и старый код обратится к удалённой колонке"
    correct: true
    explanation: "Именно совмещение версий во время выката и есть источник сбоя, а не сама по себе миграция."
  - id: b
    text: "Kubernetes автоматически откатит назад весь деплой при первой же ошибке в логах"
    correct: false
    explanation: "Kubernetes не откатывает деплой автоматически по ошибкам в логах приложения."
  - id: c
    text: "Ничего не произойдёт, если у деплоймента заранее настроен maxUnavailable: 0"
    correct: false
    explanation: "maxUnavailable управляет тем, сколько подов можно погасить разом, совместимость схемы с кодом остаётся на разработчике."
  - id: d
    text: "Миграция попросту не выполнится, пока работает хотя бы один старый под сервиса"
    correct: false
    explanation: "Миграция выполняется независимо от того, сколько подов ещё работает со старой версией."
  difficulty: hard
  topics: [kubernetes, migrations]
  explanation: "Rolling update по определению держит обе версии одновременно. Отсюда правило expand/contract: сначала выкатывается код, не использующий колонку, и только следующим релизом она удаляется. То же в обратную сторону — сначала добавить колонку и научиться с ней работать, потом начать писать. Ещё одна причина не делать необратимых миграций — невозможность отката."
  extended_explanation: "Симметричная проблема возникает и при добавлении NOT NULL колонки без default: старый код продолжает делать INSERT без этого поля, и вставка падает уже на уровне БД, а не на уровне приложения. Поэтому колонку сначала добавляют nullable, заполняют существующие строки отдельной миграцией, и только третьим шагом навешивают NOT NULL."
  recommendation: "Прочитать про паттерн expand/contract для безопасных миграций схемы при rolling deploy."

- id: q6
  text: |-
    В Helm values.yaml один сервис описан так:

    ```yaml
    resources:
      requests:
        cpu: "100m"
        memory: "1.5Gi"
      limits:
        cpu: 1.5
        memory: "3Gi"
    ```

    Сколько ядер CPU запрошено (requests) для этого пода?
  type: single
  options:
  - id: a
    text: "100 ядер — суффикс m здесь читается как множитель"
    correct: false
    explanation: "Суффикс «m» происходит от milli — приставки для тысячной доли: «100m» равно 0.1 ядра."
  - id: b
    text: "0.1 ядра — сотая часть от тысячи миллиCPU в одном целом ядре"
    correct: true
    explanation: "100m — 100 milliCPU, то есть 0.1 ядра. Суффикс «m» обозначает тысячные доли ядра, а не миллисекунды или мегабайты."
  - id: c
    text: "1 ядро — как если бы суффикс m в значении просто отсутствовал"
    correct: false
    explanation: "Единица без суффикса и есть целое ядро — «100m» без указания суффикса выглядело бы как «1»."
  - id: d
    text: "1.5 ядра — значение из requests проигнорируется"
    correct: false
    explanation: "1.5 — это значение limits.cpu, отдельное поле с отдельным числом; requests.cpu задано явно как 100m."
  difficulty: easy
  topics: [kubernetes]
  explanation: "CPU в Kubernetes измеряется в целых ядрах или миллиCPU (m) — тысячных долях ядра. «100m» и «0.1» — два равнозначных способа записать одну и ту же величину, просто разный формат числа."
  extended_explanation: "Та же двойственность форматов видна и в этом примере: limits.cpu задан как «1.5» (дробное число без кавычек), а requests.cpu — как «100m» (строка с суффиксом). Kubernetes принимает оба варианта одинаково — выбор формата дело вкуса автора чарта, а не правило."
  recommendation: "Прочитать про единицы измерения ресурсов в Kubernetes: CPU (m/ядра) и память (Ki/Mi/Gi vs K/M/G)."

- id: q7
  text: "В том же values.yaml `memory: \"750Mi\"`. Чем Mi отличается от M в записи объёма памяти Kubernetes?"
  type: single
  options:
  - id: a
    text: "Mi округляет значение вверх до ближайшего целого мегабайта, M — хранит точное дробное значение"
    correct: false
    explanation: "Ни один из суффиксов не занимается округлением — оба задают точное число байт по своей системе счисления, разница между ними в основании (1024 против 1000), а не в точности хранения."
  - id: b
    text: "Kubernetes сам нормализует Mi в M при сохранении объекта, так что на итоговое поведение суффикс не влияет"
    correct: false
    explanation: "Kubernetes хранит и применяет значение именно в том суффиксе, в котором оно указано в манифесте — никакой автоматической нормализации между двоичными и десятичными единицами не происходит."
  - id: c
    text: "Mi — двоичная единица, M — десятичная, они дают разное число байт при одинаковом числовом множителе"
    correct: true
    explanation: "Mi — это 2^20 байт, M — 10^6 байт: 750Mi ≈ 786 432 000 байт, а 750M — ровно 750 000 000 байт, разница не в опечатке, а в системе счисления суффикса."
  - id: d
    text: "Это два способа написать один и тот же объём, разница только в стиле"
    correct: false
    explanation: "Mi и M дают разное число байт при одинаковом числовом множителе — это не стилистическая, а количественная разница."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Kubernetes поддерживает и двоичные (Ki, Mi, Gi — степени 1024), и десятичные (K, M, G — степени 1000) суффиксы для величин памяти и хранилища. При одном и том же числовом множителе они дают разный итоговый объём байт — перепутать суффикс в конфиге значит незаметно занизить или завысить реальный лимит."
  extended_explanation: "На больших значениях расхождение становится заметным: 1Gi ≈ 1.074 ГБ в привычном десятичном счислении, то есть почти на 7.4% больше, чем 1G. При планировании capacity на много подов эта разница накапливается в ощутимый объём."
  recommendation: "Свериться с таблицей суффиксов Kubernetes Resource Units: Ki/Mi/Gi (binary) vs K/M/G (decimal)."

- id: q8
  text: |-
    В Helm-чарте для прод-окружения задано:

    ```yaml
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: sidekiq-inbox
        maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
    ```

    Что делает эта конструкция?
  type: single
  options:
  - id: a
    text: "Ограничивает время ожидания планировщика перед тем как отказаться от размещения пода"
    correct: false
    explanation: "Таймаут планирования — отдельный механизм, не связанный с topologySpreadConstraints."
  - id: b
    text: "Запрещает планировщику размещать больше 2 реплик суммарно на весь кластер"
    correct: false
    explanation: "Общее число реплик — это отдельное поле replicas у Deployment; topologySpreadConstraints работает уже над готовым набором подов, определяя только их распределение по узлам."
  - id: c
    text: "Требует размещать все поды сервиса строго на одном физическом узле"
    correct: false
    explanation: "Совместное размещение на одном узле задаётся через podAffinity; topologySpreadConstraints решает противоположную задачу — растягивает поды по разным узлам."
  - id: d
    text: "Не даёт разнице в числе подов между самым загруженным и самым свободным узлом превышать 2"
    correct: true
    explanation: "maxSkew — количественный порог допустимого перекоса распределения подов между узлами/зонами по указанному topologyKey."
  difficulty: hard
  topics: [kubernetes]
  explanation: "topologySpreadConstraints равномерно распределяет поды по заданному топологическому измерению (узел, зона доступности и т.д.), а maxSkew — допустимая разница в количестве подов между самым нагруженным и самым свободным элементом этого измерения. Смысл — защита от скученности реплик на одном узле, где отказ узла заберёт с собой сразу все копии сервиса."
  extended_explanation: "whenUnsatisfiable определяет строгость: ScheduleAnyway — мягкое поведение (best effort, разместить всё равно, даже нарушив maxSkew, если больше некуда), DoNotSchedule — жёсткое (под вообще не запланируется, пока условие не выполнится). Это отличает конструкцию от anti-affinity, которая про совместное/раздельное размещение с конкретными подами по метке, а не про количественную равномерность."
  recommendation: "Сравнить topologySpreadConstraints и podAntiAffinity — оба про распределение подов, но с разной механикой."

- id: q9
  text: "Сервис-обработчик очереди сообщений (inbox-паттерн) не успевает разгребать входящий поток, хотя CPU-утилизация подов держится на низком уровне. Обычный HPA по CPU не масштабирует сервис вовремя. Какое решение подойдёт лучше всего?"
  type: single
  options:
  - id: a
    text: "Настроить HPA по кастомной метрике — например, глубине очереди/лагу обработки — через адаптер метрик"
    correct: true
    explanation: "Custom-метрика напрямую отражает реальное узкое место (накопление необработанных сообщений), в отличие от CPU, который в этом сценарии остаётся низким."
  - id: b
    text: "Поднять minReplicas HPA по CPU до максимально возможного значения"
    correct: false
    explanation: "HPA по CPU продолжит ориентироваться на утилизацию процессора, которая в этом сценарии низкая — завышенный minReplicas просто держит лишние поды постоянно, не решая первопричину."
  - id: c
    text: "Настроить VPA (Vertical Pod Autoscaler) вместо HPA, чтобы каждый под получал больше CPU при росте очереди"
    correct: false
    explanation: "VPA подбирает requests/limits по фактическому потреблению ресурсов конкретного пода — но CPU-утилизация в этом сценарии и так низкая, поэтому VPA не увеличит ресурсы и тем более не добавит новые реплики для параллельной обработки очереди."
  - id: d
    text: "Перевести HPA на масштабирование по метрике памяти вместо CPU"
    correct: false
    explanation: "Память подов в этом сценарии не описана как узкое место — переключение на неё не гарантирует масштабирование при росте очереди."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Когда реальное узкое место — не CPU/память, а бизнес-метрика вроде размера очереди или лага консьюмера, штатных ресурсных метрик недостаточно. HPA поддерживает `customRules` с типом `Pods` — метрикой на под, значение которой сравнивается с целевым `averageValue`, точно так же в миллиформате, как и у CPU."
  extended_explanation: "Источник такой метрики — Prometheus (или совместимое хранилище вроде Victoria Metrics) через Prometheus Adapter, транслирующий значение в Kubernetes custom metrics API. Без него HPA умеет работать только с CPU/памятью из metrics-server — настройка адаптера часто становится отдельным источником проблем: если запрос к Prometheus начинает падать, метрика в HPA просто перестаёт обновляться, без явной ошибки."
  recommendation: "Прочитать про HPA customRules с type: Pods и настройку Prometheus Adapter для внешних метрик."

- id: q10
  text: "Нужно гарантированно остановить всех consumer-подов сервиса на время планового обслуживания, а не постепенно перекатить их с сохранением части работающих реплик. Какая команда для этого подходит?"
  type: single
  options:
  - id: a
    text: "kubectl rollout restart deployment/kafka-consumer"
    correct: false
    explanation: "rollout restart — это rolling-перезапуск: часть старых подов остаётся работать, пока новые не станут готовы — сервис не останавливается полностью ни на секунду, что здесь и не нужно, и не то, что просят."
  - id: b
    text: "kubectl scale deployment/kafka-consumer --replicas=0"
    correct: true
    explanation: "Масштабирование до нуля реплик — единственный из перечисленных способов гарантированно остановить абсолютно все поды сервиса одновременно."
  - id: c
    text: "kubectl delete pod -l app=kafka-consumer --grace-period=0"
    correct: false
    explanation: "Deployment контроллер сразу пересоздаст удалённые поды заново — количество реплик в спецификации не изменилось, остановка будет лишь мгновенной."
  - id: d
    text: "kubectl set image deployment/kafka-consumer app=kafka-consumer:paused"
    correct: false
    explanation: "Смена образа контейнера запускает обычный rolling update на новую версию, а не полную остановку сервиса."
  difficulty: medium
  topics: [kubernetes]
  explanation: "kubectl rollout restart создан для zero-downtime перезапуска — он сохраняет часть реплик работающими, пока новые не готовы, поэтому не даёт полной остановки. Масштабирование до нуля реплик гарантированно убирает все поды сервиса, а последующее возвращение к прежнему числу реплик поднимает их заново с чистого состояния."
  extended_explanation: "На практике это распространённый способ форс-перезапуска консьюмеров, которым нужно гарантированно переподключиться к брокеру или сбросить внутреннее состояние — `kubectl scale ... --replicas=0`, затем, после паузы, `--replicas=N` возвращает сервис к работе уже с чистого листа, а не поэтапно поверх старых подов."
  recommendation: "Различать zero-downtime операции (rollout restart, rolling update) и операции полной остановки (scale --replicas=0) — они решают разные задачи."

- id: q11
  text: "Сервис баз данных развёрнут как StatefulSet с headless-сервисом `postgres-headless`. Как называется полное DNS-имя второй по счёту реплики (индекс 1) внутри namespace `data`?"
  type: single
  options:
  - id: a
    text: "postgres-headless.data.svc.cluster.local"
    correct: false
    explanation: "Такое имя резолвится в сам headless-сервис (без ClusterIP), а не в конкретную именованную реплику пода."
  - id: b
    text: "postgres-headless.postgres-1.data.svc.cluster.local"
    correct: false
    explanation: "Порядок компонентов перепутан — имя конкретного пода идёт первым, перед именем сервиса, а не наоборот."
  - id: c
    text: "postgres-1.postgres-headless.data.svc.cluster.local"
    correct: true
    explanation: "Схема DNS-имени пода при headless-сервисе: [имя-пода].[имя-сервиса].[namespace].svc.cluster.local, где имя пода StatefulSet — это имя StatefulSet плюс порядковый индекс."
  - id: d
    text: "data.postgres-1.postgres-headless.svc.cluster.local"
    correct: false
    explanation: "Namespace указывается перед svc.cluster.local, а не в начале имени — порядок компонентов здесь неверный."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Headless-сервис (без выделенного ClusterIP) даёт возможность резолвить DNS-имя каждого конкретного пода StatefulSet отдельно, а не только имя сервиса в среднем по кластеру. Индекс 1 соответствует второй реплике (нумерация с нуля), и полное имя строится по схеме под.сервис.namespace.svc.cluster.local."
  extended_explanation: "Именно поэтому StatefulSet почти всегда идёт в паре с headless-сервисом — для баз данных и других кластеров с ролями (мастер/реплика) важно обращаться к конкретному стабильно именованному поду напрямую (например, писать строго в мастер), а не к случайному поду за балансировкой обычного ClusterIP-сервиса."
  recommendation: "Прочитать про StatefulSet и headless Service — схему DNS-имён и зачем она нужна для БД-кластеров."

- id: q12
  text: "Чем принципиально отличается Deployment от прямого редактирования созданного им ReplicaSet?"
  type: single
  options:
  - id: a
    text: "ReplicaSet работает только со StatefulSet, а Deployment — только с обычными подами без хранилища"
    correct: false
    explanation: "ReplicaSet используется именно Deployment'ом, к StatefulSet отношения не имеет — у StatefulSet своя собственная модель управления подами."
  - id: b
    text: "ReplicaSet поддерживает rolling update и rollback, а Deployment — только мгновенную замену всех подов разом"
    correct: false
    explanation: "Rolling update и история версий для отката принадлежат именно Deployment — ReplicaSet сам по себе умеет только поддерживать заданное число реплик по неизменному шаблону."
  - id: c
    text: "ReplicaSet напрямую управляет обновлением образа контейнера, а Deployment лишь передаёт ему команду о новой версии"
    correct: false
    explanation: "ReplicaSet работает с неизменным шаблоном пода и не занимается сменой версий — именно Deployment решает, когда создать новый ReplicaSet с обновлённым шаблоном и как переключаться между старым и новым."
  - id: d
    text: "Deployment при изменении шаблона пода создаёт новый ReplicaSet и управляет переключением, тогда как правка существующего ReplicaSet не даёт rolling update"
    correct: true
    explanation: "Deployment — контроллер поверх ReplicaSet: именно он отвечает за постепенное переключение трафика между старой и новой версией и хранит историю для отката."
  difficulty: medium
  topics: [kubernetes]
  explanation: "ReplicaSet отвечает только за поддержание заданного числа запущенных реплик пода по неизменному шаблону. Deployment — более высокий уровень абстракции: при изменении шаблона пода он создаёт новый ReplicaSet, постепенно масштабирует его вверх, а старый — вниз до нуля (не удаляя сразу, чтобы можно было откатиться)."
  extended_explanation: "Прямое редактирование ReplicaSet в обход Deployment обходит эту логику полностью: контроллер ReplicaSet просто пересоздаст поды по новому шаблону без постепенного rolling-перехода и без сохранения истории версий для `kubectl rollout undo`."
  recommendation: "Посмотреть вывод `kubectl get replicasets` после нескольких деплоев — видно, как Deployment оставляет историю старых ReplicaSet с нулевым числом реплик."

- id: q13
  text: "Приложение хранит в Kubernetes Secret пароль от базы данных. Что из перечисленного верно про защиту этих данных?"
  type: single
  options:
  - id: a
    text: "Значение в Secret хранится в base64 — это кодирование, а не шифрование, и само по себе не защищает данные"
    correct: true
    explanation: "base64 тривиально обратим без какого-либо ключа — любой, у кого есть доступ на чтение Secret через API, восстановит исходное значение мгновенно."
  - id: b
    text: "Kubernetes всегда шифрует Secret AES-ключом, уникальным для каждого namespace"
    correct: false
    explanation: "Шифрование данных Secret at rest в etcd — опциональная настройка кластера (EncryptionConfiguration), а не встроенное поведение по умолчанию для каждого namespace."
  - id: c
    text: "Secret недоступен через kubectl get даже пользователю с правами на чтение ресурсов namespace"
    correct: false
    explanation: "Пользователь с правом get/list на secrets в namespace получит значение как обычный ресурс API — базовое RBAC не даёт Secret какой-то особой скрытности по умолчанию."
  - id: d
    text: "Secret и ConfigMap физически хранятся в разных, изолированных хранилищах кластера"
    correct: false
    explanation: "Оба ресурса хранятся в одном и том же etcd наравне с остальными объектами API — разница между ними в назначении и в том, что Secret рассчитан на чувствительные данные, а не в физическом расположении."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Kubernetes Secret по умолчанию хранит значения в base64 — это способ представления бинарных данных текстом, не средство защиты. Реальная защита требует дополнительных мер: шифрования etcd at rest, ограничения RBAC-доступа к ресурсу secrets, а на практике часто — внешних систем вроде Vault или Sealed Secrets."
  extended_explanation: "Отсюда практическое следствие: `kubectl get secret my-secret -o jsonpath='{.data.password}' | base64 -d` восстанавливает исходный пароль без всяких прав выше обычного read-доступа к ресурсу — Secret защищает от случайного попадания пароля в код или Git, но не от того, кто уже имеет доступ к API кластера."
  recommendation: "Изучить EncryptionConfiguration для etcd at rest и инструменты внешнего управления секретами (Vault, Sealed Secrets, External Secrets Operator)."

- id: q14
  text: "Чем Ingress принципиально отличается от Service типа LoadBalancer с точки зрения маршрутизации трафика?"
  type: single
  options:
  - id: a
    text: "Ingress работает только внутри кластера, а LoadBalancer — единственный способ пустить внешний трафик"
    correct: false
    explanation: "Ingress создан именно для маршрутизации внешнего трафика к сервисам внутри кластера — его основная ценность в том, что он экономит внешние IP-адреса, разводя много сервисов через один вход."
  - id: b
    text: "Ingress маршрутизирует на уровне HTTP, LoadBalancer — на уровне проброса порта без разбора содержимого запроса"
    correct: true
    explanation: "Ingress работает на седьмом уровне модели OSI и умеет направлять запросы к разным сервисам по домену или пути (host/path) внутри одного входного адреса, при необходимости терминируя TLS; LoadBalancer работает ниже, просто пробрасывая порт целиком."
  - id: c
    text: "LoadBalancer поддерживает несколько бэкенд-сервисов на одном порту, а Ingress — только один"
    correct: false
    explanation: "Маршрутизация по host/path к разным сервисам через единый вход — функциональность именно Ingress; LoadBalancer типично направлен на один конкретный Service."
  - id: d
    text: "Ingress вытесняется новым ресурсом Gateway API, поэтому LoadBalancer — единственный актуальный способ маршрутизации сегодня"
    correct: false
    explanation: "Gateway API — действительно более новый и гибкий подход к маршрутизации, постепенно приходящий на смену Ingress, но заменяет он именно Ingress, а не выводит на первый план LoadBalancer — HTTP-маршрутизация остаётся отдельной задачей, которую LoadBalancer не решает ни в каком из двух подходов."
  difficulty: medium
  topics: [kubernetes]
  explanation: "Сам по себе ресурс Ingress не выполняет маршрутизацию — нужен Ingress Controller (nginx-ingress, Traefik и другие), который читает правила Ingress и реализует их. Ключевое отличие от Service LoadBalancer в уровне работы: Ingress понимает HTTP-запрос (домен, путь, может терминировать TLS) и направляет его к нужному Service внутри кластера, а LoadBalancer лишь пробрасывает порт целиком к одному Service."
  extended_explanation: "Практическое следствие: один Ingress с одним внешним IP/балансировщиком может обслуживать десятки разных сервисов по разным доменам или путям, тогда как Service LoadBalancer типично создаёт отдельный внешний адрес на каждый сервис — заметно дороже и менее гибко на масштабе."
  recommendation: "Развернуть локально nginx-ingress-controller и настроить простое правило маршрутизации по path для двух сервисов — разница станет наглядной."

- id: q15
  text: "Под из StatefulSet был удалён и Kubernetes пересоздал его заново на том же месте в наборе. Что произойдёт с данными на его PersistentVolumeClaim?"
  type: single
  options:
  - id: a
    text: "Данные копируются на новый случайный узел кластера перед стартом нового пода"
    correct: false
    explanation: "PersistentVolume физически остаётся там же, где был — никакого автоматического копирования данных на другой узел при обычном пересоздании пода не происходит."
  - id: b
    text: "PVC удаляется автоматически вместе с подом, и новый под стартует с пустым хранилищем"
    correct: false
    explanation: "PVC в StatefulSet по умолчанию не удаляется при удалении пода — именно сохранение данных между пересозданиями и есть основная причина использовать StatefulSet вместо Deployment."
  - id: c
    text: "PVC сохраняется и переиспользуется — новый под с тем же порядковым именем получает те же данные"
    correct: true
    explanation: "StatefulSet связывает PVC с конкретным порядковым индексом пода, а не с конкретным экземпляром контейнера — при пересоздании пода Kubernetes подключает тот же самый существующий PVC."
  - id: d
    text: "Kubernetes создаёт новый PVC с новым именем, а старый остаётся висеть неиспользуемым"
    correct: false
    explanation: "Имя PVC для StatefulSet детерминировано порядковым индексом пода — новый под с тем же индексом обращается по тому же самому имени, а не создаёт новый PVC."
  difficulty: hard
  topics: [kubernetes]
  explanation: "В отличие от Deployment, где под — взаимозаменяемая единица без индивидуального состояния, StatefulSet даёт каждой реплике стабильное порядковое имя и персональный PVC, который переживает пересоздание пода. Именно эта связка (стабильное имя + сохраняемое хранилище + предсказуемый DNS через headless-сервис) делает StatefulSet пригодным для баз данных и других сервисов с состоянием."
  extended_explanation: "PVC действительно можно удалить — но это отдельное, явное действие: сам StatefulSet при обычном удалении/пересоздании пода PVC не трогает. Полная очистка хранилища требует либо ручного `kubectl delete pvc`, либо (в новых версиях Kubernetes) настройки `persistentVolumeClaimRetentionPolicy` прямо в спецификации StatefulSet."
  recommendation: "Прочитать про volumeClaimTemplates в StatefulSet и persistentVolumeClaimRetentionPolicy — как управляется жизненный цикл PVC отдельно от пода."
