        explanation: "Все анаграммы одного слова после сортировки своих букв дают одинаковую строку-ключ — это и есть та самая ситуация, где нужно самостоятельно решить, что взять ключом (канонический вид слова), а не применять готовый шаблон подсчёта частот или KVVK."
      - id: c
        text: "Техника подсчёта — посчитать общее число анаграмм в списке одним числом"
        correct: false
        explanation: "Технику подсчёта используют, когда конечный ответ — вывод по частотам (число/факт), а здесь нужно сгруппировать сами слова в отдельные группы — другая по сути задача."
      - id: d
        text: "KVVK — инвертировать пары «слово → длина» в «длина → список слов»"
        correct: false
        explanation: "KVVK решает задачи сортировки/топ-K по частоте; сама длина слова, как и в варианте b, не является надёжным критерием принадлежности к одной группе анаграмм."
    explanation: "Эта задача — пример третьего, неформализованного принципа темы хеш-таблиц: нужно самостоятельно придумать подходящий ключ по смыслу задачи. Канонический вид слова (например, его отсортированные буквы) одинаков для всех анаграмм друг друга и служит естественным ключом для их группировки."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n × k log k) по времени, где n — число слов,
      k — средняя длина слова (сортировка каждого слова для получения
      ключа), O(n × k) по памяти на хранение всех слов и ключей.

      ```
      groups = Hash.new { |h, k| h[k] = [] }
      words.each do |word|
        key = word.chars.sort.join
        groups[key] << word
      end
      groups.values
      ```
    recommendation: "При выборе ключа для хеш-таблицы искать инвариант — свойство, которое одинаково для всех элементов, которые нужно сгруппировать вместе."

  - id: q15
    text: "В задаче про строки нужно найти самую короткую подстроку исходной строки, которая содержит все символы другой заданной строки (с учётом повторов). Какие два паттерна из разных тем здесь стоит скомбинировать?"
    type: single
    options:
      - id: a
        text: "Окно фиксированной длины (равной длине второй строки) плюс KVVK для сравнения наборов символов на каждом шаге"
        correct: false
        explanation: "Искомая подстрока может быть длиннее второй строки, если нужные символы в исходной строке разбросаны — фиксированная длина окна не гарантирует нахождение корректного ответа, здесь нужна переменная длина."
      - id: b
        text: "Два указателя «каждому по указателю» (по одному на каждую строку) плюс KVVK для сортировки совпадений по частоте"
        correct: false
        explanation: "«Каждому по указателю» применяется к двум отдельным структурам, синхронно продвигаемым по своим последовательностям — но здесь нужно гибко расширять и сужать одно окно внутри одной строки, а не синхронно двигать два независимых указателя по двум строкам; а сортировка по частоте (KVVK) вообще не нужна для проверки самого факта «все символы набраны»."
      - id: c
        text: "Пересекающееся окно (минимальная длина со свойством) плюс техника подсчёта (проверка набора символов)"
        correct: true
        explanation: "«Самая короткая подстрока с заданным свойством» — маркер пересекающегося окна; а свойство «содержит все нужные символы с учётом повторов» естественно проверяется через частотный словарь (технику подсчёта), сравнивающий частоты символов в текущем окне с требуемыми."
      - id: d
        text: "Непересекающиеся окна (разбить строку на блоки длины второй строки) плюс техника подсчёта для каждого блока"
        correct: false
        explanation: "Непересекающиеся окна годятся, когда каждый элемент принадлежит ровно одной группе — здесь же искомая подстрока может начинаться в любой позиции и пересекаться с соседними блоками, разбиение на непересекающиеся куски пропустит корректный ответ."
    explanation: "Ещё один пример комбинации паттернов из разных тем: структура решения (минимальная длина подстроки со свойством) берётся из темы плавающего окна, а сам критерий свойства (все нужные символы присутствуют в нужном количестве) проверяется техникой подсчёта — частотным словарём, сравниваемым на каждом шаге сужения/расширения окна."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n + m) по времени, где n — длина исходной
      строки, m — длина строки с требуемыми символами (построение
      начального частотного словаря по ней), O(k) по памяти, где k —
      размер алфавита.

      ```
      need = Hash.new(0)
      pattern.each_char { |ch| need[ch] += 1 }
      missing = need.size
      left, best = 0, nil
      str.each_char.with_index do |ch, right|
        need[ch] -= 1 if need.key?(ch)
        missing -= 1 if need[ch] == 0
        while missing == 0
          best = [left, right] if best.nil? || right - left < best[1] - best[0]
          need[str[left]] += 1 if need.key?(str[left])
          missing += 1 if need[str[left]] == 1
          left += 1
        end
      end
      ```
    recommendation: "При виде формулировки «минимальная/максимальная подстрока/подмассив со сложным условием» проверять, не раскладывается ли задача на «структура поиска — из темы окна» плюс «проверка условия — из темы хеш-таблиц»."
