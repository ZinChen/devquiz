    explanation: "Формулировка про подмассивы с заданным свойством (здесь — число уникальных элементов) — сигнал пересекающегося окна; хеш-таблица используется как вспомогательная структура для быстрого отслеживания состояния окна по мере расширения и сужения его границ."
    topics: [algorithms]
    extended_explanation: |
      Практический приём для задач вида «ровно k» (а не «не более k»):
      посчитать число подмассивов с «не более k» уникальных элементов и
      вычесть число подмассивов с «не более k-1» — разность и даёт
      ответ «ровно k», что сводит более сложную задачу к двум
      применениям уже знакомого паттерна «не более k».

      ```
      def at_most_k(arr, k)
        count, left, freq = 0, 0, Hash.new(0)
        arr.each_index do |right|
          freq[arr[right]] += 1
          while freq.size > k
            freq[arr[left]] -= 1
            freq.delete(arr[left]) if freq[arr[left]] == 0
            left += 1
          end
          count += right - left + 1
        end
        count
      end
      exactly_k = at_most_k(arr, k) - at_most_k(arr, k - 1)
      ```
    recommendation: "Задачи с формулировкой «ровно k» часто удобнее решать как разность двух задач «не более k» и «не более k-1», а не искать для них отдельный паттерн с нуля."

