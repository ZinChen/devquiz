slug: algorithm-arrays-strings-1
title: "Алгоритмы: паттерны на массивах и строках"
description: "Паттерны решения задач на линейных структурах: два указателя, плавающее окно, применение хеш-таблиц для подсчёта частот и топ-K."
tags: [algorithms, claude-gen]
difficulty: advanced
estimated_time: 25

questions:
  - id: q1
    text: "Дан отсортированный массив и число target — нужно найти индексы двух элементов, сумма которых равна target. Как это решить за O(n) без дополнительной памяти под хеш-таблицу?"
    type: single
    options:
      - id: a
        text: "Два указателя на начало и конец, двигать их навстречу в зависимости от того, больше или меньше текущая сумма, чем target"
        correct: true
        explanation: "Раз массив отсортирован, можно сразу оценить, в какую сторону двигать границы: если сумма больше target — правый указатель влево (уменьшить сумму), если меньше — левый вправо (увеличить). Указатели идут навстречу и суммарно проходят массив один раз."
      - id: b
        text: "Перебрать все пары индексов вложенным циклом и проверить сумму каждой"
        correct: false
        explanation: "Полный перебор пар даёт O(n²) — значительно медленнее, чем позволяет отсортированность массива."
      - id: c
        text: "Отсортировать массив заново по возрастанию суммы соседних пар"
        correct: false
        explanation: "Массив уже отсортирован по значениям элементов — пересортировка по искусственному критерию не имеет смысла и не помогает решить задачу."
      - id: d
        text: "Применить бинарный поиск для каждого элемента отдельно, ища пару target минус элемент"
        correct: false
        explanation: "Формально рабочий подход даёт O(n log n), что хуже линейного решения через два указателя — оно доступно именно благодаря отсортированности массива."
    explanation: "Классический паттерн «два указателя с двух сторон»: указатели стартуют на границах отсортированного массива и двигаются навстречу друг другу, сужая область поиска на каждом шаге за счёт сравнения текущей суммы с целью."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени (каждый указатель проходит свою
      часть массива максимум один раз, суммарно не больше n шагов), O(1)
      по памяти — в отличие от альтернативного решения через хеш-таблицу
      (O(n) по времени и по памяти, но работает и для неотсортированного
      массива).

      ```
      left, right = 0, arr.length - 1
      while left < right
        sum = arr[left] + arr[right]
        return [left, right] if sum == target
        sum > target ? right -= 1 : left += 1
      end
      ```
    recommendation: "Сравнить с задачей проверки палиндрома — тот же паттерн «с двух сторон», но сравнение вместо суммы: зеркальные позиции должны совпадать."

  - id: q2
    text: "Даны два отдельных отсортированных массива, нужно найти их общие элементы (пересечение). Какой вариант паттерна «два указателя» здесь применим?"
    type: single
    options:
      - id: a
        text: "«С двух сторон» — указатели на начало и конец одного объединённого массива"
        correct: false
        explanation: "Паттерн «с двух сторон» работает с одним массивом и указателями, движущимися навстречу — здесь же две отдельные структуры, для которых нужен другой вариант паттерна."
      - id: b
        text: "«Каждому по указателю» — по указателю с начала каждого массива, двигать указатель меньшего элемента"
        correct: true
        explanation: "Раз даны именно два отдельных массива, естественно завести независимый указатель на каждый: элементы сравниваются, указатель с меньшим значением двигается вперёд, а при совпадении — элемент идёт в ответ и двигаются оба указателя."
      - id: c
        text: "«Быстрый и медленный» — оба указателя по первому массиву с разной скоростью"
        correct: false
        explanation: "Паттерн «быстрый и медленный» применяется для in-place модификации одной структуры, а не для сравнения двух разных массивов между собой."
      - id: d
        text: "Один указатель, последовательно ищущий каждый элемент первого массива бинарным поиском во втором"
        correct: false
        explanation: "Рабочий вариант, но с оценкой O(n log m), что хуже линейного решения через синхронное движение двух указателей — O(n+m)."
    explanation: "Наличие именно двух (или более) независимых массивов/строк — прямой сигнал варианта «каждому по указателю»: указатели по каждой структуре двигаются независимо, синхронизируясь по сравнению текущих значений."
    topics: [algorithms]
    extended_explanation: |
      Тот же вариант паттерна решает и слияние двух отсортированных
      массивов в один — разница лишь в том, что при несовпадении
      элементов в ответ идёт не пересечение, а оба значения по очереди
      согласно их порядку. Оценка: O(n+m) по времени, где n, m — размеры
      массивов.

      ```
      i, j, result = 0, 0, []
      while i < a.length && j < b.length
        if a[i] == b[j]
          result << a[i]; i += 1; j += 1
        elsif a[i] < b[j]
          i += 1
        else
          j += 1
        end
      end
      ```
    recommendation: "Запомнить маркер варианта: «дано два (или больше) массива/строки» почти всегда указывает на «каждому по указателю», а не на «с двух сторон»."

  - id: q3
    text: "Нужно переместить все нулевые элементы массива в конец, сохранив относительный порядок остальных элементов, без создания нового массива. Какой вариант паттерна «два указателя» применим?"
    type: single
    options:
      - id: a
        text: "«Каждому по указателю» — потому что нулей может быть несколько"
        correct: false
        explanation: "«Каждому по указателю» применяется, когда даны две разные структуры данных (два массива/строки) — здесь же работа идёт с одним массивом, а нулей может быть много, а не два."
      - id: b
        text: "«С двух сторон» — указатели на начало и конец массива"
        correct: false
        explanation: "«С двух сторон» подходит для задач сравнения или сужения области поиска в отсортированных данных — здесь же нужна модификация массива на месте, для чего типичнее другой вариант паттерна."
      - id: c
        text: "«Быстрый и медленный» — fast ищет следующий ненулевой элемент, slow — позицию для его записи"
        correct: true
        explanation: "Главный маркер этого варианта — необходимость изменить структуру in-place, сохранив порядок: fast сканирует массив в поисках ненулевых элементов, slow отмечает, куда следующий найденный элемент нужно записать."
      - id: d
        text: "Обычный линейный проход с созданием вспомогательного массива нулевой длины для накопления результата"
        correct: false
        explanation: "Условие задачи прямо требует не создавать новый массив — вспомогательная структура нарушает это ограничение, даже если сама идея технически работает."
    explanation: "Необходимость изменить исходную структуру in-place, сохранив порядок остальных элементов — главный маркер варианта «быстрый и медленный»: два указателя движутся по одной структуре с разной ролью — один ищет, другой отмечает место записи."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени (единственный проход по
      массиву), O(1) по памяти (модификация происходит на месте, без
      дополнительной структуры). Это принципиальное отличие от «каждому
      по указателю», где всегда участвуют минимум две отдельные
      структуры.

      ```
      slow = 0
      arr.each_index do |fast|
        if arr[fast] != 0
          arr[slow], arr[fast] = arr[fast], arr[slow]
          slow += 1
        end
      end
      ```
    recommendation: "Слово «in-place» или «без создания нового массива» в условии — прямой сигнал проверить применимость варианта «быстрый и медленный»."

  - id: q4
    text: "Условие задачи говорит: «дан массив, найти максимальную сумму k подряд идущих элементов». Как решить за O(n), не пересчитывая сумму окна заново на каждом шаге?"
    type: single
    options:
      - id: a
        text: "Просуммировать первые k элементов, затем на каждом шаге вычитать левый элемент окна и прибавлять новый правый"
        correct: true
        explanation: "Формула перехода «вычесть уходящий элемент, прибавить входящий» даёт O(1) на каждый последующий шаг вместо пересчёта суммы всех k элементов заново — суммарно окно фиксированной длины обрабатывается за O(n)."
      - id: b
        text: "На каждой позиции суммировать все k элементов окна заново вложенным циклом"
        correct: false
        explanation: "Такой подход даёт O(n×k) — пересчёт суммы окна с нуля на каждом шаге сводит на нет весь смысл паттерна плавающего окна."
      - id: c
        text: "Отсортировать массив по убыванию и взять первые k элементов"
        correct: false
        explanation: "Сортировка нарушает требование «подряд идущих» элементов — задача про непрерывный участок исходного массива, а не про произвольный набор наибольших значений."
      - id: d
        text: "Применить бинарный поиск по возможным суммам окна"
        correct: false
        explanation: "Бинарный поиск подходит для задач, где ответ можно проверить монотонным предикатом «хорошо/плохо» — прямое вычисление суммы окна не требует такой конструкции."
    explanation: "Это базовый паттерн «окно фиксированной длины»: формула перехода между соседними окнами (вычесть левый, прибавить правый элемент) исключает повторный пересчёт суммы всего окна на каждом шаге."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени (константная работа на каждый
      сдвиг окна), O(1) по памяти — сумма хранится в одной переменной,
      обновляемой по ходу прохода. Маркер этого варианта паттерна —
      явно фиксированная длина группы элементов, упомянутая в условии.

      ```
      window_sum = arr[0...k].sum
      max_sum = window_sum
      (k...arr.length).each do |i|
        window_sum += arr[i] - arr[i - k]
        max_sum = [max_sum, window_sum].max
      end
      ```
    recommendation: "Проверять формулу перехода на маленьком примере (окно из 2-3 элементов) перед написанием кода — легко ошибиться со знаком при вычитании уходящего элемента."

  - id: q5
    text: "Дан отсортированный массив уникальных чисел — нужно сжать его в список диапазонов, объединяя подряд идущие числа (например, [1,2,3,6,7,9] → «1-3», «6-7», «9»). Какой вариант плавающего окна применим?"
    type: single
    options:
      - id: a
        text: "Непересекающиеся окна — каждый элемент принадлежит ровно одной группе подряд идущих чисел"
        correct: true
        explanation: "Каждое число входит ровно в один диапазон (окно) переменной длины, и окна не пересекаются между собой — это и определяет вариант «непересекающиеся окна»."
      - id: b
        text: "Окно фиксированной длины — размер диапазона известен заранее"
        correct: false
        explanation: "Размер каждого диапазона заранее не известен и меняется от группы к группе — окно здесь переменной длины, а не фиксированной."
      - id: c
        text: "Пересекающиеся окна — границы окна двигаются в обе стороны по мере поиска оптимума"
        correct: false
        explanation: "В этой задаче нет расширения/сужения окна с последующим пересечением соседних групп — каждая новая группа начинается ровно там, где закончилась предыдущая."
      - id: d
        text: "Техника подсчёта через хеш-таблицу частот чисел"
        correct: false
        explanation: "Задача не про подсчёт частот вхождения чисел — числа уникальны по условию, а нужна именно группировка подряд идущих значений в диапазоны."
    explanation: "Маркер варианта «непересекающиеся окна» — необходимость сгруппировать элементы в подряд идущие блоки, где каждый элемент принадлежит ровно одной группе. Несмотря на кажущиеся два вложенных прохода (нахождение конца текущего диапазона плюс переход к следующему), суммарная работа остаётся линейной, потому что каждый элемент рассматривается ограниченное число раз."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени — константы в Big O опускаются
      (условно «2n» шагов сводится к «n» по правилам асимптотической
      оценки), O(n) по памяти на хранение результата (список диапазонов).

      ```
      result, i = [], 0
      while i < arr.length
        start = i
        i += 1 while i < arr.length && arr[i] == arr[i - 1] + 1
        result << (start == i - 1 ? "#{arr[start]}" : "#{arr[start]}-#{arr[i-1]}")
      end
      ```
    recommendation: "Не пугаться видимости вложенных циклов в реализации — если каждый элемент массива посещается ограниченное число раз суммарно, итоговая оценка остаётся линейной."

  - id: q6
    text: "Дан массив из 0 и 1, разрешено заменить не более k нулей на единицы — нужно найти максимальную длину подряд идущей последовательности единиц с учётом таких замен. Какой вариант плавающего окна применим?"
    type: single
    options:
      - id: a
        text: "Окно фиксированной длины k — длина окна равна числу разрешённых замен"
        correct: false
        explanation: "Длина искомой последовательности заранее не известна и не равна k — k это лишь ограничение на число нулей внутри окна, а не сама длина окна."
      - id: b
        text: "Непересекающиеся окна — каждый ноль относится ровно к одной группе замен"
        correct: false
        explanation: "Задача не про разбиение массива на непересекающиеся группы — окно здесь одно, растягивающееся и сжимающееся по ходу поиска максимума."
      - id: c
        text: "Пересекающиеся окна — расширять правую границу, сжимать левую при превышении лимита нулей"
        correct: true
        explanation: "Нужна самая длинная последовательность с заданным свойством (не более k нулей внутри) — классический маркер варианта «пересекающиеся окна»: правая граница расширяется, а левая подтягивается, когда число нулей в текущем окне превышает k."
      - id: d
        text: "Два указателя «каждому по указателю» — по указателю на нули и на единицы отдельно"
        correct: false
        explanation: "Задача работает с одним массивом и одним скользящим окном по нему, а не с двумя отдельными структурами, для которых заводится независимый указатель на каждую."
    explanation: "Формулировка «самая длинная последовательность с заданным свойством» указывает на вариант «пересекающиеся окна»: обе границы окна двигаются только вправо по ходу прохода, а состояние (здесь — счётчик нулей внутри текущего окна) отслеживается по мере расширения и сужения."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени — несмотря на то, что окно то
      расширяется, то сжимается, обе границы суммарно двигаются только
      вправо и проходят массив не более одного раза каждая, O(1) по
      памяти (хранится только счётчик нулей в текущем окне).

      ```
      left, zeros, best = 0, 0, 0
      arr.each_index do |right|
        zeros += 1 if arr[right] == 0
        while zeros > k
          zeros -= 1 if arr[left] == 0
          left += 1
        end
        best = [best, right - left + 1].max
      end
      ```
    recommendation: "Отличать от окна фиксированной длины по ключевому слову в условии: «максимальная длина» без явно заданного числа — сигнал именно пересекающегося окна переменной длины."

  - id: q7
    text: "Нужно проверить, можно ли переставить буквы строки так, чтобы получился палиндром. Какой вариант применения хеш-таблицы здесь подходит?"
    type: single
    options:
      - id: a
        text: "Техника подсчёта — построить частотный словарь символов и проверить, что не более одного символа встречается нечётное число раз"
        correct: true
        explanation: "Строка может быть переставлена в палиндром тогда и только тогда, когда не более одного символа имеет нечётную частоту (для чётной длины строки — все частоты чётные, для нечётной — ровно одна нечётная) — это прямо проверяется частотным словарём."
      - id: b
        text: "KVVK — построить список «частота → символы» и взять символ с наибольшей частотой"
        correct: false
        explanation: "KVVK нужен для сортировки/топ-K по частоте, а не для проверки чётности количества вхождений каждого символа — для этой задачи достаточно самого частотного словаря без инверсии."
      - id: c
        text: "Два указателя с двух сторон строки, сравнивая зеркальные символы"
        correct: false
        explanation: "Так проверяется, является ли уже готовая строка палиндромом — а здесь нужно проверить саму возможность собрать палиндром после произвольной перестановки букв, для чего нужен подсчёт частот."
      - id: d
        text: "Отсортировать строку по алфавиту и проверить симметричность результата"
        correct: false
        explanation: "Сортировка по алфавиту не восстанавливает структуру палиндрома — палиндром не обязан состоять из отсортированных символов, важно лишь количество вхождений каждого."
    explanation: "Задача сводится к подсчёту частот символов и проверке простого правила (не более одного символа с нечётной частотой) — это и есть паттерн «техника подсчёта»: построить частотный словарь и сделать вывод по посчитанным значениям, без необходимости в инверсии ключей и значений."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени (один проход для построения
      частотного словаря плюс проход по словарю для проверки условия),
