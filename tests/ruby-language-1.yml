slug: ruby-language-1
title: "Ruby как язык: объекты, память, метапрограммирование"
description: "Объектная модель Ruby, устройство памяти (RVALUE), frozen strings, метапрограммирование и специфичные конструкции языка."
tags: [ruby, claude-gen]
difficulty: advanced
estimated_time: 20

questions:
  - id: q1
    text: "Сколько байт занимает обычный объект Ruby (структура RVALUE) на 64-битной системе, и что хранится в первых 16 из них?"
    type: single
    options:
      - id: a
        text: "24 байта; первые 16 байт — сами данные объекта"
        correct: false
        explanation: "Служебные поля flags/klass занимают именно первые 16 байт слота — собственные данные объекта размещаются в оставшихся 24."
      - id: b
        text: "40 байт; первые 16 байт — flags и указатель на класс объекта"
        correct: true
        explanation: "flags и klass одинаковы по смыслу для любого объекта, поэтому вынесены в начало структуры фиксированного размера."
      - id: c
        text: "40 байт; первые 16 байт — указатель на GC-поколение и счётчик ссылок"
        correct: false
        explanation: "Ruby не использует подсчёт ссылок — сборка мусора построена на mark-and-sweep, счётчика ссылок в объекте нет."
      - id: d
        text: "64 байта; первые 16 байт — счётчик обращений к объекту для JIT-профилирования"
        correct: false
        explanation: "Счётчики для инлайн-кэшей и JIT хранятся отдельно от самого объекта, в структурах, привязанных к call site, а не в первых байтах RVALUE каждого объекта."
    difficulty: medium
    topics: [ruby_language]
    explanation: "RVALUE — слот фиксированного размера 40 байт: 16 байт под общие для всех объектов flags/klass, 24 байта под собственные данные."
    extended_explanation: |-
      Для строк собственные данные организованы как структура `RString` из
      полей `flags`, `klass`, `len`, `ptr` (указатель на буфер символов) и
      `capa` (вместимость буфера) — по 8 байт каждое. Это уже не влезает в
      24 байта RVALUE впритык, поэтому короткие строки Ruby хранит embedded
      прямо в слоте, а длинные — через `ptr` во внешнем буфере.
    recommendation: |-
      Посмотреть вывод `ObjectSpace.memsize_of(obj)` для разных типов
      объектов, чтобы увидеть разницу между embedded и heap-allocated данными.

  - id: q2
    text: |-
      Код создаёт строку из числового литерала и затем дописывает в неё большой
      объём данных:

      ```ruby
      str = 0.to_s
      str << "x" * 100_000
      ```

      Почему такой паттерн исторически был источником утечек памяти в Ruby?
    type: single
    options:
      - id: a
        text: "`0.to_s` создаёт строку с флагом STR_NOFREE, и при переезде буфера в malloc-heap этот флаг не снимался"
        correct: true
        explanation: "STR_NOFREE изначально указывает на то, что ptr строки ссылается на C-литерал, не подлежащий free. GC видел этот флаг и пропускал buffer, хотя тот уже был обычным malloc-выделением — задокументированный баг (issue 18045)."
      - id: b
        text: "Оператор `<<` при каждом вызове аллоцирует новый объект String и оставляет старый висеть недостижимым для GC"
        correct: false
        explanation: "`<<` — мутирующий метод, он дописывает в существующий буфер, а не аллоцирует новую строку на каждый вызов."
      - id: c
        text: "GC пропускает сборку для всех строк короче 40 байт, считая их частью самого RVALUE-слота"
        correct: false
        explanation: "Длина строки не влияет на то, запускается ли для неё сборка мусора — GC работает со всеми объектами одинаково."
      - id: d
        text: "Числовые литералы в Ruby хранятся в отдельном неуправляемом пуле памяти, который GC никогда не сканирует и не освобождает"
        correct: false
        explanation: "Такого отдельного пула нет — `0.to_s` создаёт обычный объект String, просто с оптимизацией на этапе создания."
    difficulty: hard
    topics: [ruby_language]
    explanation: "`0.to_s` экономит malloc, указывая `ptr` прямо на C-строковый литерал и помечая объект STR_NOFREE. Модификация переносит данные в malloc-heap, но флаг остаётся."
    extended_explanation: |-
      Механизм чинили на уровне рантайма в более новых версиях Ruby, но сам
      принцип — не полагаться на флаги, выставленные при создании объекта,
      если объект потом мутировался, — актуален шире одного этого случая.
      Диагностика: `ObjectSpace.count_objects` и сравнение живых слотов до/после.
    recommendation: |-
      https://bugs.ruby-lang.org/issues/18045 — оригинальная issue с разбором.

  - id: q3
    text: "Что из перечисленного верно про изменение объектной модели в Variable Width Allocation (Ruby 3.1+)?"
    type: single
    options:
      - id: a
        text: "Данные объекта переменного размера теперь хранятся в GC heap целиком, без отдельного C heap"
        correct: true
        explanation: "До 3.1 данные вроде длинных строк физически лежали в malloc-выделенной области, отдельно от самого объекта в GC heap."
      - id: b
        text: "Все объекты теперь занимают ровно 40 байт независимо от размера данных"
        correct: false
        explanation: "Variable width allocation как раз вводит слоты разного размера под данные конкретного объекта — фиксированный 40-байтный RVALUE остаётся только базовым заголовком."
      - id: c
        text: "Ruby перестал использовать сборку мусора поколений (generational GC)"
        correct: false
        explanation: "Generational GC (Minor/Major) никуда не делся — variable width allocation меняет расположение данных, а не стратегию сборки."
      - id: d
        text: "GC heap разделили на несколько независимых пулов — по одному на каждый Ractor"
        correct: false
        explanation: "Изоляция памяти между Ractor — отдельный, более поздний механизм; variable width allocation сама по себе не привязана к Ractor и работает одинаково в однопоточной программе тоже."
    difficulty: medium
    topics: [ruby_language]
    explanation: "Variable width allocation убирает разделение на GC heap (фиксированные 40-байтные слоты) и C heap (malloc под переменные данные), объединяя их."
    extended_explanation: |-
      До этого изменения данные строки могли физически лежать в другом месте
      памяти, чем сам объект — что усложняло и локальность кэша, и трассировку
      утечек. Управляется переменными вроде `RUBY_GC_HEAP_GROWTH_FACTOR`.
    recommendation: "Посмотреть NEWS.md релиза Ruby 3.1 в разделе про GC."

  - id: q4
    text: "В каком порядке Ruby запускает сборку мусора при нехватке свободных слотов в heap?"
    type: single
    options:
      - id: a
        text: "Heap расширяется немедленно, а GC запускается только когда расширение недоступно"
        correct: false
        explanation: "GC — более дешёвая операция, чем выделение новой памяти под heap, поэтому его пробуют раньше, а не после исчерпания расширения."
      - id: b
        text: "Minor и Major GC запускаются параллельно в отдельных потоках"
        correct: false
        explanation: "GC в MRI не распараллелен между Minor и Major — они выполняются последовательно в основном потоке."
      - id: c
        text: "Сначала Minor GC; если не хватило — Major GC; если всё ещё не хватило — расширение heap"
        correct: true
        explanation: "Порядок построен на предположении generational hypothesis: большинство объектов умирают молодыми, поэтому дешёвый Minor GC (проверяющий только молодые объекты) пробуют первым, и лишь затем — Major GC по всем объектам."
      - id: d
        text: "Сразу Major GC по всем объектам, Minor GC используется только вручную через GC.start"
        correct: false
        explanation: "Minor GC — часть автоматического цикла, а не только ручной инструмент; он и есть первый шаг при автоматическом запуске."
    difficulty: medium
    topics: [ruby_language]
    explanation: "Типичный порядок: Minor GC → (если не хватило) Major GC → (если всё ещё не хватило) расширение heap на новую порцию слотов."
    extended_explanation: |-
      `GC.start(full_mark: false)` форсирует именно Minor GC для локализации
      утечек. Диагностика роста: `GC.stat[:heap_live_slots]` и
      `:heap_free_slots` до/после подозрительного участка кода.
    recommendation: "man ruby / документация модуля GC — раздел про generational GC."

  - id: q5
    text: "Что вернёт `+\"already frozen string\".freeze` (unary plus применён к уже замороженной строке)?"
    type: single
    options:
      - id: a
        text: "Ту же самую замороженную строку без изменений"
        correct: false
        explanation: "Возврат уже замороженной строки как есть — поведение unary minus (`-@`), который отдаёт frozen-версию, при необходимости из дедуплицированного пула."
      - id: b
        text: "FrozenError — вызов метода на замороженном объекте"
        correct: false
        explanation: "`+@` создан специально для работы с уже замороженными строками — он не мутирует их, а возвращает новый объект."
      - id: c
        text: "nil, потому что plus не определён для строк"
        correct: false
        explanation: "String определяет унарный плюс как обычный метод (`String#+@`), он всегда возвращает строку, а не nil."
      - id: d
        text: "Новую unfrozen копию строки"
        correct: true
        explanation: "Unary plus у String — это `String#+@`, который возвращает себя, если строка не заморожена, и копию без флага frozen, если заморожена."
    difficulty: hard
    topics: [ruby_language]
    explanation: "`+str` — способ временно получить mutable-версию строки, не трогая оригинал, полезно при работе со строковыми литералами под frozen_string_literal."
    extended_explanation: |-
      Симметричный метод `-str` (unary minus) делает обратное — замораживает
      и по возможности отдаёт объект из общего пула дедуплицированных frozen
      строк, экономя память на повторяющихся литералах.
    recommendation: "docs.ruby-lang.org — String#+@ и String#-@."

  - id: q6
    text: "Директива `# frozen_string_literal: true` в начале файла — это…"
    type: single
    options:
      - id: a
        text: "Обычный комментарий, который построчно проверяет линтер вроде RuboCop"
        correct: false
        explanation: "Работает без всякого линтера — сам интерпретатор Ruby читает эту строку при парсинге файла."
      - id: b
        text: "Magic comment — инструкция интерпретатору, влияющая на компиляцию файла"
        correct: true
        explanation: "Magic comment — это зарезервированный интерпретатором формат комментария, а не просто пояснение для читающего код."
      - id: c
        text: "Настройка, которая применяется только внутри блока, где она написана"
        correct: false
        explanation: "Директива действует на весь файл целиком, а не на область видимости блока или метода, в котором расположена."
      - id: d
        text: "Опция, доступная только при запуске через `ruby --frozen`"
        correct: false
        explanation: "Флаг `--enable-frozen-string-literal` включает поведение глобально для всех файлов, но magic comment работает и без него, per-file."
    difficulty: easy
    topics: [ruby_language]
    explanation: "Magic comments — специальный синтаксис, который парсер Ruby распознаёт и обрабатывает до выполнения кода, в отличие от обычных `#`-комментариев."
    extended_explanation: |-
      Для диагностики миграции гема на frozen strings есть
      `RUBYOPT='--enable=frozen-string-literal --debug=frozen-string-literal'`
      — покажет, в каких местах код полагается на мутацию строкового литерала.
    recommendation: "bugs.ruby-lang.org — обсуждения перехода на frozen strings по умолчанию."

  - id: q7
    text: |-
      Метод мемоизирует результат так:

      ```ruby
      def result
        @result ||= expensive_call
      end
      ```

      `expensive_call` иногда возвращает `false`. В чём здесь баг?
    type: single
    options:
      - id: a
        text: "`||=` не работает с instance-переменными, только с локальными"
        correct: false
        explanation: "`||=` одинаково применим к instance-, class- и локальным переменным — ограничения по типу переменной нет."
      - id: b
        text: "Метод не мемоизирует `nil`, но с `false` работает корректно"
        correct: false
        explanation: "Falsy для `||=` — это и `nil`, и `false` одновременно; проблема с переоценкой затрагивает оба этих значения."
      - id: c
        text: "Баг только в многопоточной среде — в однопоточном коде `||=` работает верно и для false"
        correct: false
        explanation: "Переоценка `expensive_call` при falsy-результате происходит независимо от потоков — это семантика оператора, а не гонка данных."
      - id: d
        text: "`||=` не считает `false` «уже вычисленным значением» — при каждом вызове `expensive_call` будет пересчитываться заново"
        correct: true
        explanation: "`a ||= b` раскрывается в `a || (a = b)` — если текущее значение falsy (nil или false), правая часть выполняется снова."
    difficulty: medium
    topics: [ruby_language]
    explanation: "`@result ||= x` — это `@result || (@result = x)`, поэтому при `@result == false` условие снова ложно и `x` вычисляется заново."
    extended_explanation: |-
      Правильная мемоизация любого значения, включая `false`/`nil`:
      `return @result if defined?(@result); @result = expensive_call`.
      `defined?` проверяет сам факт инициализации переменной, а не её истинность.
    recommendation: "Повторить разницу между `||=` и `defined?` для мемоизации — источник частой путаницы, когда метод легитимно может вернуть false или nil."

  - id: q8
    text: "Чем `defined?(@result)` принципиально отличается от `@result` при проверке, был ли уже вычислен результат?"
    type: single
    options:
      - id: a
        text: "`defined?` проверяет факт инициализации переменной и возвращает истину даже если значение равно `nil` или `false`"
        correct: true
        explanation: "Именно это отличает его от простой проверки истинности — `defined?` отвечает на вопрос «переменная существует?», а не «значение правдиво?»."
      - id: b
        text: "`defined?` быстрее по производительности, семантически они эквивалентны"
        correct: false
        explanation: "Оба метода проверяют разные вещи: `defined?` отвечает на факт существования переменной, `@result` — на её значение; разница именно в семантике проверки, скорость выполнения здесь не при чём."
      - id: c
        text: "`defined?` работает только с instance-переменными, а не с локальными или глобальными"
        correct: false
        explanation: "`defined?` универсален — применим к локальным, instance-, class-, глобальным переменным, методам и константам."
      - id: d
        text: "`defined?(@result)` кидает NameError, если переменная не была объявлена"
        correct: false
        explanation: "В этом и смысл `defined?` — он безопасно возвращает nil для необъявленной переменной, а не бросает исключение."
    difficulty: medium
    topics: [ruby_language]
    explanation: "`defined?(@result)` возвращает строку `\"instance-variable\"`, если переменная инициализирована — независимо от того, что в ней лежит, `nil` или `false`."
    extended_explanation: |-
      Ловушка: `defined?(hash['key'])` не годится для проверки наличия ключа
      в хеше — вернёт строку `"method"` (потому что `[]` это вызов метода),
      даже если ключа нет. Для хешей — `hash.include?('key')`.
    recommendation: "docs.ruby-lang.org — ключевое слово defined?."

  - id: q9
    text: "Почему `defined?(hash['missing_key'])` не подходит для проверки наличия ключа в хеше?"
    type: single
    options:
      - id: a
        text: "`defined?` не поддерживает методы с квадратными скобками"
        correct: false
        explanation: "`defined?` прекрасно работает с любым синтаксисом вызова метода, включая `[]` — проблема не в поддержке синтаксиса."
      - id: b
        text: "Хеши в Ruby не позволяют проверять отсутствующие ключи никаким способом кроме `fetch`"
        correct: false
        explanation: "Есть штатный `Hash#include?`/`Hash#key?`, которые как раз решают эту задачу — проблема именно в выборе `defined?` для неё."
      - id: c
        text: "`[]` — вызов метода, и `defined?` вернёт строку `\"method\"` независимо от того, есть ключ или нет"
        correct: true
        explanation: "`defined?` в этом случае проверяет не результат вызова, а сам факт, что выражение вызывает существующий метод `Hash#[]`."
      - id: d
        text: "Выражение вызывает KeyError до того, как `defined?` успевает его перехватить"
        correct: false
        explanation: "`Hash#[]` на отсутствующем ключе по умолчанию возвращает `nil`, а не бросает исключение — KeyError здесь не возникает."
    difficulty: hard
    topics: [ruby_language]
    explanation: "`defined?` в паре с `[]` отвечает на вопрос «метод `[]` существует?» — а это принципиально другой вопрос, чем «есть ли такой ключ в хеше»."
    extended_explanation: |-
      Тот же эффект — с любым методом, который умеет молча возвращать `nil`
      на «плохом» аргументе: `defined?(arr[999])` тоже вернёт `"method"`.
      Верный способ проверить ключ — `hash.include?('missing_key')`.
    recommendation: "Повторить область применения `defined?` — переменные, константы, методы — и отдельно `Hash#include?`/`key?` для проверки ключей."

  - id: q10
    text: |-
      Что вернёт вызов?

      ```ruby
      def passsplat(h)
        h
      end

      passsplat(**{t: 1, e: 2})
      ```
    type: single
    options:
      - id: a
        text: "ArgumentError — метод ожидает позиционный аргумент, а получает keyword-аргументы"
        correct: false
        explanation: "Такое поведение было характерно для более строгого разделения в некоторых версиях, но при отсутствии keyword-параметров в сигнатуре Ruby складывает их обратно в хеш."
      - id: b
        text: "`{t: 1, e: 2}` — двойной splat на вызове разворачивает хеш в keyword-аргументы, которые метод с одним позиционным параметром собирает обратно в хеш"
        correct: true
        explanation: "Метод `passsplat(h)` не объявляет keyword-параметров, поэтому Ruby складывает переданные keyword-аргументы обратно в позиционный хеш."
      - id: c
        text: "`[1, 2]` — двойной splat разворачивает хеш в массив значений, как это делает `Hash#values`"
        correct: false
        explanation: "Двойной splat при вызове разворачивает хеш в keyword-аргументы (пары ключ-значение), а не вызывает `values` и не теряет привязку значений к их ключам."
      - id: d
        text: "nil, потому что метод не объявляет `**h` в сигнатуре и не может принять keyword-аргументы вовсе"
        correct: false
        explanation: "Метод получает единственный позиционный параметр `h` и возвращает переданное в него значение — nil здесь не возникает."
    difficulty: medium
    topics: [ruby_language]
    explanation: "`**` на месте вызова разворачивает хеш в пары `key: value`; метод без объявленных keyword-параметров принимает их как обычный позиционный хеш."
    extended_explanation: |-
      Симметричная конструкция в сигнатуре — `def usesplat(a, **h)` — собирает
      все «лишние» keyword-аргументы вызова в хеш `h`, в отличие от `*args`,
      который собирает позиционные аргументы в массив.
    recommendation: "Ruby docs — Method Arguments, раздел double splat."

  - id: q11
    text: "Как `map(&:next)` превращается в `map { |x| x.next }` — какой механизм это делает?"
    type: single
    options:
      - id: a
        text: "Ruby распознаёт `&:символ` как отдельную синтаксическую конструкцию на уровне парсера, без вызова методов"
        correct: false
        explanation: "Это обычный вызов метода `to_proc` на объекте Symbol плюс стандартное преобразование `&` перед аргументом — не особый синтаксис парсера."
      - id: b
        text: "`&` вызывает `Symbol#to_proc`, который оборачивает символ в Proc, вызывающий одноимённый метод у своего аргумента"
        correct: true
        explanation: "`&:next` эквивалентно `&('next'.to_proc)` — Symbol#to_proc строит Proc вида `->(x) { x.next }` на лету."
      - id: c
        text: "`&` превращает символ в лямбду, а не в Proc — отсюда строгая проверка количества аргументов"
        correct: false
        explanation: "`Symbol#to_proc` возвращает именно Proc, а не lambda — строгой проверки арности у результата нет."
      - id: d
        text: "Механизм работает только для методов без аргументов у элемента"
        correct: false
        explanation: "Proc из `Symbol#to_proc` передаёт дополнительные аргументы блока дальше — например, работает и с методами, принимающими аргумент."
    difficulty: easy
    topics: [ruby_language]
    explanation: "`&:next` — синтаксический сахар: `&` преобразует объект в блок через `to_proc`, а `Symbol#to_proc` определён как вызов метода с именем символа."
    extended_explanation: |-
      `&` перед аргументом вызова — общий механизм «сделай из этого блок»:
      он вызывает `to_proc` на любом объекте, если тот его определяет, не
      только на Symbol. Proc можно передать так же явно: `map(&some_proc)`.
    recommendation: "docs.ruby-lang.org — Symbol#to_proc."

  - id: q12
    text: |-
      Фрагмент кода из DSL-конфигурации класса:

      ```ruby
      define_method(attr) do |value = NOT_PROVIDED, &block|
        if value == NOT_PROVIDED && block.nil?
          instance_variable_get("@#{attr}")
        else
          instance_variable_set("@#{attr}", block || value)
        end
      end
      ```

      Почему `define_method`, вызванный внутри `included(host_class)` модуля, часто приходится вызывать через `send`?
    type: single
    options:
      - id: a
        text: "`define_method` не существует в модулях, только в классах"
        correct: false
        explanation: "`define_method` доступен и в Module, и в Class — Module выше Class в иерархии, и метод определён именно там."
      - id: b
        text: "`send` нужен, чтобы передать блок с несколькими аргументами внутрь метода"
        correct: false
        explanation: "Передача блока с аргументами не связана с `send` — это делается через обычный `&block`/`yield`, `send` тут ни при чём."
      - id: c
        text: "Без `send` метод определился бы как публичный, а не приватный"
        correct: false
        explanation: "Видимость определяемого методом метода не зависит от того, вызван ли сам `define_method` через `send` — это разные механизмы."
      - id: d
        text: "`define_method` — приватный метод класса/модуля, а вызов идёт на `singleton_class` извне обычного контекста класса"
        correct: true
        explanation: "Как приватный метод, `define_method` нельзя вызвать с явным получателем напрямую — `send` обходит проверку видимости."
    difficulty: hard
    topics: [ruby_language]
    explanation: "`define_method` объявлен приватным в Module — вызов с явным получателем (`singleton_class.define_method`) запрещён без обхода через `send`."
    extended_explanation: |-
      Паттерн `singleton_class.send(:define_method, :name) { ... }` типичен
      для генерации методов класса (не экземпляра) динамически — например,
      в `included`-хуке, где `host_class` доступен только как аргумент блока.
    recommendation: "Проверить видимость: `Module.private_instance_methods.include?(:define_method)` → true."

  - id: q13
    text: "Что происходит с `self` внутри блока, переданного в `instance_eval`?"
    type: single
    options:
      - id: a
        text: "`self` остаётся тем же, что и снаружи блока — меняется только область видимости локальных переменных"
        correct: false
        explanation: "Именно смена self — ключевое отличие instance_eval от обычного yield с блоком, где self не меняется."
      - id: b
        text: "`instance_eval` создаёт новый анонимный класс и выполняет блок как его метод"
        correct: false
        explanation: "Новый класс не создаётся — блок выполняется в контексте существующего объекта, просто с изменённым self."
      - id: c
        text: "`self` становится классом объекта, а не самим объектом"
        correct: false
        explanation: "self внутри instance_eval — это сам объект-получатель, а не его класс; доступ идёт к instance-методам объекта."
      - id: d
        text: "`self` подменяется на объект, на котором вызван `instance_eval` — именно на нём выполняется содержимое блока"
        correct: true
        explanation: "Это и есть механизм, на котором строятся DSL: код в блоке обращается к методам и переменным целевого объекта как к своим собственным."
    difficulty: medium
    topics: [ruby_language]
    explanation: "`obj.instance_eval(&block)` выполняет тело блока так, будто оно написано внутри самого `obj` — self становится `obj`."
    extended_explanation: |-
      Практический паттерн: значение атрибута может быть либо прямым
      значением, либо `Proc`, вычисляемой лениво через `instance_eval` —
      так реализуют отложенные (lazy) атрибуты в DSL-конфигурациях.
    recommendation: "docs.ruby-lang.org — BasicObject#instance_eval."

  - id: q14
    text: "Чем `instance_variable_get(\"@#{attr}\")` отличается от обычного вызова геттера вроде `obj.attr`?"
    type: single
    options:
      - id: a
        text: "Может читать private instance-переменные, а геттер — только public"
        correct: false
        explanation: "Instance-переменные в Ruby в принципе не имеют модификаторов доступа вроде public/private — они не видны напрямую снаружи объекта, кроме как через этот метод или геттер."
      - id: b
        text: "Возвращает Proc, оборачивающий значение, а не само значение"
        correct: false
        explanation: "Метод возвращает непосредственно значение переменной, каким бы оно ни было — без дополнительной обёртки в Proc."
      - id: c
        text: "Не требует, чтобы метод-геттер существовал — обращается к переменной напрямую по её имени как к строке"
        correct: true
        explanation: "Это динамический доступ мимо публичного API объекта, полезный именно тогда, когда набор атрибутов заранее не известен."
      - id: d
        text: "Работает быстрее геттера за счёт пропуска сборки мусора для строки имени"
        correct: false
        explanation: "Динамический доступ по строке обычно немного медленнее прямого вызова метода — быстродействие не входит в число практических причин использовать этот приём."
    difficulty: medium
    topics: [ruby_language]
    explanation: "`instance_variable_get`/`_set` дают доступ к переменным объекта по строковому/символьному имени, минуя необходимость в объявленном методе-геттере."
    extended_explanation: |-
      Именно это делает возможным паттерн `define_method` из DSL: имя
      атрибута известно только в рантайме (как аргумент цикла или списка),
      поэтому обычный `attr_accessor` не подходит — нужен динамический доступ.
    recommendation: "Повторить, почему злоупотребление динамическим доступом (instance_variable_get/set) ломает статический анализ и autocomplete в IDE — цена гибкости этого паттерна."

  - id: q15
    text: "`&:next` (через `Symbol#to_proc`) и `define_method` с блоком — оба превращают блок или символ во что-то вызываемое. Чем принципиально отличаются их роли в метапрограммировании?"
    type: single
    options:
      - id: a
        text: "`Symbol#to_proc` передаёт готовый метод как блок туда, где он нужен; `define_method` создаёт новый метод в классе"
        correct: true
        explanation: "Первое — способ кратко передать «вызови этот метод» туда, где ждут блок; второе — способ определить метод программно, а не через `def`."
      - id: b
        text: "`Symbol#to_proc` работает только внутри блоков `each`, а `define_method` — только внутри `class_eval`"
        correct: false
        explanation: "`&:symbol` работает с любым методом, принимающим блок, не только `each`; `define_method` тоже не привязан обязательно к `class_eval`."
      - id: c
        text: "Оба механизма запрещены внутри файлов с директивой `frozen_string_literal`"
        correct: false
        explanation: "Magic comment про frozen strings касается только строковых литералов и никак не ограничивает метапрограммирование в файле."
      - id: d
        text: "Это два названия одного и того же механизма — оба в итоге добавляют новый именованный метод в целевой класс"
        correct: false
        explanation: "`Symbol#to_proc` не добавляет никакого метода в класс — он лишь создаёт Proc для передачи в качестве блока к уже существующему методу вроде map."
    difficulty: hard
    topics: [ruby_language]
    explanation: "Оба механизма превращают блок/символ в вызываемый объект, но решают разные задачи: один — короткий способ передать блок, другой — динамически расширить класс методом."
    extended_explanation: |-
      На практике часто комбинируются: `define_method` внутри цикла по списку
      имён атрибутов, где тело каждого метода строится через блок — то есть
      метапрограммирование, использующее блоки как единицу многократного
      применения, тот же принцип, что и в `&:method`.
    recommendation: "Смотреть исходники любого гема с DSL (например, dry-struct) — там оба приёма используются рядом."
