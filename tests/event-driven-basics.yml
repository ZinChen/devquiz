      - id: d
        text: "Kafka Streams"
        correct: false
        explanation: "Библиотека для потоковой обработки прямо поверх топиков Kafka — агрегации, джойны потоков, работа с состоянием без отдельного кластера."
    explanation: "Grafana — инструмент визуализации метрик и логов, потоки она не обрабатывает. Flink, Kafka Streams и Beam — движки потоковой обработки: агрегации в окнах, джойны потоков, работа с состоянием. Ловушка в том, что Grafana постоянно встречается рядом в тех же дашбордах."
    extended_explanation: "Grafana умеет строить запросы и алерты к источникам вроде Prometheus или InfluxDB и даже проводить простые вычисления над рядом (агрегация, дельта), но это происходит уже над готовыми числовыми метриками, а не над потоком сырых событий с произвольной структурой, как у Flink или Kafka Streams."
    recommendation: "Разграничить инструменты потоковой обработки данных (Flink, Kafka Streams, Beam) и инструменты визуализации метрик (Grafana) — по внешнему виду дашборда граница не всегда очевидна."

  - id: q19
    text: "Зачем ограничивать число повторных попыток обработки сообщения?"
    type: single
    options:
      - id: a
        text: "Потому что сам брокер автоматически удаляет сообщение после третьей неудачной попытки"
        correct: false
        explanation: "У брокера нет встроенного счётчика неудачных попыток и автоматического удаления по нему — эту логику всегда реализует само приложение-консюмер."
      - id: b
        text: "Потому что повторные попытки обработки нарушают порядок сообщений внутри партиции"
        correct: false
        explanation: "Порядок в партиции определяется offset-ами — повторная обработка одного и того же сообщения сама по себе на этот порядок не влияет."
      - id: c
        text: "Потому что каждая новая попытка создаёт отдельную копию сообщения в топике"
        correct: false
        explanation: "Повторная обработка не создаёт новых записей в исходном топике — консюмер просто заново читает то же самое уже существующее сообщение."
      - id: d
        text: "Иначе «ядовитое» сообщение будет падать бесконечно"
        correct: true
        explanation: "Poison message — сообщение, которое не будет успешно обработано никогда (битый формат, ссылка на удалённую сущность); без ограничения попыток консюмер зациклится ровно на нём, и lag по остальным сообщениям будет только расти."
    explanation: "Poison message — сообщение, которое не будет обработано никогда (битый формат, ссылка на удалённую сущность). Без ограничения попыток консюмер зациклится на нём, а lag будет расти. Стандартная схема: несколько ретраев с экспоненциальной задержкой, затем отправка в DLQ и переход к следующему сообщению."
    extended_explanation: "Экспоненциальная задержка между попытками (например, 1с, 2с, 4с, 8с) нужна не только чтобы дать проблеме время на исчезновение (временная недоступность внешнего сервиса), но и чтобы не забивать систему потоком мгновенных повторов, если причина сбоя не устраняется сама по себе."
    recommendation: "Настроить в пайплайне обработки сообщений схему retry с ограниченным числом попыток, экспоненциальной задержкой и перекладыванием в DLQ по исчерпании лимита."

  - id: q20
    text: "В чём разница между хореографией и оркестрацией в событийной архитектуре?"
    type: single
    options:
      - id: a
        text: "При хореографии сервисы реагируют на события сами, а при оркестрации ими управляет координатор"
        correct: true
        explanation: "При хореографии сервис публикует событие, а заинтересованные подписчики реагируют самостоятельно; при оркестрации отдельный координатор (та же saga с оркестратором, Temporal, Step Functions) явно ведёт процесс по шагам."
      - id: b
        text: "Это просто разные названия для одного и того же подхода к организации процессов"
        correct: false
        explanation: "Это два разных подхода с разными компромиссами: хореография даёт низкую связность ценой того, что общий сценарий нигде не записан целиком, оркестрация даёт видимый сценарий ценой центральной точки координации."
      - id: c
        text: "Хореография применяется внутри одного сервиса, а оркестрация — только между разными сервисами"
        correct: false
        explanation: "Оба подхода описывают взаимодействие между разными сервисами; граница между ними проходит по наличию или отсутствию отдельного координатора процесса."
      - id: d
        text: "Хореография строится на синхронных вызовах, а оркестрация — только на асинхронных"
        correct: false
        explanation: "Оба подхода в событийной архитектуре асинхронны по своей природе — различие между ними не в синхронности вызовов, а в наличии централизованного координатора процесса."
    explanation: "Хореография: сервис публикует событие, заинтересованные подписчики реагируют сами — связность низкая, но общий сценарий нигде не записан целиком и его тяжело отлаживать. Оркестрация: отдельный координатор (та же saga с оркестратором, Temporal, Step Functions) явно ведёт процесс по шагам — сценарий виден, но появляется центральная точка."
    extended_explanation: "На практике команды часто начинают с хореографии из-за её простоты на старте, но по мере роста числа шагов процесса и усложнения условной логики между ними мигрируют к оркестрации — распределённую отладку неявного сценария через десяток топиков становится тяжелее поддерживать, чем один явный workflow."
    recommendation: "Сравнить saga-паттерн в двух вариантах — хореографическом и оркестрируемом — по сложности отладки и по тому, где живёт бизнес-логика процесса."
