slug: event-driven-basics
title: "Событийная архитектура: термины"
description: "Брокеры, очереди, DLQ, outbox, идемпотентность и гарантии доставки — на уровне терминологии и здравого смысла, без привязки к конкретному брокеру."
tags: [messaging, kafka, architecture, trivia, acronyms, claude-gen]
difficulty: advanced
estimated_time: 20

questions:
  - id: q1
    text: "Что такое DLQ?"
    type: single
    options:
      - id: a
        text: "Dead Letter Queue — очередь для необработанных сообщений"
        correct: true
        explanation: "Сообщение, исчерпавшее лимит попыток обработки, перекладывается сюда, чтобы освободить основную очередь и не крутиться в бесконечных ретраях."
      - id: b
        text: "Don't Look, Quit — режим работы, в котором консюмер молча пропускает битые сообщения"
        correct: false
        explanation: "Такого режима у брокеров нет — DLQ, наоборот, устроена так, чтобы проблемное сообщение сохранялось и было видно для разбора."
      - id: c
        text: "Data Log Quorum — кворум реплик брокера, подтвердивших успешную запись"
        correct: false
        explanation: "Подтверждение записи от нужного числа реплик описывает настройка acks (в Kafka) и похожие параметры репликации — это отдельная от DLQ область поведения брокера."
      - id: d
        text: "Delayed Load Queue — механизм очереди для сообщений с намеренно отложенной доставкой"
        correct: false
        explanation: "Отложенная доставка — отдельная задача, которую решают delay queue или scheduled-сообщения; DLQ занимается не отложенными, а именно проблемными сообщениями."
    explanation: "DLQ — Dead Letter Queue. Сообщение, упавшее N раз подряд, отправляется туда, чтобы не блокировать очередь и не крутиться в бесконечных ретраях. Дальше с ним разбираются вручную или отдельным процессом. Важно: DLQ почти всегда опциональна — её заводят осознанно, а не получают по умолчанию."
    extended_explanation: "В Kafka DLQ не встроена как отдельная сущность — это обычный топик, куда консюмер сам публикует сообщение после исчерпания ретраев; в RabbitMQ похожий эффект даёт dead-letter exchange, настроенный на очереди через аргумент x-dead-letter-exchange."
    recommendation: "Разобрать типовую схему обработки ошибок в консюмерах: retry с задержкой, лимит попыток, перекладывание в DLQ."

  - id: q2
    text: "Что делает MirrorMaker в экосистеме Kafka?"
    type: single
    options:
      - id: a
        text: "Дублирует каждое сообщение в DLQ для последующего аудита"
        correct: false
        explanation: "Попадание сообщений в DLQ решает логика обработки ошибок в самом консюмере — межкластерная репликация MirrorMaker работает с этим механизмом независимо."
      - id: b
        text: "Создаёт зеркальную копию партиции внутри одного кластера для отказоустойчивости"
        correct: false
        explanation: "Отказоустойчивость внутри одного кластера обеспечивает replication factor — стандартный механизм самой Kafka, без участия MirrorMaker."
      - id: c
        text: "Реплицирует топики между разными кластерами Kafka"
        correct: true
        explanation: "MirrorMaker читает топики одного кластера и публикует их копии в другой — типовые сценарии: миграция между дата-центрами, гео-репликация, объединение инфраструктур после слияния компаний."
      - id: d
        text: "Отражает схему топика в Schema Registry при первой записи"
        correct: false
        explanation: "Регистрацией и версионированием схем занимается сам Schema Registry при обращении продюсера — MirrorMaker к этому процессу отношения не имеет."
    explanation: "MirrorMaker (сейчас MirrorMaker 2, на базе Kafka Connect) копирует данные между кластерами: миграция, гео-репликация, объединение инфраструктур после слияния компаний. Репликация внутри кластера — это другое: она задаётся параметром replication factor и работает на уровне партиций."
    extended_explanation: "MirrorMaker 2 построен поверх Kafka Connect и умеет переносить не только сами сообщения, но и offset-ы consumer group, конфигурацию топиков и ACL — версия MirrorMaker 1 такой возможности не имела и требовала ручной синхронизации метаданных."
    recommendation: "Сравнить MirrorMaker 2 с альтернативами вроде Confluent Replicator для гео-репликации кластеров Kafka."

  - id: q3
    text: "Какое утверждение про Apache Pulsar верно?"
    type: single
    options:
      - id: a
        text: "Формат сериализации сообщений, конкурирующий с Avro и Protobuf"
        correct: false
        explanation: "Pulsar работает на уровне транспорта сообщений, само содержимое можно кодировать любой сериализацией по выбору — включая тот же Avro или Protobuf."
      - id: b
        text: "Библиотека для обработки потоков поверх Kafka, прямой аналог Kafka Streams"
        correct: false
        explanation: "Pulsar — самостоятельный брокер сообщений, не зависящий от Kafka; за обработку потоков внутри него отвечает собственный компонент Pulsar Functions."
      - id: c
        text: "Брокер сообщений с разделёнными слоями обслуживания и хранения"
        correct: true
        explanation: "Брокер Pulsar не хранит данные сам — он передаёт запись в отдельный слой хранения (Apache BookKeeper), что позволяет масштабировать эти два слоя независимо друг от друга."
      - id: d
        text: "Колоночная СУБД, предназначенная для аналитики по потоку событий"
        correct: false
        explanation: "Pulsar — брокер сообщений с pub/sub-моделью доставки; колоночным хранением и аналитикой по потокам занимаются совсем другие системы, вроде ClickHouse."
    explanation: "Pulsar — брокер, главное архитектурное отличие от Kafka в том, что хранение вынесено в отдельный слой (Apache BookKeeper). Это упрощает масштабирование и перебалансировку: брокер не владеет данными. Умеет и pub/sub-стриминг, и классические очереди с разными типами подписок."
    extended_explanation: "Разделение слоёв даёт практический эффект при ребалансировке: перенос топика на другой брокер Pulsar не требует копирования самих данных — достаточно переключить владение на уровне метаданных, потому что данные и так живут в BookKeeper отдельно от брокеров."
    recommendation: "Сравнить архитектуру Kafka (брокер владеет данными на диске) и Pulsar (брокер и хранение разделены) по масштабированию и операционной сложности."

  - id: q4
    text: "Что из перечисленного НЕ является брокером сообщений?"
    type: single
    options:
      - id: a
        text: "RabbitMQ"
        correct: false
        explanation: "Классический брокер сообщений с очередями и обменниками (exchanges), реализующий протокол AMQP."
      - id: b
        text: "Apache Pulsar"
        correct: false
        explanation: "Брокер сообщений с разделёнными слоями обслуживания и хранения, поддерживающий и pub/sub, и очереди."
      - id: c
        text: "Avro"
        correct: true
        explanation: "Формат сериализации данных со схемой — сам ничего не передаёт и не хранит сообщения, обычно применяется в паре с брокером."
      - id: d
        text: "NATS"
        correct: false
        explanation: "Лёгкий брокер сообщений с низкой задержкой, изначально сфокусированный на простом pub/sub, позже дополненный персистентностью через JetStream."
    explanation: "Avro — формат сериализации данных со схемой, его часто используют вместе с брокерами, но сам он ничего не передаёт. RabbitMQ, NATS и Pulsar — брокеры. Типичная путаница: инструмент рядом с транспортом принимают за транспорт."
    extended_explanation: "Похожую путаницу создают и Protobuf с JSON Schema — все три формата сериализации регулярно встречаются в связке с брокером (payload сообщения кодируется одним из них), но ни один сам не занимается доставкой или хранением очередей."
    recommendation: "Составить для себя список брокеров сообщений (RabbitMQ, Kafka, Pulsar, NATS) отдельно от форматов сериализации (Avro, Protobuf, JSON Schema) — категории регулярно путают именно из-за совместного использования."

  - id: q5
    text: "Зачем нужен паттерн Transactional Outbox?"
    type: single
    options:
      - id: a
        text: "Чтобы складывать исходящие сообщения в оперативной памяти и отправлять их пачками ради скорости"
        correct: false
        explanation: "Буферизация в памяти ради батчинга не решает проблему согласованности с БД — при падении процесса до отправки накопленные в памяти сообщения будут потеряны безвозвратно."
      - id: b
        text: "Чтобы согласовать запись в БД с отправкой события в брокер"
        correct: true
        explanation: "Событие пишется в обычную таблицу той же транзакцией, что и бизнес-данные, а отдельный relay-процесс читает эту таблицу и публикует события в брокер — так оба действия становятся согласованными, хотя физически происходят в разных хранилищах."
      - id: c
        text: "Чтобы хранить отдельную копию всех отправленных событий для последующего аудита"
        correct: false
        explanation: "Строки в outbox-таблице обычно вычищаются после успешной публикации — это недолго живущий рабочий буфер доставки, не архив для аудита."
      - id: d
        text: "Чтобы откатывать уже отправленные сообщения, если транзакция БД не удалась"
        correct: false
        explanation: "Откатить уже отправленное в брокер сообщение в принципе нельзя — outbox предотвращает саму ситуацию рассинхрона, публикуя событие только после успешного коммита транзакции с бизнес-данными."
    explanation: "Проблема: транзакция БД и отправка в брокер — два разных хранилища, общей транзакции у них нет. Если писать в Kafka внутри транзакции, возможен разъезд — коммит упал, а событие ушло (или наоборот). Outbox решает это так: событие пишется в обычную таблицу той же транзакцией, что и бизнес-данные, а отдельный relay-процесс читает таблицу и публикует в брокер. Откатить уже отправленное сообщение (вариант d) в принципе нельзя."
    extended_explanation: "Relay-процесс может либо опрашивать outbox-таблицу по расписанию (polling publisher), либо читать её через CDC (например, Debezium поверх WAL Postgres) — второй способ снижает задержку публикации и нагрузку от постоянных опросов таблицы."
    recommendation: "Прочитать про паттерн Transactional Outbox в каталоге microservices.io и его связь с Change Data Capture."

  - id: q6
    text: "Что означает гарантия доставки at-least-once?"
    type: single
    options:
      - id: a
        text: "Сообщение точно будет доставлено, но возможны дубликаты"
        correct: true
        explanation: "Продюсер или консюмер при неуверенности в успехе повторяет попытку — это исключает потерю, но допускает, что одно и то же сообщение будет обработано более одного раза."
      - id: b
        text: "Сообщение может потеряться, но дубликатов не будет"
        correct: false
        explanation: "Это описание противоположной гарантии at-most-once: попытка ровно одна, без ретраев — если она не удалась, сообщение теряется, зато дублей точно не возникнет."
      - id: c
        text: "Сообщение будет доставлено ровно один раз"
        correct: false
        explanation: "Это отдельная, более строгая гарантия exactly-once — она исключает и потерю, и дубли одновременно, но даётся заметно дороже и с оговорками по границам применимости."
      - id: d
        text: "Сообщение доставляется минимум одному консюмеру из группы"
        correct: false
        explanation: "Это описывает модель распределения партиций внутри consumer group, где партиция закрепляется ровно за одним активным консюмером — отдельную от гарантий доставки характеристику."
    explanation: "Три классические гарантии: at-most-once (может потеряться, дублей нет), at-least-once (не теряется, но возможны дубли), exactly-once (ни того, ни другого — дорого и с оговорками). На практике чаще всего берут at-least-once и делают обработчик идемпотентным. Вариант d описывает не гарантию доставки, а распределение по consumer group."
    extended_explanation: "Exactly-once в Kafka существует не как абсолютная гарантия транспорта, а как сочетание идемпотентного продюсера и транзакционного API — она честно работает только внутри границ одного кластера Kafka, а не при интеграции с произвольной внешней системой на другом конце обработки."
    recommendation: "Сравнить три гарантии доставки (at-most-once, at-least-once, exactly-once) с их практической ценой — что теряется или усложняется ради каждой."

  - id: q7
    text: "Почему обработчик события обычно должен быть идемпотентным?"
    type: single
    options:
      - id: a
        text: "Потому что брокер в принципе не гарантирует порядок сообщений внутри одной партиции"
        correct: false
        explanation: "Это утверждение о самом Kafka неверно: порядок сообщений внутри одной партиции брокер гарантирует всегда, идемпотентность нужна по другой причине."
      - id: b
        text: "Потому что при ретраях и переподключениях сообщение может прийти повторно"
        correct: true
        explanation: "Это прямое следствие at-least-once: сеть моргнула, offset не успел закоммититься, консюмер перезапустился — брокер добросовестно доставит то же сообщение снова."
      - id: c
        text: "Потому что консюмер по правилам протокола обязан обрабатывать сообщения строго по одному"
        correct: false
        explanation: "Обработка по одному или пачками — вопрос конфигурации приложения (batch size), никак не связанный с тем, зачем нужна именно идемпотентность."
      - id: d
        text: "Потому что свойство идемпотентности само по себе ускоряет обработку сообщений"
        correct: false
        explanation: "Идемпотентность обычно добавляет накладные расходы — проверку уникального ключа или UPSERT вместо простого INSERT — то есть скорее замедляет обработку, чем ускоряет."
    explanation: "Идемпотентность — повторная обработка того же сообщения не меняет результат. Она нужна именно из-за at-least-once: сеть моргнула, offset не закоммитился, консюмер перезапустился — сообщение придёт снова. Типовые приёмы: уникальный ключ события в БД, UPSERT вместо INSERT, проверка версии агрегата."
    extended_explanation: "Проверка версии агрегата (optimistic locking) — отдельный от уникального ключа приём: он защищает не от повторной обработки того же события, а от применения событий не в том порядке при параллельной обработке нескольких сообщений одного агрегата."
    recommendation: "Разобрать типовые приёмы идемпотентности — уникальный ключ события, UPSERT вместо INSERT, optimistic locking по версии — и когда какой уместен."

  - id: q8
    text: "Что такое CDC в контексте работы с данными?"
    type: single
    options:
      - id: a
        text: "Centers for Disease Control — американская организация здравоохранения"
        correct: false
        explanation: "Это реально существующая организация под той же аббревиатурой, но к обработке данных и событийной архитектуре отношения не имеет."
      - id: b
        text: "Change Data Capture — отслеживание изменений в БД"
        correct: true
        explanation: "CDC читает журнал изменений БД (в PostgreSQL — WAL через логическую репликацию) и превращает INSERT/UPDATE/DELETE в поток событий, не требуя правок в коде самого приложения."
      - id: c
        text: "Cached Data Cursor — курсор для постраничного чтения записей из кэша"
        correct: false
        explanation: "Постраничное чтение из кэша — задача из области доступа к данным, никак не связанная с отслеживанием изменений в источнике и не то, что называют CDC."
      - id: d
        text: "Consistent Data Commit — механизм двухфазного коммита между несколькими сервисами"
        correct: false
        explanation: "Согласованный коммит между несколькими сервисами решают двухфазный коммит или саги — отдельные механизмы, к CDC отношения не имеющие."
    explanation: "CDC читает журнал изменений БД (в PostgreSQL — WAL через логическую репликацию) и превращает INSERT/UPDATE/DELETE в поток событий. Так работает Debezium. Плюс перед outbox — не нужно менять код приложения; минус — события отражают структуру таблиц, а не бизнес-смысл."
    extended_explanation: "Debezium разворачивают как коннектор Kafka Connect, подключающийся напрямую к логической репликации Postgres или binlog MySQL — событие в топике появляется автоматически при любом изменении отслеживаемой таблицы, без единой строки кода в самом приложении."
    recommendation: "Сравнить Change Data Capture (Debezium) и Transactional Outbox по тому, требуют ли они правок в коде приложения и насколько события отражают бизнес-смысл."

  - id: q9
    text: "Что описывает спецификация CloudEvents?"
    type: single
    options:
      - id: a
        text: "Формат декларативного описания облачной инфраструктуры, аналог Terraform"
        correct: false
        explanation: "Описанием ресурсов облачной инфраструктуры занимаются инструменты вроде Terraform или Pulumi; CloudEvents стандартизирует только структуру самого события."
      - id: b
        text: "Стандарт долговременного хранения событий в облачных объектных хранилищах"
        correct: false
        explanation: "CloudEvents не задаёт способ и место хранения — она определяет только формат самого события, который можно передавать и хранить где угодно."
      - id: c
        text: "Единый формат конверта события с полями id, source, type, time"
        correct: true
        explanation: "Спецификация стандартизирует именно метаданные вокруг полезной нагрузки — `id`, `source`, `type`, `time` и другие обязательные и опциональные атрибуты конверта."
      - id: d
        text: "Протокол сетевой доставки событий между разными облачными провайдерами"
        correct: false
        explanation: "CloudEvents не заменяет транспорт — событие в этом формате можно передавать через любой протокол или брокер: Kafka, HTTP, AMQP, MQTT."
    explanation: "CloudEvents (спецификация CNCF) стандартизирует именно конверт — метаданные вокруг полезной нагрузки: `specversion`, `id`, `source`, `type`, `time`, `subject`, `datacontenttype`, `data`. Транспорт при этом любой: Kafka, HTTP, AMQP. Смысл в том, чтобы потребитель мог разобрать метаданные события, не зная деталей конкретной системы."
    extended_explanation: "На практике CloudEvents чаще встречается в serverless- и webhook-сценариях (например, у Knative или GitHub-интеграций), где разные системы обмениваются событиями через HTTP и важно, чтобы получатель мог разобрать заголовок события без знания внутренней схемы отправителя."
    recommendation: "Изучить спецификацию CloudEvents в CNCF и сравнить с собственными форматами конвертов, которые обычно изобретают заново внутри отдельных компаний."

  - id: q10
    text: "Зачем ключевые поля события часто дублируют в заголовках Kafka-сообщения?"
    type: single
    options:
      - id: a
        text: "Потому что сама Kafka не гарантирует сохранность тела сообщения при передаче"
        correct: false
        explanation: "Kafka гарантирует целостность и сохранность тела сообщения наравне с заголовками — дублирование полей решает не эту проблему."
      - id: b
        text: "Потому что тело сообщения становится доступно только после коммита offset"
        correct: false
        explanation: "Тело сообщения доступно консюмеру сразу при чтении, независимо от того, закоммичен offset или нет — коммит offset влияет лишь на то, откуда чтение продолжится после перезапуска."
      - id: c
        text: "Чтобы уменьшить итоговый размер сообщения за счёт более плотного сжатия заголовков"
        correct: false
        explanation: "Дублирование данных в заголовки только увеличивает объём сообщения — здесь цель другая: скорость доступа к метаданным, не экономия места."
      - id: d
        text: "Чтобы читать метаданные без разбора тела сообщения"
        correct: true
        explanation: "Заголовки читаются без десериализации payload, который может быть закодирован Avro или Protobuf и требовать обращения к Schema Registry — это дешевле для маршрутизации и фильтрации на лету."
    explanation: "Заголовки дешевле: их можно прочитать, не десериализуя payload (который может быть Avro или Protobuf и требовать обращения к Schema Registry). Отсюда типичный набор в headers — `id`, `source`, `time`, `content-type`, идентификаторы трассировки. Дублирование избыточно по данным, но окупается на маршрутизации и отладке."
    extended_explanation: "Типичный практический сценарий — фильтрация на стороне брокера или прокси-сервиса ещё до полной обработки: system может отбраковывать сообщения по content-type или source прямо по заголовку, не тратя ресурсы на десериализацию тела для тех сообщений, которые всё равно будут отброшены."
    recommendation: "Прочитать про заголовки сообщений Kafka (record headers) и типичный набор метаданных, который в них выносят."

  - id: q11
    text: "За что отвечает Schema Registry?"
    type: single
    options:
      - id: a
        text: "Хранит список всех топиков кластера и их настройки конфигурации"
        correct: false
        explanation: "Список топиков и их конфигурация — метаданные самого брокера Kafka, доступные через её собственные API; Schema Registry работает только со схемами сообщений."
      - id: b
        text: "Хранит версии схем сообщений и проверяет их совместимость"
        correct: true
        explanation: "В реестре лежат версии схем (Avro, Protobuf, JSON Schema), и при регистрации новой версии он проверяет её совместимость с предыдущими, не давая залить изменение, ломающее существующих потребителей."
      - id: c
        text: "Кэширует уже прочитанные сообщения для ускорения повторного чтения"
        correct: false
        explanation: "Schema Registry хранит только описания структуры данных — сами сообщения через него не проходят и не кэшируются."
      - id: d
        text: "Регистрирует активных консюмеров и распределяет партиции между ними"
        correct: false
        explanation: "Распределением партиций между консюмерами занимается сам брокер через координатора consumer group — Schema Registry к этому процессу отношения не имеет."
    explanation: "Schema Registry — отдельный сервис, где лежат схемы (Avro, Protobuf, JSON Schema) с версиями. Продюсер кладёт в сообщение ссылку на схему вместо самой схемы, консюмер по ней десериализует. Главная ценность — проверка совместимости: реестр не даст залить изменение, ломающее существующих потребителей."
    extended_explanation: "Продюсер сериализует сообщение с коротким префиксом-идентификатором схемы вместо полного текста схемы в каждом сообщении — это заметно экономит трафик по сравнению с включением схемы целиком, особенно на потоке с мелкими сообщениями."
    recommendation: "Разобрать типы совместимости схем (BACKWARD, FORWARD, FULL) и то, как Schema Registry их проверяет при регистрации новой версии."

  - id: q12
    text: "Что означает тип совместимости схемы BACKWARD?"
    type: single
    options:
      - id: a
        text: "Новая версия схемы может читать данные, записанные предыдущей версией"
        correct: true
        explanation: "Новый код-читатель понимает данные, записанные старой схемой — из этого следует практическое правило: сначала обновляют потребителей, только потом продюсера."
      - id: b
        text: "Изменения схемы применяются ко всем ранее записанным сообщениям"
        correct: false
        explanation: "Совместимость не переписывает и не затрагивает уже сохранённые сообщения — она регулирует только то, какие новые версии схемы допустимы при уже существующих данных."
      - id: c
        text: "Старая версия схемы может читать данные, записанные новой версией"
        correct: false
        explanation: "Это описание типа FORWARD: там направление обратное — старый код должен понимать данные новой схемы, поэтому обновление начинают с продюсера."
      - id: d
        text: "Схему можно откатить к предыдущей версии в любой момент"
        correct: false
        explanation: "Типы совместимости определяют, какие новые версии схемы проходят проверку при регистрации — механизм отката к предыдущей версии это отдельная операция."
    explanation: "BACKWARD: новый код читает старые данные — значит, сначала обновляют потребителей, потом продюсера. FORWARD наоборот: старый код читает новые данные, обновлять начинают с продюсера. FULL — оба свойства сразу. Суффикс TRANSITIVE означает проверку не только против прошлой версии, но против всех предыдущих. Путаница в том, кого обновлять первым, — самая частая ошибка в этой теме."
    extended_explanation: "На практике BACKWARD добивается добавлением нового поля со значением по умолчанию или удалением необязательного поля — старый писатель может не знать о новом поле, а новый читатель подставит для него default, если данные записаны без него."
    recommendation: "Прорешать на конкретных примерах порядок обновления продюсера/консюмера для каждого типа совместимости — BACKWARD, FORWARD, FULL."

  - id: q13
    text: "Что произойдёт, если в consumer group консюмеров больше, чем партиций в топике?"
    type: single
    options:
      - id: a
        text: "Группа перестанет читать до устранения перекоса"
        correct: false
        explanation: "Ничто не останавливает чтение — активные консюмеры, получившие партиции, продолжают обрабатывать сообщения как обычно."
      - id: b
        text: "Партиции будут распределены между всеми консюмерами по очереди"
        correct: false
        explanation: "Партиция не может делиться на части между несколькими консюмерами одновременно — в пределах группы она закрепляется ровно за одним из них."
      - id: c
        text: "Лишние консюмеры останутся без партиций и будут простаивать"
        correct: true
        explanation: "Раз партиция отдаётся ровно одному консюмеру группы, а партиций меньше, чем консюмеров, часть из них не получит ни одной и будет ждать как горячий резерв на случай отказа других."
      - id: d
        text: "Kafka автоматически увеличит число партиций"
        correct: false
        explanation: "Автоматического увеличения числа партиций по числу консюмеров нет — партиционирование настраивается вручную при создании топика или явным изменением конфигурации."
    explanation: "Партиция в пределах группы отдаётся ровно одному консюмеру — это и обеспечивает порядок обработки. Поэтому партиции задают верхнюю границу параллелизма: 4 партиции — максимум 4 работающих консюмера в группе, остальные ждут как горячий резерв. Отсюда практическое правило: закладывать партиции с запасом, уменьшить их число потом нельзя."
    extended_explanation: "Увеличить число партиций у существующего топика технически можно, но это меняет распределение сообщений по ключу для всех новых записей — старые сообщения остаются в прежних партициях, поэтому увеличение партиций задним числом ломает гарантию порядка по ключу для данных, записанных до и после этого момента."
    recommendation: "Прочитать про модель consumer group и партиционирование в Kafka — официальную документацию по разделу Consumers."

  - id: q14
    text: "Как в Kafka обеспечивается порядок сообщений?"
    type: single
    options:
      - id: a
        text: "Порядок сообщений не гарантируется никогда, ни при каких условиях"
        correct: false
        explanation: "Гарантия порядка всё же существует, просто ограничена рамками одной партиции — полное её отсутствие описывало бы совсем другую, гораздо более слабую систему."
      - id: b
        text: "Порядок сообщений определяется исключительно их временными метками"
        correct: false
        explanation: "Порядок в партиции определяется позицией записи (offset); метка time у сообщения проставляется клиентом и не обязана строго монотонно расти."
      - id: c
        text: "Порядок гарантируется в пределах всего топика целиком, а не отдельной партиции"
        correct: false
        explanation: "Партиции внутри топика независимы друг от друга — глобального порядка по всему топику Kafka не даёт, только внутри отдельной партиции."
      - id: d
        text: "Порядок гарантируется только внутри одной партиции"
        correct: true
        explanation: "Попадание сообщения в партицию определяется его ключом — одинаковый ключ всегда уходит в одну и ту же партицию, и именно внутри неё порядок сохраняется строго."
    explanation: "Глобального порядка в топике нет — партиции независимы. Гарантия работает внутри партиции, а попадание в партицию определяется ключом: одинаковый ключ — одна партиция. Отсюда практика выбирать ключом идентификатор сущности (order_id, user_id), чтобы события по одному объекту обрабатывались по порядку."
    extended_explanation: "Если ключ не задан явно, продюсер по умолчанию распределяет сообщения между партициями round-robin (или по хешу с sticky-стратегией в новых версиях) — в этом случае порядок между отдельными сообщениями вообще не определён, даже для событий, отправленных одно за другим."
    recommendation: "Разобрать, как выбор ключа сообщения (order_id, user_id) влияет на попадание в партицию и, как следствие, на сохранение порядка обработки."

  - id: q15
    text: "Чем очередь (queue) отличается от журнала (log) как модели работы брокера?"
    type: single
    options:
      - id: a
        text: "Это фактически одно и то же, разница есть только в терминологии и названии"
        correct: false
        explanation: "Разница влияет на реальное поведение системы — возможность перечитать историю и подключить нового потребителя к старым данным доступна в журнале и принципиально недоступна в классической очереди."
      - id: b
        text: "Очередь хранит сообщения на диске, а журнал держит их только в оперативной памяти"
        correct: false
        explanation: "И классические брокеры-очереди, и Kafka как журнал персистентно пишут данные на диск — различие между ними не в носителе хранения, а в том, что происходит с сообщением после чтения."
      - id: c
        text: "Из очереди сообщение забирается и исчезает, а в журнале остаётся"
        correct: true
        explanation: "Классическая очередь удаляет сообщение после подтверждения получения, а журнал хранит его до истечения retention независимо от того, сколько потребителей его уже прочитали."
      - id: d
        text: "Очередь работает заметно быстрее, потому что вообще не пишет данные на диск"
        correct: false
        explanation: "Классические брокеры-очереди тоже пишут сообщения на диск для надёжности — отсутствие записи на диск не является тем, что их характеризует."
    explanation: "Классические очереди (RabbitMQ) удаляют сообщение после подтверждения — потребитель забрал, и его больше нет. Kafka устроена как журнал: сообщение лежит до истечения retention, а потребители независимо двигают свои offset-ы. Отсюда возможность перечитать историю заново и подключить нового потребителя к старым данным — с очередью так не выйдет."
    extended_explanation: "Модель журнала даёт ещё одно следствие: несколько независимых consumer group могут читать один и тот же топик с разной скоростью и с разных позиций, не мешая друг другу — в классической модели очереди сообщение, отданное одному подписчику, для остальных исчезает."
    recommendation: "Сравнить модели pub/sub-очереди (RabbitMQ) и распределённого журнала (Kafka) — обе решают доставку сообщений, но с разными гарантиями сохранности после прочтения."

  - id: q16
    text: "Что такое consumer lag?"
    type: single
    options:
      - id: a
        text: "Пауза перед очередной повторной попыткой обработки упавшего сообщения"
        correct: false
        explanation: "Пауза между ретраями — параметр политики повторов конкретного обработчика (например, экспоненциальная задержка), не связанный с отставанием консюмера от конца партиции."
      - id: b
        text: "Задержка между отправкой сообщения продюсером и его фактической записью в топик"
        correct: false
        explanation: "Эта задержка касается только пути от продюсера до брокера и не отражает, насколько консюмер отстаёт от уже записанных данных."
      - id: c
        text: "Отставание консюмера от конца партиции по числу сообщений"
        correct: true
        explanation: "Lag — это разница между текущим offset потребителя и последней записанной позицией в партиции, измеряемая в количестве непрочитанных сообщений."
      - id: d
        text: "Суммарное время обработки одного отдельно взятого сообщения консюмером"
        correct: false
        explanation: "Время обработки одного сообщения — это метрика латентности приложения, измеряемая совсем в других единицах, чем lag."
    explanation: "Lag измеряется в сообщениях: сколько записей накопилось между текущим offset потребителя и концом партиции. Это главная метрика здоровья консюмера — растущий lag означает, что обработка не поспевает за потоком. Обычно и алертят именно на неё."
    extended_explanation: "Lag можно посмотреть напрямую консольным инструментом Kafka — `kafka-consumer-groups.sh --describe --group имя_группы` покажет текущий offset, log-end-offset и разницу между ними по каждой партиции."
    recommendation: "Настроить алертинг на consumer lag как основную метрику здоровья пайплайна обработки событий — рост lag сигнализирует раньше, чем полная остановка обработки."

  - id: q17
    text: "Что делает retention policy в Kafka?"
    type: single
    options:
      - id: a
        text: "Определяет, как долго или до какого объёма хранить сообщения в топике"
        correct: true
        explanation: "Retention задаётся по времени (`retention.ms`) или по размеру (`retention.bytes`) — брокер удаляет старые сегменты, как только сработает любое из этих ограничений."
      - id: b
        text: "Ограничивает число консюмеров, читающих топик одновременно"
        correct: false
        explanation: "Retention регулирует срок хранения данных в топике; число одновременных читателей на уровне брокера ничем не ограничено."
      - id: c
        text: "Задаёт срок жизни consumer group после отключения последнего консюмера"
        correct: false
        explanation: "За удаление неактивных consumer group отвечает своя отдельная настройка (например, `offsets.retention.minutes`), никак не связанная с retention самого топика."
      - id: d
        text: "Определяет, сколько раз повторять доставку упавшего сообщения"
        correct: false
        explanation: "Число повторных попыток обработки — логика самого консюмера или обвязки вроде retry-топиков, retention топика к этому отношения не имеет."
    explanation: "Retention задаётся по времени (`retention.ms`) или по размеру (`retention.bytes`) — что наступит раньше. Отдельный режим — log compaction: вместо удаления по возрасту брокер хранит последнее значение для каждого ключа, что превращает топик в снимок текущего состояния."
    extended_explanation: "Log compaction и обычный retention можно комбинировать (`cleanup.policy=compact,delete`) — брокер сначала схлопывает старые версии одного ключа до последней, а затем ещё и удаляет записи старше заданного времени, если такая настройка задана дополнительно."
    recommendation: "Сравнить retention по времени/размеру с log compaction — они решают разные задачи и настраиваются независимо на уровне топика."

