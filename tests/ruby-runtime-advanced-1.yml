slug: ruby-runtime-advanced-1
title: 'Ruby: рантайм и конкурентность'
description: CRuby/YARV, GVL, YJIT, Ractor, Fiber и Fiber Scheduler, модель Puma, поколения веб-серверов,
  внутреннее устройство Rack.
tags:
- ruby
- runtime
difficulty: advanced
estimated_time: 30
questions:
- id: q1
  text: Чем CRuby, MRI и YARV отличаются друг от друга?
  type: single
  options:
  - id: a
    text: 'Это разные названия одной и той же реализации: YARV — виртуальная машина внутри CRuby/MRI'
    correct: true
    explanation: MRI (Matz's Ruby Interpreter) и CRuby — синонимы эталонной реализации на C, YARV — байткод-машина
      внутри неё.
  - id: b
    text: CRuby — эталонная реализация, MRI — устаревшее название JRuby, YARV — отдельный JIT-компилятор
    correct: false
    explanation: MRI — устоявшееся историческое имя той же реализации, что и CRuby (Matz's Ruby Interpreter);
      JRuby — совершенно отдельный проект, работающий поверх JVM.
  - id: c
    text: MRI и CRuby — конкурирующие реализации языка, YARV — общий для них промежуточный формат байткода
    correct: false
    explanation: MRI и CRuby — одна и та же реализация под двумя именами, применяемыми к одному проекту.
  - id: d
    text: YARV — реализация языка на JVM, CRuby и MRI — два режима её работы
    correct: false
    explanation: На JVM работает отдельная реализация JRuby — YARV существует только внутри CRuby/MRI.
  difficulty: easy
  topics:
  - ruby_runtime
  explanation: 'MRI/CRuby — имя одной и той же эталонной реализации языка, YARV — виртуальная машина
    байткода, работающая внутри неё: три термина описывают части одного целого, а не три отдельные вещи.'
  extended_explanation: 'Путь исполнения: исходный код → парсинг → AST → байткод YARV (инструкции вроде
    getlocal, send, putobject, leave) → исполнение интерпретатором или JIT. Путаница в терминах — частый
    источник неверных ответов на собеседованиях.'
  recommendation: Проверить командой `ruby -v` — вывод содержит одновременно "MRI" и версию YARV.
- id: q2
  text: Верно ли утверждение «Ruby не умеет в параллелизм потоков из-за GVL»?
  type: single
  options:
  - id: a
    text: 'Верно: спецификация языка Ruby требует глобальной блокировки интерпретатора для любой реализации'
    correct: false
    explanation: В спецификации языка нет требования о GVL — это решение конкретной реализации, не языка.
  - id: b
    text: 'Неточно: GVL — свойство конкретной реализации CRuby, а не языка; JRuby и TruffleRuby потоки
      параллелят'
    correct: true
    explanation: GVL — деталь реализации CRuby/MRI. JRuby (на JVM) и TruffleRuby (на GraalVM) не имеют
      GVL и дают настоящий параллелизм тредов.
  - id: c
    text: 'Неточно: с выходом YJIT глобальная блокировка была убрана из CRuby, и потоки теперь параллелятся'
    correct: false
    explanation: YJIT ускоряет исполнение одной последовательности инструкций и никак не относится к снятию
      GVL.
  - id: d
    text: Верно, но только для версий Ruby младше 3.0 — начиная с 3.0 GVL заменили на Ractor для всех
      потоков
    correct: false
    explanation: 'Ractor — дополнительный механизм параллелизма поверх GVL: обычные Thread внутри main
      ractor по-прежнему ограничены единым GVL.'
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: GVL ограничивает параллельное исполнение байткода именно в CRuby. Альтернативные реализации
    языка — JRuby и TruffleRuby — не имеют GVL и параллелят потоки по-настоящему.
  extended_explanation: Несмотря на отсутствие GVL, JRuby и TruffleRuby занимают маленькую долю реального
    использования — во многом из-за плохой совместимости с C-расширениями, на которых построена значительная
    часть экосистемы гемов.
  recommendation: Сравнить таблицу реализаций Ruby и наличие GVL в каждой — CRuby, JRuby, TruffleRuby.
- id: q3
  text: Команда включила YJIT в проде, но среднее время ответа не изменилось. Что вероятнее всего объясняет
    отсутствие эффекта?
  type: single
  options:
  - id: a
    text: YJIT ускоряет только код внутри миграций и rake-тасков, на обработку HTTP-запросов не влияет
    correct: false
    explanation: YJIT ускоряет исполнение любого байткода, включая контроллеры и модели — ограничение
      не в типе кода, а в том, что именно занимает время выполнения.
  - id: b
    text: YJIT несовместим с многопоточными серверами вроде Puma и включается только под Unicorn
    correct: false
    explanation: YJIT работает независимо от модели сервера приложений — совместимость с Puma не ограничена.
  - id: c
    text: Для эффекта от YJIT обязательно нужно параллельно включить Ractor — по отдельности JIT ничего
      не ускоряет
    correct: false
    explanation: 'YJIT и Ractor — независимые механизмы на разных осях: один про скорость одной последовательности,
      другой про параллелизм.'
  - id: d
    text: Сервис большую часть времени ответа ждёт БД и внешние API, а не считает на CPU — YJIT ускоряет
      только CPU-часть
    correct: true
    explanation: YJIT компилирует и ускоряет исполнение байткода — время ожидания сети или БД он не сокращает.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'JIT и GVL — независимые оси: одна про то, как быстро исполняется одна последовательность
    инструкций, другая — про то, сколько их может идти одновременно. YJIT бессилен там, где узкое место
    — ожидание, а не вычисления.'
  extended_explanation: Практический способ проверить гипотезу — посмотреть, сколько времени запрос реально
    проводит в CPU против ожидания в профилировщике или APM; если 90% времени — сетевые вызовы, оптимизировать
    стоит их, а не рассчитывать на JIT.
  recommendation: Прочитать про архитектуру YJIT (базовые блоки) и когда JIT даёт эффект, а когда нет.
- id: q4
  text: Какой из этих JIT-компиляторов Ruby стал включённым по умолчанию?
  type: single
  options:
  - id: a
    text: MJIT — с версии 2.6
    correct: false
    explanation: MJIT был более ранним экспериментальным JIT и по умолчанию не включался ни в одной стабильной
      версии так широко, как YJIT.
  - id: b
    text: ZJIT — с версии 4.0
    correct: false
    explanation: ZJIT появился в Ruby 4.0 как опциональный, более новый и пока более медленный, чем YJIT.
  - id: c
    text: YJIT — с версии 3.4
    correct: true
    explanation: YJIT появился в 3.1 и стал дефолтным начиная с Ruby 3.4.
  - id: d
    text: Ни один — JIT в Ruby всегда требует явного флага запуска
    correct: false
    explanation: YJIT включён по умолчанию, начиная с Ruby 3.4, без дополнительных флагов.
  difficulty: easy
  topics:
  - ruby_runtime
  explanation: YJIT, компилирующий по базовым блокам, дал стабильный прирост 15-30% на типичных Rails-нагрузках
    и стал дефолтным JIT с версии 3.4.
  extended_explanation: ZJIT (Ruby 4.0) компилирует целиком метод через SSA-представление и пока уступает
    YJIT по скорости — это следующее поколение, которое ещё не заменило YJIT по умолчанию.
  recommendation: Свериться с release notes Ruby 3.4 в части YJIT-by-default.
- id: q5
  text: В обычном Ruby-скрипте никто явно не создавал `Ractor.new`. Что вернёт `Ractor.count`?
  type: single
  options:
  - id: a
    text: 0 — ракторы появляются только после первого явного `Ractor.new`
    correct: false
    explanation: Main ractor существует с момента запуска процесса независимо от того, создавались ли
      дополнительные ракторы.
  - id: b
    text: 1 — main ractor существует всегда, весь код по умолчанию исполняется внутри него
    correct: true
    explanation: Main ractor создаётся автоматически при старте процесса — `Ractor.current == Ractor.main`
      истинно в любом обычном скрипте.
  - id: c
    text: Количество ядер CPU — Ruby создаёт по одному ractor на ядро автоматически
    correct: false
    explanation: Ruby не создаёт ракторы автоматически по числу ядер — их количество полностью управляется
      явным кодом.
  - id: d
    text: Ошибка NoMethodError — Ractor.count появился только в готовящемся релизе и ещё не стабилен
    correct: false
    explanation: Ractor и его API, включая Ractor.count, доступны начиная с Ruby 3.0.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Main ractor — не опциональная надстройка, а базовая единица исполнения: весь обычный однопоточный
    Ruby-код уже выполняется внутри него.'
  extended_explanation: 'Именно поэтому второй ractor создают редко на практике: изоляция ractor''ов запрещает
    доступ к глобальным переменным, переменным класса и изменяемым объектам снаружи, и большинство гемов
    (включая Rails) не запускаются внутри не-main ractor.'
  recommendation: 'Проверить в консоли: `Ractor.current == Ractor.main` и `Ractor.count` без создания
    ни одного ractor вручную.'
- id: q6
  text: Чем Ractor принципиально отличается от Thread с точки зрения GVL?
  type: single
  options:
  - id: a
    text: У каждого Ractor — собственный GVL, поэтому несколько ractor'ов дают настоящий параллелизм на
      CPU
    correct: true
    explanation: 'Ractor размножает GVL — у каждого ractor своя собственная блокировка, поэтому разные
      ractor''ы способны исполнять байткод одновременно на разных ядрах.'
  - id: b
    text: Ractor полностью отключает GVL для всего процесса, включая обычные Thread внутри main ractor
    correct: false
    explanation: Обычные Thread внутри main ractor остаются под тем же единственным GVL — Ractor не выключает
      его глобально.
  - id: c
    text: Ractor — это синоним Thread, добавленный для совместимости с терминологией Go-горутин
    correct: false
    explanation: 'Ractor и Thread — разные механизмы с разной моделью памяти: ractor''ы изолированы и
      общаются сообщениями, треды делят память.'
  - id: d
    text: Ractor не создаёт новый GVL, а временно занимает GVL другого потока по очереди, как обычный
      Thread
    correct: false
    explanation: Именно наличие отдельного GVL у каждого ractor отличает его от Thread — без этого настоящего
      параллелизма не было бы.
  difficulty: hard
  topics:
  - ruby_runtime
  explanation: Ractor даёт параллелизм через размножение GVL — у каждого ractor собственная блокировка
    интерпретатора, и они не мешают друг другу на разных ядрах.
  extended_explanation: Ractor'ы не разделяют изменяемое состояние — общаются через message passing (send/receive
    и take/yield), что и позволяет каждому безопасно иметь свой GVL без гонок за общие объекты.
  recommendation: Сравнить модель памяти Thread (общая память, GVL один на всех) и Ractor (изоляция, свой
    GVL на каждый).
- id: q7
  text: Что произойдёт, если запустить `Thread.new { long_running_task }` и сразу продолжить выполнение
    главного потока без `.join`?
  type: single
  options:
  - id: a
    text: Программа немедленно упадёт с исключением ThreadError, так как поток остался без `.join`
    correct: false
    explanation: Отсутствие `.join` не приводит к исключению — это лишь означает, что программа не будет
      ждать завершения потока.
  - id: b
    text: Ruby автоматически дождётся завершения всех запущенных потоков перед выходом из программы
    correct: false
    explanation: Такого автоматического ожидания нет — именно поэтому `.join` вызывают явно.
  - id: c
    text: Главный поток не будет ждать дочерний — программа может завершиться раньше, чем задача в потоке
      доделает работу
    correct: true
    explanation: Ruby не блокирует основное выполнение на создании потока — без явного `.join` завершение
      процесса не гарантирует завершения дочернего потока.
  - id: d
    text: Дочерний поток автоматически получит приоритет и заблокирует главный до своего завершения
    correct: false
    explanation: Приоритет потоку явно не назначается — оба потока конкурируют за GVL наравне, без блокировки
      главного.
  difficulty: easy
  topics:
  - ruby_runtime
  explanation: Thread.new запускает работу асинхронно и не блокирует вызывающий код. Чтобы дождаться результата,
    нужен явный `.join` на объекте потока.
  extended_explanation: 'Похожая ловушка — необработанное исключение внутри потока: по умолчанию оно тихо
    проглатывается, если не выставить `Thread.abort_on_exception = true` или не прочитать результат через
    `.join`/`.value`.'
  recommendation: 'Проверить на практике: код без `.join` в конце скрипта — поток может не успеть допечатать
    результат.'
- id: q8
  text: Чем обычный `yield` внутри метода принципиально отличается от `Fiber.yield`?
  type: single
  options:
  - id: a
    text: Fiber.yield работает только в однопоточном режиме, а обычный yield — только в многопоточном
    correct: false
    explanation: Оба механизма не завязаны на количество потоков — разница в том, приостанавливают ли
      они исполнение с сохранением стека, а не в модели потоков.
  - id: b
    text: Это два синонима одной операции — оба приостанавливают текущий поток исполнения до внешнего
      сигнала
    correct: false
    explanation: Обычный yield — синхронный вызов блока, завершающийся до возврата из метода, без всякой
      приостановки потока.
  - id: c
    text: Обычный yield работает только внутри классов-наследников Fiber, а свободный Fiber.yield — где
      угодно
    correct: false
    explanation: Обычный yield доступен в любом методе, принимающем блок, независимо от Fiber — эти механизмы
      не связаны наследованием.
  - id: d
    text: Обычный yield — это просто вызов переданного блока без сохранения состояния; Fiber.yield приостанавливает
      исполнение, сохраняя весь стек
    correct: true
    explanation: Обычный yield не имеет отношения к асинхронности — управление уходит в блок и возвращается
      как при любом вызове метода, стек растёт и сворачивается как обычно.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Обычный yield — синхронный вызов блока, без всякого отношения к конкурентности. Fiber.yield
    — настоящая приостановка: исполнение замирает посреди функции, стек файбера лежит в куче, и resume
    восстанавливает его целиком.'
  extended_explanation: Путаница усиливается тем, что Enumerator#next и .lazy реализованы именно через
    Fiber — они требуют приостановки между вызовами, и это единственное реальное пересечение обычного
    yield с миром Fiber.
  recommendation: Прочитать пример с fiber.resume, вызванным дважды подряд, и проследить, откуда продолжается
    исполнение во второй раз.
- id: q9
  text: Сервер приложений работает на Falcon (fiber-based). Один из запросов уходит в тяжёлый CPU-bound
    цикл без единой операции I/O. Что произойдёт с остальными запросами в этом же треде?
  type: single
  options:
  - id: a
    text: Ничего — Falcon использует отдельный GVL на каждый файбер, поэтому CPU-задачи не мешают друг
      другу
    correct: false
    explanation: У Fiber нет собственного GVL — они существуют внутри одного треда и одного GVL, в отличие
      от Ractor.
  - id: b
    text: Остальные продолжат исполняться параллельно — Fiber Scheduler вытесняет CPU-bound файбер каждые
      несколько миллисекунд
    correct: false
    explanation: Fiber Scheduler перехватывает только блокирующие I/O-операции — принудительного вытеснения
      на чистом CPU-цикле он не даёт.
  - id: c
    text: Ruby автоматически перенесёт зависший файбер в отдельный OS-поток, чтобы не блокировать остальные
    correct: false
    explanation: Такого автоматического переноса между потоками не существует — файберы остаются внутри
      своего треда, пока не завершатся или не уступят сами.
  - id: d
    text: Все они встанут — файбер никто не вытесняет принудительно, и пока текущий не уступит сам, остальные
      не получат исполнения
    correct: true
    explanation: 'Fiber переключается кооперативно: VM не отбирает у него исполнение по таймеру, как у
      Thread — если файбер не уступает на I/O, весь тред останавливается вместе с ним.'
  difficulty: hard
  topics:
  - ruby_runtime
  explanation: 'Thread вытесняется VM принудительно по таймеру даже на CPU-задаче, а Fiber — нет: он уступает
    только добровольно, на операции I/O. Отсюда практическое правило fiber-based серверов — тяжёлые вычисления
    обязательно выносить в фон, иначе встанет даже healthcheck.'
  extended_explanation: Это прямое следствие кооперативной модели, общей для всех stackful-корутин без
    вытеснения (Fiber, Lua coroutine) — в отличие от вытесняющих моделей вроде Go-горутин (с Go 1.14)
    или потоков ОС.
  recommendation: Сравнить поведение Fiber и Thread на синтетическом CPU-bound бенчмарке внутри и снаружи
    Fiber Scheduler.
- id: q10
  text: Какую операцию перехватывает хук `io_wait` у Fiber Scheduler (Ruby 3.0+)?
  type: single
  options:
  - id: a
    text: Блокирующее чтение или запись через IO#read/IO#write
    correct: true
    explanation: io_wait — хук именно для операций чтения/записи в IO, позволяющий планировщику переключиться
      на другой файбер вместо блокировки треда.
  - id: b
    text: Ожидание освобождения Mutex#lock другим файбером
    correct: false
    explanation: За Mutex#lock отвечает отдельная пара хуков block/unblock.
  - id: c
    text: Вызов Kernel#sleep на заданное количество секунд
    correct: false
    explanation: Sleep перехватывается отдельным хуком kernel_sleep, не io_wait.
  - id: d
    text: Ожидание завершения дочернего процесса через Process.wait
    correct: false
    explanation: За ожидание процесса отвечает хук process_wait, отдельный от io_wait.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Fiber Scheduler даёт VM возможность перехватывать блокирующие операции на уровне интерпретатора
    и вызывать соответствующий хук вместо блокировки треда: io_wait — для IO#read/write, kernel_sleep
    — для sleep, block/unblock — для Mutex#lock, address_resolve — для DNS, process_wait — для Process.wait.'
  extended_explanation: 'Ключевое следствие: существующий синхронный код (Net::HTTP.get, File.read) не
    требует переписывания под async/await — планировщик регистрируется один раз через Fiber.set_scheduler,
    а дальше перехват происходит прозрачно для кода приложения.'
  recommendation: Свериться с документацией Fiber::Scheduler — там перечислен полный список перехватываемых
    хуков.
- id: q11
  text: Чем принципиально отличается модель конкурентности Ruby Fiber от Go goroutine, помимо деталей
    реализации?
  type: single
  options:
  - id: a
    text: Fiber — stackless-модель с сохранением состояния в объекте, а goroutine — полноценный стек в
      куче
    correct: false
    explanation: 'И Fiber, и goroutine — stackful-модели с полноценным стеком; сохранение состояния в
      объекте вместо стека — признак stackless-подхода, характерного для Python async/await и JS.'
  - id: b
    text: Goroutine вытесняется планировщиком Go и распределяется по нескольким ядрам; Fiber переключается
      только кооперативно в рамках одного треда под GVL
    correct: true
    explanation: У Go — вытесняющее переключение с 1.14 и M:N планировщик на несколько ОС-потоков и ядер;
      у Fiber — кооперативное переключение внутри одного треда без параллелизма на CPU.
  - id: c
    text: Goroutine существует только внутри горутин-пулов, а Fiber можно создавать без ограничения по
      количеству
    correct: false
    explanation: Оба механизма не имеют жёсткого встроенного ограничения на число одновременных экземпляров
      — различие не в этом.
  - id: d
    text: Fiber поддерживает передачу управления только из самой корутины, а goroutine — из любой глубины
      вложенности
    correct: false
    explanation: Обе модели stackful и одинаково допускают приостановку с любой глубины вложенности вызовов
      — в этом и разница со stackless-подходом других языков.
  difficulty: hard
  topics:
  - ruby_runtime
  explanation: Обе модели — stackful-корутины, дающие синхронный на вид код с асинхронным исполнением.
    Но Go-планировщик вытесняет зависшую горутину и распределяет работу по ядрам, а Ruby Fiber работает
    в рамках одного треда и одного GVL, без параллелизма на CPU.
  extended_explanation: 'Следствие для практики: в Go корутины — универсальный инструмент и для I/O, и
    для CPU-задач; в Ruby Fiber специализирован для I/O-bound нагрузки, а CPU-задачи всё равно требуют
    отдельных процессов для настоящего параллелизма.'
  recommendation: 'Сравнить таблицу: стоимость создания, тип переключения (кооперативное/вытесняющее),
    параллелизм на CPU — для Fiber и goroutine.'
- id: q12
  text: Почему в языках со stackless-корутинами (JavaScript, Python) существует проблема «раскраски функций»,
    а в Ruby — нет?
  type: single
  options:
  - id: a
    text: Раскраска функций — особенность только динамически типизированных языков, а Ruby таковым не
      является
    correct: false
    explanation: Ruby — динамически типизированный язык, и типизация вообще не связана с происхождением
      проблемы раскраски функций.
  - id: b
    text: В Ruby отсутствуют функции высшего порядка вроде map, поэтому проблема комбинирования async-колбэков
      просто не возникает
    correct: false
    explanation: В Ruby есть функции высшего порядка (map, select и другие) — причина отсутствия раскраски
      не в их отсутствии, а в том, где именно реализована корутинность.
  - id: c
    text: 'В Ruby корутинность выражена на уровне рантайма, а не в сигнатуре метода: обычный код не обязан
      объявлять себя async, чтобы уступать исполнение'
    correct: true
    explanation: В stackless-языках async — часть сигнатуры функции, и вызвать её можно только из другой
      async-функции — цвет заражает весь стек вызовов вверх. В Ruby эту роль на уровне рантайма выполняет
      Fiber, не требуя разметки кода.
  - id: d
    text: В Ruby async/await появился раньше, чем в JavaScript, поэтому экосистема сразу строилась без
      раскраски
    correct: false
    explanation: В Ruby нет ключевых слов async/await вообще — вместо явной разметки функций корутинность
      обеспечивается прозрачно через Fiber Scheduler.
  difficulty: hard
  topics:
  - ruby_runtime
  explanation: Раскраска функций (термин из эссе Боба Найстрома) — следствие того, что в stackless-языках
    async — часть сигнатуры, и такую функцию можно вызвать только из другой async. Ruby Fiber — stackful
    и существует на уровне рантайма с 2007 года, поэтому существующий синхронный код не требует переписывания.
  extended_explanation: 'Практическое следствие раскраски в других языках: разделение экосистемы библиотек
    на синхронные и асинхронные версии (requests/aiohttp в Python) и молчаливые баги вроде забытого await,
    когда промис остаётся truthy-объектом вместо ожидаемого значения — в Ruby с Fiber Scheduler такого
    разделения экосистемы не возникает.'
  recommendation: Прочитать оригинальное эссе Боба Найстрома «What Color Is Your Function?» и сравнить
    с моделью Fiber Scheduler.
- id: q13
  text: Puma запущен с 4 worker-процессами по 5 потоков в каждом. Приложение упирается в нехватку соединений
    с БД, хотя connection pool настроен на большое число. От чего в первую очередь должен зависеть размер
    пула на один процесс?
  type: single
  options:
  - id: a
    text: От общего числа worker-процессов на всех серверах в кластере, вне зависимости от числа потоков
      внутри процесса
    correct: false
    explanation: Пул считается на один процесс — без прокси вроде pgBouncer процессы держат независимые
      пулы соединений, не общий на кластер.
  - id: b
    text: От числа потоков в одном worker-процессе — именно они разбирают соединения из общего для процесса
      пула
    correct: true
    explanation: Каждый worker-процесс Puma держит собственный connection pool; если потоков внутри процесса
      больше, чем размер его пула, часть потоков будет ждать освобождения соединения.
  - id: c
    text: От числа ядер CPU на машине, где запущен Puma, независимо от конфигурации workers и threads
    correct: false
    explanation: Число ядер влияет на выбор количества worker-процессов, но сам размер пула соединений
      внутри процесса определяется числом потоков, а не ядрами напрямую.
  - id: d
    text: От объёма оперативной памяти, выделенной под кэш ActiveRecord — чем больше кэш, тем меньше нужен
      пул
    correct: false
    explanation: Кэш ActiveRecord не заменяет соединения с БД для конкурентных запросов — размер пула
      определяется параллелизмом потоков, а не объёмом кэша.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: Puma — это workers (процессы) × threads (потоки на процесс). Каждый worker-процесс держит
    собственный connection pool, и его размер должен покрывать число потоков именно этого процесса, а
    не общее число worker-ов или ядер.
  extended_explanation: Для смягчения проблемы на больших нагрузках используют pooling-proxy — pgBouncer,
    Odyssey или AWS RDS Proxy — которые управляют размером пула отдельно от конфигурации Rails и могут
    разделять реальные соединения с БД между воркерами эффективнее.
  recommendation: 'Свериться с формулой: connection pool на процесс ≥ число потоков (threads) в этом процессе
    Puma.'
- id: q14
  text: Puma запускает несколько worker-процессов через форк. Почему память, занятая N воркерами, обычно
    заметно меньше, чем N умножить на полный объём стека приложения?
  type: single
  options:
  - id: a
    text: Ruby 2+ поддерживает copy-on-write при форке — страницы памяти общие с родительским процессом,
      пока воркер их не изменит
    correct: true
    explanation: Copy-on-write означает, что дочерний процесс после форка разделяет физические страницы
      памяти с родителем, и копирование происходит только при попытке записи — до этого момента память
      фактически общая.
  - id: b
    text: Каждый worker-процесс Puma автоматически выгружает часть кода приложения из памяти сразу после
      старта
    correct: false
    explanation: Puma не выгружает код приложения из памяти воркеров — весь стек приложения остаётся загруженным
      в каждом процессе.
  - id: c
    text: Worker-процессы Puma используют общий GVL, поэтому им не нужно дублировать загруженные классы
      и методы
    correct: false
    explanation: Процессы Puma не делят GVL между собой — у каждого процесса своя память и свой GVL, разделение
      происходит именно на уровне страниц памяти через copy-on-write.
  - id: d
    text: Puma держит в памяти только первый worker полностью, а остальные обращаются к нему через shared-memory
      сегмент
    correct: false
    explanation: Все worker-процессы равноправны и полноценно загружают стек приложения — экономия достигается
      за счёт разделяемых до записи страниц, а не выделенной роли одного из воркеров.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Copy-on-write при форке — причина, по которой N воркеров не потребляют памяти в N раз
    больше, чем один процесс: страницы остаются общими с родителем, пока конкретный воркер их не модифицирует.'
  extended_explanation: На практике доля реально скопированной памяти растёт со временем работы процесса
    из-за сборки мусора и мутации объектов — поэтому экономия от copy-on-write со временем уменьшается,
    а не остаётся постоянной.
  recommendation: Сравнить RSS (Resident Set Size) свежесозданных воркеров Puma с воркерами, проработавшими
    продолжительное время.
- id: q15
  text: Нужно обслужить 1000 одновременных соединений, каждое держится 200 мс, из которых 190 мс — ожидание
    ответа от внешнего сервиса. Какая модель обработки соединений потребует БОЛЬШЕ всего оперативной памяти
    на все 1000 соединений одновременно?
  type: single
  options:
  - id: a
    text: Event loop с колбэками, как в Node.js или EventMachine
    correct: false
    explanation: Event loop хранит одну лёгкую структуру данных на соединение — самый экономный вариант
      по памяти среди перечисленных.
  - id: b
    text: Тред на соединение, как в стандартной модели Puma
    correct: false
    explanation: Тред несёт собственный стек вызовов и накладные расходы планировщика ОС, но остаётся заметно
      легче отдельного процесса — суммарно порядка гигабайта на 1000 соединений, с деградацией планировщика,
      но не критичной нехваткой памяти.
  - id: c
    text: Процесс на соединение, как в классической модели Unicorn
    correct: true
    explanation: При модели «процесс на запрос» каждое из 1000 соединений держит отдельный процесс с полным
      стеком приложения — порядка 100 ГБ суммарно, что практически невозможно на одной машине.
  - id: d
    text: Stackful-корутины, как в модели Falcon
    correct: false
    explanation: Файбер занимает единицы килобайт стека — на 1000 соединений это единицы мегабайт, сравнимо
      по эффективности с event loop.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Модель «процесс на запрос» (Unicorn, PHP-FPM, Apache prefork) даёт полную изоляцию ценой
    памяти: каждый процесс несёт собственную полную копию загруженного приложения (десятки-сотни МБ), и на
    1000 медленных I/O-bound соединений это уходит в порядка 100 ГБ — что и вынуждает ставить nginx перед
    Unicorn, буферизуя медленных клиентов до того, как запрос доберётся до тяжёлого процесса.'
  extended_explanation: Остальные три модели решают ту же задачу заметно дешевле по памяти именно потому,
    что не выделяют отдельный процесс на каждое ожидающее соединение — тред занимает единицы мегабайт на
    стек, callback-структура event loop и стек файбера — единицы килобайт, на порядки легче полноценного
    процесса с собственной копией приложения.
  recommendation: Сравнить таблицу моделей обработки соединений (процесс / тред / event loop / stackful-корутины)
    по памяти, читаемости кода и изоляции ошибок.
- id: q16
  text: Сервер на event loop с колбэками (в духе EventMachine или Node.js) обрабатывает 1000 соединений
    в единицы мегабайт памяти — эффективнее модели «тред на соединение». Какова типичная цена этой эффективности?
  type: single
  options:
  - id: a
    text: Такая модель несовместима с HTTPS и требует отдельного прокси для терминации TLS перед каждым
      запросом
    correct: false
    explanation: Совместимость с HTTPS не зависит от модели обработки соединений — TLS-терминация возможна
      как с event loop, так и с другими моделями.
  - id: b
    text: Такая модель требует вдвое больше CPU на то же количество запросов по сравнению с моделью «тред
      на соединение»
    correct: false
    explanation: Event loop обычно не требует больше CPU для той же нагрузки — цена именно в структуре
      кода, а не в потреблении процессора.
  - id: c
    text: Event loop не может обслуживать более 100 одновременных соединений без установки дополнительных
      расширений ОС
    correct: false
    explanation: Именно event loop и был придуман для решения проблемы C10K — тясячи соединений на одном
      потоке, а не ограничение до сотни.
  - id: d
    text: 'Код выворачивается в цепочки колбэков: try/catch не работает сквозь них, а стектрейсы обрываются
      на границе колбэка'
    correct: true
    explanation: C10K решается ценой читаемости — последовательная логика распадается на вложенные колбэки,
      и привычные механизмы вроде исключений перестают прозрачно работать через асинхронные границы.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: 'Event loop с колбэками экономит память ценой читаемости: одна лёгкая структура данных
    на соединение вместо процесса или треда, но последовательная логика превращается в цепочки колбэков,
    где обычные try/catch и стектрейсы перестают работать сквозным образом.'
  extended_explanation: 'Именно эту проблему решило четвёртое поколение — stackful-корутины (Falcon, Go,
    Java 21 Virtual Threads): та же экономия памяти, что у event loop, но с синтаксисом синхронного, последовательного
    кода.'
  recommendation: Сравнить фрагмент кода на колбэках (EventMachine) с эквивалентным синхронным кодом под
    Fiber Scheduler (Falcon) — визуально оценить разницу в читаемости.
- id: q17
  text: EventMachine появилась в 2003 году — на шесть лет раньше Node.js — с той же архитектурой (reactor
    + колбэки). Почему она не стала для Ruby тем же, чем Node.js стала для JavaScript?
  type: single
  options:
  - id: a
    text: EventMachine требовала операционную систему реального времени (RTOS) и не запускалась на обычных
      Linux-серверах
    correct: false
    explanation: EventMachine работала на обычных ОС через стандартные reactor-механизмы (epoll/kqueue)
      — требования RTOS не было.
  - id: b
    text: EventMachine была написана на C++ и несовместима с чистым Ruby-кодом без дополнительной компиляции
    correct: false
    explanation: EventMachine — обычный гем, устанавливаемый и используемый как любой другой; проблема
      была не в языке реализации, а в состоянии остальной экосистемы библиотек.
  - id: c
    text: В 2003 году в Ruby ещё не было классов и модулей, необходимых для реализации reactor-паттерна
    correct: false
    explanation: Классы и модули существуют в Ruby с самых ранних версий — ограничение было не в возможностях
      языка, а в экосистеме сопутствующих библиотек.
  - id: d
    text: Экосистема Ruby уже была синхронной (Net::HTTP, pg, ActiveRecord) — один блокирующий вызов внутри
      reactor'а останавливал весь event loop, а у JS такой проблемы не было изначально
    correct: true
    explanation: В браузере не было ни файлов, ни сокетов — синхронных I/O-библиотек в JS никогда не существовало,
      и Node строил экосистему асинхронной с чистого листа. В Ruby пришлось бы переписывать уже существующие
      блокирующие библиотеки.
  difficulty: medium
  topics:
  - ruby_runtime
  explanation: Главная причина — состояние экосистемы на момент появления. Rails и стандартные библиотеки
    (Net::HTTP, pg, ActiveRecord) уже существовали как блокирующие, и один такой вызов внутри reactor'а
    останавливал весь event loop, требуя параллельной вселенной асинхронных гемов, которые отставали по
    функциональности.
  extended_explanation: 'Ruby-сообщество в итоге получило лучшее решение без переписывания экосистемы:
    вместо доработки EventMachine или колбэков дождались Fiber Scheduler (2020) — синхронный на вид код
    без раскраски функций, работающий поверх уже существующих блокирующих библиотек.'
  recommendation: Сравнить путь Ruby (Fiber Scheduler поверх существующего кода) с путём JavaScript (промисы
    2015, async/await 2017, переписывание библиотек) к решению одной и той же проблемы C10K.
- id: q18
  text: Контроллер Rails возвращает ответ на HTTP-запрос. Является ли сам класс-контроллер Rack-приложением?
  type: single
  options:
  - id: a
    text: 'Нет — контроллеры вызываются через собственный API #dispatch, а не через стандартный Rack-метод
      #call'
    correct: true
    explanation: 'Rack-приложение обязано реализовывать #call(env) → [status, headers, body]. Контроллеры
      этот контракт не реализуют — роутинг вызывает у них #dispatch, специфичный для Action Controller
      API.'
  - id: b
    text: Да — раз Rails построен на Rack, любой его класс, включая контроллеры, реализует интерфейс Rack-приложения
    correct: false
    explanation: То, что фреймворк построен на Rack, не означает, что каждый его внутренний класс сам
      является Rack-приложением — этим свойством обладают только корневой application object и middleware.
  - id: c
    text: Да, но только для API-контроллеров (ActionController::API) — обычные ActionController::Base
      таковыми не являются
    correct: false
    explanation: 'Разница между ActionController::API и ActionController::Base не в реализации Rack-контракта
      — ни тот, ни другой не вызываются как #call(env).'
  - id: d
    text: Нет — потому что контроллеры исполняются на отдельном сервере, минуя стек Rack-middleware полностью
    correct: false
    explanation: 'Контроллеры не исполняются на отдельном сервере — запрос проходит через тот же Rack
      middleware stack, просто на финальном шаге роутинг вызывает не #call, а #dispatch.'
  difficulty: hard
  topics:
  - ruby_runtime
  - mvc
  explanation: 'Rack-приложением называется объект с методом #call(env), возвращающим rack-совместимый
    массив [status, headers, body]. Middleware и корневой application object этому контракту следуют,
    но роутинг Rails дальше dispatch-ит запрос не в rack-приложения, а в классы контроллеров через отдельный
    API — #dispatch.'
  extended_explanation: 'На каждый запрос ActionController создаёт новый чистый экземпляр контроллера
    и вызывает у него #dispatch, который прогоняет колбэки (before/after/around) и рендерит контент. При
    этом action-методы не возвращают response напрямую — они мутируют объект response, который только
    потом конвертируется в rack-совместимый массив на обратном пути через middleware.'
  recommendation: Прочитать про Rails on Rack (rails_on_rack guide) — там описан переход от Rack middleware
    к роутингу и дальше к контроллерам.
- id: q19
  text: Rack middleware оборачивает следующее приложение в стеке. В какой момент(ы) middleware может изменить
    данные запроса или ответа?
  type: single
  options:
  - id: a
    text: Только после того, как запрос полностью пройдёт роутинг и вернётся из контроллера
    correct: false
    explanation: Middleware оборачивает весь стек, включая этап до роутинга — модификация возможна и на
      пути внутрь, до того как запрос вообще дойдёт до роутинга и контроллера.
  - id: b
    text: Только один раз — либо до вызова следующего приложения, либо после, но не оба одновременно в
      одном middleware
    correct: false
    explanation: 'Один и тот же объект middleware вполне может модифицировать данные в обеих точках —
      до и после вызова следующего слоя — в рамках одного вызова #call.'
  - id: c
    text: 'Дважды: может изменить env до вызова следующего приложения и изменить response после его возврата'
    correct: true
    explanation: Middleware видит запрос дважды — на пути внутрь (может модифицировать env перед передачей
      дальше) и на обратном пути (может изменить статус, заголовки или тело ответа).
  - id: d
    text: Middleware в Rails может изменять только заголовки ответа, но не имеет доступа к env запроса
    correct: false
    explanation: Middleware получает полный доступ к env hash запроса на входе — ограничения только заголовками
      ответа нет.
  difficulty: medium
  topics:
  - ruby_runtime
  - mvc
  explanation: 'Middleware — объекты, оборачивающие другие rack-приложения: вызывающий их код передаёт
    управление дальше по цепочке и получает результат обратно, из-за чего у middleware есть точка "до"
    (можно изменить env) и точка "после" (можно изменить response).'
  extended_explanation: В типичном Rails-приложении запрос проходит порядка 20 встроенных middleware по
    умолчанию, прежде чем попасть в роутинг — каждый из них потенциально имеет обе точки воздействия на
    запрос и ответ.
  recommendation: Посмотреть вывод `rails middleware` в консольном проекте — список реального middleware
    stack по умолчанию.
- id: q20
  text: Итоговый веб-сервер (например, Puma) получил HTTP-запрос от клиента. Что он делает, прежде чем
    запрос доберётся до Rack middleware stack приложения?
  type: single
  options:
  - id: a
    text: Сразу инстанцирует нужный класс контроллера и вызывает его action-метод напрямую, минуя Rack
    correct: false
    explanation: Веб-сервер не знает о контроллерах вообще — он работает исключительно на уровне Rack-контракта,
      а маршрутизация к конкретному контроллеру происходит уже внутри приложения, после прохождения middleware.
  - id: b
    text: 'Конвертирует HTTP-запрос в env hash и вызывает #call у корневого rack-приложения'
    correct: true
    explanation: 'Веб-сервер — граница между сырым HTTP и миром Rack: он парсит запрос в структуру env
      (метод, путь, заголовки, тело) и вызывает стандартный Rack-контракт #call(env).'
  - id: c
    text: Выполняет полный парсинг маршрутов из routes.rb, чтобы определить нужный контроллер до вызова
      Rack-приложения
    correct: false
    explanation: Разбор routes.rb — задача роутера внутри самого Rails-приложения; сервер работает только
      на уровне Rack-контракта и об этом файле ничего не знает.
  - id: d
    text: Немедленно применяет все настройки кэширования HTTP-заголовков из конфигурации Rails перед вызовом
      приложения
    correct: false
    explanation: Настройка заголовков кэширования — задача кода приложения (контроллеров или middleware),
      а не самого веб-сервера на этом раннем этапе.
  difficulty: medium
  topics:
  - ruby_runtime
  - mvc
  explanation: 'Роль итогового веб-сервера (Puma, Unicorn, Passenger) — граница протокола: он переводит
    сырой HTTP-запрос в env hash и вызывает #call у Rack-приложения, дальше вся логика — middleware, роутинг,
    контроллеры — целиком на стороне приложения.'
  extended_explanation: 'Rails сам по себе — Rack-приложение (реализует #call), поэтому эта же архитектура
    работает одинаково что для Rails, что для Sinatra или голого Rack-приложения — сервер не различает
    фреймворки, для него все они — один и тот же контракт.'
  recommendation: Прочитать про env hash — какие ключи Rack-спецификация гарантирует внутри него (REQUEST_METHOD,
    PATH_INFO и другие).
