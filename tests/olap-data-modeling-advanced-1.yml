        text: "quantity — факт; товар, магазин и дата — измерения, описывающие контекст"
        correct: true
        explanation: "Факт — числовой результат события, который агрегируют. Измерения отвечают на вопросы «что, где, когда» и обычно служат для группировки и фильтров."
      - id: d
        text: "Факты — внешние ключи, они идентифицируют событие; quantity — атрибут измерения"
        correct: false
        explanation: "Ключи только связывают строку факта с измерениями. Количество принадлежит самому событию продажи."
    explanation: "Факт — числовое значение, которое агрегируют по разным разрезам (сумма, количество, выручка). Измерение — описательный контекст события, обычно используется для группировки или фильтрации. В примере quantity — результат продажи, а товар, магазин и дата — обстоятельства, при которых она произошла."
    extended_explanation: "В одной таблице фактов часто несколько показателей: количество, сумма, себестоимость. Они разные по природе: количество и сумму можно складывать по любым измерениям, а остатки на складе — нет, их складывают по товарам, но не по датам (такие факты называют полуаддитивными)."
    recommendation: "Разметить таблицу фактов своего проекта: какие поля показатели, какие ссылки на измерения."
    difficulty: easy
    topics: [analytics]

  - id: q18
    text: "Система защиты от злоупотреблений оценивает, сколько раз конкретный IP-адрес обращался к API за последний час, не заводя явный счётчик на каждый из миллионов адресов. Какая приближённая структура для этого подходит?"
    type: single
    options:
      - id: a
        text: "count-min sketch — таблица счётчиков с несколькими хэш-функциями"
        correct: true
        explanation: "Каждый IP хэшируется в несколько ячеек разных строк таблицы, и оценкой частоты служит минимум из этих счётчиков. Память фиксирована и не растёт с числом адресов."
      - id: b
        text: "Bloom filter — битовый массив с хэш-функциями для проверки принадлежности"
        correct: false
        explanation: "Фильтр скажет, встречался ли адрес вообще, но не сколько раз. Счётчиков в нём нет."
      - id: c
        text: "HyperLogLog — регистры максимальных нулей в хэшах для оценки числа различных IP"
        correct: false
        explanation: "HyperLogLog ответит, сколько всего разных адресов было. Частоту конкретного адреса по нему получить нельзя."
      - id: d
        text: "Reservoir sampling — равномерная выборка фиксированного размера из потока"
        correct: false
        explanation: "Выборка даёт лишь грубое представление о доле, а редкие адреса в неё могут вообще не попасть. Оценки счётчика для заданного ключа с гарантиями она не даёт."
    explanation: "count-min sketch оценивает частоту элементов потока в фиксированном объёме памяти. Коллизии хэшей могут только завысить счётчик, занизить его они не могут, поэтому оценка никогда не меньше истинного значения. Такой же подход применяют для поиска самых частых значений (heavy hitters)."
    extended_explanation: "Точность задаётся двумя параметрами: ширина таблицы определяет величину переоценки, число строк — вероятность выхода за границу погрешности. Больше памяти — меньше завышение. Для rate limiting на скользящем часе обычно держат несколько sketch по временным бакетам и суммируют их."
    recommendation: "Изучить, как count-min sketch применяют для rate limiting и поиска heavy hitters в системах защиты от злоупотреблений."
    difficulty: hard
    topics: [analytics]

  - id: q19
    text: "Пайплайн считает среднюю задержку доставки заказов за каждый час по event time (времени создания заказа), а не по processing time (времени, когда событие дошло до системы). Какую проблему это решает?"
    type: single
    options:
      - id: a
        text: "Агрегаты считаются быстрее, потому что события не нужно буферизовать до закрытия окна"
        correct: false
        explanation: "По event time приходится ждать опоздавших и держать состояние окон дольше, так что быстрее не становится. Выигрыш в корректности."
      - id: b
        text: "Результат не зависит от задержек доставки: событие попадает в час, когда произошло"
        correct: true
        explanation: "Агрегат определяется только временем в самом событии. Сетевые задержки, ретраи и перегрузка обработчика на него не влияют, а повторный прогон тех же данных даст тот же результат."
      - id: c
        text: "Каждое событие обрабатывается ровно один раз, дубликаты после ретраев отбрасываются"
        correct: false
        explanation: "Ровно-однократная обработка (exactly-once) обеспечивается идемпотентностью и транзакциями потока. С выбором времени группировки она не связана."
      - id: d
        text: "Отпадает необходимость в watermark, поскольку порядок событий гарантирован"
        correct: false
        explanation: "Event time как раз требует watermark: порядок прихода событий не гарантирован, и системе нужно решать, когда окно можно закрыть."
    explanation: "Группировка по processing time зависит от нагрузки и сетевых задержек, поэтому один и тот же набор данных при повторном прогоне может дать другие числа. Event time привязывает результат ко времени самого события, и он остаётся одинаковым при любом прогоне."
    extended_explanation: "Цена event time — необходимость управлять опоздавшими данными через watermark и политику их обработки, а также держать состояние окон дольше. Processing time проще и дешевле, но годится там, где важна скорость реакции, а не точность по времени события, например для мониторинга пропускной способности самого пайплайна."
    recommendation: "Проверить, по какому времени (event или processing) группируются агрегаты в потоковых пайплайнах своего проекта."
    difficulty: hard
    topics: [data]

  - id: q20
    text: "Команда платформы данных стала узким местом: все домены стоят в её очереди за новыми витринами. Какой подход предлагает передать ответственность за данные самим доменным командам, публикующим их как продукт?"
    type: single
    options:
      - id: a
        text: "Lakehouse — единое хранилище поверх озера с транзакциями и схемами"
        correct: false
        explanation: "Lakehouse решает техническую задачу хранения и транзакционности данных на озере. Кто в компании владеет данными, он не определяет."
      - id: b
        text: "Lambda-архитектура — раздельные пакетный и потоковый слои обработки"
        correct: false
        explanation: "Lambda описывает устройство вычислений: два слоя обработки с объединением результатов. Организационной структуры команд она не затрагивает."
      - id: c
        text: "Medallion-архитектура — слои bronze, silver и gold с растущим качеством данных"
        correct: false
        explanation: "Medallion раскладывает данные по уровням очистки и обогащения. Вопрос владения слоями она оставляет открытым."
      - id: d
        text: "Data mesh — доменные команды владеют данными как продуктом"
        correct: true
        explanation: "Data mesh распределяет ответственность за качество, публикацию и поддержку наборов данных между доменами. Очередь к центральной команде исчезает."
    explanation: "Data mesh отвечает на организационный вопрос: кто отвечает за данные. Каждая доменная команда публикует свои наборы как продукт со своим SLA и потребителями, а центральная платформа даёт инструменты, а не выполняет заказы."
    extended_explanation: "Data mesh обычно внедряют вместе с техническими механизмами: data contract фиксирует обязательства домена, data catalog делает наборы данных находимыми. Без них распределённое владение превращается в разрозненные витрины без гарантий. Основы описала Жамак Дегани."
    recommendation: "Прочитать исходную статью Zhamak Dehghani о принципах data mesh и сопоставить с централизованной моделью владения данными."
    difficulty: medium
    topics: [analytics]
