slug: olap-data-modeling-advanced-1
title: "OLAP: модель данных и приближённые вычисления"
description: "Практический тест про моделирование хранилищ (звезда/снежинка, SCD), приближённые структуры данных для больших объёмов (HyperLogLog, t-digest, count-min sketch, Bloom filter), окна в потоковой обработке и профили нагрузки OLTP/OLAP/HTAP."
tags: [olap, data-modeling, streaming, analytics]
difficulty: advanced
estimated_time: 25

questions:
  - id: q1
    text: "В хранилище факты заказов лежат в одной центральной таблице, а клиенты, товары и даты — в справочниках, по одной таблице на сущность, соединённых с ней напрямую. Как называется такая схема?"
    type: single
    options:
      - id: a
        text: "Схема «снежинка» — справочники нормализованы в иерархию связанных таблиц"
        correct: false
        explanation: "Снежинка нормализует сами измерения: товар ссылался бы на отдельную таблицу категорий. В описанной схеме справочники плоские."
      - id: b
        text: "Data vault — хабы, линки и сателлиты вместо измерений"
        correct: false
        explanation: "Data vault моделирует сущности, связи и их историю отдельными таблицами и подходит для интеграционного слоя. Центральной таблицы фактов с плоскими справочниками в нём нет."
      - id: c
        text: "Схема «звезда» — таблица фактов в центре, плоские измерения вокруг"
        correct: true
        explanation: "Название пришло из формы диаграммы: один центр и лучи-справочники, каждый из которых хранится одной денормализованной таблицей."
      - id: d
        text: "Фактовое созвездие (fact constellation) — несколько таблиц фактов с общими измерениями"
        correct: false
        explanation: "В созвездии несколько таблиц фактов делят между собой общие измерения. Здесь факт один, поэтому это обычная звезда."
    explanation: "Звезда — базовая схема DWH: одна таблица фактов (числовые измеримые значения вроде суммы и количества) и денормализованные измерения вокруг неё (клиенты, товары, даты). Денормализация сделана сознательно: запросу нужно меньше JOIN, и читается он проще."
    extended_explanation: "У звезды есть цена: название категории повторяется в каждой строке товара этой категории. Для аналитики она приемлема, потому что таблица фактов растёт на порядки быстрее справочников, и экономия места на измерениях почти не чувствуется."
    recommendation: "Нарисовать звезду для своего домена: что станет таблицей фактов, а что измерениями."
    difficulty: easy
    topics: [analytics]

  - id: q2
    text: "HyperLogLog считает уникальных посетителей за месяц по миллиардам событий. Какую цену платят за отказ от точного COUNT(DISTINCT)?"
    type: single
    options:
      - id: a
        text: "Результат приблизителен, погрешность контролируется, взамен резко меньше памяти"
        correct: true
        explanation: "Вместо множества всех встреченных идентификаторов хранится небольшой набор регистров фиксированного размера. Типичная погрешность порядка процента при килобайтах памяти вместо гигабайт."
      - id: b
        text: "Оценка всегда занижена, и к ней приходится вручную добавлять поправку"
        correct: false
        explanation: "Погрешность двусторонняя: оценка может оказаться и выше, и ниже истинного значения. Поправки на малые и большие значения алгоритм вносит сам."
      - id: c
        text: "Состояния по разным сегментам нельзя объединить, поэтому каждый срез считается заново по сырым данным"
        correct: false
        explanation: "Как раз слияние у HyperLogLog работает: регистры двух структур объединяются поэлементным максимумом. Обычный COUNT(DISTINCT) по сегментам складывать нельзя, а здесь можно."
      - id: d
        text: "Структура возвращает лишь порядок величины, например число с точностью до степени десятки"
        correct: false
        explanation: "Точность HyperLogLog — единицы процентов и настраивается числом регистров. Грубая оценка до порядка величины — это другой, куда более слабый инструмент."
    explanation: "Точный подсчёт уникальных значений требует держать в памяти всё множество увиденных идентификаторов, а при миллиардах событий это дорого. HyperLogLog заменяет множество вероятностной структурой фиксированного размера и отдаёт оценку кардинальности с контролируемой погрешностью."
    extended_explanation: "Во многих СУБД это встроенная функция: `uniqCombined` в ClickHouse, `APPROX_COUNT_DISTINCT` в BigQuery и Snowflake. Хранить в таблице можно сами HLL-состояния и объединять их при запросе, так что суточные оценки складываются в месячную без повторного чтения событий."
    recommendation: "Сравнить время и результат COUNT(DISTINCT) и приближённой функции на одной крупной таблице."
    difficulty: medium
    topics: [analytics]

  - id: q3
    text: "Поток событий агрегируется окнами по 5 минут, которые идут встык и не пересекаются: каждое событие попадает ровно в одно окно. Как называется такой тип окна?"
    type: single
    options:
      - id: a
        text: "Sliding window — окна фиксированной длины, сдвигающиеся с шагом меньше длины"
        correct: false
        explanation: "Перекрытие — отличительная черта sliding: одно событие попадает сразу в несколько окон. Условие вопроса его исключает."
      - id: b
        text: "Session window — границы определяются паузой в активности"
        correct: false
        explanation: "У сессионного окна нет фиксированной длины: оно живёт, пока события идут чаще порога паузы."
      - id: c
        text: "Global window — одно окно на весь поток, которое закрывается по триггеру"
        correct: false
        explanation: "Global window не нарезает время на отрезки вообще. Результат выдаётся, когда срабатывает триггер, например по числу событий."
      - id: d
        text: "Tumbling window — окна фиксированной длины, идущие встык без пропусков и наложений"
        correct: true
        explanation: "Время делится на равные последовательные отрезки, и каждый момент принадлежит ровно одному окну."
    explanation: "Tumbling window — самый простой тип окна в потоковой обработке: равные интервалы идут один за другим, событие определяется в окно по своей временной метке. Окна «перекатываются» без наложения и без дыр между ними."
    extended_explanation: "Длина окна — компромисс между задержкой и устойчивостью агрегата. Пятиминутное окно даёт цифру быстро, но шумно, часовое сглаживает шум ценой ожидания. Ещё одно следствие: границы окон привязаны к часам (00:00–00:05, 00:05–00:10), а не к моменту старта приложения."
    recommendation: "Сравнить tumbling, sliding и session на одном потоке, отрисовав границы окон на временной оси."
    difficulty: easy
    topics: [data]

  - id: q4
    text: "В таблице измерения «Сотрудники» нужно хранить полную историю смены должностей: кто, когда и кем работал. По этим данным строятся отчёты за прошлые периоды. Какой тип SCD (Slowly Changing Dimension) подходит?"
    type: single
    options:
      - id: a
        text: "SCD Type 1 — новое значение перезаписывает старое, история не хранится"
        correct: false
        explanation: "Type 1 теряет прошлое при каждом обновлении. Подходит для исправления опечаток, но не для отчётов на прошлые даты."
      - id: b
        text: "SCD Type 2 — на каждое изменение добавляется строка с периодом действия"
        correct: true
        explanation: "Каждая версия сотрудника хранится отдельной строкой с границами valid_from и valid_to, поэтому состояние восстанавливается на любую дату."
      - id: c
        text: "SCD Type 3 — предыдущее значение хранится в дополнительной колонке рядом с текущим"
        correct: false
        explanation: "Type 3 помнит только одно предыдущее значение. Третья смена должности вытолкнет первую, и история будет неполной."
      - id: d
        text: "SCD Type 0 — значение задаётся при создании строки и никогда не меняется"
        correct: false
        explanation: "Type 0 нужен для неизменяемых атрибутов, вроде даты рождения. Должность по условию меняется, и это изменение надо отслеживать."
    explanation: "Типы SCD решают разные задачи: Type 1 просто обновляет значение, Type 2 копит версии строк с периодом действия, Type 3 держит одно предыдущее значение в соседней колонке. Полную историю на любую дату обеспечивает только Type 2."
    extended_explanation: "В Type 2 у измерения появляется суррогатный ключ строки, отдельный от натурального ключа сотрудника. Факт (например, продажа) ссылается на ту версию сотрудника, которая действовала в момент события, а не на актуальную. Отсюда же типовой фильтр is_current = true для запросов про «сейчас»."
    recommendation: "Реализовать SCD Type 2 для одного измерения в своём хранилище с полями valid_from, valid_to и is_current."
    difficulty: medium
    topics: [analytics]

  - id: q5
    text: "Нагрузка описана так: много одновременных клиентов, каждый выполняет короткие операции над одной-двумя строками; важны низкая задержка и строгая согласованность. Какому профилю это соответствует?"
    type: single
    options:
      - id: a
        text: "OLAP — небольшое число тяжёлых запросов, сканирующих большие объёмы данных"
        correct: false
        explanation: "OLAP читает много строк за запрос и оптимизирован под пропускную способность. Короткие точечные операции — противоположный профиль."
      - id: b
        text: "Пакетная обработка (batch) — периодический расчёт над накопленным массивом данных"
        correct: false
        explanation: "Batch работает по расписанию над большим объёмом, и задержка одной операции для него не критична. Клиентов, ждущих ответа, в такой модели нет."
      - id: c
        text: "OLTP (Online Transaction Processing) — оперативная обработка транзакций"
        correct: true
        explanation: "Много параллельных клиентов, короткие операции над малым числом строк, низкая задержка и ACID — это классический OLTP."
      - id: d
        text: "Потоковая обработка (stream processing) — непрерывное вычисление над бесконечным потоком событий"
        correct: false
        explanation: "Stream processing непрерывно агрегирует поток событий. Транзакционных гарантий на отдельные строки, которых требует условие, он не даёт."
    explanation: "OLTP характерен для операционных приложений: магазин, банк, бронирование. Операции короткие и затрагивают малое число строк, а ACID-гарантии нужны, чтобы, например, два одновременных списания не привели к неверному остатку."
    extended_explanation: "OLTP-базы обычно хранят данные по строкам: запись физически лежит рядом, и чтение или запись целой строки дёшевы. Аналитические колоночные СУБД устроены наоборот и выигрывают на чтении отдельных колонок по множеству строк."
    recommendation: "Сопоставить OLTP, OLAP и HTAP по частоте операций, объёму затрагиваемых данных и требованиям к задержке."
    difficulty: easy
    topics: [analytics]

  - id: q6
    text: "Bloom filter, построенный по ключам таблицы, на запрос ответил «элемента нет». Что можно утверждать?"
    type: single
    options:
      - id: a
        text: "Ключа в множестве гарантированно нет: ложноотрицательных ответов фильтр не даёт"
        correct: true
        explanation: "Фильтр ошибается только в одну сторону: «нет» всегда достоверно, а «возможно, есть» может оказаться ложным срабатыванием."
      - id: b
        text: "Ключа нет с высокой вероятностью, но для окончательного ответа нужно сходить в хранилище"
        correct: false
        explanation: "Сходить в хранилище нужно после ответа «возможно, есть». Отрицательный ответ окончательный."
      - id: c
        text: "Ответ может быть ошибочным, если в фильтр добавили заметно больше элементов, чем он рассчитан"
        correct: false
        explanation: "Перегрузка фильтра растит долю ложных срабатываний, то есть ошибочных «есть». Ложное «нет» невозможно, пока элементы не удаляют из битового массива."
      - id: d
        text: "«Нет» и «да» одинаково ненадёжны, поэтому фильтр применяют только вместе с точным поиском"
        correct: false
        explanation: "Надёжность ответов асимметрична. Именно поэтому фильтр ставят перед дорогим поиском: он дёшево отсекает заведомо отсутствующие ключи."
    explanation: "Bloom filter хранит битовый массив и несколько хэш-функций. Если хотя бы один из нужных битов не выставлен, элемент точно не добавлялся. Если все выставлены, элемент мог быть добавлен, а мог совпасть с другими по битам."
    extended_explanation: "Так фильтры используют в LSM-хранилищах (Cassandra, RocksDB, ClickHouse skip-индексы): перед чтением файла на диске проверяют фильтр и пропускают файлы, где ключа заведомо нет. Классический Bloom filter не умеет удалять элементы, для этого есть counting-вариант и cuckoo filter."
    recommendation: "Посмотреть, как LSM-хранилище использует Bloom filter при чтении, и как размер фильтра связан с долей ложных срабатываний."
    difficulty: hard
    topics: [analytics]

  - id: q7
    text: "Отчёт по суммарной выручке за каждый месяц последних трёх лет считается на лету при каждом открытии дашборда, хотя данные за прошлые месяцы уже не меняются. Что применяют, чтобы не пересчитывать одно и то же?"
    type: single
    options:
      - id: a
        text: "Партиционировать таблицу фактов по месяцам, чтобы читались только нужные партиции"
        correct: false
        explanation: "Партиционирование отсекает лишнее при сканировании, но суммирование внутри нужных партиций повторяется при каждом запросе."
      - id: b
        text: "Построить покрывающий индекс по дате и выручке, чтобы сумма читалась из индекса"
        correct: false
        explanation: "Покрывающий индекс избавляет от обращения к таблице, но сам просматривается целиком по диапазону. Готовых итогов в нём нет."
      - id: c
        text: "Увеличить кэш запросов СУБД, чтобы повторный запрос отдавался из памяти"
        correct: false
        explanation: "Кэш помогает только на точном повторе запроса. Другой диапазон дат или фильтр, и расчёт идёт заново."
      - id: d
        text: "Предагрегация: итоги по закрытым месяцам считаются один раз и хранятся готовыми"
        correct: true
        explanation: "Стоимость расчёта переносится с чтения на загрузку: закрытые месяцы считаются единожды, а пересчитывается только текущий."
    explanation: "Предагрегация — стандартный способ ускорить повторяющиеся аналитические запросы. Для закрытых периодов суммы сохраняют в отдельной таблице или материализованном представлении, а обновляют только открытый период. Работа переезжает из запроса пользователя в фоновую загрузку."
    extended_explanation: "Материализованное представление — одна из реализаций идеи: результат запроса хранится физически и обновляется по расписанию или событию. Обычное представление сохраняет лишь текст запроса и выполняет его заново. В ClickHouse похожую роль играют AggregatingMergeTree и материализованные представления, которые агрегируют данные в момент вставки."
    recommendation: "Настроить предагрегирующую таблицу для часто открываемого, но редко меняющегося отчёта."
    difficulty: medium
    topics: [analytics]

  - id: q8
    text: "Пользовательская активность делится на сессии: события одного пользователя относятся к одной сессии, пока между соседними проходит не больше 30 минут. Какой тип окна для этого предназначен?"
    type: single
    options:
      - id: a
        text: "Tumbling window длиной 30 минут — окна идут встык без перекрытия"
        correct: false
        explanation: "Фиксированная нарезка режет сессию в произвольном месте: активность с 12:20 по 12:50 разорвётся на два окна."
      - id: b
        text: "Session window — окно закрывается, когда пауза между событиями превышает порог"
        correct: true
        explanation: "Окно растёт, пока события поступают в пределах порога тишины, и закрывается после первой слишком длинной паузы. Длина сессии у каждого пользователя своя."
      - id: c
        text: "Count window — окно закрывается после фиксированного числа событий пользователя"
        correct: false
        explanation: "Count window отсчитывает события и времени не видит. Два клика с разницей в сутки попали бы в одну «сессию», если до лимита далеко."
      - id: d
        text: "Sliding window длиной 30 минут, сдвигающееся каждую минуту"
        correct: false
        explanation: "Скользящее окно перекрывается и не привязано к активности конкретного пользователя. Выделить границы сессии оно не может."
    explanation: "Session window динамически подстраивается под данные: остаётся открытым, пока паузы между событиями короче порога (gap), и закрывается, когда порог превышен. Поэтому оно подходит для группировки событий пользователя в сессии разной длины."
    extended_explanation: "Gap подбирают эмпирически. Слишком короткий дробит одну сессию на несколько, слишком длинный склеивает утренний и вечерний визиты в одну. Во Flink окно задаётся как `EventTimeSessionWindows.withGap(Time.minutes(30))`, а сессии разных ключей считаются независимо."
    recommendation: "Настроить сессионную агрегацию на потоке событий своего продукта и сравнить результат при разных значениях gap."
    difficulty: medium
    topics: [data]

  - id: q9
    text: "Компания хочет строить аналитику в реальном времени прямо поверх базы, куда пишутся транзакции продаж, без отдельного ETL в аналитическое хранилище. Какой профиль системы для этого предназначен?"
    type: single
    options:
      - id: a
        text: "OLTP — система, заточенная под множество коротких операций над отдельными записями"
        correct: false
        explanation: "OLTP оптимизирован под короткие транзакции. Тяжёлые аналитические запросы по большим объёмам мешают основной нагрузке и плохо оптимизируются."
      - id: b
        text: "Lambda-архитектура — раздельные пакетный и потоковый слои с объединением результатов"
        correct: false
        explanation: "Lambda как раз строится на отдельных слоях и копировании данных между системами, то есть ETL никуда не девается."
      - id: c
        text: "HTAP — гибридная обработка: транзакции и аналитика в одной системе"
        correct: true
        explanation: "Hybrid Transactional/Analytical Processing обслуживает обе нагрузки одной системой, поэтому лаг между транзакцией и её появлением в аналитике исчезает."
      - id: d
        text: "OLAP — система, заточенная под тяжёлые агрегирующие запросы по большим объёмам"
        correct: false
        explanation: "OLAP-хранилища отлично считают агрегаты, но рассчитаны на пакетную загрузку и плохо переносят поток мелких изменений отдельных записей."
    explanation: "HTAP стирает границу между двумя профилями нагрузки: OLTP (частые мелкие изменения, низкая задержка) и OLAP (тяжёлые агрегирующие запросы, высокая пропускная способность). Классическая схема требует ETL из OLTP в OLAP-хранилище и несёт задержку и дублирование данных. HTAP убирает и то, и другое."
    extended_explanation: "Внутри HTAP-системы обычно держат два представления данных: свежие записи в строковом формате для быстрых транзакций, а копию в колоночном формате для аналитики. Так устроены TiDB (TiKV и TiFlash) и SingleStore. Цена — расход ресурсов на синхронизацию двух форматов и сложности с изоляцией нагрузок."
    recommendation: "Разобрать устройство одной HTAP-системы (TiDB, SingleStore) и то, как она изолирует аналитику от транзакций."
    difficulty: medium
    topics: [analytics]

  - id: q10
    text: "Нужен дашборд с перцентилями (p50, p95, p99) времени ответа API за скользящий час. Поток идёт с десятками тысяч замеров в секунду, хранить каждое значение нельзя. Какая приближённая структура для этого предназначена?"
    type: single
    options:
      - id: a
        text: "Bloom filter — приближённая проверка того, входит ли элемент в множество"
        correct: false
        explanation: "Bloom filter отвечает на вопрос о принадлежности. Распределения числовых значений он не хранит."
      - id: b
        text: "HyperLogLog — оценка числа различных значений в потоке фиксированной памятью"
        correct: false
        explanation: "HyperLogLog оценивает кардинальность. Сколько раз встретилось значение и как оно распределено, по нему узнать нельзя."
      - id: c
        text: "MinHash — оценка степени похожести двух больших множеств по небольшим сигнатурам"
        correct: false
        explanation: "MinHash сравнивает множества, например для поиска почти дублей документов. Перцентили числового ряда он не вычисляет."
      - id: d
        text: "t-digest — сжатое описание распределения, по которому оцениваются перцентили"
        correct: true
        explanation: "Структура хранит набор центроидов со счётчиками. Они плотнее у краёв распределения, где лежат p95 и p99, так что хвосты оцениваются точнее середины."
    explanation: "t-digest создан для приближённых перцентилей потока без хранения отдельных наблюдений. Точность перераспределена в пользу хвостов, поэтому он хорошо подходит для латентности, где интересны именно высокие перцентили."
    extended_explanation: "Prometheus summary считает перцентили на стороне клиента, и между репликами сервиса их нельзя корректно агрегировать (среднее от p99 разных реплик не равно общему p99). t-digest же объединяется через merge: центроиды двух структур сливаются, и перцентиль общего потока остаётся оценённым корректно."
    recommendation: "Сопоставить t-digest, HyperLogLog и count-min sketch: какую статистическую задачу решает каждая."
    difficulty: hard
    topics: [analytics]

  - id: q11
    text: "В снежинке измерение «Товар» разбито на отдельные таблицы «Категория» и «Бренд», связанные внешними ключами; в звезде всё это было бы одной плоской таблицей. Что снежинка даёт и чем за это платит?"
    type: single
    options:
      - id: a
        text: "Меньше дублирования атрибутов категории и бренда, но больше JOIN в запросах"
        correct: true
        explanation: "Название категории хранится один раз на всю категорию. Платой становится цепочка соединений, когда запросу нужны эти атрибуты."
      - id: b
        text: "Быстрее чтение, потому что узкие нормализованные таблицы лучше помещаются в кэш, при этом растёт сложность загрузки"
        correct: false
        explanation: "Таблицы действительно уже, но каждое дополнительное соединение обычно съедает этот выигрыш. Аналитические запросы на снежинке в среднем медленнее, чем на звезде."
      - id: c
        text: "Возможность хранить историю изменений измерения, недоступную в звезде, ценой удвоения таблицы фактов"
        correct: false
        explanation: "История измерений решается типами SCD и в звезде, и в снежинке. К нормализации справочников и размеру таблицы фактов она не привязана."
      - id: d
        text: "Меньший объём таблицы фактов, но необходимость хранить измерения в колоночном формате"
        correct: false
        explanation: "Нормализация затрагивает только измерения, таблица фактов остаётся прежней. Физический формат хранения от логической схемы не зависит."
    explanation: "Снежинка нормализует измерения: категория и бренд хранятся один раз в своих таблицах. Это экономит место и упрощает правки справочников, но запрос вместо одного соединения с измерением строит цепочку из нескольких JOIN."
    extended_explanation: "Для чисто аналитических нагрузок чаще выбирают звезду: таблица фактов растёт куда быстрее справочников, поэтому экономия от нормализации измерений мала, а лишние JOIN бьют по каждому запросу. Снежинка оправдана, когда измерения очень большие или одни и те же справочники переиспользуются в нескольких схемах."
    recommendation: "Сравнить планы выполнения одного запроса к звезде и к эквивалентной снежинке."
    difficulty: medium
    topics: [analytics]

  - id: q12
    text: "Событие о заказе произошло в 10:00, но из-за сетевой задержки дошло до обработчика только в 10:15, когда окно за 10:00 уже закрыли и результат отправили дальше. Как называется такая ситуация?"
    type: single
    options:
      - id: a
        text: "Backpressure — перегрузка потребителя, из-за которой источник замедляют"
        correct: false
        explanation: "Backpressure — механизм торможения источника при перегрузке потребителя. Об опоздании отдельных событий относительно окна он ничего не говорит."
      - id: b
        text: "Late arriving data — данные пришли, когда их окно уже закрыто"
        correct: true
        explanation: "Событие опоздало относительно своего окна: время события (10:00) и время обработки (10:15) разошлись настолько, что окно уже закрыто."
      - id: c
        text: "Backfill — плановый повторный прогон пайплайна за прошлый период"
        correct: false
        explanation: "Backfill запускает оператор намеренно. Здесь же одно событие опоздало в штатно работающем потоке."
      - id: d
        text: "Catchup — автозапуск пропущенных интервалов расписания при включении пайплайна"
        correct: false
        explanation: "Catchup догоняет пропущенные запуски самого пайплайна. Опоздавшие события внутри уже идущего потока он не описывает."
    explanation: "Late arriving data возникает из-за разницы между event time (когда событие произошло) и processing time (когда оно дошло до системы). Сетевые задержки, недоступность источника и ретраи приводят к тому, что событие приходит после закрытия своего окна. Без специальной обработки оно теряется или искажает уже отправленный агрегат."
    extended_explanation: "Решение в потоковых движках — watermark: он выражает, до какого момента событий система считает данные полученными. При watermark 10:10 все события раньше 10:10 считаются пришедшими, а опоздавшие обрабатываются по заранее выбранной политике: пересчёт окна, отдельный поток правок или отбрасывание. Во Flink это `allowedLateness` и side output для опоздавших."
    recommendation: "Прочитать про модель watermark во Flink и Kafka Streams и о том, как она балансирует полноту данных и задержку результата."
    difficulty: hard
    topics: [data]

  - id: q13
    text: "Запрос считает SUM(amount) по таблице из 80 колонок. Почему колоночное хранение справляется с ним быстрее строкового?"
    type: single
    options:
      - id: a
        text: "Колоночные СУБД при записи сразу пересчитывают суммы по каждой колонке"
        correct: false
        explanation: "Автоматического пересчёта сумм при записи в колоночном формате нет. Готовые итоги дают предагрегации и материализованные представления, а это отдельный механизм."
      - id: b
        text: "Данные колонок целиком лежат в оперативной памяти, поэтому диск не нужен"
        correct: false
        explanation: "Колоночные хранилища работают с диском, как и строковые. Выигрыш даёт сокращение объёма читаемых байтов."
      - id: c
        text: "С диска читается только колонка amount, а однотипные значения хорошо сжимаются"
        correct: true
        explanation: "Из 80 колонок затрагивается одна, то есть читается примерно в 80 раз меньше данных. Однородные значения подряд сжимаются сильнее, что сокращает объём ввода-вывода ещё больше."
      - id: d
        text: "Строки отсортированы по первичному ключу, поэтому суммирование идёт по индексу"
        correct: false
        explanation: "Сортировка по ключу ускоряет поиск, но не уменьшает объём данных при суммировании. Строковый формат всё равно прочитает все 80 колонок каждой строки."
    explanation: "Для агрегатов важно, сколько байтов приходится прочитать. Колоночный формат хранит каждую колонку отдельно, поэтому читаются только нужные, а однородные значения подряд лучше сжимаются и быстрее обрабатываются векторными операциями процессора."
    extended_explanation: "Обратная сторона — дорогие точечные записи и чтение целой строки: значения одной строки лежат в разных местах. Поэтому колоночные СУБД (ClickHouse, Parquet-хранилища) пишут данными крупными пачками, а OLTP остаётся на строковом формате."
    recommendation: "Сравнить размер одной и той же таблицы в строковом (PostgreSQL) и колоночном (ClickHouse или Parquet) форматах и время выполнения агрегата."
    difficulty: easy
    topics: [analytics]

  - id: q14
    text: "Команда рассматривает переход с точных вычислений (COUNT DISTINCT, точный перцентиль) на приближённые структуры для крупных дашбордов. Что в первую очередь определяет, оправдан ли переход?"
    type: single
    options:
      - id: a
        text: "Размер данных: как только таблица не помещается в память одного узла, приближённые структуры оправданы"
        correct: false
        explanation: "Объём важен, но не решает дела. Таблица в терабайты, из которой считают счёт клиенту, требует точного ответа, как бы она ни была велика."
      - id: b
        text: "Наличие в СУБД встроенной приближённой функции: если она есть, ею стоит пользоваться"
        correct: false
        explanation: "Доступность функции лишь открывает возможность. Применять её стоит, когда погрешность допустима для конкретной цифры."
      - id: c
        text: "Скорость роста данных: любому быстро растущему хранилищу нужны приближённые структуры"
        correct: false
        explanation: "Быстрый рост можно покрыть масштабированием, предагрегацией и партиционированием. Приближённость нужна там, где допустима погрешность."
      - id: d
        text: "Достаточно ли погрешности в пару процентов для решения, которое принимают по этой цифре"
        correct: true
        explanation: "Приближённые структуры дают экономию ресурсов за счёт реальной, хоть и контролируемой, погрешности. Если решение к ней устойчиво, переход оправдан."
    explanation: "Выбор между точным и приближённым вычислением определяется требованиями к точности, а не размером данных. Для дашборда с примерным числом уникальных посетителей 1–2% незаметны. Для финансовой отчётности, биллинга и юридически значимых расчётов такая погрешность недопустима, даже если точный подсчёт дороже."
    extended_explanation: "Частый гибрид: приближённые структуры питают быстрые интерактивные дашборды, а точный расчёт идёт параллельно в батчевом пайплайне и даёт официальную цифру на конец периода. Дашборд остаётся отзывчивым, итоговый отчёт точным."
    recommendation: "Составить для своих дашбордов список метрик, допускающих приближённый расчёт, и тех, где нужна строгая точность."
    difficulty: medium
    topics: [analytics]

  - id: q15
    text: "Поставщик данных (внешняя команда) обязуется выкладывать витрину продаж не позже 6 утра, с полнотой не менее 99.9% и с описанной схемой полей. Как называется такое формализованное обязательство перед потребителями?"
    type: single
    options:
      - id: a
        text: "Data contract — формальное обязательство поставщика о схеме, свежести и качестве"
        correct: true
        explanation: "Контракт фиксирует проверяемые ожидания потребителя: схему, сроки и полноту. Неявное «обычно успеваем к утру» превращается в обязательство, нарушение которого видно автоматически."
      - id: b
        text: "Data lineage — происхождение витрины: из каких источников и преобразований она собрана"
        correct: false
        explanation: "Lineage отвечает на вопрос «откуда взялись данные». Гарантий на будущие поставки он не даёт."
      - id: c
        text: "Data catalog — реестр наборов данных с описаниями и владельцами"
        correct: false
        explanation: "Каталог помогает найти набор данных и узнать, кто за него отвечает. Обязательств по срокам и качеству в нём нет."
      - id: d
        text: "Schema registry — хранилище версий схем с проверкой совместимости"
        correct: false
        explanation: "Schema registry покрывает только структуру сообщений и правила её эволюции. Сроки поставки и полноту он не контролирует."
    explanation: "Data contract переносит идею API-контракта в мир данных: явное, документированное и по возможности автоматически проверяемое соглашение между поставщиком и потребителями. В нём схема полей, SLA на свежесть и допустимый уровень неполноты. Нарушение обнаруживается проверкой, а не жалобой потребителя."
    extended_explanation: "На практике контракт часто исполняют проверками при загрузке: dbt tests или Great Expectations. Если новая порция данных не проходит проверку по схеме или полноте, загрузка помечается проваленной, и испорченные данные не доходят до витрины."
    recommendation: "Описать data contract для одной ключевой витрины: схема, SLA на свежесть и допустимая неполнота."
    difficulty: medium
    topics: [analytics]

  - id: q16
    text: "Дашборд показывает скользящее среднее числа заказов за последние 10 минут, пересчитываемое каждую минуту, так что соседние окна перекрываются на 9 минут. Какой тип окна это описывает?"
    type: single
    options:
      - id: a
        text: "Tumbling window — последовательные окна фиксированной длины, одно за другим"
        correct: false
        explanation: "У tumbling новое окно начинается там, где закончилось предыдущее. Перекрытие на 9 минут из условия для него невозможно."
      - id: b
        text: "Sliding window — окно фиксированной длины со сдвигом меньше длины"
        correct: true
        explanation: "Окно в 10 минут сдвигается каждую минуту, поэтому каждое следующее перекрывает предыдущее на 9 минут."
      - id: c
        text: "Session window — границы определяются паузой в поступлении событий"
        correct: false
        explanation: "У сессионного окна нет ни фиксированной длины, ни регулярного шага, его границы определяет только пауза в событиях."
      - id: d
        text: "Global window — одно окно на весь поток, закрываемое триггером"
        correct: false
        explanation: "Global window нарезки по времени не делает вообще. Скользящего окна из него без пользовательской логики не получить."
    explanation: "Sliding window обновляется чаще, чем равно его длине, поэтому соседние окна перекрываются. Так получают плавный тренд: скользящее среднее за N минут, пересчитываемое чаще раза в N минут, — типичный случай."
    extended_explanation: "Цена — вычислительная нагрузка: каждое событие входит сразу в несколько окон. Окно в 10 минут со сдвигом в минуту учтёт событие в десяти окнах, тогда как в tumbling оно попадает в одно. Эту же схему в Kafka Streams и ksqlDB называют hopping window."
    recommendation: "Настроить скользящую агрегацию на потоке своего проекта и сравнить нагрузку с эквивалентным tumbling."
    difficulty: medium
    topics: [data]

