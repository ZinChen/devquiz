slug: docker-practice
title: "Docker: практика и грабли"
description: "Слои и кэш, Dockerfile против compose, volumes, сети, размер образа. Вопросы из тех мест, где обычно спотыкаются на практике."
tags: [docker, devops, claude-gen]
difficulty: advanced
estimated_time: 20

questions:
  - id: q1
    text: "Что из перечисленного НЕЛЬЗЯ задать в `docker-compose.yml`, только в `Dockerfile`?"
    type: single
    options:
      - id: a
        text: "Переменные окружения для процессов в контейнере"
        correct: false
        explanation: "Задаётся и там, и там: `ENV` в Dockerfile или `environment:` в compose — второй способ ещё и позволяет менять значения без пересборки образа."
      - id: b
        text: "Проброс портов наружу контейнера"
        correct: false
        explanation: "Проброс портов задаётся только на этапе запуска — `ports:` в compose или `-p` у `docker run`; в самом Dockerfile инструкции для этого нет."
      - id: c
        text: "Команду запуска контейнера"
        correct: false
        explanation: "Задаётся в обоих местах: `CMD` в Dockerfile и `command:` в compose, причём второй перекрывает первый на этапе запуска."
      - id: d
        text: "WORKDIR — рабочая директория внутри образа"
        correct: true
        explanation: "WORKDIR выполняется при сборке и меняет рабочую директорию для всех последующих инструкций образа — у compose есть только `working_dir` для контейнера сервиса, но это не то же самое."
    explanation: "WORKDIR — свойство образа, у compose аналога нет (есть `working_dir` для сервиса, но он не заменяет WORKDIR на этапе сборки). Команду запуска можно задать в обоих местах: `CMD` в Dockerfile и `command:` в compose, причём второй перекрывает первый — задавать стоит в одном месте, иначе непонятно, что реально выполняется."
    extended_explanation: "Разница в моменте применения: WORKDIR — это часть образа, зафиксированная при сборке и одинаковая для любого способа запуска контейнера из него. `working_dir` в compose переопределяет её только для конкретного сервиса при запуске, не трогая сам образ — тот же образ, запущенный вручную через `docker run`, снова окажется с исходным WORKDIR."
    recommendation: "Свериться со списком инструкций Dockerfile (ENV, WORKDIR, CMD, ENTRYPOINT) и их аналогов в compose, где они есть."

  - id: q2
    text: "Почему `COPY Gemfile Gemfile.lock ./` и `bundle install` ставят в Dockerfile ДО копирования остального кода?"
    type: single
    options:
      - id: a
        text: "Чтобы уменьшить итоговый размер собранного образа"
        correct: false
        explanation: "Порядок инструкций не влияет на итоговый размер — те же файлы и тот же результат `bundle install` попадут в образ независимо от того, в каком слое их скопировали."
      - id: b
        text: "Это жёсткое требование bundler к порядку установки гемов"
        correct: false
        explanation: "bundler не диктует Docker порядок COPY — он просто читает Gemfile из текущей директории, ему всё равно, что уже скопировано рядом."
      - id: c
        text: "Чтобы слой с установленными зависимостями брался из кэша"
        correct: true
        explanation: "Отдельный ранний слой с Gemfile меняется только при правке зависимостей — пока Gemfile.lock тот же, Docker переиспользует уже собранный слой с гемами вместо повторной установки."
      - id: d
        text: "Потому что bundler не видит гемы приложения, если код скопирован раньше зависимостей"
        correct: false
        explanation: "bundler устанавливает гемы независимо от того, лежит ли рядом остальной код приложения — видимость кода тут ни при чём."
    explanation: "Docker кэширует слои по порядку: если файлы инструкции не изменились, слой берётся из кэша. Скопировав сначала только Gemfile, вы получаете пересборку зависимостей лишь при изменении зависимостей. Скопируете весь код первым — любая правка в одном файле обнулит кэш и запустит `bundle install` заново. На размер образа порядок при этом не влияет."
    extended_explanation: "Тот же приём работает для любого пакетного менеджера: `package.json`+`package-lock.json` перед `npm ci`, `requirements.txt` перед `pip install`. Проверить попадание в кэш можно по выводу сборки — строка вида `CACHED [3/7] RUN bundle install` вместо повторного выполнения команды."
    recommendation: "Прочитать про слоистую модель Docker-образов и порядок инвалидации кэша слоёв при сборке."

  - id: q3
    text: "В чём разница между `CMD` и `ENTRYPOINT`?"
    type: single
    options:
      - id: a
        text: "Это синонимы одной и той же инструкции, ENTRYPOINT — просто устаревшая форма записи"
        correct: false
        explanation: "Обе инструкции живы и поддерживаются одновременно, каждая решает свою задачу: CMD — аргументы по умолчанию, ENTRYPOINT — фиксированная точка входа."
      - id: b
        text: "CMD задаёт команду по умолчанию, ENTRYPOINT задаёт исполняемый файл"
        correct: true
        explanation: "CMD можно переопределить целиком аргументом `docker run`, а ENTRYPOINT остаётся фиксированной точкой входа, которой этот аргумент лишь передаётся дальше."
      - id: c
        text: "ENTRYPOINT можно указать в Dockerfile только один раз, а CMD — несколько раз подряд"
        correct: false
        explanation: "Обе инструкции можно писать несколько раз — просто действует последняя встреченная, предыдущие молча перезаписываются."
      - id: d
        text: "CMD выполняется при сборке образа, а ENTRYPOINT — только при запуске контейнера"
        correct: false
        explanation: "Ни одна из них не выполняется при сборке — обе лишь фиксируются в метаданных образа и срабатывают при запуске контейнера; для выполнения команд во время сборки существует RUN."
    explanation: "`docker run image bash` при наличии только CMD полностью заменит команду на bash. При ENTRYPOINT `bash` станет аргументом к нему. Отсюда типичная связка: ENTRYPOINT — скрипт-обёртка (миграции, ожидание БД), CMD — команда по умолчанию, которую передают ему аргументом. При сборке (вариант b) не выполняется ни то, ни другое — для этого RUN."
    extended_explanation: "Проверить эффективную команду уже собранного образа можно без запуска контейнера: `docker inspect --format='{{.Config.Entrypoint}} {{.Config.Cmd}}' image`. Если оба поля заданы, реальная команда — это ENTRYPOINT с CMD в качестве аргументов; если ENTRYPOINT пуст, CMD выполняется как есть."
    recommendation: "Прочитать про формы exec и shell у CMD/ENTRYPOINT и то, как они комбинируются при одновременном использовании."

  - id: q4
    text: "Что произойдёт с данными в контейнере после `docker rm`, если не использовать volume?"
    type: single
    options:
      - id: a
        text: "Данные сохранятся в образе, из которого был создан контейнер"
        correct: false
        explanation: "Образ неизменяем: то, что контейнер записал в свой слой во время работы, никогда не попадает обратно в исходный образ."
      - id: b
        text: "Данные в файловой системе контейнера будут удалены вместе с ним"
        correct: true
        explanation: "Записываемый слой существует ровно столько же, сколько сам контейнер — при его удалении этот слой уходит вместе с ним."
      - id: c
        text: "Данные автоматически переедут в анонимный volume, созданный Docker"
        correct: false
        explanation: "Анонимный volume появляется только если он явно объявлен в образе (инструкцией VOLUME) или в команде запуска — сам по себе при удалении контейнера он не создаётся."
      - id: d
        text: "Данные останутся в кэше сборки образа и переживут удаление контейнера"
        correct: false
        explanation: "Кэш сборки состоит из слоёв, созданных при `docker build` по инструкциям Dockerfile — это отдельная сущность от данных, которые приложение записывает уже во время работы запущенного контейнера."
    explanation: "Записываемый слой живёт ровно столько же, сколько контейнер. Образ при этом неизменяем — записать в него из работающего контейнера нельзя. Поэтому базы данных в контейнерах всегда монтируют на volume, иначе `docker compose down` унесёт данные с собой."
    extended_explanation: "Увидеть, что реально изменилось в записываемом слое работающего контейнера, можно без его остановки: `docker diff container_id` покажет добавленные, изменённые и удалённые файлы относительно исходного образа."
    recommendation: "Разобрать модель copy-on-write в Docker: неизменяемые слои образа плюс один записываемый слой контейнера поверх них."

  - id: q5
    text: "Зачем нужна multi-stage сборка?"
    type: single
    options:
      - id: a
        text: "Чтобы собрать артефакт в одном образе, а в финальный положить только результат"
        correct: true
        explanation: "Промежуточная стадия несёт компилятор, исходники и кэш пакетного менеджера, но в финальный образ через `COPY --from=` переносится только то, что реально нужно для запуска."
      - id: b
        text: "Чтобы один и тот же Dockerfile мог собирать образы для разных архитектур"
        correct: false
        explanation: "За сборку под разные архитектуры отвечает buildx с флагом `--platform` — отдельный механизм, не связанный с числом стадий в Dockerfile."
      - id: c
        text: "Чтобы собирать образ параллельно в несколько потоков и ускорить сборку"
        correct: false
        explanation: "Стадии multi-stage выполняются последовательно, если одна зависит от результата другой — реальный параллелизм сборки дают независимые стадии и планировщик BuildKit, это отдельный от самого факта multi-stage механизм."
      - id: d
        text: "Чтобы разделить один Dockerfile на dev- и prod-конфигурации сборки"
        correct: false
        explanation: "Multi-stage решает задачу переноса артефакта между стадиями одной сборки; dev/prod-варианты конфигурации обычно решают отдельными Dockerfile или выбором target-стадии через `--target`."
    explanation: "`FROM ... AS builder`, затем новый `FROM` и `COPY --from=builder` — в финальный образ попадает только собранное. Так убирают build-essential, исходники, кэш пакетного менеджера, экономя сотни мегабайт. Мультиархитектурная сборка (вариант c) — это buildx и `--platform`, отдельный механизм."
    extended_explanation: "У `docker build` есть флаг `--target имя_стадии`, который останавливает сборку на нужной стадии — этим приёмом из одного Dockerfile с несколькими стадиями иногда всё же получают и dev-, и prod-образ, не переиздавая multi-stage ради самого разделения конфигураций."
    recommendation: "Прочитать про multi-stage builds в официальной документации Docker — там же пример с builder-стадией для компилируемых языков."

  - id: q6
    text: "Для чего нужен файл `.dockerignore`?"
    type: single
    options:
      - id: a
        text: "Скрывает перечисленные файлы от остальных слоёв собранного образа"
        correct: false
        explanation: "`.dockerignore` действует раньше — на этапе формирования контекста сборки; файлы, уже попавшие в собранный слой образа, остаются в его истории независимо от того, что происходит в следующих слоях."
      - id: b
        text: "Исключает файлы из контекста сборки, отправляемого демону Docker"
        correct: true
        explanation: "Клиент собирает контекст сборки — весь указанный каталог целиком — и отправляет его демону ещё до выполнения первой инструкции; `.dockerignore` отфильтровывает лишнее из этой отправки."
      - id: c
        text: "Запрещает монтировать перечисленные в нём пути как volumes"
        correct: false
        explanation: "Ограничения на volumes задаются в compose или команде запуска — `.dockerignore` относится к сборке образа, монтирование во время работы контейнера он не затрагивает."
      - id: d
        text: "Указывает, какие файлы игнорировать уже при запуске готового контейнера"
        correct: false
        explanation: "К моменту запуска контейнера образ уже собран — `.dockerignore` применяется только на этапе формирования контекста перед сборкой, на уже готовый образ он не действует."
    explanation: "Перед сборкой клиент отправляет демону весь контекст — каталог целиком. Без `.dockerignore` туда уедут `.git`, `node_modules`, логи и локальные дампы: сборка замедлится, а `COPY . .` затащит лишнее в образ. Заодно это вопрос безопасности — так в образы утекают `.env` и ключи."
    extended_explanation: "Синтаксис похож на `.gitignore`, но правила независимы друг от друга — файл, исключённый из git, всё равно попадёт в контекст сборки, если явно не перечислен и в `.dockerignore`. Проверить размер реально отправляемого контекста можно по первой строке вывода `docker build` — `Sending build context to Docker daemon`."
    recommendation: "Завести `.dockerignore` в каждом проекте с Dockerfile по аналогии с `.gitignore` — минимум `.git`, `node_modules`, `tmp`, `log`, `.env`."

  - id: q7
    text: "Что означает `EXPOSE 3000` в Dockerfile?"
    type: single
    options:
      - id: a
        text: "Порт 3000 автоматически становится доступен снаружи на хосте"
        correct: false
        explanation: "Доступ снаружи появляется только при явной публикации порта на запуске — сама по себе инструкция EXPOSE ничего не открывает наружу."
      - id: b
        text: "Порт автоматически пробрасывается на тот же номер хоста при запуске"
        correct: false
        explanation: "Автоматического проброса нет — номер порта на хосте всегда задаётся отдельно, явно через `-p` или `ports:`, и может отличаться от номера внутри контейнера."
      - id: c
        text: "Это документация: объявление, что приложение слушает данный порт"
        correct: true
        explanation: "EXPOSE не меняет сетевое поведение контейнера сам по себе — он лишь фиксирует в метаданных образа, какой порт приложение слушает, и это видно через `docker inspect` или `docker run -P`."
      - id: d
        text: "Контейнеру разрешается слушать только этот порт и никакой другой"
        correct: false
        explanation: "Никакого ограничения EXPOSE не накладывает — приложение внутри контейнера может слушать любые порты вне зависимости от того, что объявлено в Dockerfile."
    explanation: "EXPOSE ничего не открывает — публикацию делает `-p 3000:3000` при запуске или `ports:` в compose. Практическая польза от EXPOSE есть у `docker run -P` (публикует все объявленные порты на случайные) и как подсказка тому, кто читает Dockerfile."
    extended_explanation: "`docker run -P` (заглавная) публикует все объявленные через EXPOSE порты на случайные свободные порты хоста — единственный сценарий, где сама инструкция реально на что-то влияет во время выполнения, а не только служит подсказкой при чтении Dockerfile."
    recommendation: "Прочитать про разницу между EXPOSE в Dockerfile и `-p`/`-P` в docker run — официальная документация по сетям Docker."

  - id: q8
    text: "Как контейнеры в одной сети Docker Compose обращаются друг к другу?"
    type: single
    options:
      - id: a
        text: "Только по внутреннему IP-адресу контейнера соседа"
        correct: false
        explanation: "По IP тоже можно, но он меняется при каждом пересоздании контейнера — встроенный DNS избавляет от необходимости на него полагаться."
      - id: b
        text: "По `localhost` с разными портами для каждого сервиса"
        correct: false
        explanation: "`localhost` внутри контейнера всегда указывает на него самого — обратиться так к соседнему сервису невозможно, даже точно зная его порт."
      - id: c
        text: "По имени сервиса как по хостнейму, например `postgres:5432`"
        correct: true
        explanation: "Compose регистрирует каждый сервис во встроенном DNS сети под его именем из yml — соседний контейнер резолвит это имя в актуальный IP независимо от пересоздания."
      - id: d
        text: "Через специальное имя `host.docker.internal`"
        correct: false
        explanation: "Это имя решает обратную задачу — достучаться из контейнера до самого хоста; для обращения к соседнему контейнеру в той же сети служит имя сервиса."
    explanation: "Compose поднимает общую сеть и встроенный DNS: имя сервиса из yml резолвится в адрес контейнера. `localhost` внутри контейнера — это он сам, а не сосед; типичная ошибка — оставить в конфиге `localhost:5432` и не понять, почему нет соединения. `host.docker.internal` нужен для обратного случая: достучаться из контейнера до хоста."
    extended_explanation: "Резолвинг по имени сервиса работает только внутри пользовательских сетей, которые создаёт compose по умолчанию — при подключении контейнеров к сети `host` или `none` встроенный DNS недоступен, и придётся возвращаться к IP-адресам."
    recommendation: "Разобрать модель сетей Docker Compose: bridge-сеть по умолчанию, встроенный DNS и как имена сервисов резолвятся между контейнерами."

  - id: q9
    text: "В чём разница между bind mount и named volume?"
    type: single
    options:
      - id: a
        text: "Bind mount копирует файлы внутрь контейнера, а named volume их монтирует"
        correct: false
        explanation: "Bind mount ничего не копирует — он подменяет путь внутри контейнера прямым доступом к каталогу хоста, изменения видны в обе стороны мгновенно, без синхронизации копий."
      - id: b
        text: "Bind mount подключает конкретный путь с хоста, named volume — хранилище Docker"
        correct: true
        explanation: "Bind mount указывает явный путь на файловой системе хоста, а named volume Docker создаёт и хранит сам в своей области — местоположение на диске не нужно знать заранее."
      - id: c
        text: "Named volume всегда монтируется только для чтения, без записи"
        correct: false
        explanation: "Named volume по умолчанию доступен и на чтение, и на запись — режим `:ro` можно указать явно для любого типа монтирования, это не свойство именно named volume."
      - id: d
        text: "Bind mount работает только на Linux, а named volume — на всех платформах"
        correct: false
        explanation: "Оба типа монтирования одинаково доступны на всех поддерживаемых платформах; между ними отличается скорость работы на macOS и Windows, но не сама доступность механизма."
    explanation: "Bind mount (`- .:/app`) отражает каталог хоста — удобно в разработке, правки видны сразу, но на macOS и Windows это медленно из-за слоя виртуализации. Named volume (`- pgdata:/var/lib/postgresql/data`) Docker хранит у себя — быстрее и правильнее для данных БД. Bind mount ничего не копирует, он именно подменяет путь."
    extended_explanation: "Список named volumes и их реальное расположение на диске можно посмотреть через `docker volume ls` и `docker volume inspect имя` — обычно это подкаталог внутри области данных самого Docker (`/var/lib/docker/volumes` на Linux), которую не стоит трогать руками напрямую."
    recommendation: "Сравнить bind mount, named volume и tmpfs mount по месту хранения данных и типичному сценарию использования каждого."

  - id: q10
    text: "Почему в продакшн-образ код обычно копируют через `COPY`, а не монтируют через volume?"
    type: single
    options:
      - id: a
        text: "Потому что COPY при сборке заметно быстрее монтирования volume"
        correct: false
        explanation: "Разница в скорости здесь пренебрежимо мала и не является причиной — вопрос не в производительности, а в том, что именно оказывается запущено."
      - id: b
        text: "Потому что через volume нельзя передать в контейнер больше 1 ГБ данных"
        correct: false
        explanation: "У volume нет такого ограничения по объёму — он подключает произвольный по размеру каталог или хранилище Docker."
      - id: c
        text: "Потому что volumes вообще не работают в большинстве оркестраторов"
        correct: false
        explanation: "Volumes поддерживаются и в Kubernetes, и в Docker Swarm — механизм монтирования данных широко используется в проде, просто не для доставки кода приложения."
      - id: d
        text: "Образ должен быть самодостаточным и воспроизводимым артефактом"
        correct: true
        explanation: "Если код приезжает с хоста через volume, один и тот же тег образа в разных окружениях может запускать разный код — теряется гарантия, что протестированный артефакт и есть то, что выкатывается."
    explanation: "В проде образ — это неизменяемый артефакт: собрали, протестировали, выкатили именно его. Если код приезжает с хоста, воспроизводимость теряется и непонятно, что реально запущено. В разработке наоборот удобен volume: не пересобирать образ на каждую правку. Отсюда обычная схема — COPY в Dockerfile плюс volume в compose-override для dev."
    extended_explanation: "Типичная организация — базовый `docker-compose.yml` с COPY-образом для прода и `docker-compose.override.yml`, который автоматически подхватывается локально и добавляет bind mount поверх кода для разработки, не трогая сам Dockerfile."
    recommendation: "Прочитать про принцип immutable infrastructure и то, как он применяется к контейнерным образам."

  - id: q11
    text: "Что делает `docker system prune`?"
    type: single
    options:
      - id: a
        text: "Перезапускает демон Docker с полной очисткой его временных файлов"
        correct: false
        explanation: "Команда не трогает сам процесс демона и не требует его перезапуска — она удаляет конкретные объекты (контейнеры, образы, сети), пока демон продолжает работать."
      - id: b
        text: "Очищает только кэш сборки, не трогая образы и контейнеры"
        correct: false
        explanation: "Кэш сборки — лишь одна из категорий, которые затрагивает команда по умолчанию; она заодно убирает остановленные контейнеры, висячие образы и неиспользуемые сети."
      - id: c
        text: "Удаляет неиспользуемые объекты: контейнеры, висячие образы, сети и кэш сборки"
        correct: true
        explanation: "Именно эти четыре категории удаляются по умолчанию, без флагов — команда явно перечисляет их и просит подтверждения перед удалением."
      - id: d
        text: "Удаляет вообще все образы и контейнеры на машине без каких-либо исключений"
        correct: false
        explanation: "Без флага `-a` под удаление попадают только остановленные контейнеры и висячие образы без тега — образы, на которые ссылается хотя бы один контейнер, команда не трогает."
    explanation: "По умолчанию команда не трогает volumes (для них нужен `--volumes`) и используемые образы. С флагом `-a` удаляются вообще все образы, на которые не ссылается ни один контейнер, — после этого следующая сборка будет долгой. На машине разработчика это главный способ вернуть десятки гигабайт."
    extended_explanation: "Перед реальной чисткой полезно посмотреть, что вообще занимает место: `docker system df` показывает суммарный размер образов, контейнеров, volumes и кэша сборки по отдельности, до того как запускать prune вслепую."
    recommendation: "Прочитать про разницу между `docker system prune`, `docker image prune -a` и `docker volume prune` — каждая чистит свою категорию объектов."

  - id: q12
    text: "Что произойдёт при `docker compose up`, если образ уже собран, а Dockerfile изменился?"
    type: single
    options:
      - id: a
        text: "Compose завершится с ошибкой о несоответствии образа"
        correct: false
        explanation: "Compose не сверяет содержимое Dockerfile с уже собранным образом — никакой проверки на несоответствие при обычном `up` не происходит, поэтому и ошибки не будет."
      - id: b
        text: "Compose пересоберёт только изменившиеся слои и запустит контейнер"
        correct: false
        explanation: "Частичная пересборка по изменившимся слоям происходит только внутри самой команды сборки (`docker build` или `docker compose build`) — обычный `up` без флага `--build` сборку вообще не запускает."
      - id: c
        text: "Compose запустит старый образ — пересборка нужна явным флагом или командой"
        correct: true
        explanation: "`docker compose up` проверяет только наличие образа с нужным тегом; актуальность его содержимого относительно текущего Dockerfile она не сверяет — если тег уже существует, будет использован именно он."
      - id: d
        text: "Compose обнаружит изменение и пересоберёт образ автоматически"
        correct: false
        explanation: "Автоматического отслеживания изменений в Dockerfile у `up` нет — это частая причина ощущения, что правки «не применяются»."
    explanation: "Compose не следит за содержимым Dockerfile: если образ с нужным тегом есть, он его и запустит. Отсюда классическая потеря времени — правка в Dockerfile или Gemfile «не применяется». Помогает `docker compose up --build` или отдельный `docker compose build`."
    extended_explanation: "На CI и в скриптах деплоя это решают явным порядком команд — сначала `docker compose build` (или `docker build` с отдельным тегом), затем `up`, — вместо того чтобы полагаться на неявное поведение одной команды `up` без флага."
    recommendation: "Взять за привычку `docker compose up --build` при любой правке Dockerfile или файлов зависимостей, а не только при первом запуске."

  - id: q13
    text: "Почему запуск процесса в контейнере от root считается плохой практикой?"
    type: single
    options:
      - id: a
        text: "Потому что от имени root в контейнере нельзя слушать порты выше 1024"
        correct: false
        explanation: "Всё ровно наоборот: ограничение на порты ниже 1024 действует для обычных пользователей, а root в контейнере, как и везде, может слушать любой порт без ограничений."
      - id: b
        text: "Потому что запуск от root заметно замедляет старт контейнера"
        correct: false
        explanation: "Время запуска контейнера определяется приложением и содержимым образа — UID процесса, от которого он стартует, на скорость старта не влияет."
      - id: c
        text: "Потому что Docker технически запрещает запуск от root начиная с версии 20"
        correct: false
        explanation: "Запуск от root остаётся поведением по умолчанию в любой версии Docker, если явно не указать USER в Dockerfile — блокировки этой возможности никогда не было."
      - id: d
        text: "При побеге из контейнера привилегии root повышают потенциальный ущерб"
        correct: true
        explanation: "Контейнер разделяет ядро с хостом и остаётся лишь частичной изоляцией — при неудачной конфигурации (например, `--privileged`) root внутри контейнера способен получить root-доступ и снаружи."
    explanation: "Контейнер — не граница безопасности в полном смысле: ядро общее с хостом. Root внутри при неудачной конфигурации (`--privileged`, монтирование docker.sock или системных путей) превращается во влияние на хост. Поэтому в Dockerfile добавляют `USER app`. Ограничение на порты ниже 1024 как раз обратное — их обычному пользователю слушать нельзя."
    extended_explanation: "Ужесточить эту границу можно ещё сильнее — флаг `--user` у `docker run` переопределяет пользователя без изменения Dockerfile, а user namespaces (`--userns-remap`) отображают root внутри контейнера на непривилегированного пользователя на хосте, даже если внутри процесс формально считает себя root."
    recommendation: "Прочитать про USER в Dockerfile и user namespace remapping как два независимых способа снизить привилегии процесса в контейнере."

  - id: q14
    text: "Что такое «висячий» (dangling) образ?"
    type: single
    options:
      - id: a
        text: "Образ без тега, обычно оставшийся от пересборки"
        correct: true
        explanation: "Когда тег `myapp:latest` переезжает на свежесобранный образ, предыдущий образ этого имени лишается тега и отображается в списке как `<none>:<none>`."
      - id: b
        text: "Образ, скачивание которого не удалось довести до конца"
        correct: false
        explanation: "Прерванная загрузка не оставляет в системе образ вообще — незавершённые слои просто удаляются."
      - id: c
        text: "Образ, у которого был удалён его базовый слой"
        correct: false
        explanation: "Docker не даёт удалить слой, на который ссылается другой образ — базовый слой не может исчезнуть отдельно от зависящих от него образов."
      - id: d
        text: "Образ, ни разу не запускавшийся более 30 дней подряд"
        correct: false
        explanation: "Docker не отслеживает время последнего запуска образа и не помечает по этому признаку — статус dangling определяется исключительно отсутствием тега."
    explanation: "Такие образы отображаются как `<none>:<none>`. Появляются при пересборке: тег `myapp:latest` переезжает на новый образ, а предыдущий остаётся без имени, продолжая занимать место. Чистятся `docker image prune`."
    extended_explanation: "Найти их можно фильтром без чистки: `docker images -f dangling=true` покажет список, не удаляя ничего — удобно проверить перед тем, как запускать `docker image prune`, который уберёт их безвозвратно."
    recommendation: "Периодически проверять `docker images` на скопившиеся `<none>:<none>` образы — особенно на машине, где Docker-образы часто пересобираются."

  - id: q15
    text: "Чем `docker exec` отличается от `docker run`?"
    type: single
    options:
      - id: a
        text: "`exec` всегда запускает контейнер в фоне, а `run` — только в интерактивном режиме"
        correct: false
        explanation: "Оба режима — фоновый (`-d`) и интерактивный (`-it`) — доступны у обеих команд, разница между ними не в этом."
      - id: b
        text: "Это синонимы одной команды с разным набором доступных флагов"
        correct: false
        explanation: "Это две разные операции над контейнером: одна создаёт новый контейнер с нуля, другая работает с уже существующим и запущенным."
      - id: c
        text: "`exec` работает только с compose-проектами, `run` — только с обычными контейнерами"
        correct: false
        explanation: "Обе команды одинаково доступны и для контейнеров, поднятых через compose, и для запущенных напрямую через Docker CLI."
      - id: d
        text: "`exec` запускает процесс в уже работающем контейнере, `run` создаёт новый"
        correct: true
        explanation: "`exec` заходит в файловую систему и окружение существующего контейнера как есть, а `run` каждый раз стартует чистый контейнер заново из образа."
    explanation: "`docker exec -it app bash` — зайти в живой контейнер и посмотреть, что там происходит. `docker run` каждый раз создаёт новый контейнер из образа: если в нём выполнить правку, она не попадёт в тот, что уже запущен. Забытые `docker run` без `--rm` — частая причина россыпи остановленных контейнеров."
    extended_explanation: "Список всех контейнеров, включая остановленные, показывает `docker ps -a` — по нему легко заметить накопившиеся результаты `docker run` без `--rm`, которые никто не удалил вручную после завершения работы."
    recommendation: "Добавить `--rm` к разовым `docker run` для отладки — контейнер удалится сам сразу после выхода, не оставляя мусора."

  - id: q16
    text: "Как правильно передать секрет (например, пароль БД) в контейнер?"
    type: single
    options:
      - id: a
        text: "Записать прямо в Dockerfile — он не публикуется вместе с образом"
        correct: false
        explanation: "Dockerfile сам по себе действительно не публикуется вместе с образом, но записанное в него значение всё равно окажется в инструкциях образа и будет видно любому, у кого есть доступ к образу или репозиторию с исходниками."
      - id: b
        text: "Через переменные окружения или механизм секретов оркестратора — но не через ARG или слой образа"
        correct: true
        explanation: "Переменные окружения при запуске и секреты оркестратора (Docker secrets, Kubernetes Secrets, Vault) не попадают в слои самого образа — они существуют только в рамках конкретного запущенного контейнера."
      - id: c
        text: "Скопировать файл с секретом в образ и удалить его следующей инструкцией RUN"
        correct: false
        explanation: "Слои Docker неизменяемы: файл, скопированный в один слой, остаётся в истории образа даже после удаления следующей инструкцией — секрет всё равно можно извлечь из промежуточного слоя."
      - id: d
        text: "Через `ARG` при сборке — так значение не попадёт в финальный образ"
        correct: false
        explanation: "Значения ARG сохраняются в метаданных образа и видны через `docker history` — они не исчезают из финального образа сами по себе."
    explanation: "Ключевое свойство: слои неизменяемы, и всё, что попало в слой, остаётся в истории образа. Удаление файла следующей инструкцией (вариант c) не убирает его из предыдущего слоя — секрет достаётся из истории. Значения `ARG` тоже видны в метаданных через `docker history`. Правильно — переменные окружения на запуске, Docker secrets, Vault или секреты Kubernetes."
    extended_explanation: "Отдельный механизм для секретов на этапе именно сборки — `RUN --mount=type=secret` в BuildKit: файл с секретом монтируется временно только в конкретный RUN-шаг и не попадает ни в один слой финального образа, в отличие от обычного COPY."
    recommendation: "Прочитать про BuildKit secret mounts и про то, как проверить историю образа командой `docker history --no-trunc`, чтобы увидеть, что реально осело в слоях."

  - id: q17
    text: "Что означает `alpine` в теге образа, например `ruby:3.3-alpine`?"
    type: single
    options:
      - id: a
        text: "Это образ с минимальным набором уязвимостей, заранее проверенный сканером"
        correct: false
        explanation: "Alpine компактнее по размеру, но это не гарантирует меньшего числа уязвимостей — сканирование на уязвимости к варианту базового образа отдельная и независимая задача."
      - id: b
        text: "Образ собран на Alpine Linux с musl libc вместо обычной glibc"
        correct: true
        explanation: "Alpine Linux использует musl libc и busybox вместо привычного набора GNU-утилит на glibc — именно эта замена даёт компактность и одновременно источник несовместимостей с нативными расширениями."
      - id: c
        text: "Это специальная сборка, оптимизированная под ARM-процессоры"
        correct: false
        explanation: "Архитектура процессора и вариант дистрибутива — независимые оси: Alpine-образы собираются и под amd64, и под arm64 наравне с любыми другими базовыми образами."
      - id: d
        text: "Образ содержит только голый рантайм совсем без пакетного менеджера"
        correct: false
        explanation: "В Alpine есть собственный пакетный менеджер `apk` — образ не лишён управления пакетами, просто он не тот же самый, что apt или yum в Debian/RHEL-based образах."
    explanation: "Alpine использует musl вместо glibc — отсюда и компактность (десятки мегабайт вместо сотен), и проблемы: гемы с нативными расширениями иногда не собираются или ведут себя иначе, а отладочных утилит внутри почти нет. Пакетный менеджер там есть — `apk`. Для Ruby-приложений часто выбирают `slim` как компромисс."
    extended_explanation: "Типичный симптом musl-несовместимости — гем с нативным расширением падает при установке или в рантайме с ошибкой линковки, которой не было на glibc-образе; лечится либо установкой build-зависимостей через `apk add`, либо переходом на `slim`-вариант того же официального образа."
    recommendation: "Сравнить размеры и состав official-образов Ruby/Node/Python в вариантах default, slim и alpine на Docker Hub."

  - id: q18
    text: "Зачем контейнеру healthcheck?"
    type: single
    options:
      - id: a
        text: "Чтобы собирать метрики производительности работающего приложения"
        correct: false
        explanation: "Healthcheck возвращает только бинарный статус healthy/unhealthy по итогу проверки — числовые метрики производительности собирают отдельные инструменты мониторинга."
      - id: b
        text: "Чтобы автоматически перезапускать контейнер при высокой нагрузке на CPU"
        correct: false
        explanation: "Healthcheck не связан с потреблением CPU или памяти напрямую — он лишь выполняет заданную команду или запрос и смотрит на её результат, а реагирование на unhealthy-статус (например, restart policy) настраивается отдельно."
      - id: c
        text: "Чтобы проверять целостность образа перед его запуском"
        correct: false
        explanation: "Проверка целостности образа (контрольные суммы слоёв) происходит на этапе pull/build средствами самого Docker — healthcheck работает уже после старта контейнера, над живым приложением внутри него."
      - id: d
        text: "Чтобы отличать «процесс запущен» от «приложение готово обслуживать запросы»"
        correct: true
        explanation: "Между стартом процесса и готовностью реально отвечать на запросы часто проходит время — миграции, прогрев соединений с БД — и healthcheck именно эту разницу и обнаруживает."
    explanation: "Запущенный процесс ещё не значит работающее приложение: Rails может подниматься полминуты, а соединение с БД — отсутствовать. HEALTHCHECK периодически дёргает команду или эндпоинт и помечает контейнер healthy/unhealthy. В compose на этом строят `depends_on` с `condition: service_healthy`, в Kubernetes аналог — liveness и readiness пробы."
    extended_explanation: "Текущий статус healthcheck виден прямо в `docker ps` — колонка STATUS покажет `(healthy)` или `(unhealthy)` рядом со временем работы контейнера, без необходимости заходить внутрь или смотреть логи отдельно."
    recommendation: "Сравнить HEALTHCHECK в Docker с liveness и readiness пробами Kubernetes — концепция одна, но с разными последствиями при провале проверки."

  - id: q19
    text: "Что из перечисленного НЕ является средством запуска или оркестрации контейнеров?"
    type: single
    options:
      - id: a
        text: "Nomad"
        correct: false
        explanation: "Планировщик и оркестратор от HashiCorp — распределяет задачи, включая контейнеры, по кластеру узлов, аналогично Kubernetes."
      - id: b
        text: "Podman"
        correct: false
        explanation: "Рантайм для запуска контейнеров без постоянно работающего демона, совместимый с командами Docker CLI — сам исполняет и управляет контейнерами."
      - id: c
        text: "Kubernetes"
        correct: false
        explanation: "Оркестратор контейнеров общего назначения — распределяет их по узлам кластера, следит за состоянием и перезапускает при сбоях."
      - id: d
        text: "Terraform"
        correct: true
        explanation: "Terraform описывает инфраструктуру как код и создаёт ресурсы у облачного провайдера (сети, виртуалки, managed Kubernetes-кластер) — но сам не запускает и не оркеструет контейнеры внутри этой инфраструктуры."
    explanation: "Terraform описывает инфраструктуру как код — создаёт кластеры, сети и виртуалки у провайдера, но сам контейнеры не гоняет. Kubernetes и Nomad — оркестраторы, Podman — рантайм без демона, совместимый с командами Docker. Terraform постоянно встречается рядом, поэтому и попадает в этот ряд."
    extended_explanation: "Типичная связка на практике — Terraform поднимает сам managed Kubernetes-кластер (например, EKS или GKE) как облачный ресурс, а дальше уже Kubernetes управляет тем, какие контейнеры и куда внутри этого кластера запускать — это два соседних, но разных по назначению слоя."
    recommendation: "Разграничить для себя infrastructure-as-code инструменты (Terraform, Pulumi) и оркестраторы контейнеров (Kubernetes, Nomad) — они часто работают в связке, но решают разные задачи."

  - id: q20
    text: "Приложение в контейнере слушает `127.0.0.1:3000`, порт проброшен как `-p 3000:3000`, но снаружи не отвечает. В чём причина?"
    type: single
    options:
      - id: a
        text: "Порт 3000 на хосте уже занят каким-то другим процессом"
        correct: false
        explanation: "Занятый порт на хосте вызвал бы явную ошибку `port is already allocated` уже при старте контейнера — а раз контейнер запустился, порт был свободен."
      - id: b
        text: "В Dockerfile не добавлена инструкция EXPOSE 3000"
        correct: false
        explanation: "EXPOSE — только декларативная подсказка, она никак не участвует в реальной публикации трафика через `-p` и не может быть причиной недоступности порта снаружи."
      - id: c
        text: "Нужно слушать `0.0.0.0`, а не loopback-адрес внутри контейнера"
        correct: true
        explanation: "`127.0.0.1` внутри контейнера — это его собственный изолированный loopback-интерфейс, недоступный извне ни при каком пробросе портов; принимать внешние соединения приложение может только слушая все интерфейсы (`0.0.0.0`)."
      - id: d
        text: "В команде проброски портов не указан используемый протокол"
        correct: false
        explanation: "По умолчанию `-p` пробрасывает TCP, чего достаточно для обычного HTTP-приложения вроде Rails — отсутствие явного протокола не объясняет проблему в этом сценарии."
    explanation: "`127.0.0.1` внутри контейнера — его собственный loopback, туда извне не достучаться при любом пробросе. Слушать надо все интерфейсы: `rails server -b 0.0.0.0`. Занятый порт на хосте (вариант b) дал бы ошибку сразу при старте, а EXPOSE, как известно, ничего не публикует. Это самая частая проблема при первом запуске Rails в Docker."
    extended_explanation: "Проверить, на каком адресе реально слушает процесс внутри контейнера, можно без правки кода: `docker exec container_id netstat -tlnp` (или `ss -tlnp`) покажет `127.0.0.1:3000` вместо ожидаемого `0.0.0.0:3000` — по этому выводу разница видна сразу, ещё до правки конфигурации сервера."
    recommendation: "Проверять bind-адрес сервера разработки (`-b 0.0.0.0` у Rails, `--host 0.0.0.0` у большинства других фреймворков) при первом запуске в контейнере — типовая причина недоступности порта."
