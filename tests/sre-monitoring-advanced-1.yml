  # ── Блок 5: Кардинальность и алертинг как процесс ────────────────────────

  - id: q21
    text: "Инженер добавляет лейбл user_id к метрике http_requests_total, чтобы отслеживать активность каждого пользователя отдельно. Через какое-то время Prometheus начинает потреблять аномально много памяти и замедляться. Что произошло?"
    type: single
    options:
      - id: a
        text: "Взрыв кардинальности — уникальный лейбл на каждого пользователя порождает отдельный временной ряд на каждое сочетание значений"
        correct: true
        explanation: "Каждое уникальное сочетание значений лейблов в Prometheus — это отдельный хранимый временной ряд; лейбл с высокой кардинальностью вроде user_id умножает общее число рядов на число активных пользователей, что для сервиса с тысячами и миллионами пользователей легко даёт взрывной рост потребления памяти."
      - id: b
        text: "Метрика http_requests_total была объявлена с неправильным типом — вместо counter нужно было использовать тип gauge"
        correct: false
        explanation: "Тип метрики здесь не является причиной проблемы — она возникла бы с тем же самым лейблом user_id независимо от того, counter это или gauge."
      - id: c
        text: "Prometheus технически не поддерживает лейблы со строковыми значениями, а допускает только числовые значения"
        correct: false
        explanation: "Строковые значения лейблов полностью поддерживаются — проблема не в типе значения, а в количестве уникальных комбинаций, которое создаёт этот конкретный лейбл."
      - id: d
        text: "Проблема вызвана тем, что метрика собирается слишком часто, и нужно просто увеличить значение scrape_interval"
        correct: false
        explanation: "Более редкий scrape снизил бы нагрузку на сбор данных, но не устранил бы саму причину — избыточное число хранимых временных рядов из-за высококардинального лейбла."
    explanation: "Кардинальность метрики — произведение числа возможных значений всех её лейблов. Лейбл вроде user_id, endpoint с динамическими параметрами или IP-адрес клиента добавляет потенциально неограниченное число уникальных значений, и каждое сочетание становится отдельным временным рядом, который Prometheus обязан хранить в памяти и на диске. При достаточно большой пользовательской базе такой лейбл легко превращает разумную метрику в источник постоянно растущего потребления ресурсов, вплоть до отказа сборщика метрик."
    extended_explanation: "Правильное решение для отслеживания активности конкретных пользователей — не добавлять их идентификатор как лейбл метрики, а логировать соответствующие события в систему логов или трассировки, спроектированную для высококардинальных данных, оставляя метрики для агрегированных показателей вроде общего числа запросов по эндпоинту."
    recommendation: "Проверить свои метрики на наличие лейблов с неограниченной кардинальностью (user_id, IP, session_id, свободный текст) и убрать их из Prometheus."
    difficulty: hard
    topics: [observability]

  - id: q22
    text: "Метрика http_requests_total получает лейбл path со значением полного пути запроса, включая динамические параметры вроде /users/12345/orders/98765. Почему это проблематично для кардинальности, даже если общее число пользователей невелико?"
    type: single
    options:
