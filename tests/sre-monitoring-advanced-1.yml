      - id: b
        text: "Квантили summary нельзя корректно агрегировать между репликами — усреднение готовых перцентилей не даёт правильный общий перцентиль"
        correct: true
        explanation: "Каждая реплика summary считает свой собственный квантиль по своему локальному потоку наблюдений — усреднение или иное объединение уже готовых чисел с разных реплик математически не эквивалентно вычислению настоящего перцентиля по объединённому множеству всех наблюдений."
      - id: c
