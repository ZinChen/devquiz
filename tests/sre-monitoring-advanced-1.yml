        text: "Это проблема только для GET-запросов, а для POST и PUT аналогичная ситуация кардинальность не увеличивает"
        correct: false
        explanation: "Метод HTTP-запроса не влияет на то, как формируется значение лейбла path — проблема одинаково касается любого метода, если в пути присутствует динамический идентификатор."
      - id: b
        text: "Полный путь запроса нельзя технически использовать как значение лейбла Prometheus из-за ограничений формата"
        correct: false
        explanation: "Синтаксически такое значение лейбла вполне допустимо — проблема не в технической невозможности, а в практических последствиях для кардинальности и потребления ресурсов."
      - id: c
        text: "Проблема решится сама собой при увеличении scrape_interval без изменения самой инструментации"
        correct: false
        explanation: "Изменение частоты сбора не уменьшает число уже существующих уникальных значений лейбла — источник кардинальности остаётся тем же самым независимо от частоты scrape."
      - id: d
        text: "Каждый уникальный ID в пути создаёт новое значение лейбла, поэтому число рядов растёт с числом запросов"
        correct: true
        explanation: "Проблема глубже числа пользователей: даже один и тот же пользователь, обращающийся к разным заказам, порождает новое уникальное значение лейбла path на каждый новый ID в URL — кардинальность растёт вместе с объёмом бизнес-данных."
    explanation: "Правильная инструментация для path-based метрик — использовать нормализованный шаблон маршрута (route pattern) вроде /users/:id/orders/:id, а не фактически подставленные в URL значения. Иначе каждый уникальный ID в пути порождает новое значение лейбла и, соответственно, новый временной ряд — количество рядов растёт вместе с объёмом бизнес-данных (числом заказов, пользователей), а не остаётся стабильным набором маршрутов приложения."
    extended_explanation: "Большинство HTTP-фреймворков и middleware для экспорта метрик (включая стандартные Prometheus-клиенты для популярных web-фреймворков) уже используют шаблон маршрута вместо фактического URL по умолчанию именно по этой причине — но при ручной инструментации кастомных обработчиков эту деталь легко упустить."
    recommendation: "Проверить, что лейбл path в HTTP-метриках использует шаблон маршрута, а не фактически подставленные значения параметров."
    difficulty: hard
    topics: [observability]

  - id: q23
    text: "Команда получает десятки алертов каждую ночь, большинство из которых не требуют реального вмешательства и просто закрываются дежурным без действий. Как называется это явление и в чём его практическая опасность?"
    type: single
    options:
      - id: a
        text: "SLO drift — постепенное смещение целевого показателя SLO без формального пересмотра команды"
        correct: false
        explanation: "SLO drift описывает другую проблему — неконтролируемое изменение самой цели SLO с течением времени."
      - id: b
        text: "Burn rate inversion — ситуация, когда error budget восстанавливается быстрее, чем расходуется"
        correct: false
        explanation: "Такого устоявшегося термина в SRE-практике не существует — он не описывает проблему избыточных ночных алертов, требующих внимания дежурного."
      - id: c
        text: "Alert fatigue — притупление внимания к алертам из-за их избыточного количества"
        correct: true
        explanation: "Alert fatigue — прямое следствие плохо настроенного алертинга: когда большинство срабатываний не требуют действия, дежурный привыкает игнорировать или бегло закрывать уведомления, и настоящий критичный инцидент рискует затеряться среди привычного шума."
      - id: d
        text: "Golden signal saturation — состояние, при котором все четыре golden signals одновременно показывают критичные значения"
        correct: false
        explanation: "Это описание не соответствует ни устоявшемуся термину, ни сути проблемы избыточного числа несущественных алертов, не требующих реального вмешательства."
    explanation: "Alert fatigue — хорошо задокументированная в SRE-практике проблема: чем больше алертов приходит без реальной необходимости действовать, тем ниже становится внимательность дежурного к каждому конкретному срабатыванию. Опасность в том, что цена этой проблемы проявляется не сразу и не в виде явной метрики, а в виде пропущенного по невнимательности настоящего инцидента среди привычного потока шума, который команда научилась игнорировать."
    extended_explanation: "Стандартный способ борьбы с alert fatigue — регулярный аудит алертов по принципу «требовал ли этот алерт реального действия»: правила, систематически не приводящие к действиям дежурного, либо перенастраивают на менее чувствительный порог, либо переводят из пейджинга в менее навязчивый канал (тикет, а не звонок среди ночи)."
    recommendation: "Провести ретроспективный аудит алертов за последний месяц — какая доля из них потребовала реального вмешательства дежурного."
    difficulty: medium
    topics: [reliability]

  - id: q24
    text: "Алерт настроен по условию «CPU utilization выше 90%» напрямую на конкретном хосте. Почему в SRE-практике рекомендуют алертить скорее по симптому (нарушение SLO), чем по подобным причинам на уровне инфраструктуры?"
    type: single
    options:
      - id: a
        text: "CPU utilization технически невозможно измерить с достаточной точностью на большинстве современных серверов"
        correct: false
        explanation: "Измерение CPU utilization — стандартная и точная операционная метрика, доступная практически на любой платформе — проблема не в точности измерения, а в его связи с реальным опытом пользователя."
      - id: b
        text: "Высокая утилизация CPU не всегда означает реальную проблему для пользователя, и наоборот"
        correct: true
        explanation: "Алерт по причине (CPU) срабатывает независимо от того, страдает ли реально пользовательский опыт — эффективно спроектированный сервис может работать нормально при высокой загрузке CPU, тогда как алерт по симптому (нарушение SLO) срабатывает именно тогда, когда есть реальное основание для беспокойства."
      - id: c
        text: "Симптом-ориентированные алерты технически проще настроить в Prometheus, чем алерты по инфраструктурным метрикам"
        correct: false
        explanation: "Сложность настройки правила в PromQL не зависит от того, что именно оно проверяет — оба подхода реализуются одинаково стандартными средствами alerting."
      - id: d
        text: "Алерты по причине всегда требуют участия внешнего облачного провайдера для устранения, в отличие от алертов по симптому"
        correct: false
        explanation: "Ответственность за устранение проблемы определяется её природой — принцип формулировки самого алерта здесь роли не играет."
    explanation: "Симптом-ориентированный алертинг (алертить по нарушению или угрозе нарушения SLO) фокусирует внимание команды на том, что действительно важно — реальном влиянии на пользователей, а не на промежуточных показателях инфраструктуры, которые сами по себе могут быть в порядке нормы даже при заметной нагрузке. Алерт по высокой CPU utilization может оказаться ложной тревогой, если сервис спроектирован с запасом и продолжает укладываться в latency и error rate SLO, и наоборот — пропустить реальную деградацию, вызванную не CPU, а, например, медленным внешним API."
    extended_explanation: "Это не означает полный отказ от инфраструктурных метрик как таковых — они остаются ценными для диагностики уже обнаруженной проблемы (найти причину после того, как симптом-алерт сработал), просто их не рекомендуют делать основным триггером для будящего дежурного пейджинга."
    recommendation: "Прочитать про разницу cause-based и symptom-based алертинга в главе про мониторинг Google SRE Book."
    difficulty: medium
    topics: [reliability]

  - id: q25
    text: "После срабатывания критичного алерта дежурный тратит 20 минут на выяснение, какую команду запустить и к какому дашборду обратиться, прежде чем начать реальное расследование. Какая практика SRE предназначена для сокращения именно этого времени?"
    type: single
    options:
      - id: a
        text: "Postmortem — документ с разбором уже завершившегося инцидента, составляемый после его устранения"
        correct: false
        explanation: "Postmortem пишется уже после того, как инцидент закрыт, и полезен для будущих улучшений — он не сокращает время реакции именно во время текущего расследования."
      - id: b
        text: "Runbook — заранее подготовленная инструкция с конкретными шагами диагностики для данного конкретного алерта"
        correct: true
        explanation: "Runbook, привязанный к конкретному alert rule, заранее фиксирует, какие команды запустить, какие дашборды открыть и какие гипотезы проверить в первую очередь — это устраняет именно тот вид потерянного времени, что уходит на восстановление контекста с нуля посреди ночи."
      - id: c
        text: "Error budget policy — заранее согласованное правило действий команды при исчерпании бюджета ошибок"
        correct: false
        explanation: "Error budget policy определяет приоритеты команды на уровне процесса разработки и релизов, а конкретные технические шаги дежурного во время инцидента описывает другой документ."
      - id: d
        text: "Blameless culture — практика разбора инцидентов без поиска виноватого среди участников команды"
        correct: false
        explanation: "Blameless culture касается атмосферы и подхода к последующему разбору инцидента, а немедленные практические шаги дежурного в момент расследования описывает другая практика."
    explanation: "Runbook — практический ответ именно на проблему, описанную в вопросе: он прикрепляется к конкретному alert rule и содержит пошаговые действия — какие команды выполнить, какие дашборды открыть, какие типичные причины проверить в первую очередь. Ссылка на runbook обычно добавляется прямо в текст самого уведомления об алерте (через annotation в Prometheus/Grafana alerting), чтобы дежурный переходил сразу к действию, а не тратил время на восстановление контекста по памяти или поиск инструкции в документации."
    extended_explanation: "Хороший runbook пишется и обновляется по мере накопления опыта расследования конкретного типа алерта — после каждого реального инцидента полезно проверять, действительно ли шаги runbook привели к быстрой диагностике, и дополнять его новыми найденными причинами или уточнёнными командами."
    recommendation: "Написать runbook хотя бы для трёх самых частых критичных алертов своей команды и прикрепить ссылки на них в текст самих алертов."
    difficulty: easy
    topics: [reliability]
