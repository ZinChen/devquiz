    explanation: "Классическая ловушка визуализации counter-метрик — построение графика по сырому накопленному значению вместо rate(). Если сервис уже обработал миллионы запросов с момента последнего перезапуска, добавление нескольких сотен новых ошибок после свежего деплоя визуально сливается с общим трендом на графике накопленной суммы. rate(error_count[5m]) показал бы именно всплеск скорости появления новых ошибок, сделав проблему сразу заметной."
    extended_explanation: "Похожая путаница возникает и при сравнении counter-метрик разных сервисов с разным временем последнего рестарта — сырые накопленные значения несравнимы между собой напрямую именно из-за разной точки отсчёта, тогда как rate() всегда даёт сопоставимую величину независимо от истории перезапусков."
