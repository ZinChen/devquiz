    explanation: "Summary вычисляет перцентили локально на стороне каждого экземпляра приложения перед экспортом метрики — это дёшево для конкретной реплики, но делает агрегацию между несколькими репликами математически некорректной: p95 отдельно на реплике А и отдельно на реплике Б нельзя просто усреднить и получить настоящий p95 по объединённому трафику обеих реплик. Histogram, напротив, экспортирует сырые данные по bucket-ам, которые можно честно просуммировать между репликами и только затем вычислить общий перцентиль через histogram_quantile()."
