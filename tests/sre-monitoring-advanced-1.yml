        explanation: "Потери данных при штатном деплое в Prometheus не происходит — расхождение объясняется именно способом визуализации сырого значения counter."
      - id: b
        text: "Метрики counter в принципе не способны отражать ошибки, только успешные операции"
        correct: false
        explanation: "Counter одинаково хорошо подходит и для подсчёта ошибок, и для подсчёта успешных операций — ограничения по типу событий, которые он способен считать, здесь нет."
      - id: c
        text: "Логи и метрики физически не могут показывать согласованную картину одного и того же инцидента"
        correct: false
        explanation: "Логи и метрики вполне могут и должны быть согласованы между собой — расхождение здесь объясняется конкретной ошибкой визуализации графика."
      - id: d
        text: "На графике отображается сырое значение counter без rate(), и рост на фоне большого накопленного значения незаметен"
