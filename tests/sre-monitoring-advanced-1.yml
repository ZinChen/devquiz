slug: sre-monitoring-advanced-1
title: "SLI/SLO/SLA и прикладной мониторинг"
description: "Практический тест по SRE-мониторингу: SLI/SLO/SLA и error budget, golden signals, PromQL на практике, кардинальность лейблов и алертинг как рабочий процесс."
tags: [monitoring, sre, observability, prometheus]
difficulty: advanced
estimated_time: 30

questions:
  # ── Блок 1: SLI/SLO/SLA — определения и границы ──────────────────────────

  - id: q1
    text: "Чем SLI отличается от SLO по своей природе?"
    type: single
    options:
      - id: a
        text: "SLI — измеримая метрика поведения системы, SLO — целевое значение этой метрики"
        correct: true
        explanation: "SLI (service level indicator) — это число, получаемое напрямую из наблюдений системы, а SLO (service level objective) — целевой порог, с которым это число сравнивают, чтобы понять, укладывается сервис в ожидания или нет."
      - id: b
        text: "SLI — контракт с внешним клиентом, SLO — внутренняя метрика для команды разработки"
        correct: false
        explanation: "Контракт с внешним клиентом — это SLA; SLI остаётся именно измеримым показателем поведения системы."
      - id: c
        text: "SLI применяется только к latency, SLO — только к доступности сервиса"
        correct: false
        explanation: "Оба термина применимы к любому измеримому аспекту сервиса — latency, доступности, error rate — деление по типу метрики не описывает их реальную разницу."
      - id: d
        text: "SLI задаётся командой эксплуатации, SLO — командой продукта, и они всегда независимы друг от друга"
        correct: false
        explanation: "Формальной привязки термина к конкретной команде нет, и SLO обычно определяется именно с оглядкой на измеримые значения SLI."
    explanation: "SLI — сырой, измеримый показатель («доля успешных запросов за последние 30 дней», «p99 latency»). SLO — цель, заданная поверх этого показателя («доля успешных запросов не менее 99.9% за скользящие 30 дней»). SLI без SLO — просто число без интерпретации; SLO без SLI не с чем сравнивать."
    extended_explanation: "На практике для одного и того же аспекта сервиса иногда заводят сразу несколько SLI (например, latency отдельно для чтения и записи), но SLO формулируют по каждому из них отдельно, а не одной общей целью на все показатели сразу."
    recommendation: "Прочитать главу про SLI/SLO/SLA в Google SRE Book — она задаёт стандартную терминологию для всей отрасли."
    difficulty: easy
    topics: [reliability]

  - id: q2
    text: "Чем SLA отличается от SLO?"
    type: single
    options:
      - id: a
        text: "SLA — то же самое, что SLO, только термин используется в контрактах с внешними заказчиками"
        correct: false
        explanation: "Помимо контекста употребления, SLA содержит именно последствия за нарушение — это структурное, содержательное отличие двух терминов."
      - id: b
        text: "SLA задаётся строже SLO, потому что нарушение контракта недопустимо ни при каких условиях"
        correct: false
        explanation: "На практике порог SLA обычно мягче внутреннего SLO — команда закладывает запас, чтобы кратковременное отклонение от цели не сразу превращалось в нарушение контракта."
      - id: c
        text: "SLA — формальное обязательство перед клиентом с последствиями за нарушение"
        correct: true
        explanation: "SLA — договорной документ, где нарушение целевого показателя влечёт конкретные последствия (компенсацию, штраф), поэтому его порог осознанно берут с запасом относительно внутреннего SLO, чтобы не платить неустойку из-за случайных колебаний."
      - id: d
        text: "SLA существует только для платных внешних клиентов, поэтому у внутренних сервисов SLA в принципе быть не может"
        correct: false
        explanation: "SLA в широком смысле применим и к внутренним соглашениям между командами, хотя чаще всего он действительно ассоциируется именно с внешними коммерческими договорами."
    explanation: "SLO — внутренняя цель команды, устанавливаемая для управления надёжностью сервиса. SLA — формальный контракт, где несоблюдение оговорённого уровня влечёт конкретные последствия для поставщика услуги (компенсация, скидка, право расторжения). Именно из-за юридических последствий порог SLA почти всегда делают заметно мягче внутреннего SLO — запас нужен, чтобы обычные колебания надёжности не сразу превращались в компенсацию клиенту."
    extended_explanation: "Распространённая практика — держать SLO строже SLA намеренно, например SLO 99.95% при SLA 99.9%: разница между ними становится буфером, который команда тратит на внутренние эксперименты и допустимый риск, прежде чем реально нарушить контрактное обязательство."
    recommendation: "Сравнить типичное соотношение порогов SLA и SLO на примерах реальных публичных облачных провайдеров."
    difficulty: medium
    topics: [reliability]

  - id: q3
    text: "Команда выбирает: измерять SLI доступности API как долю успешных HTTP-ответов (request-based) или как долю времени, когда сервис отвечал корректно на синтетические проверки (window-based). В чём практическое отличие этих двух подходов?"
    type: single
    options:
      - id: a
        text: "Request-based SLI взвешивает каждый реальный запрос пользователя, window-based оценивает состояние сервиса независимо от трафика"
        correct: true
        explanation: "Request-based SLI напрямую отражает опыт пользователей, пострадавших от ошибок, тогда как window-based может показать доступность даже в периоды почти нулевого реального трафика, опираясь на отдельные искусственные проверки."
      - id: b
        text: "Request-based SLI применим только к операциям чтения данных, а window-based годится только для операций записи"
        correct: false
        explanation: "Тип операции (чтение или запись) не является критерием выбора между этими двумя подходами — оба применимы к любому виду запросов."
      - id: c
        text: "Window-based SLI всегда даёт более высокое числовое значение доступности, чем request-based, при одинаковых сбоях"
        correct: false
        explanation: "Соотношение значений зависит от конкретного распределения трафика и сбоев по времени — общего правила о безусловном превосходстве одного подхода в цифрах не существует."
      - id: d
        text: "Request-based SLI требует настройки отдельного синтетического мониторинга, а window-based не требует его вовсе"
        correct: false
        explanation: "Именно window-based подход обычно опирается на синтетические проверки — request-based использует уже существующий реальный трафик без дополнительных искусственных запросов."
    explanation: "Request-based SLI считается по фактическим запросам пользователей — «сколько из всех запросов завершились успешно». Он честно отражает реальный ущерб от сбоев, но требует ненулевого трафика, чтобы быть статистически осмысленным. Window-based SLI делит время на интервалы и помечает каждый интервал как «хороший» или «плохой» по результатам отдельной проверки (обычно синтетической) — это работает даже при низком реальном трафике, но не взвешивает влияние сбоя по числу реально пострадавших пользователей."
    extended_explanation: "На низконагруженных или внутренних сервисах window-based подход часто оказывается единственным практичным вариантом — request-based SLI на сервисе с одним запросом в минуту слишком шумный, чтобы служить основой для содержательного SLO."
    recommendation: "Прочитать сравнение request-based и window-based SLI в главе про SLO в Google SRE Workbook."
    difficulty: hard
    topics: [reliability]

  - id: q4
    text: "Команда формулирует SLO как «аптайм сервиса не менее 99.9% в среднем за всё время его существования». Что не так с такой формулировкой SLO?"
    type: single
    options:
      - id: a
        text: "Число 99.9% — слишком строгий порог, который физически недостижим ни для одного production-сервиса"
        correct: false
        explanation: "99.9% — распространённый и вполне достижимый порог для множества реальных сервисов; проблема формулировки не в конкретном числе, а в отсутствии временного окна измерения."
      - id: b
        text: "Аптайм в принципе нельзя использовать как SLI, потому что это принципиально неизмеримая величина"
        correct: false
        explanation: "Аптайм — вполне измеримая величина и стандартный вид SLI для доступности; сама эта метрика не является проблемой формулировки."
      - id: c
        text: "Измерение за всё время без скользящего окна не даёт восстановить бюджет ошибок после инцидента"
        correct: true
        explanation: "Без ограниченного скользящего окна (например, 30 дней) один крупный инцидент навсегда портит совокупную статистику и лишает смысла усилия по восстановлению — команде не остаётся стимула чинить надёжность, раз средний показатель всё равно не вернётся к цели."
      - id: d
        text: "SLO не может быть выражен в процентах, а только в абсолютных единицах времени простоя за период"
        correct: false
        explanation: "Выражение через процент — обычная и широко распространённая форма записи SLO, сама по себе вполне корректная."
    explanation: "Практический смысл SLO — не просто зафиксировать цель, а дать команде инструмент принятия решений здесь и сейчас: сколько ошибок ещё можно себе позволить в текущем периоде. Измерение «за всё время» размывает этот сигнал — крупный давний инцидент продолжает тянуть среднее вниз бесконечно, а недавнее улучшение почти не видно на фоне многолетней истории. Стандартная практика — считать SLO по скользящему окну фиксированной длины (обычно 28 или 30 дней), чтобы старые инциденты со временем выпадали из расчёта."
    extended_explanation: "Выбор длины окна — отдельный компромисс: короткое окно (7 дней) чувствительнее к текущим проблемам, но подвержено случайным колебаниям; длинное окно (90 дней) стабильнее, но медленнее реагирует на реальное улучшение или ухудшение надёжности сервиса."
    recommendation: "Прочитать про выбор длины скользящего окна измерения SLO и его влияние на скорость реакции команды."
    difficulty: medium
    topics: [reliability]

  - id: q5
    text: "У сервиса определены SLO по трём независимым аспектам: latency, error rate и availability. Зачем нужно несколько раздельных SLO вместо одного общего показателя «здоровья сервиса»?"
    type: single
    options:
      - id: a
        text: "Технически невозможно комбинировать разные единицы измерения (миллисекунды, проценты, доли) в одну общую метрику"
        correct: false
        explanation: "Технически объединить разнородные метрики в один взвешенный индекс вполне возможно — причина раздельных SLO не в технической невозможности, а в потере диагностической ценности такого объединения."
      - id: b
        text: "Раздельные SLO нужны только для очень крупных распределённых систем, а для небольших сервисов хватает одного общего показателя"
        correct: false
        explanation: "Принцип независимости аспектов надёжности работает вне зависимости от масштаба сервиса — небольшой сервис тоже может быть доступен, но медленным, или наоборот."
      - id: c
        text: "Раздельные SLO требуются исключительно нормативными требованиями индустрии, а не практической пользой для команды"
        correct: false
        explanation: "Ценность раздельных SLO именно практическая, диагностическая — регуляторные требования, если они вообще есть, не являются основной причиной такого разделения."
      - id: d
        text: "Разные аспекты деградируют независимо друг от друга, и один общий показатель замаскировал бы, какой конкретно аспект нарушен"
        correct: true
        explanation: "Сервис может быть полностью доступен, но заметно медленным, или быстрым, но с растущей долей ошибок — свёртка этих независимых сигналов в одно число потеряла бы информацию о том, какая именно проблема происходит и куда направить усилия."
    explanation: "Latency, error rate и availability — ортогональные измерения качества сервиса, каждое со своей собственной причиной деградации и своим способом починки. Единый агрегированный показатель здоровья удобен для дашборда руководства одним взглядом, но бесполезен для инженера, которому нужно понять, что чинить: он либо скрывает, какой конкретно SLO нарушен, либо требует произвольных весов, оправдать которые нечем."
    extended_explanation: "На практике многие команды всё же строят единый верхнеуровневый composite score для руководства поверх набора раздельных SLO — но используют его только как индикатор общего тренда, а не как замену инженерной диагностике по каждому отдельному показателю."
    recommendation: "Определить для своего сервиса три независимых SLO (latency, availability, error rate) вместо одного общего."
    difficulty: medium
    topics: [reliability]

  # ── Блок 2: Error budget и burn rate ─────────────────────────────────────

  - id: q6
    text: "SLO сервиса — 99.9% успешных запросов за скользящие 30 дней. Что такое error budget в этом контексте?"
    type: single
    options:
      - id: a
        text: "Фиксированная денежная сумма, выделяемая команде на устранение инцидентов"
        correct: false
        explanation: "Error budget — техническая метрика допустимого количества ошибок, никак не связанная с денежным бюджетом команды."
      - id: b
        text: "Допустимая доля неуспешных запросов за тот же период, которую можно потратить, не нарушив SLO"
        correct: true
        explanation: "Error budget — прямое дополнение SLO до 100%: если цель 99.9% успешных запросов, значит бюджет допускает до 0.1% неуспешных за то же скользящее окно, прежде чем SLO будет формально нарушен."
      - id: c
        text: "Максимальное число открытых багов, которое команда может держать в трекере одновременно"
        correct: false
        explanation: "Учёт открытых задач в трекере — отдельный процесс управления бэклогом, не связанный напрямую с расчётом error budget по SLI."
      - id: d
        text: "Время, отведённое на код-ревью перед деплоем в продакшн"
        correct: false
        explanation: "Время код-ревью — процесс разработки, не имеющий отношения к расчёту допустимой доли ошибок сервиса в проде."
    explanation: "Error budget — операционализация SLO в виде конкретного, тратящегося ресурса: если цель 99.9%, оставшиеся 0.1% — это допустимое количество сбоев, которое команда может себе позволить за период измерения, не нарушая обязательство. Бюджет можно тратить осознанно (рискованный релиз, эксперимент) или неосознанно (баг, инцидент) — оба случая одинаково расходуют один и тот же остаток."
    extended_explanation: "Понятие error budget превращает абстрактный вопрос «достаточно ли мы надёжны» в конкретное число, которое можно отслеживать на дашборде в реальном времени — сколько бюджета уже потрачено за текущее окно и сколько осталось до конца периода измерения."
    recommendation: "Посчитать error budget для своего текущего SLO и оценить, сколько его уже потрачено за последние 30 дней."
    difficulty: easy
    topics: [reliability]

  - id: q7
    text: "Команда полностью исчерпала error budget за текущий период измерения SLO. Какое стандартное следствие этого в SRE-практике по книге Google?"
    type: single
    options:
      - id: a
        text: "Команда автоматически получает премию за то, что довела сервис до предела допустимых ошибок"
        correct: false
        explanation: "Исчерпание бюджета — сигнал тревоги, требующий внимания и изменения приоритетов команды."
      - id: b
        text: "SLO автоматически смягчается до значения, которое сервис реально показал в этом периоде"
        correct: false
        explanation: "SLO не подстраивается автоматически под текущие результаты — он остаётся фиксированной целью, установленной командой осознанно и заранее."
      - id: c
        text: "Инцидент немедленно эскалируется до уровня руководства компании вне зависимости от масштаба сервиса"
        correct: false
        explanation: "Автоматической эскалации на уровень руководства не предусмотрено — реакция на исчерпанный бюджет остаётся внутренним процессом команды и её договорённостей."
      - id: d
        text: "Приоритет смещается с новых фич на устранение причин ненадёжности — вплоть до временной заморозки рискованных релизов"
        correct: true
        explanation: "Полностью исчерпанный бюджет — сигнал, что текущая скорость изменений превышает то, что сервис может себе позволить при заданной цели надёжности; стандартная реакция — временно замедлить поток изменений и направить усилия на устранение причин нестабильности."
    explanation: "Идея error budget policy, описанная в Google SRE Book, — заранее согласованное правило поведения на случай исчерпания бюджета: обычно это приоритизация надёжности над новыми фичами, более осторожное отношение к рискованным релизам, иногда формальный релиз-фриз до восстановления запаса бюджета в следующем скользящем окне. Это превращает абстрактный компромисс между скоростью и надёжностью в заранее оговорённую, а не спонтанную реакцию."
    extended_explanation: "Ключевая идея в том, что это правило работает в обе стороны: пока бюджет не исчерпан, команда имеет полное право рисковать и экспериментировать, не спрашивая лишний раз разрешения — избыток бюджета так же значим для принятия решений, как и его нехватка."
    recommendation: "Сформулировать явную error budget policy для своей команды — что происходит при исчерпании бюджета и кто принимает решение о заморозке релизов."
    difficulty: medium
    topics: [reliability]

  - id: q8
    text: "Что такое burn rate в контексте error budget?"
    type: single
    options:
      - id: a
        text: "Абсолютное число серверов, вышедших из строя за последний час"
        correct: false
        explanation: "Burn rate — относительная величина именно скорости расходования бюджета, никак не связанная с числом отказавшего оборудования."
      - id: b
        text: "Скорость, с которой сервис тратит error budget относительно равномерного расходования"
        correct: true
        explanation: "Burn rate 1x означает, что бюджет тратится ровно с той скоростью, при которой он закончится точно к концу периода измерения; burn rate выше 1x означает, что при сохранении текущего темпа бюджет закончится раньше срока."
      - id: c
        text: "Температура серверного оборудования, влияющая на частоту аппаратных сбоев"
        correct: false
        explanation: "Физическая температура оборудования не входит в определение этого термина — burn rate относится исключительно к скорости расходования error budget."
      - id: d
        text: "Процент от годового бюджета компании, потраченный на инфраструктуру мониторинга"
        correct: false
        explanation: "Финансовый бюджет инфраструктуры — совершенно другое понятие, не связанное с термином burn rate в контексте SLO."
    explanation: "Burn rate нормирует текущую скорость ошибок относительно того темпа, при котором весь error budget был бы равномерно израсходован ровно к концу периода измерения. Burn rate = 1 означает «идём точно по плану», burn rate = 10 означает «при таком темпе бюджет израсходуется в 10 раз быстрее номинального» — то есть если весь период 30 дней, при burn rate 10x бюджет исчерпается примерно за 3 дня."
    extended_explanation: "Именно burn rate, а не сам абсолютный факт ошибки, обычно становится триггером для алерта — единичная ошибка почти никогда не заслуживает пейджинга среди ночи, а вот устойчиво высокий burn rate предупреждает о проблеме достаточно рано, чтобы среагировать до полного исчерпания бюджета."
    recommendation: "Посчитать текущий burn rate своего сервиса за последние 24 часа и сравнить с показателем за весь период SLO."
    difficulty: medium
    topics: [reliability]

  - id: q9
    text: "Алертинг по SLO настроен через multi-window multi-burn-rate подход — одновременно проверяется высокий burn rate за короткое окно (1 час) и умеренный burn rate за длинное окно (6 часов) для одного и того же алерта. Зачем нужны сразу два окна вместо одного?"
    type: single
    options:
      - id: a
        text: "Два окна нужны исключительно для избыточности на случай отказа Prometheus, хранящего первое из двух окон"
        correct: false
        explanation: "Отказоустойчивость самого Prometheus решается другими механизмами (репликация, HA) — два окна в правиле алерта посвящены именно балансу скорости и точности обнаружения."
      - id: b
        text: "Короткое окно даёт быструю реакцию на всплеск, длинное защищает от ложных срабатываний на шуме"
        correct: true
        explanation: "Комбинация окон нужна ровно для того, чтобы получить преимущества обоих: без длинного окна алерт слишком чувствителен к шуму, без короткого — слишком медленно реагирует на настоящую деградацию."
      - id: c
        text: "Длинное окно нужно для расчёта самого SLO, а короткое — исключительно для визуализации на дашборде, к алертингу оно отношения не имеет"
        correct: false
        explanation: "Оба окна — равноправная часть одного и того же условия алерта, участвующего в решении о срабатывании."
      - id: d
        text: "Два окна применяются только при использовании нескольких разных datasource одновременно"
        correct: false
        explanation: "Multi-window подход применим и с единственным datasource — количество окон не связано с числом источников данных, участвующих в запросе."
    explanation: "Подход, описанный в Google SRE Workbook, комбинирует короткое и длинное окно одним AND-условием: алерт срабатывает только если оба окна одновременно показывают повышенный burn rate. Короткое окно даёт быструю реакцию на резкое ухудшение, но само по себе слишком шумное — случайный всплеск ошибок за пару минут легко даёт ложное срабатывание. Длинное окно устойчивее к шуму, но реагирует с задержкой. Требование одновременного превышения по обоим окнам заметно снижает число ложных алертов, сохраняя приемлемую скорость реакции на настоящую деградацию."
    extended_explanation: "В классической реализации Google используют даже не два, а четыре сочетания окон и порогов burn rate для разных уровней серьёзности алерта — от быстрого пейджинга при экстремальном burn rate до тихого тикета при умеренном, растянутом на несколько дней превышении."
    recommendation: "Прочитать главу про multi-window multi-burn-rate alerts в Google SRE Workbook и попробовать настроить такое правило на своих метриках."
    difficulty: hard
    topics: [reliability]

  - id: q10
    text: "Сервис исчерпал 90% error budget за 5 дней из 30-дневного окна измерения SLO, хотя обычно тратит бюджет равномерно. Что из перечисленного — самый информативный следующий шаг для диагностики?"
    type: single
    options:
      - id: a
        text: "Найти конкретный момент резкого роста ошибок за последние 5 дней и связать его с деплоем или инцидентом в это время"
        correct: true
        explanation: "Резкое отклонение от привычного равномерного темпа расходования почти всегда означает конкретное дискретное событие-причину — поиск точки перелома на графике burn rate направляет расследование эффективнее, чем общий обзор."
      - id: b
        text: "Немедленно снизить значение SLO до уровня, который сервис реально показывает последние 5 дней"
        correct: false
        explanation: "Снижение цели SLO задним числом маскирует проблему вместо её решения — SLO должен отражать осознанно выбранное обещание команды."
      - id: c
        text: "Полностью отключить error budget policy до конца текущего периода измерения"
        correct: false
        explanation: "Отключение самого механизма контроля именно в момент, когда он сигнализирует о реальной проблеме, устраняет полезный сигнал вместо того, чтобы на него отреагировать."
      - id: d
        text: "Дождаться конца 30-дневного окна и посмотреть, выправится ли ситуация сама собой без вмешательства"
        correct: false
        explanation: "Пассивное ожидание при уже почти исчерпанном бюджете рискует полным нарушением SLO к концу периода — резкое отклонение требует активного расследования именно сейчас."
    explanation: "Равномерный темп расходования бюджета, внезапно сменившийся резким скачком, — характерный признак конкретного инцидента, а не постепенной деградации качества сервиса. Первый шаг диагностики — сопоставить временную метку начала всплеска burn rate с журналом деплоев, изменений конфигурации или известных инцидентов за тот же период: в подавляющем большинстве случаев причина находится именно там, а не в размытом ухудшении общего качества кода."
    extended_explanation: "Полезный побочный эффект дашборда burn rate — сама форма графика подсказывает природу проблемы: резкая ступенька указывает на дискретное событие вроде деплоя, тогда как медленный, плавный наклон вверх скорее говорит о постепенном росте нагрузки или деградации ресурса (например, утечке памяти, заполнении диска)."
    recommendation: "Построить график burn rate за последние 30 дней рядом с таймлайном деплоев и посмотреть на корреляцию всплесков."
    difficulty: medium
    topics: [reliability]

  # ── Блок 3: Golden signals и типы SLI ────────────────────────────────────

  - id: q11
    text: "Google SRE Book описывает четыре golden signals для мониторинга сервиса. Какие это четыре сигнала?"
    type: single
    options:
      - id: a
        text: "CPU, память, диск, сеть"
        correct: false
        explanation: "Это метрики уровня инфраструктуры (утилизация ресурсов хоста) — они полезны, но описывают другой, более низкий уровень наблюдаемости, чем golden signals."
      - id: b
        text: "Логи, метрики, трейсы, события"
        correct: false
        explanation: "Это виды телеметрийных данных (три столпа observability плюс события) — сами по себе они не являются показателями состояния сервиса."
      - id: c
        text: "Deployment frequency, lead time, MTTR, change failure rate"
        correct: false
        explanation: "Это DORA-метрики, характеризующие эффективность процесса разработки и релизов, — совсем другой срез, чем операционное состояние работающего сервиса."
      - id: d
        text: "Latency, traffic, errors, saturation"
        correct: true
        explanation: "Это классический набор из Google SRE Book — задержка ответа, объём запросов, доля ошибок и насыщенность ресурсов системы, вместе дающие достаточно полную картину состояния сервиса без избытка метрик."
    explanation: "Четыре golden signals — latency (время ответа), traffic (объём запросов в единицу времени), errors (доля неуспешных запросов) и saturation (насколько загружены ограниченные ресурсы системы — CPU, память, очереди). Идея в том, что этого минимального набора обычно достаточно, чтобы быстро понять, здоров ли сервис, не утопая в десятках частных метрик."
    extended_explanation: "Похожий, но не идентичный набор из трёх метрик (USE method — utilization, saturation, errors) предлагается для инфраструктурных ресурсов, а RED method (rate, errors, duration) — почти прямой синоним golden signals применительно конкретно к сервисам, обрабатывающим запросы."
    recommendation: "Сопоставить golden signals, USE method и RED method — три похожих, но по-разному сфокусированных набора базовых метрик."
    difficulty: easy
    topics: [observability]

  - id: q12
    text: "Saturation как golden signal описывает загруженность ограниченных ресурсов системы. Чем saturation отличается от простой утилизации (utilization) CPU?"
    type: single
    options:
      - id: a
        text: "Saturation учитывает очередь ожидающей работы, а не только процент занятости ресурса в моменте"
        correct: true
        explanation: "Утилизация в 70% выглядит спокойно сама по себе, но если при этом уже растёт очередь ожидающих запросов, это saturation — система приближается к пределу пропускной способности раньше, чем утилизация формально достигнет 100%."
      - id: b
        text: "Saturation измеряется только для сетевых ресурсов, utilization — только для вычислительных"
        correct: false
        explanation: "Оба понятия применимы к любому ограниченному ресурсу — сети, диску, CPU, памяти — деление по типу ресурса не описывает разницу между ними."
      - id: c
        text: "Saturation — устаревший термин, полностью вытесненный современным понятием utilization"
        correct: false
        explanation: "Оба термина остаются в активном использовании и означают разные вещи — saturation не является устаревшим синонимом utilization."
      - id: d
        text: "Saturation всегда численно меньше utilization при одинаковой нагрузке на систему"
        correct: false
        explanation: "Прямого числового соотношения между ними нет — saturation характеризует другой аспект нагрузки: очередь и запас, ожидающие своей обработки."
    explanation: "Utilization отвечает на вопрос «какая доля ресурса занята прямо сейчас», saturation — на вопрос «сколько работы ждёт своей очереди из-за нехватки этого ресурса». Система с CPU utilization 70% может при этом иметь растущую очередь запросов, если пиковые всплески нагрузки превышают доступную мощность чаще, чем показывает усреднённая утилизация — именно это и есть saturation, более ранний и точный сигнал приближающегося предела, чем сама утилизация."
    extended_explanation: "Практический пример saturation для CPU — length очереди готовых к выполнению процессов (load average, превышающий число ядер), а для сетевого интерфейса — заполненность буфера отправки пакетов, а не просто процент используемой пропускной способности канала."
    recommendation: "Сравнить load average и CPU utilization на своём сервисе под нагрузкой — они часто расходятся именно там, где важнее всего."
    difficulty: hard
    topics: [observability]

  - id: q13
    text: "Дашборд latency показывает среднее время ответа API в 120 мс, что выглядит приемлемо. При этом часть реальных пользователей жалуется на подвисания интерфейса. Какая метрика вместо среднего лучше объяснила бы эту жалобу?"
    type: single
    options:
      - id: a
        text: "Медиана времени ответа, потому что она всегда точнее среднего отражает опыт любого пользователя"
        correct: false
        explanation: "Медиана тоже описывает типичного пользователя в середине распределения и точно так же не показывает состояние медленного хвоста, из-за которого возникают жалобы."
      - id: b
        text: "Суммарное количество запросов за час, потому что оно показывает реальную нагрузку на систему"
        correct: false
        explanation: "Объём трафика — отдельная метрика (traffic из golden signals), не отражающая распределение времени ответа и не объясняющая жалобы на подвисания."
      - id: c
        text: "Количество кода ответа 5xx за тот же период, потому что оно точнее среднего описывает latency"
        correct: false
        explanation: "Код ответа 5xx относится к метрике errors — рост ошибок и рост задержки ответа это разные, хотя иногда и связанные явления."
      - id: d
        text: "Высокий перцентиль времени ответа, отражающий медленный хвост распределения"
        correct: true
        explanation: "Среднее сглаживает распределение и легко маскируется большинством быстрых запросов, тогда как высокий перцентиль (p95 или p99) напрямую показывает, насколько плохо обслуживается именно тот хвост запросов, из-за которого жалуются пользователи."
    explanation: "Среднее время ответа сильно искажается формой распределения: множество быстрых запросов легко перевешивают небольшую, но заметную для пользователей долю очень медленных. Перцентили (p95, p99) прицельно показывают именно верхнюю границу распределения — «насколько медленны 5% или 1% самых плохих запросов» — что напрямую коррелирует с числом реально раздражённых пользователей, тогда как среднее в 120 мс может маскировать p99 в несколько секунд."
    extended_explanation: "Особенно коварный случай — бимодальное распределение, когда запросы делятся на две отчётливые группы (быстрые из кэша и медленные без него): среднее в такой ситуации попадает между двумя пиками, не описывая корректно ни один из реальных сценариев, а перцентили верно показывают оба режима работы."
    recommendation: "Заменить дашборды со средним временем ответа на дашборды с p50/p95/p99 и посмотреть, насколько они расходятся на реальных данных."
    difficulty: medium
    topics: [observability]

  - id: q14
    text: "SLI по latency формулируется как «p99 времени ответа не более 500 мс». Какая практическая проблема возникает, если весь трафик агрегируется в один общий p99 без разделения по типу эндпоинта?"
    type: single
    options:
      - id: a
        text: "Перцентили технически невозможно вычислить, если в системе больше одного типа эндпоинта"
        correct: false
        explanation: "Технически вычисление перцентиля по смешанным данным полностью возможно — проблема не в вычислимости, а в содержательной интерпретации получившегося числа."
      - id: b
        text: "500 мс — заведомо неправильный порог, который нужно заменить на 100 мс независимо от типа эндпоинта"
        correct: false
        explanation: "Проблема формулировки не в конкретном числовом пороге, а в отсутствии разделения по типу операции — правильный порог всё равно зависит от контекста конкретного эндпоинта."
      - id: c
        text: "Лёгкие и тяжёлые эндпоинты смешиваются в одном распределении, искажая p99 в обе стороны"
        correct: true
        explanation: "Один общий перцентиль по существу неоднородной смеси запросов (health check против полнотекстового поиска) не отражает реальный опыт ни для одного конкретного типа операции — тяжёлые запросы завышают общий p99 для лёгких эндпоинтов, а обилие лёгких занижает видимую проблему у тяжёлых."
      - id: d
        text: "SLI по latency должен измеряться только средним значением, а перцентили здесь не нужны вовсе"
        correct: false
        explanation: "Отказ от перцентилей в пользу среднего не решает проблему смешения разнородных запросов, а лишь добавляет ещё одну самостоятельную проблему поверх исходной."
    explanation: "Агрегированный p99 по всему трафику одинаково плохо описывает и лёгкие, и тяжёлые операции: health check с типичным временем ответа 5 мс не должен считаться проблемным, даже если p99 всего сервиса — 500 мс из-за присутствия в том же распределении тяжёлого поиска. Стандартная практика — разделять SLI по классам операций (эндпоинт, тип запроса) и задавать отдельный порог для каждого класса, вместо одной общей цифры на всё разнородное множество запросов."
    extended_explanation: "На практике разделение SLI по эндпоинтам обычно делают через лейбл в самой метрике (например, `route` или `handler` в гистограмме Prometheus) — это позволяет вычислять отдельный histogram_quantile для каждого класса запросов без необходимости заводить полностью отдельную систему метрик."
    recommendation: "Разбить агрегированный SLI по latency на отдельные пороги для разных классов эндпоинтов вместо одной общей цифры."
    difficulty: hard
    topics: [observability]

  - id: q15
    text: "Для очереди фоновых задач (не HTTP API) latency как golden signal нужно переопределить — прямого «времени ответа запроса» там нет. Как обычно формулируют аналог latency для очереди?"
    type: single
    options:
      - id: a
        text: "Время от постановки задачи в очередь до начала или завершения её обработки воркером"
        correct: true
        explanation: "Это прямой содержательный аналог задержки ответа применительно к асинхронной модели — пользователя или систему, поставившую задачу, интересует именно то, сколько она провела в ожидании."
      - id: b
        text: "Количество воркеров, одновременно обрабатывающих задачи из очереди"
        correct: false
        explanation: "Число активных воркеров — метрика параллелизма обработки, отдельная от задержки, которую испытывает конкретная задача от постановки до выполнения."
      - id: c
        text: "Размер очереди в байтах, занимаемых сериализованными задачами"
        correct: false
        explanation: "Объём данных в очереди — метрика использования памяти или хранилища, никак не отражающая время ожидания конкретной задачи."
      - id: d
        text: "Для очередей latency как golden signal принципиально неприменим и должен быть полностью исключён из мониторинга"
        correct: false
        explanation: "Latency вполне применим к очередям в переопределённом виде — исключать этот сигнал из мониторинга асинхронной системы означало бы терять важную информацию о задержках обработки."
    explanation: "Golden signals не привязаны жёстко к HTTP-запросам — они переносятся на любую систему, обрабатывающую единицы работы, при правильной адаптации определения. Для очереди latency естественно переопределяется как время ожидания задачи (queue time) плюс время её фактической обработки (processing time), а не как время ответа синхронного запроса, которого в асинхронной модели попросту не существует."
    extended_explanation: "Полезно измерять queue time и processing time раздельно: растущий queue time при стабильном processing time указывает на нехватку воркеров или всплеск входящей нагрузки, тогда как растущий processing time говорит о проблеме в самой логике обработки конкретной задачи."
    recommendation: "Настроить отдельные метрики queue time и processing time для своей очереди фоновых задач вместо одной общей latency."
    difficulty: medium
    topics: [observability]

  # ── Блок 4: PromQL и инструментация на практике ──────────────────────────

  - id: q16
    text: "Метрика http_requests_total — это Prometheus counter, монотонно растущий с каждым обработанным запросом. Почему для построения графика «запросов в секунду» нужно применять rate(), а не читать значение counter напрямую?"
    type: single
    options:
      - id: a
        text: "Без rate() counter технически не может быть отображён на графике в Grafana в принципе"
        correct: false
        explanation: "Сырое значение counter вполне отображается на графике — просто такой график показывает постоянно растущую накопленную сумму вместо осмысленной скорости запросов в секунду."
      - id: b
        text: "rate() нужен только для метрик типа gauge, а не для counter"
        correct: false
        explanation: "rate() применяется именно к counter — для gauge эта функция концептуально не подходит, потому что gauge и так уже представляет мгновенное значение."
      - id: c
        text: "rate() требуется исключительно при использовании PromQL внутри Grafana, а не при прямых запросах к Prometheus API"
        correct: false
        explanation: "Необходимость rate() для counter не связана с тем, через какой интерфейс выполняется запрос — она вытекает из самой природы метрики."
      - id: d
        text: "Сырое значение counter — накопленная сумма с момента старта, а rate() вычисляет производную по времени"
        correct: true
        explanation: "counter растёт монотонно и никогда не показывает мгновенную скорость сам по себе — rate() берёт разницу значений на границах окна и делит на длительность окна, превращая накопленную сумму в интерпретируемую скорость изменения."
    explanation: "Counter в Prometheus — это метрика, которая только растёт (сбрасываясь в ноль лишь при перезапуске процесса). Само по себе значение counter в конкретный момент времени — это «сколько всего запросов обработано с момента старта», что почти никогда не является интересующим вопросом. rate() вычисляет усреднённую скорость роста за скользящее окно, превращая накопленную сумму в привычную величину «запросов в секунду», сопоставимую между разными временными точками."
    extended_explanation: "rate() также корректно обрабатывает сброс counter при рестарте процесса (когда значение внезапно падает до нуля) — функция распознаёт такой скачок вниз как техническую особенность counter, а не как отрицательную скорость, и компенсирует его при расчёте."
    recommendation: "Сравнить график сырого http_requests_total и rate(http_requests_total[5m]) на одном и том же временном промежутке."
    difficulty: easy
    topics: [observability]

  - id: q17
    text: "Гистограмма http_request_duration_seconds в Prometheus собирает время ответа по bucket-ам. Как из неё получить p95 latency через PromQL?"
    type: single
    options:
      - id: a
        text: "avg(http_request_duration_seconds_sum) / avg(http_request_duration_seconds_count)"
        correct: false
        explanation: "Это вычисляет среднее время ответа — сумма всех длительностей, делённая на их количество, даёт именно среднее значение, отличное по смыслу от p95 хвоста распределения."
      - id: b
        text: "max(http_request_duration_seconds_bucket)"
        correct: false
        explanation: "Простой максимум по bucket-ам гистограммы не является корректным способом вычисления перцентиля — он не учитывает форму накопленного распределения по границам bucket-ов."
      - id: c
        text: "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"
        correct: true
        explanation: "histogram_quantile вычисляет приближённый перцентиль на основе распределения по bucket-ам гистограммы, а rate() предварительно превращает накопленные счётчики каждого bucket в скорость за окно, необходимую для корректного вычисления."
      - id: d
        text: "http_request_duration_seconds_bucket{le=\"0.95\"}"
        correct: false
        explanation: "Значение le=\"0.95\" здесь означало бы конкретную границу bucket в 0.95 секунды — эти два понятия совпадают по числу 0.95, но означают совершенно разное."
    explanation: "Тип метрики histogram в Prometheus хранит данные как набор кумулятивных counter-ов по границам bucket (_bucket с меткой le), суммарную длительность (_sum) и общее число наблюдений (_count). Для вычисления перцентиля сначала нужно через rate() получить скорость роста каждого bucket за окно, а затем передать результат в histogram_quantile(), которая интерполирует приближённое значение перцентиля исходя из распределения наблюдений по границам bucket."
    extended_explanation: "Точность результата histogram_quantile напрямую зависит от того, насколько удачно выбраны границы bucket при инструментации метрики — слишком редкие или неудачно расставленные границы (например, шаг в секунду там, где реальные времена ответа исчисляются миллисекундами) дают грубую интерполяцию перцентиля, даже если сама формула запроса написана правильно."
    recommendation: "Настроить histogram для своего сервиса и сравнить histogram_quantile(0.95, ...) с вычислением через summary-метрику того же показателя."
    difficulty: hard
    topics: [observability]

  - id: q18
    text: "При инструментации нового сервиса нужно выбрать тип метрики для текущего числа открытых соединений с базой данных. Какой тип Prometheus для этого подходит, а не counter?"
    type: single
    options:
      - id: a
        text: "Counter — метрика, которая может только увеличиваться с течением времени"
        correct: false
        explanation: "Counter физически не может отразить уменьшение числа соединений при их закрытии — его монотонная природа плохо подходит для показателя, естественно колеблющегося в обе стороны."
      - id: b
        text: "Histogram — метрика, распределяющая наблюдения по заранее заданным bucket-ам"
        correct: false
        explanation: "Histogram предназначен для распределений измеряемых величин вроде latency или размера запроса — единственное текущее значение описывает другой тип метрики."
      - id: c
        text: "Gauge — значение, которое может как расти, так и уменьшаться"
        correct: true
        explanation: "Число открытых соединений естественным образом растёт и падает по мере открытия и закрытия соединений — именно эту семантику произвольного изменения значения в обе стороны и представляет gauge, в отличие от исключительно растущего counter."
      - id: d
        text: "Summary — метрика, вычисляющая перцентили на стороне клиента перед экспортом"
        correct: false
        explanation: "Summary, как и histogram, предназначен для распределений отдельных измерений — отслеживание одного изменяющегося во времени числа устроено иначе."
    explanation: "Gauge — правильный тип метрики для любого значения, которое естественно колеблется вверх и вниз: число открытых соединений, объём используемой памяти, размер очереди, температура. Counter в Prometheus по определению монотонно растущий (не считая технического сброса при рестарте процесса), поэтому физически не способен корректно представить уменьшение значения при закрытии соединения."
    extended_explanation: "Типичная ошибка инструментации — использовать counter там, где по сути нужен gauge, инкрементируя его при каждом открытии соединения без соответствующего декремента при закрытии: такая метрика будет бесконечно расти, даже если реальное число активных соединений стабильно, и не будет отражать текущее состояние системы."
    recommendation: "Проверить свою инструментацию метрик на соответствие семантике: монотонно растущее значение — counter, произвольно колеблющееся — gauge."
    difficulty: easy
    topics: [observability]

  - id: q19
    text: "После деплоя новой версии сервиса количество ошибок в метрике error_count (counter) визуально почти не растёт на графике, хотя в логах видно явное увеличение числа ошибок. Какая частая причина такого расхождения при работе с counter-метриками?"
    type: single
    options:
