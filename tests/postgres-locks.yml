      - id: b
        text: "Установка уровня изоляции SERIALIZABLE для всех транзакций, работающих с этой таблицей"
        correct: false
        explanation: "SERIALIZABLE — отдельный, куда более широкий механизм на уровне всей транзакции целиком, не заточенный конкретно под версионирование строки."
