  # ── Advisory locks: диагностика ──────────────────────────────────────────

  - id: q12
    text: "Advisory-локи зависли и накапливаются. Как посмотреть, какие ключи заняты?"
    type: single
    options:
      - id: a
        text: "Через `pg_locks` с `locktype = 'advisory'`, собрав ключ из `classid` и `objid`"
        correct: true
        explanation: "Bigint-ключ хранится расщеплённым на две 32-битные части в этих двух колонках — их нужно собрать обратно битовым сдвигом."
      - id: b
        text: "Через `pg_stat_activity`, где активные advisory-локи отображаются прямо в поле query"
        correct: false
        explanation: "pg_stat_activity показывает текущий выполняемый запрос сессии; список удерживаемых ею блокировок хранит именно pg_locks."
      - id: c
        text: "Никак — advisory-локи принципиально не отображаются ни в одном системном представлении"
        correct: false
        explanation: "Они видны в pg_locks наравне со всеми остальными типами блокировок — просто ключ там хранится не в удобном для чтения виде."
      - id: d
        text: "Через `pg_advisory_list()` — встроенную системную функцию перечисления занятых ключей"
        correct: false
        explanation: "Такой функции в PostgreSQL не существует — список занятых ключей получают обычным запросом к pg_locks."
    explanation: "Bigint-ключ хранится расщеплённым на две 32-битные части: `classid` — старшие биты, `objid` — младшие. Собрать обратно можно так: `(classid::bigint << 32) | objid::bigint`. Обратный разбор — сдвигом вправо и маской `& 4294967295`. Функции pg_advisory_list не существует."
    extended_explanation: "Полезный фильтр для живой диагностики: `SELECT (classid::bigint << 32) | (objid::bigint & 4294967295) AS key, pid, mode, granted FROM pg_locks WHERE locktype = 'advisory';` — сразу видно, какие ключи заняты и кем. Составной ключ полезно один раз вручную собрать и разобрать в psql: формула запоминается."
    recommendation: "Устройство pg_locks для advisory locks: classid, objid, objsubid и сборка 64-битного ключа."
    difficulty: hard
    topics: [locking, operations]

