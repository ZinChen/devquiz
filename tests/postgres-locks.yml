    explanation: "Advisory lock — рекомендательный: он защищает, только пока все участники его берут. Новый сервис, миграция или ручной скрипт про договорённость не знают. Уникальный индекс и проверка версии в WHERE работают всегда и не зависят от дисциплины кода — при прочих равных выбирают их."
    extended_explanation: "Правило выбора по умолчанию: если конкуренцию можно свести к ограничению на уровне схемы (уникальный индекс, CHECK-констрейнт, условие в WHERE), это надёжнее advisory lock — гарантия держится независимо от того, кто и как пишет код. Перед тем как брать advisory lock в новой задаче, стоит спросить, нельзя ли добиться того же ограничением на уровне схемы."
    recommendation: "Ограничения на уровне схемы вместо явных блокировок: уникальные индексы, CHECK и условия в WHERE."
