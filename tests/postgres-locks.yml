    explanation: "Ничего не удерживается: транзакции не ждут друг друга, а проигравший просто перечитывает и повторяет. Дёшево при редких конфликтах — а в обработчиках событий ретрай обычно и так предусмотрен. При частых конфликтах наоборот: постоянные повторы обойдутся дороже ожидания."
    extended_explanation: "Порог выбора между оптимистичной и пессимистичной блокировкой — частота реальных конфликтов, а не вкусовщина: при высокой конкуренции за одну и ту же строку постоянные ретраи оптимистичной схемы обходятся дороже, чем просто подождать на FOR UPDATE. Цену ретраев показывает доля UPDATE с нулём затронутых строк: её стоит оценить в своей системе."
    recommendation: "Оптимистичная и пессимистичная блокировка: версионирование строк, ретраи и порог частоты конфликтов."
