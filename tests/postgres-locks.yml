slug: postgres-locks
title: "PostgreSQL: блокировки"
description: "Строчные блокировки, advisory locks и их область действия, оптимистичная альтернатива, блокировки при DDL и диагностика через pg_locks. Упор на то, где блокировка оправдана, а где решается проще."
tags: [postgresql, locking, concurrency, backend, claude-gen]
difficulty: expert
estimated_time: 30

questions:

  # ── Что вообще блокируется ───────────────────────────────────────────────

  - id: q1
    text: "Блокирует ли обычный `SELECT` строки, которые читает?"
    type: single
    options:
      - id: a
        text: "Да, на время выполнения запроса SELECT берёт разделяемую блокировку строк"
        correct: false
        explanation: "Разделяемую блокировку строк берёт специальный режим FOR SHARE — обычное чтение остаётся полностью не блокирующим по смыслу MVCC."
      - id: b
        text: "Нет, благодаря MVCC читающие не блокируют пишущих"
        correct: true
        explanation: "Читатель работает со снимком версий строк, зафиксированным на момент старта запроса, — снимок делает блокировку пишущих попросту не нужной."
      - id: c
        text: "Зависит от наличия индекса по условию запроса — без индекса блокируются все строки таблицы"
        correct: false
        explanation: "План выполнения (Seq Scan против Index Scan) влияет на скорость чтения, но не на то, берёт ли SELECT блокировку строк — он её не берёт в любом случае."
      - id: d
        text: "Да, но только при уровне изоляции REPEATABLE READ и выше блокировка становится обязательной"
        correct: false
        explanation: "Уровень изоляции определяет только то, какой снимок данных видит транзакция — обычный SELECT остаётся без блокировки строк на любом из уровней."
    explanation: "MVCC хранит версии строк, поэтому читатель видит снимок и никому не мешает. Побочный эффект есть, но другой: долгая читающая транзакция удерживает снимок и мешает VACUUM убирать мёртвые версии — таблица раздувается. Блокировка здесь ни при чём."
    extended_explanation: "Проверить, не мешает ли долгая транзакция вакууму: `SELECT pid, state, xact_start FROM pg_stat_activity WHERE state = 'idle in transaction';` — такие сессии стоит убивать через `idle_in_transaction_session_timeout`. Раздувание таблицы после этого видно в `pg_stat_user_tables.n_dead_tup`."
    recommendation: "Разобраться, как MVCC хранит версии строк и когда VACUUM их убирает — это объясняет и производительность, и раздувание таблиц."
    difficulty: medium
    topics: [locking, concurrency]

  - id: q2
    text: "Две транзакции одновременно делают `UPDATE` разных строк одной таблицы. Будет ли ожидание?"
    type: single
    options:
      - id: a
        text: "Только при уровне изоляции SERIALIZABLE, на более низких уровнях ожидания не будет"
        correct: false
        explanation: "Уровень изоляции определяет видимость данных транзакцией; гранулярность блокировок при записи одна и та же на всех уровнях."
      - id: b
        text: "Да, если у таблицы есть индекс по изменяемой колонке, и обновление проходит через него"
        correct: false
        explanation: "Индекс ускоряет поиск нужной строки, но не меняет того, какая блокировка берётся при её обновлении — она всё равно строчная."
      - id: c
        text: "Да, UPDATE всегда блокирует таблицу целиком, независимо от того, какие строки изменяются"
        correct: false
        explanation: "Блокировка таблицы целиком — поведение некоторых DDL-операций; обычный UPDATE трогает только изменяемые строки."
      - id: d
        text: "Нет, блокировка берётся на уровне строки, и разные строки друг другу в этом смысле не мешают"
        correct: true
        explanation: "Row-level lock конфликтует только с блокировкой той же самой строки — на разные строки одной таблицы он никак не влияет."
    explanation: "Row-level lock конфликтует лишь на той же строке. Если ожидание всё-таки возникло при разных строках — значит, кто-то взял блокировку уровня таблицы, обычно параллельная DDL-операция вроде ALTER TABLE или CREATE INDEX без CONCURRENTLY."
    extended_explanation: "Найти, кто держит блокировку таблицы: `SELECT pid, mode, relation::regclass FROM pg_locks WHERE relation = 'ваша_таблица'::regclass;` Режимы вроде ACCESS EXCLUSIVE в этом выводе — верный признак DDL, а не обычных UPDATE. Таблица режимов блокировок из документации пригодится при чтении pg_locks."
    recommendation: "Режимы блокировок таблиц и строк в PostgreSQL: какие операции какой режим берут и как читать их в pg_locks."
    difficulty: medium
    topics: [locking]

  # ── SELECT FOR UPDATE ────────────────────────────────────────────────────

  - id: q3
    text: "Когда оправдан `SELECT ... FOR UPDATE`?"
    type: single
    options:
      - id: a
        text: "Когда требуется прочитать данные, не дожидаясь завершения других параллельных транзакций"
        correct: false
        explanation: "FOR UPDATE не ускоряет и не отвязывает чтение от других транзакций — наоборот, добавляет ожидание там, где строка уже занята."
      - id: b
        text: "Когда решение о записи зависит от прочитанного значения в той же транзакции"
        correct: true
        explanation: "Между чтением остатка и записью нового значения никто не должен вклиниться — FOR UPDATE удерживает строку ровно на это окно."
      - id: c
        text: "Когда таблица большая и обычный SELECT без FOR UPDATE работает заметно медленнее"
        correct: false
        explanation: "Размер таблицы влияет на план запроса и выбор индексов — выбор между SELECT и FOR UPDATE это отдельная, не связанная с размером ось."
      - id: d
        text: "Когда нужно ускорить последующий UPDATE той же строки за счёт предварительного захвата"
        correct: false
        explanation: "Предварительный захват не ускоряет запись — сама блокировка требует времени на ожидание, если строка уже занята кем-то другим."
    explanation: "Классический случай — списание баланса или выдача последнего товара: между чтением остатка и записью нового значения никто не должен вклиниться. Без захвата две транзакции прочитают одно и то же и обе спишут. На скорость FOR UPDATE не влияет, скорее наоборот — добавляет ожидание."
    extended_explanation: "Частый повод для FOR UPDATE — паттерн read-modify-write: прочитать остаток, посчитать новое значение в коде приложения, записать. Без явного захвата это классический race condition независимо от языка и фреймворка, а не специфика PostgreSQL. Race condition полезно один раз воспроизвести вручную: две параллельные транзакции без FOR UPDATE в psql."
    recommendation: "Паттерн read-modify-write и race condition: потерянные обновления и способы их предотвращения (FOR UPDATE, версия строки, атомарный UPDATE)."
    difficulty: medium
    topics: [locking, transactions]

  - id: q4
    text: "Чем `FOR NO KEY UPDATE` слабее `FOR UPDATE`?"
    type: single
    options:
      - id: a
        text: "Допускает одновременный `FOR UPDATE` другой транзакции на ту же строку"
        correct: false
        explanation: "Эти режимы между собой конфликтуют. Слабее FOR NO KEY UPDATE лишь по отношению к блокировкам, которые берут проверки внешних ключей."
      - id: b
        text: "Действует только до конца запроса, а не до конца транзакции"
        correct: false
        explanation: "Оба режима живут до конца транзакции. Различие не во времени удержания, а в том, с чем режим конфликтует."
      - id: c
        text: "Не конфликтует с `FOR KEY SHARE`, которую берут проверки внешних ключей"
        correct: true
        explanation: "Вставка дочерней строки берёт FOR KEY SHARE на родителе. С FOR UPDATE она встанет в очередь, а с FOR NO KEY UPDATE пройдёт спокойно."
      - id: d
        text: "Разрешает другим транзакциям изменять неключевые колонки той же строки"
        correct: false
        explanation: "Обычный UPDATE сам берёт FOR NO KEY UPDATE, поэтому с ним он конфликтует: параллельно изменить такую строку нельзя."
    explanation: "Обычный UPDATE, не затрагивающий ключевых колонок, берёт именно FOR NO KEY UPDATE, а проверка внешнего ключа при вставке дочерней строки — FOR KEY SHARE на родителе. Явный FOR UPDATE конфликтует с обоими и без нужды блокирует вставки дочерних строк."
    extended_explanation: "Если строку нужно прочитать и изменить, а ключ не меняется, подойдёт `SELECT ... FOR NO KEY UPDATE`: параллельные вставки дочерних строк (например, позиций заказа) не встанут в очередь. В ActiveRecord `lock` по умолчанию даёт FOR UPDATE, но можно передать нужную строку: `lock('FOR NO KEY UPDATE')`. Практически стоит посмотреть, где в коде FOR UPDATE берётся ради родительской строки, на которую ссылаются вставки."
    recommendation: "Режимы блокировки строк в PostgreSQL: FOR UPDATE, FOR NO KEY UPDATE, FOR SHARE, FOR KEY SHARE и их взаимодействие с внешними ключами."
    difficulty: hard
    topics: [locking, queries]

  - id: q5
    text: "Код выполняет `SELECT ... FOR UPDATE` вне явной транзакции, в режиме autocommit. Что произойдёт?"
    type: single
    options:
      - id: a
        text: "Блокировка неявно повысится до блокировки уровня всей таблицы"
        correct: false
        explanation: "Повышения до блокировки таблицы здесь не происходит — блокировка остаётся строчной, просто снимается почти сразу."
      - id: b
        text: "Блокировка сохранится до конца сессии, пока соединение не будет закрыто клиентом"
        correct: false
        explanation: "Сессионное удержание характерно для pg_advisory_lock; строчная блокировка живёт ровно до конца транзакции."
      - id: c
        text: "PostgreSQL вернёт ошибку, что FOR UPDATE требует явно открытой транзакции"
        correct: false
        explanation: "Синтаксической ошибки не будет — в autocommit каждый запрос и так выполняется в неявной одношаговой транзакции."
      - id: d
        text: "Блокировка снимется сразу после выполнения запроса, защиты от гонки не будет"
        correct: true
        explanation: "В autocommit запрос сам себе транзакция и коммитится сразу — блокировка исчезает раньше, чем код успевает выполнить следующий UPDATE."
    explanation: "В autocommit каждый запрос — сама себе транзакция, которая тут же коммитится, и строчная блокировка освобождается. Код выглядит защищённым, но между SELECT и последующим UPDATE окно гонки открыто. Отсюда правило: FOR UPDATE имеет смысл только внутри явной транзакции вместе с изменением."
    extended_explanation: "ORM вроде ActiveRecord прячут это за `.lock.find(...)` — выглядит безопасно, но без обёртки в `transaction do ... end` защита исчезает бесследно и без предупреждений от фреймворка. В коде стоит проверить каждое использование `.lock` или FOR UPDATE: оно должно быть внутри явной транзакции."
    recommendation: "Блокировки и границы транзакции: autocommit, неявные транзакции и время жизни блокировки строки."
    difficulty: hard
    topics: [locking, transactions]

  - id: q6
    text: "Чем `FOR UPDATE` отличается от `FOR SHARE`?"
    type: single
    options:
      - id: a
        text: "FOR SHARE могут держать несколько транзакций сразу, FOR UPDATE — только одна"
        correct: true
        explanation: "FOR SHARE нужен там, где важно, чтобы строка не изменилась, пока на неё ссылаются, но сама проверка не эксклюзивна — таких проверок может быть несколько сразу."
      - id: b
        text: "FOR SHARE блокирует последующее чтение строки, а FOR UPDATE блокирует только запись в неё"
        correct: false
        explanation: "Оба режима не блокируют обычное чтение без FOR UPDATE/FOR SHARE — MVCC гарантирует, что читатели вообще ни на что не наталкиваются."
      - id: c
        text: "FOR SHARE действует до конца сессии, а FOR UPDATE снимается уже по завершении транзакции"
        correct: false
        explanation: "Оба режима привязаны к транзакции одинаково — область действия у них не различается, разница только в исключительности захвата."
      - id: d
        text: "FOR SHARE работает на уровне всей таблицы, а FOR UPDATE — на уровне отдельной строки"
        correct: false
        explanation: "Гранулярность у обоих одна и та же — строчная; уровня таблицы здесь нет ни у одного из режимов."
    explanation: "FOR SHARE нужен, когда важно, чтобы строка не изменилась, пока вы на неё ссылаетесь — например, проверяете существование родительской записи перед вставкой дочерней. Несколько транзакций могут держать FOR SHARE одновременно, но ни одна не сможет обновить строку."
    extended_explanation: "Похожая ситуация: проверка остатка товара перед резервированием, где несколько покупателей одновременно должны увидеть один и тот же (актуальный) остаток, но сама проверка не должна мешать другим таким же проверкам — только записи."
    recommendation: "Разобраться в полной матрице конфликтов режимов блокировок из документации PostgreSQL — FOR SHARE и FOR UPDATE лишь два самых частых случая из большего набора."
    difficulty: hard
    topics: [locking]

  - id: q7
    text: "Чем `SELECT ... FOR UPDATE NOWAIT` отличается от `SELECT ... FOR UPDATE SKIP LOCKED`?"
    type: single
    options:
      - id: a
        text: "Оба варианта делают одно и то же, просто под разными именами для обратной совместимости"
        correct: false
        explanation: "Поведение у них разное: одно завершается ошибкой на занятой строке, другое молча идёт дальше — совместимостью это не объясняется."
      - id: b
        text: "NOWAIT пропускает заблокированные строки, а SKIP LOCKED прерывает запрос ошибкой"
        correct: false
        explanation: "Это ровно наоборот — NOWAIT сразу бросает ошибку, а SKIP LOCKED молча пропускает занятое."
      - id: c
        text: "NOWAIT работает только с FOR SHARE, а SKIP LOCKED — только с FOR UPDATE"
        correct: false
        explanation: "Оба ключевых слова совместимы и с FOR UPDATE, и с FOR SHARE — ограничения по типу блокировки здесь нет."
      - id: d
        text: "NOWAIT сразу возвращает ошибку на занятой строке, а SKIP LOCKED молча пропускает её и берёт следующую"
        correct: true
        explanation: "NOWAIT нужен там, где занятая строка — сигнал ошибки для кода, а SKIP LOCKED — там, где занятость означает «уже забрали, бери следующую»."
    explanation: "NOWAIT нужен там, где занятая строка — это сигнал ошибки для вызывающего кода: пусть решает сам, а не ждёт. SKIP LOCKED нужен там, где занятая строка — это просто «кто-то другой уже забрал эту задачу», как в очереди на выборку: молча берём следующую свободную. Оба применимы к FOR UPDATE и FOR SHARE одинаково."
    extended_explanation: "NOWAIT удобен там, где вместо ожидания лучше сразу показать пользователю «попробуйте позже» — например, при попытке одновременного редактирования одной записи в админке двумя людьми. Различие нагляднее всего на практике: сравнить поведение обычного FOR UPDATE, NOWAIT и SKIP LOCKED в одном сценарии конкуренции."
    recommendation: "NOWAIT и SKIP LOCKED: когда занятая строка означает ошибку, а когда повод взять следующую; очереди и точечные операции."
    difficulty: medium
    topics: [locking, queries]

  # ── Advisory locks: область действия ─────────────────────────────────────

  - id: q8
    text: "Чем advisory lock принципиально отличается от блокировки строки?"
    type: single
    options:
      - id: a
        text: "Он не привязан ни к какой строке — это произвольный числовой ключ, известный только приложению"
        correct: true
        explanation: "База не знает, что означает ваш ключ — она лишь гарантирует, что двое не возьмут один и тот же ключ одновременно."
      - id: b
        text: "Он работает быстрее строчной блокировки, потому что не пишется в журнал транзакций"
        correct: false
        explanation: "Разница между advisory lock и строчной блокировкой не в скорости и не в WAL — обе примерно сопоставимы по стоимости захвата."
      - id: c
        text: "Он действует на уровне всей таблицы целиком, а не на уровне отдельной строки"
        correct: false
        explanation: "Advisory lock вообще не привязан к таблице или строке — гранулярность здесь другая ось, не «таблица против строки»."
      - id: d
        text: "Он не снимается автоматически ни при каких условиях, даже при обрыве соединения"
        correct: false
        explanation: "Сессионный advisory lock снимается при обрыве соединения, а транзакционный — при коммите или откате; «никогда» неверно для обоих вариантов."
    explanation: "База не знает, что защищает ваш ключ — она лишь гарантирует, что двое не возьмут один и тот же ключ одновременно. Отсюда и название «advisory», рекомендательная: работает, только пока все участники соблюдают договорённость. Это временный мьютекс, реализованный средствами СУБД."
    extended_explanation: "Рекомендательность — не теоретическая тонкость: скрипт для ручной починки данных, который не знает про advisory lock приложения, преспокойно обновит те же строки параллельно с обработчиком. Строчная блокировка от такого спасает, advisory lock — нет. Раздел про advisory locks в документации PostgreSQL стоит прочитать целиком."
    recommendation: "Advisory locks в PostgreSQL: рекомендательная природа, ключи, различие session-level и transaction-level."
    difficulty: medium
    topics: [locking, concurrency]

  - id: q9
    text: "В чём разница между `pg_advisory_lock` и `pg_advisory_xact_lock`?"
    type: single
    options:
      - id: a
        text: "Первый работает только с bigint-ключом, второй — только с парой значений int32"
        correct: false
        explanation: "Обе функции имеют перегрузки и с bigint, и с парой int32 — по типу аргумента они не различаются."
      - id: b
        text: "Первый живёт до явного unlock или обрыва соединения, второй освобождается автоматически при завершении транзакции"
        correct: true
        explanation: "Разница только в области действия — сессия против транзакции; именно это определяет, когда лок снимется."
      - id: c
        text: "Первый ждёт освобождения ключа, второй вместо ожидания сразу возвращает false"
        correct: false
        explanation: "Немедленный возврат вместо ожидания — поведение именно try-варианта функции, отдельное от выбора между сессией и транзакцией."
      - id: d
        text: "Первый берёт исключительную блокировку ключа, второй — разделяемую блокировку того же ключа"
        correct: false
        explanation: "У обеих функций есть варианты и на исключительную, и на разделяемую блокировку — режим захвата задаётся отдельно от области действия."
