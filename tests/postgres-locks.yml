    options:
      - id: a
        text: "Ограничивает общее время выполнения запроса целиком, а не только ожидание"
        correct: false
        explanation: "Ограничение общего времени запроса задаёт отдельный параметр statement_timeout."
      - id: b
        text: "Задаёт интервал между повторными попытками захвата занятой блокировки"
        correct: false
        explanation: "PostgreSQL не делает периодических повторных попыток захвата — запрос либо получает блокировку, либо ждёт непрерывно до таймаута или освобождения."
      - id: c
        text: "Ограничивает время, в течение которого можно удерживать собственную блокировку"
        correct: false
        explanation: "Параметр действует на ждущего чужую блокировку; свою уже взятую можно удерживать сколько угодно."
      - id: d
        text: "Ограничивает время ожидания чужой блокировки, по истечении запрос падает с ошибкой"
        correct: true
        explanation: "Различие принципиальное: параметр ограничивает именно того, кто ждёт чужую блокировку, оставляя держателя свободным во времени."
    explanation: "Различие принципиальное: параметр ограничивает ждущего, а не держащего. Свою блокировку вы удерживаете сколько угодно. Ограничение общего времени запроса — это `statement_timeout`, а `idle_in_transaction_session_timeout` прибивает сессию, зависшую внутри открытой транзакции, косвенно освобождая её локи."
    extended_explanation: "Три таймаута решают разные проблемы и обычно настраиваются вместе: lock_timeout — не ждать чужую блокировку долго, statement_timeout — не выполнять один запрос вечно, idle_in_transaction_session_timeout — не давать транзакции висеть открытой без активности. Три таймаута можно выставить в тестовой базе и посмотреть на реальных сценариях, какой из них сработает первым."
    recommendation: "Таймауты в PostgreSQL: lock_timeout, statement_timeout и idle_in_transaction_session_timeout, и какую проблему решает каждый."
    difficulty: medium
    topics: [locking, operations]

  - id: q19
    text: "Зачем перед миграцией на проде выставляют небольшой `lock_timeout`?"
    type: single
    options:
      - id: a
        text: "Чтобы миграция автоматически повторилась после освобождения нужной ей блокировки"
        correct: false
        explanation: "PostgreSQL сам не повторяет упавший запрос — автоматический ретрай, если он нужен, реализуется отдельно на уровне приложения или инструмента миграций."
      - id: b
        text: "Чтобы миграция упала сама, а не встала в очередь, удерживая позади себя все остальные запросы"
        correct: true
        explanation: "ALTER TABLE, ждущий свою блокировку, сам становится препятствием — все последующие запросы к таблице выстраиваются позади него."
      - id: c
        text: "Чтобы можно было откатить уже применённые изменения миграции при неудаче"
        correct: false
        explanation: "Откат изменений — вопрос транзакционности самой миграции; таймаут ожидания блокировки к этому отношения не имеет."
      - id: d
        text: "Чтобы ускорить выполнение самой миграции за счёт более раннего захвата блокировки"
        correct: false
        explanation: "lock_timeout не ускоряет захват блокировки — он лишь ограничивает, сколько миграция готова прождать её освобождения, прежде чем сдаться."
    explanation: "Механизм неочевидный и потому опасный: ALTER TABLE, ждущий ACCESS EXCLUSIVE, сам становится препятствием — все последующие запросы к таблице выстраиваются за ним. Один долгий SELECT впереди превращается в остановку всей таблицы. Быстрое падение миграции безопаснее: повторить её можно в спокойный момент."
    extended_explanation: "Механизм полностью называется lock queue starvation: даже быстрые запросы, пришедшие после ALTER TABLE, встают в очередь позади него, потому что PostgreSQL соблюдает порядок поступления запросов на одну и ту же блокировку — обходить очередь нельзя."
    recommendation: "Прочитать про паттерн безопасных миграций на больших таблицах (короткий lock_timeout плюс автоматический ретрай с бэкоффом) — это стандартная практика для инструментов вроде strong_migrations."
    difficulty: hard
    topics: [locking, migrations]

  # ── DDL ──────────────────────────────────────────────────────────────────

  - id: q20
    text: "Какую блокировку берёт `CREATE INDEX` без `CONCURRENTLY`?"
    type: single
    options:
      - id: a
        text: "Никакую — построение индекса всегда идёт в фоновом режиме без блокировок"
        correct: false
        explanation: "Фоновый режим без блокировок — это как раз то, что обеспечивает CONCURRENTLY; без него построение индекса идёт с явной блокировкой."
      - id: b
        text: "ROW EXCLUSIVE — блокируются только те строки, которые непосредственно изменяются"
        correct: false
        explanation: "ROW EXCLUSIVE — режим, который берут сами INSERT/UPDATE/DELETE; он конфликтует с блокировкой построения индекса, оставаясь при этом отдельным режимом."
      - id: c
        text: "SHARE — чтение продолжает работать, запись в таблицу блокируется до конца построения индекса"
        correct: true
        explanation: "SHARE конфликтует именно с ROW EXCLUSIVE, который берут INSERT/UPDATE/DELETE — поэтому запись встаёт, а обычное чтение продолжается."
      - id: d
        text: "ACCESS EXCLUSIVE — блокируется абсолютно всё, включая обычное чтение из таблицы"
        correct: false
        explanation: "ACCESS EXCLUSIVE — самый строгий режим, который берут операции вроде DROP TABLE, но не обычный CREATE INDEX — чтение он не трогает."
    explanation: "SHARE конфликтует с ROW EXCLUSIVE, который берут INSERT, UPDATE и DELETE — поэтому запись встаёт, а чтение продолжается. На таблице в десятки миллионов строк это минуты недоступности записи. CONCURRENTLY строит индекс двумя проходами без блокировки записи, но дольше, не может выполняться внутри транзакции и при сбое оставляет невалидный индекс."
    extended_explanation: "Невалидный индекс после сбоя CONCURRENTLY не удаляется автоматически — он остаётся в схеме с пометкой invalid и требует ручного `DROP INDEX` перед повторной попыткой, иначе повторный CREATE INDEX CONCURRENTLY на то же имя завершится ошибкой. В миграциях стоит проверить, что CONCURRENTLY используется на таблицах с одновременной записью: пропуск легко остаётся незамеченным до продакшена."
    recommendation: "Блокировки при DDL и построении индексов: режимы SHARE и ACCESS EXCLUSIVE, CREATE INDEX CONCURRENTLY и его ограничения."
    difficulty: hard
    topics: [locking, indexes]

  - id: q21
    text: "Почему `ALTER TABLE ... SET NOT NULL` на большой таблице опаснее добавления колонки со значением по умолчанию?"
    type: single
    options:
      - id: a
        text: "Требует полного пересоздания всех индексов, существующих на этой таблице"
        correct: false
        explanation: "Существующие индексы при добавлении NOT NULL не пересоздаются — они остаются валидными, операция проверяет только сами данные на отсутствие NULL."
      - id: b
        text: "Требует полного сканирования таблицы под ACCESS EXCLUSIVE, блокируя и чтение, и запись"
        correct: true
        explanation: "СУБД обязана убедиться, что NULL-значений нет, и делает это полным проходом под самой строгой блокировкой из доступных."
      - id: c
        text: "Приводит к полной перезаписи всей таблицы на диске построчно"
        correct: false
        explanation: "Добавление ограничения NOT NULL не переписывает физические данные таблицы — оно только проверяет их и меняет метаданные ограничения."
      - id: d
        text: "Не может быть откачен и в случае ошибки требует восстановления из резервной копии"
        correct: false
        explanation: "ALTER TABLE, как и любая DDL-операция в PostgreSQL, выполняется в транзакции и полностью откатывается при ROLLBACK — резервная копия здесь не нужна."
    explanation: "СУБД обязана убедиться, что NULL-ов нет, и делает это полным проходом, удерживая самую строгую блокировку. Безопасный путь в три шага: `ADD CONSTRAINT ... CHECK (col IS NOT NULL) NOT VALID`, затем `VALIDATE CONSTRAINT` под слабой блокировкой, и только потом переключение на NOT NULL. В современных версиях PostgreSQL добавление колонки с DEFAULT перезаписи не требует."
    extended_explanation: "PostgreSQL начиная с 12 версии способен опираться на уже провалидированный CHECK-констрейнт при последующем SET NOT NULL и пропускает повторное полное сканирование — но саму трёхшаговую последовательность всё равно нужно выполнять руками, автоматически это не происходит."
    recommendation: "Изучить полный трёхшаговый паттерн безопасного добавления NOT NULL из документации PostgreSQL — он же лежит в основе большинства линтеров безопасных миграций."
    difficulty: hard
    topics: [locking, migrations]

  - id: q22
    text: "Как избежать deadlock при массовом обновлении множества строк из нескольких параллельных процессов?"
    type: single
    options:
      - id: a
        text: "Захватывать строки в едином порядке во всём коде, например, всегда сортируя идентификаторы перед обновлением"
        correct: true
        explanation: "Deadlock возникает при встречном порядке захвата одних и тех же ресурсов — единый порядок делает цикл ожидания невозможным в принципе."
      - id: b
        text: "Перевести все транзакции, работающие с этими строками, на уровень изоляции SERIALIZABLE"
        correct: false
        explanation: "SERIALIZABLE не устраняет deadlock — он лишь заменяет один вид ошибки конфликта на другой, обязывая приложение ретраить транзакцию."
      - id: c
        text: "Обновлять строки по одной, каждую в собственной отдельной короткой транзакции"
        correct: false
        explanation: "Отдельные короткие транзакции убирают deadlock ценой потери атомарности всей операции — промежуточное состояние станет видно другим транзакциям."
      - id: d
        text: "Увеличить lock_timeout, чтобы конкурирующие транзакции успевали дождаться друг друга"
        correct: false
        explanation: "Взаимное ожидание при встречном порядке захвата не разрешится само по себе со временем — увеличение таймаута лишь отложит неизбежную ошибку."
    explanation: "Deadlock возникает при встречном порядке захвата: один процесс берёт строки 1, 2, другой — 2, 1. Единый порядок делает цикл невозможным. Увеличение таймаута не помогает — взаимное ожидание не разрешится со временем, а SERIALIZABLE лишь заменит один вид ошибок другим."
    extended_explanation: "Практический приём для батчевых обновлений: `SELECT ... FROM orders WHERE id = ANY(:ids) ORDER BY id FOR UPDATE` — сортировка идентификаторов перед захватом гарантирует единый порядок для всех параллельных процессов без ручного отслеживания. В коде массовых обновлений стоит искать неявный разный порядок обхода строк, например когда один процесс идёт по ID из одной таблицы, а другой по внешнему ключу из другой."
    recommendation: "Deadlock при массовых обновлениях: единый порядок захвата строк и ORDER BY в SELECT ... FOR UPDATE."
    difficulty: hard
    topics: [locking, concurrency]

  # ── Диагностика ──────────────────────────────────────────────────────────

  - id: q23
    text: "В логах появляется `canceling statement due to statement timeout ... while locking tuple`. О чём это говорит?"
    type: single
    options:
      - id: a
        text: "Запрос ждал блокировку строки и упёрся в общий таймаут выполнения, значит где-то есть долгая транзакция"
        correct: true
        explanation: "Фраза «while locking tuple» указывает именно на ожидание строчной блокировки, упёршееся в statement_timeout."
      - id: b
        text: "Произошёл deadlock, и СУБД автоматически сняла одну из конфликтующих транзакций"
        correct: false
        explanation: "При deadlock в логе стоит другая формулировка — «deadlock detected», без упоминания statement timeout."
      - id: c
        text: "В пуле соединений закончились свободные соединения, и запрос не смог его получить"
        correct: false
        explanation: "Нехватка соединений в пуле даёт совсем другое сообщение об ошибке, не связанное с блокировкой строки и статемент-таймаутом."
      - id: d
        text: "Строка, которую пытались заблокировать, была удалена другой транзакцией прямо во время ожидания"
        correct: false
        explanation: "Удаление строки во время ожидания дало бы другое поведение и сообщение — эта ошибка именно про истечение таймаута выполнения на ожидании блокировки."
    explanation: "Фраза «while locking tuple» указывает на ожидание строчной блокировки, а не на медленный запрос сам по себе. Искать нужно не этот запрос, а того, кто держит строку: обычно долгая транзакция, зависшая в idle in transaction. При deadlock сообщение было бы другим — `deadlock detected`."
    extended_explanation: "Быстрый способ найти держателя строки прямо во время инцидента: `SELECT pid, state, xact_start, query FROM pg_stat_activity WHERE state = 'idle in transaction' ORDER BY xact_start;` — самая старая такая сессия обычно и есть виновник. Полезно завести алерт на сессии в состоянии idle in transaction дольше нескольких минут: так проблема ловится до появления сообщений в логах."
    recommendation: "Диагностика ожиданий блокировок: pg_stat_activity, idle in transaction и сообщения в логах PostgreSQL."
    difficulty: hard
    topics: [locking, operations]

  - id: q24
    text: "Обработчик сообщений падает с `unable to acquire advisory lock`. Что это означает и что делать?"
    type: single
    options:
      - id: a
        text: "Ключ уже занят другим обработчиком, сообщение стоит отправить в повтор с задержкой"
        correct: true
        explanation: "Ошибка возникает при использовании try-варианта: ключ занят, значит эту же сущность прямо сейчас обрабатывает кто-то другой."
      - id: b
        text: "Превышен общий лимит одновременно удерживаемых advisory-локов в PostgreSQL"
        correct: false
        explanation: "У advisory locks нет отдельного жёсткого лимита количества, отличного от общего лимита блокировок сервера — это не типичная причина такой ошибки."
      - id: c
        text: "Соединение с базой было потеряно, и требуется полное переподключение"
        correct: false
        explanation: "Обрыв соединения даёт совсем другую ошибку уровня сети или драйвера, отличную от сообщения про невозможность захвата advisory lock."
      - id: d
        text: "Ключ блокировки повреждён в базе и требует ручного пересоздания перед следующей попыткой"
        correct: false
        explanation: "Advisory-ключ — не хранимая структура данных, а просто число, вычисляемое на лету; «повредиться» ему негде и не в чем."
    explanation: "Ошибка возникает при использовании try-варианта: ключ занят, значит эту же сущность прямо сейчас обрабатывает кто-то другой. Правильная реакция — повтор с задержкой, а не пометка сообщения как сбойного. Тревожный признак — если такие ошибки идут потоком и не расходятся: тогда стоит проверить, не завис ли лок на соединении, вернувшемся в пул."
    extended_explanation: "Настойчивая занятость одного и того же ключа дольше ожидаемого времени обработки — верный признак того, что где-то advisory lock не был снят штатно, например из-за использования session-level варианта через PgBouncer в transaction pooling. Стоит добавить метрику числа таких ошибок на ключ за единицу времени: резкий рост сигнализирует о застрявшем локе раньше, чем задержка очереди."
    recommendation: "Advisory locks в обработчиках сообщений: повтор с задержкой при занятом ключе и признаки застрявшего лока."
    difficulty: hard
    topics: [locking, messaging]

  - id: q25
    text: "`ON UPDATE CASCADE` во внешнем ключе — это механизм блокировок?"
    type: single
    options:
      - id: a
        text: "Нет, но это способ намеренно отключить блокировки строк при каскадном обновлении"
        correct: false
        explanation: "ON UPDATE CASCADE не отключает и не заменяет блокировки — дочерние строки по-прежнему блокируются при их фактическом обновлении."
      - id: b
        text: "Да, это механизм явной блокировки дочерних строк на время обновления родительской"
        correct: false
        explanation: "Это поведение ссылочной целостности: конструкция определяет, что произойдёт со ссылками при изменении родителя, оставаясь в стороне от механики явных блокировок."
      - id: c
        text: "Нет, это поведение при изменении родительского ключа, с FOR UPDATE его роднит только созвучие названий"
        correct: true
        explanation: "ON UPDATE CASCADE относится к ссылочной целостности: изменился родительский ключ — обновились дочерние ссылки. Путают из-за похожести на FOR UPDATE, где речь именно о захвате."
      - id: d
        text: "Да, это одна из разновидностей оптимистичной блокировки, построенная на внешнем ключе"
        correct: false
        explanation: "Оптимистичная блокировка строится на явной проверке версии в WHERE — ON UPDATE CASCADE к ней не относится, это чистая ссылочная целостность."
    explanation: "ON UPDATE CASCADE относится к ссылочной целостности: изменился родительский ключ — обновились дочерние ссылки. Косвенная связь с блокировками есть, поскольку каскад порождает изменения дочерних строк и захватывает их. Но это следствие, а не назначение. Путают из-за похожести на FOR UPDATE, где речь именно о захвате."
    extended_explanation: "Практическое следствие путаницы: массовое каскадное обновление по внешнему ключу с ON UPDATE CASCADE способно неожиданно заблокировать много дочерних строк разом — не потому, что это «механизм блокировки», а просто как побочный эффект множества обычных UPDATE внутри одной транзакции. В схеме стоит проверить, на каких внешних ключах стоит ON UPDATE CASCADE, и оценить объём дочерних строк, которые заблокируются при обновлении часто меняющегося родителя."
    recommendation: "Ссылочная целостность и каскадные действия во внешних ключах (ON UPDATE CASCADE, ON DELETE CASCADE) и их побочные блокировки."
    difficulty: medium
    topics: [locking, schema]
