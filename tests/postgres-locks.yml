  # ── Зависшие локи и таймауты ─────────────────────────────────────────────

  - id: q17
    text: "Транзакция взяла блокировку и зависла, не закоммитившись. Чем это отличается от deadlock?"
    type: single
    options:
      - id: a
        text: "Deadlock возникает только между двумя транзакциями, а зависший лок — только при трёх и более"
        correct: false
        explanation: "Deadlock возможен и в цикле из трёх и более транзакций, а зависший лок — с любым числом ждущих начиная с одного; число участников их не различает."
      - id: b
        text: "Разницы по сути нет, это просто два разных названия одной и той же ситуации"
        correct: false
        explanation: "Это разные ситуации по механике: у deadlock есть цикл взаимного ожидания, который PostgreSQL обнаруживает и разрывает, а у зависшего лока цикла нет."
      - id: c
        text: "Deadlock касается только строчных блокировок, а зависание бывает исключительно с advisory-локами"
        correct: false
        explanation: "Deadlock может возникнуть на любом типе блокировок, включая advisory, а зависнуть может держатель любой блокировки — привязки к типу нет."
      - id: d
        text: "Deadlock СУБД обнаруживает и снимает автоматически, а зависший лок не разрешается сам"
        correct: true
        explanation: "PostgreSQL находит цикл взаимного ожидания и прерывает одну из транзакций сам; односторонне зависший держатель разрешить ситуацию некому."
    explanation: "Deadlock — взаимное ожидание, замкнутый цикл: PostgreSQL находит его и убивает одну транзакцию с ошибкой `deadlock detected`. Зависший лок — односторонняя ситуация: держатель просто ничего не делает, ждущие стоят бесконечно, и разрешать нечего. Отсюда `lock_timeout` — ждущий должен уметь сдаться сам."
    extended_explanation: "PostgreSQL проверяет граф ожиданий на циклы не постоянно, а по таймеру `deadlock_timeout` (по умолчанию 1 секунда) — именно поэтому обнаружение deadlock не мгновенно, а с небольшой задержкой после фактического взаимного ожидания. Разницу нагляднее всего увидеть на модели: открыть транзакцию в одной сессии psql без коммита и понаблюдать за ожиданием во второй."
    recommendation: "Deadlock и зависшие блокировки: цикл ожидания, его обнаружение (deadlock_timeout) и односторонняя блокировка долгой транзакцией."
    difficulty: hard
    topics: [locking, concurrency]

  - id: q18
    text: "Что делает `SET lock_timeout = '2s'`?"
