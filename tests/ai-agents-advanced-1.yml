    explanation: "Скорость прогона существующих тестов не создаёт прямого стимула писать больше новых тестов — эффект здесь про частоту действия (коммитов), а не про объём тестового покрытия."
  - id: b
    text: "Ничего больше не меняется — эффект исчерпывается сэкономленным временем ожидания на каждом отдельном прогоне"
    correct: false
    explanation: "Это как раз пример эффекта, выходящего за пределы простой арифметической экономии времени — меняется сам паттерн поведения, а не только длительность отдельного ожидания."
  - id: c
    text: "Растёт частота коммитов — разработчики начинают коммитить чаще и мельче, потому что психологический порог для самого действия исчез"
    correct: true
    explanation: "Когда стоимость действия падает, его не просто выполняют быстрее — его начинают выполнять чаще: люди не откладывают коммит до накопления крупной пачки изменений, раз проверка больше не создаёт заметного трения."
  - id: d
    text: "Количество багов в продакшене становится равным нулю"
    correct: false
    explanation: "Ускорение CI не гарантирует отсутствия багов — оно меняет частоту итераций разработки, а не полностью устраняет ошибки."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Это пример эффекта, при котором снижение стоимости действия меняет не только время, но и частоту, с которой люди вообще берутся его выполнять — тот же механизм применим и к AI-агентам, выполняющим рутинные проверки: если действие подешевело на порядок, ожидаемый эффект не пропорциональная экономия времени, а рост частоты обращения к нему."
  extended_explanation: "Это устоявшийся эффект за пределами разработки: снижение стоимости ресурса нередко приводит не к пропорциональной экономии, а к росту частоты его использования — тот же принцип объясняет, почему дешёвые и быстрые проверки меняют поведение людей сильнее, чем можно было бы предположить по одной только экономии времени на эпизод."
  recommendation: "Сравнить аддитивный эффект («сэкономили X минут на одном прогоне») со структурным («изменился сам паттерн работы») на примере ускорения CI."

- id: q16
  text: "До внедрения автоформаттера и линтера в CI ревьюеры частично тратили время на замечания по стилю кода — отступы, порядок импортов, именование. После того как эти проверки стали автоматическими и мгновенными, ревью сместилось почти полностью на логику и архитектуру решения. Как правильнее описать этот эффект?"
  type: single
  options:
  - id: a
    text: "Это чисто количественный эффект: число ревью выросло пропорционально сэкономленному времени"
    correct: false
    explanation: "Описанный эффект — про смещение фокуса внутри уже существующих ревью, а не про рост их общего количества."
  - id: b
    text: "Аддитивная экономия — просто на каждом ревью стало на фиксированное количество минут меньше"
    correct: false
    explanation: "Аддитивная экономия описывала бы только сокращение времени при том же самом распределении внимания — здесь же изменилось, на что вообще направлено внимание ревьюера."
  - id: c
    text: "Эффект нейтрален — автоматизация стиля никак не связана с тем, на что ревьюеры тратят оставшееся время"
    correct: false
    explanation: "Освободившееся время и внимание не исчезают бесследно — они перераспределяются на то, что раньше было вторично из-за ограниченности ресурса ревьюера."
  - id: d
    text: "Структурный сдвиг — изменился сам предмет ревью, а не просто сэкономлено фиксированное время на каждом отдельном пул-реквесте"
    correct: true
    explanation: "Это не аддитивная экономия («на каждом PR стало на X минут меньше замечаний по стилю»), а структурная — сам фокус проверки переместился на то, что раньше было менее приоритетно из-за нехватки времени."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Аддитивная и структурная экономия — разные типы эффекта: аддитивная предсказуема и складывается из сэкономленного времени на отдельных эпизодах, структурная — про изменение самого поведения людей, потому что барьер для определённого типа действия (здесь — тщательная проверка стиля) исчез, и высвободившееся внимание закономерно перетекает туда, где раньше не хватало ресурса."
  extended_explanation: "Тот же принцип применим к рутинным проверкам, которые выполняют AI-агенты: если агент берёт на себя стабильно повторяющуюся, но затратную по времени часть работы, освободившееся внимание команды закономерно смещается на менее формализуемые и более содержательные задачи, а не просто исчезает как сэкономленное время."
  recommendation: "Сравнить эффект автоформаттеров в CI с любой другой автоматизацией рутинной проверки — где ещё высвобождённое внимание меняет предмет работы, а не просто её длительность."

- id: q17
  text: "Команда считает успехом внедрения AI-инструментов в разработку рост частоты вызовов агента и объёма обработанных им данных. В чём риск такого подхода к оценке результата?"
  type: single
  options:
  - id: a
    text: "Показатель использования подменяет собой цель, которую он должен был отражать — проблемы могут не находиться раньше, даже если агент вызывается чаще"
    correct: true
    explanation: "Если оптимизировать сам факт использования инструмента, а не итоговый результат (раньше находятся проблемы, меньше инцидентов), метрика начинает жить отдельной жизнью от того, что изначально хотели улучшить."
  - id: b
    text: "Риск чисто финансовый — более частые вызовы агента увеличивают расходы на инфраструктуру"
    correct: false
    explanation: "Финансовая сторона реальна, но не в ней суть риска — дело в том, что сама метрика перестаёт отражать полезность инструмента, а не только в её стоимости."
  - id: c
    text: "Риска нет — чем чаще вызывается агент, тем полезнее он для команды по определению"
    correct: false
    explanation: "Частота использования сама по себе не гарантирует пользы — можно вызывать агента часто и при этом не находить проблемы раньше, чем находили без него."
  - id: d
    text: "Риск в том, что рост частоты вызовов неизбежно увеличивает задержку ответа и нагрузку на инфраструктуру провайдера модели"
    correct: false
    explanation: "Рост задержки при масштабировании — реальный инженерный риск, но это операционная проблема пропускной способности, а не причина, по которой сама метрика «частота вызовов» перестаёт отражать пользу инструмента для команды."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Это мягкая форма известного эффекта: любая метрика, начатая использоваться как самоцель вместо индикатора, рискует разойтись с реальным результатом, который она должна была отслеживать. Число вызовов агента — удобная для измерения прокси-метрика, но не то же самое, что реальная польза от его применения."
  extended_explanation: "Тот же паттерн встречается и вне AI: число проведённых код-ревью вместо их качества, число написанных тестов вместо реального покрытия сценариев — во всех случаях легко измеримый показатель активности подменяет собой труднее измеримую, но содержательную цель."
  recommendation: "Прочитать про эффект подмены цели показателем (Goodhart's law) — общий принцип, применимый far beyond AI-инструментов."

- id: q18
  text: "Разница между «агент сэкономил команде время на конкретной разовой задаче» и «агент изменил, как часто команда вообще берётся за определённый тип задачи» — в чём она заключается практически?"
  type: single
  options:
  - id: a
    text: "Это два названия совершенно одного и того же эффекта, которые различаются между собой только формулировкой и стилем описания"
    correct: false
    explanation: "Эффекты качественно разные: один предсказуем и аддитивен, другой проявляется только через изменение поведения со временем и не сводится к простой арифметике."
  - id: b
    text: "Первое — разовый, предсказуемый эффект; второе — накопительный эффект, при котором меняется само поведение людей из-за исчезновения барьера для действия"
    correct: true
    explanation: "Разовая экономия — это фиксированное время на одном эпизоде, которое складывается арифметически и легко подсчитывается заранее; изменение частоты действия — эффект, который проявляется только со временем и не сводится к сумме сэкономленных минут."
  - id: c
    text: "Второй эффект применим исключительно к менеджерским задачам вроде отчётности, тогда как первый касается только чисто инженерной работы с кодом"
    correct: false
    explanation: "Оба типа эффекта применимы к любой задаче, где стоимость действия существенно снижается — разделение не по типу задачи, а по характеру самого эффекта."
  - id: d
    text: "Второй эффект в принципе возникает только при использовании именно AI-агентов, тогда как для обычной, не связанной с AI автоматизации характерен только первый"
    correct: false
    explanation: "Изменение частоты действия — общий эффект снижения стоимости, наблюдаемый и в обычной автоматизации (например, в ускорении CI), не специфика именно AI-инструментов."
  difficulty: hard
  topics: [ai_agents]
  explanation: "Ключевое различие — предсказуемость и способ накопления эффекта: разовая экономия времени линейна и легко считается заранее, а изменение частоты действия проявляется только на дистанции, когда снижение барьера меняет само поведение людей, а не просто ускоряет уже привычные действия."
  extended_explanation: "Практическое следствие для оценки пользы AI-инструментов: считать только сэкономленное время на отдельных задачах — заведомо недооценивать реальный эффект, если инструмент к тому же снижает барьер для действий, которые раньше выполнялись реже, чем стоило бы."
  recommendation: "При оценке пользы автоматизации разделять два вопроса: «сколько времени сэкономлено на задаче» и «изменилась ли частота, с которой задача вообще выполняется»."

- id: q19
  text: "Агент-Документатор по итогам решённой задачи пишет или обновляет переиспользуемую инструкцию для будущих похожих случаев. Какая роль из уже рассмотренных логически предшествует этой — то есть должна была отработать до того, как Документатор сможет написать содержательную инструкцию?"
  type: single
  options:
  - id: a
    text: "Оркестратор — без предварительного распределения подзадач невозможно ничего задокументировать"
    correct: false
    explanation: "Оркестратор нужен для координации нескольких параллельных агентов — задача из вопроса не требует такой координации, чтобы прийти к документируемому результату."
  - id: b
    text: "QA-агент — только после независимой проверки результата понятно, что решение вообще было верным и достойным фиксации"
    correct: false
    explanation: "Проверка QA подтверждает корректность результата, но материал для инструкции — это опыт самого процесса решения (шаги, ошибки, обходные пути), а не факт прохождения финальной проверки; QA не обязателен, чтобы было что документировать."
  - id: c
    text: "Исполнитель — именно он прошёл через решение конкретной задачи, набив шишки, которые и стоит зафиксировать в инструкции"
    correct: true
    explanation: "Документатор фиксирует опыт уже решённой задачи (Worker в терминологии этого теста) — без предварительного прохождения через реальное решение, включая ошибки по пути, нечего было бы фиксировать содержательно."
  - id: d
    text: "Ни одна роль не предшествует — Документатор может написать инструкцию, не опираясь на предшествующий опыт решения задачи"
    correct: false
    explanation: "Без опыта прохождения через реальную задачу инструкция потеряла бы главную ценность — конкретные места, «где можно воткнуться», которые и делают её полезной для будущих случаев."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Роль Документатора логически идёт после роли Исполнителя: именно опыт реального решения задачи, включая ошибки по пути, даёт материал для содержательной инструкции — фиксация «как делать правильно» и «где можно оступиться» без предварительного прохождения через задачу была бы абстрактной и малополезной."
  extended_explanation: "Это прямое пересечение с практикой переиспользуемых инструкций: инструкция обычно появляется именно по итогам решённой задачи, а не пишется заранее в отрыве от практического опыта — что отличает её от общей документации, написанной по плану, а не по факту столкновения с реальными трудностями."
  recommendation: "Проследить связь между ролью Исполнителя (набивающего реальный опыт) и ролью Документатора (фиксирующего этот опыт для будущих случаев)."

- id: q20
  text: "Почему разделение ролей между агентами (например, Исполнитель и Ревьюер) называют разделением контекстов, а не просто использованием разных, более специализированных моделей?"
  type: single
  options:
  - id: a
    text: "Потому что разделение контекстов дешевле по стоимости токенов, чем использование одной модели для всех ролей"
    correct: false
    explanation: "Стоимость может быть выше или ниже в зависимости от сценария — экономический аргумент не является причиной самого разделения ролей, причина в качестве результата."
  - id: b
    text: "Потому что каждая роль технически обязана использовать модель другого поставщика"
    correct: false
    explanation: "Нет такого технического требования — разные роли вполне могут работать на одной и той же модели, разница именно в независимости контекста, а не в происхождении модели."
  - id: c
    text: "Потому что более специализированные модели физически не способны выполнять несколько ролей одновременно"
    correct: false
    explanation: "Одна и та же модель может быть вызвана в разных ролях в разных прогонах — ограничение не техническое, оно про то, что полезно для качества результата (независимость взгляда), а не про физическую неспособность."
  - id: d
    text: "Ревьюер полезен именно потому, что не видел процесс написания кода — независимый контекст даёт свежий взгляд, а не более мощная модель"
    correct: true
    explanation: "Практическая ценность разделения ролей — в отсутствии у одного агента знания о ходе рассуждений другого, что и даёт объективность проверки; для этого не нужна другая модель, достаточно отдельного, независимого контекстного окна."
  difficulty: hard
  topics: [ai_agents]
  explanation: "Разделение ролей агентов — это разделение установок и независимых контекстных окон, не обязательно разных моделей: тот же принцип, что и с QA-агентом, которого иногда намеренно держат в неведении деталей реализации, чтобы не унаследовать слепые пятна автора кода — ценность в независимости взгляда, а не в отдельной, более мощной модели под каждую роль."
  extended_explanation: "Это прямое продолжение subagent-паттерна: отдельный вызов модели с собственным независимым контекстным окном для решения подзадачи ценен именно изоляцией контекста от родительского процесса рассуждения, а не тем, что использует принципиально другую модель."
  recommendation: "Сравнить эффект независимого контекста (subagent, отдельный ревьюер) с гипотетическим эффектом просто более мощной модели той же роли — на практике это разные оси улучшения."
