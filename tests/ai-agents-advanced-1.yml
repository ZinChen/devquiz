    explanation: "Ценность MCP как раз в обратном — один и тот же клиент подключается к любому MCP-серверу одинаково, без специфичной под конкретный сервис обёртки, в отличие от прямой интеграции через REST API каждого сервиса отдельно."
  - id: c
