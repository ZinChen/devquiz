    correct: false
    explanation: "Названия ролей здесь перепутаны местами: именно Manager решает, что важно и когда работа готова, а Оркестратор занимается механическим распределением — и Red team действует враждебно к системе, а не добросовестно, как QA."
  - id: b
    text: "Оркестратор механически распределяет подзадачи между другими агентами и собирает результат; Manager решает, что приоритетно и когда работа действительно готова; Red team намеренно враждебен к системе; QA добросовестно проверяет соответствие исходному намерению"
    correct: true
    explanation: "Четыре разные роли: Оркестратор и Manager оба координируют работу, но Оркестратор делает это механически («разбить и собрать»), а Manager — целенаправленно («решить, что важно»); Red team и QA оба проверяют результат, но с разной установкой — враждебной или добросовестной."
  - id: c
    text: "Red team пишет код за исполнителя, если тот не справился с задачей; QA только придумывает тест-кейсы на бумаге, никогда не запуская их"
    correct: false
    explanation: "Red team не про написание кода, а про намеренный поиск уязвимостей; QA обычно и пишет, и запускает тесты, а не только формулирует их."
  - id: d
    text: "QA и Red team отличаются только тем, что QA проверяет фронтенд, а Red team — бэкенд системы"
    correct: false
    explanation: "Разделение между этими ролями идёт по установке (добросовестная проверка против враждебного поиска обхода), а не по слою системы — обе роли в принципе могут проверять любую часть кода, разница не в том, что именно проверяется, а в том, с каким намерением."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Разделение ролей агентов — это разделение установок и контекстов, а не разных моделей: Manager отличается от Оркестратора не мощностью, а тем, что решает, что вообще важно делать, а не просто маршрутизирует уже поставленные подзадачи."
  extended_explanation: "Похожее устройство встречается в мультиагентных фреймворках вроде AutoGen или CrewAI, где роли назначаются явно через системный промпт каждого агента — сам механизм тот же, что делает subagent полезным: независимый контекст и чётко очерченная задача."
  recommendation: "Сравнить документацию по ролям агентов в любом мультиагентном фреймворке (AutoGen, CrewAI) — обычно там явно разводятся координация и целеполагание."

- id: q7
  text: "Агенту поручили провести обычное код-ревью пул-реквеста. Почему такое задание типично не находит SQL-инъекцию или обход авторизации, даже если сама модель в целом достаточно компетентна?"
  type: single
  options:
  - id: a
    text: "SQL-инъекции и обход авторизации в принципе можно найти только специализированным статическим анализатором, а не языковой моделью"
    correct: false
    explanation: "Специализированные статические анализаторы полезны, но не единственный инструмент — суть в постановке задачи агенту, а не в принципиальной невозможности анализа моделью."
  - id: b
    text: "Модель физически не способна анализировать код на предмет security-уязвимостей, вне зависимости от того, как поставлена задача"
    correct: false
    explanation: "Дело не в возможностях модели — та же модель в роли security-ревьюера с соответствующей постановкой задачи вполне способна находить такие проблемы."
  - id: c
    text: "Обычное ревью работает в режиме «соответствует ли код намерению автора» — добросовестная проверка в рамках заявленной цели, а не враждебный поиск способа обойти систему"
    correct: true
    explanation: "Для поиска security-уязвимостей нужна отдельная, явно поставленная роль (adversarial/red team), которая действует независимо от намерения автора и специально ищет способ заставить систему сделать недопустимое."
  - id: d
    text: "Ревью пул-реквеста в принципе не предполагает чтения самого кода изменений, только текстового описания в заголовке"
    correct: false
    explanation: "Обычное код-ревью как раз читает сам код — проблема не в этом, а в установке, с которой его читают."
  difficulty: hard
  topics: [ai_agents]
  explanation: "Ревьюер и взломщик (red team) — разные режимы мышления: ревьюер добросовестно проверяет соответствие результата заявленной цели автора, взломщик действует враждебно к системе независимо от намерения, специально пытаясь найти обход. Одна и та же модель в разной роли даёт разный результат именно из-за разной установки задачи."
  extended_explanation: "На практике это причина, почему security-аудит выделяют в отдельный процесс или отдельного агента с явно поставленной adversarial-задачей, а не рассчитывают, что обычное код-ревью попутно найдёт уязвимости — роль определяет, что агент вообще ищет."
  recommendation: "Сравнить формулировку задачи для обычного код-ревью и для security-аудита — разница в постановке, не в модели."

