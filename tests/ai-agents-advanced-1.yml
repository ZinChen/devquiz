  extended_explanation: "Следующий человек, берущий похожую задачу, обычно не читает такую инструкцию сам — просто описывает задачу агенту, и агент сам находит подходящую инструкцию в репозитории и опирается на неё, явно разделяя, какую часть работы берёт на себя, а какую оставляет инженеру."
