    correct: true
    explanation: "MCP-сервер описывает набор доступных операций и данных в одном стандартном формате, и агент подключается к любому такому серверу одинаково, не разбираясь в деталях его внутренней реализации."
  - id: d
    text: "MCP — это SDK для дообучения модели под конкретный набор инструментов компании"
    correct: false
    explanation: "MCP не про обучение модели — это протокол интеграции этапа инференса, работающий с уже готовой моделью, без изменения её весов."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Ценность MCP — не в самом факте связи с внешней системой (это было возможно и без протокола), а в унификации: один стандартный способ описания инструментов и данных, к которому агент подключается одинаково, вместо отдельной кастомной интеграции под каждый сервис."
  extended_explanation: "MCP-сервер может предоставлять агенту и операции (инструменты, которые можно вызвать — например, создать задачу в трекере), и ресурсы (данные, которые можно прочитать — например, содержимое базы знаний), в одном общем формате описания."
  recommendation: "Посмотреть спецификацию Model Context Protocol и сравнить с прямой кастомной интеграцией через отдельный SDK каждого сервиса."

- id: q4
  text: "Чем RAG (Retrieval-Augmented Generation) принципиально отличается от простого увеличения размера контекстного окна модели?"
  type: single
  options:
  - id: a
    text: "RAG требует переобучения самой модели под каждый новый корпус документов"
    correct: false
    explanation: "RAG не переобучает модель — индекс строится отдельно от весов модели и обновляется независимо от неё."
  - id: b
    text: "Это два названия одной и той же техники, разница чисто маркетинговая"
    correct: false
    explanation: "Механика принципиально разная: статичное включение всего текста заранее против динамического поиска релевантных фрагментов под конкретный запрос."
  - id: c
    text: "RAG работает только с изображениями, а большое контекстное окно — только с текстом"
    correct: false
    explanation: "RAG применяется прежде всего к текстовому и табличному знанию — привязки к типу данных «только изображения» у техники нет."
  - id: d
    text: "RAG динамически подбирает конкретные фрагменты под конкретный запрос из корпуса, который целиком не поместился бы в окно"
    correct: true
    explanation: "Большое окно вмещает статично весь заранее выбранный человеком текст, а RAG на каждый новый запрос заново решает, какие именно фрагменты подставить, из потенциально намного большего корпуса."
  difficulty: medium
  topics: [ai_agents]
  explanation: "Базовая механика RAG: источник заранее разбивается на фрагменты (chunking), для каждого фрагмента считается векторное представление (embedding); в момент запроса релевантные фрагменты находятся поиском по смысловой близости и подставляются в контекст вместе с вопросом — то есть выбор текста происходит динамически, под конкретный запрос."
  extended_explanation: "Ключевая практическая уязвимость RAG — качество ответа целиком зависит от качества retrieval: если нужный фрагмент не нашёлся (низкая релевантность поиска, неудачное разбиение на chunks), модель не может использовать факт, которого не было подставлено в контекст, даже если он физически присутствует в индексируемых данных."
  recommendation: "Изучить базовый пайплайн RAG: chunking → embedding → векторный поиск → подстановка в контекст — и типичные точки отказа в каждом шаге."

- id: q5
  text: "RAG-система уверенно отвечает неточно на вопрос, хотя нужный факт точно присутствует в исходных документах, из которых построен индекс. Где вероятнее всего находится проблема?"
  type: single
  options:
  - id: a
    text: "На шаге retrieval — нужный фрагмент не был найден при поиске и не попал в контекст модели"
    correct: true
    explanation: "Модель не может «вспомнить» факт, которого нет в её обучающих данных и который не был подставлен в контекст — плохая релевантность поиска или неудачное разбиение документа на фрагменты обрывает нужную информацию до того, как она дойдёт до модели."
  - id: b
    text: "Модель устарела, и её нужно переобучить на новых данных"
    correct: false
    explanation: "Смысл RAG именно в том, чтобы не требовать переобучения модели под каждое новое знание — проблема почти всегда в retrieval, а не в самих весах модели."
  - id: c
    text: "Документ слишком новый, и модель ещё не успела с ним ознакомиться"
    correct: false
    explanation: "RAG не полагается на то, что модель «знает» документ заранее — факт должен быть подставлен в контекст именно через retrieval на момент запроса, а не через предварительное обучение."
  - id: d
    text: "Вопрос был задан на другом языке, чем документы в индексе"
    correct: false
    explanation: "Языковое расхождение — лишь один из множества возможных факторов, а не типовая или наиболее вероятная причина в общем случае."
  difficulty: hard
  topics: [ai_agents]
  explanation: "Качество RAG-ответа целиком зависит от качества retrieval-шага, а не только от самой модели: если релевантный фрагмент не был найден поиском по смысловой близости, модель отвечает без него, даже когда факт физически есть в базе документов."
  extended_explanation: "Типичные причины провала retrieval — неудачное разбиение документа на фрагменты (нужный факт оказался разорван между двумя chunks), низкое качество embedding-модели для конкретного домена, или слишком узкий top-k (число возвращаемых фрагментов) поиска."
  recommendation: "Прочитать про диагностику RAG-систем: как отличить проблему генерации (модель) от проблемы поиска (retrieval)."

- id: q6
