    explanation: "YJIT (включается через `RUBY_YJIT_ENABLE`, проверяется `RubyVM::YJIT.enabled?`) компилирует часто исполняемый код в машинный. Выгода видна на веб-серверах, которые живут часами. На короткой задаче — скажем, прогоне юнит-тестов на несколько секунд — прогрев и компиляция могут стоить дороже самой экономии, и время вырастет в разы. Это контринтуитивно, но проверяется замером."
    extended_explanation: "Метрики прогрева доступны через `RubyVM::YJIT.runtime_stats` — там видно число скомпилированных блоков и долю попаданий в них, что позволяет на реальном сервере проверить, действительно ли YJIT успевает прогреться за типичное время жизни процесса, прежде чем включать его в проде. Один и тот же бенчмарк стоит замерить с `RUBY_YJIT_ENABLE=1` и без: короткий и длинный прогон дают противоположный результат."
