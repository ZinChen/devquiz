slug: gems-and-libs
title: "Гемы и библиотеки: для чего нужен"
description: "Узнать библиотеку по названию и вспомнить, за что она отвечает. Проверка кругозора по экосистеме Ruby и соседним инструментам — без кода."
tags: [ruby, gems, trivia, claude-gen]
difficulty: advanced
estimated_time: 20

questions:
  - id: q1
    text: "За что отвечает гем `pundit`?"
    type: single
    options:
      - id: a
        text: "Аутентификация — вход по логину и паролю, сессии, восстановление пароля"
        correct: false
        explanation: "Эту задачу в Rails-экосистеме закрывает devise или sorcery — pundit с проверкой личности не работает вовсе."
      - id: b
        text: "Аудит изменений моделей приложения с хранением истории версий"
        correct: false
        explanation: "Историю версий объектов хранит paper_trail — отдельная задача, не пересекающаяся с проверкой прав."
      - id: c
        text: "Валидация входящих параметров контроллера по заданной схеме"
        correct: false
        explanation: "Схемами параметров занимаются strong parameters Rails или гемы вроде dry-validation — pundit к структуре запроса не притрагивается."
      - id: d
        text: "Авторизация пользователей при выполнении действий над объектами приложения"
        correct: true
        explanation: "Pundit строит авторизацию через policy-классы: `PostPolicy#update?` отвечает на вопрос «можно ли этому пользователю править этот пост»."
    explanation: "Pundit — авторизация через policy-классы: `PostPolicy#update?` отвечает на вопрос «можно ли этому пользователю править этот пост». Аутентификацией (вариант a) занимается devise — это разные задачи: аутентификация про «кто ты», авторизация про «что тебе можно»."
    extended_explanation: "У каждой policy есть парный `Scope` — класс, который фильтрует коллекцию под текущего пользователя (`PostPolicy::Scope.new(user, Post.all).resolve`), а не только проверяет доступ к одному объекту. Конкурент в той же нише — cancancan, с единым файлом правил `Ability` вместо класса на модель. Разницу полезно разобрать на связке devise + pundit в типовом Rails-приложении."
    recommendation: "Аутентификация и авторизация в Rails: devise и pundit, policy-классы и scope, сравнение с cancancan."
    difficulty: easy
    topics: [security, architecture]

  - id: q2
    text: "Что делает гем `bullet`?"
    type: single
    options:
      - id: a
        text: "Находит N+1 запросы и лишний eager loading"
        correct: true
        explanation: "Bullet подключается к ActiveRecord и в dev-окружении ловит ровно два паттерна: отсутствующий `includes` и избыточный `includes`, который ничего не экономит."
      - id: b
        text: "Ускоряет загрузку приложения за счёт кэширования автозагрузки"
        correct: false
        explanation: "Кэш автозагрузки классов — часть самого Zeitwerk, встроенного в Rails; отдельный гем для этого не нужен."
      - id: c
        text: "Профилирует потребление памяти по объектам"
        correct: false
        explanation: "Память по объектам показывает memory_profiler или derailed_benchmarks — bullet с памятью вообще не работает."
      - id: d
        text: "Ищет уязвимости в коде приложения статическим анализом"
        correct: false
        explanation: "Статический анализ безопасности — задача brakeman, у которого даже общего кода с bullet нет."
    explanation: "Bullet следит за запросами в dev-окружении и ругается: «здесь нужен includes» или «здесь includes лишний». Статический анализ безопасности (вариант d) — это brakeman. Оба ставят в dev/test-группу Gemfile, поэтому их часто путают."
    extended_explanation: "Предупреждения bullet можно направить не только в консоль браузера, но и в лог приложения или в Slack через `Bullet.rails_logger = true` — удобно, когда N+1 всплывает не на деве, а на стейджинге под реальными данными. Стоит прогнать bullet на реальном контроллере с вложенными ассоциациями и сравнить вывод до и после `includes`."
    recommendation: "Проблема N+1 и eager loading в ActiveRecord: как её находят и устраняют."
    difficulty: easy
    topics: [performance, queries]

  - id: q3
    text: "Для чего нужен `sidekiq`?"
    type: single
    options:
      - id: a
        text: "Оркестрация зависимых задач в виде графа с ретраями и бэкфиллами"
        correct: false
        explanation: "Граф зависимостей, бэкфиллы и повторные прогоны за прошлые даты — область Airflow или Temporal; в базовом sidekiq таких понятий нет."
      - id: b
        text: "Пул соединений с базой данных для многопоточных приложений"
        correct: false
        explanation: "Пулом соединений к БД управляет ActiveRecord::ConnectionPool или внешний PgBouncer — к очередям задач это не относится."
      - id: c
        text: "Выполняет фоновые задачи в потоках-воркерах через очередь на Redis"
        correct: true
        explanation: "Sidekiq кладёт джобы в очередь Redis через `perform_async`, а пул потоков-воркеров разбирает их параллельно."
      - id: d
        text: "Планирование задач по расписанию вместо системного cron"
        correct: false
        explanation: "За расписание отвечает отдельный плагин поверх sidekiq — sidekiq-cron или sidekiq-scheduler, в базовой поставке его нет."
    explanation: "Sidekiq — фоновые задачи: `perform_async` кладёт джобу в Redis, воркер её забирает. Расписание — отдельный плагин (вариант d), в базовой поставке его нет. И это не оркестратор (вариант a): графа зависимостей между задачами тут нет — за этим идут в Airflow или Temporal."
    extended_explanation: "Количество потоков-воркеров задаётся `concurrency` в конфиге, а очередей с приоритетами может быть несколько (`critical`, `default`, `low`) — sidekiq разбирает их в заданном порядке, что позволяет не держать срочные письма в одной куче с массовой рассылкой. Документацию Sidekiq по очередям и приоритетам стоит посмотреть при проектировании задач разной срочности."
    recommendation: "Фоновые задачи в Rails: очереди на Redis, воркеры, приоритеты очередей, Sidekiq и его плагины."
    difficulty: easy
    topics: [background-jobs]

  - id: q4
    text: "Какая пара гемов решает ОДНУ и ту же задачу?"
    type: single
    options:
      - id: a
        text: "faker и factory_bot"
        correct: false
        explanation: "Это дополняющая пара: factory_bot строит объект по шаблону, faker подставляет в его поля правдоподобные значения."
      - id: b
        text: "kaminari и pagy"
        correct: true
        explanation: "Оба режут выдачу ActiveRecord на страницы с одинаковым набором возможностей — прямые конкуренты в одной нише."
      - id: c
        text: "rubocop и rspec"
        correct: false
        explanation: "Это разные этапы разработки: rubocop проверяет стиль кода статически, rspec запускает тесты и проверяет поведение."
      - id: d
        text: "puma и sidekiq"
        correct: false
        explanation: "Puma обслуживает HTTP-запросы, sidekiq выполняет фоновые задачи — один процесс редко делает оба дела одновременно."
    explanation: "Kaminari и pagy — пагинация, прямые конкуренты (pagy легче и быстрее). Остальные пары дополняют друг друга: factory_bot строит объекты, faker наполняет их правдоподобными значениями; rubocop — линтер, rspec — тесты; puma — веб-сервер, sidekiq — фоновые задачи."
    extended_explanation: "Разница в подходе заметна в API: kaminari добавляет `page`/`per` прямо в scope ActiveRecord, а pagy требует явного вызова `pagy(collection)` в контроллере — за счёт этого pagy не патчит ActiveRecord::Relation и меньше весит в рантайме. API kaminari и pagy полезно сравнить на одном и том же списке: разница в подключении объясняет разницу в производительности."
    recommendation: "Пагинация в Rails: kaminari и pagy, различия в API и стоимости."
    difficulty: medium
    topics: [queries]

  - id: q5
    text: "За что отвечает `brakeman`?"
    type: single
    options:
      - id: a
        text: "Статически анализирует код Rails-приложения и ищет типовые уязвимости"
        correct: true
        explanation: "Brakeman разбирает исходный код Rails-приложения без его запуска и ищет типовые уязвимости — SQL-инъекции, небезопасный render, mass assignment."
      - id: b
        text: "Проверка установленных гемов на известные CVE в базе уязвимостей"
        correct: false
        explanation: "Сверкой версий гемов с базой CVE занимается bundler-audit — он смотрит в Gemfile.lock, тогда как brakeman анализирует сам код приложения."
      - id: c
        text: "Аудит прав доступа пользователей к ресурсам приложения"
        correct: false
        explanation: "Проверкой фактических прав доступа во время работы занимается слой авторизации вроде pundit — brakeman работает статически, без запуска приложения."
      - id: d
        text: "Ограничение частоты запросов и блокировка подозрительных клиентов по IP"
        correct: false
        explanation: "Throttling и блокировку по IP делает rack-attack во время обработки реальных запросов — brakeman работает до запуска, на уровне исходного кода."
    explanation: "Brakeman читает код (запускать приложение не нужно) и ищет типовые дыры Rails. Rate limiting (вариант d) — это rack-attack. Проверка гемов на известные уязвимости (вариант b) — bundler-audit. Три разные задачи безопасности, три разных инструмента."
    extended_explanation: "Brakeman присваивает каждой находке уровень уверенности (High/Medium/Weak) — это позволяет в CI падать только на High и не захлёбываться в ложных срабатываниях на Weak, которые часто оказываются осознанными решениями, а не дырами. Brakeman стоит прогнать на контроллере с raw SQL или `render` пользовательского ввода и посмотреть, какой уровень уверенности он присвоит находке."
    recommendation: "Статический анализ безопасности Rails-кода: brakeman, уровни уверенности и смежные инструменты (bundler-audit, rack-attack)."
    difficulty: medium
    topics: [security]

  - id: q6
    text: "Что делает `strong_migrations`?"
    type: single
    options:
      - id: a
        text: "Проверяет, что все миграции в проекте обратимы"
        correct: false
        explanation: "Обратимость миграций (методы `up`/`down` или `change`) — встроенная возможность самого ActiveRecord, отдельный гем для неё не нужен."
      - id: b
        text: "Шифрует чувствительные колонки при изменении схемы базы"
        correct: false
        explanation: "Шифрование колонок — задача `ActiveRecord::Encryption` или lockbox, никак не связанная с безопасностью самих миграций."
      - id: c
        text: "Ускоряет выполнение миграций за счёт параллельного запуска"
        correct: false
        explanation: "Параллельного запуска миграций в Rails не существует в принципе — они всегда применяются последовательно по номеру версии."
      - id: d
        text: "Ловит миграции, опасные для продакшна, до их запуска"
        correct: true
        explanation: "Гем перехватывает выполнение миграции и падает ещё до начала изменений, если паттерн известен как опасный для production."
    explanation: "Гем падает на миграции, которая на большой таблице возьмёт долгую блокировку: добавление индекса без `algorithm: :concurrently`, `NOT NULL` без предварительной проверки, переименование колонки. В сообщении об ошибке даётся пошаговый безопасный вариант. По сути — зафиксированный в коде чеклист zero-downtime."
    extended_explanation: "Список проверяемых паттернов настраивается через `StrongMigrations.safety_assured_by` и можно явно обойти блок кода вызовом `safety_assured { ... }`, когда разработчик уверен, что в конкретном случае блокировка допустима — например, на пустой ещё таблице. Список операций полезно сверить с `algorithm: :concurrently` и сообщениями strong_migrations."
    recommendation: "Опасные операции DDL в PostgreSQL: какие из них берут долгую блокировку и как выполнять их безопасно."
    difficulty: medium
    topics: [migrations, locking]

  - id: q7
    text: "Какой инструмент собирает метрики, а какой их рисует?"
    type: single
    options:
      - id: a
        text: "Prometheus собирает метрики, Grafana рисует графики"
        correct: true
        explanation: "Prometheus опрашивает приложения по HTTP и хранит временные ряды, а Grafana подключается к нему как к источнику данных и строит дашборды."
      - id: b
        text: "Оба собирают, но Grafana умеет ещё и алерты"
        correct: false
        explanation: "Алерты умеет настраивать и сам Prometheus через Alertmanager — возможность алертинга не разделяет инструменты так, как описано."
      - id: c
        text: "Prometheus собирает и рисует, Grafana нужна только для алертов"
        correct: false
        explanation: "У Prometheus есть простой встроенный UI для графиков, но основным инструментом визуализации дашбордов в экосистеме остаётся именно Grafana."
      - id: d
        text: "Grafana собирает, Prometheus рисует"
        correct: false
        explanation: "Роли здесь перепутаны местами: Grafana не умеет самостоятельно опрашивать приложения и хранить метрики — для этого ей нужен источник вроде Prometheus."
    explanation: "Prometheus — база временных рядов, которая опрашивает приложения и хранит метрики. Grafana — слой визуализации поверх источников данных (Prometheus, Loki, ClickHouse и десятки других). Свой простой UI у Prometheus есть, но дашборды делают в Grafana."
    extended_explanation: "Grafana — не единственный потребитель метрик Prometheus: Alertmanager читает те же данные для алертов, а Thanos или Mimir используют Prometheus как локальный сборщик, агрегируя данные с множества инстансов в единое долговременное хранилище. Связку можно развернуть локально на тестовом приложении и посмотреть, как источник данных подключается в Grafana."
    recommendation: "Метрики и дашборды: модель Prometheus (опрос, временные ряды), Grafana как слой визуализации, Alertmanager."
    difficulty: easy
    topics: [observability]

  - id: q8
    text: "Чем `loki` отличается от `jaeger`?"
    type: single
    options:
      - id: a
        text: "Loki собирает трейсы, Jaeger — логи"
        correct: false
        explanation: "Назначение этих систем здесь поменяно местами: трейсами занимается Jaeger, а логами — Loki."
      - id: b
        text: "Loki — хранилище, Jaeger — интерфейс к нему"
        correct: false
        explanation: "У каждого из них своё собственное хранилище и свой интерфейс — они не образуют пару «бэкенд и фронтенд» к одному и тому же продукту."
      - id: c
        text: "Loki — для логов, Jaeger — для трейсов"
        correct: true
        explanation: "Loki индексирует метки лога и хранит его содержимое, а Jaeger связывает спаны одного запроса через несколько сервисов в единый трейс."
      - id: d
        text: "Оба собирают логи, но Loki работает с метриками"
        correct: false
        explanation: "Loki специализируется именно на логах, пусть и с похожей на Prometheus архитектурой меток; метриками занимается сам Prometheus."
    explanation: "Три столпа наблюдаемости: метрики (Prometheus), логи (Loki), трейсы (Jaeger, Tempo). Трейс показывает путь одного запроса через все сервисы с таймингами каждого шага — по логам такое собирать мучительно. Loki устроен как Prometheus, но для логов: индексируются метки, а не содержимое строк."
    extended_explanation: "Именно экономия на полнотекстовом индексе делает Loki дешевле в хранении, чем Elasticsearch: он находит нужный поток логов по меткам (job, namespace, pod), а уже внутри потока ищет текст грубым сканированием — компромисс в пользу стоимости хранения, а не скорости полнотекстового поиска. Различие индексации по меткам (Loki) и полнотекстовой (Elasticsearch) определяет, что выбирать при том или ином объёме логов."
    recommendation: "Три столпа наблюдаемости (метрики, логи, трейсы): Loki, Jaeger, Tempo и принципы их индексации."
    difficulty: medium
    topics: [observability]

  - id: q9
    text: "Для чего нужен `paper_trail`?"
    type: single
    options:
      - id: a
        text: "Отслеживает миграции, уже применённые к базе данных"
        correct: false
        explanation: "Применённые миграции хранятся в служебной таблице `schema_migrations` самим ActiveRecord — к истории изменений данных это не относится."
      - id: b
        text: "Генерирует PDF-отчёты по данным связанных моделей"
        correct: false
        explanation: "Генерацией PDF занимаются гемы вроде prawn или wicked_pdf — paper_trail с форматами вывода отчётов вообще не работает."
      - id: c
        text: "Пишет структурированные логи всех входящих запросов к приложению"
        correct: false
        explanation: "Логированием HTTP-запросов занимается lograge — он работает на уровне запроса целиком, тогда как paper_trail фиксирует изменения конкретной модели."
      - id: d
        text: "Хранит историю изменений моделей: кто, когда и что поменял"
        correct: true
        explanation: "PaperTrail перехватывает коллбэки ActiveRecord и на каждое создание, изменение и удаление пишет снимок состояния в таблицу `versions`."
    explanation: "PaperTrail пишет в таблицу `versions` каждое создание, изменение и удаление отслеживаемой модели: кто, когда, что было до. Нужен для аудита («кто поменял цену») и для отката. Структурированные логи запросов (вариант c) — это lograge."
    extended_explanation: "Версии хранятся как сериализованный снимок атрибутов (по умолчанию YAML или JSON), поэтому откат через `version.reify` восстанавливает объект целиком на момент той версии — включая поля, которые к текущему моменту могли вообще исчезнуть из схемы. Метод `reify` стоит изучить: он объясняет, почему откат работает даже после изменения схемы таблицы."
    recommendation: "Аудит и версионирование данных: paper_trail, таблица `versions` и восстановление объектов через `reify`."
    difficulty: medium
    topics: [models]

  - id: q10
    text: "Что делает `rack-attack`?"
    type: single
    options:
      - id: a
        text: "Отражает распределённые DDoS-атаки на сетевом уровне"
        correct: false
        explanation: "Сетевой DDoS отбивают на уровне инфраструктуры — CDN, балансировщик, облачный firewall; rack-attack работает уже внутри приложения и такой объём не выдержит."
      - id: b
        text: "Защищает формы приложения от подделки межсайтовых запросов"
        correct: false
        explanation: "Защита от CSRF встроена в сам Rails через `protect_from_forgery` и токен в форме — отдельный гем для этого не требуется."
      - id: c
        text: "Ограничивает частоту запросов, блокирует клиентов"
        correct: true
        explanation: "Rack::Attack — middleware с правилами throttle, blocklist и safelist, которые отрабатывают до того, как запрос доходит до контроллера."
      - id: d
        text: "Проверяет заголовки безопасности в исходящих ответах сервера"
        correct: false
        explanation: "Заголовки безопасности ответа (CSP, X-Frame-Options) настраивает secure_headers или встроенный `DefaultHeaders` Rails — это другая часть защиты, не ограничение частоты запросов."
    explanation: "Rack::Attack — middleware с правилами throttle, blocklist и safelist: например, не больше 5 попыток входа с одного IP за минуту. Работает до контроллеров, поэтому дешёвый. CSRF-защита (вариант b) встроена в Rails. Сетевой DDoS (вариант a) так не отбить — там нужен уровень выше приложения."
    extended_explanation: "Правила throttle хранят счётчики в Rails.cache, поэтому для многопроцессного или многосерверного деплоя нужен общий кэш — Redis или Memcached, а не `:memory_store`, иначе у каждого процесса будет свой независимый счётчик попыток. Правило throttle для формы логина стоит проверить на локальном Redis: с `:memory_store` в кластере поведение сильно отличается."
    recommendation: "Rate limiting на уровне приложения: правила throttle, blocklist и safelist в Rack::Attack, общее хранилище счётчиков."
    difficulty: medium
    topics: [security]

  - id: q11
    text: "За что отвечает `ransack`?"
    type: single
    options:
      - id: a
        text: "Организует полнотекстовый поиск через внешний движок Elasticsearch"
        correct: false
        explanation: "Интеграцию с Elasticsearch берут на себя searchkick или elasticsearch-rails — ransack работает напрямую через SQL без внешнего поискового движка."
      - id: b
        text: "Строит поиск и фильтры по моделям из параметров запроса"
        correct: true
        explanation: "Ransack превращает параметры формы вида `q[name_cont]=иван` в условия ActiveRecord-запроса, не требуя писать `where` вручную."
      - id: c
        text: "Кэширует результаты часто повторяющихся запросов"
        correct: false
        explanation: "Кэшированием запросов занимается Rails.cache или специализированные гемы вроде identity_cache — ransack сам по себе ничего не кэширует."
      - id: d
        text: "Разбивает результаты запроса на страницы фиксированного размера"
        correct: false
        explanation: "Пагинация — задача kaminari или pagy, которые обычно подключают рядом с ransack для разбивки отфильтрованной выдачи."
    explanation: "Ransack превращает параметры вида `q[name_cont]=иван` в условия ActiveRecord — удобно для админок и фильтров в списках. Пагинация (вариант d) — kaminari или pagy, их обычно ставят рядом. Полнотекстовый поиск через Elasticsearch (вариант a) — searchkick или elasticsearch-rails."
    extended_explanation: "Предикаты вроде `_cont`, `_eq`, `_gteq` ransack разбирает прямо из имени параметра и транслирует в SQL `LIKE`, `=`, `>=` — поэтому поиск удобно собирать из формы без единой строчки условий в контроллере, но ценой того, что фильтр ограничен возможностями самого SQL. Форму фильтра полезно собрать на `ransack_form_for` и посмотреть сгенерированный SQL в логе: так виден полный список предикатов."
    recommendation: "Поиск и фильтры в Rails: ransack и его предикаты, полнотекстовый поиск через Elasticsearch."
    difficulty: medium
    topics: [queries]

  - id: q12
    text: "Что делает `lograge`?"
    type: single
    options:
      - id: a
        text: "Замедляет запись логов для снижения нагрузки на диск"
        correct: false
        explanation: "Lograge, наоборот, сокращает объём записи, сворачивая несколько строк в одну — замедление записи как приём снижения нагрузки он не использует."
      - id: b
        text: "Ротирует и архивирует файлы логов приложения по расписанию"
        correct: false
        explanation: "Ротацией и архивацией файлов занимается сам logrotate на уровне операционной системы, вне зависимости от того, что пишет в лог Rails-приложение."
      - id: c
        text: "Отправляет логи приложения во внешние системы сбора и хранения"
        correct: false
        explanation: "Доставкой логов во внешнюю систему занимаются агенты вроде fluentd или promtail — lograge только меняет формат самой строки лога."
      - id: d
        text: "Сворачивает многострочный лог Rails-запроса в одну строку"
        correct: true
        explanation: "Lograge перехватывает стандартный вывод Rails (Started, Processing, Completed) и заменяет его одной строкой с ключевыми полями запроса."
    explanation: "По умолчанию Rails пишет на запрос несколько строк (Started, Processing, SQL, Completed) — читать это в агрегаторе неудобно. Lograge заменяет их одной строкой или JSON-объектом с методом, путём, статусом и длительностью. Ротацией занимается logrotate на уровне ОС, доставкой — fluentd или promtail."
    extended_explanation: "Формат вывода настраивается через `config.lograge.formatter` — можно переключить на `Lograge::Formatters::Json`, чтобы строка сразу парсилась агрегатором логов без регулярных выражений, и добавить произвольные поля через `custom_options`, например ID текущего пользователя. Объём и читаемость лога стоит сравнить до и после включения lograge на одном и том же запросе."
    recommendation: "Структурированные логи в Rails: lograge, JSON-формат, доставка (fluentd, promtail) и ротация логов."
    difficulty: medium
    topics: [observability]

  - id: q13
    text: "Какой из этих инструментов НЕ является веб-сервером или сервером приложений для Ruby?"
    type: single
    options:
      - id: a
        text: "Unicorn"
        correct: false
        explanation: "Unicorn — сервер приложений, который держит пул обрабатывающих запрос процессов и перезапускает их для обновления кода без простоя."
      - id: b
        text: "Jbuilder"
        correct: true
        explanation: "Jbuilder — DSL для построения JSON-ответов во вьюхах Rails, с обработкой HTTP-запросов он не связан."
      - id: c
        text: "Passenger"
        correct: false
        explanation: "Phusion Passenger — сервер приложений, который встраивается в Nginx или Apache и сам управляет процессами приложения."
      - id: d
        text: "Falcon"
        correct: false
        explanation: "Falcon — сервер приложений на базе async с моделью конкурентности через файберы, альтернатива Puma и Unicorn."
    explanation: "Jbuilder — DSL для JSON-ответов во вьюхах Rails. Unicorn (процессы), Falcon (файберы, на базе async) и Passenger (встраивается в Nginx или Apache) — серверы приложений с разными моделями работы."
    extended_explanation: "Разница между Puma и Unicorn — не только в потоках против процессов, но и в устойчивости к медленным клиентам: Unicorn без обратного прокси перед ним блокирует воркер-процесс на весь приём медленного запроса, тогда как Puma с cluster mode и потоками переживает это заметно легче. Puma идёт в Rails по умолчанию с пятой версии. Профиль нагрузки определяет выбор сервера, поэтому модели полезно сравнить на своём приложении."
    recommendation: "Серверы приложений Ruby: модели конкурентности Puma (потоки), Unicorn (процессы), Falcon (файберы) и Passenger."
    difficulty: medium
    topics: [ruby_runtime]

  - id: q14
    text: "Для чего нужен `view_component`?"
    type: single
    options:
      - id: a
        text: "Заменяет ERB на компонентный синтаксис в стиле фреймворка Vue"
        correct: false
        explanation: "Синтаксис шаблона при этом остаётся прежним — ERB, Haml или Slim; ViewComponent не вводит новый язык разметки."
      - id: b
        text: "Оформляет части интерфейса как классы Ruby с собственным шаблоном"
        correct: true
        explanation: "Компонент ViewComponent — это класс Ruby с методом `call` или парным шаблоном, у которого явные входные параметры и который можно тестировать в изоляции."
      - id: c
        text: "Рендерит Vue-компоненты на стороне сервера перед отдачей клиенту"
        correct: false
        explanation: "Серверный рендеринг Vue — задача отдельного SSR-слоя (Inertia, Vite SSR), а ViewComponent работает только с обычными Rails-вьюхами, Vue тут ни при чём."
      - id: d
        text: "Кэширует фрагменты вьюх приложения по заданному ключу"
        correct: false
        explanation: "Кэширование фрагментов — встроенная возможность самого Rails через `cache` в шаблоне, доступная и партиалам, и компонентам в равной мере."
    explanation: "ViewComponent (от GitHub) — альтернатива партиалам: компонент это класс плюс шаблон, у него явный интерфейс, его можно тестировать в изоляции и он быстрее партиала. ERB при этом остаётся, меняется способ организации кода, а не синтаксис."
    extended_explanation: "Прирост скорости к партиалам даёт отказ от `ActionView::Base` на каждый рендер: компонент создаётся как лёгкий объект и рендерится напрямую, из-за чего в бенчмарках GitHub ViewComponent оказывался в несколько раз быстрее эквивалентного партиала на горячем пути. Один сложный партиал стоит переписать на ViewComponent и сравнить, как изменилась тестируемость."
    recommendation: "ViewComponent и партиалы в Rails: компонентный подход, тестируемость и производительность."
    difficulty: medium
    topics: [architecture]

  - id: q15
    text: "Что такое `sorbet` и `rbs` в экосистеме Ruby?"
    type: single
    options:
      - id: a
        text: "Гемы для валидации входных данных приложения по заданной схеме"
        correct: false
        explanation: "Валидация данных на входе — задача dry-validation или strong parameters; sorbet и rbs решают другую задачу — проверяют типы прямо в коде."
      - id: b
        text: "Сериализаторы для быстрого преобразования объектов в формат JSON"
        correct: false
        explanation: "Сериализацией в JSON занимаются jbuilder, oj или active_model_serializers — с типизацией кода эта задача не связана."
      - id: c
        text: "Инструменты статической проверки типов в коде на Ruby до его запуска"
        correct: true
        explanation: "Оба инструмента позволяют описать типы сигнатур методов и проверить код на несоответствие типов до его запуска."
      - id: d
        text: "Инструменты для автоматической миграции кода между версиями Ruby"
        correct: false
        explanation: "Миграцию синтаксиса между версиями языка берёт на себя rubocop с опцией `--auto-correct` и соответствующими правилами — это задача линтера, не тайпчекера."
    explanation: "RBS — официальный формат Ruby для описания сигнатур в отдельных файлах (`.rbs`). Sorbet — тайпчекер от Stripe со своим синтаксисом аннотаций прямо в коде (`sig { params(x: Integer).returns(String) }`). Задача общая — ловить ошибки типов до запуска, подходы разные."
    extended_explanation: "Sorbet можно включать постепенно через уровни строгости (`# typed: false/true/strict`) файл за файлом, тогда как RBS по дизайну держит сигнатуры полностью отдельно от реализации — это позволяет типизировать чужой код или гем без правки его исходников. Для сравнения подходов можно посмотреть `.rbs`-файл и аннотацию `sig` для одного и того же метода."
    recommendation: "Статическая типизация в Ruby: Sorbet (аннотации `sig` в коде) и RBS (сигнатуры в отдельных файлах)."
    difficulty: hard
    topics: [ruby_language]

  - id: q16
    text: "Чем `Sequel` отличается от ActiveRecord?"
    type: single
    options:
      - id: a
        text: "Это надстройка над ActiveRecord для написания сложных SQL-запросов"
        correct: false
        explanation: "Sequel не зависит от ActiveRecord и прекрасно работает без него — это самостоятельный ORM, устанавливаемый отдельным гемом."
      - id: b
        text: "Это низкоуровневый драйвер PostgreSQL для языка Ruby"
        correct: false
        explanation: "Уровень драйвера занимает pg gem, с которым Sequel и ActiveRecord оба работают поверх него — сам Sequel выше уровнем, с моделями и DSL."
      - id: c
        text: "Это генератор SQL-миграций, совместимый с любыми ORM"
        correct: false
        explanation: "У Sequel есть собственная система миграций, но она не универсальна для любого ORM — работает только в связке с самим Sequel."
      - id: d
        text: "Это самостоятельный тулкит для работы с БД со своим DSL"
        correct: true
        explanation: "Sequel — независимая от Rails библиотека со своими моделями, датасетами и системой плагинов, существующая полностью отдельно от ActiveRecord."
    explanation: "Sequel — независимая библиотека Джереми Эванса с собственным датасет-DSL, моделями, миграциями и системой плагинов. Ассоциации там называются иначе (`one_to_many` вместо `has_many`), а запросы можно строить блоками с операторами вроде `&` и `|`. Часто выбирают для сервисов без Rails или там, где ActiveRecord мешает."
    extended_explanation: "Sequel изначально проектировался как потокобезопасный и без скрытого глобального состояния моделей — поэтому его чаще выбирают для независимых от Rails сервисов на Ruby, где важна предсказуемость под конкурентной нагрузкой. Синтаксис построения запроса в обеих библиотеках стоит сравнить на одной и той же выборке."
    recommendation: "ORM в Ruby: Sequel и ActiveRecord, различия DSL и философии."
    difficulty: hard
    topics: [queries, models]

  - id: q17
    text: "Что из перечисленного НЕ является инструментом сборки фронтенда?"
    type: single
    options:
      - id: a
        text: "Rollup"
        correct: false
        explanation: "Rollup — сборщик модулей, который Vite использует под капотом именно для production-бандла."
      - id: b
        text: "Pinia"
        correct: true
        explanation: "Pinia — хранилище состояния для Vue, к процессу сборки отношения не имеет вовсе."
      - id: c
        text: "esbuild"
        correct: false
        explanation: "esbuild — быстрый транспайлер и бандлер на Go, который Vite использует для dev-режима и трансформации зависимостей."
      - id: d
        text: "Vite"
        correct: false
        explanation: "Vite — сам инструмент сборки и dev-сервер, опирающийся на esbuild в разработке и Rollup в production."
    explanation: "Pinia — хранилище состояния для Vue (преемник Vuex), к сборке отношения не имеет. Vite, esbuild и Rollup собирают бандлы; Vite при этом в проде использует Rollup, а для трансформации — esbuild."
    extended_explanation: "Pinia вместо единого глобального стора Vuex предлагает несколько независимых сторов (`defineStore`) без мутаций как отдельного концепта — состояние меняется прямо через actions, что заметно сокращает шаблонный код по сравнению с Vuex. Как Vite переключается между esbuild в dev-режиме и Rollup в production, полезно посмотреть на практике."
    recommendation: "Сборка фронтенда: Vite, esbuild и Rollup, роль Pinia как хранилища состояния Vue."
    difficulty: easy
    topics: [architecture]

  - id: q18
    text: "Для чего нужен `dotenv`?"
    type: single
    options:
      - id: a
        text: "Загружает переменные из `.env` в разработке"
        correct: true
        explanation: "Dotenv читает файл `.env` при старте процесса и кладёт его содержимое в `ENV`, имитируя переменные окружения локально."
      - id: b
        text: "Шифрует секреты приложения в репозитории"
        correct: false
        explanation: "Шифрование секретов, которые можно хранить прямо в репозитории, решается через `credentials.yml.enc` — встроенный механизм Rails, не dotenv."
      - id: c
        text: "Управляет конфигурацией для разных окружений через YAML"
        correct: false
        explanation: "Конфигурацией по окружениям в Rails управляют файлы `config/environments/*.rb` и гемы вроде config — dotenv имеет дело только с переменными окружения."
      - id: d
        text: "Проверяет, что все нужные переменные окружения заданы при старте"
        correct: false
        explanation: "Такую проверку делает отдельная опция `require_keys` из dotenv-rails или ручной код инициализатора — сам dotenv только загружает переменные, не валидируя их полноту."
    explanation: "Dotenv нужен локально — в проде переменные обычно приходят из окружения контейнера или секрет-менеджера. Шифрование секретов в репозитории (вариант b) в Rails решается через `credentials.yml.enc`. Проверку обязательных переменных на старте (вариант d) делают вручную или гемами вроде dotenv-rails с `require_keys`."
    extended_explanation: "В продакшне dotenv обычно вообще не подключают — переменные приходят от оркестратора (Kubernetes Secrets, переменные окружения контейнера в Render или Heroku), а сам гем явно ограничивает себя development- и test-группами в Gemfile, чтобы исключить случайную загрузку `.env` в проде. Стоит проверить, в какой группе Gemfile подключён dotenv: production-группа обычно означает ошибку конфигурации."
    recommendation: "Конфигурация и секреты приложения: переменные окружения, dotenv, credentials Rails и секрет-менеджеры."
    difficulty: easy
    topics: [operations]

  - id: q19
    text: "Что делает `factory_bot`, а что — `faker`?"
    type: single
    options:
      - id: a
        text: "factory_bot подменяет внешние HTTP-вызовы в тестах, а faker создаёт объекты в базе"
        correct: false
        explanation: "Подменой внешних HTTP-вызовов занимаются webmock или vcr. Факторий среди их задач нет, а faker объекты не создаёт."
      - id: b
        text: "factory_bot генерирует случайные данные, faker сам создаёт объекты в базе"
        correct: false
        explanation: "Роли здесь перепутаны: объекты в базе создаёт factory_bot через `create`, а случайные значения полей генерирует faker."
      - id: c
        text: "factory_bot описывает шаблоны объектов, faker генерирует значения полей"
        correct: true
        explanation: "factory_bot задаёт структуру и связи объекта в блоке `factory`, а внутри него faker подставляет конкретные значения атрибутов."
      - id: d
        text: "Оба создают объекты в базе, но faker дополнительно умеет генерировать случайные значения"
        correct: false
        explanation: "Faker объекты моделей не создаёт: он лишь отдаёт значения строк и чисел, которые затем кто-то подставляет в поля."
    explanation: "factory_bot — фабрики: `create(:user)` строит объект по заранее описанному шаблону со всеми связями. Faker просто отдаёт значения: `Faker::Name.name`, `Faker::Internet.email`. Их используют вместе — фабрика описывает структуру, faker наполняет поля."
    extended_explanation: "factory_bot поддерживает наследование фабрик и traits (`factory :admin_user, parent: :user do ... end`) — это позволяет переиспользовать базовый шаблон для вариаций объекта вместо копирования всего блока факторики заново. Traits и наследование фабрик полезно освоить: так не приходится дублировать блоки между похожими фабриками."
    recommendation: "Тестовые данные в Rails: factory_bot (фабрики, traits, наследование) и faker."
    difficulty: easy
    topics: [testing]

  - id: q20
    text: "Что делает YJIT в Ruby?"
    type: single
    options:
      - id: a
        text: "Оптимизирует потребление памяти встроенным сборщиком мусора"
        correct: false
