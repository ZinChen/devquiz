slug: pg-connections-advanced-1
title: "PostgreSQL: пул соединений, транзакции и время жизни сессии"
description: "Практический тест про режимы PgBouncer, что переживает возврат соединения в пул, таймауты транзакций и соединений, два независимых уровня пулинга и диагностику зависших сессий. Поведение prepared statements описано для PgBouncer до 1.21; в более новых версиях есть поддержка на уровне протокола."
tags: [postgresql, pgbouncer, connections, backend]
difficulty: advanced
estimated_time: 30

questions:
  - id: q1
    text: "Какое из утверждений о PgBouncer верно независимо от режима пулинга?"
    type: single
    options:
      - id: a
        text: "PgBouncer разбирает SQL и направляет SELECT на реплики, а изменяющие запросы — на основной сервер"
        correct: false
        explanation: "Разбор SQL и разделение чтения и записи делают Pgpool-II или логика приложения. PgBouncer запросов не анализирует."
      - id: b
        text: "PgBouncer кэширует результаты повторяющихся запросов, поэтому заметно разгружает процессор сервера"
        correct: false
        explanation: "Результатов запросов он не хранит, каждый запрос доходит до PostgreSQL. Кэширование — уровень приложения или материализованных представлений."
      - id: c
        text: "Это прокси уровня протокола: SQL он не исполняет, а лишь мультиплексирует клиентов на меньшее число серверных соединений"
        correct: true
        explanation: "PgBouncer принимает клиентские подключения по протоколу PostgreSQL и передаёт трафик реальному серверу. Данных он не хранит и запросов не разбирает."
      - id: d
        text: "PgBouncer сам выполняет failover и повышает реплику, когда основной сервер перестаёт отвечать"
        correct: false
        explanation: "Выбором нового основного сервера занимаются Patroni, repmgr или облачный менеджер. PgBouncer подключается туда, куда указывает его конфигурация."
    explanation: "PgBouncer — лёгкий прокси, реализующий протокол PostgreSQL со стороны клиента и сервера. Его единственная задача — принять больше клиентских подключений, чем нужно физических соединений, и переиспользовать ограниченное число серверных между клиентами."
    extended_explanation: "Лёгкость обеспечена однопоточной архитектурой на event loop: десятки тысяч клиентских подключений обходятся небольшим объёмом памяти. Для сравнения, каждое соединение к PostgreSQL — отдельный backend-процесс с заметным потреблением ресурсов."
    recommendation: "Прочитать про архитектуру PgBouncer (однопоточный event loop) и о том, почему он так дёшево держит тысячи клиентов."
    difficulty: easy
    topics: [architecture]

  - id: q2
    text: "В чём разница между statement_timeout и idle_in_transaction_session_timeout в PostgreSQL?"
    type: single
    options:
      - id: a
        text: "statement_timeout ограничивает время выполнения одного запроса, второй параметр — простой внутри открытой транзакции"
        correct: true
        explanation: "Первый срабатывает, когда запрос выполняется слишком долго, второй — когда транзакция открыта, а клиент ничего не отправляет."
      - id: b
        text: "statement_timeout прерывает сессию, простаивающую вне транзакции, а второй параметр — выполняющую слишком долгий запрос"
        correct: false
        explanation: "Роли перепутаны местами: простой вне транзакции ограничивает idle_session_timeout (PostgreSQL 14+), а долгий запрос — statement_timeout."
      - id: c
        text: "statement_timeout действует на транзакцию целиком, а второй параметр — на отдельный запрос внутри неё"
        correct: false
        explanation: "statement_timeout отсчитывается заново для каждого оператора: транзакция из десяти быстрых запросов под него не попадёт, как бы долго она ни шла."
      - id: d
        text: "Разница только в области действия: первый параметр задаётся на сессию, второй — лишь для роли или базы"
        correct: false
        explanation: "Оба параметра задаются на любом уровне: в postgresql.conf, для роли, базы или сессии. Отличаются они тем, какое событие отсчитывают."
    explanation: "statement_timeout прерывает конкретный запрос, не уложившийся в лимит, и защищает от единичного слишком долгого запроса. idle_in_transaction_session_timeout закрывает сессию, у которой транзакция открыта (BEGIN уже был), но новых команд нет дольше заданного времени, то есть защищает от забытых транзакций."
    extended_explanation: "Забытая транзакция вредна, даже если ничего не выполняет: она держит старый MVCC-снапшот, и VACUUM не может убрать мёртвые версии строк, изменённых после её начала. Со временем это приводит к раздуванию таблиц. По умолчанию оба параметра равны 0, то есть выключены."
    recommendation: "Проверить, заданы ли оба таймаута на продакшн-базе, и посмотреть значения через SHOW statement_timeout."
    difficulty: medium
    topics: [reliability]

  - id: q3
    text: "PgBouncer настроен в режиме session pooling. Что это означает для клиента с точки зрения владения физическим соединением?"
    type: single
    options:
      - id: a
        text: "Соединение возвращается в пул сразу после каждого отдельного SQL-оператора"
        correct: false
        explanation: "Так работает statement pooling, самый агрессивный из трёх режимов."
      - id: b
        text: "Соединение возвращается в пул сразу после завершения каждой транзакции (COMMIT или ROLLBACK)"
        correct: false
        explanation: "Так работает transaction pooling, промежуточный режим между session и statement."
      - id: c
        text: "Соединение возвращается в пул, когда клиент простаивает дольше server_idle_timeout"
        correct: false
        explanation: "server_idle_timeout закрывает давно не используемые серверные соединения внутри пула. Привязку клиента к соединению он не меняет."
      - id: d
        text: "Клиент держит одно физическое соединение с момента подключения и до отключения"
        correct: true
        explanation: "Это самый близкий к прямому подключению режим: всё, что живёт на уровне сессии (temp tables, SET, LISTEN), работает так же, как без пулера."
    explanation: "Три режима PgBouncer различаются моментом, когда физическое соединение возвращается в общий пул. Session pooling отдаёт его только при разрыве клиентского подключения: экономия минимальна, зато совместимость с возможностями PostgreSQL, привязанными к сессии, максимальна."
    extended_explanation: "Из-за малой экономии session pooling выбирают ради совместимости, а не ради масштабирования числа клиентов: для административных подключений и приложений с LISTEN/NOTIFY или временными таблицами."
    recommendation: "Сравнить три режима PgBouncer (session, transaction, statement) по документации проекта."
    difficulty: easy
    topics: [performance]

  - id: q4
    text: "В стеке одновременно есть пул соединений ORM (например, ActiveRecord) и PgBouncer перед базой. Как эти пулы соотносятся?"
    type: single
    options:
      - id: a
        text: "ORM-пул лишний: PgBouncer уже ограничивает число соединений для всех потоков приложения"
        correct: false
        explanation: "Потокам процесса всё равно нужно делить между собой выданные соединения. Без локального пула каждый поток открывал бы собственное подключение к PgBouncer."
      - id: b
        text: "Это разные уровни: ORM-пул делит соединения между потоками процесса, PgBouncer — между множеством процессов"
        correct: true
        explanation: "ORM-пул обслуживает конкурентный доступ внутри одного процесса, а PgBouncer сводит подключения всех процессов и инстансов к малому числу серверных."
      - id: c
        text: "PgBouncer лишний: размер ORM-пула и число реплик уже задают нужное число соединений"
        correct: false
        explanation: "Суммарный спрос растёт как число реплик, умноженное на размер пула. С ростом числа инстансов он быстро упирается в max_connections."
      - id: d
        text: "Они дублируют друг друга, поэтому эффективный размер определяется меньшим из двух пулов"
        correct: false
        explanation: "Пулы стоят на разных участках пути и ограничивают разное. Меньшее значение не отменяет работу другого уровня."
    explanation: "Пул приложения управляет соединениями в рамках одного процесса: поток берёт соединение на время запроса и возвращает его. PgBouncer агрегирует подключения многих таких процессов и сокращает число реальных соединений, которые доходят до PostgreSQL с его жёстким max_connections."
    extended_explanation: "Типичная схема: десятки инстансов приложения с локальным пулом в несколько соединений подключаются к общему PgBouncer, а он мультиплексирует их на заметно меньшее число серверных соединений."
    recommendation: "Нарисовать путь запроса от потока приложения через ORM-пул и PgBouncer до backend-процесса PostgreSQL."
    difficulty: easy
    topics: [architecture]

  - id: q5
    text: "Приложение через PgBouncer в transaction pooling создаёт временную таблицу (CREATE TEMP TABLE) в одной транзакции и читает её в следующей транзакции того же клиента. Что произойдёт?"
    type: single
    options:
      - id: a
        text: "Таблица исчезнет сразу после COMMIT, потому что временные таблицы по умолчанию создаются с ON COMMIT DROP"
        correct: false
        explanation: "По умолчанию действует ON COMMIT PRESERVE ROWS: таблица живёт до конца сессии. Проблема в том, что сессия у клиента меняется."
      - id: b
        text: "Таблица сохранится, так как PostgreSQL хранит временные таблицы на диске независимо от соединения"
        correct: false
        explanation: "Временная таблица принадлежит сессии и удаляется при её завершении. Обычной таблицей на диске, видимой всем, она не является."
      - id: c
        text: "Скорее всего, таблица будет недоступна: она привязана к физическому соединению, которое после COMMIT могло уйти другому клиенту"
        correct: true
        explanation: "Temp table живёт в рамках конкретного backend-процесса. После COMMIT соединение возвращается в пул, и клиент может получить другое, где такой таблицы нет."
      - id: d
        text: "Проблема есть только в session pooling, а в transaction pooling временные таблицы работают без ограничений"
        correct: false
        explanation: "Всё наоборот: в session pooling соединение закреплено за клиентом, и temp table работает штатно."
    explanation: "Временные таблицы, как и многие другие объекты, привязаны к серверному процессу, а не к клиентской сессии. Transaction pooling разрывает связь клиента с одним соединением между транзакциями, поэтому созданное в одной транзакции может оказаться недоступным в следующей. Хуже того, другой клиент на том же соединении может наткнуться на чужую таблицу или конфликт имён."
    extended_explanation: "Если temp table нужна, её создают и используют внутри одной транзакции (ON COMMIT DROP) либо отправляют такого клиента на выделенный пул в session pooling. Сброс состояния между клиентами делает команда из server_reset_query (в transaction pooling по умолчанию она не выполняется)."
    recommendation: "Проверить код на CREATE TEMP TABLE там, где приложение ходит через PgBouncer в transaction pooling."
    difficulty: medium
    topics: [transactions]

  - id: q6
    text: "Нужно найти сессии, которые дольше 5 минут удерживают блокировки и мешают другим транзакциям. С чего начать диагностику?"
    type: single
    options:
      - id: a
        text: "pg_stat_activity вместе с pg_locks: состояние и возраст транзакции плюс удерживаемые блокировки"
        correct: true
        explanation: "pg_stat_activity показывает state, xact_start и текущий запрос по каждому соединению, а pg_locks — какие блокировки удерживает или ждёт каждый backend. Связываются они по pid."
      - id: b
        text: "pg_stat_statements — накопленное время выполнения и число вызовов по нормализованным запросам"
        correct: false
        explanation: "Это статистика по запросам в целом, без привязки к текущим сессиям. Кто сейчас кого держит, она не показывает."
      - id: c
        text: "pg_stat_database — счётчики по базе: число подключений, откатов, взаимных блокировок"
        correct: false
        explanation: "Сводка на уровне базы покажет, что дедлоки случались, но не укажет, какая сессия и на чём держит блокировку сейчас."
      - id: d
        text: "pg_stat_user_tables — число сканирований, вставок и обновлений по каждой таблице"
        correct: false
        explanation: "Это счётчики операций над таблицами. Сведений о текущих блокировках и возрасте транзакций в них нет."
    explanation: "pg_stat_activity — основной источник сведений о текущей работе соединений: состояние (active, idle, idle in transaction), время старта транзакции и запроса, текст запроса. pg_locks уточняет, какие объекты заблокированы и в каком режиме, а вместе они позволяют связать долгую сессию с тем, кого она блокирует."
    extended_explanation: "Для поиска блокирующих сессий есть готовая функция pg_blocking_pids(pid): `SELECT pid, pg_blocking_pids(pid) FROM pg_stat_activity WHERE cardinality(pg_blocking_pids(pid)) > 0`. Возраст транзакции считают как now() - xact_start."
    recommendation: "Сохранить типовой запрос, который связывает pg_locks и pg_stat_activity, чтобы использовать его при инцидентах."
    difficulty: medium
    topics: [operations]

  - id: q7
    text: "В pg_stat_activity видна транзакция в состоянии idle in transaction, открытая три часа назад, без активного запроса. Почему это опасно, даже если она не блокирует строки?"
    type: single
    options:
      - id: a
        text: "Транзакция удерживает блокировки строк, поэтому другие сессии не могут их читать до её завершения"
        correct: false
        explanation: "В MVCC читатели не блокируются писателями. Другие сессии спокойно читают такие строки, а вред идёт по другой линии."
      - id: b
        text: "Незавершённая транзакция удерживает WAL, который не удаляется до её завершения, и диск быстро заполняется"
        correct: false
        explanation: "Задерживать удаление WAL умеют неиспользуемые слоты репликации. Сама по себе висящая транзакция этого не делает."
      - id: c
        text: "Планировщик перестаёт использовать индексы по изменённым таблицам, пока транзакция не завершится"
        correct: false
        explanation: "Выбор плана от чужих открытых транзакций не зависит. Планировщик опирается на статистику и стоимость."
      - id: d
        text: "Старый MVCC-снапшот мешает VACUUM убирать мёртвые версии строк, и таблицы раздуваются"
        correct: true
        explanation: "Пока есть транзакция, чей снапшот мог бы видеть устаревшие версии, autovacuum не вправе их удалить. Бездействие этого не меняет."
    explanation: "MVCC хранит несколько версий строки, чтобы транзакции видели согласованный снапшот. VACUUM удаляет версии, которые уже не нужны ни одной активной транзакции. Пока не закончилась старая транзакция, даже бездействующая, очистка невозможна, и в активно изменяемых таблицах быстро растёт bloat."
    extended_explanation: "Это главная практическая причина задавать idle_in_transaction_session_timeout на продакшене: он завершает зависшие транзакции и освобождает снапшот. Найти виновников можно через `SELECT pid, now() - xact_start FROM pg_stat_activity WHERE state = 'idle in transaction'`."
    recommendation: "Просмотреть pg_stat_activity на долгие idle in transaction и задать idle_in_transaction_session_timeout."
    difficulty: hard
    topics: [transactions, performance]

  - id: q8
    text: "В чём компромисс transaction pooling, самого популярного режима PgBouncer, по сравнению с session pooling?"
    type: single
    options:
      - id: a
        text: "Transaction pooling не поддерживает транзакции с блокировками строк, поэтому SELECT ... FOR UPDATE в нём не работает"
        correct: false
        explanation: "Блокировки строк внутри транзакции работают нормально, потому что соединение закреплено за клиентом до её конца. Ограничение касается состояния между транзакциями."
      - id: b
        text: "Соединение возвращается в пул после COMMIT или ROLLBACK: клиентов обслуживается больше, но пропадает всё сессионное"
        correct: true
        explanation: "Меньшим числом серверных соединений можно обслужить гораздо больше клиентов. Платой становится несовместимость с возможностями PostgreSQL, привязанными к сессии."
      - id: c
        text: "Transaction pooling хуже масштабируется: серверное соединение по-прежнему занято на всё время клиентской сессии"
        correct: false
        explanation: "Это про session pooling. В transaction pooling соединение занято только на время транзакции, на этом и строится выигрыш."
      - id: d
        text: "Приложение должно само закрывать соединение после каждой транзакции, иначе PgBouncer не вернёт его в пул"
        correct: false
        explanation: "Возврат в пул по границе транзакции делает сам PgBouncer. Менять код приложения ради этого не нужно."
    explanation: "Transaction pooling — выбор большинства продакшн-конфигураций: соединение закрепляется за клиентом на время одной транзакции и сразу после COMMIT или ROLLBACK возвращается в общий пул. Выигрыш в числе обслуживаемых клиентов кратный, а цена — всё, что рассчитывает на стабильное соединение между транзакциями."
    extended_explanation: "PostgreSQL режимов пулинга не различает: для него это обычные клиенты. Вся логика и все ограничения реализованы на стороне PgBouncer, поэтому версия прокси влияет на совместимость сильнее, чем версия сервера."
    recommendation: "Прочитать раздел документации PgBouncer про ограничения transaction pooling."
    difficulty: medium
    topics: [performance]

  - id: q9
    text: "PostgreSQL сконфигурирован с max_connections = 200. Приложение развёрнуто в 50 репликах, у каждой ORM-пул на 20 соединений, подключение напрямую к базе без PgBouncer. К чему это приведёт при полной нагрузке?"
    type: single
    options:
      - id: a
        text: "Суммарный спрос в 1000 соединений многократно превышает лимит сервера, и подключения начнут отклоняться"
        correct: true
        explanation: "Каждое соединение — отдельный backend-процесс с заметным расходом памяти, поэтому max_connections задаётся под возможности сервера. Спрос от пулов легко его перекрывает."
      - id: b
        text: "Лишние подключения встанут в очередь внутри PostgreSQL и дождутся освобождения слотов без ошибок"
        correct: false
        explanation: "Очереди внутри сервера нет: при исчерпании слотов клиент сразу получает FATAL: sorry, too many clients already."
      - id: c
        text: "Достаточно уменьшить пул каждой реплики до 10: суммарные 500 соединений уже уложатся в лимит"
        correct: false
        explanation: "500 всё равно больше 200. Ограничение нужно считать от суммарного числа соединений всех реплик."
      - id: d
        text: "Каждая реплика получит не больше 4 соединений: сервер сам делит max_connections поровну между клиентами"
        correct: false
        explanation: "Сервер ничего не распределяет между клиентами: слоты достаются тем, кто успел подключиться раньше."
    explanation: "Прямое умножение числа реплик на размер локального пула быстро упирается в max_connections. Именно поэтому PgBouncer становится практически обязательным при горизонтальном масштабировании: он сводит тысячи клиентских подключений к небольшому числу серверных."
    extended_explanation: "Просто поднять max_connections не всегда безопасно: соединение занимает память backend-процесса даже в простое, и память может закончиться раньше, чем CPU. Пулы в Rails открывают соединения лениво, поэтому проблема часто проявляется только на пике."
    recommendation: "Посчитать теоретический спрос (реплики × размер пула) и сравнить с max_connections своего сервера."
    difficulty: hard
    topics: [architecture]

  - id: q10
    text: "Приложение выполняет SET search_path = custom_schema в начале сессии и рассчитывает, что последующие запросы пойдут в эту схему. Как это ломается под transaction pooling?"
    type: single
    options:
      - id: a
        text: "PgBouncer применяет SET ко всем соединениям пула, но значение пропадает после перезагрузки конфигурации"
        correct: false
        explanation: "Параметры сессий между соединениями он не синхронизирует: SET остаётся локальным для одного backend-процесса."
      - id: b
        text: "Команда выполняется, но действует лишь до конца текущего оператора, как SET LOCAL в режиме autocommit"
        correct: false
        explanation: "SET без LOCAL живёт до конца сессии. Именно поэтому он переживает транзакцию на том же соединении и ломает следующего клиента."
      - id: c
        text: "Параметр привязан к физическому соединению и теряется, когда оно уходит в пул и достаётся другому клиенту"
        correct: true
        explanation: "SET меняет параметр текущей серверной сессии. После COMMIT соединение может достаться другому клиенту, а исходный получит соединение с настройками по умолчанию."
      - id: d
        text: "Проблема возникает только если схема не существует, а для существующей схемы SET работает в любом режиме"
        correct: false
        explanation: "Существование схемы ничего не меняет: сбрасывается само значение параметра из-за смены соединения."
    explanation: "SET действует до конца жизни физического соединения или до явного RESET. В transaction pooling клиент не владеет одним соединением между транзакциями, поэтому надеяться на сохранение SET нельзя. Обычный выход: session pooling для таких клиентов или SET LOCAL внутри каждой транзакции."
    extended_explanation: "SET LOCAL действует до конца текущей транзакции и откатывается вместе с ней, поэтому безопасен в любом режиме пулинга. В новых версиях PgBouncer для некоторых параметров есть track_extra_parameters, но полагаться на него без проверки версии не стоит."
    recommendation: "Найти в коде SET без LOCAL, у которых есть расчёт на то, что настройка переживёт границу транзакции."
    difficulty: medium
    topics: [transactions]

  - id: q11
    text: "lock_timeout установлен в 3 секунды. Транзакция делает UPDATE строки, которую удерживает другая, более долгая транзакция. Что произойдёт через 3 секунды ожидания?"
    type: single
    options:
      - id: a
        text: "Запрос продолжит ждать: lock_timeout срабатывает только при взаимной блокировке, то есть на дедлоке"
        correct: false
        explanation: "С дедлоками работает отдельный deadlock_timeout. lock_timeout ограничивает любое ожидание блокировки."
      - id: b
        text: "Запрос прервётся ошибкой, но транзакция останется рабочей и клиент сможет выполнять следующие команды без ROLLBACK"
        correct: false
        explanation: "Так бывает только при откате до savepoint. Без него транзакция после ошибки остаётся в состоянии aborted."
      - id: c
        text: "PostgreSQL принудительно отменит транзакцию, которая держит блокировку, чтобы освободить строку"
        correct: false
        explanation: "lock_timeout действует только на ожидающую сторону. Удерживающую блокировку транзакцию он не трогает."
      - id: d
        text: "Запрос прервётся ошибкой, а транзакция перейдёт в состояние aborted и потребует ROLLBACK"
        correct: true
        explanation: "lock_timeout превращает ожидание блокировки в ошибку оператора. После любой ошибки внутри транзакции дальнейшие команды отклоняются, пока не будет ROLLBACK."
    explanation: "lock_timeout ограничивает время ожидания конкретной блокировки, а не жизнь транзакции или запроса. По истечении лимита оператор прерывается ошибкой (canceling statement due to lock timeout), и приложение должно сделать ROLLBACK, повторить операцию или отработать иную логику."
    extended_explanation: "lock_timeout стоит отличать от statement_timeout, который ограничивает любой долгий запрос независимо от причины. Для миграций их часто используют вместе: короткий lock_timeout с повторами не даёт DDL надолго встать в очередь за чужой блокировкой."
    recommendation: "Проверить, как приложение обрабатывает ошибку lock_timeout: после неё нужен явный откат или повтор."
    difficulty: medium
    topics: [locking]

  - id: q12
    text: "В приложении обнаружена утечка соединений: в некоторых ветках кода соединение не возвращается в пул. Как это проявляется под нагрузкой?"
    type: single
    options:
      - id: a
        text: "Растёт число сессий idle in transaction на сервере, при этом приложение продолжает отвечать без задержек"
        correct: false
        explanation: "Пока в пуле остаются свободные соединения, задержек нет, но по мере утечки их становится меньше и ожидание появляется."
      - id: b
        text: "Пул постепенно исчерпывается, и новые запросы ждут свободное соединение всё дольше, вплоть до таймаута"
        correct: true
        explanation: "Каждое утёкшее соединение выбывает из пула до перезапуска процесса. При постоянном потоке запросов свободных соединений не остаётся."
      - id: c
        text: "Когда пул заканчивается, приложение открывает прямые подключения к базе в обход пула"
        correct: false
        explanation: "Пул ограничивает число соединений жёстко. Обходных подключений ни ORM, ни драйвер сами не создают."
      - id: d
        text: "ORM-пул сам закрывает утёкшие соединения по таймауту простоя, и приложение восстанавливается без перезапуска"
        correct: false
        explanation: "Возврат из «мёртвых» потоков есть у отдельных реализаций, но в общем случае забытое соединение остаётся выданным и занятым."
    explanation: "Connection leak возникает, когда код берёт соединение (явно или через ORM), но не возвращает его: из-за необработанного исключения или забытого release в какой-то ветке. Каждая утечка уменьшает доступный пул на единицу, и при регулярном воспроизведении пул опустошается."
    extended_explanation: "У большинства пулов есть защита: checkout timeout (сколько ждать соединение) и метрики занятых и простаивающих соединений. Мониторить стоит именно долю занятых: ранний рост даёт сигнал задолго до полного исчерпания."
    recommendation: "Настроить мониторинг метрик пула (checked out, idle, waiting) для раннего обнаружения утечки."
    difficulty: easy
    topics: [reliability]

  - id: q13
    text: "Сервис подписывается на уведомления через LISTEN channel_name и ожидает NOTIFY-события долгое время. Почему это плохо сочетается с transaction pooling?"
    type: single
    options:
      - id: a
        text: "Подписка живёт на конкретном соединении, а transaction pooling не оставляет клиента на нём достаточно долго"
        correct: true
        explanation: "LISTEN регистрируется на backend-процессе. Когда PgBouncer забирает соединение обратно в пул, подписка теряется вместе с ним."
      - id: b
        text: "PgBouncer буферизует NOTIFY-события и отдаёт их при следующем подключении клиента, поэтому они приходят с большой задержкой"
        correct: false
        explanation: "Буферизации и повторной доставки в PgBouncer нет: механизм принадлежит серверу и конкретному соединению."
      - id: c
        text: "Подписка действует только внутри одной транзакции и снимается на COMMIT, поэтому слушать дольше нельзя"
        correct: false
        explanation: "В любом режиме LISTEN действует до конца сессии. Теряется она потому, что клиент теряет саму сессию."
      - id: d
        text: "NOTIFY рассылается только клиентам, подключённым напрямую к порту PostgreSQL, а через прокси сервер его не отправляет"
        correct: false
        explanation: "Протокол это допускает: уведомления проходят через прокси как обычные сообщения. Мешает именно смена соединения."
    explanation: "LISTEN/NOTIFY работает в рамках долгоживущего соединения: подписка живёт, пока живёт backend-процесс. Механизм рассчитан на постоянное подключение (session pooling или без пулера), а transaction pooling регулярно перераспределяет соединения между клиентами."
    extended_explanation: "Рабочие варианты: выделенный пул в session pooling для подписчиков либо отдельный процесс с прямым подключением, который транслирует уведомления дальше через Redis или другую шину."
    recommendation: "Убедиться, что клиенты с LISTEN подключаются через session pooling или напрямую."
    difficulty: hard
    topics: [transactions]

  - id: q14
    text: "Приложение периодически падает с ошибкой FATAL: sorry, too many clients already, хотя ORM-пул каждой реплики настроен корректно. Что проверить в первую очередь?"
    type: single
    options:
      - id: a
        text: "Значение max_prepared_transactions: подготовленные транзакции занимают слоты клиентских подключений"
        correct: false
        explanation: "Это отдельный лимит для двухфазных коммитов. На слоты обычных клиентских подключений он не влияет."
      - id: b
        text: "Лимит открытых файлов ulimit -n на сервере приложения: из-за него PostgreSQL отклоняет новых клиентов"
        correct: false
        explanation: "Исчерпание файловых дескрипторов клиента даёт другие ошибки на стороне клиента. Сообщение too many clients выдаёт сам сервер."
      - id: c
        text: "Параметр max_worker_processes: фоновые процессы сервера забирают слоты у клиентских подключений"
        correct: false
        explanation: "Фоновые воркеры считаются отдельно. max_connections ограничивает именно клиентские backend-процессы."
      - id: d
        text: "Сумму соединений от реплик, фоновых воркеров, скриптов и консолей относительно max_connections"
        correct: true
        explanation: "Лимит общий для сервера. Ошибка возникает, когда суммарное число подключений из всех источников превышает его, даже если каждый источник сам по себе настроен разумно."
    explanation: "too many clients already — ошибка самого PostgreSQL: исчерпан max_connections сервера. Частая причина — забытые источники подключений: фоновые воркеры, cron-скрипты, административные инструменты и консоли разработчиков поверх основного веб-пула."
    extended_explanation: "Источник найти просто: `SELECT usename, application_name, count(*) FROM pg_stat_activity GROUP BY 1, 2 ORDER BY 3 DESC`. Часть слотов зарезервирована под суперпользователя (superuser_reserved_connections), поэтому админ часто может зайти, когда остальным уже отказано."
    recommendation: "Сгруппировать pg_stat_activity по application_name и найти неожиданный источник подключений."
    difficulty: medium
    topics: [operations]

  - id: q15
    text: "Statement pooling — самый агрессивный режим PgBouncer. Почему он почти не применяется с приложениями, использующими многошаговые транзакции?"
    type: single
    options:
      - id: a
        text: "Statement pooling не поддерживает prepared statements, а ORM используют их в каждой транзакции"
        correct: false
        explanation: "Prepared statements — отдельная несовместимость, которая есть и в transaction pooling. Главное ограничение режима в другом: транзакции из нескольких шагов."
      - id: b
        text: "PgBouncer не умеет отправлять COMMIT, пока не получит все операторы транзакции одним пакетом"
        correct: false
        explanation: "Буферизации операторов до COMMIT в PgBouncer нет. Он просто не допускает несколько шагов в одной транзакции."
      - id: c
        text: "Соединение возвращается в пул после каждого оператора, поэтому BEGIN … COMMIT из нескольких шагов в нём не поддерживается"
        correct: true
        explanation: "PgBouncer в этом режиме отклоняет многошаговые транзакции: шаги разъехались бы по разным соединениям, и транзакция потеряла бы смысл."
      - id: d
        text: "Режим работает только с ролями без права записи, а транзакции предполагают изменение данных"
        correct: false
        explanation: "Деления по ролям в пулинге нет. Режим не зависит от того, читает клиент или пишет."
    explanation: "Statement pooling возвращает соединение сразу после каждого оператора. Если приложение явно управляет транзакцией, её шаги могли бы разойтись по разным физическим соединениям, поэтому PgBouncer просто запрещает такие транзакции."
    extended_explanation: "Режим имеет смысл почти исключительно для автокоммитных клиентов, где каждый запрос самодостаточен. ORM, которые сами оборачивают операции в транзакции, с ним не работают."
    recommendation: "Проверить, оборачивает ли ORM проекта каждую операцию в явную транзакцию, прежде чем рассматривать statement pooling."
    difficulty: hard
    topics: [performance]

  - id: q16
    text: "На проде statement_timeout выставлен глобально в 30 секунд для всех подключений, включая скрипты миграций. Какая практическая проблема отсюда следует?"
    type: single
    options:
      - id: a
        text: "Таймаут применяется только к клиентам без прав суперпользователя, так что скрипты миграций ему не подчиняются"
        correct: false
        explanation: "Для superuser исключений нет: параметр действует на любую сессию, где он задан."
      - id: b
        text: "Долгая миграция может быть прервана посередине, хотя сама она безопасна и просто требует больше времени"
        correct: true
        explanation: "Глобальный лимит не различает контекст: он одинаково прервёт зависший клиентский запрос и штатно долгую операцию администратора, например индексацию большой таблицы."
      - id: c
        text: "Параметр отсчитывается от старта соединения, поэтому все сессии старше 30 секунд будут принудительно закрыты"
        correct: false
        explanation: "statement_timeout отсчитывается от начала каждого оператора. За время жизни соединения отвечают другие настройки."
      - id: d
        text: "Параметр нельзя переопределить на уровне сессии, поэтому для миграций придётся менять конфигурацию сервера"
        correct: false
        explanation: "Переопределить можно через SET в сессии, а также для роли или базы. Для миграций обычно так и делают."
    explanation: "Глобальный таймаут закрывает целый класс проблем одной строкой конфига, поэтому легко забыть про законные исключения. Миграции и бэкфиллы часто выполняют операции, для которых 30 секунд мало. Обычная практика: переопределять statement_timeout точечно в сессии перед такой операцией."
    extended_explanation: "SET statement_timeout = 0 в одной сессии не влияет на остальные подключения. Для постоянных исключений удобнее ALTER ROLE migrator SET statement_timeout = 0: роль для миграций получает свой лимит, а клиентский трафик остаётся под защитой."
    recommendation: "Проверить, что скрипты миграций переопределяют statement_timeout перед потенциально долгими операциями."
    difficulty: medium
    topics: [operations]

  - id: q17
    text: "Через выделенную сеть простаивающие соединения к PostgreSQL иногда обрываются спустя несколько часов бездействия: на пути стоит балансировщик с таймаутом на неактивные TCP-сессии. Что поможет?"
    type: single
    options:
      - id: a
        text: "tcp_keepalives_idle — через сколько простоя посылать keepalive-пакеты, чтобы соединение не считалось мёртвым"
        correct: true
        explanation: "Периодические keepalive-пакеты видны сетевому оборудованию как активность и не дают ему сбросить запись о соединении. Они же быстрее выявляют настоящий обрыв."
      - id: b
        text: "idle_session_timeout — закрывать сессии, простаивающие дольше заданного времени"
        correct: false
        explanation: "Это параметр PostgreSQL 14+, который сам закрывает простаивающие сессии. Он не предотвращает обрыв, а добавляет ещё один."
      - id: c
        text: "tcp_user_timeout — время, через которое неподтверждённые данные считаются потерянными"
        correct: false
        explanation: "Он определяет, когда отправленные, но не подтверждённые данные считать потерянными. Простаивающее соединение он от сброса не защищает."
      - id: d
        text: "client_connection_check_interval — как часто сервер проверяет, жив ли клиент во время выполнения запроса"
        correct: false
        explanation: "Проверка работает только во время выполнения запроса. В простое она ничего не посылает и не поддерживает."
    explanation: "Промежуточное оборудование (файрволы, балансировщики, NAT) агрессивно сбрасывает записи о долго неактивных TCP-соединениях, и ни клиент, ни сервер не узнают об обрыве, пока не попытаются передать данные. Keepalive-пакеты держат соединение «живым» для этого оборудования."
    extended_explanation: "Настройка состоит из трёх параметров: tcp_keepalives_idle (сколько ждать до первой пробы), tcp_keepalives_interval (интервал между пробами) и tcp_keepalives_count (сколько проб без ответа считать обрывом). Значение idle должно быть меньше таймаута балансировщика."
    recommendation: "Проверить tcp_keepalives_* на клиенте и сервере и сравнить tcp_keepalives_idle с таймаутом простоя на балансировщике."
    difficulty: hard
    topics: [reliability]

  - id: q18
    text: "Драйвер приложения использует server-side prepared statements (PREPARE … EXECUTE). Почему это плохо сочетается с transaction pooling в PgBouncer до версии 1.21?"
    type: single
    options:
      - id: a
        text: "План prepared statement хранится в PgBouncer и перестраивается при каждой смене клиента, что сводит выигрыш к нулю"
        correct: false
        explanation: "PgBouncer планов не хранит. Планирование происходит на сервере PostgreSQL."
      - id: b
        text: "PgBouncer ограничивает число prepared statements на клиента, и при превышении лимита соединение закрывается"
        correct: false
        explanation: "Ограничение числа подготовленных запросов появилось лишь в более новых версиях вместе с их поддержкой. К проблеме старых версий оно отношения не имеет."
      - id: c
        text: "Драйвер вынужден переходить на текстовый протокол, поэтому планы запросов не переиспользуются вовсе"
        correct: false
        explanation: "Драйвер продолжает использовать расширенный протокол. Ошибка возникает из-за смены соединения, формат передачи тут ни при чём."
      - id: d
        text: "Подготовленный запрос живёт на конкретном backend-процессе, а следующий запрос клиента может уйти на соединение, где его нет"
        correct: true
        explanation: "PREPARE регистрирует запрос в конкретном серверном процессе. Если EXECUTE попадёт на другое соединение, сервер ответит, что подготовленного запроса с таким именем не существует."
    explanation: "Server-side prepared statement — состояние конкретного серверного процесса, на котором выполнен PREPARE. Transaction pooling может выдать клиенту другой backend для следующего запроса, где ранее подготовленного запроса нет, и это приводит к ошибке при EXECUTE."
    extended_explanation: "Начиная с PgBouncer 1.21 есть поддержка prepared statements на уровне протокола (max_prepared_statements): прокси отслеживает подготовку и повторяет её на нужном соединении. В старых версиях драйвер переводят на client-side prepared statements (в Rails — `prepared_statements: false`)."
    recommendation: "Проверить версию PgBouncer и настройку prepared_statements в драйвере или ORM проекта."
    difficulty: hard
    topics: [performance]

  - id: q19
    text: "Приложение открывает транзакцию, обращается к внешнему платёжному шлюзу между SQL-запросами и только потом коммитит. Почему это антипаттерн даже без учёта таймаутов?"
    type: single
    options:
      - id: a
        text: "Время ожидания шлюза засчитывается в statement_timeout, и PostgreSQL откатит транзакцию, хотя в базе ничего не выполнялось"
        correct: false
        explanation: "statement_timeout считается по времени выполнения каждого оператора. Ожидание между операторами в него не входит."
      - id: b
        text: "Внешний вызов нарушает изоляцию: другие сессии начинают видеть ещё не закоммиченные изменения транзакции"
        correct: false
        explanation: "Изоляция от внешних вызовов не зависит. Чужие сессии не видят незакоммиченных данных, как бы долго транзакция ни висела."
      - id: c
        text: "Транзакция удерживает блокировки и снапшот на всё время ожидания внешней системы"
        correct: true
        explanation: "Пока транзакция открыта, её блокировки удержаны, а снапшот мешает очистке. Длительность внешнего вызова непредсказуема, поэтому непредсказуемы и эти побочные эффекты."
      - id: d
        text: "Основная проблема — рост задержки ответа клиенту, а состояние самой базы при этом остаётся прежним"
        correct: false
        explanation: "Задержка есть, но не она главная. Транзакция всё это время держит ресурсы базы: блокировки и снапшот."
    explanation: "Смешивание медленных внешних вызовов с открытой транзакцией растягивает время удержания блокировок изменённых строк и MVCC-снапшота на срок, зависящий от внешней системы. Стандартный приём: выполнять внешний вызов до транзакции или после неё, оставляя саму транзакцию короткой."
    extended_explanation: "Для двухшаговых операций с внешней системой обычно делают две коротких транзакции: первая фиксирует промежуточное состояние (например, статус pending), вторая записывает итог после ответа шлюза. Так же устроены схемы с idempotency key и outbox."
    recommendation: "Найти в коде сетевые вызовы внутри блока транзакции и вынести их за её пределы."
    difficulty: medium
    topics: [transactions]

  - id: q20
    text: "В pgbouncer.ini заданы max_client_conn = 1000 и default_pool_size = 20 для базы. Что произойдёт, если одновременно активны 500 клиентов, интенсивно выполняющих запросы?"
    type: single
    options:
      - id: a
        text: "PgBouncer примет 20 клиентов, а остальным вернёт ошибку превышения лимита соединений"
        correct: false
        explanation: "Отказ наступит лишь при превышении max_client_conn, то есть 1000. До этого клиенты подключаются и ждут своей очереди."
      - id: b
        text: "Все 500 клиентов будут приняты, к PostgreSQL откроется не более 20 соединений, остальные клиенты встанут в очередь"
        correct: true
        explanation: "max_client_conn ограничивает число клиентских подключений к PgBouncer, а default_pool_size — число одновременно используемых серверных соединений. Расхождение между ними — намеренная экономия."
      - id: c
        text: "Пул вырастет до 500 соединений: default_pool_size — не лимит, а размер, с которого пул стартует"
        correct: false
        explanation: "default_pool_size — верхняя граница серверных соединений для пула. Превышение возможно только через reserve_pool, и то короткое."
      - id: d
        text: "Клиенты поделят 20 соединений поровну, и каждый закрепится за своим соединением на весь срок сессии"
        correct: false
        explanation: "Закрепление на всю сессию — это session pooling. В transaction pooling соединение отдаётся клиенту на время транзакции."
    explanation: "Параметры решают разные задачи: max_client_conn — сколько клиентов примет PgBouncer, pool_size — сколько из них получат серверное соединение одновременно. Разрыв между большим первым значением и малым вторым — типичная конфигурация ради экономии соединений."
    extended_explanation: "Ожидание в очереди добавляет задержку каждому запросу. Если соотношение числа активных клиентов и размера пула подобрано неудачно, очередь становится узким местом даже при ненагруженной базе. Её длину видно в SHOW POOLS (столбец cl_waiting)."
    recommendation: "Сопоставить число одновременно активных клиентов приложения с default_pool_size и посмотреть SHOW POOLS под нагрузкой."
    difficulty: medium
    topics: [performance]

  - id: q21
    text: "Транзакция на уровне READ COMMITTED (по умолчанию в PostgreSQL) выполняет два одинаковых SELECT подряд. Между ними другая транзакция успевает закоммитить изменение той же строки. Что увидит второй SELECT?"
    type: single
    options:
      - id: a
        text: "Тот же результат, что и первый: PostgreSQL фиксирует единый снапшот на всю транзакцию на любом уровне изоляции"
        correct: false
        explanation: "Единый снапшот на транзакцию дают REPEATABLE READ и SERIALIZABLE. READ COMMITTED его не фиксирует."
      - id: b
        text: "Ошибку сериализации: транзакция завершится аварийно из-за конфликта с закоммитившейся транзакцией"
        correct: false
        explanation: "Ошибки сериализации характерны для REPEATABLE READ и SERIALIZABLE. На READ COMMITTED запрос просто читает более свежие данные."
      - id: c
        text: "Результат зависит от того, какая из двух транзакций стартовала раньше"
        correct: false
        explanation: "Время старта не важно. Значение имеет лишь то, успела ли другая транзакция закоммититься до второго SELECT."
      - id: d
        text: "Уже закоммиченное изменение: READ COMMITTED берёт новый снапшот на каждый оператор"
        correct: true
        explanation: "Каждый запрос видит данные, закоммиченные до его старта. Поэтому два одинаковых запроса в одной транзакции могут вернуть разное (non-repeatable read)."
    explanation: "READ COMMITTED гарантирует лишь то, что каждый запрос видит закоммиченные к своему началу данные. Единого снапшота на транзакцию нет, поэтому допустим non-repeatable read: повторный запрос способен вернуть иной результат."
    extended_explanation: "Для сценариев, где нужно согласованное чтение на протяжении всей транзакции (например, отчёт из нескольких запросов), берут REPEATABLE READ: снапшот фиксируется один раз при первом запросе транзакции и держится до её конца."
    recommendation: "Разобрать таблицу аномалий (dirty read, non-repeatable read, phantom read) по уровням изоляции в документации PostgreSQL."
    difficulty: medium
    topics: [transactions]

  - id: q22
    text: "Скрипт вызывает pg_advisory_lock(42) в начале задачи и pg_advisory_unlock(42) в конце, работая через PgBouncer в transaction pooling. Что может пойти не так?"
    type: single
    options:
      - id: a
        text: "Unlock может уйти на другое соединение: исходная блокировка останется висеть, а вызов вернёт false"
        correct: true
        explanation: "Сессионный advisory lock привязан к соединению, на котором взят. Если следующая команда пойдёт через другое, снять его оттуда нельзя."
      - id: b
        text: "Лок снимется автоматически на COMMIT, поэтому явный unlock окажется лишним и вызовет ошибку"
        correct: false
        explanation: "Автоматически на COMMIT снимается только pg_advisory_xact_lock. Обычный лок живёт до unlock или конца сессии."
      - id: c
        text: "Блокировка сработает как транзакционная, и две задачи смогут взять один и тот же ключ одновременно"
        correct: false
        explanation: "Ключ остаётся занятым на том соединении, где взят лок. Сложность в том, что снять его потом не получится."
      - id: d
        text: "PgBouncer отслеживает сессионные advisory locks и снимает их при смене соединения, поэтому проблем нет"
        correct: false
        explanation: "Такого отслеживания в PgBouncer нет: прокси не знает о серверном состоянии клиентской сессии."
    explanation: "Сессионные advisory locks привязаны к соединению. В transaction pooling lock и unlock могут выполниться на разных соединениях, и блокировка зависнет на одном из них, пока соединение не будет закрыто. Для таких задач используют pg_advisory_xact_lock внутри транзакции."
    extended_explanation: "Транзакционная версия снимается автоматически на COMMIT или ROLLBACK, то есть ровно тогда, когда PgBouncer готов отдать соединение другому клиенту. Висящие сессионные локи видны в pg_locks по locktype = 'advisory'."
    recommendation: "Проверить код на pg_advisory_lock без xact там, где приложение работает через transaction pooling."
    difficulty: medium
    topics: [transactions, locking]

  - id: q23
    text: "Приложение использует один PgBouncer для боевой read-write нагрузки и редких, но очень долгих аналитических batch-запросов. Какая рекомендация применима?"
    type: single
    options:
      - id: a
        text: "Использовать один общий пул максимального размера: разделение пулов на конкуренцию за соединения не влияет"
        correct: false
        explanation: "Общий пул как раз и создаёт конкуренцию: долгие запросы занимают соединения надолго, и коротким их не хватает."
      - id: b
        text: "Перевести обе нагрузки на session pooling, чтобы долгие запросы не вытеснялись из соединений"
        correct: false
        explanation: "Session pooling расходует соединения ещё щедрее и делает пул ещё более уязвимым к долгим сессиям."
      - id: c
        text: "Развести нагрузки по разным пулам с отдельными размерами и, при необходимости, режимами"
        correct: true
        explanation: "PgBouncer позволяет описать несколько независимых пулов на одну базу. Долгие аналитические запросы тогда не вымывают соединения у коротких боевых транзакций."
      - id: d
        text: "Ограничить аналитике statement_timeout до секунды и больше ничего не менять"
        correct: false
        explanation: "Такой лимит сломает сами аналитические запросы. Решением служит разделение ресурсов."
    explanation: "PgBouncer конфигурируется отдельными пулами на связку клиент и база, и ничто не мешает завести два пула на одну и ту же базу с разными настройками. Аналитика получает свой, обычно меньший пул, который не может вытеснить соединения короткой боевой нагрузки."
    extended_explanation: "Похожий приём — отдельный пул, указывающий на реплику для аналитики и отчётов. Тогда разгружается не только пул соединений, но и сам основной сервер."
    recommendation: "Изучить секцию [databases] в pgbouncer.ini на примере разделения OLTP и аналитических пулов."
    difficulty: easy
    topics: [architecture]

  - id: q24
    text: "Внутри транзакции INSERT нарушил уникальный индекс, и следующие команды падают с ошибкой «current transaction is aborted». Как продолжить, не потеряв предыдущую работу?"
    type: single
    options:
      - id: a
        text: "Выполнить COMMIT: всё, что успело выполниться до ошибки, сохранится"
        correct: false
        explanation: "COMMIT в aborted-транзакции фактически станет ROLLBACK: изменения не сохранятся."
      - id: b
        text: "Откатиться к SAVEPOINT, установленному перед рискованным INSERT, и продолжить транзакцию"
        correct: true
        explanation: "ROLLBACK TO SAVEPOINT возвращает транзакцию в рабочее состояние и сохраняет всё, что выполнено до точки. Поэтому savepoint ставят перед шагами, которые могут упасть."
      - id: c
        text: "Выполнить RESET ALL, который сбросит состояние сессии вместе с флагом ошибки"
        correct: false
        explanation: "RESET ALL возвращает параметры настроек, но состояние самой транзакции не меняет."
      - id: d
        text: "Вызвать pg_cancel_backend для своего pid, чтобы снять флаг ошибки с транзакции"
        correct: false
        explanation: "Эта функция отменяет текущий запрос и состояния aborted у транзакции не снимает."
    explanation: "SAVEPOINT создаёт именованную точку в транзакции, к которой можно вернуться командой ROLLBACK TO SAVEPOINT, не теряя сделанного раньше. Полезно, когда один шаг опционален (например, вставка с возможным нарушением уникальности) и его сбой не должен отменять остальное."
    extended_explanation: "ORM реализуют вложенные блоки транзакций через savepoint: вложенный `transaction(requires_new: true)` в Rails превращается в SAVEPOINT и RELEASE SAVEPOINT, потому что вложенных транзакций как отдельной сущности в PostgreSQL нет."
    recommendation: "Посмотреть, как ORM проекта транслирует вложенные транзакции в SAVEPOINT, включив логирование SQL."
    difficulty: medium
    topics: [transactions]

  - id: q25
    text: "Какой параметр PgBouncer ограничивает, сколько клиент ждёт свободного серверного соединения, пока пул занят?"
    type: single
    options:
      - id: a
        text: "server_idle_timeout — через сколько закрывать серверные соединения, которые не используются"
        correct: false
        explanation: "Это про сворачивание пула: освободившиеся соединения закрываются, чтобы не занимать слоты PostgreSQL. На очередь клиентов он не влияет."
      - id: b
        text: "client_idle_timeout — через сколько отключать клиента, который ничего не отправляет"
        correct: false
        explanation: "Параметр отключает молчащих клиентов. Те, кто ждёт соединения из пула, под него не подпадают."
      - id: c
        text: "server_lifetime — максимальный возраст серверного соединения, после которого оно пересоздаётся"
        correct: false
        explanation: "Он нужен для периодической ротации серверных соединений. Время ожидания клиентов он не ограничивает."
      - id: d
        text: "query_wait_timeout — максимальное время ожидания клиентом серверного соединения до ошибки"
        correct: true
        explanation: "Если все соединения пула заняты, клиент ждёт в очереди. Когда ожидание превышает query_wait_timeout, он получает ошибку и не висит бесконечно."
    explanation: "Когда клиентов больше, чем соединений в пуле, лишние ждут в очереди. query_wait_timeout задаёт предел этого ожидания: по его истечении клиент получает ошибку. Без лимита перегруженный пул превратился бы в бесконечные зависшие запросы."
    extended_explanation: "Состояние очередей видно в SHOW POOLS (cl_waiting — сколько клиентов ждут) и SHOW CLIENTS. Рост cl_waiting при ненагруженной базе обычно значит, что пул слишком мал или что часть клиентов держит соединения дольше нужного."
    recommendation: "Посмотреть SHOW POOLS под нагрузкой и сопоставить cl_waiting с размером пула и query_wait_timeout."
    difficulty: easy
    topics: [performance]
