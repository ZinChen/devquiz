slug: algorithm-trees-graphs-1
title: "Алгоритмы: деревья и графы"
description: "Паттерны решения задач на деревьях (обход снизу вверх и сверху вниз) и графах (BFS/DFS, кратчайший путь, компоненты связности, топологическая сортировка)."
tags: [algorithms, claude-gen]
difficulty: advanced
estimated_time: 25

questions:
  - id: q1
    text: "Пишется рекурсивное решение для задачи на бинарное дерево. С чего должна начинаться первая строчка функции?"
    type: single
    options:
      - id: a
        text: "С обработки текущего узла — считать его значение до всего остального"
        correct: false
        explanation: "Обработка текущего узла зависит от результатов поддеревьев — до рекурсивных вызовов её обычно ещё нечем заполнить."
      - id: b
        text: "С проверки, есть ли у узла оба потомка, чтобы не уйти в лишнюю рекурсию"
        correct: false
        explanation: "Ручная проверка на существование конкретных потомков вместо использования базового случая — источник пропущенных краевых случаев."
      - id: c
        text: "С проверки на пустой узел (базовый случай рекурсии)"
        correct: true
        explanation: "Базовый случай — пустой узел — должен быть закрыт первым: он останавливает рекурсию и не даёт обращаться к полям несуществующего узла."
      - id: d
        text: "С инициализации глобального аккумулятора результата"
        correct: false
        explanation: "Аккумулятор нужен не всегда, а если нужен — его заводят до входа в рекурсию, а не первой строчкой самой рекурсивной функции."
    explanation: "Для любой рекурсивной задачи на дерево первая строчка — проверка на пустой узел. Частая ошибка — заменять её точечными проверками на существование конкретных детей, что пропускает краевые случаи."
    topics: [algorithms]
    extended_explanation: |
      Общий фреймворк для задач на дерево — ответить на два вопроса: что
      вернуть для пустого узла, и что вернуть для текущего узла, зная
      ответы от обоих поддеревьев. Базовый случай закрывает первый
      вопрос сразу и снимает необходимость в разрозненных проверках
      `if node.left`, `if node.right` по всему телу функции.

      ```
      function solve(node):
          if node == null:
              return base_case_value   // базовый случай — первым делом
          left  = solve(node.left)
          right = solve(node.right)
          return combine(node.val, left, right)
      ```
    recommendation: "Прорешать 3-5 задач на деревья, каждый раз начиная с базового случая — войдёт в привычку."

  - id: q2
    text: "Нужно найти диаметр бинарного дерева — длину самого длинного пути между любыми двумя узлами (не обязательно через корень). Каждый узел на обратном пути рекурсии возвращает родителю высоту своего поддерева. Где хранить сам диаметр?"
    type: single
    options:
      - id: a
        text: "В переменной, которую возвращает функция — она и есть диаметр"
        correct: false
        explanation: "Функция возвращает высоту поддерева — величину, нужную родителю для его собственных расчётов, а не готовый диаметр."
      - id: b
        text: "В отдельной переменной вне возвращаемого значения, обновляемой на каждом шаге как сумма высот левого и правого поддеревьев"
        correct: true
        explanation: "Диаметр через конкретный узел — сумма высот его поддеревьев, а не то, что передаётся наверх; его удобно копить отдельно от возвращаемого значения."
      - id: c
        text: "В листе дерева — туда её донесёт рекурсия к моменту завершения обхода"
        correct: false
        explanation: "Диаметр может проходить через любой узел дерева, а не обязательно заканчиваться в конкретном листе — привязка к месту в дереве не имеет смысла."
      - id: d
        text: "Диаметр вычисляется отдельным проходом после того, как посчитаны все высоты"
        correct: false
        explanation: "Работает, но требует второго полного обхода дерева — высоту и диаметр можно и нужно считать за один проход."
    explanation: "То, что функция возвращает родителю (высота поддерева), и то, что является финальным ответом задачи (диаметр), — разные по смыслу величины. Диаметр через текущий узел считается и фиксируется на каждом шаге отдельно от возвращаемого значения."
    topics: [algorithms]
    extended_explanation: |
      Это пример паттерна "снизу вверх" (bottom-up): ответ собирается от
      листьев к корню. Оценка сложности — O(n) по времени (каждый узел
      посещается один раз), O(h) по памяти на стек рекурсии, где h —
      высота дерева.

      ```
      diameter = 0

      function height(node):
          if node == null:
              return 0
          left  = height(node.left)
          right = height(node.right)
          diameter = max(diameter, left + right)   // не то, что возвращается
          return 1 + max(left, right)               // а это — родителю
      ```
    recommendation: "Сравнить с задачей на проверку сбалансированности дерева — тот же паттерн: высота считается снизу вверх, а нарушение баланса фиксируется отдельно на каждом шаге."

  - id: q3
    text: "Нужно проверить, есть ли в бинарном дереве путь от корня до листа, сумма значений на котором равна заданному числу. Какой паттерн подходит лучше?"
    type: single
    options:
      - id: a
        text: "Сначала полностью собрать все пути в список, затем проверить суммы отдельным проходом"
        correct: false
        explanation: "Рабочий, но избыточный вариант — требует дополнительной памяти на хранение всех путей, когда сумму можно проверять по ходу спуска."
      - id: b
        text: "Снизу вверх: на каждом узле возвращать родителю сумму значений своего поддерева"
        correct: false
        explanation: "Сумма поддерева — не то же самое, что сумма конкретного пути от корня до листа; снизу вверх такую сумму по одному пути не восстановить без лишних данных."
      - id: c
        text: "Обход в ширину с очередью, без рекурсии"
        correct: false
        explanation: "Формально применим, но не даёт естественного способа копить сумму именно вдоль конкретного пути от корня, для чего и нужен top-down спуск."
      - id: d
        text: "Сверху вниз: спускаться с накопленной суммой от корня, сравнивать с целью на листе"
        correct: true
        explanation: "Условие завязано именно на путь от корня — значение нужно копить по мере спуска, а не собирать снизу вверх."
    explanation: "Задача требует что-то накапливать или проверять именно на пути от корня к листу — это фреймворк паттерна top-down (сверху вниз): информация (накопленная сумма) передаётся от родителя вниз к детям в процессе спуска."
    topics: [algorithms]
    extended_explanation: |
      Оптимизация: если поддерево уже вернуло true, результат сразу
      пробрасывается наверх без дальнейшего поиска в оставшихся ветвях.
      Оценка сложности — O(n) по времени, O(h) по памяти, аналогично
      bottom-up варианту.

      ```
      function hasPathSum(node, target, sumSoFar):
          if node == null:
              return false
          sumSoFar += node.val
          if node.left == null and node.right == null:   // лист
              return sumSoFar == target
          return hasPathSum(node.left, target, sumSoFar)
              or hasPathSum(node.right, target, sumSoFar)
      ```
    recommendation: "Сравнить с обходом по уровням (BFS-подобный вывод по глубине) — тоже top-down: номер уровня передаётся вниз при спуске."

  - id: q4
    text: "В условии задачи на дерево встречается ключевое слово «путь от корня до листа», по которому нужно что-то посчитать или проверить. Какой паттерн стоит применить в первую очередь?"
    type: single
    options:
      - id: a
        text: "Bottom-up — собрать ответ от листьев к корню"
        correct: false
        explanation: "Bottom-up годится, когда ответ узла зависит от готовых ответов его поддеревьев — а здесь важна именно информация, накопленная по конкретному пути сверху."
      - id: b
        text: "Top-down — передавать накопленное значение вниз по мере спуска"
        correct: true
        explanation: "Формулировки про путь от корня — прямой сигнал: нужно копить или проверять состояние по мере спуска, а это и есть top-down."
      - id: c
        text: "Комбинация двух проходов — сначала bottom-up для высоты, потом top-down для суммы"
        correct: false
        explanation: "Избыточно для задач, где решает один top-down проход — усложнение без необходимости."
      - id: d
        text: "Задачи на деревья всегда решаются одним и тем же универсальным способом, паттерн выбирать не нужно"
        correct: false
        explanation: "Универсального решения нет — выбор между bottom-up и top-down прямо определяется тем, что именно требует условие."
    explanation: "Формулировки, завязанные на путь от корня (сумма, максимум, номер уровня на пути), — сигнал для top-down. Формулировки, где ответ узла строится из уже готовых ответов поддеревьев (высота, диаметр, баланс), — сигнал для bottom-up."
    topics: [algorithms]
    extended_explanation: |
      Общий чек-лист из 4 вопросов для любой задачи на дерево: что
      вернуть для пустого узла? что делаем перед спуском влево/вправо?
      как обрабатываем ответы от обоих поддеревьев? что и сколько
      значений возвращаем родителю? Задачи могут комбинировать оба
      паттерна сразу.
    recommendation: "Прорешать «binary tree maximum path sum» — на ней особенно заметно различие top-down и bottom-up, потому что задача комбинирует оба паттерна сразу."

  - id: q5
    text: "На собеседовании дана задача: в сетке с препятствиями найти кратчайшее расстояние от старта до ближайшего из нескольких возможных финишей, все шаги стоят одинаково. Какой обход подходит?"
    type: single
    options:
      - id: a
        text: "DFS — он проще в реализации через рекурсию"
        correct: false
        explanation: "DFS не гарантирует, что первый найденный путь окажется кратчайшим — он может «провалиться» в длинную ветвь раньше короткой."
      - id: b
        text: "Любой из двух — асимптотика одинаковая, разница не принципиальна"
        correct: false
        explanation: "Асимптотика (O(N+M)) действительно одинаковая, но корректность результата — нет: только BFS даёт гарантию кратчайшего пути в невзвешенном графе."
      - id: c
        text: "BFS — обход в ширину слой за слоем от старта"
        correct: true
        explanation: "При одинаковой стоимости всех шагов BFS гарантированно находит кратчайший путь — он обходит вершины строго по возрастанию расстояния от старта."
      - id: d
        text: "Топологическая сортировка — она определяет порядок посещения вершин"
        correct: false
        explanation: "Топологическая сортировка применяется к ориентированным ациклическим графам зависимостей, а не к поиску кратчайшего расстояния в сетке."
    explanation: "Слово «кратчайшее»/«минимум» в условии — прямой сигнал для BFS. BFS и DFS структурно похожи (очередь против стека/рекурсии) и имеют одинаковую асимптотику O(N+M), но только BFS обходит вершины строго по возрастанию расстояния от старта."
    topics: [algorithms]
    extended_explanation: |
      Важное ограничение: BFS даёт корректный кратчайший путь только
      когда все рёбра имеют одинаковый вес. Если веса рёбер разные,
      нужен другой алгоритм — например, Дейкстра. Оценка для сеточной
      задачи: O(N·M) по времени и памяти, где N и M — размеры поля.
    recommendation: "Прорешать «rotting oranges» или «shortest path in binary matrix» — многоисточниковый BFS на сетке той же формы, что и в вопросе."

  - id: q6
    text: "Дан неориентированный граф в виде списка рёбер. Нужно посчитать число компонент связности. Какой подход применить?"
    type: single
    options:
      - id: a
        text: "Обход из каждой непосещённой вершины с общим множеством visited"
        correct: true
        explanation: "Каждый новый запуск BFS/DFS из непосещённой вершины покрывает ровно одну компоненту целиком — счётчик увеличивается при каждом таком запуске."
      - id: b
        text: "Один общий BFS от произвольной стартовой вершины"
        correct: false
        explanation: "Один обход из одной точки достигнет только вершин её собственной компоненты — остальные компоненты останутся непосещёнными и неучтёнными."
      - id: c
        text: "Отсортировать рёбра и посчитать число уникальных пар вершин"
        correct: false
        explanation: "Число уникальных пар вершин с ребром между ними — не то же самое, что число компонент связности: одна большая компонента может содержать много рёбер."
      - id: d
        text: "Применить алгоритм Кана для подсчёта индегри каждой вершины"
        correct: false
        explanation: "Индегри и топологическая сортировка — понятия ориентированного графа; для подсчёта компонент неориентированного графа они не нужны."
    explanation: "Стандартный паттерн обхода компонент связности: проходим по всем вершинам, из каждой непосещённой запускаем обход с общим visited на все запуски — каждый новый запуск означает новую компоненту."
    topics: [algorithms]
    extended_explanation: |
      Похожая задача — найти площадь наибольшего «острова» в матрице
      0/1 (связная группа единиц при 4-связности): тот же паттерн, но
      вместо простого счётчика компонент на каждом обходе считается
      размер текущей компоненты и обновляется максимум. Оценка: O(N+M)
      по времени, O(N) по памяти.
    recommendation: "Общий фреймворк темы: нужен маршрут/число шагов → BFS; нужно проверить цикл или восстановить порядок → алгоритм Кана; в остальных случаях — обход компонент связности."

  - id: q7
    text: "Граф зависимостей задач: нужно вернуть порядок их выполнения, соблюдающий все зависимости, либо определить, что порядок невозможен из-за цикла. Как это решить через алгоритм Кана?"
    type: single
    options:
      - id: a
        text: "Построить матрицу смежности и найти её транспонирование"
        correct: false
        explanation: "Транспонирование матрицы смежности меняет направление рёбер графа, но само по себе не даёт порядка выполнения зависимостей."
      - id: b
        text: "Запустить DFS от каждой вершины без входящих рёбер и склеить результаты обходов"
        correct: false
        explanation: "DFS не даёт естественного способа гарантировать, что зависимости соблюдены на каждом шаге — для этого и нужен именно учёт индегри."
      - id: c
        text: "Отсортировать вершины по числу исходящих рёбер по убыванию"
        correct: false
        explanation: "Число исходящих рёбер (аутдегри) не определяет порядок выполнения зависимостей — важно именно то, сколько задач блокируют текущую (индегри)."
      - id: d
        text: "Считать индегри каждой вершины и обрабатывать вершины с индегри 0"
        correct: true
        explanation: "Это и есть алгоритм Кана: вершина с индегри 0 не зависит ни от кого невыполненного, поэтому её можно выполнить прямо сейчас, а после обработки соседям уменьшается индегри."
    explanation: "Алгоритм Кана — топологическая сортировка на основе индегри. Вершины с индегри 0 не блокированы ничем и сразу готовы к обработке; при обработке вершины индегри её соседей уменьшается, и освободившиеся добавляются в очередь."
    topics: [algorithms]
    extended_explanation: |
      Проверка цикла — часть того же алгоритма без дополнительного
      прохода: если в конце размер ответа меньше числа вершин, значит
      часть графа осталась заблокированной циклом. Индегри-массив сам
      по себе выполняет роль visited — отдельная структура для
      посещённости не нужна, каждая вершина обрабатывается максимум
      один раз. Оценка: O(N+M) по времени, O(N) по памяти.

      ```
      queue = все вершины с indegree[v] == 0
      order = []
      while queue not empty:
          v = queue.pop()
          order.push(v)
          for neighbor in adj[v]:
              indegree[neighbor] -= 1
              if indegree[neighbor] == 0:
                  queue.push(neighbor)
      // len(order) < N  =>  в графе есть цикл
      ```
    recommendation: "Прорешать классическую задачу «расписание курсов с пререквизитами» — эталонный пример на алгоритм Кана."

  - id: q8
    text: "В графе есть рёбра с разным весом, и нужно найти кратчайший путь между двумя конкретными вершинами. Подойдёт ли обычный BFS?"
    type: single
    options:
      - id: a
        text: "Да, BFS всегда находит кратчайший путь в любом графе"
        correct: false
        explanation: "Это верно только для невзвешенного графа (все рёбра одинаковой стоимости) — при разных весах BFS считает число рёбер, а не суммарный вес пути."
      - id: b
        text: "Нет — BFS корректен только при одинаковом весе всех рёбер, здесь нужен другой алгоритм (например, Дейкстра)"
        correct: true
        explanation: "BFS обходит граф по числу рёбер от старта, что совпадает с кратчайшим путём только когда все рёбра стоят одинаково — при разных весах нужен алгоритм, учитывающий вес рёбер."
      - id: c
        text: "Да, если предварительно отсортировать список смежности по весу рёбер"
        correct: false
        explanation: "Сортировка списка смежности не меняет то, как BFS считает расстояние — он всё равно ориентируется на число пройденных рёбер, а не на их суммарный вес."
      - id: d
        text: "Нет, в этом случае вообще ни один алгоритм не гарантирует нахождение кратчайшего пути"
        correct: false
        explanation: "Гарантированные алгоритмы для взвешенных графов существуют — например, Дейкстра для неотрицательных весов или Беллман-Форд, если веса могут быть отрицательными."
    explanation: "Ключевое ограничение BFS: он корректно находит кратчайший путь только тогда, когда все рёбра графа имеют одинаковый вес. Это стоит проверять в условии задачи явно, а не предполагать по умолчанию."
    topics: [algorithms]
    extended_explanation: |
      Одинаковая структура BFS и DFS (очередь vs стек/рекурсия) и
      одинаковая асимптотика O(N+M) создают ложное ощущение
      взаимозаменяемости — но именно способность корректно находить
      кратчайший путь есть только у BFS, и то с оговоркой про
      одинаковый вес рёбер.
    recommendation: "Алгоритм Дейкстры стоит разобрать именно через призму BFS — как его обобщение на случай, когда шаги стоят по-разному, а не как отдельную независимую тему."

  - id: q9
    text: "Дана матрица 0 и 1, нужно найти площадь наибольшего «острова» — связной группы единиц (4-связность: только по горизонтали и вертикали). Какой паттерн из графовых задач здесь применяется?"
    type: single
    options:
      - id: a
        text: "Обход компонент связности — каждый остров является отдельной компонентой"
        correct: true
        explanation: "Матрица с 4-связностью — это тот же граф, где ячейки-единицы являются вершинами, а соседство по стороне — рёбрами; остров — компонента связности в этом графе."
      - id: b
        text: "Топологическая сортировка — острова упорядочиваются по размеру"
        correct: false
        explanation: "Топологическая сортировка применяется к ориентированным ациклическим графам зависимостей — задача про острова не про порядок и не про зависимости."
      - id: c
        text: "BFS для поиска кратчайшего пути между единицами"
        correct: false
        explanation: "Задаче не нужен кратчайший путь между конкретными клетками — нужен размер связной группы, для чего BFS/DFS используются как инструмент обхода, а не поиска пути."
      - id: d
        text: "Алгоритм Кана для подсчёта индегри каждой клетки"
        correct: false
        explanation: "Индегри имеет смысл только для ориентированных графов — матрица островов представляет неориентированные связи между соседними клетками."
    explanation: "Матрица с 4-связностью — частный случай представления графа: каждая единица — вершина, соседство по стороне — ребро. Задача про острова сводится к стандартному паттерну обхода компонент связности, только с максимизацией размера компоненты вместо их подсчёта."
    topics: [algorithms]
    extended_explanation: |
      На каждом обходе непосещённой единицы запускается BFS или DFS,
      считающий размер текущей компоненты (острова), и обновляется
      глобальный максимум. Оценка сложности та же, что для подсчёта
      компонент: O(N+M) по времени, O(N) по памяти.
    recommendation: "Узнавать сеточные задачи (матрица + соседние клетки) как замаскированные графовые задачи — базовое представление списком смежности для них не нужно, соседство вычисляется по координатам."

  - id: q10
    text: "На собеседовании дают задачу с матрицей: клетка 0 или 1, есть препятствия, нужно найти минимальное число ходов от одной клетки до другой. Какой из двух фреймворков (деревья или графы) и какой конкретно паттерн стоит применить?"
    type: single
    options:
      - id: a
        text: "Фреймворк деревьев, top-down: спускаться с накопленным числом ходов"
        correct: false
        explanation: "Матрица с соседними клетками — это граф общего вида (возможны циклы через возврат), а не дерево, где к каждому узлу ведёт единственный путь от корня."
      - id: b
        text: "Фреймворк графов, кратчайший путь через BFS"
        correct: true
        explanation: "Слово «минимальное число ходов» — прямой сигнал паттерна «кратчайший путь», а сетка с равной стоимостью каждого хода — сигнал именно для BFS, не для Дейкстры."
      - id: c
        text: "Фреймворк графов, топологическая сортировка через алгоритм Кана"
        correct: false
        explanation: "Алгоритм Кана нужен для порядка выполнения зависимостей в ориентированном ациклическом графе, а не для подсчёта минимального числа ходов в сетке."
      - id: d
        text: "Фреймворк деревьев, bottom-up: собирать число ходов от целевой клетки к стартовой"
        correct: false
        explanation: "Bottom-up для деревьев работает, когда есть чёткая иерархия «родитель — потомки»; в сетке с препятствиями и произвольными путями такой иерархии нет."
    explanation: "Первый шаг диагностики задачи — определить, дерево это или граф общего вида (есть ли циклы, единственный ли путь к каждому узлу). Сетка с препятствиями и свободным перемещением в четырёх направлениях — граф общего вида, а «минимальное число ходов» указывает конкретно на паттерн кратчайшего пути через BFS."
    topics: [algorithms]
    extended_explanation: |
      Общий диагностический принцип для всего блока: сначала определить
      структуру данных (дерево — единственный путь от корня к любому
      узлу, граф — возможны множественные пути и циклы), затем — по
      ключевым словам условия выбрать конкретный паттерн внутри
      выбранной структуры.
    recommendation: "Формальное определение дерева (единственный путь от корня, отсутствие циклов) — тот самый критерий, по которому задача на сетке классифицируется как граф, а не как дерево, полезно держать под рукой как чек-лист."

  - id: q11
    text: "Задача просит проверить, является ли бинарное дерево сбалансированным (высоты левого и правого поддерева в каждом узле отличаются не более чем на 1). Какая оценка сложности у решения через рекурсивный подсчёт высоты снизу вверх?"
    type: single
    options:
      - id: a
        text: "O(log n) по времени и памяти, как у сбалансированного бинарного поиска"
        correct: false
        explanation: "O(log n) — оценка операций поиска в уже сбалансированном дереве, а не оценка обхода всех узлов дерева для проверки его баланса."
      - id: b
        text: "O(n²) по времени, так как для каждого узла заново пересчитывается высота обоих поддеревьев"
        correct: false
        explanation: "Так было бы при наивной реализации без переиспользования уже посчитанных высот поддеревьев — правильное bottom-up решение считает высоту каждого узла один раз."
      - id: c
        text: "O(n) по времени, O(1) по памяти — рекурсия не требует дополнительной памяти"
        correct: false
        explanation: "Рекурсия использует стек вызовов, глубина которого равна высоте дерева — это не константная, а O(h) память."
      - id: d
        text: "O(n) по времени, O(h) по памяти, где n — число узлов, h — высота дерева"
        correct: true
        explanation: "Каждый узел посещается ровно один раз для подсчёта своей высоты (O(n)), а глубина стека рекурсии равна высоте дерева (O(h))."
    explanation: "Bottom-up обход дерева (высота или диаметр) даёт линейную по числу узлов сложность по времени и линейную по высоте дерева сложность по памяти на стек рекурсии — стандартная оценка для всех задач этого паттерна."
    topics: [algorithms]
    extended_explanation: |
      В худшем случае (полностью «перекошенное» дерево, фактически
      список) h = n, и память деградирует до O(n). В сбалансированном
      дереве h = log(n), и память заметно меньше — оценка O(h) явно
      зависит от формы конкретного дерева, а не только от числа узлов.
    recommendation: "Оценка памяти стека рекурсии — O(h) через высоту дерева, отдельная от оценки времени O(n) — стоит держать в голове как отдельную формулу, а не выводить каждый раз заново."

  - id: q12
    text: "Какое утверждение о соотношении BFS и DFS для обхода одного и того же графа верно?"
    type: single
    options:
      - id: a
        text: "BFS всегда быстрее DFS асимптотически"
        correct: false
        explanation: "Асимптотика у обоих одинаковая — O(N+M) по времени; разница между ними не в скорости, а в порядке обхода и применимости к поиску кратчайшего пути."
      - id: b
        text: "BFS не подходит для поиска компонент связности, для этого нужен только DFS"
        correct: false
        explanation: "Обход компонент связности одинаково корректно работает и через BFS, и через DFS — оба гарантированно посещают все вершины, достижимые из стартовой."
      - id: c
        text: "DFS требует больше памяти, чем BFS, потому что хранит весь пройденный путь целиком"
        correct: false
        explanation: "Оба используют O(N) памяти в худшем случае — DFS через глубину стека рекурсии, BFS через размер очереди на текущем уровне обхода."
      - id: d
        text: "Асимптотика одинаковая, но только BFS гарантирует кратчайший путь"
        correct: true
        explanation: "Структурно BFS и DFS идентичны (очередь против стека/рекурсии) с одинаковой асимптотикой O(N+M) — различает их именно порядок обхода, из-за которого только BFS гарантированно находит кратчайший путь в невзвешенном графе."
    explanation: "BFS и DFS структурно похожи и имеют одинаковую асимптотику по времени и памяти. Ключевое практическое отличие — BFS обходит вершины строго по возрастанию расстояния от старта, что и даёт ему монополию на гарантированный кратчайший путь в невзвешенном графе; для остальных задач (обход, компоненты связности) годятся оба."
    topics: [algorithms]
    extended_explanation: |
      На практике BFS часто предпочтительнее DFS даже там, где годятся
      оба, из-за меньшего фактического потребления памяти — глубокая
      рекурсия DFS на большом графе рискует переполнить стек вызовов,
      тогда как очередь BFS растёт более предсказуемо.
    recommendation: "Не выбирать между BFS и DFS «по привычке» — сначала проверить, требует ли задача именно кратчайший путь."

  - id: q13
    text: "В задаче на дерево нужно посчитать сумму значений всех узлов на пути от корня до самого глубокого листа. Какая деталь top-down паттерна здесь ключевая?"
    type: single
    options:
      - id: a
        text: "Накопленное значение (частичная сумма) передаётся вниз как параметр рекурсивного вызова"
        correct: true
        explanation: "Top-down паттерн именно про передачу состояния (здесь — накопленной суммы) от родителя к детям по мере спуска — на листе это состояние сравнивается или используется для финального ответа."
      - id: b
        text: "Каждый узел независимо считает сумму заново с нуля, без передачи состояния"
        correct: false
        explanation: "Пересчёт с нуля на каждом узле — избыточная работа: сумма пути легко накапливается по ходу спуска без повторных проходов."
      - id: c
        text: "Сумма вычисляется постфактум одним обходом после того, как дерево полностью построено в памяти"
        correct: false
        explanation: "Дерево не нужно перестраивать отдельно — сумма считается в процессе одного обычного рекурсивного обхода."
      - id: d
        text: "Используется глобальная переменная, инкрементируемая при каждом посещении узла, независимо от конкретного пути"
        correct: false
        explanation: "Простой глобальный счётчик не различает разные пути в дереве — нужна именно сумма вдоль конкретной ветви от корня к текущему узлу."
    explanation: "Top-down паттерн определяется тем, что информация (в данном случае накопленная сумма) передаётся именно вниз по дереву как параметр рекурсии, а не собирается снизу вверх из готовых ответов поддеревьев."
    topics: [algorithms]
    extended_explanation: |
      Отличие от похожей на первый взгляд задачи «максимальная сумма
      пути между двумя произвольными узлами» (не обязательно от корня)
      — та решается через bottom-up, аналогично диаметру дерева, потому
      что путь не привязан к корню и требует сравнения сумм слева и
      справа на каждом узле.
    recommendation: "Общий фреймворк «два вопроса для любой задачи на дерево» (что вернуть для пустого узла, что вернуть с учётом ответов поддеревьев) объясняет, откуда top-down берётся в чистом виде — стоит держать его как отправную точку для любой новой задачи."

  - id: q14
    text: "При построении списка смежности для неориентированного графа с ребром между вершинами A и B — что нужно сделать?"
    type: single
    options:
      - id: a
        text: "Добавить B в список соседей A и A в список соседей B — ребро добавляется дважды, в обе стороны"
        correct: true
        explanation: "В неориентированном графе ребро A–B означает, что из A можно попасть в B и наоборот — оба направления должны быть отражены в списке смежности."
      - id: b
        text: "Добавить только B в список соседей A — обхода через список смежности достаточно в одну сторону"
        correct: false
        explanation: "Так строится список смежности для ориентированного графа с ребром A→B; для неориентированного графа обход из B к A через такую структуру не найдёт ребро."
      - id: c
        text: "Создать отдельную вершину для самого ребра A–B и связать её с обеими исходными вершинами"
        correct: false
        explanation: "Это описывает другую структуру данных (граф инцидентности) — стандартный список смежности не требует создания дополнительных вершин для рёбер."
      - id: d
        text: "Добавить ребро только если A меньше B по какому-то порядку, чтобы избежать дублирования"
        correct: false
        explanation: "Такая оптимизация ломает саму идею списка смежности — обход из вершины должен видеть всех её соседей напрямую, без дополнительной проверки порядка."
    explanation: "Список смежности — хеш-таблица, где каждой вершине соответствует список её соседей. Для неориентированного графа каждое ребро логически двунаправленно, поэтому его нужно добавить в обе стороны; для ориентированного графа — только один раз, в направлении ребра."
    topics: [algorithms]
    extended_explanation: |
      Ошибка «забыл добавить ребро в обе стороны» — частая причина,
      когда BFS/DFS из одной вершины неожиданно не находит соседнюю
      вершину, хотя формально ребро между ними существует в условии
      задачи.
    recommendation: "Различие между списком смежности ориентированного и неориентированного графа объясняет самую частую причину, по которой BFS/DFS не находит существующее по условию ребро — стоит проверить на конкретном примере с обоими вариантами."

  - id: q15
    text: "Чем структура «дерево» принципиально отличается от «графа общего вида» с точки зрения выбора паттерна обхода?"
    type: single
    options:
      - id: a
        text: "В дереве нет разницы между top-down и bottom-up, эти паттерны существуют только для графов"
        correct: false
        explanation: "Наоборот — top-down и bottom-up являются паттернами именно для деревьев (обход снизу вверх/сверху вниз по иерархии); для графов общего вида используются другие паттерны — BFS, DFS, топологическая сортировка."
      - id: b
        text: "Дерево обходится только через DFS, а граф общего вида — только через BFS"
        correct: false
        explanation: "Оба типа структур можно обходить и BFS, и DFS — выбор конкретного обхода определяется условием задачи (нужен ли кратчайший путь), а не самим фактом «дерево или граф»."
      - id: c
        text: "В дереве нет циклов и к узлу ведёт единственный путь; в графе циклы возможны, поэтому нужен явный visited"
        correct: true
        explanation: "Отсутствие циклов и единственность пути от корня — определяющее свойство дерева, которое избавляет рекурсивный обход от необходимости хранить visited; граф общего вида без этой гарантии обязан отслеживать посещённость, иначе обход зациклится."
      - id: d
        text: "Граф общего вида всегда требует больше памяти асимптотически, чем дерево того же числа вершин"
        correct: false
        explanation: "Асимптотика обхода в обоих случаях O(N+M) — дерево лишь частный случай графа с M = N-1 рёбер; асимптотический порядок памяти не меняется качественно, разница в необходимости отслеживать посещённость."
    explanation: "Дерево — частный случай графа: связный граф без циклов, где к каждой вершине из корня ведёт единственный путь. Именно из-за этого свойства рекурсивный обход дерева не нуждается в отдельной структуре visited — попасть повторно в уже посещённый узел структурно невозможно. Граф общего вида такой гарантии не даёт, поэтому обход компонент связности и BFS/DFS в графе обязаны явно отслеживать посещённые вершины, чтобы не зациклиться."
    topics: [algorithms]
    extended_explanation: |
      Это объясняет, почему паттерны для деревьев (top-down/bottom-up)
      и паттерны для графов (BFS/DFS, компоненты связности,
      топологическая сортировка) формально разные, хотя оба используют
      рекурсию или очередь в основе: дерево — это уже гарантированно
      ациклическая, односвязная структура, и обход рассчитан именно на
      эту гарантию.
    recommendation: "Формальное определение дерева как частного случая графа (связный, без циклов, M = N-1 рёбер) объясняет, почему у деревьев нет отдельной структуры visited — им стоит закрывать эту тему."
