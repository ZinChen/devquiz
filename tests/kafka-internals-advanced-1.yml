        correct: true
        explanation: "Эта метрика напрямую считает партиции, у которых текущий ISR меньше настроенного replication factor — то есть хотя бы одна реплика отстала и временно не считается синхронизированной. Устойчивый рост указывает на системную проблему: перегруженные диски, сеть или недостаточные ресурсы одного или нескольких брокеров."
      - id: b
        text: "Кластер получает больше записей, чем может обработать в единицу времени, и начинает терять сообщения"
        correct: false
        explanation: "Метрика отслеживает синхронизацию реплик между собой — прямой связи с потерей или отбрасыванием входящих записей у неё нет."
      - id: c
        text: "Consumer group не успевает вычитывать сообщения, и растёт consumer lag"
        correct: false
        explanation: "Отставание консюмеров при чтении измеряет отдельная метрика consumer lag — разница между записанным и прочитанным offset."
      - id: d
        text: "Диски брокеров близки к заполнению, и скоро начнётся удаление старых сегментов раньше срока retention"
        correct: false
        explanation: "Заполнение дисков отслеживается отдельными метриками использования диска — эта метрика посвящена именно синхронизации реплик."
    explanation: "UnderReplicatedPartitions — одна из ключевых метрик здоровья кластера именно потому, что напрямую показывает партиции, чей ISR не соответствует требуемой избыточности: устойчивый рост означает, что кластер накапливает риск потери данных при следующем сбое, поскольку часть партиций фактически защищена меньшим числом синхронных копий, чем задумано."
    extended_explanation: "Первое, что стоит проверить при её росте — не один ли конкретный брокер является общим знаменателем у отстающих партиций: если да, проблема локализована (диск, сеть, перегрузка этого узла), а не распределена по всему кластеру равномерно."
    recommendation: "Настроить алерт на UnderReplicatedPartitions и разобрать типичные причины его срабатывания."
    difficulty: medium
    topics: [messaging, observability]

  - id: q20
    text: "Одна партиция топика получает заметно больше трафика, чем остальные (hot partition), хотя число консюмеров в группе достаточно. Какая из причин наиболее вероятна?"
    type: single
    options:
      - id: a
        text: "Ключ партиционирования сообщений распределён неравномерно — например, большая доля событий приходится на один и тот же ключ"
        correct: true
        explanation: "Партиционирование по ключу детерминировано: одинаковый ключ всегда попадает в одну и ту же партицию. Если в реальных данных один ключ (например, крупный клиент, популярный товар) встречается значительно чаще остальных, вся его нагрузка стабильно концентрируется на одной партиции независимо от того, сколько консюмеров готовы её обрабатывать."
      - id: b
        text: "Consumer group неправильно настроена и игнорирует часть партиций топика, из-за чего нагрузка стягивается на оставшиеся"
        correct: false
        explanation: "Игнорирование части партиций группой проявлялось бы растущим лагом именно на пропущенных партициях."
      - id: c
        text: "Reassignment партиций запускается слишком часто и постоянно переносит эту партицию между брокерами без остановки"
        correct: false
        explanation: "Reassignment — редкая ручная или полуавтоматическая операция, которая не создаёт постоянный повышенный трафик в конкретную партицию."
      - id: d
        text: "У партиции ниже replication factor, чем у остальных, поэтому она обрабатывает записи заметно быстрее соседних"
        correct: false
        explanation: "Replication factor одинаков для всех партиций одного топика — он не назначается индивидуально по партициям и не ускоряет обработку записи."
    explanation: "Дополнительный параллелизм консюмеров не помогает, если нагрузка изначально сконцентрирована на одной партиции самим ключом партиционирования — увеличение числа консюмеров группы позволит параллельно читать разные партиции, но не ускорит обработку одной перегруженной. Решение обычно лежит на стороне продюсера: пересмотр ключа партиционирования, добавление соли к горячим ключам, либо явный кастомный партиционер."
    extended_explanation: "Изменение схемы партиционирования для уже существующего топика не решает проблему для уже написанных данных — новый ключ или соль применяются только к новым сообщениям, поэтому такие изменения планируют заранее, а не как реакцию на уже накопленный перекос."
    recommendation: "Разобрать паттерны борьбы с горячими партициями: соление ключа, кастомные партиционеры, изменение гранулярности ключа."
    difficulty: hard
    topics: [messaging, performance]

  - id: q21
    text: "Чем `cleanup.policy=compact` принципиально отличается от `cleanup.policy=delete` в поведении сегментов партиции?"
    type: single
    options:
      - id: a
        text: "delete применяется только к compacted-топикам с явным ключом, а compact — единственный доступный режим для топиков вообще без ключа"
        correct: false
        explanation: "Ключ у записи не обязателен ни для delete, ни для compact — но без ключа compaction теряет смысл, так как ему не по чему группировать версии записей."
      - id: b
        text: "compact хранит только последнюю запись по ключу независимо от возраста; delete удаляет сегменты по retention, не глядя на ключи"
        correct: true
        explanation: "compact работает по ключу: из старых сегментов вычищаются записи, для чьего ключа существует более свежая запись, а сама свежая остаётся сколь угодно долго. delete же ничего не знает про ключи — он просто отбрасывает целиком сегменты старше retention.ms или превышающие retention.bytes."
      - id: c
        text: "compact полностью отключает удаление данных с диска, delete — единственная политика, реально освобождающая занятое место"
        correct: false
        explanation: "Compaction тоже освобождает место на диске — он убирает устаревшие версии по ключу, просто критерий удаления другой, не возраст записи."
      - id: d
        text: "Обе политики делают ровно одно и то же, разница лишь в названии параметра ради совместимости со старыми версиями Kafka"
        correct: false
        explanation: "Разница не номинальная: delete и compact применяют принципиально разные критерии отбора записей на удаление."
    explanation: "Это два разных ответа на вопрос «какие данные больше не нужны». delete ориентируется на возраст или объём — хранить события ровно N дней или до N гигабайт, вне зависимости от их содержимого. compact ориентируется на актуальность по ключу — хранить только последнее известное состояние каждого ключа, сколько бы времени ни прошло, что типично для changelog-топиков (например, KTable в Kafka Streams) или топиков-снапшотов состояния сущности."
    extended_explanation: "Топик с delete годится для потока событий, где важна вся история («заказ создан», «оплачен», «отправлен»). Топик с compact годится для хранения текущего состояния («профиль пользователя сейчас выглядит так») — читать его с начала означает восстановить актуальный снапшот всех ключей, а не всю историю изменений."
    recommendation: "Сравнить typical use case: событийный лог (delete) vs витрина последнего состояния (compact)."
    difficulty: medium
    topics: [messaging]

  - id: q22
    text: "В compacted-топике продюсер публикует запись с ключом `user-42` и значением `null`. Что произойдёт с этой записью и с предыдущими записями того же ключа?"
    type: single
    options:
      - id: a
        text: "Брокер отклонит эту запись с ошибкой — значение `null` вообще не разрешено в топике с `cleanup.policy=compact`"
        correct: false
        explanation: "Запись с null-значением — легитимная часть протокола compaction, а не ошибка формата."
      - id: b
        text: "Запись игнорируется брокером и нигде не сохраняется — хранить пустое значение попросту физически нечего"
        correct: false
        explanation: "Tombstone физически записывается в лог партиции — именно её последующее присутствие в логе и позволяет консюмерам узнать об удалении ключа."
      - id: c
        text: "Все предыдущие записи `user-42` удаляются с диска сразу в момент записи tombstone, ещё до следующего цикла compaction"
        correct: false
        explanation: "Физическое удаление старых версий ключа происходит не мгновенно в момент записи, а при следующем проходе compaction по сегменту."
      - id: d
        text: "Это tombstone-маркер: он помечает ключ удалённым, ранние записи `user-42` со временем вычистит compaction, а сам маркер проживёт до `delete.retention.ms`"
        correct: true
        explanation: "Запись с value=null называется tombstone. Compaction использует её как сигнал «этот ключ больше не актуален» — вычищает все предыдущие значения ключа, но саму tombstone-запись оставляет ещё на delete.retention.ms, чтобы консюмеры, читающие топик с задержкой, успели увидеть факт удаления, а не просто не нашли ключ."
    explanation: "Tombstone — единственный способ выразить «удали историю этого ключа» в модели compaction, где обычно ничего не удаляется по возрасту. Раз consumer может отставать и не увидеть запись сразу после её появления, брокер не может стереть tombstone мгновенно — он живёт delete.retention.ms специально для того, чтобы отставший читатель успел получить сигнал удаления, а не тихую пустоту."
    extended_explanation: "Слишком маленький delete.retention.ms рискует тем, что медленный consumer пропустит tombstone и будет считать устаревшее значение ключа всё ещё актуальным — поэтому его подбирают исходя из максимально ожидаемого отставания читателей, а не произвольно."
    recommendation: "Прочитать про паттерн удаления записи в KTable через null-значение в Kafka Streams."
    difficulty: hard
    topics: [messaging]

  - id: q23
    text: "Топик-changelog с `cleanup.policy=compact` получает подряд три записи с ключом `order-7`: сначала статус `created`, затем `paid`, затем `shipped`. Никаких записей с другими ключами не было. Что прочитает новый consumer, запустившийся с начала топика после того, как compaction успел пройти по этому сегменту?"
    type: single
    options:
      - id: a
        text: "Все три записи по порядку — `created`, `paid`, `shipped` — так как compaction не трогает записи внутри одного цикла публикации"
        correct: false
        explanation: "Compaction ориентируется исключительно на ключ записи, а не на то, из одной ли пачки публикации записи пришли — все три версии ключа order-7 равноценны кандидатам на вычищение старых из них."
      - id: b
        text: "Одну запись — `order-7` → `shipped` — только последнее значение ключа, а `created` и `paid` вычищены как устаревшие версии"
        correct: true
        explanation: "Compaction оставляет по каждому ключу ровно одну, самую свежую запись. Раз все три записи были для одного и того же ключа order-7, после прохода compaction в сегменте останется только последняя из них — shipped, а created и paid будут вычищены как устаревшие версии того же ключа."
      - id: c
        text: "Только первую запись — `created` — так как compaction сохраняет самую раннюю версию ключа, а не самую позднюю"
        correct: false
        explanation: "Compaction сохраняет именно последнюю по времени запись ключа, а не первую — иначе changelog никогда не отражал бы актуальное состояние."
      - id: d
        text: "Ни одной записи — три подряд идущих записи одного ключа считаются конфликтом версий и обнуляются целиком"
        correct: false
        explanation: "Compaction не считает несколько версий одного ключа конфликтом и не обнуляет их — она детерминированно оставляет ровно одну, последнюю."
    explanation: "Это ровно та модель, ради которой существует compaction: топик-changelog должен после сжатия отражать текущее состояние, а не полную историю. Три записи одного ключа — это три последовательных обновления одной и той же сущности заказа order-7, и после compaction в логе остаётся только её актуальный статус."
    extended_explanation: "Если бы вместо трёх обновлений одного ключа в топик пришли записи с разными ключами (order-7, order-8, order-9), compaction не тронула бы ни одну из них — вычищаются только старые версии повторяющегося ключа, а не записи вообще."
