        correct: false
        explanation: "В любой момент времени активным контроллером кластера является ровно один узел — в этом и заключается смысл его выборов."
      - id: d
        text: "Роль, которую вручную назначает администратор кластера при каждом изменении топологии через конфигурационный файл"
        correct: false
        explanation: "Выбор контроллера — полностью автоматический процесс, идущий через кворумный механизм без участия администратора."
    explanation: "Контроллер — центральная точка принятия административных решений о состоянии кластера: он видит, какие брокеры живы, инициирует переизбрание лидеров партиций при сбоях, обрабатывает создание и удаление топиков. Чтобы не было конфликтующих решений от нескольких узлов одновременно, в кластере в любой момент активен только один контроллер, выбираемый через тот же кворумный механизм, что защищает от split-brain."
    extended_explanation: "При падении текущего контроллера кворумный механизм выбирает нового практически сразу — задержка здесь не в самих выборах, а в том, сколько времени новому контроллеру требуется, чтобы восстановить актуальную картину состояния кластера и начать принимать решения."
    recommendation: "Проследить путь события в кластере от падения брокера до переизбрания лидеров его партиций контроллером."
