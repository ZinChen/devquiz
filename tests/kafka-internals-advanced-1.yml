slug: kafka-internals-advanced-1
title: "Kafka изнутри"
description: "Брокеры, репликация, ISR, партиционирование, кворум и cleanup policy — как Kafka работает изнутри как распределённая система."
tags: [platform, kafka, backend, claude-gen]
difficulty: expert
estimated_time: 30

questions:

  # ── Брокеры и кластер ────────────────────────────────────────────────────

  - id: q1
    text: "Зачем каждому брокеру в кластере Kafka присваивают уникальный `broker.id`?"
    type: single
    options:
      - id: a
        text: "Он используется клиентами для аутентификации при подключении к кластеру"
        correct: false
        explanation: "Аутентификация клиентов настраивается отдельно (SASL, mTLS) и с broker.id не связана."
      - id: b
        text: "Он определяет порядок, в котором брокер получает реплики новых партиций"
        correct: false
        explanation: "Распределение партиций между брокерами определяет отдельный алгоритм назначения, не порядковый номер broker.id."
      - id: c
        text: "Он нужен только для сортировки брокеров в выводе административных команд"
        correct: false
        explanation: "Broker.id используется в реальных операциях протокола — выборе лидера, составе ISR — а не только в выводе консольных команд."
      - id: d
        text: "По нему брокер идентифицируется в метаданных кластера независимо от хоста и порта"
        correct: true
        explanation: "Хост и порт брокера могут поменяться при перезапуске на другой машине, а broker.id — постоянный идентификатор, на который ссылаются метаданные о лидерах партиций и составе ISR."
    explanation: "Метаданные кластера (какой брокер лидер какой партиции, кто входит в ISR) ссылаются на брокеров по broker.id, а не по сетевому адресу. Это позволяет брокеру вернуться в кластер под тем же id после перезапуска или переезда на другой хост, и остальные узлы корректно свяжут его с уже известной историей партиций."
    extended_explanation: "На практике broker.id либо задают явно в конфиге, либо (в новых версиях) генерируют автоматически и сохраняют в файле метаданных на диске брокера — именно поэтому потеря диска брокера без бэкапа meta.properties усложняет его возврат в кластер под прежним id."
    recommendation: "Посмотреть формат meta.properties и то, как broker.id соотносится с записями в кластерных метаданных."
    difficulty: medium
    topics: [messaging]

  - id: q2
    text: "Брокер, который был лидером для нескольких партиций, падает. Что происходит с этими партициями?"
    type: single
    options:
      - id: a
        text: "Партиции становятся недоступны для записи до перезапуска упавшего брокера"
        correct: false
        explanation: "Недоступность до перезапуска лидера — то, чего кворумный механизм Kafka как раз избегает при наличии живых реплик в ISR."
      - id: b
        text: "Контроллер кластера назначает нового лидера из реплик, входивших в ISR партиции"
        correct: true
        explanation: "Контроллер отслеживает живость брокеров и при обнаружении падения переизбирает лидеров партиций из состава их ISR, обновляя метаданные для клиентов."
      - id: c
        text: "Продюсеры автоматически переключаются на запись в любую живую реплику как во временного лидера"
        correct: false
        explanation: "Реплика не назначает себя лидером самостоятельно — выбор нового лидера проходит через контроллер кластера."
      - id: d
        text: "Партиции переносятся на другой брокер вместе со всеми накопленными данными"
        correct: false
        explanation: "Данные партиции не переносятся при смене лидера — они уже реплицированы заранее на других брокерах, меняется только то, какая из существующих реплик считается лидером."
    explanation: "Kafka не переживает падение лидера простоем партиции: контроллер кластера видит потерю брокера через механизм хартбитов и назначает новым лидером одну из реплик, которая была в ISR на момент падения — то есть гарантированно имела все подтверждённые записи."
    extended_explanation: "Скорость переключения ограничена не столько самим выбором лидера, сколько временем, за которое остальные брокеры и клиенты узнают об изменении метаданных — на это влияют настройки session.timeout и частота обновления метаданных на стороне продюсеров и консюмеров."
    recommendation: "Разобрать роль контроллера в жизненном цикле партиции и что такое leader epoch."
    difficulty: medium
    topics: [messaging]

  - id: q3
    text: "Продюсер публикует сообщение в топик с несколькими партициями на разных брокерах. Как он узнаёт, к какому именно брокеру подключаться для конкретной партиции?"
    type: single
    options:
      - id: a
        text: "Bootstrap-брокер пересылает запрос дальше по цепочке брокеров, пока сообщение не дойдёт до лидера партиции"
        correct: false
        explanation: "Пересылка сообщений между брокерами по запросу клиента добавила бы лишний сетевой прыжок и точку отказа — вместо этого клиент сам обращается к нужному брокеру."
      - id: b
        text: "Каждый брокер в bootstrap-списке заранее закреплён за определённым диапазоном номеров партиций топика"
        correct: false
        explanation: "Bootstrap-список служит лишь набором точек входа для первого подключения, реальную карту партиций клиент получает через метаданные."
      - id: c
        text: "Подключается к любому брокеру из bootstrap-списка и запрашивает у него актуальные метаданные о лидерах партиций"
        correct: true
        explanation: "Bootstrap-брокер служит только точкой входа: он возвращает клиенту карту партиций и их текущих лидеров, а дальше клиент обращается к нужным брокерам напрямую."
      - id: d
        text: "Первый брокер, к которому подключился продюсер, автоматически становится лидером для всех его последующих записей"
        correct: false
        explanation: "Лидер партиции фиксируется назначением реплик ещё при создании топика, задолго до подключения конкретного продюсера."
    explanation: "Bootstrap-серверы в конфиге клиента — не список всех брокеров, а лишь стартовая точка. Клиент запрашивает у одного из них метаданные кластера (какие партиции у топика и кто их текущий лидер) и кэширует эту карту, обновляя её по мере необходимости — например, после переизбрания лидера."
    extended_explanation: "Поэтому в bootstrap.servers достаточно указать 2-3 брокера, даже если кластер состоит из десятков — их единственная задача дожить до момента, когда клиент получит полные метаданные, дальше он работает с кластером напрямую."
    recommendation: "Прочитать про Metadata API и то, как клиент Kafka обновляет карту партиций при ребалансировке."
    difficulty: easy
    topics: [messaging]

  # ── Репликация и ISR ─────────────────────────────────────────────────────

  - id: q4
    text: "Топик создан с `replication factor = 3`. Что это гарантирует?"
    type: single
    options:
      - id: a
        text: "Каждая партиция топика хранится в трёх экземплярах на разных брокерах"
        correct: true
        explanation: "Replication factor — это число копий данных партиции. При падении одного или даже двух брокеров (если они не пересекаются с ISR) данные остаются доступны на оставшихся репликах."
      - id: b
        text: "Запись подтверждается продюсеру только после её применения на всех трёх репликах"
        correct: false
        explanation: "Такое поведение задаётся отдельной настройкой acks на стороне продюсера — replication factor определяет только число копий данных."
      - id: c
        text: "Топик автоматически переживёт потерю любых трёх брокеров кластера одновременно"
        correct: false
        explanation: "Три копии данных защищают от потери максимум двух реплик конкретной партиции — реплики этой партиции могут находиться лишь на части брокеров кластера."
      - id: d
        text: "Чтение сообщений равномерно распределяется между всеми тремя репликами"
        correct: false
        explanation: "Чтение по умолчанию идёт только с лидера партиции — распределение чтения между репликами требует отдельной настройки (fetch from follower)."
    explanation: "Replication factor определяет количество физических копий каждой партиции топика, размещённых на разных брокерах. Это защита от потери данных при падении брокера, а не гарантия подтверждения записи всем репликам — за это отвечает отдельная настройка acks на продюсере."
    extended_explanation: "Replication factor выбирают нечётным (обычно 3) не из-за голосования большинством, как в Raft-подобных протоколах — Kafka использует ISR, а не кворумное голосование по каждой записи, — а как практический баланс между устойчивостью к отказам и объёмом хранимых копий."
    recommendation: "Разобрать разницу между replication factor и настройками acks / min.insync.replicas."
    difficulty: medium
    topics: [messaging]

  - id: q5
    text: "Что такое In-Sync Replicas (ISR) партиции?"
    type: single
    options:
      - id: a
        text: "Все реплики партиции, независимо от того, насколько они отстают от лидера"
        correct: false
        explanation: "Отставшая сверх допустимого времени реплика исключается из ISR — не все реплики автоматически входят в это множество."
      - id: b
        text: "Множество реплик, включая лидера, которые не отстают от лидера дольше допустимого времени"
        correct: true
        explanation: "ISR — это лидер плюс те фолловеры, которые успевают забирать записи лидера в пределах replica.lag.time.max.ms. Реплика, отставшая сильнее, временно исключается из ISR до того, как догонит лидера."
      - id: c
        text: "Только лидер партиции — остальные реплики считаются резервными и в ISR не входят"
        correct: false
        explanation: "ISR как раз про фолловеров: лидер туда входит по определению, а смысл множества — в том, какие фолловеры реплики достаточно свежие."
      - id: d
        text: "Реплики, физически расположенные в одном дата-центре с лидером"
        correct: false
        explanation: "Принадлежность к ISR определяется исключительно скоростью синхронизации реплики с лидером во времени."
    explanation: "ISR — динамическое множество: реплика попадает туда, когда синхронизирована с лидером, и выпадает, если начинает отставать (медленный диск, сетевые проблемы, перегрузка). От размера ISR в моменте записи зависит, сколько реплик реально подтвердили сообщение при acks=all."
    extended_explanation: "Именно изменчивость ISR делает метрику UnderReplicatedPartitions (партиции, где ISR меньше replication factor) одной из ключевых для мониторинга — она сигнализирует о деградации задолго до реальной потери данных."
    recommendation: "Изучить параметр replica.lag.time.max.ms и то, как часто на практике реплики выпадают и возвращаются в ISR."
    difficulty: hard
    topics: [messaging]

  - id: q6
    text: "Продюсер публикует с `acks=all`, у топика `min.insync.replicas=2` при replication factor 3. ISR партиции в моменте записи состоит только из лидера. Что произойдёт?"
    type: single
    options:
      - id: a
        text: "Запись пройдёт успешно, так как лидер всегда способен подтвердить сообщение самостоятельно"
        correct: false
        explanation: "acks=all требует подтверждения от достаточного числа реплик ISR — иначе сама настройка min.insync.replicas была бы бессмысленной."
      - id: b
        text: "Запись пройдёт, но будет автоматически реплицирована на отставшие реплики позже"
        correct: false
        explanation: "При недостаточном ISR брокер сразу отклоняет запись — отложенной репликации задним числом здесь не предусмотрено."
      - id: c
        text: "Продюсер получит ошибку NotEnoughReplicas, потому что ISR меньше min.insync.replicas"
        correct: true
        explanation: "min.insync.replicas задаёт минимальный размер ISR, при котором запись с acks=all вообще может быть подтверждена. Раз в ISR всего одна реплика (лидер), а требуется минимум две, брокер отклоняет запись, не рискуя данными."
      - id: d
        text: "Kafka временно снизит min.insync.replicas до фактического размера ISR"
        correct: false
        explanation: "min.insync.replicas — статическая настройка топика, брокер не подстраивает её под текущее состояние ISR."
    explanation: "Эта комбинация настроек — стандартный способ выбрать между доступностью и надёжностью. min.insync.replicas говорит: «не подтверждай запись, если гарантированных копий меньше N», и при недостаточном ISR продюсер получает явную ошибку вместо тихой потери устойчивости к отказам."
    extended_explanation: "Цена этой гарантии — доступность: если reliability важнее uptime (финансовые события, платежи), недостаточный ISR должен именно блокировать запись, а не молча ослаблять гарантии — что и обеспечивает эта пара настроек."
    recommendation: "Прочитать про комбинации acks и min.insync.replicas и их влияние на доступность записи."
    difficulty: hard
    topics: [messaging]

  - id: q7
    text: "Что делает `unclean.leader.election.enable=true` и почему эта настройка по умолчанию выключена в современных версиях Kafka?"
    type: single
    options:
      - id: a
        text: "Ускоряет процесс выбора лидера за счёт пропуска проверки состава ISR"
        correct: false
        explanation: "Настройка не про скорость выбора, а про то, разрешено ли выбирать лидера из реплик, заведомо не синхронизированных полностью."
      - id: b
        text: "Разрешает нескольким репликам одновременно быть лидером партиции для балансировки нагрузки"
        correct: false
        explanation: "У партиции Kafka всегда ровно один лидер в любой момент времени — эта настройка не создаёт множественное лидерство."
      - id: c
        text: "Позволяет продюсеру самому выбирать, на какую реплику писать в обход текущего лидера"
        correct: false
        explanation: "Настройка находится на стороне брокера и управляет тем, разрешает ли контроллер выбор лидера вне ISR."
      - id: d
        text: "Позволяет выбрать лидером реплику вне ISR, что может привести к потере уже подтверждённых сообщений"
        correct: true
        explanation: "Если все реплики ISR недоступны, эта настройка позволяет выбрать лидером отставшую реплику вне ISR, чтобы вернуть партицию в рабочее состояние — ценой потери записей, которые были на упавших ISR-репликах, но не успели попасть на эту отставшую."
    explanation: "Когда все реплики ISR партиции недоступны одновременно, у кластера есть выбор: оставить партицию недоступной для записи до восстановления хотя бы одной ISR-реплики, или разрешить выбрать лидером отставшую реплику вне ISR ценой потери части данных. Unclean leader election — это второй вариант, приоритет доступности над полнотой данных."
    extended_explanation: "По умолчанию выключено именно потому, что тихая потеря данных обычно хуже временной недоступности партиции — команда должна осознанно включать это для конкретных топиков, где доступность важнее, а не как общую политику кластера."
    recommendation: "Разобрать компромисс CAP применительно к настройкам Kafka: что теряется при выборе доступности."
    difficulty: hard
    topics: [messaging, concurrency]

  - id: q8
    text: "Реплика партиции физически жива и подключена к сети, но не входит в ISR. Какая из причин наиболее вероятна?"
    type: single
    options:
      - id: a
        text: "У реплики другой broker.id, чем у лидера, из-за чего она не проходит проверку принадлежности к тому же кластеру"
        correct: false
        explanation: "Broker.id у всех реплик разный по определению — это не критерий принадлежности к ISR."
      - id: b
        text: "Реплика находится в другом сетевом сегменте кластера, и брокеры исключают из ISR всё, что физически не в одной подсети с лидером"
        correct: false
        explanation: "ISR определяется временной синхронизацией с лидером — сетевая топология влияет на это лишь косвенно, через задержки."
      - id: c
        text: "На реплике включена другая политика retention, чем на лидере, и рассинхронизация настроек топика выбивает её из ISR"
        correct: false
        explanation: "Retention применяется одинаково для всех реплик партиции — рассинхронизация этой настройки между репликами не предусмотрена протоколом."
      - id: d
        text: "Реплика не успевает вычитывать записи с лидера быстрее допустимого лага и временно выпадает из ISR"
        correct: true
        explanation: "Реплика выпадает из ISR, когда отстаёт от лидера дольше replica.lag.time.max.ms — например, из-за медленного диска, перегруженной сети или GC-паузы на своём брокере, замедляющей обработку fetch-запросов."
    explanation: "ISR — не про доступность реплики в сети вообще, а про то, успевает ли она получать и применять записи лидера в реальном времени. Живая, но перегруженная реплика (тормозит диск, забита очередь fetch-запросов, идёт долгая GC-пауза) выпадет из ISR даже при полностью исправной сети."
    extended_explanation: "Диагностика такого отставания обычно начинается с метрики ReplicaFetcherManager и логов брокера-фолловера — там видно, растёт ли лаг постепенно (перегрузка) или скачком (сетевой сбой или пауза процесса)."
    recommendation: "Посмотреть, какие метрики Kafka сигнализируют об отставании реплик до того, как это станет проблемой."
    difficulty: medium
    topics: [messaging]

  # ── Партиционирование и распределение ────────────────────────────────────

  - id: q9
    text: "Почему для топика не стоит выбирать число партиций «с большим запасом на будущее»?"
    type: single
    options:
      - id: a
        text: "Kafka ограничивает суммарное число партиций во всём кластере жёстким лимитом в 1000 — при превышении брокер просто отклоняет создание новых"
        correct: false
        explanation: "Жёсткого лимита в 1000 партиций нет — практические ограничения нарастают постепенно вместе с их числом."
      - id: b
        text: "Каждая партиция — это файлы на диске и накладные расходы на репликацию, метаданные и открытые файловые дескрипторы на каждом брокере"
        correct: true
        explanation: "Партиции не бесплатны: больше партиций — больше файлов, больше нагрузка на контроллер при отслеживании метаданных, больше открытых соединений между брокерами для репликации, и это накапливается по всему кластеру со всеми топиками сразу."
      - id: c
        text: "Число партиций нельзя увеличить позже без пересоздания топика, поэтому его сразу берут с большим запасом, чтобы не переделывать"
        correct: false
        explanation: "Число партиций можно увеличивать у существующего топика — правда, это меняет распределение по ключу для новых сообщений, что тоже стоит учитывать."
      - id: d
        text: "Лишние партиции автоматически увеличивают retention для всего топика, из-за чего данные хранятся дольше запланированного"
        correct: false
        explanation: "Retention — независимая настройка топика, число партиций на неё не влияет."
    explanation: "Каждая партиция — это отдельный лог на диске, отдельная цепочка репликации между конкретными брокерами и запись в метаданных, которые отслеживает контроллер. При росте числа топиков и партиций в кластере эти накладные расходы складываются: увеличивается время восстановления после падения брокера, растёт нагрузка на ZooKeeper/KRaft, усложняется ребалансировка."
    extended_explanation: "Практическое правило — считать число партиций от требуемой пропускной способности и параллелизма консюмеров, а не «на всякий случай»: увеличить число партиций у топика можно почти всегда, а уменьшить — только пересозданием топика."
    recommendation: "Изучить практические ограничения на число партиций в кластере и их влияние на время failover."
    difficulty: medium
    topics: [messaging, performance]

  - id: q10
    text: "Что делает `kafka-reassign-partitions` и когда эту операцию запускают вручную?"
    type: single
    options:
      - id: a
        text: "Меняет число партиций у топика, разбивая существующие партиции на более мелкие с сохранением уже записанных данных"
        correct: false
        explanation: "Изменение числа партиций — отдельная операция (increase partitions), она не делит существующие партиции, а добавляет новые пустые."
      - id: b
        text: "Переключает лидера партиции на другую реплику без переноса самих данных — это делает preferred leader election, а не reassignment"
        correct: false
        explanation: "Переключение лидера при живых репликах ISR делает preferred leader election — это быстрая операция без переноса данных, в отличие от reassignment."
      - id: c
        text: "Меняет физическое распределение реплик партиций между брокерами, например при добавлении нового брокера в кластер"
        correct: true
        explanation: "Новый брокер не получает данные автоматически — партиции распределены по старому составу кластера. Reassignment явно переносит часть реплик на новый брокер, выравнивая нагрузку."
      - id: d
        text: "Автоматически запускается контроллером при каждом падении брокера, чтобы сразу перенести реплики упавшего узла на живые"
        correct: false
        explanation: "При падении брокера контроллер лишь переизбирает лидеров из оставшихся живых реплик ISR — он не запускает перенос данных между брокерами автоматически."
    explanation: "Partition reassignment — операция физического переноса реплик между брокерами. Типичные поводы: добавили брокер и хотят распределить нагрузку на него, выводят брокер из эксплуатации и нужно перенести его реплики на другие, или обнаружили перекос нагрузки между брокерами."
    extended_explanation: "Это тяжёлая по сетевому трафику операция — переносимая партиция копируется целиком, поэтому на больших топиках её проводят постепенно, ограничивая скорость (throttle), чтобы не забить сеть между брокерами и не деградировать обслуживание обычного трафика."
    recommendation: "Прочитать про план reassignment JSON и параметр throttle при переносе партиций."
    difficulty: medium
    topics: [messaging]

  - id: q11
    text: "Что делает preferred leader election и зачем она нужна, если лидер уже выбран и партиция работает нормально?"
    type: single
    options:
      - id: a
        text: "Отключает реплики, отстающие от лидера, чтобы не мешали синхронизации, и выводит их из состава топика насовсем"
        correct: false
        explanation: "Управление составом ISR по отставанию — отдельный, автоматический механизм, не связанный с preferred leader election."
      - id: b
        text: "Позволяет вручную назначить лидером партиции любую реплику вне зависимости от её актуальности, включая полностью отставшие"
        correct: false
        explanation: "Preferred leader election работает строго со списком предпочтительных реплик, заранее назначенных ещё при создании топика."
      - id: c
        text: "Балансирует объём хранимых данных между брокерами, перемещая партиции по размеру занимаемого места на диске"
        correct: false
        explanation: "Балансировкой по объёму данных занимается reassignment — preferred leader election лишь переключает роль лидера между существующими репликами."
      - id: d
        text: "Возвращает роль лидера на реплику, изначально назначенную предпочтительной, после того как лидерство временно перешло к другой реплике"
        correct: true
        explanation: "После падения и восстановления брокера партиции, лидером которых он был, остаются на новом лидере — preferred leader election возвращает лидерство на изначально запланированную реплику, восстанавливая равномерное распределение лидеров по кластеру."
    explanation: "Каждая партиция при создании топика получает список реплик с первой, «предпочтительной» — именно она изначально становится лидером. После сбоя брокера и восстановления лидерство не возвращается автоматически: чтобы не разбалансировать нагрузку по кластеру (все лидеры скопились на нескольких брокерах), запускают preferred leader election, которая без переноса данных переключает лидерство обратно."
    extended_explanation: "На практике это обычно настраивают как периодическую автоматическую задачу (auto.leader.rebalance.enable), а не разовую ручную операцию — иначе кластер после каждого небольшого сбоя постепенно накапливает перекос в распределении лидеров."
    recommendation: "Посмотреть auto.leader.rebalance.enable и как отслеживать перекос лидеров по брокерам."
    difficulty: hard
    topics: [messaging]

  - id: q12
    text: "Кластер из пяти брокеров. Один топик с одной партицией и высокой нагрузкой становится узким местом. Почему добавление ещё пяти брокеров в кластер само по себе не решит проблему этой партиции?"
    type: single
    options:
      - id: a
        text: "Kafka не умеет добавлять новые брокеры в уже работающий кластер без простоя — для этого требуется остановка всего кластера"
        correct: false
        explanation: "Добавление брокера в живой кластер — штатная операция, она не требует остановки кластера."
      - id: b
        text: "Новые брокеры автоматически становятся репликами всех существующих партиций сразу после присоединения к кластеру"
        correct: false
        explanation: "Новые брокеры не получают реплики автоматически — для переноса нагрузки на них требуется явный reassignment."
      - id: c
        text: "Партиция — неделимая единица параллелизма и не масштабируется добавлением брокеров без роста их числа у топика"
        correct: true
        explanation: "Throughput топика ограничен произведением throughput одной партиции на их количество. Одна партиция обслуживается одним лидером на одном брокере — сколько бы брокеров ни было в кластере, эта партиция не станет обрабатываться быстрее без увеличения числа партиций самого топика."
      - id: d
        text: "Пять брокеров — минимальное число для формирования кворума, а добавление ещё пяти сверх этого попросту избыточно"
        correct: false
        explanation: "Число брокеров в кластере не завязано на конкретный кворумный порог вроде пяти — кворум в KRaft или ZooKeeper строится на своём меньшем наборе узлов, а число брокеров данных масштабируется отдельно."
    explanation: "Пропускная способность топика в Kafka линейно зависит от числа партиций, а не от общего числа брокеров в кластере. Одна перегруженная партиция — это один лидер на одном брокере, принимающий записи последовательно; добавление новых брокеров расширяет ёмкость кластера в целом, но не ускоряет обработку конкретной партиции без изменения числа партиций самого топика."
    extended_explanation: "Увеличение числа партиций топика не решается «на лету» без последствий: новые партиции пусты, а старые продолжают расти, и ключ-based партиционирование для уже написанных сообщений не пересчитывается — типичное решение горячих партиций начинают с пересмотра ключа партиционирования, а не только с добавления партиций."
    recommendation: "Разобрать, что именно масштабирует throughput топика: партиции, брокеры или и то и другое вместе."
    difficulty: hard
    topics: [messaging, performance]

  # ── Кворум и координация ─────────────────────────────────────────────────

  - id: q13
    text: "Зачем распределённой системе вроде Kafka вообще нужен отдельный кворумный механизм (раньше — ZooKeeper, теперь — KRaft), а не просто список брокеров?"
    type: single
    options:
      - id: a
        text: "Чтобы хранить единое согласованное состояние кластера (метаданные о топиках, партициях, лидерах) даже при недоступности части узлов"
        correct: true
        explanation: "В распределённой системе без координирующего механизма разные брокеры могут получить противоречивую картину состояния кластера при сетевых разделениях. Кворумный механизм гарантирует, что решения о состоянии метаданных (кто лидер, какие брокеры живы) принимаются согласованно и не теряются при падении меньшинства узлов."
      - id: b
        text: "Чтобы физически хранить сами сообщения, разгружая диски брокеров данных под пиковую нагрузку записи"
        correct: false
        explanation: "Данные сообщений хранятся на брокерах, обрабатывающих топики — координирующий слой держит только метаданные кластера."
      - id: c
        text: "Чтобы балансировать сетевую нагрузку между продюсерами и консюмерами при большом числе одновременных подключений"
        correct: false
        explanation: "Балансировкой клиентского трафика координирующий слой не занимается — это происходит через метаданные о партициях, которые клиент получает и использует сам."
      - id: d
        text: "Чтобы шифровать трафик между брокерами кластера и между брокерами и клиентами в проде"
        correct: false
        explanation: "Шифрование межброкерского трафика настраивается отдельно (SSL/TLS) и не является функцией кворумного механизма."
    explanation: "Ключевая проблема распределённых систем — согласование состояния при частичных сбоях: если у каждого брокера своя версия правды о том, кто сейчас лидер партиции, начнутся конфликты записи. Кворумный механизм — это отдельный протокол консенсуса (голосование большинством), который держит единственный согласованный источник правды о метаданных кластера, переживающий недоступность меньшинства узлов."
    extended_explanation: "Именно поэтому число узлов кворума (ZooKeeper-ансамбля или KRaft-контроллеров) выбирают нечётным — 3 или 5: большинство однозначно определяется даже при потере части узлов, и не возникает ситуации 50/50, когда решение невозможно принять."
    recommendation: "Прочитать про консенсус в распределённых системах в общем виде — Raft или Paxos — прежде чем углубляться в конкретику ZooKeeper/KRaft."
    difficulty: hard
    topics: [messaging, concurrency]

  - id: q14
    text: "За что отвечал ZooKeeper в архитектуре Kafka до перехода на KRaft?"
    type: single
    options:
      - id: a
        text: "Хранил и реплицировал сами сообщения топиков наравне с брокерами, разгружая их при высокой нагрузке"
        correct: false
        explanation: "Сообщения топиков ZooKeeper никогда не хранил — это оставалось задачей брокеров данных."
      - id: b
        text: "Выполнял балансировку нагрузки между продюсерами при публикации сообщений в топики с несколькими партициями"
        correct: false
        explanation: "Балансировкой публикации продюсеров ZooKeeper не занимался — это решается через партиционирование и метаданные, которые получает сам клиент."
      - id: c
        text: "Хранил метаданные кластера (список брокеров, конфигурацию топиков, ACL) и координировал выбор контроллера"
        correct: true
        explanation: "ZooKeeper был внешним координирующим хранилищем: список живых брокеров, конфигурация топиков и партиций, права доступа, и именно через него брокеры договаривались, кто из них становится контроллером кластера."
      - id: d
        text: "Кэшировал недавно прочитанные сообщения для ускорения повторных чтений консюмерами в рамках одной группы"
        correct: false
        explanation: "Кэширования сообщений для консюмеров ZooKeeper не выполнял — это не входило в его роль координирующего хранилища метаданных."
    explanation: "ZooKeeper выступал внешней системой консенсуса: в нём хранилось состояние кластера (список брокеров и их живость через эфемерные узлы, конфигурация топиков, ACL) и происходил выбор контроллера — брокера, отвечающего за административные решения вроде переизбрания лидеров партиций."
    extended_explanation: "Слабое место этой архитектуры было именно в разделении: контроллер должен был синхронизировать своё состояние из ZooKeeper с тем, что реально знают брокеры, и при больших кластерах (десятки тысяч партиций) это синхронизирующее чтение становилось узким местом при восстановлении после сбоя контроллера."
    recommendation: "Прочитать про роль ZooKeeper в довольно широком классе систем той эпохи (Kafka, HBase, Hadoop) — не только применительно к Kafka."
    difficulty: medium
    topics: [messaging]

  - id: q15
    text: "Что принципиально изменилось с переходом Kafka на KRaft по сравнению с архитектурой на ZooKeeper?"
    type: single
    options:
      - id: a
        text: "Метаданные кластера стали храниться и реплицироваться самими брокерами Kafka через встроенный протокол консенсуса, без внешней системы"
        correct: true
        explanation: "KRaft (Kafka Raft) убрал зависимость от отдельно разворачиваемого ZooKeeper-ансамбля: метаданные теперь хранятся как специальный внутренний топик, реплицируемый через протокол Raft между выделенными узлами-контроллерами, которые могут быть теми же процессами, что и брокеры данных."
      - id: b
        text: "Kafka перестала нуждаться в репликации партиций между брокерами — теперь достаточно одной копии данных"
        correct: false
        explanation: "Репликация пользовательских партиций данных работает так же, как и раньше — KRaft меняет только хранение метаданных кластера."
      - id: c
        text: "Кворумный механизм был полностью удалён, и решения о лидерстве теперь принимает каждый брокер полностью независимо"
        correct: false
        explanation: "Кворум никуда не исчез — его теперь реализует сама Kafka через встроенный протокол Raft вместо внешнего ZooKeeper. Несогласованные независимые решения каждого брокера — ровно та ситуация, которую кворумный механизм предотвращает."
      - id: d
        text: "Появилась возможность хранить сообщения без репликации вовсе для увеличения скорости записи на быстрых дисках"
        correct: false
        explanation: "Опция отказа от репликации данных ради скорости не связана с переходом на KRaft — это вопрос настройки replication factor конкретного топика, доступный и раньше."
    explanation: "Главная идея KRaft — избавиться от отдельной внешней системы (ZooKeeper) и хранить метаданные внутри самой Kafka как реплицируемый через Raft-консенсус лог событий. Это упростило деплой (одна система вместо двух), ускорило восстановление после сбоя контроллера и подняло практический потолок по числу партиций в кластере."
    extended_explanation: "Один из практических эффектов — контроллер в KRaft хранит полное состояние метаданных в памяти и восстанавливает его, читая лог метаданных, а не синхронизируясь с внешней системой при каждом старте, что и снимает узкое место, описанное в вопросе про ZooKeeper."
    recommendation: "Прочитать KIP-500 — предложение, по которому в Kafka внедрили переход на KRaft."
    difficulty: hard
    topics: [messaging]

  - id: q16
    text: "Что такое split-brain применительно к распределённому кластеру, и как кворумный механизм (ZooKeeper/KRaft) его предотвращает?"
    type: single
    options:
      - id: a
        text: "Ситуация, когда два продюсера одновременно пишут в одну партицию с разными данными, и порядок записи становится непредсказуемым"
        correct: false
        explanation: "Запись нескольких продюсеров в одну партицию — штатная и безопасная ситуация, порядок определяется приходом записей к единственному лидеру, split-brain здесь ни при чём."
      - id: b
        text: "Ситуация, когда консюмер читает одно и то же сообщение дважды из-за повторной доставки при сбое коммита offset"
        correct: false
        explanation: "Повторная доставка сообщения — вопрос гарантий at-least-once на уровне консюмера, а split-brain — это проблема согласованности решений внутри кластера брокеров."
      - id: c
        text: "Ситуация, когда две реплики партиции содержат одинаковые данные из-за избыточной репликации на соседние брокеры"
        correct: false
        explanation: "Одинаковые данные на репликах — это и есть цель репликации. Split-brain описывает именно конфликт управляющих решений между разделёнными частями кластера."
      - id: d
        text: "Сеть разделяет кластер на две части, и каждая считает себя единственным легитимным контроллером кластера"
        correct: true
        explanation: "При сетевом разделении обе половины кластера могут одновременно «думать», что они главные, и начать независимо принимать конфликтующие решения о лидерах партиций. Кворумный механизм требует явного большинства голосов для принятия решения — а большинство физически может собраться только в одной из двух частей разделённой сети, вторая часть остаётся без возможности принимать решения."
    explanation: "Split-brain — классическая проблема распределённых систем: при разрыве сети кластер физически раскалывается на изолированные друг от друга группы узлов, и без внешнего арбитра каждая группа может решить, что она — весь кластер, и начать действовать независимо, что ведёт к конфликтующим и несогласованным решениям. Требование голоса большинства делает эту ситуацию невозможной: собрать большинство одновременно в двух непересекающихся группах нельзя."
    extended_explanation: "Отсюда и практическая рекомендация размещать нечётное число узлов кворума по разным зонам отказа (стойкам, дата-центрам): при разрыве связи между зонами ровно одна сторона гарантированно наберёт большинство, а не обе или ни одна."
    recommendation: "Изучить, как строится кворум по зонам доступности в облачных развёртываниях Kafka."
    difficulty: hard
    topics: [messaging, concurrency]

  - id: q17
    text: "Что делает контроллер кластера Kafka и как он выбирается?"
    type: single
    options:
      - id: a
        text: "Отдельный сервис, физически не связанный с брокерами, установленный на выделенном сервере вне кластера данных"
