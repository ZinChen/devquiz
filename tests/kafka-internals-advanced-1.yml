  - id: q25
    text: "Сразу после того, как продюсер опубликовал несколько подряд идущих обновлений одного и того же ключа в compacted-топик, consumer читает партицию с начала. Почему он всё ещё может увидеть несколько устаревших версий этого ключа подряд, а не только последнюю?"
    type: single
    options:
      - id: a
        text: "Consumer читает с неправильным `isolation.level` и поэтому видит незакоммиченные версии этой записи"
        correct: false
        explanation: "isolation.level касается видимости транзакционных записей, а не того, сколько версий ключа прошли через compaction — это независимые механизмы."
      - id: b
        text: "Kafka гарантирует ровно одну версию ключа только для транзакционных продюсеров — для обычных продюсеров гарантия не действует"
        correct: false
        explanation: "Гарантия compaction не зависит от того, транзакционный продюсер или нет — она зависит от того, прошёл ли очередной цикл очистки по конкретному сегменту."
      - id: c
        text: "Consumer видит несколько версий только при чтении с `read_uncommitted`; с `read_committed` гарантированно вернётся ровно одна версия"
        correct: false
        explanation: "read_committed отфильтровывает незакоммиченные записи транзакций, но не имеет отношения к тому, сколько версий одного ключа уже прошли compaction."
      - id: d
        text: "Compaction не мгновенна: активный сегмент партиции, куда только что писал продюсер, ещё не участвовал в очередном проходе очистки"
        correct: true
        explanation: "Log cleaner проходит по логу партиции периодически и не трогает активный сегмент, в который продолжается запись — только более старые (tail) сегменты. Пока не случился очередной проход compaction, несколько версий одного ключа в разных сегментах могут сосуществовать, и consumer, читающий с начала, увидит их все по порядку, пока свежий проход не вычистит устаревшие."
    explanation: "Compaction — это фоновый, периодический процесс, а не свойство, соблюдаемое в реальном времени при каждой записи. Есть заметный временной зазор между моментом публикации записи и моментом, когда log cleaner физически вычистит устаревшие версии того же ключа из более старых сегментов — до этого момента в логе партиции может лежать сразу несколько версий одного ключа."
    extended_explanation: "Дополнительно на этот зазор влияет log.cleaner.min.compaction.lag.ms — минимальное время, которое запись обязана провести в логе, прежде чем она вообще станет кандидатом на компакцию, даже если её ключ уже устарел. Эта настройка защищает от слишком агрессивной немедленной очистки записей, которые ещё могут понадобиться читателям с малым отставанием."
    recommendation: "Прочитать про устройство log cleaner: head/tail сегменты и почему активный сегмент партиции не участвует в compaction."
