        explanation: "Проблемы consumer group (выход участника, ребалансировка группы) сигнализируются отдельными механизмами, не связанными напрямую с этой ошибкой о лидерстве конкретной партиции."
    explanation: "Эта ошибка — нормальная часть протокола Kafka, а не обязательно признак поломки: клиенты кэшируют метаданные о том, кто лидер каждой партиции, и эта информация может устареть между обновлениями. Получив такую ошибку, клиентская библиотека штатно обновляет метаданные и повторяет запрос — проблема в диагностике возникает, если это происходит постоянно, а не единично после переключения лидера."
    extended_explanation: "Если такая ошибка не разовая, а систематическая и повторяющаяся — это повод проверить, не идёт ли в кластере затяжная нестабильность лидерства (например, частые unclean-переключения или перегруженный контроллер), а не просто временный лаг обновления метаданных на клиенте."
    recommendation: "Посмотреть, как клиентские библиотеки Kafka обрабатывают устаревшие метаданные и retry-логику по умолчанию."
