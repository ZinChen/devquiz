        text: "Принимает административные решения о состоянии кластера и избирается через кворумный механизм как единственный активный узел"
        correct: true
        explanation: "Контроллер — не отдельный процесс, а особая роль одного из брокеров (в архитектуре с KRaft — одного из выделенных узлов): он отслеживает живость брокеров, инициирует переизбрание лидеров при сбоях и распространяет изменения метаданных остальным брокерам. Право быть контроллером получает узел, выигравший выборы через кворумный механизм."
      - id: c
