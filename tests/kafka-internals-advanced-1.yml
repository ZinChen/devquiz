  - id: q24
    text: "Параметр `min.cleanable.dirty.ratio` регулирует, при каком отношении «незакомпактированных» данных к общему размеру сегмента брокер запускает очередной проход compaction. Что произойдёт, если выставить его близко к 0 на топике с высокой частотой обновлений одного и того же набора ключей?"
    type: single
    options:
      - id: a
        text: "Compaction будет запускаться почти постоянно, создавая заметную нагрузку на диск и CPU ради минимального объёма устаревших записей"
        correct: true
        explanation: "Значение, близкое к 0, означает, что брокер считает сегмент достаточным для повторной компакции почти сразу после появления новых записей — то есть compaction гоняется значительно чаще. Цена — постоянное чтение и перезапись сегментов, что ощутимо нагружает диск и CPU брокера, особенно при высокой частоте обновлений."
      - id: b
        text: "Compaction отключится полностью — порог, равный 0, брокер интерпретирует как команду «никогда не считать сегмент готовым к очистке»"
        correct: false
        explanation: "Порог, близкий к 0, действует в обратную сторону — сегмент считается готовым к compaction почти сразу, а не никогда."
      - id: c
        text: "Изменится только скорость чтения топика консюмерами, а частота самой compaction на это никак не повлияет вовсе"
        correct: false
        explanation: "min.cleanable.dirty.ratio напрямую управляет тем, как часто срабатывает сама compaction — это не настройка чтения консюмеров."
      - id: d
        text: "Топик автоматически переключится с compact на delete, так как слишком частая компакция считается небезопасной"
        correct: false
        explanation: "cleanup.policy — самостоятельная настройка, которую compaction-цикл не переключает сам по себе вне зависимости от значения dirty ratio."
    explanation: "min.cleanable.dirty.ratio — это компромисс между свежестью компакции и нагрузкой на брокер. Значение ближе к 0 означает: почти любая доля новых записей уже достаточна, чтобы считать сегмент кандидатом на очистку, поэтому compaction проходит часто и держит объём устаревших данных минимальным ценой постоянной фоновой работы. Значение ближе к 1 экономит ресурсы, но допускает накопление большого числа устаревших версий ключей между проходами."
    extended_explanation: "На практике значение по умолчанию (0.5) редко трогают без явной причины — снижают его, когда критично быстро видеть актуальное состояние и место на диске в дефиците, повышают — когда топик большой, а частота обновлений ключей невысока и лишняя нагрузка на диск нежелательна."
    recommendation: "Посмотреть остальные параметры log.cleaner (io.max.bytes.per.second, backoff.ms) и их влияние на приоритет compaction относительно обычного трафика брокера."
