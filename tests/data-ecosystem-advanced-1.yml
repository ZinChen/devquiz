slug: data-ecosystem-advanced-1
title: "Форматы данных, lakehouse и экосистема инструментов"
description: "Практический тест по экосистеме данных: форматы файлового хранения, транзакционный слой lakehouse, разграничение движков обработки и запросов, EL/BI/качество/каталог как разные слои стека, и чем современные оркестраторы отличаются друг от друга и от джоб-очередей."
tags: [data-engineering, lakehouse, orchestration, analytics]
difficulty: advanced
estimated_time: 30

questions:
  # ── Блок 1: Форматы хранения данных ──────────────────────────────────────

  - id: q1
    text: "Аналитический пайплайн выбирает между Parquet и Avro для промежуточного слоя данных. Какой критерий обычно решает в пользу Parquet?"
    type: single
    options:
      - id: a
        text: "Схема данных часто меняется, и нужна построчная запись событий одно за другим"
        correct: false
        explanation: "Для такого паттерна лучше подходит Avro — построчный формат с гибкой эволюцией схемы и низкой стоимостью записи по одному событию."
      - id: b
        text: "Данные читаются агрегирующими запросами по узкому набору колонок из широкой схемы"
        correct: true
        explanation: "Колоночный формат Parquet хранит значения одной колонки рядом на диске — агрегирующий запрос читает только нужные колонки, не трогая остальные."
      - id: c
        text: "Данные генерируются потоково и должны сериализоваться построчно при каждом событии"
        correct: false
        explanation: "Построчная сериализация каждого события — сильная сторона Avro; Parquet эффективен именно при пакетной записи целыми колоночными блоками."
      - id: d
        text: "Нужен максимально компактный бинарный протокол для RPC между сервисами"
        correct: false
        explanation: "Задачу сериализации для RPC решает Protobuf — Parquet ориентирован именно на хранение данных для аналитики."
    explanation: "Parquet — колоночный формат хранения на диске: значения одной колонки лежат физически рядом и сжимаются как однородный блок. Это даёт выигрыш ровно там, где Parquet и применяют — аналитические запросы, читающие небольшую часть широкой таблицы. Avro, будучи построчным, эффективнее там, где записи читаются и пишутся целиком одна за другой — типичный кейс потоковой передачи через Kafka."
    extended_explanation: "У Avro есть встроенный механизм эволюции схемы (schema registry, совместимость forward/backward) — поле можно добавить или переименовать без пересборки всех уже записанных файлов, что делает его удобным форматом именно для сообщений в потоке, а не только для хранения на диске."
    recommendation: "Сравнить физическое устройство Parquet (колоночное) и Avro (построчное) и типичные сценарии применения каждого."
    difficulty: medium
    topics: [analytics]

  - id: q2
    text: "Чем Apache Arrow принципиально отличается от Parquet, хотя оба формата колоночные?"
    type: single
    options:
      - id: a
        text: "Arrow поддерживает только числовые типы данных, Parquet — произвольные"
        correct: false
        explanation: "Arrow поддерживает широкий набор типов, включая строки и вложенные структуры — ограничение только числовыми типами не описывает разницу форматов."
      - id: b
        text: "Arrow — формат для потоковой передачи через Kafka, Parquet для этого не подходит"
        correct: false
        explanation: "Ни Arrow, ни Parquet не являются стандартным форматом сообщений Kafka — для этой роли обычно используют Avro или Protobuf."
      - id: c
        text: "Arrow сжимает данные сильнее, чем Parquet, за счёт более агрессивных кодеков"
        correct: false
        explanation: "Arrow, наоборот, намеренно избегает тяжёлого сжатия — оно замедлило бы прямой доступ к данным в памяти, ради которого формат и создавался."
      - id: d
        text: "Arrow — формат представления данных в оперативной памяти, Parquet — формат хранения на диске"
        correct: true
        explanation: "Arrow специально спроектирован под представление данных в памяти без сериализации, а Parquet — под компактное персистентное хранение с сжатием на диске."
    explanation: "Arrow решает другую задачу, чем Parquet: он определяет, как колоночные данные раскладываются в оперативной памяти так, чтобы разные системы (Python, движок запросов, GPU) могли обмениваться ими без затрат на сериализацию и десериализацию. Parquet же оптимизирован под компактность на диске — сжатие, кодирование, метаданные для пропуска блоков."
    extended_explanation: "На практике оба формата дополняют друг друга в одном пайплайне: данные читаются с диска в формате Parquet, разворачиваются в памяти как Arrow-таблица для быстрой обработки, а библиотеки вроде pandas или DuckDB умеют работать с Arrow напрямую без лишнего копирования данных."
    recommendation: "Прочитать про Arrow как in-memory columnar формат и zero-copy обмен данными между системами."
    difficulty: hard
    topics: [analytics]

  - id: q3
    text: "Сервис А отправляет сервису Б событие через gRPC с чёткой типизированной схемой полей, где важна компактность и скорость сериализации. Какой формат для этого предназначен в первую очередь?"
    type: single
    options:
      - id: a
        text: "Parquet — колоночный формат хранения на диске"
        correct: false
        explanation: "Parquet проектировался под хранение больших объёмов колоночных данных на диске для аналитики — сериализация отдельных сообщений между сервисами лежит в другой области."
      - id: b
        text: "Protobuf — бинарный формат со схемой, скомпилированной заранее"
        correct: true
        explanation: "Protobuf — бинарный формат с заранее скомпилированной схемой (.proto), созданный именно для эффективной типизированной сериализации в RPC-вызовах, gRPC использует его как стандарт по умолчанию."
      - id: c
        text: "ORC — ещё один колоночный формат хранения"
        correct: false
        explanation: "ORC — колоночный формат хранения, близкий по назначению к Parquet и распространённый в экосистеме Hive/Spark, для межсервисного RPC его не применяют."
      - id: d
        text: "CSV — текстовый построчный формат без схемы"
        correct: false
        explanation: "CSV не несёт строгой типизированной схемы и не является бинарным компактным форматом — для RPC он избыточен по размеру и хрупок при парсинге."
    explanation: "Protobuf — стандартный выбор для gRPC именно из-за сочетания компактности бинарного представления, строгой типизации через .proto-схему и генерации кода для разных языков. Он не про аналитическое хранение — про эффективную передачу структурированных сообщений между сервисами."
    extended_explanation: "gRPC не единственный потребитель Protobuf — тот же формат часто используют как значение сообщения в Kafka вместо Avro, когда команда уже поддерживает .proto-схемы для RPC и не хочет вести две параллельные системы описания схем."
    recommendation: "Сравнить Protobuf и Avro как форматы сериализации сообщений — оба типизированы, но растут из разных экосистем."
    difficulty: easy
    topics: [analytics]

  - id: q4
    text: "Что из перечисленного — не формат хранения данных, а нечто другое по своей природе?"
    type: single
    options:
      - id: a
        text: "ORC — колоночный формат хранения на диске"
        correct: false
        explanation: "Прямой конкурент Parquet, выросший из экосистемы Hadoop/Hive и по сей день распространённый там же."
      - id: b
        text: "Parquet — тоже колоночный формат хранения"
        correct: false
        explanation: "Parquet — колоночный формат хранения данных на диске, наиболее распространённый в современном data-стеке."
      - id: c
        text: "Apache Iceberg — слой метаданных поверх файлов"
        correct: true
        explanation: "Iceberg — табличный формат (table format): слой метаданных и транзакционности поверх файлов Parquet/ORC, отдельный от формата самого файла на диске."
      - id: d
        text: "Avro — построчный формат с гибкой схемой"
        correct: false
        explanation: "Avro — построчный формат хранения и сериализации данных с поддержкой эволюции схемы."
    explanation: "Iceberg отвечает на другой вопрос, чем ORC/Parquet/Avro: не «в каком виде лежат байты в файле», а «как организовать множество таких файлов в единую таблицу с транзакциями, версионированием схемы и снапшотами». Он работает поверх обычных Parquet-файлов, добавляя слой метаданных сверху."
    extended_explanation: "Путаница усиливается тем, что таблица Iceberg физически состоит из тех же Parquet-файлов — разница не в байтах данных, а в отдельном каталоге метаданных, который отслеживает, какие именно файлы и в какой версии образуют текущее состояние таблицы."
    recommendation: "Разобраться в разнице между file format (Parquet, ORC, Avro) и table format (Iceberg, Delta Lake, Hudi)."
    difficulty: medium
    topics: [analytics]

  - id: q5
    text: "Инженер описывает формат так: «строки в нём хранятся полностью в одном месте, схема жёсткая с рождения файла, формат тяжело читать частично — обычно весь файл целиком». Ближе всего к этому описанию:"
    type: single
    options:
      - id: a
        text: "Parquet — колоночный формат с метаданными"
        correct: false
        explanation: "Parquet — колоночный формат с богатыми метаданными, специально спроектированный под частичное чтение отдельных колонок без разбора файла целиком."
      - id: b
        text: "Apache Arrow — in-memory колоночный формат"
        correct: false
        explanation: "Arrow — колоночная in-memory структура, дающая прямой произвольный доступ к отдельным колонкам без последовательного чтения всего массива."
      - id: c
        text: "ORC — ещё один колоночный формат"
        correct: false
        explanation: "ORC, как и Parquet, колоночный формат с индексными структурами (stripe, index), позволяющими читать и пропускать данные частями."
      - id: d
        text: "CSV — простой текстовый формат"
        correct: true
        explanation: "CSV хранит полную строку подряд, не даёт метаданных для частичного чтения по колонкам и требует парсинга файла целиком для извлечения даже одного поля."
    explanation: "Описание — характеристика строкового текстового формата без метаданных о структуре: CSV читается последовательно, без возможности эффективно пропустить ненужные колонки или блоки. Все остальные варианты — колоночные форматы, спроектированные ровно для противоположного сценария использования."
    extended_explanation: "У CSV, несмотря на архаичность, остаётся практическая ниша — обмен данными с внешними системами и людьми, где простота и человекочитаемость важнее производительности; внутри аналитического пайплайна его обычно как можно раньше конвертируют в колоночный формат."
    recommendation: "Сопоставить характеристики CSV, Parquet, ORC и Arrow по читаемости, схеме и частичному доступу к данным."
    difficulty: easy
    topics: [analytics]

  # ── Блок 2: Table-форматы и lakehouse ────────────────────────────────────

  - id: q6
    text: "Аналитик читает таблицу в data lake во время того, как ETL-джоба перезаписывает в ней часть файлов. Какую проблему решает именно table-формат вроде Iceberg или Delta Lake поверх обычного набора Parquet-файлов в объектном хранилище?"
    type: single
    options:
      - id: a
        text: "Гарантирует, что чтение видит консистентный снапшот, не подхватывая частично перезаписанные файлы"
        correct: true
        explanation: "Table-формат ведёт атомарно обновляемый список файлов текущего снапшота — читатель видит либо полностью старую, либо полностью новую версию таблицы, но никогда смесь из обеих."
      - id: b
        text: "Блокирует таблицу на время записи, не давая параллельному чтению начаться, пока джоба не завершится"
        correct: false
        explanation: "Iceberg и Delta Lake, наоборот, спроектированы так, чтобы читатели не блокировались записью — консистентность достигается снапшотами и MVCC-подобной моделью, а не эксклюзивными блокировками на время всей записи."
      - id: c
        text: "Гарантирует, что запись успешно завершится, автоматически повторяя её при сетевом сбое до победного конца"
        correct: false
        explanation: "Table-формат не берёт на себя retry самой записи при сетевых сбоях — это ответственность движка обработки или оркестратора; формат лишь не даёт частично записанным файлам стать видимой версией таблицы."
      - id: d
        text: "Позволяет читателю видеть самые свежие данные без задержки, минуя журнал транзакций для ускорения чтения"
        correct: false
        explanation: "Всё наоборот: именно журнал транзакций и атомарная смена указателя на снапшот — механизм, через который читатель получает консистентную версию; обход журнала ради скорости свёл бы на нет саму гарантию, которую даёт table-формат."
    explanation: "Классическая проблема голого data lake на объектном хранилище — отсутствие атомарности: пока джоба переписывает файлы таблицы, параллельный читатель может увидеть промежуточное, повреждённое состояние (часть старых, часть новых файлов). Iceberg и Delta Lake решают это через журнал транзакций и атомарную смену указателя на текущий снапшот метаданных."
    extended_explanation: "Тот же механизм снапшотов открывает time travel — запрос к таблице «как она выглядела вчера» или откат к предыдущей версии одной командой, потому что старые снапшоты метаданных не удаляются сразу, а хранятся до истечения политики retention."
    recommendation: "Изучить механизм снапшотов и журнала транзакций в Iceberg или Delta Lake."
    difficulty: hard
    topics: [analytics]

  - id: q7
    text: "В чём принципиальное отличие data lakehouse от классического сочетания «data lake + отдельный data warehouse»?"
    type: single
    options:
      - id: a
        text: "Lakehouse полностью отказывается от файлового хранения в пользу построчной реляционной СУБД"
        correct: false
        explanation: "Lakehouse остаётся файловым хранилищем поверх объектного стораджа — он не заменяет файлы реляционной СУБД, а добавляет транзакционный слой поверх них."
      - id: b
        text: "Lakehouse — маркетинговое имя для обычного data lake без каких-либо архитектурных изменений"
        correct: false
        explanation: "Транзакционный слой (Iceberg, Delta Lake, Hudi) — реальное архитектурное дополнение, дающее гарантии, которых у сырого data lake не было."
      - id: c
        text: "Lakehouse требует, чтобы все данные обязательно проходили через отдельный ETL перед сохранением в объектное хранилище"
        correct: false
        explanation: "Строгое требование предварительного ETL характерно скорее для классического DWH — lakehouse как раз позволяет держать и сырые, и трансформированные данные в одном хранилище."
      - id: d
        text: "Транзакционный и схемный слой добавляется прямо поверх дешёвого объектного хранилища, без выгрузки данных в отдельную СУБД"
        correct: true
        explanation: "Lakehouse привносит ACID-транзакции, схему и оптимизации запросов на уровень файлов в объектном хранилище, убирая необходимость копировать данные в отдельный DWH для надёжных аналитических запросов."
    explanation: "Классическая связка требовала двух копий данных: дешёвого, но ненадёжного data lake для сырых данных и отдельного, дорогого DWH с транзакциями и оптимизированным движком для отчётности. Lakehouse убирает раздвоение — table-формат добавляет ACID, схему и статистику для планировщика запросов прямо на уровне файлов в объектном хранилище, так что аналитика может работать с одной копией данных."
    extended_explanation: "Экономический стимул лакхауса — объектное хранилище (S3, GCS) на порядок дешевле управляемого DWH за тот же объём, а движки вроде Trino, Spark или Snowflake умеют читать table-форматы напрямую, так что дорогая выгрузка данных в отдельную СУБД перестаёт быть обязательным шагом."
    recommendation: "Сравнить архитектуру классического DWH, data lake и lakehouse по стоимости хранения и гарантиям консистентности."
    difficulty: medium
    topics: [analytics]

  - id: q8
    text: "В медальонной архитектуре (bronze/silver/gold) что характеризует слой silver?"
    type: single
    options:
      - id: a
        text: "Сырые данные строго в том виде, в котором их отдал источник, без каких-либо изменений"
        correct: false
        explanation: "Полностью нетронутые сырые данные — это определение слоя bronze, предшествующего silver в цепочке очистки."
      - id: b
        text: "Очищенные и приведённые к согласованной схеме данные, ещё не агрегированные под конкретный бизнес-отчёт"
        correct: true
        explanation: "Silver — промежуточный слой: дедупликация, приведение типов, базовая валидация, но без агрегации в конечные бизнес-метрики, характерной уже для gold."
      - id: c
        text: "Финальные агрегированные витрины, готовые для прямого потребления BI-дашбордом"
        correct: false
        explanation: "Готовые к прямому потреблению агрегированные витрины — это слой gold, конечная точка медальонной цепочки."
      - id: d
        text: "Временное хранилище для данных, которые будут удалены сразу после обработки"
        correct: false
        explanation: "Ни один из трёх слоёв медальонной архитектуры не подразумевает удаления данных после обработки — все три хранятся постоянно как разные представления одних и тех же данных."
    explanation: "Медальонная архитектура описывает три последовательных уровня очистки: bronze хранит сырьё как есть для воспроизводимости, silver — согласованные, дедуплицированные и типизированные данные общего назначения, gold — уже агрегированные под конкретные бизнес-вопросы витрины. Silver можно переиспользовать для многих разных gold-витрин."
    extended_explanation: "Практическая причина хранить именно три слоя, а не сразу считать gold из bronze — воспроизводимость: если в логике агрегации gold найдена ошибка, её можно пересчитать заново из silver без повторной тяжёлой очистки сырых данных с нуля."
    recommendation: "Прочитать про происхождение медальонной архитектуры (Databricks) и типичное распределение ответственности по слоям."
    difficulty: easy
    topics: [analytics]

  - id: q9
    text: "Команда, внедряющая data mesh, разделяет ответственность за данные по доменам (заказы, платежи, логистика), где каждая доменная команда сама владеет своими данными как продуктом. Что это меняет по сравнению с централизованной командой данных?"
    type: single
    options:
      - id: a
        text: "Все данные физически переносятся в единое централизованное хранилище одного облачного провайдера"
        correct: false
        explanation: "Физическое расположение данных — не суть data mesh; акцент здесь на распределённой организационной ответственности за домены."
      - id: b
        text: "Ответственность за качество и публикацию данных переносится на команды-владельцы домена, а не остаётся в одной центральной команде"
        correct: true
        explanation: "Data mesh — прежде всего организационный сдвиг: доменная команда, лучше всех понимающая свои данные, публикует и поддерживает их как продукт вместо передачи сырых данных единственной центральной команде на обработку."
      - id: c
        text: "Полностью исключает необходимость в общей схеме данных между доменами"
        correct: false
        explanation: "Общие контракты между доменами (интерфейсы данных, определения ключей) остаются нужны для совместимости — data mesh не отменяет координацию, а меняет то, кто за что отвечает."
      - id: d
        text: "Заменяет собой необходимость в оркестраторе пайплайнов вроде Airflow"
        correct: false
        explanation: "Оркестрация пайплайнов внутри каждого домена никуда не девается — data mesh описывает распределение ответственности за данные между командами."
    explanation: "Data mesh — реакция на узкое место централизованной модели, где одна команда данных становится бутылочным горлышком для всей организации. Идея в том, чтобы относиться к данным домена как к продукту с владельцем, SLA и документацией, а не как к побочному выхлопу, который «кто-то потом почистит» в центральном хранилище."
    extended_explanation: "У подхода есть цена — без общей платформы самообслуживания (self-serve data infrastructure) и федеративного управления (federated governance) распределённая ответственность легко превращается в десяток несовместимых друг с другом доменных хранилищ данных, поэтому data mesh обычно описывают как четыре взаимосвязанных принципа, а не только «разделить команды»."
    recommendation: "Прочитать оригинальную статью Zhamak Dehghani про четыре принципа data mesh."
    difficulty: hard
    topics: [analytics]

  - id: q10
    text: "Zone maps (используемые, например, в колоночных СУБД и table-форматах вроде Iceberg) — что это за механизм?"
    type: single
    options:
      - id: a
        text: "Географическое распределение реплик данных по разным дата-центрам"
        correct: false
        explanation: "Распределение реплик по регионам — задача репликации и георазмещения, к статистике внутри блока данных отношения не имеющая."
      - id: b
        text: "Разделение таблицы на логические зоны доступа для разных ролей пользователей"
        correct: false
        explanation: "Разграничение доступа по ролям — задача управления доступом (RBAC), из совершенно другой области, чем пропуск блоков данных при выполнении запроса."
      - id: c
        text: "Сохранённые min/max значения колонки по каждому блоку данных, позволяющие пропустить блок без чтения при фильтрации"
        correct: true
        explanation: "Zone map хранит границы значений (минимум и максимум) внутри блока — если условие фильтра заведомо вне этого диапазона, планировщик пропускает блок, даже не открывая его."
      - id: d
        text: "Кэш последних выполненных запросов для их повторного мгновенного выполнения"
        correct: false
        explanation: "Кэширование результатов запроса — отдельный независимый механизм, не связанный с хранением статистики значений внутри блока данных."
    explanation: "Zone map — простая, но эффективная форма статистики: для каждого блока (файла, страницы, группы строк) хранится минимальное и максимальное значение колонки. При запросе с условием вроде date > '2026-01-01' движок сверяет условие с этими границами и полностью пропускает блоки, где совпадение заведомо невозможно, экономя чтение с диска ещё до разбора самих данных."
    extended_explanation: "Тот же принцип лежит и в основе partition pruning, и в основе sparse index в ClickHouse — все три механизма опираются на одну идею: заранее посчитанная грубая статистика позволяет отбросить заведомо ненужные данные дешевле, чем их фактическое чтение и фильтрация."
    recommendation: "Сравнить zone maps, partition pruning и sparse index как варианты одной и той же идеи пропуска данных."
    difficulty: hard
    topics: [analytics]

  # ── Блок 3: Движки обработки и запросов ──────────────────────────────────

  - id: q11
    text: "Trino (бывший PrestoSQL) часто называют движком федеративных запросов. Чем это принципиально отличает его от Spark в типичном сценарии использования?"
    type: single
    options:
      - id: a
        text: "Trino предназначен для написания сложных многошаговых пайплайнов трансформации данных с ветвящейся бизнес-логикой на произвольном коде"
        correct: false
        explanation: "Написание многошаговых пайплайнов трансформации с произвольной логикой — типичная задача Spark; Trino специализируется именно на выполнении SQL-запросов."
      - id: b
        text: "Trino единственный из двух умеет непрерывно работать с потоковыми данными в реальном времени, а не только с уже сохранёнными"
        correct: false
        explanation: "Потоковая обработка в реальном времени — область Spark Streaming или Flink; Trino ориентирован на интерактивные запросы к уже сохранённым данным."
      - id: c
        text: "Trino заменяет собой необходимость в отдельном хранилище данных, полностью выполняя роль самой СУБД для хранения"
        correct: false
        explanation: "Trino сам не хранит данные — это движок запросов, читающий данные из внешних источников через коннекторы, без собственного постоянного хранилища."
      - id: d
        text: "Trino умеет выполнить один SQL-запрос, соединяющий данные из нескольких разных источников без предварительной их выгрузки в одно место"
        correct: true
        explanation: "Федеративность — способность Trino через коннекторы обращаться напрямую к разным системам хранения (DWH, объектное хранилище, реляционная СУБД) в рамках одного запроса, оставляя данные на месте вместо их предварительного копирования в единый слой."
    explanation: "Spark и Trino решают разные задачи одного стека: Spark — универсальный движок обработки для сложных многошаговых пайплайнов (ETL, ML, произвольный код на Python/Scala), Trino — специализированный SQL-движок для быстрых интерактивных запросов, в том числе объединяющих данные из разнородных источников через единый SQL-интерфейс."
    extended_explanation: "На практике их часто комбинируют: Spark готовит и трансформирует данные в фоновом батче, а аналитики затем обращаются к результату интерактивными SQL-запросами через Trino — именно поэтому Trino часто оказывается движком запросов позади BI-инструмента, а не заменой ETL-слоя."
    recommendation: "Сравнить роли Spark и Trino/Presto в типичном современном data-стеке."
    difficulty: medium
    topics: [analytics]

  - id: q12
    text: "Пайплайн должен непрерывно обрабатывать события с задержкой в единицы секунд, с точной обработкой опоздавших событий по времени события (event time), а не времени обработки. Какой из движков спроектирован именно под такой класс задач лучше остальных?"
    type: single
