      - id: b
        text: "Apache Spark в режиме микробатчей"
        correct: false
        explanation: "Классический Spark Structured Streaming обрабатывает данные микробатчами с задержкой обычно от сотен миллисекунд до секунд — это работает, но было добавлено поверх изначально батчевой модели."
      - id: c
        text: "Trino"
        correct: false
        explanation: "Trino — движок интерактивных SQL-запросов к уже сохранённым данным; непрерывной потоковой обработкой событий занимаются другие инструменты."
      - id: d
        text: "dbt"
        correct: false
        explanation: "dbt выполняет SQL-трансформации по требованию или расписанию поверх уже загруженных в хранилище данных — непрерывной потоковой обработки он не делает."
    explanation: "Flink изначально спроектирован вокруг модели непрерывного потока с точной семантикой event time и watermarks для корректной обработки опоздавших данных — это его основной сценарий с самого начала. Spark исторически батчевый движок, к которому потоковую модель добавили поверх (микробатчи), и в задачах с очень низкой задержкой и сложной семантикой времени она уступает нативно потоковой архитектуре Flink."
    extended_explanation: "Water marks — механизм, которым Flink явно моделирует «насколько мы готовы ждать опоздавшие данные»: система объявляет момент времени, после которого события с более ранним event time считаются окончательно опоздавшими и обрабатываются по отдельной политике, а не блокируют весь поток бесконечно."
    recommendation: "Изучить понятия event time, processing time и watermarks в потоковой обработке (Flink)."
