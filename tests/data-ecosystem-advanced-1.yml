  - id: q24
    text: "Какое из следующих утверждений о SLA miss в оркестраторе данных (на примере Airflow) верно?"
    type: single
    options:
      - id: a
        text: "Это уведомление о том, что таск не уложился в заданное время выполнения, при этом сам таск может продолжать работать дальше"
        correct: true
        explanation: "SLA miss — это сигнал превышения ожидаемого времени: таск по умолчанию продолжает выполняться, система лишь фиксирует и алертит о нарушении временного ожидания."
      - id: b
        text: "Это то же самое, что execution_timeout — оба параметра принудительно останавливают таск по истечении заданного времени"
        correct: false
        explanation: "execution_timeout действительно принудительно прерывает таск по превышении лимита, но SLA — параметр другого рода: он только фиксирует нарушение временного ожидания и отправляет алерт, не останавливая выполнение."
      - id: c
        text: "Это ожидаемое время начала выполнения DAG после наступления интервала расписания, а не время самого выполнения таска"
        correct: false
        explanation: "SLA в Airflow отсчитывается от начала интервала расписания до завершения таска или DAG, то есть покрывает именно продолжительность выполнения (включая ожидание в очереди), а не только момент старта."
      - id: d
        text: "Это уведомление, которое отправляется только при успешном завершении DAG, если оно уложилось в срок — своего рода подтверждение соблюдения SLA"
        correct: false
        explanation: "Наоборот — алерт срабатывает именно при нарушении срока (SLA miss), а не при его соблюдении; успешное выполнение в срок никакого специального уведомления не генерирует."
    explanation: "SLA (service level agreement) в Airflow задаётся как ожидаемое время, за которое таск или DAG должны завершиться после начала интервала расписания. Если это время превышено, оркестратор фиксирует SLA miss и отправляет уведомление — но сам таск при этом не останавливается принудительно и может успешно завершиться позже. SLA — инструмент наблюдаемости и алертинга, а не контроля выполнения."
    extended_explanation: "SLA miss стоит отличать от таймаута исполнения (execution_timeout) — таймаут действительно принудительно останавливает таск по превышении лимита, тогда как SLA лишь наблюдает и уведомляет, оставляя решение о дальнейших действиях человеку или отдельной логике реагирования на алерт."
    recommendation: "Сравнить параметры sla и execution_timeout в Airflow — один наблюдает, другой прерывает."
    difficulty: medium
    topics: [data]

