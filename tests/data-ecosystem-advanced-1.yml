  - id: q21
    text: "Dagster и Prefect часто позиционируют как более современную альтернативу Airflow. Какая идея Dagster отличает его философию от классического Airflow сильнее всего?"
    type: single
    options:
      - id: a
        text: "Dagster вообще не умеет запускать задачи по расписанию, только по внешнему ручному триггеру"
        correct: false
        explanation: "Расписания в Dagster поддерживаются полноценно — отличие философии не в отсутствии этой базовой возможности оркестратора."
      - id: b
        text: "Dagster в первую очередь моделирует пайплайн вокруг производимых данных, а не вокруг последовательности задач"
        correct: true
        explanation: "В такой asset-based модели (software-defined assets) Dagster декларирует, какие датасеты существуют и как один вычисляется из другого — задачи становятся производной от графа данных, в отличие от task-центричного подхода Airflow."
      - id: c
        text: "Dagster может работать только с данными в облаке, без поддержки on-premise окружений"
        correct: false
        explanation: "Dagster, как и Airflow, разворачивается и в облаке, и on-premise — ограничение окружением не является тем архитектурным отличием, о котором идёт речь."
      - id: d
        text: "Dagster не поддерживает написание задач на языке Python, только на Go или Java"
        correct: false
        explanation: "Dagster написан на Python и задачи в нём описываются на Python — это не то, что отличает его от Airflow, который тоже Python-based."
    explanation: "Классический Airflow исторически task-centric: DAG описывает последовательность операторов, а то, какие данные они производят, — деталь реализации внутри таска, не видимая самому оркестратору. Dagster делает данные (assets) первоклассным объектом графа: DAG строится из деклараций «этот датасет вычисляется из тех двух», что даёт оркестратору видимость происхождения данных и упрощает избирательный перезапуск только устаревших частей графа."
    extended_explanation: "Практическое следствие asset-based модели — Dagster умеет показывать, какие именно датасеты устарели относительно своих источников, и пересчитывать только их, тогда как классический Airflow DAG обычно перезапускается целиком или по ручному выбору тасков, без встроенного понимания зависимостей на уровне данных."
    recommendation: "Сравнить task-based модель Airflow с asset-based моделью Dagster на одном и том же примере пайплайна."
    difficulty: hard
    topics: [data]

  - id: q22
    text: "Temporal позиционируют как платформу durable execution, а не просто как оркестратор data-пайплайнов. В чём практическая суть этого отличия?"
    type: single
    options:
      - id: a
        text: "Temporal сохраняет полное состояние выполнения кода на каждом шаге, позволяя процессу пережить падение воркера и продолжиться ровно с прерванного места"
        correct: true
        explanation: "Durable execution означает, что даже длительный процесс с ожиданиями и вызовами внешних систем переживает падение процесса-исполнителя — Temporal восстанавливает состояние из журнала и продолжает выполнение без потери прогресса."
      - id: b
        text: "Temporal исполняет только SQL-запросы к хранилищу, без поддержки произвольного пользовательского кода"
        correct: false
        explanation: "Temporal, напротив, ориентирован на произвольный код на обычных языках программирования (Go, Java, Python) — работа с SQL не является его основной моделью."
      - id: c
        text: "Temporal способен обрабатывать только строго батчевые задачи с фиксированным концом"
        correct: false
        explanation: "Temporal хорошо подходит для долгоживущих процессов без заранее известного конца — например, месяцами длящегося бизнес-процесса с ожиданием событий, наравне с обычными конечными батчами."
      - id: d
        text: "Temporal требует, чтобы весь пайплайн выполнялся строго в рамках одной транзакции СУБД"
        correct: false
        explanation: "Temporal не привязан к транзакционной модели одной СУБД — он координирует шаги, которые сами по себе могут обращаться к разным внешним системам независимо."
    explanation: "Durable execution — гарантия, что бизнес-логика длительного процесса (workflow) переживёт сбой инфраструктуры: если воркер, исполняющий workflow, упал посреди многочасового или многодневного процесса, Temporal восстановит его состояние из журнала событий и продолжит выполнение с того самого места, а не с начала и не потеряет прогресс. Это шире, чем оркестрация данных — Temporal одинаково годится для бизнес-процессов вроде обработки заказа с ожиданием оплаты."
    extended_explanation: "Механизм строится на event sourcing: каждый шаг workflow и каждый его результат записываются в журнал событий, и при восстановлении Temporal не пересчитывает шаги заново «на удачу», а детерминированно воспроизводит код workflow, подставляя уже известные результаты завершённых шагов из журнала."
    recommendation: "Прочитать про event sourcing как механизм durable execution в Temporal."
    difficulty: hard
    topics: [data]

  - id: q23
    text: "Rails-команда использует cron для ежедневного запуска рейка-таска, который через Sidekiq джобу тянет данные из внешнего API и льёт их в отчётную таблицу. Почему это обычно не считают полноценной заменой оркестратора вроде Airflow, даже если технически работает?"
    type: single
    options:
      - id: a
        text: "Связка cron+Sidekiq не даёт декларативного графа зависимостей между шагами, видимости истории запусков по датам и встроенного backfill за прошлые периоды"
        correct: true
        explanation: "Оркестратор данных даёт как единое целое: граф зависимостей многошагового пайплайна, историю запусков по логическим интервалам, retry с учётом этой истории и управляемый backfill — cron+Sidekiq эти возможности не предоставляют из коробки."
      - id: b
        text: "Sidekiq умеет ретраить упавшую джобу, но не умеет ретраить только один шаг внутри уже частично выполненного многошагового пайплайна — джобу приходится перезапускать целиком"
        correct: false
        explanation: "Это реальное ограничение Sidekiq для сложных пайплайнов, но не главная причина: даже избирательный retry внутри одной джобы не дал бы декларативного графа зависимостей, видимости истории по логическим интервалам и backfill — того, чего действительно не хватает этой связке."
      - id: c
        text: "cron хранит расписание только на одном сервере, и при его отказе следующий запуск просто не произойдёт, пока кто-то вручную не перенесёт crontab"
        correct: false
        explanation: "Это реальный операционный риск cron на одной машине, но он решается стандартными средствами инфраструктуры (managed cron, Kubernetes CronJob) — сам по себе он не объясняет отсутствие графа зависимостей и backfill, из-за которых связку не считают заменой оркестратора."
      - id: d
        text: "Rails-приложение может обращаться к внешнему API, но не умеет параллельно тянуть данные из нескольких источников в рамках одной джобы"
        correct: false
        explanation: "Rails и Sidekiq прекрасно параллелят запросы к нескольким источникам через отдельные джобы — ограничение параллелизма не описывает разницу между связкой cron+Sidekiq и оркестратором."
    explanation: "Один cron-таск с одной Sidekiq-джобой работает, пока пайплайн простой и однозвенный. Оркестратор данных нужен там, где появляются множественные взаимозависимые шаги («сначала выгрузить, потом трансформировать, потом обновить витрину, и только если предыдущий шаг успешен»), необходимость видеть историю запусков по логическим интервалам, автоматический retry с учётом уже выполненной части графа, и управляемый прогон задним числом (backfill) за пропущенный или уже случившийся с ошибкой период — ничего из этого cron и обычная джоб-очередь не дают сами по себе."
    extended_explanation: "Граница пролегает не по «умеет ли Sidekiq выполнить код», а по тому, кто отвечает за координацию между шагами: в связке cron+Sidekiq эту координацию приходится писать руками внутри самой джобы (проверять, отработал ли предыдущий шаг, вручную логировать историю запусков), тогда как оркестратор берёт эту ответственность на себя как встроенную часть платформы."
    recommendation: "Сформулировать для себя порог сложности пайплайна, после которого cron+джоб-очередь стоит заменить полноценным оркестратором."
