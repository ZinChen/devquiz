  - id: q15
    text: "Spark-джоба читает таблицу с условием WHERE region = 'eu' и джойнит её с другой таблицей. Что из перечисленного — это predicate pushdown применительно к этому запросу?"
    type: single
    options:
      - id: a
        text: "Spark сначала загружает всю таблицу целиком в память, а затем применяет фильтр по region в оперативной памяти"
        correct: false
        explanation: "Это описание отсутствия pushdown — наивного подхода, при котором фильтрация происходит уже после полной загрузки данных, что и является той неэффективностью, которую pushdown устраняет."
      - id: b
        text: "Spark кэширует результат джойна на диске для повторного использования в следующих запросах"
        correct: false
        explanation: "Кэширование результата — отдельная независимая оптимизация повторного использования вычислений, не связанная с фильтрацией данных на этапе чтения."
      - id: c
        text: "Фильтр по region применяется на уровне чтения файлов источника, до того, как данные попадут в память Spark"
        correct: true
        explanation: "Pushdown означает, что условие фильтрации спускается движком как можно ближе к источнику данных, ещё до чтения ненужных строк."
      - id: d
        text: "Spark автоматически создаёт индекс по колонке region перед выполнением джойна"
        correct: false
        explanation: "Автоматическое создание индекса — не то, что делает Spark при выполнении запроса; predicate pushdown опирается на уже существующие метаданные и статистику формата хранения."
    explanation: "Predicate pushdown — оптимизация, при которой условие фильтра передаётся источнику данных (файловой системе, СУБД, формату вроде Parquet с его метаданными по блокам), чтобы отфильтровать ненужные строки или целые блоки до того, как они попадут в вычислительный движок. Это резко снижает объём данных, который нужно прочитать и передать по сети."
    extended_explanation: "Эффективность pushdown сильно зависит от формата хранения: у колоночных форматов вроде Parquet есть статистика min/max по блокам (аналог zone maps), позволяющая пропустить целые блоки данных ещё до чтения — у плоского CSV такой возможности физически нет, и pushdown там сводится лишь к досрочному прекращению чтения строки при парсинге."
    recommendation: "Прочитать про predicate pushdown в связке с колоночными форматами и то, как его использование видно в Spark UI / EXPLAIN плане."
    difficulty: hard
    topics: [analytics]

