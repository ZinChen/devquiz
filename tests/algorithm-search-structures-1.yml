slug: algorithm-search-structures-1
title: "Алгоритмы: поиск и структуры данных"
description: "Паттерны решения задач: бинарный поиск через монотонный предикат, стек (монотонный и псевдостек), точки и отрезки, связанный список (фиктивный узел и частичный разворот)."
tags: [algorithms, claude-gen]
difficulty: advanced
estimated_time: 25

questions:
  - id: q1
    text: "Бинарный поиск реализуется через предикат good(x) — булеву функцию элемента, делящую массив на «сначала все хорошие, потом все плохие». Какая ошибка чаще всего встречается при реализации good?"
    type: single
    options:
      - id: a
        text: "good зависит от границ поиска L/R, а не только от текущего среднего элемента"
        correct: true
        explanation: "Предикат good должен принимать решение исключительно на основе значения текущего элемента M — если он опирается на L/R, логика бинарного поиска ломается: границы меняются на каждой итерации, а не сам критерий разделения."
      - id: b
        text: "good возвращает булево значение вместо числа"
        correct: false
        explanation: "Булево значение — как раз то, что и должен возвращать предикат good — это не ошибка, а суть подхода."
      - id: c
        text: "good вычисляется до входа в цикл вместо вычисления внутри него"
        correct: false
        explanation: "good — это функция от текущего элемента, естественно вызываемая на каждой итерации цикла; вычисление «до входа» не описывает типичную ошибку в этом паттерне."
      - id: d
        text: "good сравнивает элемент массива со средним индексом, а не со значением"
        correct: false
        explanation: "Такая путаница возможна теоретически, но не является характерной, часто называемой ошибкой этого паттерна — типичная проблема именно в зависимости good от границ поиска."
    explanation: "Смысл паттерна — предикат good(M) зависит только от текущего среднего элемента, не от текущих границ L/R. Если good случайно завязать на L/R, поиск перестаёт корректно сужать диапазон."
    topics: [algorithms]
    extended_explanation: |
      Перед написанием good важно заранее решить, что именно ищется —
      первый "хороший" элемент или последний "плохой": от этого выбора
      зависит, в какой из границ (L или R) окажется финальный ответ
      после завершения цикла.

      ```
      L, R = -1, n          // L — заведомо плохой, R — заведомо хороший
      while R - L > 1:
          M = (L + R) / 2
          if good(M):        // good зависит только от M
              R = M
          else:
              L = M
      // R — первый "хороший" элемент
      ```
    recommendation: "Повторить паттерн «бинарный поиск по предикату» (binary search on answer): leetcode.com/discuss/general-discussion/786126 — универсальный шаблон и типичные ошибки реализации."

  - id: q2
    text: "Нужно найти последнее вхождение числа в отсортированном массиве с возможными дубликатами. Как сформулировать предикат good(x) для этой задачи?"
    type: single
    options:
      - id: a
        text: "good(x) = x < target"
        correct: false
        explanation: "Такой предикат разделяет массив на элементы строго меньше цели и остальные — не даёт напрямую последнее вхождение искомого значения."
      - id: b
        text: "good(x) = x ≤ target"
        correct: true
        explanation: "good(x) = x ≤ target делит массив на «все элементы не больше цели» и «все элементы больше цели» — после завершения поиска левая граница указывает на последний элемент, удовлетворяющий этому предикату, то есть на последнее вхождение target."
      - id: c
        text: "good(x) = x == target"
        correct: false
        explanation: "Равенство не образует монотонного разбиения «сначала все хорошие, потом все плохие» — дубликаты цели могут стоять не подряд относительно остальных значений с точки зрения такого предиката."
      - id: d
        text: "good(x) = x > target"
        correct: false
        explanation: "Такой предикат находит первый элемент, больший цели, а не последнее вхождение самой цели."
    explanation: "Формула good(x) = x ≤ target делает массив монотонным по этому критерию: сначала идут все значения не больше искомого (включая все дубликаты target), затем — всё, что строго больше. Граница между этими двумя зонами — и есть последнее вхождение."
    topics: [algorithms]
    extended_explanation: |
      Для симметричной задачи (первое вхождение) предикат меняется на
      good(x) = x < target — и ответ оказывается уже на другой границе.
      Найти оба вхождения сразу можно двумя независимыми запусками
      такого поиска с разными предикатами — паттерн "двойной бинарный
      поиск".
    recommendation: "Прорешать задачу «первое и последнее вхождение элемента» целиком — она напрямую тренирует выбор верного good под конкретную формулировку условия."

  - id: q3
    text: "Массив был отсортирован по возрастанию, а затем циклически сдвинут на неизвестное число позиций. Нужно найти в нём заданный элемент за O(log n). Как построить решение через двойной бинарный поиск?"
    type: single
    options:
      - id: a
        text: "Один бинарный поиск сразу по всему массиву без учёта сдвига — циклический сдвиг не влияет на бинарный поиск"
        correct: false
        explanation: "Циклический сдвиг ломает монотонность массива относительно исходного порядка — обычный бинарный поиск по несдвинутому предикату здесь не сработает напрямую."
      - id: b
        text: "Сначала бинарным поиском найти величину сдвига (точку минимума), затем вторым бинарным поиском искать сам элемент с учётом найденного сдвига"
        correct: true
        explanation: "Первый поиск находит точку разворота (минимальный элемент = величина сдвига), после чего массив можно логически «развернуть» обратно и вторым поиском найти нужный элемент — классический паттерн двойного бинарного поиска: один поиск готовит почву для второго."
      - id: c
        text: "Линейно пройти массив, чтобы найти точку сдвига, затем применить бинарный поиск только к части после неё"
        correct: false
        explanation: "Линейный проход для поиска точки сдвига убивает исходную цель — оценку O(log n): такой шаг сам по себе уже O(n)."
      - id: d
        text: "Отсортировать массив заново, чтобы убрать эффект сдвига, затем искать бинарным поиском"
        correct: false
        explanation: "Пересортировка — операция O(n log n), что значительно хуже требуемой сложности всей задачи, и вообще не нужна для этой техники."
    explanation: "Это классический пример паттерна «двойной бинарный поиск»: первый поиск находит подготовительную информацию (здесь — величину сдвига через точку минимума), второй поиск использует её, чтобы найти сам искомый элемент."
    topics: [algorithms]
    extended_explanation: |
      Формальная оценка двух последовательных бинарных поисков —
      O(2 log n), но по правилу «константы не важны» это упрощается до
      O(log n) — итоговая сложность остаётся логарифмической, несмотря
      на два прохода.
    recommendation: "Сравнить с задачей «первое и последнее вхождение элемента» — оба примера объединяет одна и та же идея: два независимых или последовательных бинарных поиска с разными предикатами good."

  - id: q4
    text: "Дан массив чисел — для каждого элемента нужно найти первый элемент справа, который больше текущего (если такого нет — вернуть -1). Какая структура данных решает эту задачу за O(n)?"
    type: single
    options:
      - id: a
        text: "Обычный стек промежуточных результатов, обходя массив слева направо"
        correct: false
        explanation: "Обычный стек без поддержания монотонности здесь не даёт прямого способа быстро находить ближайший больший элемент — нужна именно монотонная структура."
      - id: b
        text: "Массив префиксных максимумов, посчитанный заранее"
        correct: false
        explanation: "Префиксный максимум даёт максимум слева от позиции, а не первый элемент строго справа, который больше текущего — это другая величина."
      - id: c
        text: "Монотонный стек, обходя массив справа налево"
        correct: true
        explanation: "При обходе справа налево монотонный стек хранит кандидатов на роль «первого большего элемента справа»: пока вершина стека меньше либо равна текущему элементу, она снимается — она точно никому левее не подойдёт; то, что осталось на вершине, и есть ответ для текущего элемента."
      - id: d
        text: "Псевдостек — переменная-счётчик вместо полноценного стека"
        correct: false
        explanation: "Псевдостек годится, когда важен только размер стека, а не конкретные хранимые значения — здесь же важны сами значения элементов для сравнения, псевдостек не подходит."
    explanation: "Формулировка «ближайший больший/меньший элемент слева/справа» — прямой сигнал паттерна «монотонный стек». Обход справа налево с удалением заведомо неподходящих кандидатов с вершины даёт решение за O(n), несмотря на визуальную вложенность циклов (снятие и добавление)."
    topics: [algorithms]
    extended_explanation: |
      Оценка O(n) по времени объясняется тем, что каждый элемент
      кладётся на стек и снимается с него максимум один раз за весь
      проход — суммарное число операций линейно, даже если конкретный
      элемент может провоцировать несколько снятий соседей.

      ```
      stack = []
      for i from n-1 downto 0:
          while stack not empty and stack.top <= a[i]:
              stack.pop()          // вершина точно никому левее не подойдёт
          answer[i] = stack.top if stack not empty else -1
          stack.push(a[i])
      ```
    recommendation: "Прорешать классическую задачу «daily temperatures» (через сколько дней будет теплее) — тот же паттерн монотонного стека на новой формулировке."

  - id: q5
    text: "Нужно проверить правильность скобочной последовательности, где используется только один вид скобок — «(» и «)». Какое решение оптимально по памяти?"
    type: single
    options:
      - id: a
        text: "Полноценный стек, кладущий каждую открывающую скобку как отдельный элемент"
        correct: false
        explanation: "Работает корректно, но расходует O(n) памяти в худшем случае, хотя для одного вида скобок достаточно гораздо меньше."
      - id: b
        text: "Рекурсивный разбор с созданием нового массива на каждом уровне вложенности"
        correct: false
        explanation: "Избыточно по памяти для задачи, которая решается одной переменной-счётчиком за один линейный проход."
      - id: c
        text: "Хеш-таблица, считающая количество каждого вида скобки"
        correct: false
        explanation: "Простой подсчёт количества скобок не проверяет порядок их следования — строка «)(» имеет равное число открывающих и закрывающих, но невалидна."
      - id: d
        text: "Псевдостек — переменная-счётчик баланса: +1 на открывающей, -1 на закрывающей"
        correct: true
        explanation: "Для одного вида скобок важен только текущий размер условного стека (баланс), а не то, какие конкретно скобки в нём лежат — счётчика достаточно, и он занимает O(1) памяти вместо O(n)."
    explanation: "Когда важен только размер стека, а не конкретное содержимое, полноценный стек можно заменить одной переменной-счётчиком — паттерн «псевдостек». Открывающая скобка увеличивает баланс, закрывающая уменьшает; если баланс становится отрицательным — сразу false, в конце баланс должен быть равен 0."
    topics: [algorithms]
    extended_explanation: |
      Для нескольких видов скобок псевдостек уже не работает — тип
      закрывающей скобки нужно сверять именно с последней открытой, а
      не просто уменьшать общий счётчик, поэтому там нужен полноценный
      стек промежуточных результатов.
    recommendation: "Различать формулировки «один вид скобок» (псевдостек, O(1) память) и «несколько видов скобок» (полноценный стек, O(n) память) — они выглядят похоже, но решаются разными структурами."

  - id: q6
    text: "Вычисляется выражение, записанное в обратной польской нотации (числа и операторы через пробел, например «3 4 +»). Как это решается через стек?"
    type: single
    options:
      - id: a
        text: "Числа кладутся в стек; при встрече оператора — достаются два верхних числа, применяется операция, результат кладётся обратно в стек"
        correct: true
        explanation: "Обратная польская запись устроена так, что к моменту встречи оператора его операнды уже лежат на вершине стека — операция и кладёт обратно один результат вместо двух операндов."
      - id: b
        text: "Числа и операторы кладутся в стек вперемешку, финальный ответ — сумма всех чисел в стеке"
        correct: false
        explanation: "Операторы не хранятся в стеке как отдельные значения — они применяются сразу к операндам с вершины стека."
      - id: c
        text: "Выражение сначала переводится в обычную инфиксную запись, а затем вычисляется без стека"
        correct: false
        explanation: "Обратная запись как раз и существует для того, чтобы вычислять выражение напрямую стеком, без промежуточного перевода в инфиксную форму со скобками."
      - id: d
        text: "Операторы кладутся в стек, а числа применяются к верхнему оператору сразу при встрече"
        correct: false
        explanation: "Порядок обратный: в стеке накапливаются именно числа-операнды, операторы обрабатываются сразу в момент встречи, а не откладываются."
    explanation: "Обратная польская нотация вычисляется стеком промежуточных результатов: числа кладутся на стек по мере чтения, а при встрече оператора с вершины снимаются два последних числа, к ним применяется операция, и результат кладётся обратно — тем самым выражение сводится к одному финальному значению на стеке."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности — O(n) по времени и памяти (в худшем случае, если
      все токены — числа, весь ввод окажется на стеке одновременно).
      Тот же паттерн «стек промежуточных результатов» используется для
      проверки вложенности скобок нескольких видов.
    recommendation: "Сравнить с обычной инфиксной записью со скобками и приоритетом операций — обратная запись специально спроектирована так, чтобы избежать необходимости учитывать приоритет при вычислении."

  - id: q7
    text: "Дан массив отрезков (интервалов) — нужно объединить все пересекающиеся между собой отрезки в минимальный набор непересекающихся. Как решить задачу за O(n log n)?"
    type: single
    options:
      - id: a
        text: "Построить граф пересечений отрезков и искать компоненты связности"
        correct: false
        explanation: "Формально рабочий подход, но избыточен по сложности реализации и по времени по сравнению с прямым методом отрезков после сортировки."
      - id: b
        text: "Для каждой пары отрезков проверить пересечение и объединить подходящие пары"
        correct: false
        explanation: "Перебор всех пар отрезков даёт O(n²) — значительно хуже требуемой оценки O(n log n)."
      - id: c
        text: "Отсортировать отрезки по начальной точке; идти по списку, объединяя текущий с последним добавленным в ответ, если они пересекаются"
        correct: true
        explanation: "После сортировки по началу достаточно одного линейного прохода: если текущий отрезок пересекается с последним в накопленном ответе — расширяем последний, иначе добавляем текущий как новый — вся сложность приходится на сортировку."
      - id: d
        text: "Применить два указателя с двух концов отсортированного по длине массива отрезков"
        correct: false
        explanation: "Сортировка именно по длине не даёт правильного порядка для последовательного объединения пересекающихся интервалов — нужна сортировка по начальной точке."
    explanation: "Это паттерн «метод отрезков»: после сортировки по началу задача сводится к единственному линейному проходу с проверкой пересечения текущего отрезка с последним уже добавленным в ответ. Два отрезка пересекаются, если максимум их начал не превышает минимум их концов."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности O(n log n) — время доминирует сортировка, сам
      проход после неё линеен O(n); память — O(n) на хранение ответа.
      Это базовый паттерн для всей темы "точки и отрезки" — остальные
      два паттерна (два указателя на отрезках, метод точек) применяются
      к более специфичным формулировкам условия.
    recommendation: "Запомнить формулу пересечения отрезков — max(начал) ≤ min(концов) — она пригождается практически во всех задачах этой темы."

  - id: q8
    text: "Даны два отдельных отсортированных списка интервалов (например, свободное время двух людей) — нужно найти все пересечения между списками. Какой паттерн применить?"
    type: single
    options:
      - id: a
        text: "Метод отрезков — тот же подход, что для объединения одного списка"
        correct: false
        explanation: "Метод отрезков рассчитан на один список интервалов; здесь два независимых отсортированных списка, для которых естественнее свой паттерн."
      - id: b
        text: "Слияние двух списков в один, затем применение метода отрезков к объединённому списку"
        correct: false
        explanation: "После слияния теряется информация о принадлежности интервала конкретному исходному списку, которая нужна, чтобы находить именно пересечения между списками, а не внутри одного объединённого."
      - id: c
        text: "Метод точек — превратить все интервалы в точки начала/конца с весами"
        correct: false
        explanation: "Метод точек ищет максимум одновременных событий в один момент времени, а не конкретные пары пересекающихся интервалов между двумя списками — другая постановка задачи."
      - id: d
        text: "Два указателя на отрезках — по указателю на каждый список, сравнение текущих интервалов, движение указателя с более ранним концом"
        correct: true
        explanation: "Раз даны именно два отдельных отсортированных списка, естественная адаптация классического паттерна «два указателя» — завести по указателю на каждый список и двигать тот, чей текущий интервал заканчивается раньше."
    explanation: "Наличие именно двух отдельных отсортированных последовательностей — прямой сигнал переиспользовать паттерн «два указателя», знакомый по задачам на массивах, применительно к отрезкам: указатель на каждый список, сравниваем текущие интервалы, двигаем тот, у которого раньше заканчивается конец."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n+m) по времени (по одному проходу по каждому
      списку), O(max(n,m)) по памяти в худшем случае на хранение ответа.
      Общий фреймворк темы «точки и отрезки»: две последовательности
      отрезков → два указателя на отрезках; максимум одновременных
      событий → метод точек; иначе (один список) → метод отрезков.
    recommendation: "Отличать по формулировке условия: один список → метод отрезков; два списка → два указателя на отрезках; «максимум одновременно» → метод точек."

  - id: q9
    text: "Дан список бронирований переговорных комнат (начало и конец каждой брони) — нужно найти минимальное число комнат, которое потребуется одновременно. Какой паттерн решает эту задачу?"
    type: single
    options:
      - id: a
        text: "Хеш-таблица, считающая число броней, начинающихся в каждый конкретный момент времени"
        correct: false
        explanation: "Подсчёт только начал броней не учитывает те брони, которые уже идут (начались раньше, но ещё не закончились) — так занижается реальная одновременная загрузка."
      - id: b
        text: "Метод отрезков — объединение всех пересекающихся броней в один общий интервал"
        correct: false
        explanation: "Объединение пересекающихся отрезков даёт итоговые непересекающиеся интервалы занятости, но не отвечает напрямую на вопрос «сколько комнат нужно одновременно» — для этого нужен именно счётчик пиковой одновременности."
      - id: c
        text: "Бинарный поиск по числу комнат с проверкой достаточности на каждой итерации"
        correct: false
        explanation: "Формально возможный, но избыточно сложный подход по сравнению с прямым методом точек, дающим точный ответ за один проход после сортировки."
      - id: d
        text: "Метод точек — каждый отрезок превращается в точку начала (+1) и точку конца (-1), точки сортируются, ищется максимум счётчика по проходу"
        correct: true
        explanation: "Задача про максимум одновременных занятых комнат в любой момент времени — ровно то, для чего предназначен метод точек: превращение отрезков в точки с весами и поиск пика суммарного счётчика."
    explanation: "Формулировка «минимальное число комнат/ресурсов одновременно» — прямой сигнал паттерна «метод точек»: каждый отрезок раскладывается на точку начала (+1) и точку конца (-1), все точки сортируются (при равенстве сначала конец, потом начало — комната сперва освобождается, потом занимается), и по проходу с накопительным счётчиком ищется максимум."
    topics: [algorithms]
    extended_explanation: |
      Порядок сортировки точек при равенстве координат критичен: если
      бронь A заканчивается ровно в момент начала брони B, комната
      должна успеть освободиться — поэтому точка конца обрабатывается
      раньше точки начала при одинаковом времени. Оценка: O(n log n) по
      времени (сортировка доминирует), O(n) по памяти.

      ```
      points = []
      for (start, end) in bookings:
          points.push((start, +1))
          points.push((end,   -1))
      sort points by (time, type)   // при равенстве -1 раньше +1

      current, peak = 0, 0
      for (time, type) in points:
          current += type
          peak = max(peak, current)
      // peak — минимально нужное число комнат
      ```
    recommendation: "Проверить на конкретном примере с граничным случаем (бронь заканчивается точно в момент начала другой) — там чаще всего проявляется ошибка в порядке сортировки точек."

  - id: q10
    text: "Нужно слить два отсортированных односвязных списка в один отсортированный, переиспользуя существующие узлы (без создания новых). Зачем в решении заводят фиктивный (dummy) узел перед началом результата?"
    type: single
    options:
      - id: a
        text: "Даёт точку крепления для ответа, снимая особый случай первого узла"
        correct: true
        explanation: "До того как выбран первый узел результата, не к чему приклеивать последующие — dummy-узел решает эту проблему единообразно, а финальный ответ — просто `dummy.next`, без специального кода для первого шага."
      - id: b
        text: "Dummy-узел ускоряет слияние с O(N+M) до O(log(N+M))"
        correct: false
        explanation: "Dummy-узел не меняет асимптотическую сложность слияния — она остаётся O(N+M), он лишь упрощает саму логику построения ответа."
      - id: c
        text: "Dummy-узел нужен, чтобы список можно было развернуть в процессе слияния"
        correct: false
        explanation: "Разворот списка — отдельный паттерн (частичный разворот), не связанный с ролью dummy-узла в задаче слияния."
      - id: d
        text: "Dummy-узел хранит текущий минимум среди уже слитых элементов"
        correct: false
        explanation: "Dummy-узел — просто пустая точка крепления в начале результата; хранение минимума для него не характерная роль, минимум и так очевиден по построению отсортированного результата."
    explanation: "В отличие от массива, где для сборки ответа годится пустой массив-аккумулятор, для связанного списка нельзя завести «пустой список» с тем же удобством — фиктивный dummy-узел решает эту проблему, выступая точкой крепления перед первым настоящим узлом ответа."
    topics: [algorithms]
    extended_explanation: |
      Тот же приём убирает необходимость в отдельной ветке `if`,
      обрабатывающей случай, когда модификация списка (удаление,
      замена) может затронуть саму голову списка — dummy стоит перед
      головой, и голова обрабатывается точно так же, как любой другой
      узел.

      ```
      dummy = Node(null)
      tail = dummy
      while list1 and list2:
          smaller = list1 if list1.val <= list2.val else list2
          tail.next = smaller
          tail = smaller
          advance the chosen list
      tail.next = list1 or list2   // остаток любого списка
      return dummy.next
      ```
    recommendation: "Использовать dummy-узел по умолчанию для любой задачи, где собирается новый список из существующих узлов — почти всегда упрощает код."

  - id: q11
    text: "Нужно проверить, является ли односвязный список палиндромом. В массиве это решалось бы двумя указателями с двух концов — но в списке двигаться можно только вперёд. Как адаптировать паттерн?"
    type: single
    options:
      - id: a
        text: "Скопировать все значения в массив, затем применить два указателя к массиву"
        correct: false
        explanation: "Рабочий, но требует O(n) дополнительной памяти на копию — есть решение с O(1) памятью через работу с самим списком."
      - id: b
        text: "Найти середину списка, развернуть только правую половину, затем сравнить обе половины двумя указателями с двух концов"
        correct: true
        explanation: "Частичный разворот второй половины списка даёт возможность двигаться «с конца» без создания копии — после разворота обе половины можно обходить двумя указателями одновременно, как в массиве."
      - id: c
        text: "Рекурсивно обойти список до конца и сравнивать значения на обратном пути рекурсии"
        correct: false
        explanation: "Такой подход технически может работать, но не является стандартной техникой частичного разворота и расходует O(n) памяти на стек рекурсии — не даёт выигрыша по памяти."
      - id: d
        text: "Развернуть список целиком, затем сравнить с исходным списком поэлементно"
        correct: false
        explanation: "Полный разворот списка требует сохранения исходного порядка где-то ещё для сравнения — без копии исходный список теряется в процессе разворота."
    explanation: "Паттерн «частичный разворот» — техническая адаптация: находим середину списка, разворачиваем только вторую половину, после чего появляется возможность обходить список «с двух концов» двумя указателями, недоступная в односвязном списке напрямую."
    topics: [algorithms]
    extended_explanation: |
      Оценка сложности: O(n) по времени (три линейных прохода — поиск
      середины, разворот половины, сравнение), O(1) по памяти — разворот
      выполняется in-place, без создания копии значений.
    recommendation: "Сравнить с задачей «переупорядочить список в последовательность первый-последний-второй-предпоследний» — тот же паттерн частичного разворота, но чередование вместо сравнения."

  - id: q12
    text: "В матрице n×m нужно многократно отвечать на запросы «какая сумма клеток в прямоугольной области от (r1,c1) до (r2,c2)». Запросов много, матрица не меняется. Как ответить на каждый запрос за O(1)?"
