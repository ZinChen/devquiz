        explanation: "Задача выглядит как классическая префиксно-суффиксная, но на самом деле нужны только текущие бегущие значения на каждом шаге, а не все промежуточные значения сразу — это и есть паттерн «бегущий префикс», дающий O(1) дополнительной памяти."
      - id: c
        text: "Перемножить все элементы один раз, затем поделить результат на каждый элемент"
