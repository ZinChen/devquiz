      - id: b
        text: "На каждый запрос заново суммировать все клетки указанной области"
        correct: false
        explanation: "Такой подход даёт O(n×m) на каждый отдельный запрос — при большом числе запросов это значительно медленнее, чем предподсчёт."
      - id: c
        text: "Предподсчитать двумерный префиксный массив сумм, где каждый запрос выражается через 4 значения этого массива"
        correct: true
        explanation: "Двумерная версия префиксных сумм позволяет получить сумму любого прямоугольника за O(1) через комбинацию четырёх предподсчитанных значений — без повторного суммирования клеток на каждый запрос."
      - id: d
        text: "Построить монотонный стек по строкам матрицы"
        correct: false
