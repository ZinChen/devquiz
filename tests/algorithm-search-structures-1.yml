  - id: q14
    text: "Нужно удалить из односвязного списка все узлы с заданным значением. Зачем и здесь удобен фиктивный (dummy) узел перед головой списка, если само значение может быть и на первом месте?"
    type: single
    options:
      - id: a
        text: "Dummy ускоряет удаление узлов с O(n) до O(log n)"
        correct: false
        explanation: "Dummy-узел не меняет асимптотическую сложность прохода по списку — она остаётся O(n), он упрощает только структуру кода."
      - id: b
        text: "Dummy автоматически пропускает узлы с искомым значением без явной проверки"
        correct: false
        explanation: "Проверка значения узла всё равно нужна явно в цикле — dummy сам по себе не выполняет сравнение, он лишь упрощает обработку граничного случая с головой."
      - id: c
        text: "Dummy нужен, чтобы список можно было обходить в обратном направлении"
        correct: false
        explanation: "Обратный обход даёт паттерн частичного разворота, а не dummy-узел — это два разных приёма для разных задач."
      - id: d
        text: "Dummy убирает необходимость в отдельной ветке для случая, когда удаляемый узел — сама голова списка"
        correct: true
        explanation: "Без dummy пришлось бы отдельно проверять и обрабатывать ситуацию «голову списка нужно удалить» — с dummy голова обрабатывается точно так же, как любой другой узел, единым кодом."
    explanation: "Тот же приём, что и при слиянии двух списков: dummy-узел перед головой позволяет единообразно обрабатывать любой узел списка, включая саму голову, без отдельного условия «а что если удаляется первый элемент»."
    topics: [algorithms]
    extended_explanation: |
      Общий признак, когда стоит завести dummy-узел: операция может
      затронуть саму голову списка (удаление, замена, вставка перед
      текущей головой), или требуется точка крепления для собираемого
      с нуля ответа — оба случая закрываются одним и тем же приёмом.

      ```
      dummy = Node(null)
      dummy.next = head
      prev = dummy
      curr = head
      while curr:
          if curr.val == target:
              prev.next = curr.next   // голова тоже проходит через prev
          else:
              prev = curr
          curr = curr.next
      return dummy.next
      ```
    recommendation: "Проверять на собеседовании явно: «может ли операция затронуть голову списка?» — если да, dummy почти всегда упрощает решение."

