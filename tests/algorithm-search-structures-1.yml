    explanation: "Задача выглядит как «префиксная», но не требует хранения всех промежуточных префиксных и суффиксных значений одновременно — только текущее бегущее значение на каждом шаге прохода. Это и есть паттерн «бегущий префикс»: O(n) по времени, O(1) по дополнительной памяти вместо O(n) у полного массива сумм/произведений."
