        correct: false
        explanation: "Работает корректно, но расходует O(n) дополнительной памяти на оба вспомогательных массива, тогда как есть решение с O(1) дополнительной памяти."
      - id: b
        text: "Два прохода с «бегущим» произведением слева и справа, без хранения полных префиксного и суффиксного массивов"
