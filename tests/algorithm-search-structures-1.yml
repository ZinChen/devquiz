    explanation: "Задача про множество запросов агрегатов по диапазонам — сигнал паттерна «массив сумм» (здесь — двумерного). Предподсчёт делается один раз за O(n×m), а каждый последующий запрос отвечается за O(1) через комбинацию значений префиксного массива."
