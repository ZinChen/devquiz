      этого же паттерна — найти позицию для ладьи с максимальной суммой
      клеток «под боем» (вся строка и весь столбец), решаемая
      предподсчитанными суммами по строкам и по столбцам.
    recommendation: "Отличать эту задачу (много запросов по неизменной матрице — нужен предподсчёт) от задачи с одним проходом, где предподсчёт избыточен."

  - id: q13
    text: "Нужно для каждого элемента массива посчитать произведение всех остальных элементов, кроме самого себя, без использования деления. Оптимальное решение по памяти — какое?"
