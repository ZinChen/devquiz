slug: postgres-concurrency-kafka
title: "PostgreSQL: конкурентность в реальных системах"
description: "Advisory locks, версии и уровни изоляции не как абстракции, а в контексте Kafka-консюмеров, PgBouncer, фоновых задач и многопоточной обработки. Где гонка вообще берётся, почему партиционирование Kafka не спасает и какой инструмент для какого момента жизни сущности."
tags: [postgresql, kafka, locking, concurrency, backend, claude-gen]
difficulty: expert
estimated_time: 30

questions:
  - id: q1
    text: "Консюмер обрабатывает событие о создании сущности, которой ещё нет в таблице. Почему `SELECT ... FOR UPDATE` не защищает от дублей при параллельной обработке двух копий события?"
    type: single
    options:
      - id: a
        text: "`FOR UPDATE` держит блокировку лишь до конца запроса, поэтому к моменту INSERT она уже снята"
        correct: false
        explanation: "Блокировки строк держатся до конца транзакции. Дело в том, что при пустом результате держать нечего."
      - id: b
        text: "`FOR UPDATE` не работает в autocommit, а консюмеры обычно ходят в базу без явной транзакции"
        correct: false
        explanation: "Многие консюмеры открывают транзакцию на каждое сообщение. Ограничение связано с отсутствием строки, режим транзакции тут ни при чём."
      - id: c
        text: "`FOR UPDATE` блокирует найденные строки, а если строки ещё нет, блокировать нечего"
        correct: true
        explanation: "Оба обработчика получат пустой результат SELECT, не будут ничего ждать и оба пойдут на INSERT."
      - id: d
        text: "`FOR UPDATE` и INSERT нельзя выполнять в одной транзакции: PostgreSQL требует разделять чтение и запись"
        correct: false
        explanation: "SELECT и INSERT свободно сочетаются в одной транзакции, такого ограничения у PostgreSQL нет."
    explanation: "Оба обработчика выполнят `SELECT ... FOR UPDATE` по внешнему идентификатору, оба получат пустой результат и оба пойдут на INSERT. Гонка разрешится либо на уникальном индексе (дубль поймается, но согласованно продолжить будет нечем), либо блокировкой, взятой заранее по значению, которого у строки ещё нет: advisory lock."
    extended_explanation: "Проверить на практике: открыть две транзакции в psql и в обеих выполнить `SELECT ... FOR UPDATE` по несуществующему `external_id`. Обе сразу вернут пустой результат, без какого-либо ожидания. На практике стоит просмотреть пути создания сущностей в консюмерах и убедиться, что там нет `FOR UPDATE` по строке, которой ещё не существует."
    recommendation: "Блокировки строк в PostgreSQL: что именно захватывает `SELECT ... FOR UPDATE` и чем блокировка существующей строки отличается от защиты момента создания (раздел Explicit Locking документации)."
    difficulty: easy
    topics: [locking, messaging]

  - id: q2
    text: "Сообщения с одним ключом всегда попадают в одну партицию, а партицию в группе читает ровно один процесс. Откуда тогда берётся одновременная обработка одной сущности двумя обработчиками?"
    type: single
    options:
      - id: a
        text: "Порядок в партиции гарантирован, но при ребалансировке владелец меняется, и ключ могут обрабатывать двое сразу"
        correct: true
        explanation: "Партиционирование защищает от гонки между сообщениями одной партиции, но не от гонки по бизнес-ключу. Ребалансировка, ретраи без отката offset и разные ключи у апстримов эту защиту ломают."
      - id: b
        text: "Консюмеры одной группы читают партицию несколькими потоками по умолчанию, поэтому порядок нарушается всегда"
        correct: false
        explanation: "Порядок внутри партиции сохраняется, а чтение партиции одним потоком — штатный режим. Гонка возникает из-за смены владельца."
      - id: c
        text: "Гонка возможна лишь между разными группами консюмеров, внутри одной группы она исключена протоколом"
        correct: false
        explanation: "Внутри группы владелец тоже меняется при ребалансировке, а зависший процесс об этом может не знать."
      - id: d
        text: "Брокеры реплицируют партицию на нескольких консюмеров ради отказоустойчивости, и сообщение обрабатывают оба"
        correct: false
        explanation: "Репликация партиций происходит между брокерами и на выбор консюмеров не влияет. Читает партицию один консюмер группы."
    explanation: "Гарантия Kafka защищает от гонки между сообщениями одной партиции, но не от гонки по бизнес-ключу: это разные оси. Пока группа стабильна, всё работает. При ребалансировке, ретрае после сбоя или когда два сервиса шлют события об одной сущности под разными ключами, гарантия перестаёт действовать."
    extended_explanation: "Ещё один источник — смена схемы партиционирования: если ключ меняют (скажем, с внутреннего id на внешний), старые и новые сообщения об одной сущности временно оказываются в разных партициях. На практике полезно проверить, что все продюсеры, пишущие об одной бизнес-сущности, используют один и тот же ключ партиционирования."
    recommendation: "Партиционирование и consumer groups в Kafka: гарантия порядка внутри партиции, ребалансировка и её влияние на владение ключом."
    difficulty: medium
    topics: [messaging, concurrency]

  - id: q3
    text: "Сервис ограничивает суммарный дневной лимит по паре счетов. Две параллельные транзакции на `REPEATABLE READ` читают и обновляют разные счета, каждая проходит проверку по своему снимку и коммитится, а вместе они превышают лимит. Как называется этот эффект?"
    type: single
    options:
      - id: a
        text: "Lost update: вторая транзакция перезаписывает значение, которое первая только что обновила"
        correct: false
        explanation: "При lost update транзакции меняют одну и ту же строку. Здесь они пишут в разные, поэтому на `REPEATABLE READ` его бы поймала ошибка конкурентного обновления."
      - id: b
        text: "Deadlock, разрешённый PostgreSQL в пользу одной из двух конфликтующих транзакций"
        correct: false
        explanation: "Транзакции не ждут друг друга: каждая читает и пишет свою пару строк, цикла ожидания нет."
      - id: c
        text: "Phantom read: появление новой строки, не видной в снимке, зафиксированном на старте транзакции"
        correct: false
        explanation: "Обе транзакции работают с уже существующими строками счетов. Новых строк в игре нет."
      - id: d
        text: "Write skew: каждая транзакция корректна по своему снимку, но вместе они нарушают инвариант"
        correct: true
        explanation: "`REPEATABLE READ` защищает от non-repeatable read и фантомов, но не от инварианта, зависящего сразу от нескольких строк. От write skew спасает `SERIALIZABLE` или явная блокировка."
    explanation: "Write skew возникает, когда две транзакции читают пересекающиеся данные, пишут в разные строки, и каждая по своему снимку не нарушает правил, но инвариант, зависящий от обеих строк, ломается. В PostgreSQL от него защищает только `SERIALIZABLE` (или явная блокировка строк, на которых держится инвариант)."
    extended_explanation: "Классический пример — дежурства врачей: правило «хотя бы один врач на смене» и два врача, каждый из которых видит, что коллега на месте, и уходит. Оба ухода по отдельности безопасны."
    recommendation: "Аномалии изоляции транзакций (write skew, phantom read, lost update) и уровни изоляции PostgreSQL: что защищает каждый из них."
    difficulty: hard
    topics: [transactions, concurrency]

  - id: q4
    text: "Сервис работает через PgBouncer в режиме transaction pooling и использует `pg_advisory_xact_lock` вместо `pg_advisory_lock`. Чем это принципиально для корректности?"
    type: single
    options:
      - id: a
        text: "Транзакционная версия быстрее: она не пишет в `pg_locks` и не занимает слот разделяемой памяти"
        correct: false
        explanation: "Обе версии занимают слот в таблице блокировок и видны в `pg_locks`. Различаются они областью действия."
      - id: b
        text: "Лок снимается на COMMIT, ровно когда PgBouncer отдаёт соединение другому клиенту"
        correct: true
        explanation: "Граница лока совпадает с границей пула, поэтому соединение возвращается без висящих блокировок. Сессионный лок остался бы на физическом соединении и достался следующему клиенту."
      - id: c
        text: "Обычная версия не поддерживается PgBouncer и возвращает ошибку при первом же вызове"
        correct: false
        explanation: "PgBouncer прозрачно пропускает вызов: сбой проявляется позже, когда соединение возвращается в пул с висящим локом."
      - id: d
        text: "Транзакционная версия допускает общий (shared) режим, а обычная — только эксклюзивный"
        correct: false
        explanation: "Общие режимы есть у обеих версий (`pg_advisory_lock_shared` и `pg_advisory_xact_lock_shared`). Отличие не в режиме."
    explanation: "Обычный advisory lock живёт до явного unlock или разрыва сессии, а в transaction pooling у клиента нет собственной серверной сессии: соединение постоянно переходит от клиента к клиенту. Лок повис бы на физическом соединении и достался бы чужому клиенту. Транзакционная версия умирает вместе с транзакцией и ничего не оставляет."
    extended_explanation: "Посмотреть текущий pool_mode можно командой SHOW CONFIG в консоли администратора PgBouncer. Если сервису нужен именно сессионный лок, ему выделяют отдельный пул в session pooling, расплачиваясь меньшей плотностью соединений. Практическое правило для код-ревью: любой advisory lock в сервисе за PgBouncer в transaction pooling должен быть только xact-версии."
    recommendation: "Режимы пулинга PgBouncer (session, transaction, statement) и то, какое серверное состояние сессии в них теряется."
    difficulty: medium
    topics: [locking, operations]

  - id: q5
    text: "Чем «дубль сообщения» отличается от «устаревшего сообщения» с точки зрения механизма, который его ловит?"
    type: single
    options:
      - id: a
        text: "Дубль ловится проверкой версии, а устаревшее сообщение — таблицей обработанных `message_id`"
        correct: false
        explanation: "Роли перепутаны. Дубль с уже применённой версией проверка версии не отличит от нормального обновления на ту же версию."
      - id: b
        text: "Оба случая ловятся только уникальным индексом по бизнес-ключу, отдельные механизмы не нужны"
        correct: false
        explanation: "Индекс по бизнес-ключу не даёт создать вторую строку, но не отличит повтор от более свежего обновления и не отбросит устаревшее."
      - id: c
        text: "Дубль ловит идемпотентный продюсер Kafka, а устаревшее сообщение — истечение TTL сообщения в топике"
        correct: false
        explanation: "Идемпотентный продюсер защищает публикацию. Применение к БД он не контролирует. Повторная доставка консюмеру при этом остаётся возможной."
      - id: d
        text: "Дубль ловит таблица `message_id`, устаревшее сообщение — сравнение версий"
        correct: true
        explanation: "Дубль нужно пропустить целиком, устаревшее — отбросить, если применённая версия новее. Таблицу `message_id` в этой роли называют inbox."
    explanation: "Дубль — та же полезная нагрузка с тем же `message_id`: его нужно пропустить, не трогая данные. Устаревшее — другое содержимое, опубликованное раньше уже применённого: его отбрасывают, если применённая версия новее. В одной транзакции сначала проверяют дубль по `message_id`, затем версию."
    extended_explanation: "Типичная inbox-таблица: `CREATE TABLE inbox (message_id text PRIMARY KEY, processed_at timestamptz)`. Проверка дубля — `INSERT INTO inbox (message_id) VALUES (:id) ON CONFLICT DO NOTHING`: ноль затронутых строк означает «уже обрабатывали». Паттерн применим не только к Kafka, а к любому источнику сообщений с повторной доставкой."
    recommendation: "Паттерн Transactional Inbox: идемпотентная обработка сообщений, дедупликация по `message_id` и отсечение устаревших версий."
    difficulty: medium
    topics: [messaging, transactions]

  - id: q6
    text: "Нужно гарантировать, что ежедневная scheduled job не запустится вторым экземпляром, пока предыдущий ещё работает, при нескольких инстансах приложения за балансировщиком. Что для этого подходит?"
    type: single
    options:
      - id: a
        text: "Счётчик версии в отдельной таблице, который джоба увеличивает перед каждым стартом"
        correct: false
        explanation: "Version-check ловит конфликт на существующей записи, но не говорит, кто должен выполнять джобу прямо сейчас."
      - id: b
        text: "`pg_try_advisory_lock` по ключу с именем джобы: если ключ занят, инстанс пропускает запуск"
        correct: true
        explanation: "Для координации «кто выполняет это сейчас» не нужна строка данных, достаточно зафиксированного ключа. Остальные инстансы видят занятый ключ и просто выходят."
      - id: c
        text: "Уровень изоляции `SERIALIZABLE` для транзакции, в которой выполняется тело джобы"
        correct: false
        explanation: "`SERIALIZABLE` защищает инварианты между строками. Запуск процесса он не координирует. Два инстанса спокойно выполнили бы джобу параллельно."
      - id: d
        text: "`LOCK TABLE ... ACCESS EXCLUSIVE` на таблицу отчётов на всё время выполнения джобы"
        correct: false
        explanation: "Второй инстанс не пропустит запуск, а повиснет в ожидании, и заодно встанет вся остальная работа с таблицей."
    explanation: "Задача «не дать двум процессам одновременно делать одно и то же» не требует существующей строки. `pg_try_advisory_lock` возвращает false вместо ожидания, а если джоба укладывается в одну транзакцию, подойдёт и xact-версия. Это стандартный паттерн для распределённого cron."
    extended_explanation: "В Ruby-экосистеме этот паттерн уже реализован: good_job, например, берёт advisory lock под капотом, и писать его вручную нужно далеко не всегда. Если распределённый cron в проекте самописный, стоит сверить его с этим паттерном."
    recommendation: "Advisory locks в PostgreSQL: сессионные и транзакционные, блокирующие и try-варианты, распределённый cron на их основе."
    difficulty: medium
    topics: [locking, operations]

  - id: q7
    text: "Kafka-консюмер сохраняет сообщение в таблицу inbox в одной транзакции (write-side), а отдельный воркер читает накопленное и применяет бизнес-логику в другой (read-side). Можно ли для защиты read-side переиспользовать транзакционный лок `pg_advisory_xact_lock`, который консюмер взял при записи в inbox?"
    type: single
    options:
      - id: a
        text: "Да: advisory lock живёт на уровне базы и действует, пока кто-то явно его не освободит"
        correct: false
        explanation: "Это верно только для сессионных локов и только для сессии-владельца. Транзакционный лок исчезает на COMMIT."
      - id: b
        text: "Да, если взять сессионный `pg_advisory_lock`: он переживёт коммит и будет защищать read-side"
        correct: false
        explanation: "Сессионный лок остался бы за соединением консюмера. Воркер, взяв тот же ключ в другой сессии, ждал бы его и никакой защитой не пользовался."
      - id: c
        text: "Нет: xact-лок снимается на COMMIT консюмера, воркер берёт его заново"
        correct: true
        explanation: "Лок консюмера умирает вместе с его транзакцией и никакого отношения к воркеру, который выполнится позже и, возможно, на другой машине, не имеет."
      - id: d
        text: "Да, если консюмер передаст воркеру номер лока, и тот примет его на свою транзакцию"
        correct: false
        explanation: "Передать владение advisory lock другой сессии нельзя: лок принадлежит той, что его взяла."
    explanation: "Лок живёт не дольше транзакции (или сессии), которая его взяла. Write-side и read-side — две независимые транзакции, разнесённые во времени, и каждая берёт лок на тот же ключ заново. Сквозного лока через границу двух транзакций не бывает."
    extended_explanation: "Тот же принцип относится и к нескольким read-side воркерам подряд: каждый батч обработки inbox открывает новую транзакцию и берёт advisory lock заново, даже если предыдущий батч только что закончился. Для наглядности можно нарисовать схему двух транзакций (write-side и read-side) с границами COMMIT и отметить, где живёт каждый лок."
    recommendation: "Время жизни блокировок в PostgreSQL: транзакционные и сессионные advisory locks, границы транзакции и сессии."
    difficulty: medium
    topics: [locking, transactions]

  - id: q8
    text: "Два background-воркера обновляют строки в разном порядке: A блокирует сначала заказ, потом клиента, B — сначала клиента, потом заказ, оба через `SELECT ... FOR UPDATE`. Что произойдёт при пересечении по времени на одной паре?"
    type: single
    options:
      - id: a
        text: "Сервер прервёт одну из транзакций ошибкой deadlock detected"
        correct: true
        explanation: "Сервер проверяет граф ожиданий, находит цикл и прерывает одну из транзакций. Приложение обязано поймать ошибку и повторить операцию."
      - id: b
        text: "Транзакции выполнятся друг за другом: B подождёт, пока A закоммитится, и ошибок не будет"
        correct: false
        explanation: "Здесь каждая держит то, что нужно другой, и ждать «до конца» A бесполезно: A тоже ждёт B."
      - id: c
        text: "Прервутся обе транзакции, чтобы гарантированно разорвать цикл"
        correct: false
        explanation: "Прерывается одна: этого достаточно, чтобы цикл разорвался и вторая продолжила работу."
      - id: d
        text: "Ожидание закончится по `lock_timeout`, который по умолчанию составляет одну секунду"
        correct: false
        explanation: "По умолчанию `lock_timeout` отключён (0). Цикл разрывает отдельный механизм `deadlock_timeout`."
    explanation: "Это классический deadlock из-за разного порядка блокировок. Проверку графа ожиданий PostgreSQL запускает через `deadlock_timeout` (по умолчанию одна секунда) и прерывает одну из транзакций. Единственная надёжная профилактика — брать блокировки в одном порядке во всём коде."
    extended_explanation: "В распределённой команде особенно коварен случай, когда два модуля независимо пишут код, трогающий одни и те же две таблицы: порядок захвата нужно фиксировать явно, например в гайде по коду. Стоит проверить код, работающий с парой таблиц (orders и customers или их аналогами), на единый порядок блокировок."
    recommendation: "Взаимные блокировки (deadlock) в PostgreSQL: как они возникают, как сервер их обнаруживает (`deadlock_timeout`) и как их предотвращает единый порядок захвата."
    difficulty: easy
    topics: [locking, concurrency]

  - id: q9
    text: "Consumer A завис на обработке (GC pause, медленный внешний вызов) и не прислал heartbeat вовремя. Группа считает его мёртвым и отдаёт партицию Consumer B. Что происходит, если A не знает о ребалансировке и дописывает начатое?"
    type: single
    options:
      - id: a
        text: "A и B какое-то время обрабатывают одну сущность параллельно, пока A не узнает о потере партиции"
        correct: true
        explanation: "A считает себя владельцем партиции и довершает работу, не зная, что B уже читает те же данные."
      - id: b
        text: "A получит ошибку и остановится до записи в БД: брокер разрывает его соединение при ребалансировке"
        correct: false
        explanation: "Об изменении владения A узнает лишь при следующем обращении к брокеру. Уже начатую обработку это не останавливает."
      - id: c
        text: "Результат A отклонит PostgreSQL, потому что транзакция привязана к владельцу партиции Kafka"
        correct: false
        explanation: "У базы нет сведений о партициях Kafka. Транзакция A выполнится обычным образом."
      - id: d
        text: "Брокер не позволит B начать чтение партиции, пока A не закоммитит свой offset"
        correct: false
        explanation: "Брокер не ждёт зависший процесс: ребалансировка проходит по истечении таймаута сессии."
    explanation: "Это zombie consumer: A продолжает считать себя владельцем партиции, а B уже стал новым владельцем. От последствий на стороне БД защищает advisory lock по бизнес-ключу: он не зависит от того, что Kafka думает о владении партицией."
    extended_explanation: "В Kafka есть собственная защита от зомби — generation id и epoch консюмера, но она защищает consumer group, а не побочные эффекты уже начатой обработки в базе. Второй слой — лок в БД. Практически стоит проверить значения `session.timeout.ms` и `max.poll.interval.ms` в своих консюмерах: от них зависит, как быстро группа считает процесс мёртвым."
    recommendation: "Zombie consumer и fencing в Kafka: heartbeat, `session.timeout.ms`, `max.poll.interval.ms`, epoch консюмера."
    difficulty: hard
    topics: [messaging, concurrency]

  - id: q10
    text: "Две транзакции на `READ COMMITTED` одновременно выполняют `UPDATE orders SET status = 'paid', version = 6 WHERE id = 1 AND version = 5`. Что произойдёт со второй?"
    type: single
    options:
      - id: a
        text: "Сразу обновит строку по своему снимку и перезапишет результат первой транзакции"
        correct: false
        explanation: "Второй UPDATE не пойдёт по устаревшему снимку: сначала он дождётся конкурента и проверит условие заново."
      - id: b
        text: "Дождётся первой, перепроверит условие и обновит 0 строк"
        correct: true
        explanation: "При `READ COMMITTED` UPDATE, упёршийся в чужую блокировку, после её снятия заново проверяет WHERE на актуальной версии строки (EvalPlanQual). Version = 5 уже не выполняется, поэтому результат — 0 строк."
      - id: c
        text: "Завершится ошибкой could not serialize access due to concurrent update"
        correct: false
        explanation: "Такая ошибка бывает на `REPEATABLE READ` и `SERIALIZABLE`. На `READ COMMITTED` конфликт молча превращается в 0 затронутых строк."
      - id: d
        text: "Завершится ошибкой deadlock detected, потому что обе транзакции претендуют на одну строку"
        correct: false
        explanation: "Обе ждут одной строки, но цикла нет: одна просто стоит в очереди за другой."
    explanation: "Именно это делает version-check в UPDATE и upsert надёжным: второй писатель не перезапишет более новое состояние, а узнает об этом по нулю затронутых строк (UPDATE ... RETURNING вернёт пустой результат). Приложение должно читать число затронутых строк и считать 0 сигналом о конфликте."
    extended_explanation: "Тот же механизм лежит в основе оптимистичных блокировок в ORM: lock_version в ActiveRecord превращается в `UPDATE ... WHERE id = ? AND lock_version = ?`, и 0 затронутых строк даёт StaleObjectError. Поведение легко воспроизвести в двух сессиях psql: вторая встаёт на ожидании и после COMMIT первой возвращает UPDATE 0."
    recommendation: "Поведение UPDATE при конкурентных изменениях на `READ COMMITTED`: ожидание блокировки и перепроверка условия (EvalPlanQual), оптимистичные блокировки."
    difficulty: hard
    topics: [transactions, concurrency]

  - id: q11
    text: "Как взять блокировку на сущность, для которой в таблице ещё нет ни одной строки?"
    type: single
    options:
      - id: a
        text: "Создать пустую строку-заглушку в отдельной транзакции, а затем блокировать её через `FOR UPDATE`"
        correct: false
        explanation: "Вставка заглушки — та же гонка на создание, просто сдвинутая на шаг раньше."
      - id: b
        text: "LOCK TABLE в режиме ACCESS EXCLUSIVE на время обработки всего события"
        correct: false
        explanation: "Блокировка всей таблицы останавливает любую работу с ней, цена несоразмерна задаче."
      - id: c
        text: "`SELECT ... FOR UPDATE` по будущему первичному ключу, выданному заранее из последовательности"
        correct: false
        explanation: "Заранее выданный ключ не делает строку существующей, блокировать по-прежнему нечего."
      - id: d
        text: "`pg_advisory_xact_lock` по ключу, вычисленному из внешнего идентификатора сообщения"
        correct: true
        explanation: "Advisory lock не требует существующей строки: ключом служит произвольное число, например `hashtext('order:' || external_id)`."
    explanation: "Advisory lock — единственный из инструментов (advisory lock, `FOR UPDATE`, version-check), которому не нужна существующая строка: ключом служит произвольное число, обычно хеш внешнего идентификатора. Второй консюмер с тем же `external_id` встанет на этом ключе и дождётся коммита или отката первой транзакции."
    extended_explanation: "Чтобы разделять пространства ключей разных сущностей, используют двухаргументную форму: `pg_advisory_xact_lock(hashtext('order'), id)`. Первый аргумент фиксирует тип ресурса и снижает риск коллизии с ключами других сущностей. Сценарий стоит воспроизвести в двух сессиях psql: второй консюмер должен встать в очередь на advisory lock, а не проскочить мимо."
    recommendation: "Advisory locks: пространство ключей, двухаргументная форма и блокировка сущности, которой ещё нет в таблице."
    difficulty: easy
    topics: [locking, messaging]

  - id: q12
    text: "Чтобы джоба не запускалась дважды, вместо сессионного `pg_try_advisory_lock` решили в начале запуска коммитить в таблице jobs пометку `running_since = now()` и считать джобу занятой, пока пометка есть. Процесс с джобой упал. Чем такая схема хуже сессионного `pg_try_advisory_lock`?"
    type: single
    options:
      - id: a
        text: "Строка jobs останется заблокированной упавшим процессом до перезапуска PostgreSQL"
        correct: false
        explanation: "Блокировка строки снимается с завершением транзакции, а пометка уже закоммичена. Проблема именно в этом значении."
      - id: b
        text: "Пометку нельзя поставить атомарно, поэтому два инстанса всегда смогут стартовать одновременно"
        correct: false
        explanation: "UPDATE ... WHERE `running_since` IS NULL с проверкой числа затронутых строк атомарен. Беда не в старте, а в падении процесса."
      - id: c
        text: "Пометка остаётся в базе, и без таймаута или heartbeat упавшую джобу не отличить от работающей"
        correct: true
        explanation: "Сессионный advisory lock исчезает вместе с сессией, а коммитнутая пометка живёт, пока кто-то её не сбросит, и новые запуски будут считать джобу занятой."
      - id: d
        text: "Пометка `running_since` сбросится сама при обрыве соединения, как и advisory lock, и разницы не будет"
        correct: false
        explanation: "Закоммиченные изменения при обрыве соединения не откатываются. Именно поэтому пометка переживает падение процесса."
    explanation: "Закоммиченная пометка не привязана ни к соединению, ни к процессу: после падения она остаётся с устаревшим значением, и без отдельной логики (таймаут, heartbeat, ручной сброс) никто не поймёт, что джоба давно мертва. Advisory lock привязан к сессии и исчезает вместе с ней."
    extended_explanation: "Практический компромисс — использовать оба механизма: advisory lock отвечает за координацию «кто выполняет сейчас», а строка jobs с `running_since` остаётся источником данных для мониторинга и алертов о зависших запусках. Практически стоит проверить в своих джобах логику восстановления зависших `running_since`: часто её нет или она сводится к грубому таймауту."
    recommendation: "Блокировки, привязанные к сессии, и состояние, сохранённое в таблице: что происходит с каждым при падении процесса; heartbeat и таймауты для долгих задач."
    difficulty: medium
    topics: [locking, operations]

  - id: q13
    text: "Сервис проверяет суммарный дневной лимит по паре счетов, и из-за write skew параллельные переводы его превышают. Чтобы это исправить, транзакции переводят на `SERIALIZABLE`. Что при этом приходится менять в коде приложения?"
    type: single
    options:
      - id: a
        text: "СУБД сама повторяет конфликтующую транзакцию, поэтому код приложения менять не нужно"
        correct: false
        explanation: "PostgreSQL ничего не повторяет: ошибка возвращается клиенту, и ретрай делает приложение."
      - id: b
        text: "Приложение обязано ловить ошибку сериализации и повторять всю транзакцию заново"
        correct: true
        explanation: "Если обнаружен конфликт зависимостей между транзакциями, одна из них получает ошибку (could not serialize access due to read/write dependencies), и ретрай становится частью логики."
      - id: c
        text: "Ошибки сериализации появляются только при обновлении одной и той же строки, поэтому для лимита по двум счетам их не будет"
        correct: false
        explanation: "`SERIALIZABLE` отслеживает зависимости чтения и записи между разными строками. Как раз этот случай он и ловит."
      - id: d
        text: "Все затронутые строки блокируются заранее, при старте транзакции, как это делает `FOR UPDATE`"
        correct: false
        explanation: "`SERIALIZABLE` оптимистичен: транзакции идут параллельно, а зависимости между ними отслеживаются по ходу работы."
    explanation: "`SERIALIZABLE` в PostgreSQL не блокирует заранее, а отслеживает зависимости между параллельными транзакциями. Если порядок оказывается нарушен, одна из них получает ошибку сериализации (вплоть до COMMIT), и повтор всей транзакции — обязательная часть логики приложения."
    extended_explanation: "Типичный код: `rescue PG::TRSerializationFailure => retry_with_backoff`. Ретраить нужно всю транзакцию целиком заново, а не только последний запрос внутри неё. Для практики можно написать скрипт, намеренно воспроизводящий ошибку сериализации, чтобы увидеть, что именно приходится ловить."
    recommendation: "`SERIALIZABLE` в PostgreSQL (Serializable Snapshot Isolation): ошибки сериализации и стратегия ретраев."
    difficulty: medium
    topics: [transactions, concurrency]

  - id: q14
    text: "Как сделать запись результата в PostgreSQL и продвижение позиции чтения в Kafka атомарными?"
    type: single
    options:
      - id: a
        text: "Включить у консюмера `enable.idempotence=true`: он не даст записать результат дважды"
        correct: false
        explanation: "Идемпотентность — настройка продюсера и защищает публикацию. С записью консюмера в PostgreSQL она не связана."
      - id: b
        text: "Коммитить offset в Kafka перед записью в БД: так сообщение точно не обработается дважды"
        correct: false
        explanation: "Если процесс упадёт между коммитом offset и записью, сообщение будет потеряно: Kafka считает его прочитанным, а в БД результата нет."
      - id: c
        text: "Выставить `isolation.level=read_committed`: Kafka откатит прочитанные сообщения, если запись в БД не удалась"
        correct: false
        explanation: "Этот параметр управляет видимостью транзакционных сообщений внутри Kafka. Результат работы с внешней БД он не охватывает."
      - id: d
        text: "Хранить offset в таблице PostgreSQL и обновлять его в одной транзакции с бизнес-записью"
        correct: true
        explanation: "Результат и позиция либо сохраняются вместе, либо не сохраняются вовсе. После падения консюмер продолжает ровно с того места, где зафиксирована последняя применённая запись."
    explanation: "Kafka и PostgreSQL не участвуют в общей транзакции, поэтому атомарность получают, сводя оба действия к одной системе. Offset хранят в таблице БД и двигают в той же транзакции, что и бизнес-запись. После падения консюмер читает позицию из БД и делает seek на неё, а коммит offset в Kafka перестаёт быть источником истины."
    extended_explanation: "Схема заменяет inbox, если каждый консюмер отвечает за свою партицию: достаточно строки (topic, partition, offset). Стоит учесть ребалансировку: при получении партиции консюмер должен прочитать её offset из БД и перейти на него, а при потере партиции — прекратить обработку. Схему стоит сравнить с inbox: она проще, когда каждая партиция обрабатывается одним консюмером."
    recommendation: "Хранение offset вне Kafka и атомарный сценарий «прочитать, обработать, записать» между Kafka и внешней БД."
    difficulty: medium
    topics: [messaging, transactions]

  - id: q15
    text: "Воркер сначала читает текущее состояние сущности, применяет бизнес-логику (валидацию, пересчёт полей) и только перед записью берёт `pg_advisory_xact_lock` на ключ сущности. Почему такой порядок опасен при параллельной обработке двух сообщений одной сущности?"
    type: single
    options:
      - id: a
        text: "Оба воркера успевают прочитать одно и то же устаревшее состояние до захвата лока и строят расчёт на нём"
        correct: true
        explanation: "Окно гонки сдвигается на шаг раньше лока: тот, кто запишет вторым, перезапишет более свежий результат первого более старым. Правило: лок берут до чтения."
      - id: b
        text: "Advisory lock захватывает и строки, прочитанные ранее в транзакции, и поэтому поздний захват вызывает взаимную блокировку"
        correct: false
        explanation: "Advisory lock никак не связан со строками таблицы. Взять его можно в любой момент транзакции, и взаимной блокировки он сам не создаёт."
      - id: c
        text: "Опасно только на `REPEATABLE READ`, а на `READ COMMITTED` чтение до лока ничем не грозит"
        correct: false
        explanation: "На `READ COMMITTED` проблема проявляется ещё острее: каждый запрос видит свой снимок, и расчёт строится на устаревшем состоянии."
      - id: d
        text: "PostgreSQL запрещает вызывать advisory-функцию после SELECT в той же транзакции"
        correct: false
        explanation: "Такого запрета нет: advisory-функцию можно вызывать в любой момент транзакции."
    explanation: "Если сначала читать, а потом брать лок, оба воркера видят одно и то же старое состояние, оба пересчитывают производные поля, и последний запишет результат, который не учитывает работу первого. Это классический lost update. Лок перед чтением превращает всю цепочку «прочитать, посчитать, записать» в очередь на ключ."
    extended_explanation: "Побочный эффект такой очереди — последовательная обработка одного ключа, даже если воркеров много. При высокой частоте сообщений об одной сущности это может стать узким местом, и тогда рассматривают батчинг по ключу. Практически стоит проверить в своих воркерах порядок SELECT, lock и UPDATE: лок должен идти строго перед чтением."
    recommendation: "Lost update и порядок «блокировка, чтение, запись» при read-modify-write в конкурентной обработке."
    difficulty: hard
    topics: [locking, concurrency]

  - id: q16
    text: "Обработчик записал результат в БД, но упал до коммита offset в Kafka. После рестарта то же сообщение читается заново. Что это значит для обработчика?"
    type: single
    options:
      - id: a
        text: "Kafka распознает повтор по идентификатору идемпотентного продюсера и не доставит сообщение второй раз"
        correct: false
        explanation: "Идемпотентный продюсер защищает публикацию в брокер. Применило ли консюмер сообщение к БД, он не знает."
      - id: b
        text: "Exactly-once семантика Kafka откатит запись в БД вместе с offset при рестарте консюмера"
        correct: false
        explanation: "Exactly-once в Kafka охватывает чтение, обработку и запись внутри Kafka. Запись во внешнюю БД в неё не входит."
      - id: c
        text: "Сообщение будет обработано повторно, поэтому запись должна быть идемпотентной или с дедупликацией"
        correct: true
        explanation: "At-least-once доставка означает, что после сбоя между записью и коммитом offset повтор неизбежен: тем же процессом после рестарта или другим после ребалансировки."
      - id: d
        text: "Повтора не будет: при закрытии консюмера offset коммитится автоматически, даже если процесс упал"
        correct: false
        explanation: "Автокоммит выполняется по таймеру или при штатном закрытии. Упавший процесс offset не коммитит."
    explanation: "С точки зрения БД повторная доставка — та же задача, что и дубль при ребалансировке: либо повторная обработка отсекается (inbox), либо она идемпотентна (upsert с проверкой версии)."
    extended_explanation: "Порядок операций консюмера важен: если сначала коммитить offset, а потом писать в БД, риск смещается в другую сторону: сообщение теряется при сбое между шагами. Безопасный порядок — запись в БД, затем коммит offset, и повторную обработку принимают как данность. Стоит проверить порядок «запись, затем коммит offset» в своих консюмерах и убедиться, что есть inbox или идемпотентный upsert."
    recommendation: "Семантики доставки в Kafka (at-most-once, at-least-once, exactly-once) и идемпотентность обработчиков."
    difficulty: easy
    topics: [messaging, concurrency]

  - id: q17
    text: "Внутри обработчика `pg_try_advisory_xact_lock` по ключу сущности вернул false. Что корректно сделать с сообщением?"
    type: single
    options:
      - id: a
        text: "Продолжить обработку без лока: false означает, что конкурентов нет"
        correct: false
        explanation: "false как раз значит, что лок занят кем-то другим и конкурент есть."
      - id: b
        text: "Закоммитить offset и считать сообщение обработанным, раз его уже кто-то обрабатывает"
        correct: false
        explanation: "Если тот обработчик упадёт, сообщение будет потеряно: никто его не применил, а offset уже сдвинут."
      - id: c
        text: "Повторить ту же функцию в цикле без паузы, пока не получится: в конце концов лок освободится"
        correct: false
        explanation: "Цикл без паузы создаёт нагрузку на базу и держит поток. Для ожидания у PostgreSQL есть блокирующая версия `pg_advisory_xact_lock`."
      - id: d
        text: "Отложить сообщение на повторную обработку, не коммитя offset"
        correct: true
        explanation: "false значит, что ключ держит другой обработчик. Если тот упадёт, сообщение должно остаться необработанным и быть прочитано снова."
    explanation: "try-версия не ждёт, а сообщает о занятости. Это удобно, когда нужно отказаться от обработки, а не вставать в очередь. Но тогда ответственность за сообщение остаётся на консюмере: его нужно вернуть в обработку, а не потерять."
    extended_explanation: "Если очередь на ключ допустима и порядок важен, берут блокирующую `pg_advisory_xact_lock`: второй обработчик встанет в ожидание и дождётся первого. try-версию используют там, где пропуск допустим, например в cron. Для каждого пути обработки стоит заранее определить, что делать при занятом ключе: ждать, повторять позже или пропускать."
    recommendation: "Блокирующие и try-варианты advisory locks; ответственность за сообщение при отказе от обработки."
    difficulty: medium
    topics: [locking, messaging]

  - id: q18
    text: "Внутри одного процесса несколько тредов обрабатывают сообщения из разных партиций, и два треда могут получить сообщения одной сущности одновременно. Достаточно ли обычного мьютекса в памяти вместо advisory lock?"
    type: single
    options:
      - id: a
        text: "Достаточно, если сделать мьютекс статическим на уровне класса: он защитит и другие процессы приложения"
        correct: false
        explanation: "Память процесса другим процессам недоступна. Мьютекс класса виден только внутри процесса."
      - id: b
        text: "Достаточно, потому что пул соединений процесса сам сериализует запросы к одной строке"
        correct: false
        explanation: "Пул выдаёт соединения параллельно. Два треда с разных соединений спокойно изменят одну строку."
      - id: c
        text: "Достаточно, пока гарантированно запущен один процесс, но на практике такой гарантии надолго не бывает"
        correct: true
        explanation: "Мьютекс решает задачу, только если других процессов, трогающих те же данные, нет. Масштабирование, второй воркер или консоль на проде создают второй процесс."
      - id: d
        text: "Недостаточно даже для одного процесса: мьютекс не защищает код, ходящий в БД из нескольких тредов"
        correct: false
        explanation: "Для тредов одного процесса мьютекс работает нормально. Ограничение касается только числа процессов."
    explanation: "Мьютекс в памяти технически решает задачу, пока других процессов нет. Проблема в жизненном цикле кода: горизонтальное масштабирование, второй фоновый воркер или Rails console на проде создают второй процесс, для которого локального мьютекса не существует. Advisory lock защищает независимо от числа процессов."
    extended_explanation: "Почти любой сервис рано или поздно масштабируется, поэтому закладывать advisory lock сразу дешевле, чем переписывать мьютекс уже после того, как баг проявился на проде. Практически стоит найти в кодовой базе места, где конкуренция защищена только локальным мьютексом (Mutex.new), и оценить риск масштабирования."
    recommendation: "Конкуренция внутри процесса и между процессами: когда достаточно мьютекса в памяти, а когда нужна блокировка в общем хранилище."
    difficulty: easy
    topics: [concurrency, locking]

  - id: q19
    text: "Консюмер в одной транзакции вставляет `message_id` в inbox, коммитит её и только после этого делает бизнес-запись в отдельной транзакции. Процесс падает между ними. Что получится после рестарта?"
    type: single
    options:
      - id: a
        text: "Сообщение обработается повторно, потому что запись в inbox откатывается при рестарте"
        correct: false
        explanation: "Закоммиченная запись при рестарте процесса не откатывается."
      - id: b
        text: "Сообщение отмечено обработанным, повтор пропустят, бизнес-изменение потеряется"
        correct: true
        explanation: "Запись в inbox и бизнес-запись должны выполняться в одной транзакции, иначе сбой между ними оставляет сообщение отмеченным, но не применённым."
      - id: c
        text: "Бизнес-запись выполнится дважды: проверка в inbox срабатывает только после неё"
        correct: false
        explanation: "Здесь порядок обратный: inbox заполнен первым, поэтому повтор будет пропущен и дважды не выполнится."
      - id: d
        text: "Ничего плохого: ON CONFLICT DO NOTHING в inbox вернёт пустой результат, и бизнес-запись всё равно выполнится"
        correct: false
        explanation: "ON CONFLICT DO NOTHING как раз сообщит, что сообщение уже учтено, и обработчик его пропустит."
    explanation: "Дедупликация по `message_id` имеет смысл только тогда, когда пометка и результат фиксируются атомарно: в одной транзакции. Тогда либо есть и пометка, и результат, либо нет ни того, ни другого, и повторная доставка безопасна."
    extended_explanation: "Если бизнес-запись выполняет другая система и в одну транзакцию с inbox её не поместить, нужны другие схемы: идемпотентные операции с ключом идемпотентности или outbox на стороне источника. Практически стоит проверить, что запись в inbox и бизнес-изменения лежат в одной транзакции."
    recommendation: "Атомарность записи в inbox и бизнес-изменений; transactional outbox и ключи идемпотентности."
    difficulty: medium
    topics: [messaging, transactions]

  - id: q20
    text: "`pg_advisory_xact_lock` берут по ключу `hashtext('order:' || external_id)`, то есть по 32-битному хешу. Для двух разных `external_id` хеш совпал. Что произойдёт?"
    type: single
    options:
      - id: a
        text: "Две сущности начнут ложно ждать друг друга: корректность цела, страдает параллелизм"
        correct: true
        explanation: "Лок общий для двух ключей, поэтому обработчики одной пары ждут друг друга без нужды. Данные не перемешиваются, а лишь иногда ждут дольше."
      - id: b
        text: "Данные двух сущностей перепутаются: оба сообщения обработает один и тот же обработчик"
        correct: false
        explanation: "Лок только сериализует доступ и обработчиков не распределяет. Каждый обработчик по-прежнему работает со своим сообщением."
      - id: c
        text: "PostgreSQL вернёт ошибку при втором захвате, потому что ключ уже занят другой сущностью"
        correct: false
        explanation: "Ошибки не будет: для сервера это один и тот же ключ, и второй захват просто встанет в очередь."
      - id: d
        text: "Второй лок молча пропустится, и вторая сущность останется вообще без защиты"
        correct: false
        explanation: "Лок возьмётся в нормальном порядке, но подождёт, пока освободится общий ключ."
    explanation: "Advisory lock оперирует числами, а не именами, поэтому хеш может совпасть для разных сущностей. Для корректности это безопасно: худшее, что случится, — лишнее ожидание. При большой нагрузке коллизии заметно снижают параллелизм, если пространство ключей мало."
    extended_explanation: "Коллизий проще избежать, когда двухаргументная форма даёт 64-битное пространство: `pg_advisory_xact_lock(hashtext('order'), id)`, где id — реальный числовой идентификатор. Хеширование строк вносит коллизии, числовые ключи — нет. Практически стоит оценить, насколько ключи advisory lock в проекте подвержены коллизиям, и при возможности перейти на числовые ключи."
    recommendation: "Устройство ключей advisory lock: 64-битное пространство, hashtext и коллизии хеша."
    difficulty: hard
    topics: [locking, concurrency]

  - id: q21
    text: "Distributed cron держит сессионный `pg_try_advisory_lock` на время джобы. Инстанс, выполнявший джобу, пропал вместе с узлом: сеть оборвалась без закрытия TCP-соединений. Что произойдёт при следующем запуске на другом инстансе?"
    type: single
    options:
      - id: a
        text: "Другой инстанс сразу получит лок: advisory lock не переживает падения процесса приложения"
        correct: false
        explanation: "Это верно, когда процесс убит на живом узле: ядро закрывает сокеты, и сервер видит обрыв. При потере узла и сети соединение остаётся «живым»."
      - id: b
        text: "Лок останется занятым, пока сервер не обнаружит мёртвое соединение"
        correct: true
        explanation: "Сессионный лок снимается явным unlock или завершением сессии, а оборванное без FIN соединение сервер считает живым до срабатывания TCP keepalive."
      - id: c
        text: "Лок снимется по `lock_timeout`, после чего запуск пойдёт нормально"
        correct: false
        explanation: "`lock_timeout` ограничивает ожидание блокировки клиентом. Срок её удержания он не меняет."
      - id: d
        text: "Лок останется до перезапуска PostgreSQL, потому что сервер не отслеживает состояние клиентских сокетов"
        correct: false
        explanation: "Сервер отслеживает соединения с помощью TCP keepalive и закрывает мёртвые, пусть и не мгновенно."
    explanation: "Пока сервер не определил, что клиент пропал, сессия считается активной и удерживает лок. Другие инстансы корректно пропускают запуск. Это ожидаемое поведение, а не баг, но пока оно длится, джоба не выполняется."
    extended_explanation: "Окно обнаружения задают `tcp_keepalives_idle`, `tcp_keepalives_interval` и `tcp_keepalives_count` на сервере. Системные значения по умолчанию консервативны: первая проба уходит через два часа простоя, поэтому на проде их стараются уменьшить. Стоит проверить настройки TCP keepalive у PostgreSQL: от них зависит, как скоро сервер снимет локи пропавшего клиента."
    recommendation: "TCP keepalive и обнаружение мёртвых соединений: `tcp_keepalives_idle`, `tcp_keepalives_interval`, `tcp_keepalives_count`."
    difficulty: hard
    topics: [locking, operations]

  - id: q22
    text: "В сервисе единственная точка конкуренции — обработка сообщений по одному `external_id`, без инвариантов, охватывающих несколько таблиц. Почему `SERIALIZABLE` для всех транзакций здесь избыточен по сравнению с advisory lock на бизнес-ключ?"
    type: single
    options:
      - id: a
        text: "На `SERIALIZABLE` нельзя использовать INSERT ... ON CONFLICT, а он нужен для upsert"
        correct: false
        explanation: "ON CONFLICT поддерживается на любом уровне изоляции, включая `SERIALIZABLE`."
      - id: b
        text: "`SERIALIZABLE` действует только внутри одной сессии, поэтому не защищает консюмеры на разных инстансах"
        correct: false
        explanation: "Сериализуемость обеспечивает сервер для всех транзакций базы сразу."
      - id: c
        text: "`SERIALIZABLE` блокирует таблицу целиком на время транзакции и сериализует вообще всех подряд"
        correct: false
        explanation: "Нет: он оптимистичен и пускает транзакции параллельно, а конфликтующие обнаруживает по ходу дела и прерывает."
      - id: d
        text: "`SERIALIZABLE` платит ретраями за широкую защиту, а advisory lock точечно сериализует один ключ"
        correct: true
        explanation: "Конфликт локализован одним `external_id`, поэтому очередь на один ключ дешевле, чем отслеживание зависимостей по всей базе и ретраи на каждый запрос."
    explanation: "Конфликт предсказуемо локализован одним `external_id`, а не размазан по строкам и таблицам. Advisory lock решает эту задачу дешевле: очередь на один ключ вместо обязательной обработки ошибки сериализации и ретрая на каждый запрос."
    extended_explanation: "Если в сервисе появится второй инвариант, зависящий сразу от нескольких сущностей (например, общий лимит клиента), лок на один ключ его уже не покроет. Это сигнал выбрать `SERIALIZABLE` именно для той операции. Практически стоит определить, локализован ли реальный конфликт одним ключом или зависит от нескольких сущностей."
    recommendation: "Выбор между `SERIALIZABLE` и явными блокировками: когда конфликт локализован одним ключом, а когда зависит от нескольких сущностей."
    difficulty: medium
    topics: [transactions, locking]

  - id: q23
    text: "В продакшене несколько воркеров зависли в ожидании advisory lock на одном ключе дольше обычного. Как отличить нормальную очередь под нагрузкой от случая, когда лок держит зависшая транзакция?"
    type: single
    options:
      - id: a
        text: "Через join `pg_locks` и `pg_stat_activity` по pid: у держателя старый `xact_start` и idle in transaction"
        correct: true
        explanation: "`pg_locks` показывает факт удержания и pid, а возраст и состояние транзакции даёт `pg_stat_activity`. Очередники обычно имеют короткий возраст."
      - id: b
        text: "По колонке granted в `pg_locks`: у зависшего держателя лока значение всегда false, у очередников true"
        correct: false
        explanation: "`granted = false` означает, что процесс ждёт лок. Держатель имеет `granted = true`. Держатель имеет `granted = true`."
      - id: c
        text: "По `wait_event_type` в `pg_stat_activity`: у держателя лока он всегда Lock, а у очередников пустой"
        correct: false
        explanation: "`wait_event_type` = Lock бывает у ожидающих. Держатель лока, как правило, ничего не ждёт или ждёт клиента."
      - id: d
        text: "По числу записей с `locktype = 'advisory'` в `pg_locks`: чем их больше, тем дольше держится лок"
        correct: false
        explanation: "Число записей говорит о числе ключей и ожидающих, но не о возрасте удержания."
    explanation: "`pg_locks` сам по себе не хранит возраст: только факт удержания или ожидания и pid. Присоединив `pg_stat_activity`, можно увидеть `xact_start` и state держателя. Транзакция, открытая аномально долго и не делающая прогресса, — завис, а не очередь. На такой случай стоит завести алерт."
    extended_explanation: "Для поиска держателей удобна `pg_blocking_pids`: `SELECT pid, state, now() - xact_start AS age, query FROM pg_stat_activity WHERE pid IN (SELECT unnest(pg_blocking_pids(w.pid)) FROM pg_stat_activity w WHERE w.wait_event_type = 'Lock')`. Практически стоит настроить алерт на транзакции, удерживающие advisory lock дольше порога, например вычисленного из p99 обычной длительности обработки."
    recommendation: "Системные представления `pg_locks` и `pg_stat_activity`: как соединять их по pid, функция `pg_blocking_pids`."
    difficulty: medium
    topics: [locking, operations]

  - id: q24
    text: "Приложение уже использует advisory lock на ключ сущности для защиты от гонок между несколькими инстансами. Есть ли смысл дополнительно ставить мьютекс в памяти вокруг захвата лока внутри одного процесса?"
    type: single
    options:
      - id: a
        text: "Смысла нет: advisory lock защищает только от других процессов, а треды одного процесса сериализует сам драйвер"
        correct: false
        explanation: "Драйвер тредов не сериализует. Каждый тред со своего соединения берёт лок по общим правилам."
      - id: b
        text: "Обязательно: без мьютекса два треда одного процесса получат один и тот же лок, потому что процесс — это одна сессия"
        correct: false
        explanation: "Сессия — это соединение. Треды с разных соединений встанут в очередь на один ключ."
      - id: c
        text: "Имеет смысл при частой конкуренции внутри процесса: треды ждут локально, а не ходят за локом в БД"
        correct: true
        explanation: "Advisory lock корректно сериализует конкурентов независимо от процесса, но поход в БД и ожидание там дороже короткой блокировки в памяти."
      - id: d
        text: "Смысла нет: поход за advisory lock занимает микросекунды и на фоне остальной обработки не заметен"
        correct: false
        explanation: "Поход в БД занимает сетевое время, а при частой конкуренции на один ключ ожидание копится."
    explanation: "Advisory lock корректно сериализует конкурентов независимо от того, из одного они процесса или из разных. Мьютекс в памяти — оптимизация стоимости, а не корректности: короткая блокировка в памяти дешевле, чем поход в БД и ожидание в ней."
    extended_explanation: "Паттерн называют двухуровневой блокировкой: сначала быстрый мьютекс отсекает конкуренцию внутри процесса, и только затем тред идёт за advisory lock для защиты от других инстансов. Прежде чем добавлять второй уровень, стоит замерить, как часто внутри процесса конкурируют за один ключ: преждевременная оптимизация усложняет код без выигрыша."
    recommendation: "Двухуровневая блокировка: локальный мьютекс плюс блокировка в базе; стоимость захвата лока в БД."
    difficulty: medium
    topics: [concurrency, locking]

  - id: q25
    text: "Итоговая схема обработки Kafka-сообщений об одной сущности: `READ COMMITTED` (по умолчанию) + advisory lock на бизнес-ключ перед чтением + version-check в самом upsert. Почему нужно именно это сочетание, а не любая одна ось?"
    type: single
    options:
      - id: a
        text: "Достаточно одного version-check в upsert: он атомарен и заодно защищает расчёт, который идёт до записи"
        correct: false
        explanation: "Version-check защищает только запись. Расчёт на устаревшем состоянии он не предотвращает, а лишь отбрасывает его результат."
      - id: b
        text: "Достаточно одного advisory lock: он защищает данные и от тех, кто пишет в таблицу напрямую, не зная о нём"
        correct: false
        explanation: "Advisory lock добровольный: он работает только для тех, кто его берёт. Прямую запись мимо лока от конфликта защищает version-check."
      - id: c
        text: "Нужен `REPEATABLE READ` вместо лока: он не позволит двум транзакциям изменить строку, и ретраи не понадобятся"
        correct: false
        explanation: "На `REPEATABLE READ` конкурентное изменение строки приводит к ошибке сериализации, то есть к ретраям."
      - id: d
        text: "Лок сериализует цепочку «прочитать, посчитать, записать», version-check защищает саму запись"
        correct: true
        explanation: "Это инструменты для разных моментов жизни сущности: лок работает ещё до появления строки, version-check дёшево проверяет саму запись."
    explanation: "Это не конкурирующие решения одной задачи, а инструменты для разных моментов и разных гарантий. Advisory lock сериализует конкурентов по бизнес-ключу ещё до того, как есть что блокировать построчно, version-check — дешёвая атомарная проверка прямо на записи. Поднимать изоляцию до `SERIALIZABLE` не нужно: конфликт локализован одним `external_id`."
    extended_explanation: "Если таких мест в сервисе много, комбинацию удобно упаковать в общий helper вроде `with_entity_lock(external_id) { upsert_with_version(...) }`, чем повторять её в каждом обработчике."
