      ```go
      a := []int{1, 2, 3, 4}
      b := a[1:3]
      b[0] = 99
      fmt.Println(a, len(b), cap(b))
      ```
    type: single
    options:
      - id: a
        text: "`[1 2 3 4] 2 2`"
        correct: false
        explanation: "Так было бы при копировании элементов, как делает `Array#slice` в Ruby. Срез в Go копии не создаёт."
      - id: b
        text: "`[1 99 3 4] 2 3`"
        correct: true
        explanation: "Срез `b` указывает на тот же массив с индекса 1, поэтому запись меняет `a`, а ёмкость считается до конца массива."
      - id: c
        text: "`[1 99 3 4] 2 2`"
        correct: false
        explanation: "Элементы угаданы верно, ёмкость при этом считается до конца массива и равна 3."
      - id: d
        text: "`[1 2 3 4] 2 3`"
        correct: false
        explanation: "Запись через `b` видна в `a`, потому что массив у них общий."
    explanation: "Срез — не сам массив, а небольшой заголовок из трёх полей: указатель на элемент массива, длина (`len`) и ёмкость (`cap`). Присваивание `b := a[1:3]` копирует только заголовок: у `a` и `b` свои заголовки, но указатели ведут в один и тот же массив, поэтому запись через `b` видна через `a`. У `b` указатель стоит на `a[1]`, `len = 2` (элементы `a[1]` и `a[2]`), `cap = 3` — сколько элементов от начала `b` до конца массива. Запись `b[0] = 99` меняет `a[1]`, и выводится `[1 99 3 4] 2 3`."
    extended_explanation: "Как работает `append`: если `len < cap`, элемент записывается в тот же массив, а длина растёт на 1. Если `len == cap`, места нет: `append` выделяет новый массив побольше (для небольших срезов примерно вдвое), копирует туда элементы и возвращает срез над новым массивом, а старый остаётся у тех, кто на него ссылается. Поэтому результат `append` всегда присваивают обратно: `s = append(s, x)`. Литерал `a := []int{1, 2, 3, 4}` даёт `len = cap` = 4, а `make([]int, 2, 10)` — `len` 2 и `cap` 10. Полный срез `a[1:3:3]` ограничивает ёмкость до 2, и следующий `append` уйдёт в новый массив. В Ruby `arr[1..2]` возвращает копию, поэтому привычка к ней и ломает ожидания рубиста."
    recommendation: "Устройство среза и связь с массивом: статья «Go Slices: usage and internals» на go.dev."
    difficulty: medium
    topics: [go, performance]

