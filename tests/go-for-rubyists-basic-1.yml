slug: go-for-rubyists-basic-1
title: "Go для рубиста: язык и типы"
description: "Основы Go глазами Ruby-разработчика: нулевые значения, срезы и map, интерфейсы вместо классов и миксинов, ошибки значениями. База — Go 1.22+."
tags: [go, ruby, backend]
difficulty: basic
estimated_time: 40

questions:

  - id: q1
    text: "Как в Go сделать функцию пакета недоступной для других пакетов, аналог `private` из Ruby?"
    type: single
    options:
      - id: a
        text: "Поставить перед функцией ключевое слово `private`"
        correct: false
        explanation: "Такого слова в языке нет, модификаторов доступа Go не знает."
      - id: b
        text: "Добавить над функцией комментарий `//go:private`"
        correct: false
        explanation: "Директивы вида //`go`: управляют компилятором и видимостью не занимаются."
      - id: c
        text: "Начать имя функции со строчной буквы"
        correct: true
        explanation: "Видимость задаёт первая буква идентификатора: заглавная экспортирует, строчная оставляет внутри пакета."
      - id: d
        text: "Положить файл с функцией в каталог `internal`"
        correct: false
        explanation: "Каталог `internal` ограничивает импорт целого пакета, но отдельную функцию внутри него не скрывает."
    explanation: "В Go видимость кодируется регистром первой буквы: `Name` доступно из других пакетов, `name` нет. Правило одинаково для функций, типов, полей структур и методов."
    extended_explanation: "Поле с маленькой буквы не попадёт и в `encoding/json`: пакет работает через `reflect` и неэкспортируемые поля пропускает молча. Каталог `internal` добавляет второй уровень: пакет `a`/`internal`/`b` может импортировать только код из дерева `a`."
    recommendation: "Правила видимости и пакетов в Go: экспортируемые идентификаторы, internal-пакеты, раздел «Exported identifiers» спецификации языка."
    difficulty: easy
    topics: [go, ruby_language]

  - id: q2
    text: |-
      Что напечатает код?

      ```go
      var s struct {
          n int
          p *int
          m map[string]int
      }
      fmt.Println(s.n, s.p, s.m == nil, len(s.m))
      ```
    type: single
    options:
      - id: a
        text: "`<nil> <nil> true 0`"
        correct: false
        explanation: "Так было бы в Ruby, где всё незаданное равно `nil`. У числа в Go есть своё нулевое значение."
      - id: b
        text: "`0 <nil> false 0`"
        correct: false
        explanation: "Нулевое значение `map` равно `nil`, поэтому сравнение с `nil` даёт `true`."
      - id: c
        text: "Ошибка компиляции: нет инициализации"
        correct: false
        explanation: "Компилятор инициализацию не требует: поля получают нулевые значения автоматически."
      - id: d
        text: "`0 <nil> true 0`"
        correct: true
        explanation: "Любая переменная получает нулевое значение типа: 0 для чисел, `nil` для указателей и `map`. `len` от `nil`-map возвращает 0 без паники."
    explanation: "В Go нет неинициализированных переменных: объявление без значения даёт нулевое значение типа. Для `int` это 0, для строки пустая строка, для `bool` `false`, для указателей, срезов, `map`, каналов и интерфейсов `nil`. Рубист ждёт `nil` везде, поэтому ошибается на числе. Формы объявления: `var x int` — без значения, получится нулевое; `var x int = 5` — с явным типом и значением; `var x = 5` — тип выводится из значения; `x := 5` — короткая запись, допустима только внутри функции, требует значения и тоже выводит тип. В примере стоит `var` без значения, поэтому и видны нулевые значения полей."
    extended_explanation: "Звёздочка в типе `*int` означает указатель: переменная хранит не число, а адрес числа. Нулевое значение указателя — `nil`, «указывает в никуда». Так в Go выражают «значения может не быть»: `*int` отличает отсутствие (`nil`) от нуля (0), поэтому необязательные поля JSON часто объявляют как `*string` или `*int`. Адрес переменной берёт `&x`, значение по указателю читает `*p`, а `new(int)` создаёт нулевой `int` и возвращает `*int`, а разыменование `nil`-указателя вызывает панику. Нулевое значение многих типов сразу пригодно к работе: пустые `sync.Mutex`, `bytes.Buffer`, `strings.Builder` и `nil`-срез с `append`. Исключение — `map`: читать из `nil`-map можно, а запись вызовет панику."
    recommendation: "Нулевые значения (zero values) и идиома «сделай нулевое значение полезным» в Effective Go."
    difficulty: easy
    topics: [go, ruby_language]

  - id: q3
    text: |-
      Файл `missing.txt` не существует, но функция возвращает `nil`. Почему?

      ```go
      func load() error {
          var err error
          if true {
              _, err := os.Open("missing.txt")
              _ = err
          }
          return err
      }
      ```
    type: single
    options:
      - id: a
        text: "Присваивание `_ = err` сбрасывает ошибку в `nil`"
        correct: false
        explanation: "Присваивание пустому идентификатору только отбрасывает значение и саму переменную `err` не меняет."
      - id: b
        text: "`os.Open` создаёт отсутствующий файл, ошибки нет"
        correct: false
        explanation: "Файл создаёт `os.Create`, а `os.Open` на отсутствующем файле возвращает ошибку."
      - id: c
        text: "`return` читает `err` до выполнения блока `if`"
        correct: false
        explanation: "Порядок выполнения строгий: блок `if` отрабатывает целиком, затем идёт `return`."
      - id: d
        text: "Оператор `:=` в блоке `if` создал новую `err`, внешняя осталась `nil`"
        correct: true
        explanation: "Внутри блока `:=` объявляет другую переменную с тем же именем, она скрывает внешнюю, и ошибка остаётся в ней."
    explanation: "Оператор `:=` объявляет новые переменные, а в новой области видимости (блок `if`, `for`, функция) заводит их заново даже при совпадении имени. Здесь `err` внутри `if` — другая переменная, она скрывает внешнюю (shadowing), а внешняя так и остаётся `nil`. Чтобы присвоить внешней, пишут `_`, `err = os.Open(...)` без двоеточия, предварительно объявив нужные переменные через `var`."
    extended_explanation: "Формы объявления: `var x int` — нулевое значение; `var x = 5` — тип выводится; `x := 5` — короткая форма, внутри функций. Правило `:=` для нескольких переменных: хотя бы одна слева должна быть новой в этой же области видимости, остальные получают присваивание. Поэтому `a, err := f()` и `b, err := g()` в одном блоке работают, а во вложенном блоке заводят вторую `err`. Скрытие ловит линтер `shadow`, в стандартный `go vet` он не входит."
    recommendation: "Область видимости и скрытие переменных в Go, короткое объявление := и правила повторного объявления из спецификации языка."
    difficulty: medium
    topics: [go, reliability]

  - id: q4
    text: |-
      Что произойдёт при сборке этого кода?

      ```go
      type ID int64

      func main() {
          var a ID = 1
          var b int64 = 2
          fmt.Println(a + b)
      }
      ```
    type: single
    options:
      - id: a
        text: "Выведет 3, ID неявно приводится к `int64`"
        correct: false
        explanation: "Неявных приведений между разными типами в Go нет, даже при общем базовом типе."
      - id: b
        text: "Не скомпилируется: операнды имеют разные типы"
        correct: true
        explanation: "ID и `int64` считаются разными типами, компилятор сообщает `mismatched types ID and int64`."
      - id: c
        text: "Скомпилируется, `go vet` выдаст предупреждение"
        correct: false
        explanation: "Это ошибка компиляции, до запуска `vet` дело не доходит."
      - id: d
        text: "Упадёт с паникой: несовместимые типы при сложении"
        correct: false
        explanation: "Типы проверяются до запуска, во время выполнения такой ошибки возникнуть не может."
    explanation: "Именованный тип ID создаёт новый тип с тем же базовым представлением, но совместимости с `int64` не даёт. Складывать значения разных типов можно только после явного приведения: `int64(a)` + `b`. Тип переменной задаёт объявление, а не значение: в коде он указан явно через `var a ID = 1` и `var b int64 = 2`, а запись `b := 2` дала бы `int`, а не `int64`, и ошибка осталась бы прежней. Литерал 1 подходит любому числовому типу, поэтому `var a ID = 1` компилируется."
    extended_explanation: "Исключение — алиас `type` ID = `int64`: это второе имя того же типа, и сложение скомпилируется. Неявно приводятся лишь нетипизированные константы, поэтому `a` + 2 работает для любого числового типа."
    recommendation: "Именованные типы, алиасы и приведение типов в Go: разделы «Type definitions» и «Alias declarations» спецификации."
    difficulty: medium
    topics: [go, ruby_language]

  - id: q5
    text: "Как правильно описана типизация Ruby и Go?"
    type: single
    options:
      - id: a
        text: "Ruby динамическая и слабая, Go статическая и строгая"
        correct: false
        explanation: "Слабой типизацией называют неявные преобразования, как 1 + `\"1\"` в JavaScript. Ruby в таком случае выбрасывает `TypeError`."
      - id: b
        text: "Обе динамические, Go выводит типы через оператор `:=`"
        correct: false
        explanation: "Вывод типа делает компилятор один раз при сборке, и тип переменной больше не меняется."
      - id: c
        text: "Обе статические, у Ruby проверку типов делает RBS"
        correct: false
        explanation: "RBS и Sorbet необязательные надстройки, а сам язык типы во время выполнения проверяет по факту вызова."
      - id: d
        text: "Ruby динамическая и строгая, Go статическая и строгая"
        correct: true
        explanation: "Статичность описывает момент проверки типов, строгость запрет неявных преобразований. По второй оси языки совпадают."
    explanation: "У типизации две независимые оси. Статическая или динамическая — проверяются ли типы при компиляции или при выполнении. Строгая или слабая — допускаются ли неявные преобразования. Ruby динамический, Go статический, и оба строгие."
    extended_explanation: "Строгость Go проявляется в мелочах: `int` и `int64` несовместимы без приведения, а в условие `if` нельзя поставить число. Динамика Ruby это утиная типизация, проверка метода происходит в момент вызова, а в Go ту же роль играют интерфейсы, проверяемые компилятором."
    recommendation: "Разница между статической и динамической, строгой и слабой типизацией на примерах Ruby, Go и JavaScript."
    difficulty: easy
    topics: [go, ruby_language]

  - id: q6
    text: |-
      Что выведет программа?

      ```go
      x := 10
      p := &x
      *p = 20
      fmt.Println(x)
      ```
    type: single
    options:
      - id: a
        text: "20, запись `*p = 20` меняет значение по адресу в `p`"
        correct: true
        explanation: "Указатель `p` хранит адрес переменной `x`, запись через него меняет саму `x`."
      - id: b
        text: "10, `p` хранит копию `x`, и запись идёт в копию"
        correct: false
        explanation: "Копию значения хранила бы обычная переменная, а `p` хранит адрес `x` и пишет в неё саму."
      - id: c
        text: "Не скомпилируется: через * нельзя присваивать"
        correct: false
        explanation: "Присваивание через `*p` — штатный способ изменить значение по указателю."
      - id: d
        text: "`0xc000012000`, `Println` печатает адрес, на который указывает `p`"
        correct: false
        explanation: "`Println` печатает `x`, то есть число 20. Адрес вывела бы строка `fmt.Println(p)`."
    explanation: "Оператор & берёт адрес переменной, а * применительно к значению-указателю разыменовывает его: читает или записывает то, на что он указывает. Поэтому `*p = 20` меняет `x`. Звёздочка в типе (`p` `*int`) читается иначе: «указатель на `int`». В Ruby переменные хранят ссылки на объекты неявно, и взять адрес самой переменной нельзя, а в Go указатели явные."
    extended_explanation: "Указатель берут в трёх случаях: чтобы изменить значение в функции или методе, чтобы не копировать большую структуру и чтобы выразить «значения может не быть» (`nil`). Арифметики указателей, как в C, в Go нет: `p++` не компилируется. Нулевое значение указателя — `nil`."
    recommendation: "Указатели в Go: тур по языку, раздел «Pointers», и различие между значением, адресом и разыменованием."
    difficulty: easy
    topics: [go, ruby_language]

  - id: q7
    text: |-
      Что выведет программа?

      ```go
      a := 5
      p := &a
      b := a
      *p = 7
      fmt.Println(a, b)
      ```
    type: single
    options:
      - id: a
        text: "`7 7`, `b` ссылается на `a`, как переменная в Ruby"
        correct: false
        explanation: "Присваивание `b := a` копирует число в новую переменную, ссылки на `a` при этом не возникает."
      - id: b
        text: "`7 5`, `b` скопировал значение, `p` указывает на `a`"
        correct: true
        explanation: "`b` получил независимую копию числа 5, а запись через `p` изменила только `a`."
      - id: c
        text: "`5 5`, запись через `p` меняет лишь временную копию"
        correct: false
        explanation: "Запись через указатель меняет саму переменную `a`, временных копий здесь нет."
      - id: d
        text: "`5 7`, `p` указывает на `b`, а не на `a`"
        correct: false
        explanation: "Указатель взят выражением `&a`, поэтому он ведёт к `a`, а `b` к нему отношения не имеет."
    explanation: "Присваивание значения копирует его: `b := a` делает `b` независимой переменной со своим значением 5. Указатель `p := &a` хранит адрес именно переменной `a`, и `*p = 7` меняет `a`. Итог 7 5. Копировать значение и копировать адрес — разные операции."
    extended_explanation: "Две переменные-указателя с одним адресом делят данные: `p2 := p` даёт указатель на ту же `a`, и запись через любой из них видна через второй, а сравнение `p == p2` вернёт `true`. Именно эта разница между копией значения и копией адреса объясняет и передачу аргументов в функции: структура копируется, указатель на неё нет."
    recommendation: "Значения и указатели в Go: что именно копируется при присваивании и передаче в функцию."
    difficulty: medium
    topics: [go]

  - id: q8
    text: |-
      Что выведет программа?

      ```go
      type User struct{ Name string }

      func rename(u User) { u.Name = "Bob" }

      func main() {
          u := User{Name: "Alice"}
          rename(u)
          fmt.Println(u.Name)
      }
      ```
    type: single
    options:
      - id: a
        text: "`Alice`, изменена копия структуры"
        correct: true
        explanation: "Структура копируется при передаче, и присваивание поля меняет только копию."
      - id: b
        text: "`Bob`, структура передана по ссылке"
        correct: false
        explanation: "Так работают объекты в Ruby, где переменная хранит ссылку. В Go ссылки по умолчанию нет."
      - id: c
        text: "Не скомпилируется, нужен указатель на структуру"
        correct: false
        explanation: "Компилятор к такой сигнатуре претензий не имеет, код корректен."
      - id: d
        text: "Паника: запись в неизменяемую копию"
        correct: false
        explanation: "Копия не защищена от записи, поэтому присваивание проходит без ошибок."
    explanation: "Go передаёт все аргументы по значению: структура копируется целиком. Чтобы изменение увидел вызывающий, функция принимает указатель `*User` и вызывается как `rename(&u)`. Запись `u := User{Name: \"Alice\"}` — короткое объявление: создаёт переменную и выводит её тип из литерала (`var u = User{...}` сделал бы то же самое, а `var u User` дал бы структуру с пустым `Name`). В `rename(&u)` оператор & берёт адрес переменной, а * в типе параметра `*User` означает «указатель на `User`»."
    extended_explanation: "Копирование структуры стоит дороже указателя, если она большая, но решает выбор прежде всего семантика. Если хотя бы один метод типа меняет состояние и получает `*T`, остальные методы принято делать с тем же получателем, чтобы набор методов не распадался."
    recommendation: "Передача аргументов в Go, указатели и получатели методов: тур по языку, раздел «Pointers»."
    difficulty: medium
    topics: [go, ruby_language]

  - id: q9
    text: "Структура создана как `u := &User{Name: \"A\"}`. Как записать присваивание поля `Name`?"
    type: single
    options:
      - id: a
        text: "`u->Name = \"B\"`, как в C"
        correct: false
        explanation: "Оператора -> в Go нет, стрелка в языке используется только для каналов."
      - id: b
        text: "`(*u).Name = \"B\"`, короткой записи нет"
        correct: false
        explanation: "Такая запись корректна, но не единственная: короткая тоже компилируется."
      - id: c
        text: "`u.Name = \"B\"`, Go сам разыменует указатель"
        correct: true
        explanation: "При обращении к полю и вызове метода через указатель компилятор подставляет разыменование автоматически."
      - id: d
        text: "`u.Name = \"B\"` меняет копию, нужен ещё оператор &"
        correct: false
        explanation: "Через указатель меняется исходная структура, копия здесь не создаётся."
    explanation: "Для указателя на структуру запись `u.Name` означает `(*u).Name`: компилятор разыменовывает указатель сам, поэтому ни стрелки, как в C, ни явной звёздочки не нужно. То же верно для вызова методов: `u.Inc()` работает и для `u` типа `*Counter`, и для обычной переменной, если метод объявлен на `*Counter`."
    extended_explanation: "Автоматическое разыменование касается полей и методов, но не остального: сложить два `*int` без звёздочек нельзя, нужно `*p` + `*q`. Выражение `&User`{`Name`: `\"A\"`} создаёт структуру и сразу берёт её адрес, чаще всего конструкторы возвращают именно такой указатель."
    recommendation: "Доступ к полям и методам через указатель в Go: автоматическое разыменование в спецификации языка (Selectors)."
    difficulty: medium
    topics: [go, oop]

  - id: q10
    text: |-
      Что произойдёт при выполнении кода?

      ```go
