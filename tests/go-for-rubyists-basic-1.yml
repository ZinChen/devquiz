        correct: true
        explanation: "Встраивание даёт делегирование: `Base` ничего не знает о `Derived`, и динамической диспетчеризации здесь нет."
      - id: c
        text: "Не скомпилируется: `Name` объявлен дважды"
        correct: false
        explanation: "Методы лежат в разных типах, внешний метод просто затеняет внутренний."
      - id: d
        text: "Паника: бесконечная рекурсия `Name`"
        correct: false
