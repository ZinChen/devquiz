  - id: q21
    text: |-
      Что произойдёт при сборке этого кода?

      ```go
      type Incer interface{ Inc() }

      type Counter struct{ n int }

      func (c *Counter) Inc() { c.n++ }

      var _ Incer = Counter{}
      ```
    type: single
    options:
      - id: a
        text: "Не скомпилируется: `Inc` есть только у `*Counter`"
        correct: true
        explanation: "В набор методов значения `Counter` методы с получателем-указателем не входят."
      - id: b
        text: "Скомпилируется, Go сам возьмёт адрес `Counter{}`"
        correct: false
        explanation: "Go подставляет `&c` сам при вызове метода на переменной, но не при присваивании значения в интерфейс."
      - id: c
        text: "Скомпилируется, но упадёт с паникой при вызове `Inc`"
        correct: false
        explanation: "Реализация интерфейса проверяется при компиляции, до запуска дело не дойдёт."
      - id: d
        text: "Скомпилируется, `Inc` будет менять копию значения"
        correct: false
        explanation: "Копия возникала бы при получателе-значении, а здесь код отвергается раньше."
    explanation: "Тип реализует интерфейс, если набор его методов содержит все методы интерфейса. Для `Counter` в набор входят методы с получателем-значением, для `*Counter` ещё и с получателем-указателем. Поэтому `Counter{}` не годится, а `&Counter{}` годится."
    extended_explanation: "Компилятор сообщает: `Counter does not implement Incer (method Inc has pointer receiver)`. Идиома `var _ Incer` = `(*Counter)`(`nil`) проверяет реализацию на этапе сборки и не создаёт значение."
    recommendation: "Наборы методов (method sets) типа и указателя на него в спецификации Go."
    difficulty: medium
    topics: [go, oop]

