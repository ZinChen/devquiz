    recommendation: "Порядок итерации map и способы детерминированного обхода: блог go.dev «Go maps in action»."
    difficulty: easy
    topics: [go, ruby_language]

  - id: q19
    text: |-
      Почему этот код не компилируется?

      ```go
      type Counter struct{ n int }

      func (c *Counter) Inc() { c.n++ }

      m := map[string]Counter{"a": {}}
      m["a"].Inc()
      ```
    type: single
    options:
      - id: a
        text: "Метод `Inc` объявлен как приватный и недоступен снаружи"
        correct: false
        explanation: "Метод назван с заглавной буквы и экспортируется, а код находится в одном пакете."
      - id: b
        text: "Элемент `map` неадресуем, а `Inc` требует указатель"
        correct: true
        explanation: "Адрес `m[k]` взять нельзя, потому что при росте таблицы элементы переносятся в памяти."
      - id: c
        text: "Структуру нельзя хранить в `map` как значение"
        correct: false
        explanation: "Значением `map` может быть любой тип, структуры хранят постоянно."
      - id: d
        text: "Перед вызовом метода `map` нужно заблокировать мьютексом"
        correct: false
        explanation: "Мьютексы относятся к конкурентному доступу, а эта ошибка возникает на этапе компиляции."
    explanation: "Тип `map[string]Counter` — словарь, аналог Hash в Ruby: ключ типа `string`, значение типа `Counter`, а запись `\"a\"`: {} задаёт ключ `\"a\"` и значение `Counter{}` с нулевым `n`. Вызов `m[\"a\"].Inc()` Go трактует как (`&m`[`\"a\"`]).`Inc()`, потому что метод объявлен на `*Counter` и ему нужен адрес. Элементы `map` неадресуемы: при росте таблицы рантайм переносит их, и указатель стал бы висячим. Компилятор отказывает с `cannot call pointer method Inc on Counter`."
    extended_explanation: "Выражение `m[\"a\"]` возвращает копию значения, поэтому даже без запрета метод менял бы копию, а не элемент словаря. Два обходных пути. Первый — хранить указатели: `map[string]*Counter`, и `m[\"a\"].Inc()` заработает. Второй — прочитать копию, изменить и записать обратно: `c := m[\"a\"]`; `c.Inc()`; `m[\"a\"] = c`. Присваивание поля `m[\"a\"].n = 1` не компилируется по той же причине. Со срезом всё иначе: `s[0].Inc()` работает, потому что элемент среза лежит в массиве по постоянному адресу."
    recommendation: "Адресуемость значений в Go: что можно брать по адресу, а что нельзя (map, результат функции, константы)."
    difficulty: medium
    topics: [go]

