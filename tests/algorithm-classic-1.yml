  - id: q16
    text: "Отакар Борувка придумал первый алгоритм построения минимального остовного дерева в 1926 году, решая задачу электрификации Моравии — требовалось соединить электросетью все населённые пункты региона с минимальными суммарными затратами на провода. Какое свойство реальной задачи электрификации отражает абстрактное условие MST «связать все вершины рёбрами минимального суммарного веса, без циклов»?"
    type: single
    options:
      - id: a
        text: "Вершины — населённые пункты, вес ребра — стоимость прокладки провода между ними, отсутствие циклов — избегание дублирующих (лишних) линий"
        correct: true
        explanation: "Цикл в сети электропередач означает избыточное соединение — путь между двумя точками уже существует, а лишний провод только увеличивает затраты, не добавляя связности."
      - id: b
        text: "Вершины — трансформаторные подстанции, вес ребра — время передачи электричества между ними"
        correct: false
        explanation: "Задача Борувки формулировалась именно как минимизация затрат на провода (стоимость), а не как оптимизация скорости передачи электроэнергии — это разные величины и разные постановки задачи."
      - id: c
        text: "Вершины — источники энергии, вес ребра — количество произведённого электричества"
        correct: false
        explanation: "Объём производства энергии не является параметром MST-задачи вообще — вес ребра в этой модели относится именно к стоимости соединения двух точек, а не к количеству чего-либо, производимого в вершинах."
      - id: d
        text: "Вершины — провода, вес ребра — расстояние между населёнными пунктами по прямой без учёта реального маршрута прокладки"
        correct: false
        explanation: "В самой модели MST именно населённые пункты — вершины, а провода — рёбра между ними, а не наоборот; кроме того, вес ребра отражает именно стоимость прокладки, которая на практике не сводится к расстоянию по прямой."
    explanation: "MST — абстракция конкретной инженерной задачи: минимизировать суммарную стоимость связей при условии, что от любой точки сети можно добраться до любой другой. Отсутствие циклов — не самоцель, а следствие того, что лишнее соединение всегда увеличивает стоимость, не добавляя ничего к связности."
    topics: [algorithms]
    extended_explanation: |
      MST — не единственная интерпретация этой абстрактной задачи:
      та же математическая модель (граф, минимизация суммарного веса
      рёбер при сохранении связности) применяется сегодня для
      проектирования кабельных сетей, трубопроводов, а также как шаг
      внутри алгоритмов кластеризации данных, где «расстояние» между
      объектами превращается в вес ребра.
    recommendation: "Прорешать классическую задачу «Min Cost to Connect All Points» — она прямо воспроизводит постановку Борувки на плоскости, только с расстоянием вместо стоимости прокладки."

  - id: q17
    text: "Обратная польская нотация (Reverse Polish Notation, RPN) была выбрана инженерами Hewlett-Packard основным режимом ввода для калькулятора HP-35 (1972). Почему именно она, а не привычная запись со скобками и приоритетом операций?"
    type: single
    options:
      - id: a
        text: "RPN была быстрее в вычислениях только для очень больших чисел"
        correct: false
        explanation: "Преимущество RPN не связано с размером чисел — оно касается самого способа разбора и вычисления выражения независимо от масштаба конкретных значений."
      - id: b
        text: "RPN была придумана лично инженерами HP специально для этого калькулятора"
        correct: false
        explanation: "RPN не изобретение инженеров HP — она восходит к работам польского логика Яна Лукасевича в 1920-х годах; HP лишь адаптировала уже существующую математическую нотацию под клавиатуру калькулятора, о чём сама компания открыто заявляла."
      - id: c
        text: "RPN требовалась по патентным соображениям, чтобы обойти патент конкурента на инфиксную запись"
        correct: false
        explanation: "Выбор RPN объясняется инженерными, а не патентными причинами — простота вычисления через стек на ограниченном железе того времени, а не обход чужих патентов."
      - id: d
        text: "RPN вычисляется через стек без учёта скобок и приоритета операций — проще для железа"
        correct: true
        explanation: "Постфиксная (обратная польская) запись сканируется строго слева направо: операнды кладутся в стек, а оператор сразу применяется к операндам с вершины стека — не требуется ни отслеживать скобки, ни откладывать применение оператора до выяснения приоритета, как в привычной инфиксной записи. Это давало заметное упрощение аппаратной реализации."
    explanation: "Постфиксная запись позволяет вычислять выражение единственным линейным проходом через стек, без необходимости в дополнительной логике для скобок и приоритета операций (как в привычной инфиксной записи) — это давало ощутимое упрощение при реализации на аппаратном уровне карманного калькулятора начала 1970-х."
    topics: [algorithms]
    extended_explanation: |
      Само название «Reverse Polish» — прямая дань уважения польскому
      логику Яну Лукасевичу, придумавшему в 1920-е годы префиксную
      («польскую») запись для устранения скобок в логических формулах;
      HP открыто называли выбор производным от его работ, отсюда и
      «польская» часть названия обратной формы записи.
    recommendation: "Связать этот факт с уже знакомой механикой стека из темы паттернов решения задач — вычисление RPN через стек является классическим примером применения структуры «стек промежуточных результатов»."

  - id: q18
    text: "В 1972 году Ричард Карп опубликовал статью «Reducibility Among Combinatorial Problems», доказав NP-полноту 21 задачи. На какой более ранний результат (1971 года) он опирался, чтобы построить эти доказательства?"
    type: single
    options:
      - id: a
        text: "На работу Джозефа Крускала об алгоритмах на графах"
        correct: false
        explanation: "Работа Крускала касается совершенно другой темы — построения минимального остовного дерева, а не теории NP-полноты и вычислительной сложности."
      - id: b
        text: "На алгоритм Дейкстры о кратчайших путях"
        correct: false
        explanation: "Алгоритм Дейкстры относится к совершенно другой области — эффективным точным алгоритмам для конкретной задачи, а не к теории вычислительной сложности и доказательствам NP-полноты."
      - id: c
        text: "На собственную более раннюю работу 1965 года о P vs NP"
        correct: false
        explanation: "Формулировка проблемы P vs NP в современном виде и ключевые результаты (включая теорему Кука) относятся к более позднему периоду, около 1971 года, а не к 1965."
      - id: d
        text: "На теорему Стивена Кука о NP-полноте булевой выполнимости (SAT)"
        correct: true
        explanation: "Карп использовал теорему Кука 1971 года (SAT является NP-полной задачей) как отправную точку: он построил полиномиальные сведения (reductions) от SAT к каждой из 21 рассмотренной задачи, тем самым доказав их NP-полноту через уже установленную NP-полноту SAT."
    explanation: "Статья Карпа 1972 года построена на теореме Кука (1971), впервые показавшей, что задача булевой выполнимости (SAT) является NP-полной. Карп ввёл (и сделал стандартной) методологию доказательства NP-полноты через полиномиальные сведения от уже известной NP-полной задачи — применив её к 21 разной комбинаторной и теоретико-графовой задаче, включая задачу коммивояжёра."
    topics: [algorithms]
    extended_explanation: |
      Эта работа заложила фундамент современной теории вычислительной
      сложности и проблемы P vs NP: показав, что множество на первый
      взгляд разных практических задач на самом деле эквивалентны по
      сложности (все NP-полные), она объяснила, почему для стольких
      разных прикладных задач (включая TSP) не находится эффективного
      точного решения — все они «одинаково трудны» в определённом
      техническом смысле.
    recommendation: "Связать эту историческую веху с практическим следствием: именно осознание NP-полноты TSP (через результат Карпа) обосновало переход индустрии к приближённым эвристикам как к основному практическому инструменту, а не к поиску несуществующего эффективного точного алгоритма."

  - id: q19
    text: "Статья Ричарда Карпа о NP-полноте 21 задачи и калькулятор HP-35 с обратной польской записью вышли в один и тот же 1972 год. А вот алгоритм Дейкстры (1956) и алгоритм Прима (1957, независимое переоткрытие идеи Ярника 1930 года) связаны не только близостью дат. Чем именно?"
    type: single
    options:
      - id: a
        text: "Оба вышли из одной исследовательской группы и были частью одного проекта"
        correct: false
        explanation: "Дейкстра и Прим работали независимо друг от друга, в разных странах и без общего проекта — совпадение в структуре алгоритмов не объясняется общим происхождением."
      - id: b
        text: "Оба — жадные алгоритмы на графах, растящие решение по одному шагу через приоритетную очередь с выбором минимального расстояния/веса"
        correct: true
        explanation: "Прим на каждом шаге добавляет минимальное ребро, соединяющее уже построенное дерево с новой вершиной — структурно это тот же жадный шаг с приоритетной очередью, что и в Дейкстре, только целевая величина другая (вес ребра, а не накопленное расстояние)."
      - id: c
        text: "Оба алгоритма математически доказано дают один и тот же результат на любом графе"
        correct: false
        explanation: "Дейкстра решает другую задачу (кратчайшие пути от одной вершины до всех), Прим — другую (минимальное остовное дерево) — результаты этих двух алгоритмов на одном графе, как правило, не совпадают, это разные величины."
      - id: d
        text: "Оба используют один и тот же алгоритм сортировки рёбер как первый шаг"
        correct: false
        explanation: "Сортировка всех рёбер заранее — характерная черта алгоритма Крускала, а не Прима и не Дейкстры: оба растят решение пошагово через приоритетную очередь, без предварительной сортировки всего списка рёбер."
    explanation: "Дейкстра и Прим — оба жадные алгоритмы: на каждом шаге через приоритетную очередь выбирается вершина/ребро с минимальным значением интересующей величины, и решение растится инкрементально. В отличие от совпадения года публикации Карпа и HP-35 (чистое совпадение дат, разные области), близость Дейкстры и Прима — структурное родство самих алгоритмов, а не просто совпадение по времени."
    topics: [algorithms]
    extended_explanation: |
      Это структурное родство — не случайность из двух независимых
      открытий: MST и кратчайшие пути — родственные задачи на
      взвешенных графах, и жадный подход с приоритетной очередью
      естественно решает обе, различаясь только тем, какая величина
      минимизируется на каждом шаге (вес одного ребра у Прима — против
      суммарного расстояния от старта у Дейкстры).
    recommendation: "Реализовать оба алгоритма рядом и сравнить код построчно — общая часть (приоритетная очередь, цикл «взять минимум, обновить соседей») окажется почти идентичной, различие — буквально в одной формуле пересчёта."

  - id: q20
    text: "Дано название алгоритма — «Беллман-Форд». Какое из следующих описаний соответствует именно ему, а не Дейкстре или A*?"
    type: single
    options:
      - id: a
        text: "Обходит граф в ширину слоями и гарантирует кратчайший путь только при одинаковом весе всех рёбер"
        correct: false
        explanation: "Это описание BFS (обхода в ширину) как метода поиска кратчайшего пути в невзвешенном графе — совершенно другой алгоритм, не связанный с Беллманом-Фордом, который как раз умеет работать с разными весами, включая отрицательные."
      - id: b
        text: "На каждом шаге жадно фиксирует вершину с минимальным известным расстоянием и больше её не пересматривает; требует неотрицательных весов"
        correct: false
        explanation: "Это описание алгоритма Дейкстры, а не Беллмана-Форда — именно жадная фиксация вершины без пересмотра и требование неотрицательности весов отличают Дейкстру от более медленного, но универсального по знаку весов Беллмана-Форда."
      - id: c
        text: "Комбинирует уже пройденное расстояние с эвристической оценкой оставшегося пути до конкретной цели"
        correct: false
        explanation: "Это описание алгоритма A* — комбинация g(n) и h(n) является его отличительной чертой, у Беллмана-Форда никакой эвристики и понятия «конкретная цель» нет вообще."
      - id: d
        text: "Многократно релаксирует все рёбра графа, что позволяет ему работать с отрицательными весами и обнаруживать отрицательные циклы"
        correct: true
        explanation: "Это точное описание Беллмана-Форда: в отличие от жадного одношагового выбора Дейкстры, он проходит по всем рёбрам многократно (до V-1 раз), что даёт худшую сложность O(V·E), но снимает ограничение на неотрицательность весов и попутно позволяет обнаружить отрицательный цикл."
    explanation: "Дейкстра, A* и Беллман-Форд решают близкую задачу (кратчайший путь), но принципиально разными способами: Дейкстра — жадная фиксация без пересмотра (только неотрицательные веса); A* — Дейкстра плюс эвристика к конкретной цели; Беллман-Форд — многократная релаксация всех рёбер, единственный из трёх работающий с отрицательными весами и способный обнаруживать отрицательные циклы."
    topics: [algorithms]
    extended_explanation: |
      Путаница между этими тремя алгоритмами — частая ошибка на
      собеседованиях именно потому, что все три решают на первый
      взгляд одну и ту же задачу «кратчайший путь». Ключевой
      различитель — какое именно ограничение снимает или добавляет
      каждый из них: Дейкстра оптимален по скорости при неотрицательных
      весах, A* добавляет направленность к цели через эвристику,
      Беллман-Форд жертвует скоростью ради снятия ограничения на знак
      весов.
    recommendation: "Составить для себя таблицу «алгоритм — ограничение на веса — нужна ли цель заранее — сложность» для этих трёх алгоритмов сразу — типичный вопрос на понимание compare-and-contrast между близкими темами."
