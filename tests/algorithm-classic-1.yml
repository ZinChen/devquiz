slug: algorithm-classic-1
title: "Алгоритмы: классика и структуры данных"
description: "Дейкстра, минимальное остовное дерево, Union-Find, Trie, куча, LRU-кэш, задача коммивояжёра и историческая справка о происхождении классических алгоритмов."
tags: [algorithms, claude-gen]
difficulty: advanced
estimated_time: 30

questions:
  - id: q1
    text: "Алгоритм Дейкстры на каждом шаге берёт непосещённую вершину с минимальным текущим расстоянием и «фиксирует» её, больше не пересматривая. Почему этот подход ломается на графе с отрицательными весами рёбер?"
    type: single
    options:
      - id: a
        text: "Приоритетная очередь не умеет работать с отрицательными числами"
        correct: false
        explanation: "Приоритетная очередь технически прекрасно работает с отрицательными числами как с любыми другими — проблема не в структуре данных, а в самой логике алгоритма."
      - id: b
        text: "Более короткий путь через отрицательное ребро мог найтись уже после фиксации вершины"
        correct: true
        explanation: "Как только вершина зафиксирована, алгоритм больше не рассматривает пути к ней — это корректно только при неотрицательных весах, где любой дополнительный шаг может лишь увеличить расстояние. Отрицательное ребро способно задним числом дать более короткий путь, который алгоритм уже пропустил."
      - id: c
        text: "Отрицательные веса делают граф несвязным"
        correct: false
        explanation: "Наличие отрицательных весов рёбер никак не влияет на связность графа — это два независимых свойства."
      - id: d
        text: "Дейкстра физически не может хранить отрицательные значения расстояний в структуре данных"
        correct: false
        explanation: "Расстояния хранятся как обычные числа — технических ограничений на хранение отрицательных значений нет, проблема исключительно в логике жадного выбора."
    explanation: "Дейкстра — жадный алгоритм: он предполагает, что раз вершина уже достигнута кратчайшим известным путём, короче уже не станет. Это предположение верно только при неотрицательных весах — там любое добавление ребра к пути может только увеличить расстояние. Отрицательное ребро нарушает эту гарантию."
    topics: [algorithms]
    extended_explanation: |
      Для графов с отрицательными весами (но без отрицательных циклов)
      используется алгоритм Беллмана-Форда — он медленнее (O(V·E) против
      O((V+E) log V) у Дейкстры с кучей), но многократно релаксирует все
      рёбра, не полагаясь на предположение о зафиксированной оптимальности
      вершины.
    recommendation: "Запомнить формулировку ограничения буквально: Дейкстра требует именно неотрицательных весов, а не «положительных» — нулевые веса допустимы."

  - id: q2
    text: "Какая структура данных используется внутри алгоритма Дейкстры для эффективного выбора следующей вершины с минимальным текущим расстоянием, и какую сложность это даёт?"
    type: single
    options:
      - id: a
        text: "Обычный массив с линейным перебором — O(V²) суммарно"
        correct: false
        explanation: "Такой вариант действительно существует (наивная реализация без кучи), но не является типичным ответом на вопрос про эффективную реализацию — с ним сложность заметно хуже."
      - id: b
        text: "Приоритетная очередь (бинарная куча) — O((V + E) log V) суммарно"
        correct: true
        explanation: "Приоритетная очередь на основе бинарной кучи даёт быстрый доступ к вершине с минимальным расстоянием (O(log V) на извлечение) — при E рёбрах и V вершинах суммарная сложность алгоритма с такой структурой O((V + E) log V)."
      - id: c
        text: "Хеш-таблица — O(V + E) суммарно"
        correct: false
        explanation: "Хеш-таблица не поддерживает эффективное извлечение минимума среди хранимых значений — для этого нужна структура, поддерживающая порядок, как куча."
      - id: d
        text: "Стек — O(V log V) суммарно"
        correct: false
        explanation: "Стек — LIFO-структура без поддержки извлечения минимума; для выбора вершины с наименьшим расстоянием стек не подходит по своей природе."
    explanation: "Классическая эффективная реализация Дейкстры использует приоритетную очередь (min-heap) для быстрого извлечения вершины с минимальным текущим расстоянием — это даёт сложность O((V + E) log V), значительно лучше наивной O(V²) реализации на больших разреженных графах."
    topics: [algorithms]
    extended_explanation: |
      Теоретически оптимальная (но почти не используемая на практике
      из-за сложности реализации и большой константы) структура —
      фибоначчиева куча, дающая O(E + V log V). Разница между этими
      двумя оценками становится существенной только на очень больших
      графах.
    recommendation: "Сравнить асимптотику Дейкстры с бинарной кучей и без неё на конкретных числах V и E — разница особенно заметна на разреженных графах, где E близко к V."

  - id: q3
    text: "Чем алгоритм A* принципиально отличается от алгоритма Дейкстры, если оба ищут путь во взвешенном графе с неотрицательными весами?"
    type: single
    options:
      - id: a
        text: "A* добавляет эвристику к конкретной цели, Дейкстра ищет пути до всех вершин сразу"
        correct: true
        explanation: "A* использует функцию оценки f(n) = g(n) + h(n), где h(n) — эвристическая оценка оставшегося расстояния до конкретной цели, что направляет поиск в нужную сторону. Дейкстра эвристики не использует и по построению находит кратчайшие пути от старта до всех остальных вершин графа сразу, а не только до одной цели."
      - id: b
        text: "A* работает с отрицательными весами, а Дейкстра — нет"
        correct: false
        explanation: "И A*, и Дейкстра в стандартной формулировке требуют неотрицательных весов рёбер — способность работать с отрицательными весами их не различает."
      - id: c
        text: "A* — это алгоритм для неориентированных графов, Дейкстра — только для ориентированных"
        correct: false
        explanation: "Оба алгоритма одинаково применимы и к ориентированным, и к неориентированным графам — тип графа их не различает."
      - id: d
        text: "A* не использует приоритетную очередь, в отличие от Дейкстры"
        correct: false
        explanation: "A*, как и Дейкстра, обычно реализуется через приоритетную очередь — разница не в самой структуре данных, а в критерии сортировки внутри неё (за счёт добавленной эвристики)."
    explanation: "A* можно рассматривать как Дейкстру с добавленной эвристической функцией: вместо ориентации только на пройденное расстояние g(n), A* учитывает ещё и оценку оставшегося пути h(n) до конкретной известной цели. Это делает A* эффективнее Дейкстры, когда нужен путь до одной определённой вершины, а не до всех сразу."
    topics: [algorithms]
    extended_explanation: |
      Качество эвристики h(n) критично: она должна быть допустимой (не
      переоценивать реальное расстояние до цели), иначе A* потеряет
      гарантию нахождения кратчайшего пути. Для дорожных сетей часто
      используют манхэттенское или евклидово расстояние как h(n).
    recommendation: "Прорешать одну и ту же задачу поиска пути и через Дейкстру, и через A* с простой эвристикой — разница в числе рассмотренных вершин станет наглядной."

  - id: q4
    text: "Нужно связать все вершины графа рёбрами минимального суммарного веса, без циклов. Алгоритм Крускала решает это, сортируя все рёбра по весу и добавляя их по возрастанию, если добавление не создаёт цикл. Как эффективно проверять, создаст ли конкретное ребро цикл?"
    type: single
    options:
      - id: a
        text: "Через структуру Union-Find (DSU) — проверить, находятся ли уже обе вершины ребра в одном множестве"
        correct: true
        explanation: "Union-Find эффективно отвечает на вопрос «находятся ли два элемента в одном множестве» через операцию find — если обе вершины ребра уже принадлежат одному множеству (компоненте), добавление ребра создаст цикл; если нет — ребро добавляется, а множества объединяются через union."
      - id: b
        text: "Через полный обход графа (BFS или DFS) от одной из вершин ребра после каждого добавления"
        correct: false
        explanation: "Технически рабочий, но крайне медленный подход — полный обход графа на каждой проверке даёт значительно худшую суммарную сложность, чем Union-Find с оптимизациями."
      - id: c
        text: "Через хеш-таблицу, хранящую все уже добавленные рёбра"
        correct: false
        explanation: "Хеш-таблица рёбер не отвечает напрямую на вопрос о принадлежности вершин одной компоненте связности — для этого нужна структура, отслеживающая именно группировку вершин, как Union-Find."
      - id: d
        text: "Через сортировку вершин по степени (числу инцидентных рёбер)"
        correct: false
        explanation: "Степень вершины не даёт информации о том, принадлежат ли две конкретные вершины одной уже сформированной компоненте связности."
    explanation: "Union-Find (Disjoint Set Union) — естественная связка с алгоритмом Крускала: операция find быстро определяет, находятся ли вершины ребра уже в одной компоненте (тогда добавление создаст цикл), а union объединяет компоненты при добавлении подходящего ребра."
    topics: [algorithms]
    extended_explanation: |
      Итоговая сложность алгоритма Крускала — O(E log E), где основной
      вклад вносит сортировка всех рёбер по весу; операции Union-Find с
      оптимизациями (path compression, union by rank) добавляют лишь
      почти константный по времени множитель на каждую проверку.
    recommendation: "Сравнить с алгоритмом Прима — тот растит дерево из одной стартовой вершины через приоритетную очередь, а не через сортировку всех рёбер сразу; выбор между ними зависит от плотности графа."

  - id: q5
    text: "Когда алгоритм Прима (растит минимальное остовное дерево из одной вершины через приоритетную очередь) предпочтительнее алгоритма Крускала (сортирует и перебирает все рёбра)?"
    type: single
    options:
      - id: a
        text: "На плотных графах, где число рёбер велико относительно числа вершин"
        correct: true
        explanation: "Прим растёт из одной вершины, рассматривая на каждом шаге только рёбра, смежные с уже построенным деревом, — это эффективнее на плотных графах, где сортировка всех рёбер (как у Крускала) становится относительно дорогой из-за их большого числа."
      - id: b
        text: "На разреженных графах, где рёбер мало относительно вершин"
        correct: false
        explanation: "На разреженных графах, наоборот, чаще предпочтительнее Крускал — сортировка небольшого числа рёбер обходится дёшево, а Union-Find даёт почти константную проверку цикла."
      - id: c
        text: "Только когда граф ориентированный"
        correct: false
        explanation: "Оба алгоритма (Крускала и Прима) в стандартной формулировке применяются к неориентированным графам — вопрос ориентированности графа не является критерием выбора между ними."
      - id: d
        text: "Только когда веса всех рёбер одинаковы"
        correct: false
        explanation: "Оба алгоритма работают с произвольными (различными) весами рёбер — равенство весов не является условием применимости ни одного из них."
    explanation: "Выбор между Крускалом и Примом определяется плотностью графа: Крускал (сортировка всех рёбер + Union-Find) эффективнее на разреженных графах с относительно небольшим числом рёбер; Прим (рост дерева через приоритетную очередь, аналогично структуре Дейкстры) эффективнее на плотных графах, где рёбер много относительно числа вершин."
    topics: [algorithms]
    extended_explanation: |
      Сложность алгоритма Прима с приоритетной очередью — O(E log V), что
      структурно очень похоже на реализацию Дейкстры с кучей: оба
      алгоритма растят структуру из одной стартовой вершины, добавляя на
      каждом шаге наиболее «выгодное» следующее ребро/вершину.
    recommendation: "Практическое применение MST — проектирование сетей минимальной стоимости (кабель, дороги, связывающие все точки) — обе задачи Крускала и Прима исторически разрабатывались именно для таких прикладных инженерных задач."

  - id: q6
    text: "Структура Union-Find без оптимизаций даёт O(n) на операцию в худшем случае. Какие две оптимизации вместе дают почти константную амортизированную сложность O(α(n))?"
    type: single
    options:
      - id: a
        text: "Path compression (сжатие пути при find) и union by rank/size (подвешивание меньшего дерева к большему)"
        correct: true
        explanation: "Path compression при каждом вызове find подвешивает все пройденные узлы напрямую к корню, сокращая будущие пути. Union by rank/size не даёт деревьям расти в высоту без необходимости, подвешивая меньшее дерево к большему. Вместе эти две оптимизации дают почти константную амортизированную сложность O(α(n)), где α — обратная функция Аккермана."
      - id: b
        text: "Кэширование результатов find в хеш-таблице и предварительная сортировка элементов"
        correct: false
        explanation: "Это не стандартные оптимизации Union-Find — классические оптимизации именно path compression и union by rank/size, они напрямую работают со структурой самого дерева множества."
      - id: c
        text: "Использование бинарного поиска вместо линейного перебора при find"
        correct: false
        explanation: "Union-Find не хранит элементы в отсортированном виде, поэтому бинарный поиск неприменим к его внутренней структуре — операция find устроена иначе, через восхождение по дереву к корню."
      - id: d
        text: "Замена деревьев на связные списки для более быстрого обхода"
        correct: false
        explanation: "Связный список не даёт преимущества перед деревом для этой задачи — наоборот, именно древовидная структура с сжатием пути и балансировкой по рангу даёт нужный выигрыш в скорости."
    explanation: "Path compression и union by rank/size — две стандартные оптимизации Union-Find, применяемые вместе. Каждая по отдельности уже улучшает сложность, но именно их комбинация даёт почти константную амортизированную сложность O(α(n)) — обратная функция Аккермана растёт настолько медленно, что на практике её значение не превышает 4-5 для любых реалистичных n."
    topics: [algorithms]
    extended_explanation: |
      Union-Find применяется не только в алгоритме Крускала для
      обнаружения циклов — та же структура эффективно решает задачи
      проверки связности компонент графа и группировки связанных
      элементов в целом (например, объединение пользователей в
      социальные группы по цепочке знакомств).
    recommendation: "Не путать обратную функцию Аккермана (растёт крайне медленно, практически константа) с самой функцией Аккермана (растёт исключительно быстро) — это принципиально разные по темпу роста функции с похожим названием."

  - id: q7
    text: "Нужна структура данных для эффективного автодополнения по префиксу — например, по вводу «cat» найти все слова словаря, начинающиеся с этих трёх букв. Почему Trie (префиксное дерево) подходит для этого лучше, чем хранение слов в обычном массиве строк?"
    type: single
    options:
      - id: a
        text: "Поиск по префиксу в Trie занимает O(L), где L — длина искомого префикса"
        correct: true
        explanation: "В Trie путь от корня до узла соответствует конкретному префиксу — спуск по дереву на L шагов сразу приводит к нужному поддереву со всеми словами, начинающимися так, независимо от того, сколько всего слов хранится в структуре."
      - id: b
        text: "Trie всегда занимает меньше памяти, чем массив строк"
        correct: false
        explanation: "Наоборот — Trie обычно расходует БОЛЬШЕ памяти, чем плоский массив строк, поскольку каждый узел хранит указатели на всех возможных детей (например, 26 для латинского алфавита), даже если реально использована лишь малая часть."
      - id: c
        text: "Trie автоматически сортирует все хранимые слова по алфавиту"
        correct: false
        explanation: "Хотя обход Trie в определённом порядке действительно даёт слова в алфавитном порядке, это побочное свойство, а не главная причина использования Trie именно для быстрого поиска по префиксу."
      - id: d
        text: "Trie поддерживает удаление элементов быстрее, чем массив"
        correct: false
        explanation: "Скорость удаления не является определяющим преимуществом Trie для задачи автодополнения — ключевое преимущество именно в скорости поиска по префиксу."
    explanation: "В массиве строк поиск всех слов с заданным префиксом требует в общем случае просмотра каждой строки целиком — O(n×L) в худшем случае. В Trie путь от корня, соответствующий символам префикса, сразу указывает на поддерево со всеми подходящими словами — поиск занимает O(L), где L — длина самого префикса, не завися от общего числа слов в структуре."
    topics: [algorithms]
    extended_explanation: |
      Плата за эту скорость — расход памяти: каждый узел хранит указатели
      на всех возможных потомков (26 для английского алфавита, даже если
      реально использовано 2-3), что при большом словаре может быть
      существенно. Сжатые варианты вроде radix tree (Patricia trie)
      объединяют цепочки узлов с одним потомком, экономя память.
    recommendation: "Помимо автодополнения, вспомнить другие применения Trie: проверка орфографии, поиск по префиксу в маршрутизации IP-адресов (longest prefix match)."

  - id: q8
    text: "Куча (heap) хранится компактно в обычном массиве, без явных указателей между узлами. Как для узла с индексом i (0-indexed) вычислить индексы его родителя и двух потомков?"
    type: single
    options:
      - id: a
        text: "Родитель: i/2; левый потомок: i×2; правый потомок: i×2+1 — для 0-indexed массива формула такая же, как для 1-indexed"
        correct: false
        explanation: "Формулы для 1-indexed и 0-indexed массивов отличаются на единицу в смещении — при 0-indexed нумерации корректная формула для родителя именно (i-1)/2, а не i/2."
      - id: b
        text: "Родитель: (i-1)/2 (целочисленное деление); левый потомок: 2i+1; правый потомок: 2i+2"
        correct: true
        explanation: "Это стандартная формула для полного бинарного дерева, хранимого в массиве без указателей: она работает именно потому, что куча — полное бинарное дерево, где все уровни заполнены слева направо, что позволяет вычислять положение родителя и потомков чисто арифметически."
      - id: c
        text: "Родитель, левый и правый потомок вычисляются только через явные указатели, хранимые в каждом элементе массива"
        correct: false
        explanation: "Главное преимущество компактного хранения кучи в массиве — как раз отсутствие необходимости хранить явные указатели: положение родителя и потомков вычисляется чисто по индексу за O(1)."
      - id: d
        text: "У кучи нет фиксированной формулы — положение родителя и потомков определяется поиском по значению"
        correct: false
        explanation: "У кучи, хранимой в массиве, есть именно фиксированная арифметическая формула для положения родителя и потомков — поиск по значению для этого не требуется."
    explanation: "Устройство кучи как полного бинарного дерева (все уровни заполнены, кроме, возможно, последнего, который заполняется слева направо) позволяет хранить её компактно в массиве без указателей — положение родителя и обоих потомков для узла с индексом i вычисляется чисто арифметически."
    topics: [algorithms]
    extended_explanation: |
      Именно компактность хранения без указателей даёт куче хорошую
      кэш-локальность по сравнению с деревьями на указателях — соседние
      по логике узлы физически близки в памяти, что ускоряет операции
      на практике сверх чисто асимптотической оценки.
    recommendation: "Прорешать на бумаге пример: построить min-heap из 7 элементов и вручную вычислить индексы родителя/потомков для нескольких узлов — формула быстро становится интуитивной."

  - id: q9
    text: "Инвариант min-heap гласит: каждый родитель ≤ своих потомков. Значит ли это, что куча хранит элементы в отсортированном порядке?"
    type: single
    options:
      - id: a
        text: "Да — куча по определению хранит все элементы строго по возрастанию"
        correct: false
        explanation: "Это распространённое заблуждение: гарантия кучи слабее полной сортировки — она затрагивает только пары родитель-потомок, а не весь массив целиком."
      - id: b
        text: "Нет — гарантирован порядок только между родителем и потомками, не между «братьями»"
        correct: true
        explanation: "Инвариант кучи — локальное свойство: он ничего не говорит о порядке между двумя «братскими» узлами на одном уровне или между произвольными узлами в разных ветвях дерева. Полная сортировка требует более сильного свойства, чем то, что гарантирует куча."
      - id: c
        text: "Да, но только для max-heap, а не для min-heap"
        correct: false
        explanation: "Ни min-heap, ни max-heap не гарантируют полной отсортированности — их инвариант в обоих случаях ограничен только парами родитель-потомок."
      - id: d
        text: "Отсортированность гарантируется только для куч размером менее 10 элементов"
        correct: false
        explanation: "Размер кучи не влияет на характер гарантии — инвариант родитель-потомок работает одинаково для куч любого размера, и полной сортировки он не даёт ни при каком размере."
    explanation: "Ключевая деталь, которую легко упустить: инвариант кучи (родитель ≤ потомков для min-heap) — это локальное свойство между соседними по дереву узлами, а не глобальная отсортированность всего массива. Два произвольных элемента кучи, не связанных отношением родитель-потомок, могут быть в любом порядке."
    topics: [algorithms]
    extended_explanation: |
      Именно поэтому heap sort (сортировка через построение кучи и
      последовательное извлечение минимума/максимума) требует
      дополнительного шага extract после построения — сама по себе
      куча ещё не является отсортированной последовательностью, ею
      становится только результат последовательных извлечений корня.
    recommendation: "Не путать инвариант кучи с инвариантом бинарного дерева поиска (BST) — там как раз гарантируется порядок между произвольными узлами через обход, а быстрый доступ к минимуму без обхода влево до конца не гарантируется."

  - id: q10
    text: "Наивно кажется, что построение кучи (build-heap) из произвольного массива n элементов требует O(n log n) — вставить n раз по O(log n) каждая. Какая реальная сложность у эффективного алгоритма построения кучи, и почему?"
    type: single
    options:
      - id: a
        text: "O(n log n) — наивная оценка верна, никакого более быстрого способа не существует"
        correct: false
        explanation: "Существует эффективный алгоритм build-heap (heapify снизу вверх), дающий именно линейную сложность — наивная оценка через n последовательных вставок завышает реальную сложность."
      - id: b
        text: "O(n) — линейная сложность за счёт построения снизу вверх"
        correct: true
        explanation: "При построении кучи снизу вверх большинство узлов находится ближе к листьям, где просеивание (sift-down) требует мало шагов — только небольшая часть узлов у корня требует просеивания на всю глубину дерева. Суммарная работа по всем узлам оказывается линейной, O(n), а не O(n log n), как подсказывает наивная оценка."
      - id: c
        text: "O(log n) — построение кучи не зависит от числа элементов"
        correct: false
        explanation: "Построение кучи обязательно затрагивает каждый из n элементов хотя бы один раз — логарифмическая сложность, не зависящая от n, здесь недостижима."
      - id: d
        text: "O(n²) — на практике построение кучи медленнее, чем кажется в теории"
        correct: false
        explanation: "Реальная сложность эффективного алгоритма построения кучи значительно лучше квадратичной — O(n), а не O(n²)."
    explanation: "Это классический пример того, что «очевидная» оценка сложности бывает обманчивой (перекликается с общими нюансами Big O). Эффективный алгоритм build-heap начинает с последнего non-leaf узла и просеивает вниз (sift-down), двигаясь к корню — большинство узлов расположено ближе к листьям, где требуется минимум работы, что в сумме даёт O(n), а не O(n log n)."
    topics: [algorithms]
    extended_explanation: |
      Строгое доказательство линейности опирается на то, что число узлов
      на высоте h убывает экспоненциально при росте h, а стоимость
      просеивания растёт линейно с h — сумма такого ряда сходится к
      константе, умноженной на n, а не к n log n.
    recommendation: "Сравнить наивное построение кучи через n отдельных вызовов insert (O(n log n)) с эффективным build-heap (O(n)) на практике — разница особенно заметна на больших n."

  - id: q11
    text: "Классическая задача с собеседований: реализовать LRU-кэш с операциями get и put за O(1) каждая. Какая комбинация структур данных решает эту задачу?"
    type: single
    options:
      - id: a
        text: "Отсортированное по времени последнего обращения дерево поиска"
        correct: false
        explanation: "Дерево поиска даёт O(log n) на операции, а не требуемый O(1) — для этой задачи структура дерева избыточно медленная."
      - id: b
        text: "Только хеш-таблица — она сама по себе даёт O(1) на все операции LRU"
        correct: false
        explanation: "Хеш-таблица сама по себе не хранит порядок использования элементов — без дополнительной структуры невозможно за O(1) определить, какой элемент вытеснять при переполнении."
      - id: c
        text: "Хеш-таблица (ключ → указатель на узел списка) плюс двусвязный список (порядок использования)"
        correct: true
        explanation: "Хеш-таблица даёт O(1) поиск узла по ключу. Двусвязный список хранит порядок использования (голова — самый свежий, хвост — самый старый) и позволяет за O(1) переместить любой узел в голову при обращении или удалить узел с хвоста при переполнении — но только если список именно двусвязный, а не односвязный."
      - id: d
        text: "Односвязный список плюс хеш-таблица"
        correct: false
        explanation: "Односвязный список не подходит: чтобы удалить произвольный узел за O(1), нужен доступ к предыдущему узлу, а односвязный список даёт доступ только вперёд — для этого обязателен именно двусвязный список."
    explanation: "Стандартное решение LRU-кэша: хеш-таблица (ключ → указатель на узел списка) для быстрого поиска, плюс двусвязный список для отслеживания порядка использования. Двусвязность списка принципиальна — только она даёт доступ к предыдущему узлу, необходимый для удаления произвольного узла за O(1)."
    topics: [algorithms]
    extended_explanation: |
      Практическое применение LRU выходит за рамки учебной задачи:
      вариация этой политики используется в buffer pool PostgreSQL и
      MySQL для управления кэшированием страниц, в CPU-кэшах и в
      браузерных кэшах.
    recommendation: "Реализовать LRU-кэш руками хотя бы раз — распространённая практическая задача с собеседований именно на комбинацию структур данных, а не на алгоритмическую хитрость."

  - id: q12
    text: "Чем политика вытеснения LFU (Least Frequently Used) принципиально отличается от LRU (Least Recently Used)?"
    type: single
    options:
      - id: a
        text: "LFU вытесняет по порядку поступления в кэш, не учитывая обращения вообще"
        correct: false
        explanation: "Вытеснение строго по порядку поступления без учёта обращений — это описание политики FIFO, а не LFU, которая как раз ориентируется на частоту обращений."
      - id: b
        text: "LFU и LRU — это два разных названия одной и той же политики вытеснения"
        correct: false
        explanation: "Это разные политики с разными критериями выбора жертвы для вытеснения — они могут давать разный результат на одних и тех же данных."
      - id: c
        text: "LFU вытесняет элемент с наименьшей частотой обращений, LRU — элемент, к которому обращались давнее всего по времени"
        correct: true
        explanation: "LRU отслеживает время последнего обращения к элементу и вытесняет самый «старый» по этому критерию. LFU отслеживает количество обращений (частоту) и вытесняет элемент, к которому обращались реже всего, независимо от того, когда было последнее обращение."
      - id: d
        text: "LFU применяется только к строковым ключам, LRU — к числовым"
        correct: false
        explanation: "Тип ключа никак не связан с выбором политики вытеснения — обе политики одинаково применимы к любым типам ключей."
    explanation: "LRU и LFU — две разные политики вытеснения с разными критериями: LRU ориентируется на время последнего обращения (вытесняет самый давний), LFU — на частоту обращений в целом (вытесняет самый редко используемый, даже если обращались к нему не так давно, но всего пару раз)."
    topics: [algorithms]
    extended_explanation: |
      Есть и другие политики: FIFO вытесняет строго в порядке
      поступления, без учёта каких-либо обращений вообще; MRU (Most
      Recently Used) — редкая противоположность LRU, вытесняющая как
      раз самый недавно использованный элемент, что оправдано в
      специфичных сценариях доступа к данным.
    recommendation: "Держать в голове маркер различия: LRU про «когда в последний раз», LFU про «сколько раз всего» — путаница между ними частая на собеседованиях."

  - id: q13
    text: "Задача коммивояжёра (TSP) в её точной формулировке относится к NP-полным задачам. Что конкретно это означает практически?"
    type: single
    options:
      - id: a
        text: "Задача решается за O(n log n) с помощью правильной структуры данных"
        correct: false
        explanation: "Если бы существовало решение за O(n log n), это означало бы полиномиальный алгоритм для NP-полной задачи — согласно современному пониманию, такого алгоритма не найдено, и его существование стало бы революционным математическим результатом."
      - id: b
        text: "Задачу вообще невозможно решить ни для каких входных данных"
        correct: false
        explanation: "Задача решаема — для малых n её можно решить точно (полным перебором или методом ветвей и границ), а для больших n существуют эффективные приближённые эвристики, дающие решения, близкие к оптимальным."
      - id: c
        text: "Не существует известного точного полиномиального алгоритма для решения задачи"
        correct: true
        explanation: "NP-полнота TSP означает, что задача принадлежит к классу труднейших задач NP: известные точные алгоритмы требуют экспоненциального (или факториального при полном переборе) времени в худшем случае, и нахождение полиномиального точного решения автоматически решило бы фундаментальную проблему P vs NP для всего класса NP-полных задач."
      - id: d
        text: "NP-полнота означает, что задача решается быстрее на параллельных вычислениях, чем на последовательных"
        correct: false
        explanation: "NP-полнота — характеристика вычислительной сложности задачи в общем виде, она не связана напрямую с тем, насколько задача поддаётся распараллеливанию."
    explanation: "NP-полнота TSP — не приговор задаче как таковой, а утверждение о принципиальном отсутствии известного полиномиального точного решения. Для 20 городов полный перебор (n-1)!/2 вариантов даёт уже астрономическое число — но это не означает, что задачу «нельзя решить», просто точное решение для больших n практически недостижимо, и используются приближённые методы."
    topics: [algorithms]
    extended_explanation: |
      Точные методы для малых n: полный перебор, метод ветвей и границ,
      динамическое программирование Хелда-Карпа (O(n² × 2ⁿ) — лучше
      полного перебора, но всё ещё экспоненциально). На практике для
      больших n применяют приближённые эвристики: жадный алгоритм
      ближайшего соседа, локальную оптимизацию 2-opt, генетические
      алгоритмы.
    recommendation: "Не путать «NP-полная задача» с «нерешаемая задача» — NP-полнота означает лишь отсутствие известного эффективного ТОЧНОГО решения, приближённые решения существуют и активно используются на практике."

  - id: q14
    text: "Для задачи коммивояжёра эвристика «2-opt» — локальная оптимизация уже построенного маршрута. В чём заключается её основная идея?"
    type: single
    options:
      - id: a
        text: "Строить два независимых маршрута и выбирать более короткий из них"
        correct: false
        explanation: "2-opt работает с одним уже построенным маршрутом, улучшая его локальными изменениями, а не сравнивает несколько независимо построенных маршрутов между собой."
      - id: b
        text: "Случайным образом перемешивать порядок городов и выбирать лучший из нескольких вариантов"
        correct: false
        explanation: "Это скорее описывает случайный поиск или часть генетического алгоритма — 2-opt же — детерминированная локальная оптимизация конкретных пар рёбер, а не случайное перемешивание."
      - id: c
        text: "Убирать пересечения маршрута, меняя местами пары рёбер, если это сокращает суммарную длину"
        correct: true
        explanation: "2-opt рассматривает пары рёбер маршрута: если их «перестановка» (разворот участка пути между ними) устраняет визуальное пересечение линий на карте и сокращает суммарную длину, изменение принимается. Процесс повторяется, пока улучшения находятся."
      - id: d
        text: "Точно решать задачу для подмножеств из двух городов и комбинировать результаты"
        correct: false
        explanation: "2-opt не разбивает задачу на подзадачи меньшего размера для точного решения — это приближённая эвристика, работающая с рёбрами уже целого построенного маршрута."
    explanation: "2-opt — одна из простых и эффективных локальных эвристик для TSP: она ищет пары рёбер маршрута, чьё «пересечение» на карте можно устранить разворотом участка пути между ними, что обычно сокращает суммарную длину. Применяется как способ улучшить результат, уже полученный более простым методом (например, жадным алгоритмом ближайшего соседа)."
    topics: [algorithms]
    extended_explanation: |
      Важный практический нюанс: NP-полнота описывает худший случай для
      точного решения, но на практике для многих реальных данных
      комбинация простой жадной эвристики (ближайший сосед) плюс
      локальная оптимизация (2-opt) даёт решения, довольно близкие к
      оптимальным, за приемлемое время — это и используется в реальной
      логистике.
    recommendation: "Сравнить результат жадного алгоритма ближайшего соседа до и после применения 2-opt на одном и том же наборе точек — улучшение обычно заметно невооружённым глазом."

  - id: q15
