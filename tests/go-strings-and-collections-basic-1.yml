      ```go
      byCity := map[string][]User{}
      for _, u := range users {
          byCity[u.City] = append(byCity[u.City], u)
      }
      ```
    type: single
    options:
      - id: a
        text: "Нет: сначала нужно записать `byCity[u.City] = []User{}`, иначе будет паника"
        correct: false
        explanation: "Чтение отсутствующего ключа паники не вызывает, а `nil`-срез пригоден для `append`."
      - id: b
        text: "Нет: у `map` нет значений по умолчанию, как у `Hash.new { |h, k| h[k] = [] }`"
        correct: false
        explanation: "Значение по умолчанию заменяет нулевое значение типа, отдельной настройки не нужно."
      - id: c
        text: "Да: для отсутствующего ключа читается `nil`-срез, а `append` его создаёт"
        correct: true
        explanation: "Чтение даёт нулевое значение типа, то есть `nil`-срез, и `append` с ним работает."
      - id: d
        text: "Да, но все города будут делить один общий срез и перемешают пользователей"
        correct: false
        explanation: "Для каждого ключа `append` создаёт свой срез, и города данных между собой не делят."
    explanation: "Чтение из `map` по отсутствующему ключу возвращает нулевое значение типа: для среза это `nil`. Функция `append` с `nil`-срезом создаёт новый срез, а присваивание кладёт его в `map`. Поэтому группировка пишется в одну строку без проверки ключа. Проверено запуском: для городов A и B получилось `map[A:[{bob 30 A} {cat 30 A}] B:[{amy 25 B}]]`."
    extended_explanation: "Порядок обхода такой `map` случаен, поэтому для стабильного вывода ключи сортируют: `slices.Sorted(maps.Keys(byCity))` (Go 1.23+). В Ruby эту роль выполняет `group_by` или `Hash.new { |h, k| h[k] = [] }`. Если значения нужно изменять, храните `[]*User` или правьте по индексу."
