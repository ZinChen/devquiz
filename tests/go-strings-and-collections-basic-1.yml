  - id: q13
    text: |-
      Что вернёт вызов?

      ```go
      cities := []string{"A", "B", "A", "B"}
      uniq := slices.Compact(cities)
      ```
    type: single
    options:
      - id: a
        text: "`[A B A B]`: убираются только повторы подряд"
        correct: true
        explanation: "`Compact` схлопывает соседние одинаковые элементы, а в этом срезе их нет."
      - id: b
        text: "`[A B]`: убираются все повторяющиеся значения"
        correct: false
        explanation: "Для удаления всех повторов `Compact` не годится, он смотрит только на соседей."
      - id: c
        text: "`[A B A]`: убирается только последний элемент"
        correct: false
        explanation: "Лишь последний элемент функция не отбрасывает."
      - id: d
        text: "Ошибка компиляции: срез нужно сначала отсортировать"
        correct: false
        explanation: "Сортировка не требуется для компиляции, результат просто будет не тем, что ждёшь."
    explanation: "`slices.Compact` работает как `uniq` в `Unix`: убирает повторы только среди соседних элементов. В срезе [A B A B] одинаковых соседей нет, поэтому результат не изменился. Проверено запуском."
    extended_explanation: "Для уникальных значений срез сначала сортируют: `slices.Sort(cities)`; `cities = slices.Compact(cities)`. Либо собирают множество на `map[string]struct{}`, но тогда порядок ключей случаен. В Ruby `uniq` убирает все повторы в порядке первого появления."
    recommendation: "Функции slices.Compact и slices.Sort: удаление дублей и их предусловия."
    difficulty: medium
    topics: [go]

