slug: web-security-advanced-1
title: "Web-безопасность: от HTTP до OWASP Top 10"
description: "Практический тест по веб-безопасности: заголовки и флаги кук, криптографические примитивы, аутентификация и авторизация, OWASP Top 10 (названия категорий по редакции 2021 года) и архитектурные риски лимитов, секретов и WebSocket."
tags: [security, web, owasp]
difficulty: advanced
estimated_time: 30

questions:
  - id: q1
    text: "Сессионная кука выставлена с флагами `Secure`, `HttpOnly` и `SameSite=Strict`. Какой флаг от какой угрозы защищает?"
    type: single
    options:
      - id: a
        text: "`Secure` — от чтения из JS при XSS, `HttpOnly` — от перехвата по HTTP, `SameSite` — от отправки со стороннего сайта"
        correct: false
        explanation: "Первые два флага здесь поменяны местами: от чтения из JS защищает HttpOnly, а от передачи по HTTP — Secure."
      - id: b
        text: "`Secure` шифрует значение куки, а `HttpOnly` и `SameSite` защищают её от XSS"
        correct: false
        explanation: "Secure значение не шифрует: он лишь запрещает отправку куки по HTTP. SameSite защищает от межсайтовых запросов и к XSS отношения не имеет."
      - id: c
        text: "`Secure` — от перехвата по HTTP, `HttpOnly` — от чтения из JS, `SameSite` — от межсайтовой отправки"
        correct: true
        explanation: "Каждый флаг закрывает свой канал: Secure не даёт браузеру отправить куку по незашифрованному каналу, HttpOnly прячет её от document.cookie, SameSite не даёт приложить её к запросу, который инициировал другой сайт."
      - id: d
        text: "Все три флага защищают от XSS и дублируют друг друга на случай ошибки в одном из них"
        correct: false
        explanation: "Флаги не пересекаются: у каждого своя задача. От XSS защищает лишь HttpOnly, и то только от кражи значения куки: сама инъекция остаётся возможной."
    explanation: "Три флага закрывают три разных угрозы: Secure — MiTM-перехват на транспортном уровне, HttpOnly — кражу значения куки через XSS (document.cookie её не увидит), SameSite — CSRF, когда сторонний сайт заставляет браузер отправить запрос вместе с сессионной кукой."
    extended_explanation: "SameSite имеет три режима: Strict (кука не уходит ни при каком переходе со стороннего сайта), Lax (уходит при переходе по ссылке с GET, но не при подгрузке через img или iframe) и None (уходит всегда, но требует Secure). Lax — значение по умолчанию в современных браузерах. Проверить флаги своего приложения можно в заголовке Set-Cookie ответа."
    recommendation: "Атрибуты cookie (`Secure`, `HttpOnly`, `SameSite`) и угрозы, от которых каждый из них защищает."
    difficulty: medium
    topics: [security]

  - id: q2
    text: "Пароли пользователей нужно хранить в базе данных. Какую из операций для этого применять: кодирование, шифрование или хэширование?"
    type: single
    options:
      - id: a
        text: "Хэширование: оно необратимо, и по хэшу исходный пароль не восстановить"
        correct: true
        explanation: "При входе сервер хэширует введённый пароль и сравнивает с сохранённым, обратное преобразование не нужно. Атакующему после утечки остаётся только подбор."
      - id: b
        text: "Кодирование, например base64: достаточно преобразовать пароль в другой формат"
        correct: false
        explanation: "Кодирование обратимо без всякого ключа. Base64 декодируется мгновенно любым инструментом."
      - id: c
        text: "Шифрование: пароль придётся расшифровывать, чтобы сверить с введённым"
        correct: false
        explanation: "Расшифровывать для проверки пароля не нужно. А обратимо зашифрованные пароли дают лишний риск: утечка ключа раскрывает их все сразу."
      - id: d
        text: "Шифрование и хэширование равнозначны, если ключ шифрования хранить отдельно от базы"
        correct: false
        explanation: "Отдельный ключ риск снижает, но не убирает: при компрометации ключа все пароли расшифровываются. Для хэша такого сценария нет."
    explanation: "Хэширование — единственная из трёх операций, которая не позволяет восстановить исходные данные. Проверка пароля при входе не требует расшифровки: сервер хэширует введённый пароль тем же алгоритмом и сравнивает результат с сохранённым."
    extended_explanation: "Для паролей берут не голый быстрый хэш вроде SHA-256, а намеренно медленные алгоритмы bcrypt, scrypt или Argon2 с солью: массовый перебор по радужным таблицам или брутфорсом дорожает на порядки. Стоит убедиться, что в проекте пароли хранятся именно так, а не через кодирование или обратимое шифрование."
    recommendation: "Хранение паролей: хэширование с солью, bcrypt, scrypt и Argon2, и чем оно отличается от кодирования и шифрования."
    difficulty: easy
    topics: [security]

  - id: q3
    text: "Пользователь A меняет в адресе `/orders/1042` число на `1043` и видит заказ пользователя B. К какому классу проблем это относится?"
    type: single
    options:
      - id: a
        text: "Вертикальное повышение привилегий: пользователь A получил права администратора"
        correct: false
        explanation: "Вертикальное повышение даёт более высокую роль. Здесь оба пользователя остаются на одном уровне."
      - id: b
        text: "Session fixation: пользователь A подставил себе чужой идентификатор сессии"
        correct: false
        explanation: "Сессия A не менялась: он остался под своим идентификатором и лишь запросил чужой ресурс."
      - id: c
        text: "Mass assignment: пользователь A передал лишние поля при обновлении записи"
        correct: false
        explanation: "Mass assignment связан с лишними полями в теле запроса, а здесь меняется идентификатор в адресе."
      - id: d
        text: "Горизонтальное повышение привилегий: доступ к данным другого пользователя того же уровня"
        correct: true
        explanation: "Роль пользователя A не меняется, он просто достаёт чужой ресурс. Сервер проверил лишь, что запрос аутентифицирован, а принадлежность заказа не проверил. Это разновидность Broken Access Control (IDOR)."
    explanation: "Горизонтальное повышение привилегий — доступ к ресурсам другого пользователя с тем же уровнем доступа. Причина обычно одна: сервер проверяет только то, что пользователь залогинен, но не то, что запрашиваемый ресурс принадлежит ему."
    extended_explanation: "Защита строится по-разному. Горизонтальное повышение закрывает проверка владения («заказ 1043 принадлежит B, отказать»), вертикальное — проверка роли («действие доступно только admin»). Стоит пройти по эндпоинтам с идентификатором ресурса в адресе и убедиться, что владение проверяется явно, а не подразумевается."
    recommendation: "Broken Access Control: IDOR, горизонтальное и вертикальное повышение привилегий и способы проверки владения ресурсом."
    difficulty: easy
    topics: [security]

  - id: q4
    text: |-
      Сервер на любой запрос отвечает так, подставляя в первый заголовок значение `Origin` из запроса:

      ```
      Access-Control-Allow-Origin: <Origin из запроса>
      Access-Control-Allow-Credentials: true
      ```

      Что в этой конфигурации опасно?
    type: single
    options:
      - id: a
        text: "Браузер откажет в таких запросах, потому что с credentials разрешён только wildcard `*`"
        correct: false
        explanation: "Всё наоборот: wildcard с credentials браузер как раз запрещает. Поэтому сервер подставляет конкретный Origin, и защита обходится формально."
      - id: b
        text: "Любой сайт сможет сделать запрос с куками жертвы и прочитать ответ"
        correct: true
        explanation: "Браузер доверяет заголовкам сервера: раз сервер разрешил этому Origin запросы с credentials, скрипт чужого сайта получает доступ к ответу. Same-origin policy фактически отключена."
      - id: c
        text: "Уязвимы только запросы с preflight (PUT, DELETE), простые GET остаются защищены"
        correct: false
        explanation: "Подмена Origin действует на любые методы. Простые GET с куками читаются так же свободно."
      - id: d
        text: "Опасность в том, что утечёт сам заголовок Origin, а данные пользователя не пострадают"
        correct: false
        explanation: "Origin сайта и так известен браузеру. Опасно то, что чужой скрипт получает доступ к ответу, содержащему данные пользователя."
    explanation: "CORS ослабляет same-origin policy по явному разрешению сервера. Отражение любого Origin вместе с Allow-Credentials: true разрешает любому сайту отправлять запросы с куками залогиненного пользователя и читать ответы, то есть действовать от его имени."
    extended_explanation: "Спецификация запрещает сочетать wildcard `*` с Allow-Credentials: true, и браузер такой ответ отклоняет. Сервер, который вручную копирует Origin из запроса, это ограничение обходит и остаётся столь же уязвимым. Правильно сверять Origin со списком доверенных доменов, а не отражать его."
    recommendation: "CORS и same-origin policy: как работают Allow-Origin и Allow-Credentials и почему нельзя отражать произвольный Origin."
    difficulty: hard
    topics: [security]

  - id: q5
    text: |-
      Поиск пользователя по email реализован так:

      ```ruby
      User.where("email = '#{params[:email]}'")
      ```

      Как исправить код?
    type: single
    options:
      - id: a
        text: "Удалять из значения символ `'` через `gsub(\"'\", \"\")` перед подстановкой"
        correct: false
        explanation: "Ручная фильтрация символов ненадёжна: есть обходы через другие кодировки и конструкции, а новые пути для атаки появляются вместе с изменением запроса."
      - id: b
        text: "Ограничить длину значения 50 символами перед запросом"
        correct: false
        explanation: "Короткого значения хватит для классической инъекции вроде `' OR '1'='1`."
      - id: c
        text: "Заменить `where` на `find_by_sql` с той же строкой"
        correct: false
        explanation: "find_by_sql принимает ту же строку SQL, и подстановка значения в неё остаётся инъекцией."
      - id: d
        text: "Передавать значение параметром: `User.where(email: params[:email])`"
        correct: true
        explanation: "Значение уходит в базу как параметр и никогда не интерпретируется как часть SQL. Тот же эффект дают плейсхолдеры: `where(\"email = ?\", params[:email])`."
    explanation: "Инъекция возникает, когда пользовательское значение попадает в текст SQL. Параметризованные запросы разделяют код и данные: база получает запрос и значения отдельно и значение никогда не трактует как SQL."
    extended_explanation: "В ActiveRecord безопасны хэш-условия (`where(email: ...)`) и плейсхолдеры (`where(\"email = ?\", value)`). Опасны интерполяция строки в `where`, `order`, `pluck` и `find_by_sql`. Проверить проект поможет статический анализатор Brakeman."
    recommendation: "SQL-инъекции и параметризованные запросы: безопасные и опасные способы построения условий в ActiveRecord."
    difficulty: medium
    topics: [security]

  - id: q6
    text: "Сервис выбирает между серверными сессиями и JWT. Что верно про отзыв доступа?"
    type: single
    options:
      - id: a
        text: "Оба варианта отзываются одинаково: у JWT достаточно удалить токен на стороне клиента"
        correct: false
        explanation: "Удаление на клиенте защищает только от обычного пользователя. Скопированный токен продолжит приниматься сервером."
      - id: b
        text: "Сессию отзывают удалением записи на сервере, а JWT живёт до `exp`"
        correct: true
        explanation: "Сессия проверяется сверкой с состоянием на сервере, а JWT проверяется криптографически без обращения к хранилищу. Поэтому выданный токен остаётся валидным до истечения срока."
      - id: c
        text: "JWT отзывается проще: достаточно сменить подпись на сервере для одного пользователя"
        correct: false
        explanation: "Ключ подписи общий для всех токенов. Его смена разлогинит всех пользователей сразу."
      - id: d
        text: "Сессию отозвать сложнее, потому что её состояние хранится в куке на стороне клиента"
        correct: false
        explanation: "В куке лежит только идентификатор сессии. Само состояние хранится на сервере, и удаление записи сразу лишает куку силы."
    explanation: "Сессия — ссылка на запись на сервере, поэтому удаление записи мгновенно инвалидирует куку. JWT самодостаточен и проверяется без обращения к хранилищу, поэтому досрочно отозвать его можно, только добавив отдельный механизм: чёрный список, версию токена или короткий TTL."
    extended_explanation: "Типичный компромисс: короткоживущий access-токен (минуты) плюс долгоживущий refresh-токен, который хранится на сервере как сессия. Отзыв refresh-токена не отменяет выданный access-токен сразу, но ограничивает окно его продления."
    recommendation: "Сессии и JWT: где хранится состояние, как отзывается доступ, паттерн access и refresh-токенов."
    difficulty: medium
    topics: [security, architecture]

  - id: q7
    text: "Метод TRACE возвращает в теле ответа копию полученного запроса вместе с заголовками. Почему его отключают на продакшн-серверах?"
    type: single
    options:
      - id: a
        text: "TRACE позволяет склеить два запроса в одном соединении и обойти проверки прокси (request smuggling)"
        correct: false
        explanation: "Request smuggling строится на расхождении интерпретации длины тела запроса между прокси и сервером. TRACE к этому отношения не имеет."
      - id: b
        text: "TRACE записывает ответ в общий кэш прокси, и вредоносное содержимое получают другие пользователи"
        correct: false
        explanation: "Ответы на TRACE по спецификации не кэшируются. Риск в том, что отражённые заголовки читает чужой скрипт."
      - id: c
        text: "Через XSS отправляют TRACE и читают `Cookie` из ответа, обходя `HttpOnly`"
        correct: true
        explanation: "Скрипт не может прочитать HttpOnly-куку через document.cookie, но сервер вернёт её в теле ответа на TRACE, и скрипт спокойно прочитает ответ."
      - id: d
        text: "TRACE заставляет сервер обращаться к внутренним адресам, указанным атакующим (SSRF)"
        correct: false
        explanation: "Так работает SSRF через параметры запроса. TRACE лишь отражает заголовки самого запроса."
    explanation: "Cross-Site Tracing — способ обойти защиту HttpOnly. Сама XSS не может прочитать такую куку через document.cookie, но может инициировать TRACE-запрос, и сервер вернёт заголовки запроса, включая Cookie, в теле ответа, которое скрипт уже читает свободно."
    extended_explanation: "Современные браузеры блокируют TRACE в XMLHttpRequest и fetch именно из-за этой атаки, но отключать метод на сервере или reverse-прокси всё равно стоит: клиент может быть старым или нестандартным. Практически это проверяется одним curl-запросом с методом TRACE к боевому домену."
    recommendation: "HTTP-методы, которые нужно отключать (TRACE, CONNECT), и атака Cross-Site Tracing как обход HttpOnly."
    difficulty: hard
    topics: [security]

  - id: q8
    text: "Для проверки целостности скачиваемых файлов нужно выбрать хэш-функцию: MD5 или SHA-256. Почему с точки зрения безопасности предпочтительнее SHA-256?"
    type: single
    options:
      - id: a
        text: "Для MD5 можно подобрать коллизию: два разных файла с одним хэшем"
        correct: true
        explanation: "MD5 криптографически сломан по устойчивости к коллизиям. Если отпечаток должен защищать от злонамеренной подмены, он этой цели не выполняет."
      - id: b
        text: "SHA-256 шифрует файл, а MD5 лишь кодирует его, поэтому MD5 прочесть проще"
        correct: false
        explanation: "Обе функции хэшируют: файл не шифруется и из хэша не восстанавливается. Разница лишь в стойкости к коллизиям."
      - id: c
        text: "MD5 не умеет обрабатывать файлы больше 4 ГБ, из-за чего хэш получается неверным"
        correct: false
        explanation: "MD5 работает с данными любого размера, потому что обрабатывает их блоками. Размер файла тут ни при чём."
      - id: d
        text: "Для MD5 известны быстрые способы восстановить содержимое файла по его хэшу"
        correct: false
        explanation: "Прообраз по хэшу MD5 восстановить по-прежнему нельзя. Практически найдены лишь коллизии."
    explanation: "MD5 и SHA-1 не годятся там, где хэш защищает от целенаправленной подмены, потому что для них найдены практические способы строить коллизии. Для контрольных сумм без угрозы злоумышленника они ещё встречаются, но для скачиваемых файлов атакующий может подготовить вредоносный файл с тем же отпечатком."
    extended_explanation: "SHA-1 сломан позже MD5 по той же причине: в 2017 году показали практическую коллизию (атака SHAttered), после чего центры сертификации и системы контроля версий стали уходить от него к SHA-2 и SHA-3. Стоит найти в проекте места, где MD5 или SHA-1 защищают подпись или отпечаток сертификата."
    recommendation: "Криптографические хэши: свойства (необратимость, стойкость к коллизиям) и почему MD5 и SHA-1 считаются устаревшими."
    difficulty: medium
    topics: [security]

  - id: q9
    text: |-
      Парсер обрабатывает загруженный XML и не отключает внешние сущности:

      ```xml
      <!DOCTYPE order [
        <!ENTITY xxe SYSTEM "file:///etc/passwd">
      ]>
      <order><note>&xxe;</note></order>
      ```

      Что произойдёт при разборе?
    type: single
    options:
      - id: a
        text: "Парсер подставит содержимое `/etc/passwd` в элемент `note`, и оно может попасть в ответ приложения"
        correct: true
        explanation: "Это XXE: DTD объявляет сущность, значением которой служит содержимое файла, и парсер разворачивает ссылку `&xxe;` как обычный текст."
      - id: b
        text: "Парсер запустит `/etc/passwd` как программу, и атакующий получит выполнение кода"
        correct: false
        explanation: "Парсер читает файл как текст и ничего не запускает. Выполнение кода — отдельный класс проблем."
      - id: c
        text: "Парсер вернёт ошибку: блок `DOCTYPE` допустим только в HTML, а в XML не поддерживается"
        correct: false
        explanation: "DOCTYPE — часть стандарта XML, и объявление сущностей через него штатно работает."
      - id: d
        text: "Ссылка `&xxe;` останется в тексте как есть, потому что файловые сущности по умолчанию игнорируются"
        correct: false
        explanation: "В условии парсер не отключал внешние сущности, поэтому ссылка будет разрешена. Некоторые современные библиотеки по умолчанию их отключают, но здесь это не так."
    explanation: "XXE (XML External Entities) эксплуатирует возможность DTD объявлять внешние сущности. Если парсер их разрешает, содержимое локального файла или ответ внутреннего URL попадает прямо в разобранный документ и может вернуться атакующему."
    extended_explanation: "Форматы поверх XML (SVG, DOCX, SOAP) наследуют ту же проблему, если их разбирает уязвимый XML-движок. Защита — отключить DTD и внешние сущности в настройках парсера (например, `resolve_entities: false` и `no_network: true` в Nokogiri)."
    recommendation: "XXE: внешние сущности и DTD в XML, форматы-наследники и настройки парсеров для защиты."
    difficulty: hard
    topics: [security]

  - id: q10
    text: "У страницы нет ни директивы `frame-ancestors` в CSP, ни заголовка `X-Frame-Options`. Какая атака становится возможной?"
    type: single
    options:
      - id: a
        text: "CSRF: сторонний сайт отправляет запрос на сервер от имени пользователя"
        correct: false
        explanation: "CSRF строится на автоматической отправке куки с межсайтовым запросом. От него защищает SameSite или CSRF-токен."
      - id: b
        text: "Clickjacking: страницу прячут в iframe и заставляют кликнуть по ней"
        correct: true
        explanation: "Без ограничения на встраивание атакующий накладывает прозрачный iframe с вашей страницей поверх заманчивой кнопки. Пользователь думает, что кликает по ней, а жмёт скрытую кнопку на вашей странице."
      - id: c
        text: "Reflected XSS: скрипт из параметра адреса выполняется на странице"
        correct: false
        explanation: "Reflected XSS возникает из-за неэкранированного вывода параметров. Ограничение встраивания в iframe на него не влияет."
      - id: d
        text: "MIME sniffing: браузер угадывает тип ответа и исполняет файл как скрипт"
        correct: false
        explanation: "От этого защищает заголовок `X-Content-Type-Options: nosniff`."
    explanation: "frame-ancestors в CSP, как и устаревающий X-Frame-Options, задаёт, каким доменам разрешено встраивать страницу в iframe. Без этого любой сайт может встроить её, сделать прозрачной и перекрыть своим интерфейсом."
    extended_explanation: "X-Frame-Options поддерживает лишь DENY и SAMEORIGIN, а frame-ancestors позволяет перечислить конкретные доверенные домены, поэтому для новых проектов рекомендуется он. Минимальная защита — добавить любой из двух заголовков, и сделать это стоит на всех страницах с действиями."
    recommendation: "Clickjacking и защита от встраивания страниц: `frame-ancestors` в CSP и `X-Frame-Options`."
    difficulty: medium
    topics: [security]

  - id: q11
    text: "После входа через Google пользователь возвращается на сайт с одноразовым кодом авторизации. Что делает сервер сайта дальше?"
    type: single
    options:
      - id: a
        text: "Считает код подтверждением входа и создаёт сессию без обращения к провайдеру"
        correct: false
        explanation: "Код может подделать или перехватить кто угодно, поэтому без обмена у провайдера он ничего не доказывает."
      - id: b
        text: "Проверяет подпись кода публичным ключом провайдера и по ней создаёт сессию"
        correct: false
        explanation: "Код непрозрачен и не несёт подписанных данных о пользователе. Подписан ID-токен, который сервер получает уже после обмена."
      - id: c
        text: "Отправляет код обратно в браузер, чтобы тот сам запросил данные у провайдера"
        correct: false
        explanation: "Тогда подтверждённые данные получил бы браузер, а ему сервер доверять не может. Обмен должен идти серверным каналом."
      - id: d
        text: "Обменивает код у провайдера напрямую, сервер к серверу, на токены с данными о пользователе"
        correct: true
        explanation: "Обмен выполняется по защищённому серверному каналу, и подделать результат из браузера нельзя. Поэтому код не содержит данных о пользователе и работает как временный пропуск."
    explanation: "В Authorization Code Flow пользователь входит у провайдера, провайдер отдаёт браузеру одноразовый короткоживущий код, а сервер сайта обменивает его на токены по бэкенд-каналу, предъявляя собственные учётные данные приложения. Пароль пользователя сайту не передаётся никогда."
    extended_explanation: "Код должен быть одноразовым и короткоживущим: иначе перехвативший его атакующий выдал бы себя за пользователя. Сравнить поток стоит с устаревшим Implicit Flow, где токен приходил прямо в браузер и из-за этого чаще утекал."
    recommendation: "OpenID Connect и OAuth 2.0: поток Authorization Code, обмен кода на токены и отличие от Implicit Flow."
    difficulty: medium
    topics: [security]

  - id: q12
    text: "Токен авторизации в адресе «защитили» кодированием в base64. Почему это не мера безопасности?"
    type: single
    options:
      - id: a
        text: "Закодированный токен нельзя прочитать, не зная алгоритма кодирования"
        correct: false
        explanation: "Алгоритм base64 общеизвестен и стандартизован. Секретом он быть не может."
      - id: b
        text: "Base64 безопасен, если токен передаётся по HTTPS"
        correct: false
        explanation: "HTTPS защищает канал от перехвата, но тот, кто увидел токен в логах, истории или Referer, декодирует его так же легко."
      - id: c
        text: "Base64 — это кодирование, любой декодирует его без ключа"
        correct: true
        explanation: "Base64 нужен для представления бинарных данных в тексте, и декодируется он мгновенно любым инструментом."
      - id: d
        text: "Base64 шифрует токен коротким ключом, который легко подобрать перебором"
        correct: false
        explanation: "У base64 нет ключа, это детерминированное кодирование."
    explanation: "Base64 переводит произвольные байты в текст из ограниченного алфавита для совместимости, а не для защиты. Любой, кто видит строку, декодирует её обратно без всякого секрета."
    extended_explanation: "Та же путаница возникает с JWT: нечитаемая на глаз строка выглядит «зашифрованной», но её payload декодируется без ключа. Конфиденциальность содержимого JWT обеспечивает только отдельный механизм JWE. Стоит поискать в системе места, где base64 принимают за защиту."
    recommendation: "Кодирование, шифрование и хэширование: чем отличаются и почему base64 не обеспечивает защиты."
    difficulty: easy
    topics: [security]

  - id: q13
    text: "Приложение отдаёт в ответе API подробный stack trace при необработанной ошибке на продакшене. К какой категории OWASP Top 10 (редакция 2021) это относится?"
    type: single
    options:
      - id: a
        text: "Cryptographic Failures (ранее Sensitive Data Exposure): данные передаются без должной защиты"
        correct: false
        explanation: "Эта категория про слабое или отсутствующее шифрование данных. В трейсе нет проблемы с криптографией."
      - id: b
        text: "Security Misconfiguration: подробные сообщения об ошибках раскрывают детали реализации"
        correct: true
        explanation: "Пути на сервере, версии библиотек и структура кода облегчают атакующему поиск конкретных известных уязвимостей. Это типичный пример небезопасной настройки."
      - id: c
        text: "Broken Access Control: пользователь получает чужие данные через текст ошибки"
        correct: false
        explanation: "Чужие пользовательские данные в трейсе не обязательно есть. Утекает внутренняя информация о системе."
      - id: d
        text: "Injection: ошибка вызвана вредоносным вводом, который попал в запрос"
        correct: false
        explanation: "Причиной ошибки может быть что угодно. Проблема именно в том, что её подробности показывают пользователю."
    explanation: "Security Misconfiguration охватывает небезопасные настройки: учётные данные по умолчанию, открытые отладочные интерфейсы, лишние заголовки и подробные сообщения об ошибках. Версии компонентов подсказывают атакующему, какие CVE пробовать, а пути раскрывают структуру проекта."
    extended_explanation: "Правильная практика: пользователю показывают общее сообщение с идентификатором инцидента, а полный трейс логируется только на сервере. В редакции 2017 такие утечки часто относили к Sensitive Data Exposure, поэтому в старых материалах встречается именно это название."
    recommendation: "OWASP Top 10 (2021): Security Misconfiguration и обработка ошибок в продакшене."
    difficulty: easy
    topics: [security]

  - id: q14
    text: "Лимитер настроен как token bucket: корзина на 100 токенов, пополнение 10 токенов в секунду. Чем он отличается от fixed window с лимитом 600 запросов в минуту при той же средней пропускной способности?"
    type: single
    options:
      - id: a
        text: "Fixed window всегда точнее token bucket и предпочтителен там, где важна защита от нагрузки"
        correct: false
        explanation: "Fixed window проще, но как раз он пропускает двойной всплеск. Поэтому «всегда точнее» неверно."
      - id: b
        text: "Token bucket вообще не допускает всплесков запросов, а fixed window их разрешает"
        correct: false
        explanation: "Token bucket допускает всплеск до ёмкости корзины, это его осознанное свойство."
      - id: c
        text: "Token bucket требует хранить историю всех запросов клиента, а fixed window хранит один счётчик"
        correct: false
        explanation: "Корзине достаточно двух чисел: числа токенов и времени последнего пополнения. Историю запросов хранит sliding window log."
      - id: d
        text: "Fixed window уязвим к двойному всплеску на границе окон, token bucket — нет"
        correct: true
        explanation: "В fixed window клиент может отправить 600 запросов в последнюю секунду одной минуты и ещё 600 в первую секунду следующей. Корзина такой всплеск ограничивает: больше 100 запросов подряд не выйдет."
    explanation: "Fixed window считает запросы в жёстких интервалах: счётчик обнуляется на границе, и клиент может исчерпать лимит в конце одного окна и сразу снова в начале следующего. Token bucket пополняется непрерывно, и максимальный всплеск строго ограничен ёмкостью корзины в любой момент."
    extended_explanation: "Проблему границ fixed window без сложности token bucket решают sliding window log и sliding window counter, взвешивающие запросы предыдущего окна по доле перекрытия. Поведение трёх алгоритмов полезно сравнить на графике запросов, сгруппированных у границы интервала."
    recommendation: "Алгоритмы rate limiting: fixed window, sliding window и token bucket, их всплески и стоимость."
    difficulty: hard
    topics: [security, api-design]

  - id: q15
    text: "Сервер подписывает сообщение через HMAC: вычисляет `HMAC(ключ, сообщение)` и прикладывает результат. Что произойдёт, если секретный ключ утечёт?"
    type: single
    options:
      - id: a
        text: "Атакующий сможет подписать любое сообщение, и сервер примет его как подлинное"
        correct: true
        explanation: "Подлинность HMAC держится на том, что без ключа нельзя вычислить правильную подпись. Знающий ключ подписывает что угодно неотличимо от легитимного отправителя."
      - id: b
        text: "Атакующий сможет расшифровать все ранее подписанные сообщения"
        correct: false
        explanation: "HMAC ничего не шифрует: сообщения передаются открытым текстом, а подпись лишь подтверждает целостность и подлинность."
      - id: c
        text: "Старые подписи станут недействительными, а новые подделать всё равно нельзя"
        correct: false
        explanation: "Подпись проверяется тем же ключом, поэтому с утёкшим ключом можно подделать и новые подписи."
      - id: d
        text: "Ничего: хэш необратим, и по нему ключ нельзя использовать для подделки"
        correct: false
        explanation: "Необратимость хэша защищает от восстановления ключа по подписи, но не от прямой утечки ключа. Знающий ключ просто вычислит подпись."
    explanation: "HMAC проверяет целостность и подлинность сообщения общим секретным ключом, шифрованием он не является. Безопасность держится на предположении, что без ключа правильный код вычислить невозможно, а при утечке ключа (слитая переменная окружения, значение в клиентском коде) подделка становится тривиальной."
    extended_explanation: "Поэтому симметричная подпись JWT (HS256) рискованна, если проверяющих сторон несколько: каждая знает тот же ключ, и компрометация любой компрометирует всю систему. В таких случаях берут асимметричную подпись (RS256), где закрытый ключ только у эмитента, а проверяющим достаточно публичного."
    recommendation: "HMAC и подписи сообщений: симметричные и асимметричные подписи (HS256 против RS256) и управление ключами."
    difficulty: medium
    topics: [security]

  - id: q16
    text: "Пользовательские комментарии выводятся на странице. Какой способ надёжно защищает от хранимого XSS?"
    type: single
    options:
      - id: a
        text: "Удалять теги `<script>` и слово `javascript:` из текста при сохранении комментария"
        correct: false
        explanation: "Фильтрация по чёрному списку обходится: JS можно запустить через атрибут `onerror`, `javascript:` в ссылке и десятки других конструкций."
      - id: b
        text: "Хранить комментарии в base64 и декодировать только при выводе на страницу"
        correct: false
        explanation: "После декодирования на странице окажется тот же текст, и скрипт исполнится, как и раньше."
      - id: c
        text: "Экранировать данные при выводе с учётом контекста: HTML, атрибута, JS или URL"
        correct: true
        explanation: "Опасно не сохранение, а вывод: один и тот же текст безопасен в одном контексте и исполняется в другом. Шаблонизаторы вроде ERB экранируют HTML по умолчанию."
      - id: d
        text: "Проверять заголовок Referer и отклонять запросы с чужих сайтов"
        correct: false
        explanation: "Referer ничего не говорит о содержимом комментария. Хранимый XSS приходит с обычного запроса авторизованного пользователя."
    explanation: "Хранимый XSS возникает, когда данные пользователя попадают на страницу без экранирования. Защита — контекстное кодирование при выводе: тогда символы вроде `<` и `\"` превращаются в безопасные сущности и браузер показывает их, а не исполняет."
    extended_explanation: "Дополнительный слой — Content-Security-Policy, которая ограничивает источники скриптов и запрещает inline-код. В Rails риск возникает при `html_safe`, `raw` и `<%==`: их стоит искать в проекте при ревью."
    recommendation: "XSS и защита от неё: контекстное экранирование вывода, Content-Security-Policy и опасные места в шаблонах."
    difficulty: easy
    topics: [security]

  - id: q17
    text: "Редактировать документ может сотрудник того отдела, которому документ принадлежит, и только в рабочее время (с 9:00 до 18:00). Какая модель контроля доступа описывает такое правило?"
    type: single
    options:
      - id: a
        text: "RBAC: достаточно завести роль для каждого отдела"
        correct: false
        explanation: "Роль отдела выразит принадлежность, но не условие по времени и не сверку отдела документа. Ролей пришлось бы плодить без конца."
      - id: b
        text: "ACL: для каждого документа хранится список разрешённых сотрудников"
        correct: false
        explanation: "ACL статичен и привязан к конкретному ресурсу. Вычислять условия вроде времени он не умеет."
      - id: c
        text: "MAC: доступ определяется метками секретности пользователя и ресурса"
        correct: false
        explanation: "MAC сравнивает уровни допуска (например, «секретно»), атрибуты вроде отдела и времени ему не нужны."
      - id: d
        text: "ABAC: решение принимается по атрибутам пользователя, ресурса и контекста"
        correct: true
        explanation: "Правило сравнивает отдел пользователя с отделом документа и проверяет время. Это условия по атрибутам, заранее выданная роль или список здесь ни при чём."
    explanation: "ABAC (Attribute-Based Access Control) принимает решение по набору атрибутов субъекта, ресурса и среды: отдел, владелец, время, устройство. Он гибче RBAC, где доступ определяется заранее назначенной ролью."
    extended_explanation: "На практике RBAC и ABAC часто сочетают: роль задаёт базовый набор прав, а атрибуты уточняют условия. Ту же идею развивает RAdAC, который добавляет оценку риска (необычная геолокация, новое устройство) и при высоком риске запрашивает второй фактор."
    recommendation: "Модели авторизации: RBAC, ABAC, ACL и MAC, и чем они различаются по выразительности."
    difficulty: medium
    topics: [security]

  - id: q18
    text: "Один сервис сериализует объект приложения в файл, другой десериализует его при импорте, доверяя содержимому без проверки. Какая категория OWASP Top 10 (редакция 2021) здесь главная?"
    type: single
    options:
      - id: a
        text: "Identification and Authentication Failures: в файле лежат слабо защищённые учётные данные"
        correct: false
        explanation: "Проблема не в способе проверки пользователей, а в доверии к восстанавливаемым данным."
      - id: b
        text: "Security Misconfiguration: сервисы неверно настроены на доступ друг к другу"
        correct: false
        explanation: "Сетевая настройка не описывает риск подмены сериализованного состояния. Опасность в самом механизме десериализации."
      - id: c
        text: "Software and Data Integrity Failures: небезопасная десериализация непроверенных данных"
        correct: true
        explanation: "Если формат кодирует тип объекта или вызовы методов, подмена файла приводит к выполнению произвольной логики. В редакции 2017 эта категория называлась Insecure Deserialization."
      - id: d
        text: "Cryptographic Failures: файл с состоянием хранится без шифрования"
        correct: false
        explanation: "Отсутствие шифрования раскрыло бы данные, но не дало бы атакующему выполнить свой код при загрузке."
    explanation: "Опасность выше, чем простая подмена полей: многие форматы позволяют закодировать тип объекта, а библиотеки при восстановлении вызывают конструкторы и методы. Атакующий, подменивший данные, получает выполнение непредусмотренной логики на принимающей стороне."
    extended_explanation: "Защита: не использовать нативную сериализацию языка для обмена между сервисами (Marshal в Ruby, pickle в Python), а брать строго типизированные форматы вроде Protobuf или JSON с валидацией схемы. Стоит проверить, нет ли в межсервисном обмене Marshal.load или pickle.loads над внешними данными."
    recommendation: "Небезопасная десериализация и целостность данных (OWASP A08:2021): типизированные форматы и валидация входа."
    difficulty: medium
    topics: [security]

  - id: q19
    text: "API возвращает access-токен в теле ответа на `POST /login`. Какой заголовок ответа запретит клиентам и прокси сохранять такой ответ в кэше?"
    type: single
    options:
      - id: a
        text: "`Cache-Control: no-cache`"
        correct: false
        explanation: "no-cache разрешает сохранять ответ, но требует перепроверять его у сервера перед использованием. Сохранённый токен всё равно останется в кэше."
      - id: b
        text: "`Cache-Control: no-store`"
        correct: true
        explanation: "no-store запрещает сохранять и запрос, и ответ в любом кэше, ни на диске, ни в памяти. Для ответа с токеном нужна именно такая гарантия."
      - id: c
        text: "`Cache-Control: private`"
        correct: false
        explanation: "private запрещает общие кэши (прокси, CDN), но разрешает кэшировать ответ в браузере пользователя."
      - id: d
        text: "`Expires: 0`"
        correct: false
        explanation: "Такой заголовок помечает ответ как устаревший, но не запрещает его сохранять."
    explanation: "Токен в кэше устройства или промежуточного прокси может пережить сессию и остаться доступным на диске, особенно на общих или скомпрометированных устройствах. Из перечисленных директив только no-store даёт строгую гарантию не сохранять ответ."
    extended_explanation: "Для чувствительных ответов часто комбинируют: `Cache-Control: no-store, no-cache, must-revalidate`: избыточность оправдана разной поддержкой директив клиентами и прокси. Стоит проверить заголовки эндпоинтов, возвращающих токены и персональные данные."
    recommendation: "HTTP-кэширование: директивы `Cache-Control` (`no-store`, `no-cache`, `private`) и чувствительные ответы."
    difficulty: medium
    topics: [security]

  - id: q20
    text: "Стороннее приложение через OAuth 2.0 получает доступ к фотографиям пользователя. Какое решение при настройке интеграции снижает ущерб при утечке токена?"
    type: single
    options:
      - id: a
        text: "Запрашивать минимально необходимые скоупы, например только чтение фотографий"
        correct: true
        explanation: "Скоупы определяют, что можно делать с токеном. Утёкший токен с узким доступом принесёт меньше вреда, чем токен на весь аккаунт."
      - id: b
        text: "Хранить access-токен в `localStorage`, чтобы он не попадал в куки"
        correct: false
        explanation: "localStorage доступен любому скрипту страницы, и XSS вытащит оттуда токен. Объём прав при этом не уменьшается."
      - id: c
        text: "Использовать Implicit Flow: токен приходит сразу в браузер, без промежуточного кода"
        correct: false
        explanation: "Implicit Flow считается устаревшим: токен передаётся через адрес и чаще утекает. Объём прав он не ограничивает."
      - id: d
        text: "Сделать срок жизни access-токена месяцем, чтобы пользователь реже входил заново"
        correct: false
        explanation: "Долгоживущий токен увеличивает окно, в которое утечка опасна. Короткий срок жизни с refresh-токеном безопаснее."
    explanation: "Принцип наименьших привилегий в OAuth реализуется через скоупы: приложение просит конкретный узкий набор разрешений, а не общий доступ ко всему аккаунту. Это ограничивает ущерб, если токен или само приложение окажутся скомпрометированы."
    extended_explanation: "Пользователь на экране согласия видит запрошенные скоупы в человекочитаемом виде, и избыточный запрос снижает доверие. Дополнительно redirect URI регистрируют заранее и сверяют по белому списку, а код авторизации делают одноразовым. Стоит проверить скоупы своих интеграций на избыточность."
    recommendation: "OAuth 2.0: скоупы, принцип наименьших привилегий, redirect URI и жизненный цикл токенов."
    difficulty: medium
    topics: [security]

  - id: q21
    text: "Сервис использует версию библиотеки с публично известной уязвимостью, исправление давно выпущено, но зависимость не обновляли. К какой категории OWASP Top 10 (редакция 2021) это относится?"
    type: single
    options:
      - id: a
        text: "Software and Data Integrity Failures: злоумышленник подменил пакет в цепочке поставки"
        correct: false
        explanation: "Эта категория про подмену или повреждение кода и данных. Здесь пакет подлинный, он просто устарел."
      - id: b
        text: "Vulnerable and Outdated Components: компонент с известной уязвимостью не обновлён"
        correct: true
        explanation: "Проблема не в коде сервиса, а в зависимости, у которой есть публичный CVE и доступное исправление."
      - id: c
        text: "Security Misconfiguration: компонент развёрнут с небезопасными настройками по умолчанию"
        correct: false
        explanation: "Настройка компонента может быть любой. Уязвимость в самой версии библиотеки."
      - id: d
        text: "Injection: в библиотеку передаётся вредоносный ввод, и она его не фильтрует"
        correct: false
        explanation: "Вредоносный ввод может быть одним из способов эксплуатации, но категория описывает причину: устаревший компонент."
    explanation: "Категория охватывает использование библиотек, фреймворков и системных компонентов с известными уязвимостями. Эксплуатация часто автоматизирована: сканеры ищут версии с публичными CVE по всей сети."
    extended_explanation: "Практически это закрывается регулярным обновлением и автоматической проверкой зависимостей: bundler-audit и Dependabot для Ruby-проектов, npm audit для JavaScript. Стоит завести в CI проверку, которая падает при уязвимых версиях."
    recommendation: "Безопасность цепочки зависимостей: CVE, аудит зависимостей и регулярные обновления (OWASP A06:2021)."
    difficulty: easy
    topics: [security]

  - id: q22
    text: "WebSocket-соединение аутентифицируется токеном в query-параметре: `wss://example.com/ws?token=abc123`. Какой риск это создаёт в первую очередь?"
    type: single
    options:
      - id: a
        text: "Токен из адреса не доходит до сервера: параметры отбрасываются при апгрейде протокола"
        correct: false
        explanation: "Handshake начинается как обычный HTTP-запрос с полным адресом, и сервер видит параметры."
      - id: b
        text: "Токен из query-параметра нельзя отозвать, потому что сервер не умеет закрывать WebSocket-соединение"
        correct: false
        explanation: "Сервер закрывает соединение в любой момент. Проблема в том, где токен остаётся записанным."
      - id: c
        text: "Достаточно перейти с `ws://` на `wss://`: шифрование канала закрывает проблему"
        correct: false
        explanation: "wss:// защищает канал от перехвата в сети, но не мешает записи адреса в логи, историю и Referer."
      - id: d
        text: "Токен оседает в логах сервера, истории браузера и заголовке Referer, как пароль в GET-запросе"
        correct: true
        explanation: "Handshake WebSocket — обычный HTTP-запрос, и его адрес подвержен тем же утечкам. Токен теряет защиту, которую имел бы в заголовке или защищённой куке."
    explanation: "Handshake WebSocket — обычный HTTP-запрос с апгрейдом протокола, и его адрес подвержен тем же утечкам, что любой другой: логи сервера и прокси, история браузера, а при переходе на другую страницу — заголовок Referer. Токен лучше передавать в куке (желательно HttpOnly) или отдельным сообщением сразу после установки соединения."
    extended_explanation: "Отдельная проблема WebSocket — проверка заголовка Origin на сервере. Если её нет, сторонний сайт может установить соединение от имени пользователя с его кукой (cross-site WebSocket hijacking). Практически стоит перенести токен из адреса в куку или первое сообщение и проверить Origin."
    recommendation: "Безопасная аутентификация WebSocket: токен в куке или сообщении, проверка `Origin` и cross-site WebSocket hijacking."
    difficulty: hard
    topics: [security]

  - id: q23
    text: "После крупного инцидента не удалось восстановить хронологию атаки: в логах не было неудачных попыток входа и изменений прав доступа. Какая категория OWASP Top 10 (редакция 2021) это описывает?"
    type: single
    options:
      - id: a
        text: "Security Logging and Monitoring Failures: без логов атаку не заметить и не расследовать"
        correct: true
        explanation: "Категория касается не самой атаки, а неспособности её увидеть: без записей о неудачных входах и изменениях прав расследование постфактум почти невозможно."
      - id: b
        text: "Identification and Authentication Failures: сам факт неудачных входов означает, что вход сломан"
        correct: false
        explanation: "Неудачные попытки входа — нормальная часть работы. Проблема в том, что они нигде не фиксировались."
      - id: c
        text: "Cryptographic Failures: логи нужно шифровать, иначе их содержимое раскрывается"
        correct: false
        explanation: "Шифрование логов — отдельная мера. Здесь записей не было вообще."
      - id: d
        text: "Security Misconfiguration: логирование отключено в конфигурации веб-сервера"
        correct: false
        explanation: "Причиной формально может быть настройка, но для недостатка логирования и мониторинга в OWASP есть отдельная категория."
    explanation: "Категория подчёркивает, что предотвращение атаки — не единственная задача: многие инциденты обнаруживаются через недели или месяцы из-за отсутствия видимости. Минимум для логирования — неудачные аутентификации, изменения прав, доступ к чувствительным данным и ошибки валидации."
    extended_explanation: "Сами по себе логи без мониторинга почти бесполезны: команда, которая их пишет, но не смотрит и не настроила алерты на подозрительные паттерны, обнаружит атаку так же поздно. Стоит составить список обязательных событий безопасности и настроить алерты поверх них."
    recommendation: "Логирование и мониторинг безопасности: обязательные события, алертинг и OWASP A09:2021."
    difficulty: medium
    topics: [security]

  - id: q24
    text: |-
      Страница принимает от встроенного iframe сообщение с настройками:

      ```js
      window.addEventListener("message", (event) => {
        saveApiKey(event.data.apiKey);
      });
      ```

      Чего не хватает в обработчике?
    type: single
    options:
      - id: a
        text: "Проверки `event.source === window`: сообщение должно прийти из того же окна"
        correct: false
        explanation: "Сообщение приходит из другого окна или iframe, поэтому источник не совпадёт с текущим окном. Проверять нужно origin отправителя."
      - id: b
        text: "Вызова `event.preventDefault()`, иначе сообщение попадёт и в другие обработчики"
        correct: false
        explanation: "У message-события нет действия по умолчанию, которое можно отменить. Другие обработчики получают его в любом случае."
      - id: c
        text: "Проверки `event.origin` по белому списку доверенных источников"
        correct: true
        explanation: "postMessage создан для обмена между разными источниками и сам не фильтрует отправителей. Любой скрипт или чужой iframe на странице может отправить сообщение, и обработчик поверит ему."
      - id: d
        text: "Шифрования `event.data` перед использованием, чтобы никто не прочитал ключ"
        correct: false
        explanation: "Шифрование не отвечает на вопрос, кто отправил сообщение. Поддельное сообщение от стороннего скрипта останется поддельным."
    explanation: "window.postMessage намеренно обходит ограничения same-origin policy ради межфреймового обмена, поэтому проверка отправителя ложится на обработчик. Без сверки `event.origin` с белым списком любой скрипт на странице может подсунуть поддельные данные."
    extended_explanation: "Проверка нужна и в обратную сторону: отправитель должен указывать целевой origin вторым аргументом `postMessage(data, \"https://trusted.example\")`, а не `\"*\"`, иначе сообщение уйдёт на страницу другого происхождения, если iframe успел перейти на другой домен. Стоит найти в проекте все обработчики `message` и убедиться в проверке origin."
    recommendation: "`window.postMessage` и безопасный обмен между фреймами: проверка `event.origin` и явный targetOrigin."
    difficulty: hard
    topics: [security]

  - id: q25
    text: "Перед внутренними микросервисами развёрнут единый API Gateway, где выполняются аутентификация, лимиты и проверки заголовков. Один из сервисов при этом остаётся доступен напрямую по внутреннему адресу. Почему это ослабляет всю модель безопасности?"
    type: single
    options:
      - id: a
        text: "Gateway начнёт отбрасывать легитимный трафик, потому что не видит часть запросов к сервису"
        correct: false
        explanation: "Gateway обрабатывает только свои запросы и от прямых обращений не страдает. Страдает безопасность сервиса."
      - id: b
        text: "Внутренняя сеть доверенная, поэтому прямой доступ изнутри допустим и атак через него не бывает"
        correct: false
        explanation: "Сетевое положение не гарантирует доверия: скомпрометированный хост внутри сети получает прямой доступ без проверок."
      - id: c
        text: "Риск есть только для запросов на изменение данных, а чтение защищено в любом случае"
        correct: false
        explanation: "Обход затрагивает любые методы. Без аутентификации прямой запрос может и читать чужие данные."
      - id: d
        text: "Запросы напрямую к сервису проходят мимо всех проверок Gateway, как бы идеально он ни был настроен"
        correct: true
        explanation: "Если Gateway — единственное место проверок, любой другой путь к сервису оказывается без барьера. Атакующему достаточно узнать этот путь."
    explanation: "Модель с Gateway работает, только если он действительно единственная точка входа. Любой сервис, доступный и напрямую, получает путь без аутентификации, авторизации, лимитов и проверок заголовков, даже если конфигурация Gateway безупречна."
    extended_explanation: "Закрывают это сетевой изоляцией: сервисы во внутренней сети недоступны снаружи, а на самом сервисе дополнительно проверяют, что запрос пришёл именно от Gateway (взаимный TLS или подпись). Нельзя рассчитывать, что обходной путь просто никто не найдёт."
    recommendation: "Единая точка входа и defense in depth в микросервисах: API Gateway, сетевая изоляция, mTLS между сервисами."
    difficulty: medium
    topics: [security, architecture]
