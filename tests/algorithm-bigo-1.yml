        text: "O(3n log n) — нужно явно учитывать все три компонента с их множителями"
        correct: false
        explanation: "Это не является стандартной асимптотической записью — при суммировании разнородных слагаемых остаётся только член с наибольшим темпом роста, остальные (включая любые константные множители) опускаются."
      - id: d
        text: "O(n log n) — слагаемое с наибольшей асимптотикой поглощает остальные при суммировании"
        correct: true
        explanation: "Формальная сумма — O(n log n) + O(n) + O(n). При больших n член n log n растёт быстрее, чем n, поэтому по правилам асимптотической записи слагаемые низшего порядка (оба O(n)) поглощаются им, и итоговая сложность упрощается до O(n log n)."
    explanation: "Композитная сложность из независимых (не вложенных) частей — это сумма их отдельных сложностей, где остаётся только слагаемое с наибольшим темпом роста: O(n log n) растёт быстрее O(n), поэтому оба линейных слагаемых поглощаются логарифмическим членом при итоговой асимптотической записи."
    topics: [algorithms]
    extended_explanation: |
      Это прямое применение сразу двух принципов: «слагаемые
      складываются, а не перемножаются» (для невложенных операций) и
      «константы/члены низшего порядка не важны» (при итоговом
      упрощении суммы разнородных слагаемых до одного доминирующего
      члена).
    recommendation: "При анализе композитного кода сначала честно выписать сложность каждого независимого блока отдельно, затем сложить их и упростить до одного доминирующего члена — не пытаться сразу угадать итог."

  - id: q16
    text: "Задача принципиально требует перебора всех возможных перестановок n элементов (например, классическая задача коммивояжёра в лоб, без эвристик). Какая это сложность, и почему сам факт большой сложности не означает, что решение «плохое»?"
    type: single
    options:
      - id: a
        text: "Такая сложность всегда признак плохого, неоптимального алгоритма, который нужно переписать"
        correct: false
        explanation: "Это распространённое заблуждение: для некоторых задач факториальная (или экспоненциальная) сложность — не следствие плохой реализации, а принципиальное свойство самой задачи в её точной формулировке."
      - id: b
        text: "O(2ⁿ) — как и любая рекурсия с ветвлением на два вызова"
        correct: false
        explanation: "Перебор ВСЕХ перестановок даёт факториальный, а не экспоненциальный рост — это разные по темпу роста классы сложности, факториал растёт значительно быстрее экспоненты при больших n."
      - id: c
        text: "O(n log n) — как и у любой сортировки перестановок"
        correct: false
        explanation: "Сортировка одного конкретного набора элементов и перебор ВСЕХ возможных перестановок этих элементов — принципиально разные по объёму работы задачи."
      - id: d
        text: "O(n!) — факториальная сложность; но для некоторых задач точного решения быстрее принципиально не существует"
        correct: true
        explanation: "Перебор всех перестановок даёт факториальную сложность O(n!). При этом для некоторых задач (как классическая формулировка коммивояжёра) не существует известного более быстрого точного алгоритма — оценка сложности сама по себе не «плохая» или «хорошая», важно, есть ли решение быстрее для конкретной задачи."
    explanation: "Перебор всех перестановок n элементов даёт O(n!) — при n=127 это уже более 10²¹⁴ операций, астрономическое число. Но важно понимать: сама по себе высокая оценка сложности не означает «плохой» алгоритм — для некоторых задач в их точной постановке принципиально не существует более быстрого точного решения, и единственная альтернатива — приближённые эвристики."
    topics: [algorithms]
    extended_explanation: |
      Наглядное сравнение при n=127: O(log n) даёт всего 7 операций,
      тогда как O(n!) — свыше 10²¹⁴. При допущении «10⁷ операций в
      секунду» (близко к реальному темпу современных процессоров)
      логарифмическая сложность исчезающе мала по времени, а
      факториальная требует астрономического числа лет — этот контраст
      хорошо показывает, насколько по-разному растут разные классы
      сложности на одних и тех же входных данных.
    recommendation: "Не путать «оценка сложности высокая» с «решение неоптимальное» — сначала выяснить, существует ли для конкретной задачи вообще более быстрый точный алгоритм."

  - id: q17
    text: "Программа обходит все элементы массива размера n и для каждого элемента выполняет операцию поиска в хеш-таблице (в среднем O(1) на операцию). Какая итоговая сложность по времени в среднем случае?"
    type: single
    options:
      - id: a
        text: "O(1) — операции с хеш-таблицей нейтрализуют влияние размера массива"
        correct: false
        explanation: "Сам проход по n элементам массива уже вносит линейную зависимость от размера входных данных — она никуда не исчезает независимо от скорости отдельных операций внутри цикла."
      - id: b
        text: "O(n²) — операция с хеш-таблицей внутри цикла автоматически даёт квадрат"
        correct: false
        explanation: "Квадратичная сложность возникла бы, если бы операция внутри цикла сама была линейной (O(n)) — но у операций хеш-таблицы в среднем случае сложность константная O(1), а не линейная."
      - id: c
        text: "O(n log n) — доступ к хеш-таблице требует логарифмического времени, как у сбалансированного дерева"
        correct: false
        explanation: "Хеш-таблица (в отличие от сбалансированного дерева поиска) в среднем случае даёт именно константный доступ O(1), а не логарифмический."
      - id: d
        text: "O(n) — один проход по массиву, умноженный на константную (в среднем) сложность операции на каждом шаге"
        correct: true
        explanation: "Обход n элементов — это уже O(n). Каждая операция поиска в хеш-таблице в среднем занимает O(1), то есть константное время — умножение линейной сложности прохода на константу на каждый шаг оставляет итоговую сложность линейной."
    explanation: "Это пример правильного применения правила распознавания: один линейный проход по данным с константной операцией внутри на каждом шаге — паттерн O(n), тот же самый, что и у простого поиска или суммирования без дополнительных структур."
    topics: [algorithms]
    extended_explanation: |
      Важная оговорка: эта оценка верна именно для СРЕДНЕГО случая
      операций с хеш-таблицей. Если по каким-то причинам хеш-таблица
      деградировала до худшего случая (например, все элементы в одном
      бакете), константная O(1) операция внутри цикла превращается в
      линейную O(n), и итоговая сложность всего кода вырастет до O(n²).
    recommendation: "Всегда уточнять — идёт ли речь о среднем или худшем случае операций с хеш-таблицей, прежде чем делать вывод об итоговой сложности всего алгоритма, который её использует."

  - id: q18
    text: "Массив нужно разбить строго на две равные (или почти равные) части, рекурсивно обработать каждую половину независимо, а затем слить результаты за линейное время (как в merge sort). Какой из 6 базовых паттернов распознавания сложности здесь применяется, и какая итоговая оценка?"
    type: single
    options:
      - id: a
        text: "«Задача уменьшается вдвое» без дополнительной обработки → O(log n)"
        correct: false
        explanation: "Паттерн чистого O(log n) применим, когда на каждом уровне НЕ требуется обработка всех элементов (как в бинарном поиске); здесь же есть ещё и линейное слияние на каждом уровне, что добавляет множитель n."
      - id: b
        text: "«Каждый вызов порождает два новых» без уменьшения → O(2ⁿ)"
        correct: false
        explanation: "Паттерн O(2ⁿ) относится к ветвящейся рекурсии БЕЗ сокращения размера задачи (как наивный Фибоначчи); здесь же задача явно сокращается вдвое на каждом уровне, что принципиально другой случай."
      - id: c
        text: "«Два вложенных цикла» → O(n²)"
        correct: false
        explanation: "В описанной структуре нет двух вложенных циклов, проходящих по всем элементам — есть рекурсивное деление задачи плюс линейное слияние на каждом уровне, что даёт другую оценку."
      - id: d
        text: "Комбинация «задача уменьшается вдвое» и «один проход на каждом уровне» → O(n log n)"
        correct: true
        explanation: "Это ровно четвёртый паттерн из шести базовых: задача рекурсивно уменьшается вдвое (даёт log n уровней рекурсии), а на каждом уровне выполняется обработка всех элементов за линейное время (слияние) — вместе это даёт O(n log n), классическую оценку merge sort."
    explanation: "Комбинация «деление задачи пополам на каждом шаге» плюс «обработка всех элементов на каждом уровне рекурсии» — определяющий признак четвёртого базового паттерна: O(n log n). Именно так устроены merge sort и quick sort (в среднем случае)."
    topics: [algorithms]
    extended_explanation: |
      Разница между паттерном 2 (чистый O(log n), как бинарный поиск) и
      паттерном 4 (O(n log n), как merge sort) — именно в том, требует
      ли каждый уровень рекурсии дополнительной работы над всеми
      элементами уровня, или нет. Бинарный поиск отбрасывает половину
      данных без обработки, merge sort — обрабатывает (сливает) все
      элементы на каждом уровне.
    recommendation: "Различать шесть базовых паттернов не по формальным формулам, а по структурному вопросу: что именно происходит с данными на каждом уровне/шаге — обрабатываются ли все элементы, или часть отбрасывается без обработки."

  - id: q19
    text: "Двумерный массив (матрица) размера n×n нужно транспонировать (поменять строки и столбцы местами) простым двойным циклом по обеим осям с константной операцией обмена внутри. Какая сложность по времени?"
    type: single
    options:
      - id: a
        text: "O(n) — линейная относительно размера стороны матрицы"
        correct: false
        explanation: "Число операций растёт вместе с общим числом элементов матрицы (n×n = n² элементов), а не только с длиной одной стороны — линейной по n сложности здесь нет."
      - id: b
        text: "O(n²) — вложенные циклы идут по одной и той же переменной размера стороны матрицы n"
        correct: true
        explanation: "Оба цикла (по строкам и по столбцам) идут по одному и тому же параметру размера n — это тот случай, когда правило «два вложенных цикла — квадрат» действительно верно, поскольку оба цикла зависят от одной переменной, а не от двух разных."
      - id: c
        text: "O(n log n) — как у любой операции с матрицей"
        correct: false
        explanation: "O(n log n) характерен для сортировок и подобных алгоритмов деления пополам — простой обход всех элементов матрицы двойным циклом даёт другую, более прямую оценку."
      - id: d
        text: "O(n³) — три измерения операции требуют кубической сложности"
        correct: false
        explanation: "В транспонировании матрицы нет третьего измерения обработки — только строки и столбцы, что даёт два вложенных цикла, а не три."
    explanation: "Важно отличать этот случай от нюанса «две переменные — две зависимости»: здесь оба вложенных цикла идут по ОДНОЙ И ТОЙ ЖЕ переменной размера n (сторона квадратной матрицы), поэтому классическое правило «вложенные циклы перемножаются» применяется корректно — итог O(n²)."
    topics: [algorithms]
    extended_explanation: |
      Если бы матрица была прямоугольной (n строк, m столбцов, n ≠ m),
      обход всех элементов двойным циклом дал бы O(n·m) — тот же
      принцип, что и с двумя независимыми массивами разной длины, а не
      O(n²) или O(m²).
    recommendation: "Прежде чем механически применять «вложенные циклы = квадрат», проверять: действительно ли оба цикла идут по одной и той же переменной размера, как в квадратной матрице, или по двум разным, как в прямоугольной."

  - id: q20
    text: "Дана функция, которая рекурсивно обходит дерево (не список, не массив) и на каждом узле выполняет одну константную операцию, посещая каждый узел ровно один раз. Дерево содержит n узлов. Какая сложность по времени и памяти (глубина стека рекурсии)?"
    type: single
    options:
      - id: a
        text: "O(log n) по времени, так как рекурсивный обход дерева всегда логарифмический"
        correct: false
        explanation: "Логарифмическое время характерно для операций типа поиска в сбалансированном дереве, где часть узлов отбрасывается без посещения — здесь же каждый из n узлов посещается явно, что даёт линейное, а не логарифмическое время."
      - id: b
        text: "O(n) по времени и O(n) по памяти всегда, независимо от формы дерева"
        correct: false
        explanation: "Память O(n) была бы верна только для худшего случая — полностью несбалансированного дерева (h = n); для сбалансированного дерева память O(h) значительно меньше, около O(log n)."
      - id: c
        text: "O(n) по времени (каждый узел посещается один раз), O(h) по памяти, где h — высота дерева (глубина стека рекурсии)"
        correct: true
        explanation: "Раз каждый из n узлов посещается ровно один раз с константной операцией — время линейно, O(n). Память же определяется не числом узлов напрямую, а глубиной рекурсии — высотой дерева h, которая может быть значительно меньше n (в сбалансированном дереве) или равна n (в вырожденном, похожем на список)."
      - id: d
        text: "O(n) по времени, O(1) по памяти — рекурсия не расходует память при линейном времени"
        correct: false
        explanation: "Рекурсивный обход всегда расходует память на стек вызовов пропорционально глубине рекурсии — она не может быть константной для дерева произвольной формы и размера."
    explanation: "Время работы рекурсивного обхода дерева, посещающего каждый узел один раз, линейно относительно числа узлов — O(n). Но память измеряется отдельно и зависит от глубины стека рекурсии, то есть от высоты дерева h, а не от общего числа узлов n напрямую — это две разные величины, которые легко спутать."
    topics: [algorithms]
    extended_explanation: |
      Разница между h и n критична: в сбалансированном бинарном дереве
      h ≈ log n, что даёт логарифмическую память при линейном времени —
      выгодное сочетание. В вырожденном дереве (фактически превратившемся
      в список, где у каждого узла только один потомок) h = n, и память
      деградирует до линейной — та же асимптотика по времени, но
      совершенно другая по памяти.
    recommendation: "Всегда оценивать время и память рекурсивных алгоритмов на деревьях отдельно друг от друга — их асимптотики зависят от разных характеристик дерева (числа узлов и высоты соответственно)."
