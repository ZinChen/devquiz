      Оценка Count sort: O(n) по времени, O(1) по дополнительной памяти
      (не считая выходного массива) — но только при малом числе
      уникальных значений; при их росте фактическая эффективность
      падает, хотя формальная асимптотика (без учёта диапазона значений)
      этого не отражает напрямую.
    recommendation: "Уточнять диапазон/число уникальных значений во входных данных перед выбором Count sort — она не универсальная замена Quick/Merge sort."

  - id: q9
    text: "При реализации Quick sort выбор опорного элемента (pivot) неудачен — например, всегда берётся первый элемент уже отсортированного по возрастанию массива. К какой сложности в худшем случае это приводит?"
    type: single
    options:
      - id: a
        text: "К O(n log n) — Quick sort гарантированно быстрый независимо от выбора pivot"
        correct: false
        explanation: "O(n log n) — это средняя, а не гарантированная сложность Quick sort; при неудачном выборе pivot реальная сложность заметно хуже среднего случая."
      - id: b
        text: "К O(log n) — плохой pivot ускоряет сходимость алгоритма"
        correct: false
        explanation: "Плохой выбор pivot замедляет, а не ускоряет алгоритм — деление на крайне неравные части увеличивает, а не уменьшает суммарную работу."
      - id: c
        text: "К O(n²) — на каждом шаге отсекается лишь один элемент вместо деления пополам"
        correct: true
        explanation: "Если всегда брать первый элемент уже отсортированного массива как pivot, разбиение на каждом шаге отсекает ровно один элемент вместо примерно равных частей — глубина рекурсии становится линейной, и итоговая сложность деградирует до O(n²), как у примитивной пузырьковой сортировки."
      - id: d
        text: "К O(n) — в худшем случае Quick sort всё равно не хуже линейного прохода"
        correct: false
        explanation: "Сортировка массива в принципе не может выполняться быстрее O(n log n) в общем случае для сравнения-based алгоритмов — линейная оценка здесь занижает реальную сложность худшего случая Quick sort."
    explanation: "Слабое место Quick sort — выбор pivot. Если pivot систематически оказывается крайним значением рассматриваемой части (как первый элемент уже отсортированного массива), каждое разбиение отсекает всего один элемент вместо примерно равных половин, и сложность деградирует с O(n log n) до O(n²)."
    topics: [algorithms]
    extended_explanation: |
      Популярные стратегии смягчения этой проблемы — выбор pivot
      случайным образом или как среднее значение из первого, последнего
      и среднего элементов рассматриваемой части. Существует и
      теоретически оптимальный метод «Median of Medians», гарантирующий
      отсутствие худшего случая, но на практике он почти не используется
      из-за больших накладных расходов, перевешивающих теоретический
      выигрыш.
    recommendation: "Проверять на предсортированных/обратно отсортированных данных, если реализация Quick sort использует фиксированную позицию (первый/последний элемент) как pivot — это типичный триггер худшего случая."

  - id: q10
    text: "В чём принципиальное отличие Merge sort от Quick sort по стабильности оценки сложности в худшем случае?"
    type: single
    options:
      - id: a
        text: "Merge sort всегда работает за O(n log n), включая худший случай; у Quick sort худший случай деградирует до O(n²)"
        correct: true
        explanation: "Merge sort безусловно делит массив на две равные половины на каждом шаге — независимо от входных данных, поэтому его сложность стабильна O(n log n) во всех случаях. Quick sort же зависит от качества разбиения через pivot, и при неудачном выборе его худший случай — O(n²)."
      - id: b
        text: "У обоих одинаковая гарантия O(n log n) в худшем случае, разница только в потреблении памяти"
        correct: false
        explanation: "Именно гарантия худшего случая и есть ключевое отличие между ними — у Quick sort она отсутствует в общем случае, в отличие от Merge sort."
      - id: c
        text: "Merge sort деградирует до O(n²) при почти отсортированных данных, а Quick sort — нет"
        correct: false
        explanation: "Ситуация обратная: именно Quick sort (при неудачном выборе pivot) чувствителен к особому расположению данных вроде предсортированности, тогда как Merge sort не зависит от исходного порядка данных."
      - id: d
        text: "Оба алгоритма гарантированно работают за O(n) в лучшем случае"
        correct: false
        explanation: "Ни Merge sort, ни Quick sort не достигают O(n) даже в лучшем случае — сортировка сравнением принципиально не может быть быстрее O(n log n) в общем случае."
    explanation: "Merge sort всегда делит массив ровно пополам независимо от содержимого — это даёт неизменную оценку O(n log n) в любом случае. Quick sort зависит от качества выбранного pivot: в среднем он тоже O(n log n), но в худшем случае (систематически неудачный pivot) деградирует до O(n²)."
    topics: [algorithms]
    extended_explanation: |
      За стабильность Merge sort платит памятью: O(n) дополнительной
      памяти на слияние отсортированных половин против O(log n) у
      Quick sort в среднем случае. Есть in-place версия Merge sort,
      экономящая память, но на практике она работает заметно медленнее
      и почти не применяется.
    recommendation: "Выбирать Merge sort, когда критична предсказуемость худшего случая (например, real-time системы), и Quick sort, когда важна средняя практическая скорость и память менее критична."

  - id: q11
    text: "В хеш-таблице с методом цепочек все элементы после вставки оказались в одном и том же бакете из-за неудачной хеш-функции. Что происходит со сложностью операций поиска/вставки/удаления в этом случае?"
    type: single
    options:
      - id: a
        text: "Сложность остаётся O(1), поскольку метод цепочек гарантирует константное время независимо от распределения"
        correct: false
        explanation: "Метод цепочек защищает от потери данных при коллизиях, но не гарантирует константное время — при плохом распределении ключей по бакетам эта гарантия пропадает."
      - id: b
        text: "Сложность деградирует до O(log n), как у сбалансированного дерева"
        correct: false
        explanation: "Метод цепочек хранит элементы одного бакета как простой список (динамический массив), а не как дерево — деградация происходит до линейного поиска по этому списку, а не до логарифмического дерева."
      - id: c
        text: "Сложность деградирует до O(n), потому что приходится перебирать все элементы внутри единственного переполненного бакета"
        correct: true
        explanation: "Средняя оценка O(1) хеш-таблицы держится на предположении о равномерном распределении ключей по бакетам. Если все элементы попали в один бакет, поиск внутри него становится обычным линейным перебором по всем n элементам — O(n), худший случай хеш-таблицы."
      - id: d
        text: "Операции становятся невозможны, хеш-таблица перестаёт работать корректно"
        correct: false
        explanation: "Хеш-таблица продолжает работать корректно и возвращать правильные результаты — просто гораздо медленнее, чем в среднем случае, а не перестаёт функционировать."
    explanation: "Хеш-таблица даёт O(1) в среднем именно благодаря равномерному распределению ключей по бакетам при хорошей хеш-функции. Если все элементы попадают в один бакет (плохая хеш-функция или намеренная коллизионная атака), поиск внутри переполненного бакета вырождается в линейный перебор — O(n), что и есть худший случай для хеш-таблицы."
