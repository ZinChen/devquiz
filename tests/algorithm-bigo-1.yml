    explanation: "Это классическая скрытая ловушка сложности: получение элемента по индексу интуитивно кажется O(1) операцией «как в массиве», но для связанного списка это не так — единственный способ добраться до N-го узла — последовательно пройти по указателям от головы, что даёт O(n)."
    topics: [algorithms]
