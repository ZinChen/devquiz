      - id: b
        text: "O(n) для списка (нужно пройти по всем узлам от головы до N-го), O(1) для массива (прямой доступ по индексу)"
        correct: true
        explanation: "Элементы связанного списка физически разбросаны по памяти и связаны только указателями — чтобы добраться до N-го узла, нужно последовательно пройти все предыдущие. Массив же хранит элементы последовательно, что даёт прямой доступ по индексу за O(1)."
      - id: c
        text: "O(log n) для списка за счёт бинарного поиска по узлам, O(1) для массива"
        correct: false
        explanation: "Бинарный поиск требует произвольного доступа к середине структуры за O(1), а связанный список такой возможности не даёт — до середины тоже нужно последовательно дойти по указателям."
      - id: d
        text: "O(n) для обоих — массив тоже требует прохода по элементам для доступа по индексу"
        correct: false
