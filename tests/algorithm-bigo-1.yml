      если число бакетов ограничено. Метод цепочек — стандартное
      решение этой неизбежной проблемы: каждый бакет сам является
      динамическим массивом, способным хранить несколько пар
      ключ-значение с одинаковым остатком.
    recommendation: "Помнить, что коллизии — не признак сломанной хеш-функции, а неизбежное следствие приведения бесконечного множества возможных ключей к конечному числу бакетов."

  - id: q13
    text: "Нужно посчитать N-ый элемент связанного списка. Какая сложность у этой операции и почему она отличается от аналогичной операции для массива?"
    type: single
