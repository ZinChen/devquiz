slug: algorithm-bigo-1
title: "Алгоритмы: Big O и оценка сложности"
description: "Распознавание сложности по структуре кода, типичные ловушки при оценке, детали сортировок, хеш-таблиц, динамических массивов и связанного списка."
tags: [algorithms, claude-gen]
difficulty: advanced
estimated_time: 30

questions:
  - id: q1
    text: "Функция получает массив, заходит в цикл, который на каждой итерации делит рассматриваемую часть массива пополам (как в бинарном поиске), без вложенных циклов внутри. Какая сложность по времени?"
    type: single
    options:
      - id: a
        text: "O(n) — цикл всё равно проходит по данным"
        correct: false
        explanation: "Цикл не проходит по всем n элементам — он на каждом шаге отбрасывает половину рассматриваемой части, что даёт совсем другой темп роста числа операций."
      - id: b
        text: "O(log n) — задача уменьшается вдвое на каждом шаге"
        correct: true
        explanation: "Уменьшение задачи вдвое на каждом шаге — определяющий признак логарифмической сложности: число шагов до сведения задачи к одному элементу растёт гораздо медленнее размера входных данных."
      - id: c
        text: "O(n²) — деление пополам происходит внутри цикла"
        correct: false
        explanation: "Квадратичная сложность возникает от двух вложенных циклов, проходящих по всем элементам, а не от однократного деления диапазона поиска пополам."
      - id: d
        text: "O(1) — деление пополам не зависит от размера данных"
        correct: false
        explanation: "Число шагов деления пополам всё же растёт с увеличением n, просто гораздо медленнее линейного роста — сложность не константная."
    explanation: "Классический паттерн распознавания: если задача на каждом шаге уменьшается вдвое (а не решается разом или проходится целиком), это O(log n) — эталонный пример такого алгоритма — бинарный поиск."
    topics: [algorithms]
    extended_explanation: |
      Число операций при O(log n) растёт настолько медленно, что даже
      при огромном n оно остаётся крохотным: для n = 127 такой алгоритм
      выполнит всего 7 операций — логарифм по основанию 2 от 127
      округляется вверх именно до этого значения.
    recommendation: "Тренироваться распознавать 6 базовых паттернов сложности по структуре кода, не считая операции построчно — это быстрее и надёжнее на собеседовании."

  - id: q2
    text: "В коде есть цикл по массиву длины n, а внутри него на каждой итерации вызывается библиотечная функция sort() для другого, независимого массива фиксированной длины k (k не зависит от n). Какая итоговая сложность по времени?"
    type: single
    options:
      - id: a
        text: "O(n × k log k) — сортировка внутри цикла умножается на число итераций"
        correct: false
        explanation: "Формально верно записать так, но раз k — фиксированная константа, не зависящая от размера входных данных n, весь множитель k log k сводится к константе."
      - id: b
        text: "O(n log n) — сортировка внутри цикла определяет итоговую сложность"
        correct: false
        explanation: "Сортировка внутри цикла происходит над массивом фиксированной длины k, а не над n элементами — n log n здесь неоткуда взяться."
      - id: c
        text: "O(n) — сортировка константного по размеру массива не зависит от n, поэтому она не более чем константный множитель на каждой итерации"
        correct: true
        explanation: "Раз сортируемый внутри цикла массив имеет фиксированную длину k, не зависящую от n, время на сортировку — это константа. Умножение константы на число итераций цикла n даёт линейную сложность O(n)."
      - id: d
        text: "O(k) — определяющим является размер сортируемого массива, а не число итераций внешнего цикла"
        correct: false
        explanation: "Сортировка выполняется n раз (на каждой итерации внешнего цикла), а не один — игнорировать число итераций внешнего цикла нельзя."
    explanation: "Это пример нюанса «скрытые операции»: вызов библиотечной функции внутри цикла легко принять за автоматический множитель n log n, но важен размер именно того, что сортируется на каждом вызове — если он константный (не зависит от n), сложность вызова тоже константна."
    topics: [algorithms]
    extended_explanation: |
      Обратный, более частый случай той же ловушки: если бы sort()
      внутри цикла сортировал часть исходного массива размера,
      растущего вместе с n, итоговая сложность оказалась бы куда выше
      линейной — именно поэтому недостаточно заметить сам факт вызова
      sort(), нужно проверить размер того, что именно сортируется.
    recommendation: "При виде вызова стандартной функции внутри цикла всегда явно спрашивать: «сложность какого именно размера входных данных здесь скрыта?», а не просто «есть ли здесь sort()»."

  - id: q3
    text: "Алгоритм обрабатывает две независимые входные структуры — массив A длины n и массив B длины m — и для каждого элемента A сравнивает его с каждым элементом B (простой вложенный перебор двух массивов). Какая сложность по времени?"
    type: single
    options:
      - id: a
        text: "O(n²) — два вложенных цикла всегда дают квадрат"
        correct: false
        explanation: "Правило «два вложенных цикла — это квадрат» верно только тогда, когда оба цикла идут по одной и той же переменной размера; здесь на число операций влияют два разных параметра — n и m."
      - id: b
        text: "O(n·m) — на число операций влияют два разных параметра"
        correct: true
        explanation: "Когда число операций определяется двумя разными размерами входных данных (здесь — длиной A и длиной B), итоговая сложность — их произведение n·m, а не квадрат одного из параметров."
      - id: c
        text: "O(n+m) — суммарный размер обеих структур"
        correct: false
        explanation: "Сумма n+m была бы верна для одного прохода по обеим структурам последовательно, а не для полного попарного сравнения каждого элемента A с каждым элементом B."
      - id: d
        text: "O(max(n,m)) — определяет больший из двух размеров"
        correct: false
        explanation: "При полном попарном сравнении число операций растёт вместе с обоими параметрами одновременно, а не ограничивается только большим из них."
    explanation: "Нюанс «две переменные — две зависимости»: когда на число операций влияют два разных параметра (в отличие от одного параметра, использованного дважды), правильная запись — n·m, а не n². Особенно легко ошибиться в задачах на матрицы и графы, где параметров часто действительно два разных."
    topics: [algorithms]
    extended_explanation: |
      Различие принципиально: если A и B — один и тот же массив длины n
      (сравнение элементов массива самих с собой), это будет ровно O(n²)
      — там переменная действительно одна и та же. Ошибка возникает,
      когда автоматически пишут n² по привычке «два цикла — квадрат»,
      не проверив, действительно ли оба цикла идут по одному параметру.
    recommendation: "Перед тем как писать n² для двух вложенных циклов, явно проверять: оба цикла идут по одной и той же переменной размера, или по двум разным?"

  - id: q4
    text: "Рекурсивная функция на каждом вызове делит задачу на две подзадачи вдвое меньшего размера и рекурсивно решает обе, а после этого тратит O(n) на объединение результатов (как в merge sort). Почему это НЕ приводит к экспоненциальной сложности O(2ⁿ)?"
    type: single
    options:
      - id: a
        text: "Экспонента возникает при ветвлении БЕЗ уменьшения размера, а здесь задача вдвое сокращается на каждом шаге"
        correct: true
        explanation: "Сам факт ветвления рекурсии на несколько вызовов не гарантирует экспоненту — решающим является то, уменьшается ли размер задачи на каждом уровне. Здесь задача вдвое сокращается на каждом уровне рекурсии, что в сочетании с O(n) на объединение результатов даёт классический паттерн O(n log n)."
      - id: b
        text: "Экспонента невозможна в принципе, если в рекурсии есть базовый случай"
        correct: false
        explanation: "Базовый случай есть в любой корректной рекурсии, включая те, что действительно дают O(2ⁿ) — например, наивный расчёт чисел Фибоначчи без мемоизации; наличие базового случая само по себе не защищает от экспоненты."
      - id: c
        text: "Экспонента возникает только при линейной рекурсии (без ветвления), а не при разбиении на подзадачи"
        correct: false
        explanation: "Формулировка перевёрнута: экспонента как раз связана именно с ветвлением задачи на несколько независимых подзадач без сокращения их размера, а не с линейной (невитвящейся) рекурсией."
      - id: d
        text: "Экспонента появляется только при обработке строк, а не массивов"
        correct: false
        explanation: "Тип обрабатываемых данных (строки, массивы, деревья) никак не определяет сложность рекурсии — важна именно структура ветвления и уменьшения размера задачи, а не тип данных."
    explanation: "Ключевой нюанс: рекурсия не автоматически O(2ⁿ). Экспонента возникает именно при ветвлении задачи на несколько подзадач БЕЗ уменьшения их размера и без кэширования результатов. Рекурсия, которая, наоборот, сокращает задачу вдвое на каждом шаге, даёт O(n log n), несмотря на два рекурсивных вызова на уровень."
    topics: [algorithms]
    extended_explanation: |
      Именно так устроен Quick sort: цикл партиционирования даёт O(n)
      на уровень, а рекурсивное деление задачи на две части — паттерн
      O(log n) по глубине рекурсии; в сумме — O(n log n), тот же принцип,
      что и в описанном сценарии.
    recommendation: "При виде рекурсии с двумя вызовами сразу проверять: уменьшается ли размер подзадачи на каждом уровне, или задача ветвится без сокращения — от этого зависит, O(n log n) перед вами или O(2ⁿ)."

  - id: q5
    text: "Дана рекурсивная функция вычисления чисел Фибоначчи без мемоизации: F(n) = F(n-1) + F(n-2). Какая у неё сложность по времени?"
    type: single
    options:
      - id: a
        text: "O(n) — линейная, как и итеративное вычисление"
        correct: false
        explanation: "Без мемоизации функция многократно пересчитывает одни и те же подзадачи (например, F(3) вычисляется многократно при вычислении F(6)) — итоговое число вызовов растёт гораздо быстрее линейно."
      - id: b
        text: "O(log n) — рекурсия всегда уменьшает задачу"
        correct: false
        explanation: "Здесь рекурсия не уменьшает задачу вдвое, а ветвится на две подзадачи, каждая из которых лишь немного меньше исходной (n-1 и n-2) — это принципиально другая структура, чем логарифмический паттерн."
      - id: c
        text: "O(2ⁿ) — каждый вызов порождает два новых без кэширования результатов"
        correct: true
        explanation: "Каждый вызов F(n) без мемоизации порождает два новых вызова (F(n-1) и F(n-2)), и одни и те же подзадачи многократно пересчитываются заново — классический пример экспоненциальной сложности из-за ветвящейся рекурсии без кэша."
      - id: d
        text: "O(n!) — перебираются все перестановки чисел"
        correct: false
        explanation: "Факториальная сложность характерна для задач, перебирающих все перестановки элементов — вычисление Фибоначчи не перебирает перестановки, а рекурсивно ветвится на две подзадачи."
    explanation: "Это эталонный пример паттерна «каждый вызов порождает два новых» — ветвящаяся рекурсия без мемоизации даёт экспоненциальную сложность O(2ⁿ), поскольку одни и те же подзадачи (например, F(k) для разных путей рекурсии) пересчитываются заново многократно."
    topics: [algorithms]
    extended_explanation: |
      Добавление мемоизации (кэширования уже вычисленных значений F(k))
      превращает ту же самую рекурсивную структуру в линейную O(n) —
      каждое уникальное значение F(k) вычисляется только один раз, а
      повторные вызовы возвращают закэшированный результат мгновенно.
    recommendation: "Прорешать эту задачу дважды — сначала без мемоизации, затем с ней, — чтобы наглядно увидеть разницу между O(2ⁿ) и O(n) на одной и той же по смыслу задаче."

  - id: q6
    text: "Функция получает массив и сразу возвращает его первый элемент, не заходя ни в один цикл. Какая сложность по времени и почему код с тремя независимыми (не вложенными) циклами от 0 до n тоже не O(3n)?"
    type: single
    options:
      - id: a
        text: "Первый случай — O(1); три независимых цикла — O(n), а не O(3n), потому что константные множители в Big O не учитываются"
        correct: true
        explanation: "Возврат первого элемента не зависит от размера массива — O(1). А три независимых цикла от 0 до n дают в сумме 3n операций, но правило «константы не важны» убирает числовой множитель — итог O(n), а не O(3n)."
      - id: b
        text: "Первый случай — O(n), потому что доступ к элементу массива требует прохода по памяти; три цикла — O(3n)"
        correct: false
        explanation: "Доступ к элементу массива по индексу — это O(1) в силу самой структуры динамического массива (последовательное расположение элементов в памяти), не требует прохода."
      - id: c
        text: "Первый случай — O(1); три независимых цикла — O(n³), потому что три цикла перемножаются"
        correct: false
        explanation: "Циклы перемножаются (дают степень n) только когда они ВЛОЖЕНЫ друг в друга; три независимых (последовательных, не вложенных) цикла складываются, а не перемножаются."
      - id: d
        text: "Оба случая — O(1), поскольку размер входных данных нигде явно не используется в вычислениях"
        correct: false
        explanation: "Три цикла от 0 до n явно зависят от n — количество итераций растёт вместе с размером входных данных, это не константная сложность."
    explanation: "Первый случай — образец паттерна «нет зависимости от размера данных» → O(1). Во втором случае работает нюанс «константы не важны»: три независимых цикла дают буквально 3n операций, но множитель 3 как константа отбрасывается в асимптотической записи, оставляя O(n)."
    topics: [algorithms]
    extended_explanation: |
      То же правило распространяется и на основания логарифмов — O(log₂n)
      и O(log₁₀n) обе записываются одинаково как O(log n), поскольку
      переход между основаниями логарифма — это тоже лишь константный
      множитель.
    recommendation: "Не путать «независимые (последовательные) циклы складываются» с «вложенные циклы перемножаются» — это два разных случая с разным итогом по Big O."

  - id: q7
    text: "В массиве размера n происходит вставка нового элемента в самое НАЧАЛО динамического массива. Какая сложность этой операции и почему?"
    type: single
    options:
      - id: a
        text: "O(1) — вставка в начало всегда быстрая операция"
        correct: false
        explanation: "Быстрой (O(1)) в динамическом массиве является вставка/удаление именно в конец, а не в начало — вставка в начало требует дополнительной работы."
      - id: b
        text: "O(n) — все элементы нужно физически сдвинуть, чтобы освободить место"
        correct: true
        explanation: "Ключевое свойство динамического массива — все элементы хранятся строго последовательно в памяти, именно это даёт доступ по индексу за O(1). Но из-за той же последовательности вставка в начало требует физически сдвинуть все n существующих элементов на одну позицию."
      - id: c
        text: "O(log n) — используется бинарный поиск места вставки"
        correct: false
        explanation: "Место вставки здесь заранее известно (это начало массива), поиск не требуется — сложность операции определяется не поиском позиции, а физическим сдвигом остальных элементов."
      - id: d
        text: "O(n²) — сдвиг каждого элемента требует отдельного прохода по всему массиву"
        correct: false
        explanation: "Сдвиг всех элементов на одну позицию — это единственный линейный проход по массиву (каждый элемент сдвигается один раз), а не n отдельных проходов."
    explanation: "Прямое следствие устройства динамического массива: строгая последовательность элементов в памяти даёт O(1) доступ по индексу, но делает вставку/удаление в начало дорогой операцией O(n) — нужно физически сдвинуть все существующие элементы, чтобы освободить место."
    topics: [algorithms]
    extended_explanation: |
      Для контраста: удаление элемента С КОНЦА массива — дешёвая
      операция O(1), не требующая никакого сдвига остальных элементов,
      в отличие от удаления из середины или начала, где сдвиг
      неизбежен.
    recommendation: "Запомнить асимметрию: операции с концом динамического массива дёшевы (O(1)), операции с началом или серединой — дороги (O(n)) из-за необходимости сдвига."

  - id: q8
    text: "Массив содержит числа только из набора {0, 1, 2} (три уникальных значения), нужно отсортировать n элементов. Какая сортировка даёт O(n) по времени и почему она не подходит для массива с миллионом уникальных значений?"
    type: single
    options:
      - id: a
        text: "Count sort — подсчитывает частоту каждого уникального значения; эффективность резко падает при большом числе уникальных значений"
        correct: true
        explanation: "Count sort строит частотный массив по числу уникальных значений и работает за O(n) именно тогда, когда уникальных значений мало — она подсчитывает встречаемость каждого. При миллионе уникальных значений накладные расходы на построение и обход такого частотного массива делают её медленнее альтернатив."
      - id: b
