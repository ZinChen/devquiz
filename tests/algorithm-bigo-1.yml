    explanation: "Хеш-функция возвращает произвольное число, никак не ограниченное реальным размером таблицы бакетов. Остаток от деления на число бакетов преобразует это произвольное число в допустимый индекс конкретного бакета — от 0 до (число бакетов минус один)."
