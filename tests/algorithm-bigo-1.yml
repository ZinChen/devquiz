      перераспределение всех элементов при достижении критического
      значения load factor) — это защита именно от постепенного
      заполнения таблицы, а не от изначально плохой хеш-функции: если
      сама функция даёт неравномерное распределение, рехеширование в
      новое (даже большее) число бакетов не решает проблему коллизий.
    recommendation: "Различать две разные проблемы производительности хеш-таблицы: недостаточный размер (решается рехешированием) и плохое качество хеш-функции (решается только заменой самой функции)."

  - id: q12
    text: "В хеш-таблице методом цепочек ключ хешируется в число, затем берётся остаток от деления на число бакетов (например, hash(key) % 7 при 7 бакетах). Зачем нужна именно операция взятия остатка от деления?"
    type: single
