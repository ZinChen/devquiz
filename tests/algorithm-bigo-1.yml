        explanation: "Quick sort в среднем случае работает за O(n log n), а не O(n) — она не привязана к числу уникальных значений и не даёт линейной сложности в общем случае."
      - id: c
        text: "Merge sort — единственная сортировка, гарантирующая O(n) в лучшем случае"
        correct: false
        explanation: "Merge sort стабильно даёт O(n log n) по времени во всех случаях, а не O(n) — линейной сложности merge sort не достигает."
      - id: d
        text: "Bubble sort — эффективна именно при малом числе уникальных значений"
        correct: false
        explanation: "Пузырьковая сортировка даёт O(n²) независимо от числа уникальных значений в массиве — число уникальных значений не влияет на её сложность."
    explanation: "Count sort — специализированная сортировка: она эффективна ровно тогда, когда число уникальных значений в массиве мало, поскольку строит и обходит частотный массив по этим значениям. При большом числе уникальных значений накладные расходы на такой массив делают её невыгодной по сравнению с универсальными сортировками."
    topics: [algorithms]
