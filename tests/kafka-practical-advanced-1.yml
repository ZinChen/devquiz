  - id: q11
    text: "Почему консюмер Kafka должен корректно обрабатывать SIGTERM (graceful shutdown), а не просто завершаться по сигналу мгновенно?"
    type: single
    options:
      - id: a
        text: "Чтобы Kubernetes не посчитал под неисправным и не перезапустил его повторно ещё до завершения обработки"
        correct: false
        explanation: "Решение о перезапуске принимается на основе состояния проб liveness и readiness — это отдельный от SIGTERM механизм."
      - id: b
        text: "Чтобы успеть закоммитить offset и не потерять или не задублировать обработку при следующем запуске"
        correct: true
        explanation: "Мгновенное завершение процесса посреди обработки батча оставляет часть сообщений обработанными, но не закоммиченными — при перезапуске они обработаются заново. Graceful shutdown даёт время дообработать текущий батч и корректно закоммитить offset, прежде чем процесс завершится."
      - id: c
        text: "Чтобы освободить сетевые порты для следующего процесса, который в дальнейшем займёт освободившийся под"
        correct: false
        explanation: "Освобождение сетевых портов происходит автоматически при завершении процесса и не требует специальной обработки сигнала на уровне Kafka-консюмера."
      - id: d
        text: "Чтобы Kafka автоматически перевыбрала лидера для партиций, которые читал именно этот консюмер"
        correct: false
        explanation: "Лидером партиции всегда является реплика-брокер — консюмеры остаются клиентскими процессами, читающими топик."
    explanation: "При штатной остановке (деплой новой версии, масштабирование вниз) SIGTERM даёт процессу время на graceful shutdown — прежде чем завершиться, консюмер должен закончить обработку текущего сообщения или батча и явно закоммитить offset, а не быть прерванным посреди работы SIGKILL после истечения тайм-аута."
    extended_explanation: "Если это время (обычно настраивается через terminationGracePeriodSeconds в Kubernetes) слишком короткое относительно времени обработки одного батча, процесс всё равно получит SIGKILL посреди работы — грейс-период должен быть согласован с реальным временем обработки, а не выбран произвольно."
    recommendation: "Проверить, как настроен terminationGracePeriodSeconds для консюмер-подов относительно времени обработки батча."
