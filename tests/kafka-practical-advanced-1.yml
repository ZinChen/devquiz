        text: "Тестировать логику обработчика напрямую, вызывая его метод с готовым сообщением без реального брокера"
        correct: true
        explanation: "Большинство клиентских библиотек (включая Karafka) позволяют вызвать метод обработки консюмера напрямую с тестовым сообщением, минуя реальную инфраструктуру Kafka — это быстрый юнит-тест бизнес-логики, изолированный от сети и брокера."
      - id: b
        text: "Мокать весь HTTP-слой приложения, поскольку Kafka работает поверх HTTP как транспортного протокола"
        correct: false
        explanation: "Kafka использует собственный бинарный протокол поверх TCP, поэтому мокать HTTP-слой для тестирования Kafka-кода бессмысленно."
      - id: c
        text: "Использовать production-кластер с отдельным тестовым топиком, создаваемым для каждого прогона тестов"
        correct: false
        explanation: "Использование прод-инфраструктуры для юнит-тестов создаёт зависимость от сети и внешнего состояния, делая тесты медленными и хрупкими — обычно так проверяют именно интеграционные сценарии."
      - id: d
        text: "Полностью исключить автоматическое тестирование, полагаясь только на ручную проверку в стейджинге"
        correct: false
        explanation: "Отказ от автоматического тестирования — не техническое решение проблемы, а её отсутствие; библиотеки специально предоставляют инструменты для юнит- и интеграционного тестирования консюмеров."
    explanation: "Юнит-тест обработчика не должен зависеть от реального брокера — он проверяет бизнес-логику: как обработчик реагирует на конкретное сообщение, какие побочные эффекты производит. Библиотеки вроде Karafka предоставляют тестовые хелперы, позволяющие вызвать обработчик напрямую с сконструированным сообщением."
    extended_explanation: "Для проверки же интеграции с реальным протоколом Kafka (сериализация, партиционирование, ребалансировка) отдельно используют embedded-брокер или testcontainers с реальным Kafka в Docker — это уже интеграционный, а не юнит-тест, и его запускают реже и медленнее."
    recommendation: "Посмотреть тестовые хелперы Karafka и testcontainers-подход для интеграционных тестов Kafka."
    difficulty: medium
    topics: [messaging, testing]

  - id: q17
    text: "Интеграционный тест поднимает Kafka через testcontainers и проверяет полный путь: публикация продюсером, чтение консюмером, применение в БД. Чем такой тест ценен помимо юнит-теста обработчика?"
    type: single
    options:
      - id: a
        text: "Проверяет сериализацию, партиционирование и коммит offset — то, что юнит-тест с прямым вызовом не затрагивает"
        correct: true
        explanation: "Юнит-тест вызывает метод обработчика напрямую с готовым объектом сообщения — он не проходит через сериализацию продюсера, реальное партиционирование по ключу или фактический коммит offset брокеру. Testcontainers поднимает настоящий (хоть и временный) брокер, и через него можно поймать ошибки именно в этой части цепочки, которую юнит-тест обходит стороной."
      - id: b
        text: "Полностью исключает необходимость в юнит-тестах бизнес-логики обработчика для оставшейся части кодовой базы"
        correct: false
        explanation: "Интеграционный тест не заменяет юнит-тест — он медленнее и дороже, покрывая интеграцию с инфраструктурой, тогда как бизнес-логику эффективнее проверять множеством быстрых юнит-тестов."
      - id: c
        text: "Гарантирует такое же поведение, как в продакшене, включая полноценную репликацию и переключение лидеров"
        correct: false
        explanation: "Testcontainers обычно поднимает единственный брокер без полноценной репликации и кластерных сценариев — поведение при отказах и переключении лидера он не воспроизводит."
      - id: d
        text: "Ускоряет CI-конвейер за счёт замены множества юнит-тестов одним быстрым интеграционным прогоном"
        correct: false
        explanation: "Интеграционный тест с поднятием реального брокера заметно медленнее юнит-теста — это осознанная плата за более полное покрытие."
    explanation: "Юнит-тест и интеграционный тест консюмера покрывают разные риски: юнит-тест дешёво и быстро проверяет корректность бизнес-логики на множестве сценариев, интеграционный — дороже, но ловит проблемы на стыке с реальной инфраструктурой (формат сериализации, поведение партиционера, фактическую фиксацию offset), которые прямой вызов метода обработчика в принципе не может обнаружить."
    extended_explanation: "Соотношение числа тестов обычно пирамидальное: много быстрых юнит-тестов на разные ветки бизнес-логики и небольшое число интеграционных тестов на ключевые сквозные сценарии — а не наоборот, иначе CI начинает выполняться неприемлемо долго."
    recommendation: "Прочитать про тестовую пирамиду применительно к событийным системам и место интеграционных тестов в ней."
    difficulty: medium
    topics: [messaging, testing]

  - id: q18
    text: "Consumer lag конкретной consumer group растёт, хотя сам обработчик работает быстро и без ошибок. Что стоит проверить в первую очередь?"
    type: single
    options:
      - id: a
        text: "Не устарел ли клиент Kafka до версии, несовместимой с текущим брокером по протоколу"
        correct: false
        explanation: "Несовместимость версий обычно даёт явную ошибку протокола сразу же при подключении клиента."
      - id: b
        text: "Не превышен ли лимит на число партиций в топике относительно возможностей кластера"
        correct: false
        explanation: "Число партиций — статическая настройка топика, само по себе не растущая и не создающая динамику увеличивающегося лага."
      - id: c
        text: "Не пишет ли продюсер заметно быстрее, чем группа успевает вычитывать — то есть проблема на входе"
        correct: true
        explanation: "Lag — это разница между записанным и прочитанным offset, и он растёт не только от медленной обработки, но и от опережающего роста входящего потока. Если обработчик быстр, а лаг всё равно растёт, логичнее в первую очередь проверить throughput продюсера и достаточность параллелизма consumer group относительно него."
      - id: d
        text: "Не изменилась ли политика retention топика на заметно более короткую относительно прежней"
        correct: false
        explanation: "Сокращение retention влияет на доступность старых данных для чтения, но не является типичной причиной именно роста лага при исправно работающем обработчике."
    explanation: "Consumer lag — метрика с двумя источниками роста: медленная обработка на стороне консюмера или опережающий рост входящего потока на стороне продюсера. Раз обработчик работает быстро, логично проверить именно вторую причину — не вырос ли трафик публикации сильнее, чем рассчитан параллелизм читающей стороны."
    extended_explanation: "Диагностика обычно начинается со сравнения двух графиков рядом: скорости записи (bytes/messages in per second) и скорости чтения — если первая растёт быстрее второй, дело не в обработчике, а в недостаточном параллелизме consumer group относительно текущей нагрузки продюсера."
    recommendation: "Настроить дашборд, сравнивающий throughput продюсера и consumer group для быстрой диагностики роста lag."
    difficulty: medium
    topics: [messaging, observability]

  - id: q19
    text: "Нужно вывести старый Kafka-топик из эксплуатации, потому что сервис-потребитель переехал на другой источник данных. Что стоит сделать перед физическим удалением топика?"
    type: single
    options:
      - id: a
        text: "Убедиться, что consumer lag всех групп на топике нулевой и ни одна группа его больше не читает"
        correct: true
        explanation: "Удаление топика с активными или отстающими консюмерами приводит к немедленной потере доступа к неprочитанным данным для них. Проверка нулевого лага и отсутствия активности в consumer group — минимальная гарантия, что удаление никого не заденет."
      - id: b
        text: "Увеличить число партиций топика перед удалением, чтобы оставшиеся данные распределились равномернее"
        correct: false
        explanation: "Увеличение числа партиций перед удалением не имеет смысла — это не влияет на безопасность самой операции удаления."
      - id: c
        text: "Сначала переименовать топик, а затем удалить получившуюся переименованную копию отдельной операцией"
        correct: false
        explanation: "У топиков Kafka нет операции переименования — это два разных объекта, и переименование не является частью стандартной процедуры вывода из эксплуатации."
      - id: d
        text: "Отключить репликацию топика перед удалением, чтобы сама операция удаления прошла заметно быстрее"
        correct: false
        explanation: "Отключение репликации перед удалением не ускоряет саму операцию и лишь временно снижает надёжность оставшихся данных без какой-либо пользы."
    explanation: "Прежде чем удалить топик физически, стоит убедиться, что все, кто мог на него полагаться, уже переключились — иначе кто-то из потребителей неожиданно теряет доступ к данным без предупреждения. Проверка отсутствия активных consumer group и нулевого лага — практический способ убедиться в этом перед необратимой операцией."
    extended_explanation: "На практике это часто делают не мгновенным удалением, а поэтапно: сначала запрещают запись в топик, оставляя его доступным для дочтения оставшимся потребителям, и только спустя период retention удаляют физически — это даёт запас времени на то, чтобы обнаружить забытого потребителя, о котором никто не вспомнил."
    recommendation: "Составить чеклист безопасного вывода топика из эксплуатации перед плановым удалением."
    difficulty: medium
    topics: [messaging, operations]

  - id: q20
    text: "В команде обсуждают, стоит ли переводить существующий консюмер с at-least-once на exactly-once через транзакции продюсера. Какой практический довод против такого перехода наиболее весом?"
    type: single
    options:
      - id: a
        text: "Транзакции Kafka физически несовместимы с consumer group и требуют полного отказа от группового чтения"
        correct: false
        explanation: "Транзакции продюсера и consumer group — независимые механизмы, транзакционная запись не требует отказа от группового чтения на стороне консюмеров."
      - id: b
        text: "Транзакции доступны только в облачных managed-версиях Kafka и недоступны в self-hosted кластере вовсе"
        correct: false
        explanation: "Транзакции — часть стандартного протокола Kafka, доступная в любом self-hosted кластере без привязки к облачному провайдеру."
      - id: c
        text: "Транзакции снижают пропускную способность и требуют read_committed на чтении, а обработчик и так идемпотентен"
        correct: true
        explanation: "Если обработчик уже корректно справляется с повторной обработкой (идемпотентен), практическая ценность перехода на транзакции невелика, а накладные расходы реальны: снижение throughput из-за оверхеда транзакционного протокола и необходимость перенастройки всех читающих сторон на read_committed."
      - id: d
        text: "Переход на транзакции требует полной остановки кластера на всё время проведения миграции"
        correct: false
        explanation: "Включение транзакционного режима продюсера не требует остановки кластера — это настройка на стороне клиента, применяемая постепенно."
    explanation: "Exactly-once через транзакции решает ровно ту проблему, которую многие системы уже решают идемпотентной обработкой на стороне консюмера — если это уже сделано и работает, переход на транзакции добавляет сложность и заметный оверхед производительности без соразмерного выигрыша. Транзакции оправданы там, где идемпотентность сложно реализовать в принципе (например, побочный эффект — не идемпотентная операция вроде отправки письма)."
    extended_explanation: "Практическое правило: сначала оценить, можно ли добиться нужной гарантии дешёвой идемпотентностью обработчика, и только если это действительно невозможно или неоправданно сложно — переходить на более тяжёлый механизм транзакций."
    recommendation: "Сравнить стоимость идемпотентной обработки против транзакций Kafka на конкретном профиле нагрузки перед принятием решения."
    difficulty: hard
    topics: [messaging, performance]
