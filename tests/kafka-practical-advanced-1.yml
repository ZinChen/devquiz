        explanation: "Состав consumer group не фиксирован при создании — участники могут присоединяться и покидать группу динамически, вызывая ребалансировку."
      - id: d
        text: "Обработка полностью остановится, пока новый участник не завершит первичную инициализацию"
        correct: false
        explanation: "Ребалансировка временно приостанавливает обработку лишь на затронутых партициях, остальная группа продолжает работу."
    explanation: "Consumer group следит за составом участников через протокол хартбитов и координатора группы. При изменении состава — новый участник, выход старого, потеря соединения — запускается ребалансировка: партиции перераспределяются между текущими живыми участниками так, чтобы нагрузка была по возможности равномерной."
