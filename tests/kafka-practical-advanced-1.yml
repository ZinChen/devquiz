slug: kafka-practical-advanced-1
title: "Kafka: прикладные задачи"
description: "Продюсер и надёжность доставки, сериализация и эволюция контрактов, клиентские библиотеки, производительность и тестирование — что реально приходится настраивать и решать при работе с Kafka из кода."
tags: [platform, kafka, backend, claude-gen]
difficulty: advanced
estimated_time: 30

questions:

  # ── Продюсер и надёжность ────────────────────────────────────────────────

  - id: q1
    text: "Продюсер настроен с `enable.idempotence=true`. От какого класса проблем это защищает?"
    type: single
    options:
      - id: a
        text: "От повторной обработки сообщения на стороне консюмера при его перезапуске после падения процесса"
        correct: false
        explanation: "Идемпотентность на консюмере — отдельная задача самого обработчика, продюсерская настройка её не решает."
      - id: b
        text: "От потери сообщений при падении брокера-лидера партиции до завершения репликации на фолловеров"
        correct: false
        explanation: "От потери данных при падении лидера защищают репликация и настройка acks — это отдельный, независимый механизм."
      - id: c
        text: "От записи сообщений в неправильную партицию при изменении ключа партиционирования между запусками"
        correct: false
        explanation: "Выбор партиции определяется партиционером на основе ключа сообщения и с идемпотентностью продюсера не связан."
      - id: d
        text: "От дублей при повторной отправке одного сообщения после сетевого ретрая"
        correct: true
        explanation: "Брокер помнит порядковый номер последнего принятого сообщения от конкретного продюсера и отбрасывает повтор с уже виденным номером — ретрай после потери ack не создаёт дубль на брокере."
    explanation: "Без идемпотентности продюсер, не получивший ack из-за сетевого сбоя, не может отличить реальную потерю сообщения от потерянного подтверждения — и на ретрае рискует создать дубль. Идемпотентный продюсер добавляет к каждому сообщению producer ID и порядковый номер, и брокер отбрасывает повтор с уже принятым номером."
    extended_explanation: "Идемпотентность продюсера работает только в рамках одной сессии продюсера и одного топика-партиции — она не защищает от дублей при перезапуске самого продюсера с новым producer ID. Для сквозной идемпотентности вдоль всей цепочки нужна ещё и дедупликация на стороне читателя, как в inbox-паттерне."
    recommendation: "Разобрать разницу между идемпотентным продюсером и транзакциями Kafka (exactly-once semantics)."
    difficulty: medium
    topics: [messaging]

  - id: q2
    text: "Чем транзакции продюсера Kafka отличаются от простой идемпотентности?"
    type: single
    options:
      - id: a
        text: "Транзакции гарантируют at-most-once доставку вместо at-least-once"
        correct: false
        explanation: "Транзакции не меняют базовую гарантию доставки на at-most-once — они добавляют атомарность поверх at-least-once записи в несколько партиций."
      - id: b
        text: "Транзакции убирают необходимость в репликации партиций"
        correct: false
        explanation: "Репликация партиций работает независимо от того, используются транзакции продюсера или нет."
      - id: c
        text: "Транзакции ускоряют запись за счёт отключения проверки идемпотентности"
        correct: false
        explanation: "Транзакционный продюсер требует включённой идемпотентности как обязательное предварительное условие."
      - id: d
        text: "Транзакции позволяют атомарно записать в несколько партиций и топиков как единое целое"
        correct: true
        explanation: "Идемпотентность защищает от дублей в рамках одной партиции одного продюсера. Транзакции расширяют это до атомарности: несколько записей в разные топики и партиции либо все применяются, либо ни одна — включая коммит offset при чтении из другого топика."
    explanation: "Транзакции нужны, когда важна атомарность операции целиком — классический пример read-process-write: consumer читает из одного топика, обрабатывает и пишет результат в другой, и всё это (включая коммит offset исходного чтения) должно либо примениться полностью, либо не примениться вовсе."
    extended_explanation: "Читающая сторона обязана явно выставить `isolation.level=read_committed`, иначе увидит сообщения из ещё не закоммиченных или уже откаченных транзакций — иначе выигрыш от атомарности записи теряется на стороне чтения."
    recommendation: "Изучить паттерн read-process-write и настройку transactional.id продюсера."
    difficulty: hard
    topics: [messaging, concurrency]

  - id: q3
    text: "Продюсер настроен с `linger.ms=20` и `batch.size=32KB`. Что это даёт по сравнению с отправкой каждого сообщения сразу?"
    type: single
    options:
      - id: a
        text: "Продюсер гарантированно ждёт полные 20мс перед каждой отправкой независимо от заполнения батча"
        correct: false
        explanation: "Батч отправляется раньше таймаута, как только набирает заданный размер — ждать полные 20мс каждый раз не требуется."
      - id: b
        text: "Сообщения объединяются в один batch.size независимо от того, в какую партицию они адресованы"
        correct: false
        explanation: "Батчирование происходит отдельно по каждой партиции — сообщения для разных партиций не объединяются в общий батч."
      - id: c
        text: "Продюсер ждёт до 20мс или заполнения батча до 32KB, отправляя накопленные сообщения одним сетевым запросом"
        correct: true
        explanation: "Батчинг снижает число отдельных сетевых запросов к брокеру: вместо запроса на каждое сообщение продюсер группирует несколько в один батч, что заметно увеличивает throughput ценой небольшой добавочной задержки."
      - id: d
        text: "Размер батча ограничивает максимальный размер одного отправляемого сообщения"
        correct: false
        explanation: "Максимальный размер одного сообщения задаёт отдельная настройка max.request.size — batch.size отвечает за группировку нескольких сообщений."
    explanation: "linger.ms и batch.size вместе определяют компромисс между задержкой и пропускной способностью: продюсер копит сообщения в буфер конкретной партиции и отправляет их одним запросом, как только сработает первое из двух условий — истечёт время ожидания или заполнится размер батча."
    extended_explanation: "На низконагруженной системе linger.ms почти не влияет на задержку — сообщения и так копятся редко, батч заполняется естественным потоком. Эффект заметен именно на высокой нагрузке, где без лингера каждое сообщение уходило бы отдельным сетевым запросом, создавая избыточную нагрузку на брокер."
    recommendation: "Прочитать про компромисс throughput/latency в настройках батчинга продюсера Kafka."
    difficulty: medium
    topics: [messaging, performance]

  - id: q4
    text: "Что делает `compression.type=lz4` на продюсере и на каком уровне применяется сжатие?"
    type: single
    options:
      - id: a
        text: "Сжимает каждое отдельное сообщение перед отправкой, брокер хранит их по отдельности в сжатом виде"
        correct: false
        explanation: "Сжатие применяется не к отдельным сообщениям, а к целому батчу сразу — так достигается заметно лучшая степень сжатия за счёт общих паттернов между сообщениями."
      - id: b
        text: "Сжимает индексы партиций на диске брокера для экономии места"
        correct: false
        explanation: "compression.type — настройка продюсера, применяемая именно к передаваемым данным сообщений."
      - id: c
        text: "Включает сжатие только для сообщений с ключом, оставляя сообщения без ключа несжатыми"
        correct: false
        explanation: "Сжатие применяется ко всем сообщениям батча одинаково, независимо от наличия у них ключа."
      - id: d
        text: "Сжимает весь батч сообщений целиком перед отправкой, брокер хранит и передаёт его в сжатом виде без распаковки"
        correct: true
        explanation: "Сжатие применяется на уровне батча: брокер обычно не распаковывает данные при получении и хранении, а лишь пересылает сжатый батч дальше консюмерам — распаковка происходит уже на стороне читателя."
    explanation: "Сжатие на уровне батча — не только эффективнее по степени сжатия (общие паттерны между соседними сообщениями сжимаются лучше, чем каждое по отдельности), но и дешевле для брокера: он хранит и реплицирует данные в уже сжатом виде, не тратя CPU на повторное сжатие или распаковку при каждой операции."
    extended_explanation: "Выбор алгоритма — компромисс между степенью сжатия и скоростью: lz4 и snappy быстрее, но сжимают слабее, gzip и zstd сжимают сильнее ценой CPU. На высоконагруженных топиках с большим трафиком экономия на сетевом трафике и дисковом пространстве обычно перевешивает накладные расходы CPU."
    recommendation: "Сравнить алгоритмы сжатия Kafka по CPU/степени сжатия для своего профиля нагрузки."
    difficulty: medium
    topics: [messaging, performance]

  # ── Сериализация и контракты ─────────────────────────────────────────────

  - id: q5
    text: "Почему для событий в Kafka чаще выбирают бинарные форматы (Avro, Protobuf), а не просто JSON?"
    type: single
    options:
      - id: a
        text: "JSON вообще не поддерживается протоколом Kafka как формат тела сообщения — Kafka принимает только строго определённый список форматов"
        correct: false
        explanation: "Kafka не накладывает ограничений на формат тела сообщения — оно хранится как байты, JSON использовать вполне можно."
      - id: b
        text: "Бинарные форматы компактнее и несут типизированную схему для проверки совместимости при эволюции"
        correct: true
        explanation: "Avro и Protobuf компактнее JSON за счёт бинарной сериализации без повторяющихся имён полей в каждом сообщении, и несут формальную схему — это даёт инструментам вроде Schema Registry возможность проверять совместимость версий контракта автоматически."
      - id: c
        text: "JSON нельзя использовать вместе с партиционированием по ключу — партиционер работает только с бинарными форматами"
        correct: false
        explanation: "Партиционирование по ключу — свойство самого сообщения Kafka и не зависит от формата сериализации тела."
      - id: d
        text: "Бинарные форматы автоматически шифруют содержимое сообщения, избавляя от необходимости настраивать TLS отдельно"
        correct: false
        explanation: "Ни Avro, ни Protobuf не выполняют шифрование сами по себе — это отдельный механизм на уровне транспорта или приложения."
    explanation: "На большом потоке событий разница в размере JSON против бинарного формата ощутимо сказывается на сетевом трафике и хранении. Но главный практический выигрыш — не в размере, а в формальной схеме: она позволяет автоматически проверять, не ломает ли новая версия события существующих потребителей, ещё до публикации."
    extended_explanation: "У JSON есть свой плюс — читаемость при отладке без специальных инструментов, поэтому его иногда сознательно оставляют для низконагруженных топиков или там, где важна простота диагностики важнее компактности и строгой типизации."
    recommendation: "Сравнить Avro, Protobuf и JSON Schema по компактности, читаемости и поддержке эволюции контракта."
    difficulty: medium
    topics: [messaging]

  - id: q6
    text: "В сервис приходит событие со старой версией контракта, где отсутствует новое обязательное поле, добавленное недавно. Consumer, ожидающий это поле, падает с ошибкой десериализации. В чём ошибка эволюции схемы?"
    type: single
    options:
      - id: a
        text: "Consumer должен был быть обновлён раньше продюсера, а не наоборот — порядок обновления здесь и есть первопричина падения"
        correct: false
        explanation: "Порядок обновления определяется типом совместимости схемы, но сама проблема здесь в том, что поле сделали обязательным без значения по умолчанию — это ломает совместимость независимо от порядка деплоя."
      - id: b
        text: "Новое поле нужно было сделать необязательным или задать ему default для сохранения совместимости"
        correct: true
        explanation: "Добавление обязательного поля без значения по умолчанию ломает чтение старых сообщений — это нарушение обратной совместимости (BACKWARD). Правильная эволюция схемы: новые поля делают опциональными с default-значением, применяемым при отсутствии поля в старых данных."
      - id: c
        text: "Ошибка десериализации всегда означает повреждение данных при передаче по сети, а не расхождение версий схемы"
        correct: false
        explanation: "Ошибка вызвана несовпадением структуры схемы с фактическими данными сообщения."
      - id: d
        text: "Топик нужно было разбить на большее число партиций, чтобы разные версии схемы не конфликтовали между собой"
        correct: false
        explanation: "Число партиций топика никак не связано с совместимостью схем сообщений — это два независимых аспекта настройки Kafka."
    explanation: "Классическая ошибка при добавлении нового поля в контракт события — сделать его обязательным сразу. Consumer, читающий более старое сообщение без этого поля, не может собрать валидный объект по новой схеме и падает. Обратно совместимое изменение требует, чтобы новое поле было опциональным или имело default."
    extended_explanation: "Если поле действительно должно быть обязательным логически, эволюцию делают в два шага: сначала добавляют его опциональным и обеспечивают, чтобы все продюсеры начали его заполнять, и только позже, когда старые сообщения без поля уже вышли из retention, переводят в обязательное на уровне схемы."
    recommendation: "Повторить правила эволюции схем: BACKWARD, FORWARD, FULL совместимость и что каждая из них разрешает менять."
    difficulty: hard
    topics: [messaging]

  - id: q7
    text: "Контрактный тест консюмера Kafka проверяет, что обработчик корректно десериализует сообщения по текущей схеме. Что такой тест НЕ гарантирует?"
    type: single
    options:
      - id: a
        text: "Что обработчик правильно разбирает поля из тестового сообщения, сформированного по текущей схеме"
        correct: false
        explanation: "Это как раз то, что контрактный тест обязан гарантировать — базовую корректность десериализации по заявленной структуре."
      - id: b
        text: "Что при изменении схемы тест укажет, какие поля перестали разбираться корректно"
        correct: false
        explanation: "Обнаружение поломки десериализации при изменении схемы — прямое назначение такого теста."
      - id: c
        text: "Что обработчик не падает на валидном сообщении с обязательными полями"
        correct: false
        explanation: "Проверка отсутствия падения на валидных данных — базовая гарантия, которую контрактный тест как раз и должен давать."
      - id: d
        text: "Что реальный продюсер в проде публикует сообщения, соответствующие этой же схеме"
        correct: true
        explanation: "Контрактный тест на стороне консюмера проверяет обработку сообщений, соответствующих заявленной схеме — но не то, что реальный продюсер в проде действительно публикует именно такие сообщения. Расхождение схемы продюсера с ожиданиями консюмера тест не поймает, пока обе стороны не связаны общим источником схемы (Schema Registry) или сквозной проверкой в CI."
    explanation: "Контрактный тест консюмера работает с заранее подготовленными сообщениями по документированной схеме — это ловит регрессии в собственном коде десериализации, но никак не проверяет реальное поведение внешнего продюсера. Рассинхронизация продюсера и схемы обнаруживается только интеграционным тестированием со схемой из единого источника правды или проверкой совместимости на CI при публикации новой версии схемы."
    extended_explanation: "Именно для закрытия этого разрыва существуют инструменты вроде Schema Registry с проверкой совместимости при регистрации новой версии — они переносят контроль соответствия продюсера и потребителя с рантайма (где ошибка обходится дорого) на этап публикации схемы."
    recommendation: "Разобрать границы применимости consumer-driven contract testing применительно к событийным системам."
    difficulty: hard
    topics: [messaging, testing]

  - id: q8
    text: "Нужно перенести содержимое одного топика в другой с иной схемой сериализации (например, JSON → Avro). Какой подход обычно безопаснее прямой перезаписи топика на новую схему?"
    type: single
    options:
      - id: a
        text: "Создать новый топик с новой схемой, писать в оба параллельно, переключить консюмеров и вывести старый из эксплуатации"
        correct: true
        explanation: "Параллельная запись в старый и новый топик (dual write) даёт окно для постепенного переключения консюмеров без простоя."
      - id: b
        text: "Остановить продюсер, переключить его на новую схему и запустить заново без промежуточного периода параллельной работы"
        correct: false
        explanation: "Одномоментное переключение без параллельного периода означает, что все консюмеры должны быть готовы к новой схеме одновременно — это рискованнее постепенного перехода."
      - id: c
        text: "Изменить схему прямо в существующем топике без создания нового, применив её задним числом ко всем ранее записанным сообщениям"
        correct: false
        explanation: "Существующие в топике сообщения уже записаны по старой схеме — сменить формат сериализации для уже хранящихся данных без их перезаписи невозможно."
      - id: d
        text: "Увеличить число партиций старого топика перед миграцией схемы, чтобы новый формат распределился равномернее"
        correct: false
        explanation: "Число партиций топика не связано с миграцией схемы сериализации — эти операции решают разные задачи."
    explanation: "Смена схемы сериализации — потенциально ломающее изменение, затрагивающее сразу всех потребителей топика. Параллельная запись в новый топик с новой схемой позволяет мигрировать консюмеров по одному, проверяя каждого перед отключением от старого источника, и откатиться, если что-то пойдёт не так, не потеряв доступность."
