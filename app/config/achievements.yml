# Каталог ачивок. Метаданные живут здесь, условия выдачи — в
# AchievementsService: они слишком разные, чтобы описываться данными
# (серия по дням, улучшение результата). Синхронизируется в базу через
# rake achievements:sync, оттуда берутся стабильные id для user_achievements.
#
# group     — лесенка: ачивки одной группы показываются одной плиткой с текущей
#             ступенью. Порог ступени — threshold.
# threshold — порог, с которым сравнивается факт (AchievementFacts#value_for).
#             Есть и у одиночных ачивок со счётным условием — по нему же
#             рисуется прогресс в кабинете. Ачивки без порога бинарны:
#             speedrun, code_runner, comeback.
# shareable — видна ли ачивка другим пользователям в live-активности (#10).
#             false у тех, что раскрывают поведение, а не результат.
# color     — подложка иконки. Задаётся у группы целиком (одинаковый у всех её
#             ступеней) — цвет склеивает лесенку и различает группы между
#             собой, поэтому разнобой внутри одной группы был бы ошибкой.
# Подложка иконки: цвет на группу, а не на ачивку. Ступени одной лесенки
# красятся одинаково — так цвет склеивает их и различает группы между собой.
# singles — общий цвет для одиночных ачивок, у которых группы нет.
colors:
  tests_passed:   { bg: "#EEF0FE", fg: "#4F63F5" }
  correct_answers: { bg: "#FEF3E2", fg: "#D98A0B" }
  perfect:        { bg: "#FDF0F6", fg: "#D4498F" }
  level_basic:    { bg: "#E8F7EF", fg: "#10B981" }
  level_advanced: { bg: "#E6F4FD", fg: "#2A91D6" }
  level_expert:   { bg: "#FDEBEB", fg: "#E05252" }
  singles:        { bg: "#F1F0FB", fg: "#7C6BC9" }

