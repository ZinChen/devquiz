default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  database: devquiz_development

test:
  <<: *default
  # url задан явно, иначе DATABASE_URL из .env уводит тесты в dev-базу:
  # Rails отдаёт ему приоритет над database.yml в любом окружении.
  # TEST_DATABASE_URL выигрывает, когда задан (CI поднимает свой Postgres);
  # локально его нет, и адрес собирается из DB_*.
  url: <%= ENV["TEST_DATABASE_URL"].presence || "postgres://#{ENV['DB_USERNAME']}:#{ENV['DB_PASSWORD']}@#{ENV.fetch('DB_HOST') { 'localhost' }}:#{ENV.fetch('DB_PORT') { 5432 }}/devquiz_test" %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  # Пул = потоки веб-сервера + воркеры Action Cable. Действия канала
  # (ActivityChannel) и рассылка ходят в БД через тот же пул, а по умолчанию их
  # 4 против 3 потоков — при нагрузке они вытесняли бы запросы страниц и ждали
  # свободное соединение до таймаута. Пул — лишь верхняя граница: соединения
  # открываются по мере надобности, простаивающие ничего не стоят. На сервере
  # Postgres с max_connections=20 на два приложения (прод и стенд): при потоках
  # 3 и 2 и двух воркерах выходит максимум 5 + 4 соединений плюс по одному
  # слушателю Cable на процесс — с запасом.
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 2 } %>
