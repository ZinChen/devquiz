# Структура над плоским списком тегов из tests/*.yml.
#
# Теги в тестах — просто строки, все в одном поле. Здесь они разделены на два
# принципиально разных вида:
#
# categories — темы: то, что пользователь выбирает как интересное ему.
#              Показываются на экране выбора крупными плитками, их children —
#              мелкими на второй ступени.
# service    — не темы, а метаданные, сгруппированные по kind:
#                source — откуда взят тест (не характеристика содержания);
#                broad  — слишком общие, чтобы что-то фильтровать.
#              В выборе предпочтений не участвуют, но остаются в общем фильтре.
#              Уровня здесь нет намеренно: сложность живёт в колонке difficulty,
#              и yaml_sync:validate запрещает дублировать её тегом.
# unassigned — теги из тестов, ещё не разложенные по видам. Заполняется
#              задачей `rake tags:sync`; непустой список роняет spec, чтобы
#              новый тег нельзя было молча потерять.
#
# description есть у каждого тега — она показывается подсказкой при наведении
# на тег в фильтре и на экране выбора тем.

categories:
  ruby:
    title: Ruby / Rails
    description: Язык, фреймворк, ActiveRecord и всё вокруг них
    children:
