# Структура над плоским списком тегов из tests/*.yml.
#
# Теги в тестах — просто строки, все в одном поле. Здесь они разделены на два
# принципиально разных вида:
#
# categories — темы: то, что пользователь выбирает как интересное ему.
#              Показываются на экране выбора крупными плитками, их children —
#              мелкими на второй ступени.
# service    — не темы, а метаданные, сгруппированные по kind:
#                source — откуда взят тест (не характеристика содержания);
#                broad  — слишком общие, чтобы что-то фильтровать.
#              В выборе предпочтений не участвуют, но остаются в общем фильтре.
#              Уровня здесь нет намеренно: сложность живёт в колонке difficulty,
#              и yaml_sync:validate запрещает дублировать её тегом.
# unassigned — теги из тестов, ещё не разложенные по видам. Заполняется
#              задачей `rake tags:sync`; непустой список роняет spec, чтобы
#              новый тег нельзя было молча потерять.
#
# description есть у каждого тега — она показывается подсказкой при наведении
# на тег в фильтре и на экране выбора тем.

categories:
  ruby:
    title: Ruby / Rails
    description: Язык, фреймворк, ActiveRecord и всё вокруг них
    children:
      rails:        Роутинг, контроллеры, вьюхи и жизненный цикл запроса
      activerecord: Модели, запросы, коллбэки и работа с БД из Rails
      associations: Связи между моделями, polymorphic, STI, counter_cache
      migrations:   Изменение схемы, откаты и безопасные миграции
      patterns:     Сервисы, form-объекты и борьба с толстыми моделями
      architecture: Слои приложения, границы модулей и зависимости
      gems:         Гемы, экосистема и выбор библиотек
      runtime:      GVL, JIT, Ractor, Fiber, серверы приложений и реализации языка
  postgresql:
    title: PostgreSQL
    description: Запросы, индексы, блокировки и производительность БД
    children:
      sql:           Выборки, джойны, оконные функции и агрегации
      locking:       Блокировки строк и таблиц, дедлоки, уровни изоляции
      concurrency:   Гонки при параллельном доступе, advisory locks, версии
      zero-downtime: Изменение схемы больших таблиц без остановки сервиса
  devops:
    title: DevOps
    description: Контейнеры, Linux и инструменты поставки
    children:
      docker: Образы, слои, сети, volumes и оркестрация контейнеров
      linux:  Процессы, права, файловая система и диагностика
      git:    Ветки, слияния, ребейз и разбор конфликтов
  platform:
    title: Платформа и интеграция
    description: Событийная интеграция, оркестрация и эксплуатация в кластере
    children:
      kafka:      Топики, консюмеры, партиционирование, гарантии доставки
      kubernetes: Поды, пробы, автомасштабирование, ресурсы
      messaging:  Брокеры сообщений, event-driven паттерны, gRPC
  api:
    title: API
    description: Проектирование HTTP-интерфейсов и их безопасность
    children:
      web:      HTTP, кэширование, коды ответов и построение REST
      security: Аутентификация, авторизация и типовые уязвимости
  algorithms:
    title: Алгоритмы
    description: Структуры данных, сложность и принципы ООП
    children:
      oop: Наследование, полиморфизм, SOLID и проектирование классов
  go:
    title: Go
    description: Горутины, каналы и модель конкурентности
    children: {}
  ai-assisted-dev:
    title: AI в разработке
    description: Агенты, скиллы и практика работы с AI-инструментами в команде
    children:
      agents: Роли агентов, RAG, MCP и практика применения в команде
  math:
    title: Математика
    description: Статистика и вероятность для разработчика
    children:
      statistics: Распределения, выборки и проверка гипотез

service:
  source:
    hh:         Вопрос из собеседований, собранных на hh.ru
    claude-gen: Тест сгенерирован моделью Claude
    custom:     Тест из локальной папки tests_custom/, его нет в репозитории
  broad:
    backend:    Общие вопросы серверной разработки
    interview:  Типовые вопросы с собеседований
    code:       В тесте есть практическое задание с кодом
    self-check: Тест для самопроверки
    trivia:     Вопросы-факты без глубокого разбора
    acronyms:   Вопросы на расшифровку аббревиатур

unassigned: []
