# Live-активность (#10) — единственный потребитель Action Cable.
#
# В production — адаптер postgresql: он идёт в комплекте с Rails, использует
# LISTEN/NOTIFY уже имеющейся базы и не требует ни Redis, ни solid_cable с
# отдельной БД (на VDS с 2 ГБ RAM каждый лишний процесс на счету). Подходит и
# для нескольких воркеров Puma, если WEB_CONCURRENCY когда-нибудь вырастет.
#
# channel_prefix разный у prod и стенда не нужен: у них отдельные базы
# (devquiz_production и devquiz_dev), а NOTIFY не пересекает границы базы.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: postgresql
  channel_prefix: devquiz_production
