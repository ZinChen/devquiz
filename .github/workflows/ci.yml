name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'

  # Runs on every push: quiz content is data, and a malformed file is skipped
  # silently by YamlSyncService rather than failing loudly.
  validate-content:
    name: Validate quiz YAML
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - name: Validate YAML test files
        run: bundle exec rake yaml_sync:validate

  rubocop:
    name: Rubocop
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop --format github

  rspec:
    name: RSpec (models, services, requests)
    needs: [changes, rubocop]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devquiz_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost/devquiz_test

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Load DB schema
        run: bundle exec rails db:schema:load

      - name: Run RSpec (unit + requests)
        run: bundle exec rspec spec/models spec/services spec/requests

  e2e:
    name: E2E (system tests)
    # Runs even for content-only pushes: system specs drive real quizzes through
    # a browser, which is the only check that catches broken content end to end.
    # always() is required because rubocop is skipped on those pushes, and a
    # skipped dependency would otherwise skip this job too.
    needs: [changes, rubocop, validate-content]
    if: always() && needs.validate-content.result == 'success' && needs.rubocop.result != 'failure'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devquiz_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost/devquiz_test

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && sudo apt-get install -y google-chrome-stable

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Load DB schema
        run: bundle exec rails db:schema:load

      - name: Run system specs
        run: bundle exec rspec spec/system

  build:
    name: Build and push image
    # Content lives inside the image, so a quiz-only change still needs a build.
    # rspec is skipped on those pushes; require that nothing actually failed.
    needs: [rspec, e2e]
    if: |
      always() && github.event_name == 'push'
      && needs.e2e.result == 'success'
      && needs.rspec.result != 'failure'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      service: ${{ steps.meta.outputs.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest, consumed by the "app" service
      # dev  -> :dev,    consumed by the "app-dev" service
      # ghcr requires a lowercase image path; the owner is "ZinChen".
      - name: Compute image metadata
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest"   >> "$GITHUB_OUTPUT"
            echo "service=app"  >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev"          >> "$GITHUB_OUTPUT"
            echo "service=app-dev"  >> "$GITHUB_OUTPUT"
          fi
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      # Both stacks share one compose project, so only the service that changed
      # is pulled and recreated; the other keeps running untouched.
      #
      # Deploy config (compose.yaml, Caddyfile) is tracked in the repo and
      # refreshed from main only — a dev push must not reshape the production
      # stack, it only swaps the app-dev image.
      - name: Pull new image and restart the affected service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              git -C /opt/devquiz/repo fetch --quiet origin main
              git -C /opt/devquiz/repo reset --hard --quiet origin/main
            fi
            /opt/devquiz/dc pull ${{ needs.build.outputs.service }}
            /opt/devquiz/dc up -d ${{ needs.build.outputs.service }}
            docker image prune -f
